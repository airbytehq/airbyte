  <text x="292" y="461.45" text-anchor="start" font-size="11" font-weight="400" fill="#666680">Direct reads (live, read-only)</text>
  <path d="M555 458 H595" fill="none" stroke="#615EFC" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#purple)" />
  <text x="607" y="461.45" text-anchor="start" font-size="11" font-weight="400" fill="#666680">Indexing / search</text>
  <path d="M818 458 H858" fill="none" stroke="#E85D2A" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#orange)" />
  <text x="870" y="461.45" text-anchor="start" font-size="11" font-weight="400" fill="#666680">Backfill (optional)</text>
  <text x="600" y="483" text-anchor="middle" font-size="11" font-weight="400" fill="#666680">Read arrows show requests; results return to the AI agent through the Airbyte MCP.</text>
</svg>
