  <rect x="829.2" y="107.5" width="101.6" height="22" rx="4" fill="#fff" />
  <text x="890" y="118.75" text-anchor="middle" font-size="12" font-weight="500" fill="#615EFC">Direct reads</text>
  <rect x="490" y="338" width="220" height="64" rx="10" fill="#F2F3FF" stroke="#E0E2F5" stroke-width="1" />
