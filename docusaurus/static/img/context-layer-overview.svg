<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Context layer overview</title>
  <desc id="desc">Replication moves data from source through connectors and a connection to a destination. An AI agent uses the Airbyte MCP for read-only direct reads and search. Syncs feed an Airbyte-hosted search index; an optional backfill reads from the destination.</desc>
  <defs>
    <marker id="purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#615EFC" />
    </marker>
    <marker id="gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#A0A0B8" />
    </marker>
    <marker id="orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#E85D2A" />
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="498" rx="14" fill="#fff" stroke="#DDDFF2" />
  <rect x="24" y="142" width="1152" height="130" rx="14" fill="#F8F7FF" stroke="#E5E2F5" />
