  <path d="M1000 196 H1050" fill="none" stroke="#615EFC" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#purple)" />
  <rect x="50" y="178" width="140" height="64" rx="10" fill="#fff" stroke="#E0E2F5" stroke-width="1" />
