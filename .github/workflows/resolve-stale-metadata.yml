name: Resolve Stale Metadata

on:
  workflow_dispatch:
    inputs:
      gitref:
        description: "The git ref to check out from the repository"
        required: false
        type: string
  schedule:
    - cron: "0 */2 * * *" # Run every 2 hours

env:
  SENTRY_ENVIRONMENT: gitops-prod

permissions:
  contents: read

jobs:
  generate-connector-registries:
    permissions:
      contents: read
      id-token: write
    name: Generate Connector Registries
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/generate-connector-registries.yml
    secrets: inherit

  check-stale-metadata:
    permissions:
      contents: read
      id-token: write
    environment: connector-registry-read
    name: Check for Stale Metadata
    needs: [generate-connector-registries]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Airbyte
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.gitref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install Ops CLI
        continue-on-error: true
        run: uv --no-config tool install airbyte-internal-ops

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_REGISTRY_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_REGISTRY_READER_SERVICE_ACCOUNT }}

      - name: Check for unpublished connector versions
        continue-on-error: true
        shell: bash
        run: >
          airbyte-ops local connector list
          --repo-path "${{ github.workspace }}"
          --unpublished
          --store coral:prod
          --assert-none
