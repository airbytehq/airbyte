name: Docker Image Publishing (On-Demand)
on:
  workflow_dispatch:
    inputs:
      connector-type:
        description: "Connector Type"
        required: true
        default: "java"
        type: choice
        options:
          - "java"
          - "python"
      image-type:
        description: "Image Type (for now only 'base' is supported)"
        required: true
        default: "base"
        type: choice
        options:
          - "base"
      tag-or-version-number:
        description: "Tag or Version Number (without 'v' prefix)"
        required: true
        default: "dev-test"
      repository-root:
        description: "Repository Root, either GitHub (GHCR) or DockerHub. Use GHCR for testing."
        required: true
        default: "ghcr.io/airbytehq"
        type: choice
        options:
          - "docker.io/airbyte"
          - "ghcr.io/airbytehq"
      dry-run:
        description: "Dry Run (if true, no image will be pushed)"
        required: true
        type: boolean
        default: true
      require-security-check:
        description: "Abort if HIGH/CRITICAL security vulnerabilities are found."
        required: true
        type: boolean
        default: true

jobs:
  build-and-publish-base-image:
    name: Build and Publish ${{ github.event.inputs.connector-type }} Base Image
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.image-type == 'base' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    environment:
      name: ${{ github.event.inputs.repository-root == 'docker.io/airbyte' && 'hub.docker.com/r/airbyte' || github.event.inputs.repository-root }}
      url: https://${{ github.event.inputs.repository-root == 'docker.io/airbyte' && 'hub.docker.com/r/airbyte' || github.event.inputs.repository-root }}/${{ github.event.inputs.connector-type }}-connector-base
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Get Docker Hub OIDC token
        if: ${{ github.event.inputs.repository-root == 'docker.io/airbyte' }}
        id: docker-hub-oidc
        uses: docker/oidc-action@96ba694c64860c7209bcd1ede7d698c71564ef78 # v1.2.0
        with:
          connection-id: ${{ vars.DOCKER_HUB_OIDC_CONNECTOR_PUBLISHING_CONNECTION_ID }}
          expires-in: 21600

      - name: Log in to DockerHub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        if: ${{ github.event.inputs.repository-root == 'docker.io/airbyte' }}
        with:
          username: airbyte
          password: ${{ steps.docker-hub-oidc.outputs.token }}

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        if: ${{ github.event.inputs.repository-root == 'ghcr.io/airbytehq' }}
        with:
          registry: ghcr.io/airbytehq
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set and debug variables
        id: vars
        env:
          EVENT_INPUTS_CONNECTOR_TYPE: ${{ github.event.inputs.connector-type }}
          EVENT_INPUTS_REPOSITORY_ROOT: ${{ github.event.inputs.repository-root }}
          EVENT_INPUTS_TAG_OR_VERSION_NUMBER: ${{ github.event.inputs.tag-or-version-number }}
          EVENT_INPUTS_DRY_RUN: ${{ github.event.inputs.dry-run }}
          EVENT_INPUTS_REQUIRE_SECURITY_CHECK: ${{ github.event.inputs.require-security-check }}
        run: |
          DOCKERFILE=docker-images/Dockerfile.${EVENT_INPUTS_CONNECTOR_TYPE}-connector-base
          IMAGE_NAME=${EVENT_INPUTS_CONNECTOR_TYPE}-connector-base
          FULL_IMAGE_REF=${EVENT_INPUTS_REPOSITORY_ROOT}/${IMAGE_NAME}:${EVENT_INPUTS_TAG_OR_VERSION_NUMBER}
          echo "DOCKERFILE=${DOCKERFILE}" | tee -a "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=${IMAGE_NAME}" | tee -a "$GITHUB_OUTPUT"
          echo "FULL_IMAGE_REF=${FULL_IMAGE_REF}" | tee -a "$GITHUB_OUTPUT"
          # Echo other input variables for debugging and logging purposes
          echo "dry-run=${EVENT_INPUTS_DRY_RUN}"
          echo "require-security-check=${EVENT_INPUTS_REQUIRE_SECURITY_CHECK}"

      - name: Build Base Image
        id: docker-build-base
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          file: ${{ steps.vars.outputs.DOCKERFILE }}
          tags: ${{ steps.vars.outputs.FULL_IMAGE_REF }}
          push: false
          load: true
          # Note: Docker does not support loading multi-arch images out of the box, so we are building just the local arch here to use for testing in subsequent CI steps.
          # When publishing, we build and push a multi-arch image

      - name: Run Vulnerability Scan
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          image: "${{ steps.vars.outputs.FULL_IMAGE_REF }}"
          output-format: "table"
          severity-cutoff: high
          fail-build: ${{ github.event.inputs.require-security-check }}

      - name: Publish Base Image
        # Note: By design, this should reuse the cache from above, without
        # rebuilding the image.
        # https://docs.docker.com/build/ci/github-actions/test-before-push/
        id: docker-image-publish
        if: ${{ github.event.inputs.dry-run == 'false' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          platforms: linux/amd64,linux/arm64
          file: ${{ steps.vars.outputs.DOCKERFILE }}
          tags: ${{ steps.vars.outputs.FULL_IMAGE_REF }}
          push: true
