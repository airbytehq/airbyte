# Mirrors the OSS intake state of community issues and PRs onto the intake project board.
#
# The intake playbooks (`oss_contribution_intake`, `oss_issue_triage` step 0 in airbytehq/ai-skills)
# record their decision as one `intake/*` label; `ai-intake-command.yml` sets `intake/screen-hold` on
# items its injection screen held for a person to check. This workflow adds the labelled item to the
# project and sets its Status from that label, so the AI session never needs a project token and a
# label changed by hand moves the card too. Closing an item sets Status "Closed" (or "Done").
#
# Status options are matched to labels by name, ignoring case and punctuation: `intake/needs-information`
# matches "Needs information" or "needs-information". A missing option fails the run and lists the
# options the project has. An open item whose last `intake/*` label is removed, with none added within a
# minute, has its Status cleared (the card stays on the board).
#
# No PR code is checked out or run; the job only calls the GitHub API. The Octavia Bot app must have
# org-level Projects: write permission (the same one `community-api-source-pr-board.yml` uses).

name: Intake project sync

on:
  issues:
    types: [labeled, unlabeled, closed, reopened]
  # Fork PRs only get secrets under pull_request_target; nothing from the PR is checked out or run.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [labeled, unlabeled, closed, reopened]
  workflow_dispatch:
    inputs:
      number:
        description: "Issue or PR number to sync"
        required: true
        type: string
      dry_run:
        description: "Log-only mode: report the change without writing to the project"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync intake state to project
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        startsWith(github.event.label.name, 'intake/')) ||
      ((github.event.action == 'closed' || github.event.action == 'reopened') &&
        (contains(toJSON(github.event.issue.labels.*.name), '"intake/') ||
          contains(toJSON(github.event.pull_request.labels.*.name), '"intake/')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate as Octavia Bot
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          owner: airbytehq
          repositories: "airbyte"
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}
          permission-issues: read
          permission-pull-requests: read
          permission-organization-projects: write

      - name: Set project Status from the intake label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ITEM_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          script: |
            const projectNumber = 171;
            const dryRun = process.env.DRY_RUN === 'true';
            const number = Number(process.env.ITEM_NUMBER);
            if (!Number.isSafeInteger(number) || number <= 0) {
              throw new Error(`Not an issue or PR number: "${process.env.ITEM_NUMBER}".`);
            }
            const normalize = (name) => name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

            // Live state, not the event payload: a label swap fires two events, and both should
            // see the final labels.
            const liveItem = async () => {
              const { data } = await github.rest.issues.get({ ...context.repo, issue_number: number });
              const labels = data.labels
                .map((label) => (typeof label === 'string' ? label : label.name))
                .filter((name) => name.startsWith('intake/'));
              return { item: data, intakeLabels: labels };
            };
            let { item, intakeLabels } = await liveItem();

            let wanted;
            if (item.state === 'closed') {
              if (!intakeLabels.length) {
                core.info(`#${number} is closed and has no intake/* label; nothing to sync.`);
                return;
              }
              wanted = ['closed', 'done'];
            } else if (intakeLabels.length === 1) {
              wanted = [normalize(intakeLabels[0].slice('intake/'.length))];
            } else if (!intakeLabels.length) {
              // A re-run removes every intake/* label before adding the new one, so wait before
              // clearing: if a label comes back, its own `labeled` run sets the Status.
              await new Promise((resolve) => setTimeout(resolve, 60000));
              ({ item, intakeLabels } = await liveItem());
              if (intakeLabels.length || item.state === 'closed') {
                core.info(`#${number} changed while waiting; its own run syncs it.`);
                return;
              }
              wanted = null;
            } else {
              core.warning(`#${number} has several intake/* labels (${intakeLabels.join(', ')}); skipping.`);
              return;
            }

            const { organization } = await github.graphql(
              `query($login: String!, $number: Int!) {
                organization(login: $login) {
                  projectV2(number: $number) {
                    id
                    title
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }`,
              { login: context.repo.owner, number: projectNumber },
            );
            const project = organization?.projectV2;
            if (!project) {
              throw new Error(
                `Project ${projectNumber} was not found, or the app token lacks org-level Projects read/write permission.`,
              );
            }
            if (!project.field?.id) {
              throw new Error(`Project "${project.title}" has no Status single-select field.`);
            }
            const kind = item.pull_request ? 'PR' : 'issue';
            if (wanted === null) {
              // The label was removed and nothing replaced it: clear the Status so the card doesn't
              // show a state the item has left. An item not on the project is left off it.
              const { node } = await github.graphql(
                `query($id: ID!) {
                  node(id: $id) {
                    ... on Issue { projectItems(first: 50) { nodes { id project { id } } } }
                    ... on PullRequest { projectItems(first: 50) { nodes { id project { id } } } }
                  }
                }`,
                { id: item.node_id },
              );
              const card = node?.projectItems?.nodes.find((candidate) => candidate.project.id === project.id);
              if (!card) {
                core.info(`#${number} has no intake/* label and no card on "${project.title}"; nothing to sync.`);
                return;
              }
              if (dryRun) {
                core.notice(`Dry run: would clear the Status of ${kind} #${number} on "${project.title}".`);
                return;
              }
              await github.graphql(
                `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!) {
                  clearProjectV2ItemFieldValue(input: { projectId: $projectId, itemId: $itemId, fieldId: $fieldId }) {
                    projectV2Item { id }
                  }
                }`,
                { projectId: project.id, itemId: card.id, fieldId: project.field.id },
              );
              core.notice(`Cleared the Status of ${kind} #${number} on "${project.title}": it has no intake/* label.`);
              return;
            }

            const option = project.field.options.find((candidate) => wanted.includes(normalize(candidate.name)));
            if (!option) {
              throw new Error(
                `Project "${project.title}" has no Status option for "${wanted.join('" or "')}". ` +
                  `Options: ${project.field.options.map((candidate) => `"${candidate.name}"`).join(', ')}.`,
              );
            }

            if (dryRun) {
              core.notice(`Dry run: would set ${kind} #${number} to Status "${option.name}" on "${project.title}".`);
              return;
            }

            // addProjectV2ItemById returns the existing item when the content is already on the project.
            const added = await github.graphql(
              `mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
              }`,
              { projectId: project.id, contentId: item.node_id },
            );
            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }`,
              {
                projectId: project.id,
                itemId: added.addProjectV2ItemById.item.id,
                fieldId: project.field.id,
                optionId: option.id,
              },
            );
            core.notice(`Set ${kind} #${number} to Status "${option.name}" on "${project.title}".`);
