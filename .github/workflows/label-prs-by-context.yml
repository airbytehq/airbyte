# Runs internal automation for pull requests

name: "Auto-Label PRs"
on:
  pull_request_target:
    types: [opened, labeled, unlabeled, ready_for_review, synchronize, reopened]

permissions:
  contents: read

jobs:
  shared-pr-labeller:
    name: "Add Labels to PRs.  Safe to Merge on fail"
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Get Octo STS token for airbyte
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: airbytehq/airbyte
          identity: label-prs-by-context

      - name: Get Octo STS token for workflow-actions
        id: octo-sts-workflow-actions
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: airbytehq/workflow-actions
          identity: airbyte-label-prs-by-context

      - name: Check out workflow-actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airbytehq/workflow-actions
          ref: 822588f078efcbc84601fff7f56a9ce8658f7c99
          token: ${{ steps.octo-sts-workflow-actions.outputs.token }}
          path: .workflow-actions
          persist-credentials: false

      - name: Label PR
        uses: ./.workflow-actions
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          command: "pull"
