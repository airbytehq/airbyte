name: "Hydra: Stage Handoff"
# Event-driven handoff between Hydra pipeline stages.
#
# Event-driven handoffs are opt-in per PR via the `hyd-chain` label, applied
# when a human runs `!daily_hands_free_triage for <issue|PR>` or adds the
# label manually. A one-off `/ai-prove-fix`, `/ai-review`, `/ai-ready`, or
# `/ai-resolve-conflicts` comment from an engineer does NOT opt the PR in.
# A Devin `/ai-fix` PR also inherits the label from a `Resolves`-linked
# oncall issue that carries `hyd-chain`, on its first green CI. To stop
# the chain on a PR, remove the label or add `hyd-pause`.
#
# When `/ai-prove-fix` or `/ai-review` posts its result marker on a PR, or when
# a PR's Connector CI run finishes green (covers new `/ai-fix` PRs, pushes
# including `/ai-resolve-conflicts`, and re-prove/re-review after commits),
# this workflow launches the existing `daily_hands_free_triage` playbook
# (airbytehq/ai-skills) scoped to that single PR. The playbook re-reads the
# PR's current state, applies its normal decision tree, and triggers the next
# stage if the PR is ready -- the same logic the 5am UTC sweep uses, minus the
# up-to-24h wait. The launched session is single-pass (no in-session reminder
# loop) because the next event re-triggers this workflow. The daily sweep
# remains the catch-all for anything this misses.
#
# Set the repository variable HYDRA_HANDOFF_DRY_RUN=true to have the launched
# session only report what it WOULD do.

on:
  issue_comment:
    types: [created]
  # workflow_run (not check_suite): check_suite never fires for
  # Actions-created suites. `pull_requests` on workflow_run is only populated
  # for same-repo branches, so forks never reach this job.
  workflow_run:
    workflows: ["Connector CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to run a single-PR handoff pass on"
        required: true
        type: string
      dry-run:
        description: "If 'true', the session reports what it would do without triggering anything"
        required: false
        type: boolean
        default: true

run-name: "Hydra stage handoff for PR #${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}"

# GITHUB_TOKEN is unused: all writes go through the Octavia app token.
permissions: {}

concurrency:
  # cancel-in-progress is deliberately false: cancelling a run after the Devin
  # API call would leave a live session behind.
  group: hydra-stage-handoff-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
  cancel-in-progress: false

jobs:
  handoff:
    name: Launch single-PR hands-free pass
    # Only react to result markers posted by our bots on PRs, a green Connector
    # CI run on a PR, or manual dispatch.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.pull_requests[0] != null
      ) ||
      (
        github.event.issue.pull_request &&
        (github.event.comment.user.login == 'devin-ai-integration[bot]' || github.event.comment.user.login == 'airbyte-support-bot') &&
        (contains(github.event.comment.body, '<!-- prove_fix_result:') || contains(github.event.comment.body, '<!-- pr_ai_review_result:'))
      )
    runs-on: ubuntu-latest
    steps:
      # ---------- Resolve trigger ----------
      - name: Parse result marker
        id: marker
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_INPUT: ${{ inputs.pr }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          WR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "pr=$WR_PR_NUMBER" | tee -a "$GITHUB_OUTPUT"
            echo "stage=ci" | tee -a "$GITHUB_OUTPUT"
            echo "result=$WR_CONCLUSION" | tee -a "$GITHUB_OUTPUT"
            echo "head_sha=$WR_HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "pr=$PR_INPUT" | tee -a "$GITHUB_OUTPUT"
            echo "stage=manual" | tee -a "$GITHUB_OUTPUT"
            echo "result=" | tee -a "$GITHUB_OUTPUT"
            echo "head_sha=" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # Format: <!-- {stage}_result: {RESULT}; head_sha: {sha} -->
          MARKER=$(printf '%s' "$COMMENT_BODY" | grep -oP '<!-- \K(prove_fix|pr_ai_review)_result: [^>]+(?= -->)' | head -n1 || true)
          STAGE=$(printf '%s' "$MARKER" | grep -oP '^[a-z_]+(?=_result:)' || true)
          RESULT=$(printf '%s' "$MARKER" | grep -oP '_result: \K[A-Z_]+' || true)
          HEAD_SHA=$(printf '%s' "$MARKER" | grep -oP 'head_sha: \K[a-f0-9]+' || true)
          echo "pr=$ISSUE_NUMBER" | tee -a "$GITHUB_OUTPUT"
          echo "stage=$STAGE" | tee -a "$GITHUB_OUTPUT"
          echo "result=$RESULT" | tee -a "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Authenticate as GitHub App
        uses: actions/create-github-app-token@v3.0.0
        id: get-app-token
        with:
          owner: "airbytehq"
          repositories: "airbyte,oncall"
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      # ---------- Cheap deterministic guards ----------
      # Anything needing judgment is left to the playbook; these only avoid
      # spending a Devin session on PRs the pipeline would never touch.
      - name: Check PR eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          PR_NUMBER: ${{ steps.marker.outputs.pr }}
          MARKER_HEAD_SHA: ${{ steps.marker.outputs.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          VAR_DRY_RUN: ${{ vars.HYDRA_HANDOFF_DRY_RUN }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,isCrossRepository,headRefOid,labels,author,isDraft,statusCheckRollup,body)
          STATE=$(jq -r '.state' <<<"$PR_JSON")
          IS_FORK=$(jq -r '.isCrossRepository' <<<"$PR_JSON")
          HEAD=$(jq -r '.headRefOid' <<<"$PR_JSON")
          LABELS=$(jq -r '[.labels[].name] | join(",")' <<<"$PR_JSON")
          echo "state=$STATE fork=$IS_FORK head=$HEAD labels=$LABELS"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

          SKIP=""
          [[ "$STATE" != "OPEN" ]] && SKIP="PR is $STATE"
          [[ -z "$SKIP" && "$IS_FORK" == "true" ]] && SKIP="community (fork) PR"
          [[ -z "$SKIP" && ",$LABELS," == *",community,"* ]] && SKIP="community label"
          [[ -z "$SKIP" && ",$LABELS," == *",hyd-pause,"* ]] && SKIP="hyd-pause label"

          # A Devin-authored /ai-fix PR inherits hyd-chain from a
          # Resolves-linked oncall issue that already carries it
          # (workflow_run only).
          if [[ -z "$SKIP" && "$EVENT_NAME" == "workflow_run" && ",$LABELS," != *",hyd-chain,"* ]]; then
            AUTHOR=$(jq -r '.author.login' <<<"$PR_JSON")
            if [[ "$AUTHOR" == "app/devin-ai-integration" || "$AUTHOR" == "devin-ai-integration" || "$AUTHOR" == "devin-ai-integration[bot]" ]]; then
              BODY=$(jq -r '.body' <<<"$PR_JSON")
              while IFS= read -r N; do
                [[ -z "$N" ]] && continue
                ISSUE_LABELS=$(gh issue view "$N" --repo airbytehq/oncall --json labels -q '[.labels[].name]|join(",")' || true)
                if [[ ",$ISSUE_LABELS," == *",hyd-chain,"* ]]; then
                  if [[ "$VAR_DRY_RUN" == "true" ]]; then
                    echo "WOULD inherit hyd-chain from oncall issue #$N"
                  else
                    gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label hyd-chain
                  fi
                  LABELS="${LABELS},hyd-chain"
                  echo "::notice::PR #$PR_NUMBER inherited hyd-chain from oncall issue #$N"
                  echo "- Inherited: PR #$PR_NUMBER got \`hyd-chain\` from oncall issue #$N" >> "$GITHUB_STEP_SUMMARY"
                  break
                fi
              done < <(printf '%s' "$BODY" | grep -oE 'Resolves https://github.com/airbytehq/oncall/issues/[0-9]+' | grep -oE '[0-9]+$' | sort -u)
            fi
          fi

          [[ -z "$SKIP" && "$EVENT_NAME" != "workflow_dispatch" && ",$LABELS," != *",hyd-chain,"* ]] && SKIP="PR not opted in (no hyd-chain label)"
          [[ -z "$SKIP" && -n "$MARKER_HEAD_SHA" && "$HEAD" != "$MARKER_HEAD_SHA"* ]] && SKIP="result is for stale head $MARKER_HEAD_SHA (current $HEAD)"

          # CI-completion trigger: skip when other checks already failed. No
          # "still running" check -- pending StatusContexts (e.g. CodeRabbit,
          # Vercel) can finish last with no Actions event and would strand the
          # push; the playbook re-reads CI anyway.
          if [[ -z "$SKIP" && "$EVENT_NAME" == "workflow_run" ]]; then
            FAILING=$(jq -r '[.statusCheckRollup[] | select(.__typename=="CheckRun" and (.conclusion=="FAILURE" or .conclusion=="TIMED_OUT" or .conclusion=="CANCELLED" or .conclusion=="ACTION_REQUIRED"))] + [.statusCheckRollup[] | select(.__typename=="StatusContext" and (.state=="FAILURE" or .state=="ERROR"))] | length' <<<"$PR_JSON")
            [[ "$FAILING" != "0" ]] && SKIP="CI failing"
          fi

          if [[ -n "$SKIP" ]]; then
            echo "::notice::Skipping handoff: $SKIP"
            echo "eligible=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "eligible=true" | tee -a "$GITHUB_OUTPUT"
          fi

      # ---------- Idempotency guard ----------
      # Post a unique marker comment before launching so a retriggered event
      # for the same stage/result/head doesn't spawn a second session. The
      # comment doubles as the start comment; its `<!-- hydra_handoff:` key
      # never matches the job `if` (which looks for `_result:` markers), so it
      # cannot retrigger this workflow.
      - name: Idempotency guard
        id: guard
        if: steps.eligibility.outputs.eligible == 'true' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          PR_NUMBER: ${{ steps.marker.outputs.pr }}
          STAGE: ${{ steps.marker.outputs.stage }}
          RESULT: ${{ steps.marker.outputs.result }}
          HEAD: ${{ steps.eligibility.outputs.head }}
          VAR_DRY_RUN: ${{ vars.HYDRA_HANDOFF_DRY_RUN }}
        run: |
          set -euo pipefail
          KEY="<!-- hydra_handoff: stage=${STAGE}; result=${RESULT}; head_sha=${HEAD} -->"
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate -q '.[].body' | grep -cF "$KEY" || true)
          if [[ "$EXISTING" != "0" ]]; then
            echo "::notice::Skipping handoff: already launched for this key"
            echo "launch=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY="${KEY}
          ↪️ Hydra stage handoff: launching a scoped hands-free pass (trigger: \`${STAGE}\` → \`${RESULT}\`, head \`${HEAD}\`). [Workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          COMMENT_ID=""
          if [[ "$VAR_DRY_RUN" == "true" ]]; then
            echo "WOULD post handoff guard comment on PR #$PR_NUMBER"
          else
            COMMENT_ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY" -q .id)
          fi
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "launch=true" | tee -a "$GITHUB_OUTPUT"

      - name: Resolve dry-run mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
          VAR_DRY_RUN: ${{ vars.HYDRA_HANDOFF_DRY_RUN }}
        run: |
          set -euo pipefail
          DRY_RUN="false"
          [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_DRY_RUN" == "true" ]] && DRY_RUN="true"
          [[ "$EVENT_NAME" != "workflow_dispatch" && "$VAR_DRY_RUN" == "true" ]] && DRY_RUN="true"
          echo "dry_run=$DRY_RUN" | tee -a "$GITHUB_OUTPUT"

      # ---------- Launch the scoped hands-free session ----------
      - name: Launch hands-free triage for this PR
        if: steps.eligibility.outputs.eligible == 'true' && steps.guard.outputs.launch != 'false'
        id: devin
        uses: aaronsteers/devin-action@main
        with:
          devin-token: ${{ secrets.DEVIN_AI_API_KEY }}
          github-token: ${{ steps.get-app-token.outputs.token }}
          api-version: v3
          org-id: ${{ vars.DEVIN_AI_ORG_ID }}
          max-acu-limit: "3"
          playbook-macro: "!daily_hands_free_triage"
          tags: |
            ai-oncall
            hydra-stage-handoff
          prompt-text: |
            SINGLE-ITEM HANDOFF MODE (see "Single-Item Handoff Mode" in the playbook).

            Trigger: `${{ steps.marker.outputs.stage }}` posted result `${{ steps.marker.outputs.result }}` for head `${{ steps.marker.outputs.head_sha }}` on
            https://github.com/${{ github.repository }}/pull/${{ steps.marker.outputs.pr }}
            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Process ONLY that PR. Skip Phase 1 and the Phase 2 collection queries entirely.
            Re-read the PR's current state, apply the §2.5 decision tree, and take the single
            next action if it is ready to advance (or no action if it is not). Do NOT run the
            follow-up loop — this is a single pass (1 iteration). The next stage's result will
            re-trigger this workflow. Do not post the
            Phase 3 summary to #hands-free-ai-triage; per-item status via send_to_user is enough.
            ${{ steps.mode.outputs.dry_run == 'true' && 'DRY RUN MODE: state what you WOULD do, take no action.' || '' }}

      # The guard comment must not survive a failed launch: it would suppress
      # the next retry. Delete it so a re-run can relaunch.
      - name: Clean up guard comment on failed launch
        if: failure() && steps.guard.outputs.comment_id != ''
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          COMMENT_ID: ${{ steps.guard.outputs.comment_id }}
          PR_NUMBER: ${{ steps.marker.outputs.pr }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID"
          echo "::warning::Removed guard comment $COMMENT_ID on PR #$PR_NUMBER after failed launch so a re-run can relaunch"

      - name: Summarize
        if: always()
        env:
          ELIGIBLE: ${{ steps.eligibility.outputs.eligible }}
          LAUNCHED: ${{ steps.guard.outputs.launch }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          SESSION_URL: ${{ steps.devin.outputs.session-url }}
          PR_NUMBER: ${{ steps.marker.outputs.pr }}
          STAGE: ${{ steps.marker.outputs.stage }}
          RESULT: ${{ steps.marker.outputs.result }}
        run: |
          {
            echo "## Hydra stage handoff"
            echo "- PR: #${PR_NUMBER}"
            echo "- Trigger: \`${STAGE}\` → \`${RESULT:-n/a}\`"
            echo "- Eligible: ${ELIGIBLE}"
            echo "- Launched: ${LAUNCHED:-n/a}"
            echo "- Dry run: ${DRY_RUN}"
            [[ -n "$SESSION_URL" ]] && echo "- Session: ${SESSION_URL}"
            true
          } | tee -a "$GITHUB_STEP_SUMMARY"
