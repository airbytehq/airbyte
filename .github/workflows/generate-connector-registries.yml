name: Generate Connector Registries

on:
  workflow_dispatch:
    inputs:
      gitref:
        description: "The git ref to check out from the repository"
        required: false
        type: string
      force:
        description: "Force resync of all latest/ directories even if version markers are current. Useful when metadata changes without a version bump."
        required: false
        type: boolean
        default: false
      connector-name:
        description: "A connector name to limit the latest/ resync scope (e.g. 'source-faker'). Leave empty to compile all connectors."
        required: false
        type: string
      store:
        description: "Registry store to compile."
        required: false
        type: string
        default: "coral:prod"
      pr:
        description: "Associated pull request number, for linking in notifications."
        required: false
        type: string
      dry-run:
        description: "Compile a local rehearsal and compare it with the reference store without writing the store."
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      pr:
        description: "Associated pull request number, for linking in notifications."
        required: false
        type: string
      force:
        description: "Force resync of latest/ directories even if version markers are current. Useful when metadata changes without a version bump."
        required: false
        type: boolean
        default: false
      connector-name:
        description: "A connector name to limit the latest/ resync scope (e.g. 'source-faker'). Leave empty to compile all connectors."
        required: false
        type: string
      store:
        description: "Registry store to compile."
        required: false
        type: string
        default: "coral:prod"
      dry-run:
        description: "Compile a local rehearsal and compare it with the reference store without writing the store."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Only allow one active run, and one pending run.
  # This prevents race conditions between multiple runs of this workflow.
  group: ${{ inputs.dry-run == true && 'generate-connector-registry-dry-run' || 'generate-connector-registry' }}
  # If a new run is triggered while there's already one in-progress,
  # allow the in-progress run to finish.
  cancel-in-progress: false

jobs:
  registry-compile:
    name: Compile Registry
    if: inputs.dry-run != true
    runs-on: ubuntu-24.04
    env:
      REGISTRY_STORE: ${{ inputs.store || 'coral:prod' }}

    steps:
      - name: Checkout Airbyte
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.gitref || github.ref }}
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install Ops CLI
        run: uv tool install airbyte-internal-ops

      - name: Compile Registries
        id: registry-compile
        env:
          GCS_CREDENTIALS: ${{ secrets.METADATA_SERVICE_PROD_GCS_CREDENTIALS }}
          FORCE_FLAG: ${{ inputs.force == true && '--force' || '' }}
          CONNECTOR_NAME_FLAG: ${{ inputs.connector-name && format('--connector-name {0}', inputs.connector-name) || '' }}
        shell: bash
        run: >
          airbyte-ops registry store compile
          --store "${REGISTRY_STORE}"
          --with-secrets-mask
          --with-legacy-migration v1
          ${FORCE_FLAG}
          ${CONNECTOR_NAME_FLAG}

      - name: Build notification context
        id: notification-context
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_NUMBER="${{ inputs.pr }}"
          CONNECTOR_NAME="${{ inputs.connector-name }}"
          REGISTRY_STORE="${{ inputs.store || 'coral:prod' }}"
          FORCE="${{ inputs.force }}"

          if [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "0" ]]; then
            RUN_URL="${RUN_URL}?pr=${PR_NUMBER}"
            echo "pr-text=\nPR: <${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}|#${PR_NUMBER}>" >> $GITHUB_OUTPUT
          else
            echo "pr-text=" >> $GITHUB_OUTPUT
          fi

          DETAILS=""
          DETAILS="${DETAILS}\nStore: \`${REGISTRY_STORE}\`"
          if [[ -n "$CONNECTOR_NAME" ]]; then
            DETAILS="${DETAILS}\nConnector: \`${CONNECTOR_NAME}\`"
          fi
          if [[ "$FORCE" == "true" ]]; then
            DETAILS="${DETAILS}\nForce: true"
          fi
          echo "details-text=${DETAILS}" >> $GITHUB_OUTPUT

          echo "run-url=${RUN_URL}" >> $GITHUB_OUTPUT

      - name: Notify Slack on Registry Compile Success
        if: steps.registry-compile.outcome == 'success'
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "channel": "#connector-publish-updates",
              "username": "Connectors CI/CD Bot",
              "text": "☑️ *Registry Compile SUCCESS*${{ steps.notification-context.outputs.details-text }}${{ steps.notification-context.outputs.pr-text }}\nReference: <https://connectors.airbyte.com/files/registries/v0/cloud_registry.json|Cloud Registry> · <https://connectors.airbyte.com/files/registries/v0/oss_registry.json|OSS Registry> · <https://console.cloud.google.com/storage/browser/prod-airbyte-cloud-connector-metadata-service/registries/v0|GCS Bucket> · <${{ steps.notification-context.outputs.run-url }}|CI Logs>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.PUBLISH_ON_MERGE_SLACK_WEBHOOK }}

      - name: Notify Slack on Registry Compile Failure
        if: always() && steps.registry-compile.outcome == 'failure'
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "channel": "#connector-publish-updates",
              "username": "Connectors CI/CD Bot",
              "text": "❌ *Registry Compile FAILED*${{ steps.notification-context.outputs.details-text }}\n<${{ steps.notification-context.outputs.run-url }}|View workflow run>${{ steps.notification-context.outputs.pr-text }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.PUBLISH_ON_MERGE_SLACK_WEBHOOK }}

  registry-compile-dryrun:
    name: Compile Registry (Dry-Run)
    if: inputs.dry-run == true
    runs-on: ubuntu-24.04
    env:
      REGISTRY_STORE: ${{ inputs.store || 'coral:prod' }}
      REGISTRY_BUCKET: prod-airbyte-cloud-connector-metadata-service

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install Ops CLI
        # The minimum version is gated on the airbyte-ops-mcp PR 1264 release.
        run: uv tool install "airbyte-internal-ops>=0.99.0"

      - name: Resolve Variables
        id: resolve-vars
        shell: bash
        run: |
          echo "REHEARSAL_DIR=$RUNNER_TEMP/registry-rehearsal" | tee -a "$GITHUB_ENV"
          echo "REPORT_DIR=$RUNNER_TEMP/registry-rehearsal-reports" | tee -a "$GITHUB_ENV"

      - name: Compile Registry Rehearsal
        id: compile-rehearsal
        env:
          # This credential is read/write; the Ops CLI enforces the source-store read-only guarantee.
          GCS_CREDENTIALS: ${{ secrets.METADATA_SERVICE_PROD_GCS_CREDENTIALS }}
          FORCE_FLAG: ${{ inputs.force == true && '--force' || '' }}
          CONNECTOR_NAME_FLAG: ${{ inputs.connector-name && format('--connector-name {0}', inputs.connector-name) || '' }}
        shell: bash
        run: >
          airbyte-ops registry store compile
          --store "${REGISTRY_STORE}"
          --output-store "file:${REHEARSAL_DIR}"
          --with-secrets-mask
          ${FORCE_FLAG}
          ${CONNECTOR_NAME_FLAG}

      - name: Prepare Registry Rehearsal Reports
        if: always()
        run: mkdir -p "${REPORT_DIR}/prod-snapshot"

      - name: Authenticate to Google Cloud
        id: authenticate-gcloud
        if: always()
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.METADATA_SERVICE_PROD_GCS_CREDENTIALS }}

      - name: Set up Google Cloud CLI
        if: always()
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Download Cloud Registry Snapshot
        if: always()
        run: >
          gcloud storage cp
          "gs://${REGISTRY_BUCKET}/registries/v0/cloud_registry.json"
          "${REPORT_DIR}/prod-snapshot/cloud_registry.json"

      - name: Download OSS Registry Snapshot
        if: always()
        run: >
          gcloud storage cp
          "gs://${REGISTRY_BUCKET}/registries/v0/oss_registry.json"
          "${REPORT_DIR}/prod-snapshot/oss_registry.json"

      - name: Download Composite Registry Snapshot
        if: always()
        run: >
          gcloud storage cp
          "gs://${REGISTRY_BUCKET}/registries/v0/composite_registry.json"
          "${REPORT_DIR}/prod-snapshot/composite_registry.json"

      - name: Compare Registry Rehearsal
        if: >
          steps.compile-rehearsal.outcome == 'success' &&
          steps.authenticate-gcloud.outcome == 'success'
        env:
          GCS_CREDENTIALS: ${{ secrets.METADATA_SERVICE_PROD_GCS_CREDENTIALS }}
        shell: bash
        run: >
          airbyte-ops registry store compare
          --assert-stable
          --html-report "${REPORT_DIR}/report.html"
          --text-report "${REPORT_DIR}/report.txt"
          "file:${REHEARSAL_DIR}"
          "${REGISTRY_STORE}"

      - name: Upload Recompiled Registry Indexes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-rehearsal-recompiled
          path: ${{ env.REHEARSAL_DIR }}/registries/v0/*.json
          if-no-files-found: ignore

      - name: Upload Production Registry Snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-rehearsal-production-snapshot
          path: ${{ env.REPORT_DIR }}/prod-snapshot/*.json
          if-no-files-found: ignore

      - name: Upload Registry Rehearsal Text Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-rehearsal-report.txt
          path: ${{ env.REPORT_DIR }}/report.txt
          archive: false
          if-no-files-found: ignore

      - name: Upload Registry Rehearsal HTML Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-rehearsal-report.html
          path: ${{ env.REPORT_DIR }}/report.html
          archive: false
          if-no-files-found: ignore
