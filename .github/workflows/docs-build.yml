# This workflow builds the documentation for the project using `poe` and `uv`.
# It is redundant with the Vercel Preview deployment, but is runs unprivileged and
# can be used on forks to verify the documentation build without deploying it.
name: Docs
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  detect-changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-24.04
    steps:
      # Checkout not required from `pull_request` event.
      # The detection method uses the GitHub REST API.
      - name: Detect Changes
        id: detect-changes
        uses: dorny/paths-filter@v4.0.1
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'docusaurus/**'
              - '.markdownlint.jsonc'

      # The merge commit's first parent is the base branch tip, so `HEAD^1` diffs
      # exactly the PR's changes.
      - name: Checkout Merge Commit
        if: steps.detect-changes.outputs.docs == 'true'
        continue-on-error: true
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      # If this step fails (e.g. the merge commit can't be checked out), the output
      # stays empty and the Vercel preview runs as usual.
      - name: Check For Changelog-Only Docs Changes
        id: changelog-only
        if: steps.detect-changes.outputs.docs == 'true'
        continue-on-error: true
        run: |
          if ./.github/scripts/docs-changelog-only.sh HEAD^1 HEAD; then
            echo changelog-only=true | tee -a "$GITHUB_OUTPUT"
          else
            echo changelog-only=false | tee -a "$GITHUB_OUTPUT"
          fi

    outputs:
      # 'true' if any of the docs files have changed, 'false' otherwise.
      changed: ${{ steps.detect-changes.outputs.docs }}
      # 'true' if the only docs changes are connector changelog rows, which don't need a preview.
      changelog-only: ${{ steps.changelog-only.outputs.changelog-only }}

  build-docs:
    permissions:
      contents: read
    name: Build Airbyte Docs
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Check For Skip Conditions
        id: check-skip
        run: |
          # temporarily disable -e so we can capture a non-zero exit
          set +e
          # Run the script and capture the exit code.
          ./docs/check-docs-git-diff.sh
          exit_code=$?
          set -e

          if [ $exit_code -eq 0 ]; then
            echo "✅ Documentation already up-to-date. No build required."
            echo skip-build=true | tee -a $GITHUB_OUTPUT
          else
            echo "❌ Documentation needs to be built."
            echo skip-build=false | tee -a $GITHUB_OUTPUT
          fi

      - name: Set Up Node.js
        if: steps.check-skip.outputs.skip-build != 'true'
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: "docusaurus/.nvmrc"

      - name: Set Up pnpm
        if: steps.check-skip.outputs.skip-build != 'true'
        # pnpm is used to manage the dependencies of the documentation build.
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.12.1

      - name: Install uv
        if: steps.check-skip.outputs.skip-build != 'true'
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install Poe
        if: steps.check-skip.outputs.skip-build != 'true'
        run: |
          # Install Poe so we can run the connector tasks:
          uv tool install poethepoet

      - name: Build Docs
        if: steps.check-skip.outputs.skip-build != 'true'
        run: |
          poe docs-build

  vercel-preview:
    name: Vercel Preview
    needs: detect-changes
    if: >
      github.event.pull_request.head.repo.full_name == github.repository
      && needs.detect-changes.outputs.changed == 'true'
      && needs.detect-changes.outputs.changelog-only != 'true'
    runs-on: ubuntu-latest
    # This workflow deploys preview builds to Vercel on pull requests.
    # Pull requests from forks are ignored.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Deploy to Vercel
        id: deploy-vercel
        uses: amondnet/vercel-action@v42.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-args: --archive=tgz

      - name: Authenticate as GitHub App
        uses: actions/create-github-app-token@v3.0.0
        id: get-app-token
        with:
          owner: "airbytehq"
          repositories: "airbyte"
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      # If successful, post a check status with the Preview URL as its "details" link
      - name: Post Custom Check with Preview URL (${{ steps.deploy-vercel.outputs.preview-url }})
        uses: LouisBrunner/checks-action@v3.0.0
        with:
          name: "Vercel Preview Deployed" # << Name of the check
          status: completed
          conclusion: success
          details_url: ${{ steps.deploy-vercel.outputs.preview-url }}
          token: ${{ steps.get-app-token.outputs.token }}
