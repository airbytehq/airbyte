name: Auto Upgrade CDK for Certified Connectors
on:
  schedule:
    # Run at 16:37 UTC on the first of every month
    - cron: "37 16 1 * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      repositories:
        description: "Repository name for GitHub App authentication"
        required: false
        type: string
        default: "airbyte"

# All repo writes use GitHub App tokens, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  list-certified-connectors:
    name: List Certified Connectors
    runs-on: ubuntu-24.04
    outputs:
      connectors: ${{ steps.list-connectors.outputs.connectors }}
    steps:
      - name: Checkout Airbyte
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Needed for when airbyte-enterprise calls this workflow
          submodules: true

      - name: Install yq
        run: sudo snap install yq

      - name: List certified connectors
        id: list-connectors
        run: |
          json_array=$(tools/bin/bulk-cdk/get-certified-connectors.sh)
          echo "connectors=$json_array" >> $GITHUB_OUTPUT
          echo "Found bulk CDK connectors to upgrade: $json_array"

  upgrade-connector-cdk:
    name: Upgrade CDK for ${{ matrix.connector }}
    needs: list-certified-connectors
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        connector: ${{ fromJson(needs.list-certified-connectors.outputs.connectors) }}
      fail-fast: false
      max-parallel: 5
    steps:
      - name: Authenticate as GitHub App
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v2
        id: app-token
        with:
          owner: "airbytehq"
          repositories: ${{ inputs.repositories || 'airbyte' }}
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Checkout Airbyte
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Needed for when airbyte-enterprise calls this workflow
          submodules: true

      - name: Install yq
        run: sudo snap install yq

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run upgradeCdk for ${{ matrix.connector }}
        id: upgrade-cdk
        run: |
          set -euo pipefail
          # --quiet disables all of gradle's normal logging, so we only get the CDK version number
          old_cdk_version=$(./gradlew :airbyte-integrations:connectors:${{ matrix.connector }}:getCdkVersion --quiet)
          echo "old_cdk_version=$old_cdk_version" | tee -a $GITHUB_OUTPUT
          ./gradlew :airbyte-integrations:connectors:${{ matrix.connector }}:upgradeCdk
          new_cdk_version=$(./gradlew :airbyte-integrations:connectors:${{ matrix.connector }}:getCdkVersion --quiet)
          echo "new_cdk_version=$new_cdk_version" | tee -a $GITHUB_OUTPUT

      - name: Check for changes
        id: check-changes
        if: steps.upgrade-cdk.outputs.exit_code == '0'
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected for ${{ matrix.connector }}"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected for ${{ matrix.connector }}"
          fi

      - name: Bump connector version
        id: bump-version
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          new_version=$(tools/bin/bulk-cdk/auto-upgrade/bump-connector-metadata.sh "${{ matrix.connector }}")
          echo "Updated dockerImageTag to $new_version"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: create-pr
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: upgrade bulk CDK for ${{ matrix.connector }}"
          author: "sunil-kuruba <270477162+sunil-kuruba@users.noreply.github.com>"
          branch: "auto-upgrade-jvm-bulk-cdk/${{ steps.upgrade-cdk.outputs.new_cdk_version }}/${{ matrix.connector }}"
          delete-branch: true
          title: "chore: upgrade ${{ matrix.connector }} to bulk CDK ${{ steps.upgrade-cdk.outputs.new_cdk_version }}"
          body: |
            Upgrade Bulk CDK version for `${{ matrix.connector }}`

            🤖 Generated by [automated workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          labels: |
            area/connectors
            auto-cdk-upgrade
          assignees: ""
          # We'll rely on CODEOWNERS to tag the right people.
          reviewers: ""
          # Submit as draft: true, because we need to push another commit to this branch to update the changelog.
          # The `ready for review` step is where we switch the PR out of draft mode.
          draft: true

      # Update the connector changelog and push the commit to the new branch
      - name: Update connector changelog
        # airbyte-enterprise doesn't have changelogs, so only do this in the OSS repo.
        if: steps.check-changes.outputs.has_changes == 'true' && inputs.repositories != 'airbyte-enterprise'
        run: |
          set -euo pipefail
          tools/bin/bulk-cdk/auto-upgrade/populate-connector-changelog.sh \
            "${{ matrix.connector }}" \
            "${{ steps.bump-version.outputs.new_version }}" \
            "${{ steps.create-pr.outputs.pull-request-number }}" \
            "Upgrade to Bulk CDK ${{ steps.upgrade-cdk.outputs.new_cdk_version }}."

          # Commit and push the changelog changes
          branch_name="${{ steps.create-pr.outputs.pull-request-branch }}"
          git fetch --depth=1 origin "$branch_name"
          git checkout "$branch_name"
          git add docs
          git commit -m "update changelog for ${{ matrix.connector }}"
          git push origin "$branch_name"

      # We've pushed all the changes to the PR. Mark it ready for review.
      - name: Ready for review
        if: steps.check-changes.outputs.has_changes == 'true'
        run: gh pr ready "${{ steps.create-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge on PR
        if: steps.check-changes.outputs.has_changes == 'true'
        run: gh pr merge "$PR_NUMBER" --squash --auto
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}

      # Use a different bot identity (admin) to approve, because the bot that
      # created the PR cannot approve its own PRs.
      - name: Authenticate as 'octavia-bot-admin' GitHub App
        if: steps.check-changes.outputs.has_changes == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v2
        id: admin-token
        with:
          owner: "airbytehq"
          repositories: ${{ inputs.repositories || 'airbyte' }}
          app-id: ${{ secrets.OCTAVIA_BOT_ADMIN_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_ADMIN_PRIVATE_KEY }}

      - name: Apply bot approval
        if: steps.check-changes.outputs.has_changes == 'true' && steps.admin-token.outcome == 'success'
        continue-on-error: true
        run: gh pr review "$PR_NUMBER" --approve --body "Auto-approved by CDK auto-upgrade workflow."
        env:
          GH_TOKEN: ${{ steps.admin-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}

      # Record the outcome for this connector so the summary job can report on it.
      - name: Record result
        if: always()
        env:
          CONNECTOR: ${{ matrix.connector }}
          HAS_CHANGES: ${{ steps.check-changes.outputs.has_changes }}
          OLD_CDK_VERSION: ${{ steps.upgrade-cdk.outputs.old_cdk_version }}
          NEW_CDK_VERSION: ${{ steps.upgrade-cdk.outputs.new_cdk_version }}
          CONNECTOR_VERSION: ${{ steps.bump-version.outputs.new_version }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # A PR can exist even when a later step (changelog, auto-merge) failed, so check the job status first.
          if [[ "$JOB_STATUS" != "success" ]]; then
            status=failed
          elif [[ -n "$PR_URL" ]]; then
            status=upgraded
          elif [[ "$HAS_CHANGES" == "false" ]]; then
            status=up-to-date
          else
            status=failed
          fi
          mkdir -p cdk-upgrade-results
          jq --null-input \
            --arg connector "$CONNECTOR" \
            --arg status "$status" \
            --arg old_cdk_version "$OLD_CDK_VERSION" \
            --arg new_cdk_version "$NEW_CDK_VERSION" \
            --arg connector_version "$CONNECTOR_VERSION" \
            --arg pr_url "$PR_URL" \
            '$ARGS.named' | tee "cdk-upgrade-results/$CONNECTOR.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdk-upgrade-result-${{ matrix.connector }}
          path: cdk-upgrade-results/
          retention-days: 7

  notify-slack:
    name: Post Slack summary
    needs: [list-certified-connectors, upgrade-connector-cdk]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Airbyte
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: tools/bin/bulk-cdk/auto-upgrade

      - name: Download connector results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cdk-upgrade-result-*
          path: cdk-upgrade-results
          merge-multiple: true

      - name: Build Slack payload
        env:
          CONNECTORS_JSON: ${{ needs.list-certified-connectors.outputs.connectors || '[]' }}
          SLACK_CHANNEL: C043JHEEYKG # #team-hydra-connectors
        run: |
          tools/bin/bulk-cdk/auto-upgrade/build-slack-summary.sh \
            cdk-upgrade-results \
            "$CONNECTORS_JSON" \
            "$SLACK_CHANNEL" \
            slack-payload.json

      - name: Post to Slack
        # Not every repo that calls this workflow has the Slack token, so don't fail the run over a missed notification.
        continue-on-error: true
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN_AIRBYTE_TEAM }}
          method: chat.postMessage
          payload-file-path: slack-payload.json
