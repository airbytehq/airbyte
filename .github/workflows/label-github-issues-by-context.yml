name: "Auto-Label Issues"
on:
  issues:
    types: [opened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  shared-issues:
    name: "Add Labels to Issues.  Safe to Merge on fail"
    runs-on: ubuntu-24.04
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.0.0
        with:
          owner: airbytehq
          repositories: |
            airbyte
            workflow-actions
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      - name: Check out workflow-actions
        uses: actions/checkout@v6.0.2
        with:
          repository: airbytehq/workflow-actions
          ref: 822588f078efcbc84601fff7f56a9ce8658f7c99
          token: ${{ steps.app-token.outputs.token }}
          path: .workflow-actions
          persist-credentials: false

      - name: Label issue
        uses: ./.workflow-actions
        with:
          token: ${{ steps.app-token.outputs.token }}
          # ref: https://github.com/airbytehq/workflow-actions/blob/main/src/bin_issue.ts
          command: "issue"
