name: CI Scripts Tests

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/connector-ci-checks.yml"
      - ".github/workflows/ci-scripts-tests.yml"

permissions:
  contents: read

jobs:
  test-ci-scripts:
    name: Test CI Helper Scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Airbyte
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Run CI script tests
        run: uvx --with pytest --with pyyaml pytest .github/scripts/tests
