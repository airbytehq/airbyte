name: Breaking Change Ready Script Tests

on:
  pull_request:
    paths:
      - ".github/scripts/check-breaking-change-ready.sh"
      - ".github/scripts/tests/check-breaking-change-ready/**"
      - ".github/workflows/ai-breaking-change-ready-command.yml"
      - ".github/workflows/breaking-change-ready-script-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test check-breaking-change-ready.sh
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run gate script tests
        run: bash .github/scripts/tests/check-breaking-change-ready/run-tests.sh
