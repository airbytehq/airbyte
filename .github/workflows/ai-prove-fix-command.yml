name: AI Prove Fix Command

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number (if triggered from a PR)"
        type: number
        required: false
      comment-id:
        description: "The comment-id of the slash command. Used to update the comment with the status."
        required: false
      repo:
        description: "Repo (passed by slash command dispatcher)"
        required: false
        default: "airbytehq/airbyte"
      gitref:
        description: "Git ref (passed by slash command dispatcher)"
        required: false

run-name: "AI Prove Fix for PR #${{ github.event.inputs.pr }}"

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  ai-prove-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Get job variables
        id: job-vars
        run: |
          echo "run-url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate as GitHub App
        uses: actions/create-github-app-token@v3.0.0
        id: get-app-token
        with:
          owner: "airbytehq"
          repositories: "airbyte,oncall"
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      - name: Post start comment
        if: inputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ steps.get-app-token.outputs.token }}
          comment-id: ${{ inputs.comment-id }}
          issue-number: ${{ inputs.pr }}
          body: |
            > **AI Prove Fix Started**
            >
            > Running readiness checks and testing against customer connections.
            > [View workflow run](${{ steps.job-vars.outputs.run-url }})

      - name: Run AI Prove Fix
        id: devin
        uses: airbytehq/devin-action@main
        with:
          comment-id: ${{ inputs.comment-id }}
          issue-number: ${{ inputs.pr }}
          playbook-macro: "!prove_fix"
          devin-token: ${{ secrets.DEVIN_AI_API_KEY }}
          github-token: ${{ steps.get-app-token.outputs.token }}
          api-version: v3
          org-id: ${{ vars.DEVIN_AI_ORG_ID }}
          wait-for-stopped-status: true
          start-message: "🔍 **AI Prove Fix session starting...** Running readiness checks and testing against customer connections. [View playbook](https://github.com/airbytehq/ai-skills/blob/main/devin/playbooks/prove_fix.md)"
          tags: |
            ai-oncall
            ${{ inputs.pr && format('airbyte-pr-{0}', inputs.pr) || '' }}

      # Signal the Hydra v2 handoff workflow that this stage has finished so it
      # can re-read state and decide the next action. Fires regardless of the
      # Devin session's outcome — hydra assess looks up the session's verdict
      # from Devin's tag index and routes appropriately (prove PROVEN → review,
      # DISPROVEN → fix rework, etc.).
      # Only `hyd-chain-v2` PRs are signalled; the handoff's pre-flight re-checks the label.
      # Skipped when no session started or the wait timed out (devin-action sets status only once the session stops).
      - name: Signal handoff v2 (repository_dispatch)
        if: always() && inputs.pr != '' && steps.devin.outputs.status != ''
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
          if ! jq -e 'any(.labels[]; .name == "hyd-chain-v2")' <<<"$PR_JSON" >/dev/null; then
            echo "::notice::PR #$PR_NUMBER has no hyd-chain-v2 label; skipping handoff v2 signal"
            exit 0
          fi
          HEAD_SHA=$(jq -r '.head.sha' <<<"$PR_JSON")
          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg head "$HEAD_SHA" \
            --arg stage "prove_fix" \
            '{event_type: "handoff", client_payload: {pr: $pr, head_sha: $head, source_stage: $stage}}' \
            | gh api -X POST "repos/${{ github.repository }}/dispatches" --input -
          echo "::notice::Signalled handoff v2 for PR #$PR_NUMBER (head ${HEAD_SHA:0:12}, source prove_fix)"
