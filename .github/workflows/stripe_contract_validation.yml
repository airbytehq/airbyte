name: Stripe Connector Specmatic Reports

on:
  push:
    paths:
      - "airbyte-integrations/connectors/source-stripe/**"
      - "specmatic_test/**"
      - ".github/workflows/stripe_contract_validation.yml"
  pull_request:
    paths:
      - "airbyte-integrations/connectors/source-stripe/**"
      - "specmatic_test/**"
      - ".github/workflows/stripe_contract_validation.yml"

jobs:
  validate-contract:
    name: Run Specmatic Reports
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Specmatic
        run: npm install -g specmatic@2.50.1

      - name: Run Specmatic Integration Tests (Generates Stub HTML Report)
        run: |
          pip install pytest freezegun pytest-mock requests-mock mock airbyte-cdk==6.61.6 requests pyyaml jsonschema
          export PYTHONPATH=$PYTHONPATH:$(pwd)/airbyte-integrations/connectors/source-stripe/unit_tests
          export SPECMATIC_GENERATIVE_TESTS=true
          pytest -v airbyte-integrations/connectors/source-stripe/unit_tests/integration/specmatic
          mkdir -p build/reports/specmatic
          if [ -d "airbyte-integrations/connectors/source-stripe/unit_tests/build/reports/specmatic" ]; then
            cp -r airbyte-integrations/connectors/source-stripe/unit_tests/build/reports/specmatic/* build/reports/specmatic/
          fi

      - name: Upload Specmatic Stub HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-stub-html-report
          path: build/reports/specmatic/
          if-no-files-found: warn
