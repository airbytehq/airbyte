name: Publish Bulk CDK Load
on:
  push:
    branches:
      - master
    paths:
      - "airbyte-cdk/bulk/core/load/**"
      - "airbyte-cdk/bulk/toolkits/load-*/**"
      - "airbyte-cdk/bulk/toolkits/legacy-task-load*/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-bulk-cdk-load
  cancel-in-progress: false

jobs:
  publish-bulk-cdk-load:
    permissions:
      contents: read
      id-token: write
    name: Publish Bulk CDK Load
    runs-on: linux-24.04-large
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Airbyte
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Get Docker Hub OIDC token
        id: docker-hub-oidc
        uses: docker/oidc-action@96ba694c64860c7209bcd1ede7d698c71564ef78 # v1.2.0
        with:
          connection-id: ${{ vars.DOCKER_HUB_OIDC_READ_ONLY_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: airbyte
          password: ${{ steps.docker-hub-oidc.outputs.token }}

      - name: Configure S3 build cache
        uses: ./.github/actions/configure-s3-build-cache
        with:
          read-role: ${{ vars.S3_BUILD_CACHE_READ_ROLE_ARN }}
          write-role: ${{ vars.S3_BUILD_CACHE_WRITE_ROLE_ARN }}

      - name: Error if Load CDK Version Exists
        uses: burrunan/gradle-cache-action@3bf23b8dd95e7d2bacf2470132454fe893a178a1 # v1
        env:
          CI: true
        with:
          job-id: bulk-cdk-load-publish
          concurrent: true
          gradle-distribution-sha-256-sum-warning: false
          arguments: --scan :airbyte-cdk:bulk:checkLoadVersion

      - name: Build Load CDK
        uses: burrunan/gradle-cache-action@3bf23b8dd95e7d2bacf2470132454fe893a178a1 # v1
        env:
          CI: true
        with:
          job-id: bulk-cdk-load-publish
          concurrent: true
          gradle-distribution-sha-256-sum-warning: false
          arguments: --scan :airbyte-cdk:bulk:loadCdkBuild

      - name: Publish Load CDK to CloudRepo
        uses: burrunan/gradle-cache-action@3bf23b8dd95e7d2bacf2470132454fe893a178a1 # v1
        env:
          CI: true
          CLOUDREPO_USER: ${{ secrets.CLOUDREPO_USER }}
          CLOUDREPO_PASSWORD: ${{ secrets.CLOUDREPO_PASSWORD }}
        with:
          job-id: bulk-cdk-load-publish
          read-only: true
          concurrent: true
          execution-only-caches: true
          gradle-distribution-sha-256-sum-warning: false
          arguments: --scan :airbyte-cdk:bulk:loadCdkPublish
