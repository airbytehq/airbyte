name: Stripe sandbox demo

on:
  workflow_dispatch:
    inputs:
      image:
        description: Published Stripe connector image (tag or digest)
        type: string
        required: true
        default: airbyte/source-stripe:6.0.18
      relay_image:
        description: Published sandbox relay image (public or accessible private GHCR image)
        type: string
        required: true
      scenario:
        description: Existing Stripe scenario name or UUID
        type: string
        required: true
        default: stripe-customers
      tests:
        description: Pytest -k expression; empty matches the normal CI image suite
        type: string
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: stripe-sandbox-demo-${{ inputs.scenario }}
  cancel-in-progress: false

jobs:
  stripe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONNECTOR_IMAGE: ${{ inputs.image }}
      SASS_RELAY_IMAGE: ${{ inputs.relay_image }}
      SASS_SCENARIO: ${{ inputs.scenario }}
      SASS_API_URL: ${{ vars.SASS_API_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check sandbox configuration
        env:
          SASS_API_KEY: ${{ secrets.SASS_API_KEY }}
          SASS_SOURCE_READ_TOKEN: ${{ secrets.SASS_SOURCE_READ_TOKEN }}
        run: |
          test -n "$SASS_API_URL" || { echo "Set the SASS_API_URL repository variable"; exit 1; }
          test -n "$SASS_API_KEY" || { echo "Set the SASS_API_KEY repository secret"; exit 1; }
          test -n "$SASS_SOURCE_READ_TOKEN" || { echo "Set SASS_SOURCE_READ_TOKEN with read access to airbytehq/saas-sandbox"; exit 1; }
      - name: Check out sandbox CLI
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: airbytehq/saas-sandbox
          ref: 620b06462c0e336cca13af2060c93e434c1a7579
          token: ${{ secrets.SASS_SOURCE_READ_TOKEN }}
          path: sandbox-tool
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install CDK, sandbox CLI, and Poe
        run: python -m pip install -r sandbox-tool/scripts/stripe_demo/requirements.txt ./sandbox-tool poethepoet==0.48.0
      - name: Log in to GHCR for private relay images
        if: startsWith(inputs.relay_image, 'ghcr.io/')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Pull published images
        run: |
          docker pull "$CONNECTOR_IMAGE"
          docker pull "$SASS_RELAY_IMAGE"
      - name: Run existing Stripe image tests through sandbox
        working-directory: airbyte-integrations/connectors/source-stripe
        env:
          SASS_API_KEY: ${{ secrets.SASS_API_KEY }}
          TEST_FILTER: ${{ inputs.tests }}
        run: |
          export PYTEST_ADDOPTS="$(python - <<'PYARGS'
          import os
          import shlex

          print(shlex.join([
              "-k", os.environ["TEST_FILTER"],
              "--tb=no", "--show-capture=no", "-o", "junit_logging=no",
          ]))
          PYARGS
          )"
          poe test-sandbox
      - name: Sanitize test report
        id: sanitize
        if: always()
        run: >-
          python sandbox-tool/scripts/stripe_demo/sanitize_report.py
          airbyte-integrations/connectors/source-stripe/build/test-results/standard-tests-junit.xml
      - name: Upload test report
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stripe-sandbox-junit
          path: airbyte-integrations/connectors/source-stripe/build/test-results/standard-tests-junit.xml
          if-no-files-found: ignore
          retention-days: 7
