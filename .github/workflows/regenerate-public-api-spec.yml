# Keeps the committed Public API spec cache in sync with the upstream OpenAPI definition.
#
# docs.airbyte.com renders the public API reference from a slimmed copy of
# airbyte-platform's api_sdk.yaml, committed at
# docusaurus/src/data/public_api_spec.json. Docs builds fetch the upstream spec
# themselves and only fall back to that committed copy when the fetch fails, so
# the cache exists to keep Vercel builds working during a GitHub outage — which
# means it must not be allowed to go stale.
#
# This workflow runs the same preparation script the docs build runs, then opens
# a PR when the regenerated cache differs from what is committed. No PR means
# the cache is already current.

name: Regenerate Public API Spec Cache

on:
  schedule:
    # Run daily at 06:45 UTC
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-spec:
    name: Regenerate Public API Spec
    runs-on: ubuntu-24.04
    steps:
      - name: Authenticate as GitHub App
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          owner: "airbytehq"
          repositories: "airbyte"
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" | tee -a "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Configure Git
        run: |
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}

      - name: Checkout Airbyte
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: "9.4.0"

      # The runner image ships yarn, which makes some tooling pick the wrong
      # package manager for the pnpm-based docusaurus workspace.
      - name: Remove yarn to prevent package manager detection issues
        run: rm -f "$(which yarn)" || true

      - name: Install dependencies
        working-directory: docusaurus
        run: pnpm install --frozen-lockfile

      # PUBLIC_API_STRICT makes a failed fetch, parse, or validation fail the job.
      # Without it the script falls back to the committed cache and would appear
      # to succeed while quietly committing nothing (or a stale spec).
      - name: Regenerate Public API spec
        working-directory: docusaurus
        run: pnpm run prepare-public-api
        env:
          PUBLIC_API_STRICT: "true"

      # Opens (or updates) a single long-lived PR branch. The auto-merge label
      # lets the cache refresh land without a human in the loop; the diff is
      # generated JSON only.
      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(docs): regenerate cached Public API spec"
          branch: "auto-regenerate-public-api-spec"
          delete-branch: true
          title: "chore(docs): regenerate cached Public API spec"
          body: |
            Regenerates the cached Public API spec in Docusaurus to reflect the latest API changes.

            This PR was automatically generated by the daily cron workflow.

            Generated by [automated workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          labels: |
            auto-merge
            auto-generated
            documentation
