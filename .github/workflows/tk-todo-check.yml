name: TK-TODO Check # IGNORE:TK

on:
  push:
    branches:
      - master
  pull_request: {}

permissions:
  contents: read

jobs:
  tk-todo-check: # IGNORE:TK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Check for TK-TODO markers # IGNORE:TK
        uses: aaronsteers/tk-todo-check-action@v1.0.0 # IGNORE:TK
        with:
          # The lockfile names this action, which the marker search would match.
          exclude-patterns: actions.lock
