# Detects PRs created by the airbytehq/ai-skills playbook-eval harness so
# Hydra automation never advances, readies, or merges them. Eval PRs target an
# `eval-base/*` branch or come from an `eval/*` branch, and harness-created
# ones also carry the `[EVAL - DO NOT MERGE]` title prefix and `eval-test`
# label. See is-eval-artifact.sh for the rules and test.sh for examples.
#
# Callers must check out this directory first, e.g. with a sparse checkout of
# `.github/actions/hydra-eval-artifact-check`.

name: "Hydra eval-artifact check"
description: "Classify a PR as a playbook-eval artifact; optionally fail the job if it is one."
inputs:
  pr:
    description: "PR number"
    required: true
  github-token:
    description: "Token with read access to the PR"
    required: true
  repo:
    description: "Repo (owner/repo)"
    required: false
    default: ${{ github.repository }}
  fail-on-eval:
    description: "If 'true', fail the step when the PR is an eval artifact. Use on merge paths."
    required: false
    default: "false"
outputs:
  is-eval:
    description: "'true' if the PR is an eval artifact, otherwise 'false'"
    value: ${{ steps.classify.outputs.is-eval }}
  reason:
    description: "Which signal matched (e.g. 'base eval-base/...'); empty if not an eval artifact"
    value: ${{ steps.classify.outputs.reason }}
runs:
  using: "composite"
  steps:
    - name: Classify PR
      id: classify
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr }}
        REPO: ${{ inputs.repo }}
        FAIL_ON_EVAL: ${{ inputs.fail-on-eval }}
      run: |
        set -euo pipefail
        PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefName,headRefName,title,labels)
        REASON=$(
          BASE_REF=$(jq -r '.baseRefName' <<<"$PR_JSON") \
          HEAD_REF=$(jq -r '.headRefName' <<<"$PR_JSON") \
          TITLE=$(jq -r '.title' <<<"$PR_JSON") \
          LABELS=$(jq -r '[.labels[].name] | join(",")' <<<"$PR_JSON") \
          "$GITHUB_ACTION_PATH/is-eval-artifact.sh"
        )
        if [[ -z "$REASON" ]]; then
          echo "is-eval=false" | tee -a "$GITHUB_OUTPUT"
          echo "reason=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "is-eval=true" | tee -a "$GITHUB_OUTPUT"
        echo "reason=$REASON" | tee -a "$GITHUB_OUTPUT"
        if [[ "$FAIL_ON_EVAL" == "true" ]]; then
          echo "::error::Blocked: PR #$PR_NUMBER is an eval artifact ($REASON). Automation must never ready, approve, or merge eval PRs."
          exit 1
        fi
        echo "::notice::PR #$PR_NUMBER is an eval artifact ($REASON)."
