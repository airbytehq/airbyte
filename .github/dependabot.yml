version: 2
updates:
  # Python dependencies - scan from root to test if updates are atomic per-manifest
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps): "
    open-pull-requests-limit: 10
    # No grouping - each dependency update should be separate

  # Gradle dependencies - scan from root
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps): "
    open-pull-requests-limit: 10
    groups:
      # The Kotlin Gradle plugin, kotlin-bom and KSP ship together: KSP embeds a Kotlin
      # compiler front end, and a bump of one without the other breaks Micronaut's
      # bean-definition generation. One PR for all of them (see the root build.gradle
      # for the KSP version ceiling).
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"

  # Docker base images - scan from root
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps): "
    open-pull-requests-limit: 10

  # GitHub Actions - keep action versions up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps): "
    open-pull-requests-limit: 10
