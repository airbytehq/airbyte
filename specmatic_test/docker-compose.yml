version: '3.8'

services:
  # Specmatic Mock Server (mocks Stripe APIs for connector integration tests)
  specmatic-mock:
    image: specmatic/specmatic:2.50.1
    container_name: specmatic-mock-server
    volumes:
      - ..:/usr/src/app
      - ~/.specmatic:/root/.specmatic
    working_dir: /usr/src/app
    ports:
      - "9000:9000"
    command: mock --port=9000 --config=specmatic.yaml
