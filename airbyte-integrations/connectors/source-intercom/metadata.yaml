data:
  ab_internal:
    ql: 400
    sl: 300
  allowedHosts:
    hosts:
      - api.intercom.io
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.47.0@sha256:b2ecb78040d4c4b42fa3537488d68a3b195f64b5fefcbc48ac0591479591a3f0
  connectorSubtype: api
  connectorType: source
  definitionId: d8313939-3782-41b0-be29-b3ca20d8dd3a
  dockerImageTag: 1.1.0
  dockerRepository: airbyte/source-intercom
  documentationUrl: https://docs.airbyte.com/integrations/sources/intercom
  externalDocumentationUrls:
    - title: Unversioned Changes
      url: https://developers.intercom.com/docs/build-an-integration/learn-more/rest-apis/unversioned-changes#unversioned-changes
      type: api_reference
    - title: API Changelog
      url: https://developers.intercom.com/docs/references/changelog
      type: api_release_history
    - title: Changelog
      url: https://developers.intercom.com/docs/build-an-integration/learn-more/rest-apis/api-changelog
      type: api_release_history
    - title: Intercom API OpenAPI specification
      url: https://developers.intercom.com/docs/references/rest-api/api.intercom.io/openapi.json
      type: openapi_spec
    - title: Intercom OpenAPI specification repository
      url: https://github.com/intercom/Intercom-OpenAPI
      type: spec_repository
  githubIssueLabel: source-intercom
  icon: intercom.svg
  license: ELv2
  maxSecondsBetweenMessages: 32400
  name: Intercom
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-intercom
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  releases:
    breakingChanges:
      1.0.0:
        message: >-
          Version 1.0.0 changes the `company_segments` stream. Each record now has a `company_id` field with the
          Intercom ID of the company the segment is attached to, and the primary key changes from `id` to
          `[company_id, id]`, so deduplicated destinations keep one row per company and segment instead of one row
          per segment. If you sync `company_segments` in Incremental | Append + Deduped, refresh the source schema
          after upgrading, then refresh the stream with "Refresh stream and remove records" to drop the old rows,
          which have no `company_id`. In Incremental | Append, do the same with "Refresh stream and retain records",
          or the saved state keeps older memberships from getting `company_id`. Full Refresh modes need no action.
          See the [migration guide](https://docs.airbyte.com/integrations/sources/intercom-migrations#upgrading-to-100).
        upgradeDeadline: "2026-11-30"
        deadlineAction: auto_upgrade
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - "company_segments"
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
  suggestedStreams:
    streams:
      - conversations
      - contacts
      - conversation_parts
      - teams
      - companies
  supportLevel: certified
  tags:
    - cdk:low-code
    - language:manifest-only
  connectorTestSuitesOptions:
    - suite: unitTests
    - suite: liveTests
      testConnections:
        - name: intercom_config_dev_null
          id: 09ebd6bb-2756-4cd3-8ad5-7120088cc553
    # We should enable unit tests once the connector has been updated to CDK version >= 6.10.0
    # Until then, the test suites won't be able to run successfully in CI as the fixtures are not present in earlier versions
    # - suite: unitTests
    - suite: integrationTests
      testSecrets:
        - name: SECRET_SOURCE-INTERCOM_APIKEY__CREDS
          fileName: config_apikey.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE-INTERCOM__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-INTERCOM_APIKEY__CREDS
          fileName: config_apikey.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE-INTERCOM__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE-INTERCOM_SANDBOX__CREDS
          fileName: config_sandbox.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
metadataSpecVersion: "1.0"
