[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-buildkite-tests"
version = "0.0.0"
description = "Unit tests for source-buildkite"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10,<3.13"
airbyte-cdk = "7.39.1"
pytest = "^8"
requests-mock = "^1.12.1"
pytest-mock = "^3.6.1"
freezegun = "^1.4.0"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*"
]
