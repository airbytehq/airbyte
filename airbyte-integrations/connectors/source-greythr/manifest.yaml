spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - base_url
      - domain
      - username
    properties:
      domain:
        type: string
        description: Your GreytHR Host URL
        order: 1
        title: Host URL
      base_url:
        type: string
        description: https://api.greythr.com
        order: 0
        title: Base URL
      password:
        type: string
        order: 3
        title: Password
        always_show: true
        airbyte_secret: true
      username:
        type: string
        order: 2
        title: Username
      year:
        type: string
        description: Leave year used by the leave balance endpoint. Defaults to the current year.
        order: 4
        title: Leave Year
      start_date:
        type: string
        description: Inclusive start date for date-ranged Leave and Attendance streams (YYYY-MM-DD).
        order: 5
        title: Start Date
        default: "2020-01-01"
    additionalProperties: true

