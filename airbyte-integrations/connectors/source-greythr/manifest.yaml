            field_name: size
            inject_into: request_parameter
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: request_parameter
          pagination_strategy:
            type: PageIncrement
            page_size: 100
            start_from_page: 0
        requester:
          $ref: "#/definitions/base_requester"
          path: /employee/v2/employees
          http_method: GET
          request_headers:
            x-greythr-domain: "{{ config[\"domain\"] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      primary_key:
        - employeeId
      schema_loader:
        type: InlineSchemaLoader
        schema:
