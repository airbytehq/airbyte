          type: DatetimeBasedCursor
          cursor_field: fromDate
          cursor_datetime_formats:
            - "%Y-%m-%d"
          datetime_format: "%Y-%m-%d"
          start_datetime:
            type: MinMaxDatetime
            datetime: "{{ config.get('start_date', '2020-01-01') }}"
            datetime_format: "%Y-%m-%d"
          start_time_option:
            type: RequestOption
            field_name: start
            inject_into: request_parameter
          end_time_option:
            type: RequestOption
            field_name: end
            inject_into: request_parameter
          end_datetime:
            type: MinMaxDatetime
            datetime: "{{ now_utc().strftime('%Y-%m-%d') }}"
            datetime_format: "%Y-%m-%d"
          step: P31D
          cursor_granularity: P1D
        schema_loader:
