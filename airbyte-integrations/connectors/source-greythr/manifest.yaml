  base_requester:
    type: HttpRequester
    url_base: "{{ config['base_url'] }}"
    authenticator:
      type: SessionTokenAuthenticator
      login_requester:
        type: HttpRequester
        path: client-token
        url_base: https://{{ config['domain'] }}/uas/v1/oauth2
        http_method: POST
        authenticator:
          type: BasicHttpAuthenticator
          password: "{{ config[\"password\"] }}"
          username: "{{ config[\"username\"] }}"
        request_headers: {}
        request_parameters: {}
      session_token_path:
        - access_token
      expiration_duration: P1W
      request_authentication:
        type: ApiKey
        inject_into:
          type: RequestOption
          field_name: ACCESS-TOKEN
          inject_into: header

