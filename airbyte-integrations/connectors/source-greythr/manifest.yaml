          request_headers:
            x-greythr-domain: "{{ config[\"domain\"] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - list
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: employeeId
              partition_field: employee_id
              stream:
                $ref: "#/definitions/streams/Employees"
