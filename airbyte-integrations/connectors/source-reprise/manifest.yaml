version: 7.23.7

type: DeclarativeSource

description: >-
  Reprise, an enterprise-grade software platform that allows sales, marketing,
  and pre-sales teams to build custom, interactive product tours and fully
  functional cloned software environments

check:
  type: CheckStream
  stream_names:
    - replay_session_activity
    - replay_session_summary
    - replay_metrics
    - replay_change_feed
    - replicate_session_activity

definitions:
  linked:
    HttpRequester:
      authenticator:
        type: SessionTokenAuthenticator
        login_requester:
          type: HttpRequester
          url: https://app.getreprise.com/api/warehouse/token
          http_method: POST
          error_handler:
            type: DefaultErrorHandler
            max_retries: 5
            backoff_strategies:
              - type: WaitTimeFromHeader
                header: Retry-After
                max_waiting_time_in_seconds: 600
              - type: ExponentialBackoffStrategy
                factor: 5
          request_headers:
            Authorization: Bearer {{ config['api_token'] }}
        session_token_path:
          - token
        expiration_duration: PT10M
        request_authentication:
          type: ApiKey
          inject_into:
            type: RequestOption
            field_name: token
            inject_into: request_parameter
      error_handler:
        type: DefaultErrorHandler
        max_retries: 5
        backoff_strategies:
          - type: WaitTimeFromHeader
            header: Retry-After
            max_waiting_time_in_seconds: 600
          - type: ExponentialBackoffStrategy
            factor: 5
      request_headers:
        Authorization: Bearer {{ config['api_token'] }}
      request_parameters:
        end_timestamp: >-
          {{ stream_slice.end_time if stream_slice and stream_slice.end_time
          else stream_interval.end_time if stream_interval and
          stream_interval.end_time else now_utc().strftime('%Y-%m-%d %H:%M:%S')
          }}
        start_timestamp: >-
          {{ stream_slice.start_time if stream_slice and stream_slice.start_time
          else stream_interval.start_time if stream_interval and
          stream_interval.start_time else (now_utc() -
          duration('P18M')).strftime('%Y-%m-%d %H:%M:%S') }}
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: limit
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: offset
          inject_into: request_parameter
        pagination_strategy:
          type: OffsetIncrement
          page_size: 10000
          inject_on_first_request: true
    ReprisePaginator:
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: limit
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: offset
          inject_into: request_parameter
        pagination_strategy:
          type: OffsetIncrement
          page_size: 10000
          inject_on_first_request: true
    ViewerIsInternalField:
      type: AddedFieldDefinition
      path:
        - viewer_is_internal
      value: >-
        {{ ((record.get('viewer') | default('', true) | string | trim |
        lower).split('@') | last) in ((config.get('internal_email_domains') or
        '').split(',') | map('trim') | map('lower') | reject('equalto', '') |
        list) }}
      value_type: boolean
    WarehouseTokenAuthenticator:
      type: SessionTokenAuthenticator
      login_requester:
        type: HttpRequester
        url: https://app.getreprise.com/api/warehouse/token
        http_method: POST
        error_handler:
          type: DefaultErrorHandler
          max_retries: 5
          backoff_strategies:
            - type: WaitTimeFromHeader
              header: Retry-After
              max_waiting_time_in_seconds: 600
            - type: ExponentialBackoffStrategy
              factor: 5
        request_headers:
          Authorization: Bearer {{ config['api_token'] }}
      session_token_path:
        - token
      expiration_duration: PT10M
      request_authentication:
        type: ApiKey
        inject_into:
          type: RequestOption
          field_name: token
          inject_into: request_parameter

