              - string
              - "null"
          session_date:
            type:
              - string
              - "null"
          since_created_at:
            type:
              - string
              - "null"
          viewer_is_internal:
            type:
              - boolean
              - "null"
          demo_published_date:
            type:
              - string
              - "null"
          published_replay_id:
            type:
              - string
              - "null"
        additionalProperties: true
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - since_created_at
            value: >-
              {{ format_datetime(record['session_date'], '%Y-%m-%d %H:%M:%S') if
              record.get('session_date') and (record['session_date'] | string |
              trim) else None }}
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - viewer_is_internal
            value: >-
              {{ ((record.get('viewer') | default('', true) | string | trim |
              lower).split('@') | last) in
              ((config.get('internal_email_domains') or '').split(',') |
              map('trim') | map('lower') | reject('equalto', '') | list) }}
            value_type: boolean
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - viewer
            value: "{{ none }}"
        condition: "{{ not config.get('include_viewer_pii', false) }}"
    incremental_sync:
      type: DatetimeBasedCursor
      step: P1D
      cursor_field: since_created_at
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ now_utc().strftime('%Y-%m-%d %H:%M:%S') }}"
        datetime_format: "%Y-%m-%d %H:%M:%S"
      start_datetime:
        type: MinMaxDatetime
        datetime: >-
          {%- set floor = (now_utc() - duration('P18M')).strftime('%Y-%m-%d
          %H:%M:%S') -%} {%- if 'start_time' in config and config['start_time']
          and config['start_time'] != 'None' and config['start_time'][:19] >=
          floor -%} {{- config['start_time'] -}} {%- else -%} {{- floor -}} {%-
          endif -%}
        min_datetime: "{{ (now_utc() - duration('P18M')).strftime('%Y-%m-%d %H:%M:%S') }}"
        datetime_format: "%Y-%m-%d %H:%M:%S"
        min_datetime_format: "%Y-%m-%d %H:%M:%S"
      datetime_format: "%Y-%m-%d %H:%M:%S"
      lookback_window: P3D
      cursor_granularity: PT1S
      is_compare_strictly: false
      cursor_datetime_formats:
        - "%Y-%m-%d %H:%M:%S.%f"
        - "%Y-%m-%d %H:%M:%S"
      is_client_side_incremental: false

spec:
  type: Spec
  documentation_url: https://reprise.zendesk.com/hc/en-us/articles/18940321925659-Replay-Data-API
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_token
    properties:
      api_token:
        type: string
        description: >-
          Reprise portal API key (Settings > API Management). Exchanged for a
          scoped warehouse JWT via POST
          https://app.getreprise.com/api/warehouse/token before each sync.
        name: api_token
        order: 0
        title: API Token
        airbyte_secret: true
      start_time:
        type: string
        description: >-
          Optional UTC lower bound for full refresh / first backfill of
          activity, summary, replicate, change_feed, and metrics (YYYY-MM-DD
          HH:MM:SS). Clamped to 18 months ago. Incremental
          activity/summary/replicate runs only re-fetch the last 3 days
          (lookback_window); this sets the historical floor.
        order: 1
        title: Start Time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
      include_viewer_pii:
        type: boolean
        description: >-
          When enabled, replicate_session_activity emits the raw viewer column
          (visitor email, or IP when no welcome screen is used). Disabled by
          default; viewer_is_internal is always emitted.
        order: 3
        title: Include Viewer PII
        default: false
      internal_email_domains:
        type: string
        description: >-
          Comma-separated email domains treated as internal for
          replicate_session_activity viewer_is_internal (e.g. yourcompany.com).
          Requires viewer_pii from the API; raw viewer is redacted by default
          unless include_viewer_pii is enabled. If unset, viewer_is_internal is
          false for all rows.
        order: 2
        title: Internal email domains
    additionalProperties: true

