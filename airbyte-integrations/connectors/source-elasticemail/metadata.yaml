metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - "api.elasticemail.com"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-elasticemail
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.47.0@sha256:b2ecb78040d4c4b42fa3537488d68a3b195f64b5fefcbc48ac0591479591a3f0
  connectorSubtype: api
  connectorType: source
  definitionId: ed2c12aa-375c-4d18-9d3b-7e1f8a23245d
  dockerImageTag: 0.0.72
  dockerRepository: airbyte/source-elasticemail
  githubIssueLabel: source-elasticemail
  icon: icon.svg
  license: ELv2
  name: Elasticemail
  releaseDate: 2024-11-08
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/elasticemail
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: Elastic Email API reference
      url: https://elasticemail.com/developers/api-documentation/
      type: api_reference
    - title: Elastic Email authentication
      url: https://elasticemail.com/developers/api-documentation/authentication
      type: authentication_guide
    - title: Elastic Email rate limits
      url: https://elasticemail.com/developers/api-documentation/rate-limiting
      type: rate_limits
  releases:
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
