[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-outreach-tests"
version = "0.0.0"
description = "Unit tests for source-outreach"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
airbyte-cdk = "7.47.0"
pytest = "^8.3"
requests-mock = "^1.12.1"

[tool.pytest.ini_options]
testpaths = ["."]
