plugins {
    id 'application'
    id 'airbyte-bulk-connector'
    id "io.airbyte.gradle.docker"
    id 'airbyte-connector-docker-convention'
}

airbyteBulkConnector {
    core = 'load'
}

java {
    compileJava {
        options.compilerArgs += "-Xlint:-this-escape"
    }
}

application {
    mainClass = 'io.airbyte.integrations.destination.starrocks.StarrocksDestinationKt'
    applicationDefaultJvmArgs = ['-XX:+ExitOnOutOfMemoryError', '-XX:MaxRAMPercentage=75.0']
}

dependencies {
    // Control plane: DDL and `SELECT current_version()` over the StarRocks MySQL protocol (port 9030).
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    // Data plane: Stream Load HTTP client (FE HTTP port 8030).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // zstd codec for Stream Load request-body compression (gzip is JVM built-in; zstd is not).
    implementation 'com.github.luben:zstd-jni:1.5.7-11'
    // SSH tunnel: the CDK's createTunnelSession does the forwarding; pinned to reference
    // SshdSocketAddress at compile time and to match the CDK's version.
    implementation 'org.apache.sshd:sshd-core:2.13.2'

    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // LoadFormatSpec oneOf round-trip test deserializes the discriminated union.
    testImplementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.18.3'
}
