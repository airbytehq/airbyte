# Sprout Social source: Airbyte low-code (declarative) manifest.
#
# Reads the Sprout Social Public API v1 (https://api.sproutsocial.com/docs/)
# with an API token:
#   * Metadata streams (clients, customer_profiles, tags, groups, users,
#     topics, teams, queues) are read once per customer in `customer_ids`.
#   * profile_analytics and post_analytics are incremental and partitioned per
#     profile. Sprout wants an explicit metric list per network type, kept in
#     definitions.metric_lists. Profiles on networks without a list (Bluesky)
#     appear in customer_profiles but are skipped for analytics.
#   * Nested `metrics` (and `dimensions` for profiles) are flattened, and the
#     dots and parentheses in Sprout's metric names are replaced
#     (lifetime.impressions -> lifetime_impressions,
#     reporting_period.by(day) -> reporting_period_by_day).
#
# Limits: Sprout allows 60 requests/minute per token. api_budget keeps the
# connector at 55/minute and honours X-RateLimit-Remaining.
#
# Error semantics:
#   * 429      -> wait for Retry-After, else exponential backoff
#   * 5xx      -> retry 5 times with exponential backoff, then FAIL the sync
#   * other 4xx -> FAIL (a 401/403 is a bad or under-scoped token)
#
# API notes:
#   * reporting_period may span at most one year. A slice ending on today
#     keeps its inclusive end, so profile slices step P364D, not P365D.
#   * Sprout returns 400 for a page past total_pages, so paging stops on
#     paging.current_page >= paging.total_pages.
#   * Compare ids with (x ~ ''): the CDK's Jinja `string` filter wraps values
#     in quotes.

version: 7.48.0
type: DeclarativeSource
check:
  type: CheckStream
  stream_names:
  - clients
definitions:
  requester:
    type: HttpRequester
    authenticator:
      type: BearerAuthenticator
      api_token: '{{ config[''api_token''] }}'
    request_headers:
      Accept: application/json
    error_handler:
      type: DefaultErrorHandler
      max_retries: 5
      backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
      - type: ExponentialBackoffStrategy
        factor: 5
      response_filters:
      - type: HttpResponseFilter
        action: RATE_LIMITED
        http_codes:
        - 429
      - type: HttpResponseFilter
        action: RETRY
        http_codes:
        - 500
        - 502
        - 503
        - 504
  metadata_stream:
    type: DeclarativeStream
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        http_method: GET
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
          - data
  customer_partitions:
    type: ListPartitionRouter
    cursor_field: customer_id
    values: '{{ config[''customer_ids''] }}'
  customer_stream:
    $ref: '#/definitions/metadata_stream'
    retriever:
      $ref: '#/definitions/metadata_stream/retriever'
      partition_router:
        $ref: '#/definitions/customer_partitions'
    transformations:
    - type: AddFields
      fields:
      - type: AddedFieldDefinition
        path:
        - customer_id
        value: '{{ stream_partition.customer_id }}'
        value_type: integer
  analytics_profiles:
    $ref: '#/definitions/streams/customer_profiles'
    name: analytics_profiles
    retriever:
      $ref: '#/definitions/streams/customer_profiles/retriever'
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
          - data
        record_filter:
          type: RecordFilter
          condition: '{{ record.network_type in parameters[''post_metrics''] and record.network_type in parameters[''profile_metrics'']
            and (not config.get(''profile_ids'') or (record.customer_profile_id ~ '''') in config[''profile_ids'']) }}'
    $parameters:
      $ref: '#/definitions/metric_lists'
  profile_partitions:
    type: SubstreamPartitionRouter
    parent_stream_configs:
    - type: ParentStreamConfig
      stream: '#/definitions/analytics_profiles'
      parent_key: customer_profile_id
      partition_field: customer_profile_id
      extra_fields:
      - - network_type
      - - customer_id
      incremental_dependency: false
  page_in_body:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: body_json
      field_name: page
    page_size_option:
      type: RequestOption
      inject_into: body_json
      field_name: limit
    pagination_strategy:
      type: CursorPagination
      page_size: 50
      cursor_value: '{{ response.paging.current_page + 1 }}'
      stop_condition: '{{ not response.paging or response.paging.current_page >= response.paging.total_pages }}'
  clean_metric_keys:
  - type: KeysReplace
    old: .
    new: _
  - type: KeysReplace
    old: (
    new: _
  - type: KeysReplace
    old: )
    new: ''
  streams:
    clients:
      $ref: '#/definitions/metadata_stream'
      name: clients
      primary_key:
      - customer_id
      retriever:
        $ref: '#/definitions/metadata_stream/retriever'
        requester:
          $ref: '#/definitions/requester'
          http_method: GET
          url: https://api.sproutsocial.com/v1/metadata/client
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            customer_id:
              type:
              - 'null'
              - integer
            name:
              type:
              - 'null'
              - string
    customer_profiles:
      $ref: '#/definitions/customer_stream'
      name: customer_profiles
      primary_key:
      - customer_id
      - customer_profile_id
      retriever:
        $ref: '#/definitions/customer_stream/retriever'
        requester:
          $ref: '#/definitions/requester'
          http_method: GET
          url: https://api.sproutsocial.com/v1/{{ stream_partition.customer_id }}/metadata/customer
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
            - data
          record_filter:
            type: RecordFilter
            condition: '{{ not config.get(''profile_ids'') or (record.customer_profile_id ~ '''') in config[''profile_ids'']
              }}'
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            customer_id:
              type:
              - 'null'
              - integer
            customer_profile_id:
              type:
              - 'null'
              - integer
            groups:
              type:
              - 'null'
              - array
              items:
                type: integer
            link:
              type:
              - 'null'
              - string
            name:
              type:
              - 'null'
              - string
            native_id:
              type:
              - 'null'
              - string
            native_name:
              type:
              - 'null'
              - string
            network_type:
              type:
              - 'null'
              - string
    profile_analytics:
      type: DeclarativeStream
      name: profile_analytics
      primary_key:
      - customer_profile_id
      - reporting_period_by_day
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/requester'
          http_method: POST
          url: https://api.sproutsocial.com/v1/{{ stream_partition.extra_fields['customer_id'] }}/analytics/profiles
          request_body:
            type: RequestBodyJsonObject
            value:
              filters:
              - customer_profile_id.eq({{ stream_partition.customer_profile_id }})
              - reporting_period.in({{ stream_interval.start_time }}..{{ stream_interval.end_time }})
              metrics: '{{ parameters[''profile_metrics''][stream_partition.extra_fields[''network_type'']] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
            - data
        paginator:
          $ref: '#/definitions/page_in_body'
          pagination_strategy:
            $ref: '#/definitions/page_in_body/pagination_strategy'
            page_size: 1000
        partition_router:
          $ref: '#/definitions/profile_partitions'
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: reporting_period_by_day
        datetime_format: '%Y-%m-%d'
        cursor_datetime_formats:
        - '%Y-%m-%d'
        start_datetime:
          type: MinMaxDatetime
          datetime: '{{ config[''start_date''] }}'
          datetime_format: '%Y-%m-%d'
        end_datetime:
          type: MinMaxDatetime
          datetime: '{{ now_utc().strftime(''%Y-%m-%d'') }}'
          datetime_format: '%Y-%m-%d'
        step: P364D
        cursor_granularity: P1D
        lookback_window: P{{ config.get('profile_lookback_days', 30) }}D
      transformations:
      - type: DpathFlattenFields
        field_path:
        - dimensions
        delete_origin_value: true
      - type: DpathFlattenFields
        field_path:
        - metrics
        delete_origin_value: true
      - $ref: '#/definitions/clean_metric_keys/0'
      - $ref: '#/definitions/clean_metric_keys/1'
      - $ref: '#/definitions/clean_metric_keys/2'
      - type: AddFields
        fields:
        - type: AddedFieldDefinition
          path:
          - customer_id
          value: '{{ stream_partition.extra_fields[''customer_id''] }}'
          value_type: integer
