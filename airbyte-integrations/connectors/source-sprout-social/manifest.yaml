api_budget:
  type: HTTPAPIBudget
  ratelimit_remaining_header: X-RateLimit-Remaining
  status_codes_for_ratelimit_hit:
  - 429
  policies:
  - type: MovingWindowCallRatePolicy
    rates:
    - limit: 55
      interval: PT1M
    matchers: []
spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
    - api_token
    - customer_ids
    - start_date
    additionalProperties: true
    properties:
      api_token:
        type: string
        title: API token
        airbyte_secret: true
        order: 0
        description: Sprout Social API token (Settings > Global Features > API).
      customer_ids:
        type: array
        title: Customer IDs
        order: 1
        minItems: 1
        items:
          type: string
          pattern: ^[0-9]+$
        examples:
        - - '1234567'
        description: Sprout customers to sync. GET /v1/metadata/client (the clients stream) lists the ones the token can access.
      start_date:
        type: string
        title: Start date
        order: 2
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        format: date
        examples:
        - '2024-01-01'
        description: Earliest day for profile and post analytics (YYYY-MM-DD).
      profile_lookback_days:
        type: integer
        title: Profile lookback (days)
        order: 3
        default: 30
        minimum: 1
        maximum: 364
        description: Days of profile analytics re-read every sync.
      post_lookback_days:
        type: integer
        title: Post lookback (days)
        order: 4
        default: 365
        minimum: 1
        description: Days of posts re-read every sync to refresh lifetime metrics.
      profile_ids:
        type: array
        title: Profile allow-list
        order: 5
        items:
          type: string
        description: Optional customer_profile_ids to sync. Empty = every profile.
