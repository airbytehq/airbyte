# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-aircall:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        empty_streams:
          - name: webhooks
            bypass_reason: "The test account has no webhooks (checked 2026-11-09); covered by mock-server tests."
          - name: calls
            bypass_reason: "The test account has no calls (checked 2026-11-09); calls can only be seeded by placing real calls. Covered by mock-server tests."
          - name: conversations
            bypass_reason: "The test account has no conversations (checked 2026-11-09); covered by mock-server tests."
          - name: conversation_engagements
            bypass_reason: "The test account has no conversations, so no engagements (checked 2026-11-09); covered by mock-server tests."
          - name: campaigns
            bypass_reason: "The test account has no outbound campaigns (checked 2026-11-09); covered by mock-server tests."
          - name: campaign_outcomes
            bypass_reason: "The test account has no campaign outcomes (checked 2026-11-09); covered by mock-server tests."
          - name: trackers
            bypass_reason: "The test account has no trackers (checked 2026-11-09); covered by mock-server tests."
          - name: sms_templates
            bypass_reason: "The test account has no SMS templates (checked 2026-11-09); covered by mock-server tests."
          - name: whatsapp_templates
            bypass_reason: "The test account's only number has no WhatsApp capability (checked 2026-11-09); covered by mock-server tests."
  incremental:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        future_state:
          future_state_path: "integration_tests/abnormal_state.json"
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
