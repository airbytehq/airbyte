# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-aircall:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        empty_streams:
          - name: "webhooks"
            bypass_reason: "Sandbox account cannot seed this stream"
          - name: calls
            bypass_reason: "The test account returned no records for this stream on 2026-10-09; declared empty until test data is seeded."
          - name: numbers
            bypass_reason: "The test account returned no records for this stream on 2026-10-09; declared empty until test data is seeded."
          - name: conversations
            bypass_reason: "The Conversations API is an add-on that may not be enabled for the test company, and the GSM test key is revoked (airbytehq/airbyte-internal-issues#18378); covered by mock-server tests."
          - name: conversation_engagements
            bypass_reason: "Child of conversations, which needs the Conversations API add-on; the GSM test key is revoked (airbytehq/airbyte-internal-issues#18378); covered by mock-server tests."
          - name: campaigns
            bypass_reason: "The test account has no outbound campaigns and the GSM test key is revoked (airbytehq/airbyte-internal-issues#18378); covered by mock-server tests."
          - name: campaign_outcomes
            bypass_reason: "The test account has no campaign outcomes and the GSM test key is revoked (airbytehq/airbyte-internal-issues#18378); covered by mock-server tests."
          - name: trackers
            bypass_reason: "Trackers need the AI Assist or AI Assist Pro package and the GSM test key is revoked (airbytehq/airbyte-internal-issues#18378); covered by mock-server tests."
          - name: sms_templates
            bypass_reason: "The test account has no SMS templates and the GSM test key is revoked (airbytehq/airbyte-internal-issues#18378); covered by mock-server tests."
          - name: whatsapp_templates
            bypass_reason: "Needs a number registered for WhatsApp and the GSM test key is revoked (airbytehq/airbyte-internal-issues#18378); covered by mock-server tests."
  incremental:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        future_state:
          future_state_path: "integration_tests/abnormal_state.json"
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
