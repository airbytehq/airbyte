data:
  connectorSubtype: api
  connectorType: source
  definitionId: 912eb6b7-a893-4a5b-b1c0-36ebbe2de8cd
  dockerImageTag: 1.0.0
  dockerRepository: airbyte/source-aircall
  githubIssueLabel: source-aircall
  icon: aircall.svg
  license: ELv2
  name: Aircall
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-aircall
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: alpha
  releases:
    breakingChanges:
      1.0.0:
        message: >-
          Version 1.0.0 adds primary keys to `calls` (`id`) and `contacts` (`id`), changes the `webhooks` primary key from `id` to `webhook_id`,
          makes `numbers` and `teams` full refresh only, removes the unused `teams.webhook_id` column, declares ISO 8601 timestamps on `users`, `calls` and `teams` as `date-time`,
          retypes `calls.contact`, `calls.assigned_to`, `calls.transferred_by` and `calls.transferred_to` from string to object, and
          retypes `numbers.priority` and `calls.number.priority` from string to integer. After upgrading, refresh the source schema and
          clear the `calls`, `contacts`, `webhooks`, `numbers`, `teams` and `users` streams so destinations rebuild them with the new keys,
          sync modes and column types. Other streams need no action. See the
          [migration guide](https://docs.airbyte.com/integrations/sources/aircall-migrations#upgrading-to-100).
        upgradeDeadline: "2026-11-17"
        deadlineAction: disable
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - calls
              - contacts
              - webhooks
              - numbers
              - teams
              - users
  documentationUrl: https://docs.airbyte.com/integrations/sources/aircall
  tags:
    - cdk:low-code
    - language:manifest-only
  ab_internal:
    sl: 100
    ql: 100
  supportLevel: community
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: aircall_config_dev_null
          id: 0c9b5c44-50a9-410f-8ed4-01ac9323df46
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-AIRCALL__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.45.0@sha256:a4947a37ef760ff501856dbeec22830826c1d214f0e530abfa9831e57f019809
  allowedHosts:
    hosts:
      - api.aircall.io
  maxSecondsBetweenMessages: 3600
  suggestedStreams:
    streams:
      - calls
      - users
      - numbers
      - contacts
      - teams
      - tags
  externalDocumentationUrls:
    - title: API documentation
      url: https://developer.aircall.io/api-references/
      type: api_reference
    - title: Authentication
      url: https://developer.aircall.io/api-references/#authentication
      type: authentication_guide
    - title: Rate limits
      url: https://developer.aircall.io/api-references/#rate-limit
      type: rate_limits
    - title: API announcements
      url: https://developer.aircall.io/api-references/#announcements
      type: api_deprecations
    - title: Status page
      url: https://status.aircall.io/
      type: status_page
metadataSpecVersion: "1.0"
