spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_id
      - api_token
    properties:
      api_id:
        type: string
        description: >-
          Your Aircall API ID. Create an API key in the Aircall Dashboard under
          Integrations & API > API Keys
          (https://dashboard.aircall.io/integrations/api-keys).
        title: API ID
        airbyte_secret: true
        order: 0
      api_token:
        type: string
        description: >-
          The API token shown with the API ID in the Aircall Dashboard under
          Integrations & API > API Keys
          (https://dashboard.aircall.io/integrations/api-keys).
        title: API Token
        airbyte_secret: true
        order: 1
      start_date:
        type: string
        description: >-
          Saved by versions before 0.5.0 and no longer used. Calls start 365 days
          before the sync, covering the six months of call history Aircall keeps;
          the other streams always return every record.
        title: Start date (before 0.5.0)
        airbyte_hidden: true
        order: 2
      window_in_days:
        type: integer
        minimum: 1
        maximum: 365
        title: Window size (days)
        description: >-
          Days of calls requested per window, read in pages of 50. Aircall
          returns at most 10,000 records per window, and a calls window above
          that is split and read again, so larger windows save requests only for
          companies with few calls. Leave empty for 1 day.
        order: 3
      contacts_window_in_days:
        type: integer
        minimum: 1
        maximum: 365
        title: Contacts window size (days)
        description: >-
          Days of new contacts requested per window, read in pages of 50.
          Aircall returns at most 10,000 records per window; lower this if a
          contacts sync fails with the 10,000-results error. Leave empty for 30
          days.
        order: 4
      num_workers:
        type: integer
        minimum: 1
        maximum: 4
        default: 2
        title: Concurrent workers
        description: >-
          Parallel requests. All workers share one budget of 100 requests per
          minute, below Aircall's limit of 120 per company.
        order: 5
    additionalProperties: true

metadata:
  autoImportSchema:
    calls: false
    company: false
    contacts: false
    numbers: false
