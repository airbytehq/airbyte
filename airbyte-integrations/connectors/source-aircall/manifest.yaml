spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - credentials
    properties:
      credentials:
        type: object
        title: Authentication
        description: Choose how to authenticate to Aircall.
        order: 0
        oneOf:
          - type: object
            title: OAuth 2.0
            required:
              - auth_type
              - client_id
              - client_secret
              - access_token
            properties:
              auth_type:
                type: string
                const: oauth2.0
                order: 0
              client_id:
                type: string
                title: Client ID
                description: >-
                  The Client ID that Aircall issued for your Technology Partner
                  app.
                airbyte_secret: true
                order: 1
              client_secret:
                type: string
                title: Client Secret
                description: >-
                  The Client Secret that Aircall issued for your Technology
                  Partner app.
                airbyte_secret: true
                order: 2
              access_token:
                type: string
                title: Access Token
                description: >-
                  The access token Aircall returns when an Admin installs the
                  app. Aircall access tokens do not expire.
                airbyte_secret: true
                order: 3
          - type: object
            title: API Key
            required:
              - auth_type
              - api_id
              - api_token
            properties:
              auth_type:
                type: string
                const: api_key
                order: 0
              api_id:
                type: string
                description: >-
                  Your Aircall API ID. Create an API key in the Aircall Dashboard
                  under Integrations & API > API Keys
                  (https://dashboard.aircall.io/integrations/api-keys).
                title: API ID
                airbyte_secret: true
                order: 1
              api_token:
                type: string
                description: >-
                  The API token shown with the API ID in the Aircall Dashboard
                  under Integrations & API > API Keys
                  (https://dashboard.aircall.io/integrations/api-keys).
                title: API Token
                airbyte_secret: true
                order: 2
      start_date:
        type: string
        description: >-
          Not used since version 0.5.0. Calls are read from the six months of
          history Aircall keeps; the other streams always return every record.
        title: Start date (unused)
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{3})?Z$
        examples:
          - "2022-03-01T00:00:00.000Z"
        format: date-time
        order: 1
      window_in_days:
        type: integer
        minimum: 1
        maximum: 365
        title: Window size (days)
        description: >-
          Days of records requested per API call for the calls and contacts
          streams. Aircall returns at most 10,000 records per request, so lower
          this if a sync fails with the 10,000-results error. Leave empty for 1
          day on calls and 30 days on contacts.
        order: 2
      num_workers:
        type: integer
        minimum: 1
        maximum: 4
        default: 2
        title: Concurrent workers
        description: >-
          Parallel requests. All workers share Aircall's limit of 120 requests
          per minute per company.
        order: 3
    additionalProperties: true
  advanced_auth:
    auth_flow_type: oauth2.0
    predicate_key:
      - credentials
      - auth_type
    predicate_value: oauth2.0
    oauth_config_specification:
      oauth_connector_input_specification:
        consent_url: >-
          https://dashboard.aircall.io/oauth/authorize?{{client_id_param}}&{{redirect_uri_param}}&response_type=code&{{scope_param}}&{{state_param}}
        scope: public_api
        access_token_url: https://api.aircall.io/v1/oauth/token
        access_token_headers:
          Content-Type: application/json
        access_token_params:
          client_id: "{{ client_id_value }}"
          client_secret: "{{ client_secret_value }}"
          code: "{{ auth_code_value }}"
          redirect_uri: "{{ redirect_uri_value }}"
          grant_type: authorization_code
        extract_output:
          - access_token
      complete_oauth_output_specification:
        type: object
        additionalProperties: false
        properties:
          access_token:
            type: string
            path_in_connector_config:
              - credentials
              - access_token
      complete_oauth_server_input_specification:
        type: object
        additionalProperties: false
        properties:
          client_id:
            type: string
          client_secret:
            type: string
      complete_oauth_server_output_specification:
        type: object
        additionalProperties: false
        properties:
          client_id:
            type: string
            path_in_connector_config:
              - credentials
              - client_id
          client_secret:
            type: string
            path_in_connector_config:
              - credentials
              - client_secret
  config_normalization_rules:
    type: ConfigNormalizationRules
    config_migrations:
      - type: ConfigMigration
        description: Move the top-level API ID and API token into credentials.
        transformations:
          - type: ConfigAddFields
            condition: "{{ config.get('api_id') is string and config.get('api_token') is string and (config.get('credentials') or {}).get('auth_type') is not string }}"
            fields:
              - type: AddedFieldDefinition
                path:
                  - credentials
                  - api_id
                value: "{{ config['api_id'] }}"
                value_type: string
              - type: AddedFieldDefinition
                path:
                  - credentials
                  - api_token
                value: "{{ config['api_token'] }}"
                value_type: string
              - type: AddedFieldDefinition
                path:
                  - credentials
                  - auth_type
                value: "api_key"
                value_type: string
          - type: ConfigRemoveFields
            condition: "{{ (config.get('credentials') or {}).get('auth_type') is string }}"
            field_pointers:
              - - api_id
              - - api_token

