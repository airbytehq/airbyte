version: 7.45.0

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - company

api_budget:
  $ref: "#/definitions/api_budget"

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: "{{ config.get('num_workers', 2) }}"
  max_concurrency: 4

definitions:
  api_budget:
    type: HTTPAPIBudget
    policies:
      - type: MovingWindowCallRatePolicy
        rates:
          # Aircall allows 120 requests per minute per company, shared with the company's other integrations.
          - limit: 100
            interval: PT1M
        matchers:
          - type: HttpRequestRegexMatcher
            url_base: https://api.aircall.io
    ratelimit_remaining_header: X-AircallApi-Remaining
    status_codes_for_ratelimit_hit: [429]
  base_requester:
    type: HttpRequester
    url_base: https://api.aircall.io/v1
    authenticator:
      type: BasicHttpAuthenticator
      username: '{{ config["api_id"] }}'
      password: '{{ config["api_token"] }}'
    error_handler:
      $ref: "#/definitions/error_handler"
  # The reference only calls X-AircallApi-Reset a timestamp: its first 10 digits are epoch seconds
  # whether Aircall sends seconds or milliseconds. Resets come within a minute; a later one is a bad header.
  backoff_strategy:
    type: WaitUntilTimeFromHeader
    header: X-AircallApi-Reset
    regex: "^[0-9]{10}"
    max_waiting_time_in_seconds: 300
  response_filters:
    unauthorized:
      type: HttpResponseFilter
      action: FAIL
      failure_type: config_error
      http_codes: [401]
      error_message: >-
        Aircall rejected the API ID and API token (HTTP 401).
        Create a new API key in the Aircall Dashboard (Integrations & API > API
        Keys, https://dashboard.aircall.io/integrations/api-keys) and update
        the connector.
    forbidden:
      type: HttpResponseFilter
      action: FAIL
      failure_type: config_error
      http_codes: [403]
      error_message: >-
        Aircall returned HTTP 403 for {{ request_url }}. Check that the API ID
        and API token are valid (Integrations & API > API Keys,
        https://dashboard.aircall.io/integrations/api-keys) and that your
        Aircall plan includes this data.
    # Aircall answers page 201 of an oversized query with 400 and puts the reason in `errors`
    # ("Your query is limited to 10k results ..."); `message` only says BAD_REQUEST.
    result_limit:
      type: HttpResponseFilter
      action: FAIL
      failure_type: config_error
      predicate: "{{ 'limited to 10k results' in (response.get('errors', '') | string) }}"
      error_message: >-
        Aircall returns at most 10,000 contacts per request window. Lower the
        Contacts window size (days) setting (minimum 1) so each window holds
        fewer than 10,000 contacts.
  error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      - $ref: "#/definitions/backoff_strategy"
    response_filters:
      - $ref: "#/definitions/response_filters/unauthorized"
      - $ref: "#/definitions/response_filters/forbidden"
      - $ref: "#/definitions/response_filters/result_limit"
  paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: page
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: per_page
    pagination_strategy:
      type: PageIncrement
      page_size: 50
      start_from_page: 1
  streams:
    calls:
      type: DeclarativeStream
      name: calls
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /calls
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
            response_filters:
              - type: HttpResponseFilter
                action: SPLIT_REQUEST_WINDOW
                predicate: "{{ 'limited to 10k results' in (response.get('errors', '') | string) }}"
              - $ref: "#/definitions/response_filters/unauthorized"
              - $ref: "#/definitions/response_filters/forbidden"
        request_window_splitting:
          type: RequestWindowSplitting
          failure_message: >-
            Lower the Window size (days) setting so each window holds fewer than
            10,000 calls.
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - calls
        paginator:
          $ref: "#/definitions/paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: started_at
        datetime_format: "%s"
        cursor_datetime_formats:
          - "%s"
        start_time_option:
          type: RequestOption
          field_name: from
          inject_into: request_parameter
        end_time_option:
          type: RequestOption
          field_name: to
          inject_into: request_parameter
        step: P{{ config.get('window_in_days', 1) }}D
        cursor_granularity: PT1S
        lookback_window: P3D
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ (now_utc().timestamp() - 365 * 86400) | int }}"
          datetime_format: "%s"
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().timestamp() | int }}"
          datetime_format: "%s"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/calls"
    company:
      type: DeclarativeStream
      name: company
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /company
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - company
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/company"
    contacts:
      type: DeclarativeStream
      name: contacts
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /contacts
          http_method: GET
          request_parameters:
            from: "{{ 1388534400 + (stream_partition['window_index'] | int) * config.get('contacts_window_in_days', 30) * 86400 }}"
            to: "{{ 1388534400 + ((stream_partition['window_index'] | int) + 1) * config.get('contacts_window_in_days', 30) * 86400 - 1 }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - contacts
        paginator:
          $ref: "#/definitions/paginator"
        partition_router:
          type: ListPartitionRouter
          # One partition per window since 2014-01-01. The CDK Jinja sandbox has no range(),
          # so the loop iterates over a string of window_count characters.
          values: >-
            {% set window_days = config.get('contacts_window_in_days', 30) | int %}
            {% set window_count = (((now_utc().timestamp() | int) - 1388534400) //
            (window_days * 86400)) + 1 %}
            [{% for _ in 'x' * window_count %}'{{ loop.index0 }}'{{ ',' if not loop.last }}{% endfor %}]
          cursor_field: window_index
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/contacts"
    numbers:
      type: DeclarativeStream
      name: numbers
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /numbers
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - numbers
        paginator:
          $ref: "#/definitions/paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: created_at
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%S.%f%z"
          - "%Y-%m-%dT%H:%M:%S%z"
        datetime_format: "%Y-%m-%dT%H:%M:%S.%f%z"
        start_datetime:
          type: MinMaxDatetime
          datetime: "2014-01-01T00:00:00.000000+0000"
          datetime_format: "%Y-%m-%dT%H:%M:%S.%f%z"
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%S.%f%z') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%S.%f%z"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/numbers"
    tags:
