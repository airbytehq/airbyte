        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - users
        paginator:
          $ref: "#/definitions/paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/user_availability"
    users:
      type: DeclarativeStream
      name: users
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
