version: 7.45.0

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - company

api_budget:
  $ref: "#/definitions/api_budget"

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: "{{ config.get('num_workers', 2) }}"
  max_concurrency: 4

definitions:
  api_budget:
    type: HTTPAPIBudget
    policies:
      - type: MovingWindowCallRatePolicy
        rates:
          # Aircall allows 120 requests per minute per company, shared with the company's other integrations.
          - limit: 100
            interval: PT1M
        matchers:
          - type: HttpRequestRegexMatcher
            url_base: https://api.aircall.io
    ratelimit_remaining_header: X-AircallApi-Remaining
    status_codes_for_ratelimit_hit: [429]
  base_requester:
    type: HttpRequester
    url_base: https://api.aircall.io/v1
    authenticator:
      type: SelectiveAuthenticator
      authenticator_selection_path:
        - credentials
        - auth_type
      authenticators:
        oauth2.0:
          type: BearerAuthenticator
          api_token: '{{ config["credentials"]["access_token"] }}'
        api_key:
          type: BasicHttpAuthenticator
          username: '{{ config["credentials"]["api_id"] }}'
          password: '{{ config["credentials"]["api_token"] }}'
    error_handler:
      $ref: "#/definitions/error_handler"
  # The reference only calls X-AircallApi-Reset a timestamp: its first 10 digits are epoch seconds
  # whether Aircall sends seconds or milliseconds. Resets come within a minute; a later one is a bad header.
  backoff_strategy:
    type: WaitUntilTimeFromHeader
    header: X-AircallApi-Reset
    regex: "^[0-9]{10}"
    max_waiting_time_in_seconds: 300
  response_filters:
    unauthorized:
      type: HttpResponseFilter
      action: FAIL
      failure_type: config_error
      http_codes: [401]
      error_message: >-
        Aircall rejected the credentials (HTTP 401). If you use OAuth,
        re-authenticate the connector. If you use an API key, create a new API
        key in the Aircall Dashboard (Integrations & API > API Keys,
        https://dashboard.aircall.io/integrations/api-keys) and update the
        connector.
    forbidden:
      type: HttpResponseFilter
      action: FAIL
      failure_type: config_error
      http_codes: [403]
      error_message: >-
        Aircall returned HTTP 403 for {{ request_url }}. If you use OAuth,
        re-authenticate the connector; if you use an API key, check that it
        still exists (Integrations & API > API Keys,
        https://dashboard.aircall.io/integrations/api-keys). Also check that
        your Aircall plan includes this data.
    # Aircall answers page 201 of an oversized query with 400 and puts the reason in `errors`
    # ("Your query is limited to 10k results ..."); `message` only says BAD_REQUEST.
    result_limit:
      type: HttpResponseFilter
      action: FAIL
      failure_type: config_error
      predicate: "{{ 'limited to 10k results' in (response.get('errors', '') | string) }}"
      error_message: >-
        Aircall returns at most 10,000 contacts per request window. Lower the
        Contacts window size (days) setting (minimum 1) so each window holds
        fewer than 10,000 contacts.
    # The reference documents this 403 only as "The Conversations API is not enabled for this
    # Company."; the gateway's {"message": "Forbidden"} for a revoked key does not say it.
    conversations_not_enabled:
      type: HttpResponseFilter
      action: IGNORE
      predicate: >-
        {{ response is mapping and 'conversations' not in response and 'engagements' not in response
        and 'not enabled for this company' in (response | string | lower) }}
      error_message: >-
        Ignoring {{ request_url }}: the Conversations API is not enabled for
        this Aircall company (HTTP 403).
    trackers_not_enabled:
      type: HttpResponseFilter
      action: IGNORE
      predicate: >-
        {{ response is mapping and 'trackers' not in response
        and 'cannot access this feature' in (response | string | lower) }}
      error_message: >-
        Skipping the trackers stream: this Aircall company does not have the
        AI Assist or AI Assist Pro package (HTTP 403).
    # Documented 403 bodies: "line is not configured to use whatsapp", "line does not belong to the
    # company" (a number deleted during the sync); sibling WhatsApp endpoints say "line does not have
    # WhatsApp capability".
    whatsapp_not_configured:
      type: HttpResponseFilter
      action: IGNORE
      predicate: >-
        {{ response is mapping and 'templates' not in response
        and ('not configured to use whatsapp' in (response | string | lower)
        or 'does not have whatsapp capability' in (response | string | lower)
        or 'does not belong to the company' in (response | string | lower)) }}
      error_message: >-
        Ignoring {{ request_url }}: this number is not registered for WhatsApp
        or no longer belongs to the company (HTTP 403).
  error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      - $ref: "#/definitions/backoff_strategy"
    response_filters:
      - $ref: "#/definitions/response_filters/unauthorized"
      - $ref: "#/definitions/response_filters/forbidden"
      - $ref: "#/definitions/response_filters/result_limit"
  paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: page
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: per_page
    pagination_strategy:
      type: PageIncrement
      page_size: 50
      start_from_page: 1
  cursor_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: cursor
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: per_page
    pagination_strategy:
      type: CursorPagination
      page_size: 50
      cursor_value: "{{ response.get('meta', {}).get('next_cursor') }}"
      stop_condition: "{{ not response.get('meta', {}).get('next_cursor') }}"
  streams:
    calls:
      type: DeclarativeStream
      name: calls
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /calls
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
            response_filters:
              - type: HttpResponseFilter
                action: SPLIT_REQUEST_WINDOW
                predicate: "{{ 'limited to 10k results' in (response.get('errors', '') | string) }}"
              - $ref: "#/definitions/response_filters/unauthorized"
              - $ref: "#/definitions/response_filters/forbidden"
        request_window_splitting:
          type: RequestWindowSplitting
          failure_message: >-
            Lower the Window size (days) setting so each window holds fewer than
            10,000 calls.
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - calls
        paginator:
          $ref: "#/definitions/paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: started_at
        datetime_format: "%s"
        cursor_datetime_formats:
          - "%s"
        start_time_option:
          type: RequestOption
          field_name: from
          inject_into: request_parameter
        end_time_option:
          type: RequestOption
          field_name: to
          inject_into: request_parameter
        step: P{{ config.get('window_in_days', 1) }}D
        cursor_granularity: PT1S
        lookback_window: P3D
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ (now_utc().timestamp() - 186 * 86400) | int }}"
          datetime_format: "%s"
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().timestamp() | int }}"
          datetime_format: "%s"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/calls"
    company:
      type: DeclarativeStream
      name: company
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /company
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - company
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/company"
    contacts:
      type: DeclarativeStream
      name: contacts
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /contacts
          http_method: GET
          request_parameters:
            from: "{{ 1388534400 + (stream_partition['window_index'] | int) * config.get('contacts_window_in_days', 30) * 86400 }}"
            to: "{{ 1388534400 + ((stream_partition['window_index'] | int) + 1) * config.get('contacts_window_in_days', 30) * 86400 - 1 }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - contacts
        paginator:
          $ref: "#/definitions/paginator"
        partition_router:
          type: ListPartitionRouter
          # One partition per window since 2014-01-01. The CDK Jinja sandbox has no range(),
          # so the loop iterates over a string of window_count characters.
          values: >-
            {% set window_days = config.get('contacts_window_in_days', 30) | int %}
            {% set window_count = (((now_utc().timestamp() | int) - 1388534400) //
            (window_days * 86400)) + 1 %}
            [{% for _ in 'x' * window_count %}'{{ loop.index0 }}'{{ ',' if not loop.last }}{% endfor %}]
          cursor_field: window_index
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/contacts"
    numbers:
      type: DeclarativeStream
      name: numbers
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /numbers
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - numbers
        paginator:
          $ref: "#/definitions/paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/numbers"
    tags:
      type: DeclarativeStream
      name: tags
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /tags
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - tags
        paginator:
          $ref: "#/definitions/paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/tags"
    user_availability:
      type: DeclarativeStream
      name: user_availability
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /users/availabilities
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - users
        paginator:
          $ref: "#/definitions/paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/user_availability"
    users:
      type: DeclarativeStream
      name: users
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          url_base: https://api.aircall.io/v2
          path: /users
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - users
        paginator:
          $ref: "#/definitions/paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/users"
    teams:
      type: DeclarativeStream
      name: teams
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /teams
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - teams
        paginator:
          $ref: "#/definitions/paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/teams"
    webhooks:
      type: DeclarativeStream
      name: webhooks
      primary_key:
        - webhook_id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /webhooks
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - webhooks
        paginator:
          $ref: "#/definitions/paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/webhooks"
    conversations:
      type: DeclarativeStream
      name: conversations
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /conversations
          http_method: GET
          request_parameters:
            order: asc
          error_handler:
            type: DefaultErrorHandler
            backoff_strategies:
              - $ref: "#/definitions/backoff_strategy"
            response_filters:
              - $ref: "#/definitions/response_filters/conversations_not_enabled"
              - $ref: "#/definitions/response_filters/unauthorized"
              - $ref: "#/definitions/response_filters/forbidden"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - conversations
        paginator:
          $ref: "#/definitions/paginator"
        # Aircall rejects page 201 (page * per_page above 10,000). Records come sorted by
        # last_engagement_at ascending (order=asc), so after 10,000 records the read restarts
        # from the last record's timestamp instead of asking for page 201.
        pagination_reset:
          type: PaginationReset
          action: SPLIT_USING_CURSOR
          limits:
            type: PaginationResetLimits
            number_of_records: 10000
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: last_engagement_at
        datetime_format: "%s"
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%S.%f%z"
          - "%Y-%m-%dT%H:%M:%S%z"
        start_time_option:
          type: RequestOption
          field_name: from
          inject_into: request_parameter
        end_time_option:
          type: RequestOption
          field_name: to
          inject_into: request_parameter
        step: P30D
        cursor_granularity: PT1S
        lookback_window: P3D
        start_datetime:
          type: MinMaxDatetime
          datetime: "1388534400"
          datetime_format: "%s"
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().timestamp() | int }}"
          datetime_format: "%s"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/conversations"
    conversation_engagements:
      type: DeclarativeStream
      name: conversation_engagements
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /conversations/{{ stream_partition['conversation_id'] }}/engagements
          http_method: GET
          error_handler:
            type: DefaultErrorHandler
            backoff_strategies:
              - $ref: "#/definitions/backoff_strategy"
            response_filters:
              - $ref: "#/definitions/response_filters/conversations_not_enabled"
              # Engagements come newest first and stop at 10,000 per conversation (no date filter).
              - type: HttpResponseFilter
                action: IGNORE
                predicate: >-
                  {{ response is mapping and 'engagements' not in response
                  and ('10000' in (response | string) or '10,000' in (response | string)
                  or '10k results' in (response | string)) }}
                error_message: >-
                  Aircall returns at most the 10,000 most recent engagements of a
                  conversation; older engagements of {{ request_url }} are not
                  synced.
              # The conversation was deleted after the conversations read
              # (documented 404: "No Conversation exists with this id for the Company.").
              - type: HttpResponseFilter
                action: IGNORE
                predicate: "{{ response is mapping and 'conversation exists' in (response | string | lower) }}"
                error_message: "Ignoring {{ request_url }}: the conversation no longer exists (HTTP 404)."
              - $ref: "#/definitions/response_filters/unauthorized"
              - $ref: "#/definitions/response_filters/forbidden"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - engagements
        paginator:
          $ref: "#/definitions/paginator"
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              partition_field: conversation_id
              incremental_dependency: true
              stream:
                $ref: "#/definitions/streams/conversations"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: created_at
        global_substream_cursor: true
        datetime_format: "%Y-%m-%dT%H:%M:%S.%f%z"
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%S.%f%z"
          - "%Y-%m-%dT%H:%M:%S%z"
        start_datetime:
          type: MinMaxDatetime
          datetime: "2014-01-01T00:00:00.000000+0000"
          datetime_format: "%Y-%m-%dT%H:%M:%S.%f%z"
        # The slices are never sent (no request options); a far end keeps an engagement dated in the
        # future from leaving later syncs with an empty slice for every conversation.
        end_datetime:
          type: MinMaxDatetime
          datetime: "2100-01-01T00:00:00.000000+0000"
          datetime_format: "%Y-%m-%dT%H:%M:%S.%f%z"
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - conversation_id
              value: "{{ stream_partition['conversation_id'] }}"
              value_type: integer
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/conversation_engagements"
    campaigns:
      type: DeclarativeStream
      name: campaigns
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /campaigns
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - campaigns
        paginator:
          $ref: "#/definitions/cursor_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/campaigns"
    campaign_outcomes:
      type: DeclarativeStream
      name: campaign_outcomes
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /campaign_outcomes
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - campaign_outcomes
        paginator:
          $ref: "#/definitions/cursor_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/campaign_outcomes"
    trackers:
      type: DeclarativeStream
      name: trackers
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /trackers
          http_method: GET
          error_handler:
            type: DefaultErrorHandler
            backoff_strategies:
              - $ref: "#/definitions/backoff_strategy"
            response_filters:
              - $ref: "#/definitions/response_filters/trackers_not_enabled"
              - $ref: "#/definitions/response_filters/unauthorized"
              - $ref: "#/definitions/response_filters/forbidden"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - trackers
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/trackers"
    sms_templates:
      type: DeclarativeStream
      name: sms_templates
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /sms/templates
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - templates
        paginator:
          $ref: "#/definitions/paginator"
          pagination_strategy:
            type: PageIncrement
            page_size: 100
            start_from_page: 1
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/sms_templates"
    whatsapp_templates:
      type: DeclarativeStream
      name: whatsapp_templates
      primary_key:
        - number_id
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /numbers/{{ stream_partition['number_id'] }}/templates
          http_method: GET
          error_handler:
            type: DefaultErrorHandler
            backoff_strategies:
              - $ref: "#/definitions/backoff_strategy"
            response_filters:
              - $ref: "#/definitions/response_filters/whatsapp_not_configured"
              - $ref: "#/definitions/response_filters/unauthorized"
              - $ref: "#/definitions/response_filters/forbidden"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - templates
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: token
          pagination_strategy:
            type: CursorPagination
            cursor_value: "{{ response.get('pageInfo', {}).get('nextToken') }}"
            stop_condition: >-
              {{ not response.get('templates') or response.get('pageInfo', {}).get('nextToken') is none }}
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              partition_field: number_id
              stream:
                $ref: "#/definitions/streams/numbers"
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - number_id
              value: "{{ stream_partition['number_id'] }}"
              value_type: integer
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/whatsapp_templates"
streams:
  - $ref: "#/definitions/streams/calls"
  - $ref: "#/definitions/streams/company"
  - $ref: "#/definitions/streams/contacts"
  - $ref: "#/definitions/streams/numbers"
  - $ref: "#/definitions/streams/tags"
  - $ref: "#/definitions/streams/user_availability"
  - $ref: "#/definitions/streams/users"
  - $ref: "#/definitions/streams/teams"
  - $ref: "#/definitions/streams/webhooks"
  - $ref: "#/definitions/streams/conversations"
  - $ref: "#/definitions/streams/conversation_engagements"
  - $ref: "#/definitions/streams/campaigns"
  - $ref: "#/definitions/streams/campaign_outcomes"
  - $ref: "#/definitions/streams/trackers"
  - $ref: "#/definitions/streams/sms_templates"
  - $ref: "#/definitions/streams/whatsapp_templates"

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - credentials
    properties:
      credentials:
        type: object
        title: Authentication
        description: >-
          Choose how to authenticate to Aircall. With OAuth 2.0, Aircall returns
          only the webhooks created with Airbyte's token, so the webhooks stream
          is usually empty; use API Key to sync your company's webhooks.
        order: 0
        oneOf:
          - type: object
            title: OAuth 2.0
            required:
              - auth_type
              - client_id
              - client_secret
              - access_token
            properties:
              auth_type:
                type: string
                const: oauth2.0
                order: 0
              client_id:
                type: string
                title: Client ID
                description: >-
                  The Client ID that Aircall issued for your Technology Partner
                  app.
                airbyte_secret: true
                order: 1
              client_secret:
                type: string
                title: Client Secret
                description: >-
                  The Client Secret that Aircall issued for your Technology
                  Partner app.
                airbyte_secret: true
                order: 2
              access_token:
                type: string
                title: Access Token
                description: >-
                  The access token Aircall returns when an Admin installs the
                  app. Aircall access tokens do not expire.
                airbyte_secret: true
                order: 3
          - type: object
            title: API Key
            required:
              - auth_type
              - api_id
              - api_token
            properties:
              auth_type:
                type: string
                const: api_key
                order: 0
              api_id:
                type: string
                description: >-
                  Your Aircall API ID. Create an API key in the Aircall Dashboard
                  under Integrations & API > API Keys
                  (https://dashboard.aircall.io/integrations/api-keys).
                title: API ID
                airbyte_secret: true
                order: 1
              api_token:
                type: string
                description: >-
                  The API token shown with the API ID in the Aircall Dashboard
                  under Integrations & API > API Keys
                  (https://dashboard.aircall.io/integrations/api-keys).
                title: API Token
                airbyte_secret: true
                order: 2
      start_date:
        type: string
        description: >-
          Saved by versions before 0.5.0 and no longer used. Calls are read from
          the six months of history Aircall keeps; the other streams always return
          every record.
        title: Start date (before 0.5.0)
        airbyte_hidden: true
        order: 1
      window_in_days:
        type: integer
        minimum: 1
        maximum: 365
        title: Window size (days)
        description: >-
          Days of calls requested per window, read in pages of 50. Aircall
          returns at most 10,000 records per window, and a calls window above
          that is split and read again, so larger windows save requests only for
          companies with few calls. Leave empty for 1 day.
        order: 2
      contacts_window_in_days:
        type: integer
        minimum: 1
        maximum: 365
        title: Contacts window size (days)
        description: >-
          Days of new contacts requested per window, read in pages of 50.
          Aircall returns at most 10,000 records per window; lower this if a
          contacts sync fails with the 10,000-results error. Leave empty for 30
          days.
        order: 3
      num_workers:
        type: integer
        minimum: 1
        maximum: 4
        default: 2
        title: Concurrent workers
        description: >-
          Parallel requests. All workers share one budget of 100 requests per
          minute, below Aircall's limit of 120 per company.
        order: 4
    additionalProperties: true
  advanced_auth:
    auth_flow_type: oauth2.0
    predicate_key:
      - credentials
      - auth_type
    predicate_value: oauth2.0
    oauth_config_specification:
      oauth_connector_input_specification:
        consent_url: >-
          https://dashboard.aircall.io/oauth/authorize?{{client_id_param}}&{{redirect_uri_param}}&response_type=code&{{scope_param}}&{{state_param}}
        scope: public_api
        access_token_url: https://api.aircall.io/v1/oauth/token
        access_token_headers:
          Content-Type: application/json
        access_token_params:
          client_id: "{{ client_id_value }}"
          client_secret: "{{ client_secret_value }}"
          code: "{{ auth_code_value }}"
          redirect_uri: "{{ redirect_uri_value }}"
          grant_type: authorization_code
        extract_output:
          - access_token
      complete_oauth_output_specification:
        type: object
        additionalProperties: false
        properties:
          access_token:
            type: string
            path_in_connector_config:
              - credentials
              - access_token
      complete_oauth_server_input_specification:
        type: object
        additionalProperties: false
        properties:
          client_id:
            type: string
          client_secret:
            type: string
      complete_oauth_server_output_specification:
        type: object
        additionalProperties: false
        properties:
          client_id:
            type: string
            path_in_connector_config:
              - credentials
              - client_id
          client_secret:
            type: string
            path_in_connector_config:
              - credentials
              - client_secret
  # Moves the top-level API key of configs saved before 1.1.0 into `credentials`. ConfigAddFields
  # evaluates its condition before each field on the config it is changing, so `auth_type` stays last.
  config_normalization_rules:
    type: ConfigNormalizationRules
    config_migrations:
      - type: ConfigMigration
        description: Move the top-level API ID and API token into credentials.
        transformations:
          - type: ConfigAddFields
            condition: "{{ config.get('api_id') is string and config.get('api_token') is string and (config.get('credentials') or {}).get('auth_type') is not string }}"
            fields:
              - type: AddedFieldDefinition
                path:
                  - credentials
                  - api_id
                value: "{{ config['api_id'] }}"
                value_type: string
              - type: AddedFieldDefinition
                path:
                  - credentials
                  - api_token
                value: "{{ config['api_token'] }}"
                value_type: string
              - type: AddedFieldDefinition
                path:
                  - credentials
                  - auth_type
                value: "api_key"
                value_type: string
          - type: ConfigRemoveFields
            condition: "{{ (config.get('credentials') or {}).get('auth_type') is string }}"
            field_pointers:
              - - api_id
              - - api_token

