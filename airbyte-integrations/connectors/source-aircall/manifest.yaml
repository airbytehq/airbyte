version: 7.45.0

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - company

api_budget:
  $ref: "#/definitions/api_budget"

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: "{{ config.get('num_workers', 2) }}"
  max_concurrency: 4

definitions:
  api_budget:
    type: HTTPAPIBudget
    policies:
      - type: MovingWindowCallRatePolicy
        rates:
          - limit: 120
            interval: PT1M
        matchers:
          - type: HttpRequestRegexMatcher
            url_base: https://api.aircall.io
    ratelimit_remaining_header: X-AircallApi-Remaining
    status_codes_for_ratelimit_hit: [429]
  base_requester:
    type: HttpRequester
    url_base: https://api.aircall.io/v1
    authenticator:
      type: SelectiveAuthenticator
      authenticator_selection_path:
        - credentials
        - auth_type
      authenticators:
        oauth2.0:
          type: BearerAuthenticator
          api_token: '{{ config["credentials"]["access_token"] }}'
        api_key:
          type: BasicHttpAuthenticator
          username: '{{ config["credentials"]["api_id"] }}'
          password: '{{ config["credentials"]["api_token"] }}'
    error_handler:
      $ref: "#/definitions/error_handler"
  error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      - type: WaitUntilTimeFromHeader
        header: X-AircallApi-Reset
        min_wait: 1
    response_filters:
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes: [401]
        error_message: >-
          Aircall rejected the credentials (HTTP 401). If you use OAuth,
          re-authenticate the connector. If you use an API key, create a new API
          key in the Aircall Dashboard (Integrations & API > API Keys,
          https://dashboard.aircall.io/integrations/api-keys) and update the
          connector.
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes: [403]
        error_message: >-
          Aircall rejected the credentials (HTTP 403). If you use OAuth,
          re-authenticate the connector. If you use an API key, create a new API
          key in the Aircall Dashboard (Integrations & API > API Keys,
          https://dashboard.aircall.io/integrations/api-keys) and update the
          connector.
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes: [400]
        error_message_contains: "limited to 10k results"
        error_message: >-
          Aircall returns at most 10,000 calls or contacts per request window.
          Lower the Window size (days) setting so each window holds fewer than
          10,000 records.
      - type: HttpResponseFilter
        action: RATE_LIMITED
        http_codes: [429]
      - type: HttpResponseFilter
        action: RETRY
        http_codes: [500, 502, 503, 504]
  paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: page
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: per_page
    pagination_strategy:
      type: PageIncrement
      page_size: 50
      start_from_page: 1
  streams:
    calls:
      type: DeclarativeStream
      name: calls
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /calls
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - calls
        paginator:
          $ref: "#/definitions/paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: started_at
        datetime_format: "%s"
        cursor_datetime_formats:
          - "%s"
        start_time_option:
          type: RequestOption
          field_name: from
          inject_into: request_parameter
        end_time_option:
          type: RequestOption
          field_name: to
          inject_into: request_parameter
        step: P{{ config.get('window_in_days', 1) }}D
        cursor_granularity: PT1S
        lookback_window: P3D
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ (now_utc().timestamp() - 186 * 86400) | int }}"
          datetime_format: "%s"
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().timestamp() | int }}"
          datetime_format: "%s"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/calls"
    company:
      type: DeclarativeStream
      name: company
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /company
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - company
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/company"
    contacts:
      type: DeclarativeStream
      name: contacts
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /contacts
          http_method: GET
          request_parameters:
            from: "{{ 1388534400 + (stream_partition['window_index'] | int) * config.get('window_in_days', 30) * 86400 }}"
            to: "{{ 1388534400 + ((stream_partition['window_index'] | int) + 1) * config.get('window_in_days', 30) * 86400 - 1 }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - contacts
        paginator:
          $ref: "#/definitions/paginator"
        partition_router:
          type: ListPartitionRouter
          values: >-
            {% set window_days = config.get('window_in_days', 30) | int %}
            {% set window_count = (((now_utc().timestamp() | int) - 1388534400) //
            (window_days * 86400)) + 1 %}
            [{% for _ in 'x' * window_count %}'{{ loop.index0 }}'{{ ',' if not loop.last }}{% endfor %}]
          cursor_field: window_index
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/contacts"
    numbers:
      type: DeclarativeStream
      name: numbers
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
