[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-youtube-data-tests"
version = "0.0.0"
description = "Unit tests for source-youtube-data"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10,<3.13"
airbyte-cdk = "~7.26.0"
pytest = "^8"
freezegun = "^1.4.0"
requests-mock = "^1.12.1"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*"
]
