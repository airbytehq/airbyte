metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - www.googleapis.com
      - oauth2.googleapis.com
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  suggestedStreams:
    streams:
      - channels
      - videos
      - comments
      - channel_comments
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-youtube-data
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.28.3@sha256:6c926ab34644e3fb6f5422aea148599eef8a8d877cd8b8b28b3e7af914d93bbf
  connectorSubtype: api
  maxSecondsBetweenMessages: 5400
  connectorType: source
  definitionId: 743a2a44-fd13-4109-a8fe-fb0e68f467f5
  dockerImageTag: 0.0.65
  dockerRepository: airbyte/source-youtube-data
  githubIssueLabel: source-youtube-data
  icon: icon.svg
  license: ELv2
  name: Youtube Data
  releaseDate: 2024-11-08
  releaseStage: generally_available
  supportLevel: certified
  documentationUrl: https://docs.airbyte.com/integrations/sources/youtube-data
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 300
    sl: 200
  connectorTestSuitesOptions:
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_YOUTUBE-DATA_CREDS
          fileName: config_oauth.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_YOUTUBE-DATA_API_KEY_CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: YouTube Data API v3
      url: https://developers.google.com/youtube/v3
      type: api_reference
    - title: YouTube API changelog
      url: https://developers.google.com/youtube/v3/revision_history
      type: api_release_history
    - title: Google OAuth 2.0
      url: https://developers.google.com/identity/protocols/oauth2
      type: authentication_guide
    - title: YouTube API quotas
      url: https://developers.google.com/youtube/v3/getting-started#quota
      type: rate_limits
