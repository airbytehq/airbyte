metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - www.googleapis.com
      - oauth2.googleapis.com
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  suggestedStreams:
    streams:
      - channels
      - video
      - comments
      - channel_comments
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-youtube-data
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.28.4@sha256:da2dee37f8b6532edfcbde6b5402a14e5d7364b2b7dbfbcb61e9cad85c25fe63
  connectorSubtype: api
  maxSecondsBetweenMessages: 5400
  connectorType: source
  definitionId: 743a2a44-fd13-4109-a8fe-fb0e68f467f5
  dockerImageTag: 1.0.1
  dockerRepository: airbyte/source-youtube-data
  githubIssueLabel: source-youtube-data
  icon: icon.svg
  license: ELv2
  name: Youtube Data
  releases:
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
    breakingChanges:
      1.0.0:
        message: "Version 1.0.0 declares primary keys on the `comments`, `videos`, and `channel_comments` streams, adds `date-time` formats to nine timestamp fields, and restricts the `videos` stream to actual video results (it previously also returned channel and playlist id records). After upgrading, refresh the source schema. Resetting streams is only needed for Full Refresh | Overwrite connections or destinations that cannot retype columns in place; see the migration guide before clearing Full Refresh | Append streams. For more information, see the [migration guide](https://docs.airbyte.com/integrations/sources/youtube-data-migrations)."
        upgradeDeadline: "2026-10-31"
        deadlineAction: "auto_upgrade"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - "comments"
              - "videos"
              - "channel_comments"
              - "video"
              - "channels"
  releaseDate: 2024-11-08
  releaseStage: generally_available
  supportLevel: certified
  documentationUrl: https://docs.airbyte.com/integrations/sources/youtube-data
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 300
    sl: 200
  connectorTestSuitesOptions:
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_YOUTUBE-DATA_CREDS
          fileName: config_oauth.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: YouTube Data API v3
      url: https://developers.google.com/youtube/v3
      type: api_reference
    - title: YouTube API changelog
      url: https://developers.google.com/youtube/v3/revision_history
      type: api_release_history
    - title: Google OAuth 2.0
      url: https://developers.google.com/identity/protocols/oauth2
      type: authentication_guide
    - title: YouTube API quotas
      url: https://developers.google.com/youtube/v3/getting-started#quota
      type: rate_limits
