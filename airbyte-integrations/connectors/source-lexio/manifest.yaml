          `PATCH /categories/{categoryId}`).'
      isDefault:
        type: boolean
        description: 'Forfait retenu quand une offre omet `mileagePackageId`. Au plus un par organisation
          : en désigner un autre retire ce statut à l’ancien ; un forfait par défaut est toujours actif.
          Sans forfait par défaut : kilométrage illimité.'
