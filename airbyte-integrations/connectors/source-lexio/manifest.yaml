version: 7.0.4
type: DeclarativeSource
description: Sync the fleet, catalogue, customers, rentals and maintenance records of a Lexio Rent organization,
  plus its rental change feed, from the Lexio Rent API v1.
check:
  type: CheckStream
  stream_names:
  - categories
definitions:
  base_requester:
    type: HttpRequester
    url_base: '{{ config.get(''api_url'') or ''https://api.lexio.rent/api/external/v1'' }}'
    http_method: GET
    authenticator:
      type: BearerAuthenticator
      api_token: '{{ config[''api_key''] }}'
    request_headers:
      Accept: application/json
    error_handler:
      type: DefaultErrorHandler
      max_retries: 5
      response_filters:
      - type: HttpResponseFilter
        action: RETRY
        http_codes:
        - 429
        - 500
        - 502
        - 503
        - 504
      - type: HttpResponseFilter
        action: FAIL
        http_codes:
        - 401
        - 403
        error_message: 'Lexio refused the API key or its scopes: {{ response.get(''detail'') }}'
      backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
      - type: ExponentialBackoffStrategy
        factor: 5
  paginator:
    type: DefaultPaginator
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: limit
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: cursor
    pagination_strategy:
      type: CursorPagination
      page_size: 100
      cursor_value: '{{ response.get(''nextCursor'') }}'
      stop_condition: '{{ not response.get(''nextCursor'') or response.get(''data'', []) | length < 100
        }}'
streams:
- type: DeclarativeStream
  name: vehicles
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /vehicles
      request_parameters:
        isArchived: 'false'
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path:
        - data
    paginator:
      $ref: '#/definitions/paginator'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/vehicles'
- type: DeclarativeStream
  name: categories
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /categories
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path:
        - data
    paginator:
      $ref: '#/definitions/paginator'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/categories'
- type: DeclarativeStream
  name: locations
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /locations
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path:
        - data
    paginator:
      $ref: '#/definitions/paginator'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/locations'
- type: DeclarativeStream
  name: options
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /options
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path:
        - data
    paginator:
      $ref: '#/definitions/paginator'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/options'
- type: DeclarativeStream
  name: deductibles
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /deductibles
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path:
        - data
    paginator:
      $ref: '#/definitions/paginator'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/deductibles'
- type: DeclarativeStream
  name: deposits
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /deposits
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path:
        - data
    paginator:
      $ref: '#/definitions/paginator'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/deposits'
- type: DeclarativeStream
  name: mileage_packages
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /mileage-packages
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path:
        - data
    paginator:
      $ref: '#/definitions/paginator'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/mileage_packages'
- type: DeclarativeStream
  name: customers
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /customers
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path:
        - data
    paginator:
      $ref: '#/definitions/paginator'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/customers'
- type: DeclarativeStream
  name: rentals
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /rentals
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path:
        - data
    paginator:
      $ref: '#/definitions/paginator'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/rentals'
- type: DeclarativeStream
  name: maintenance_records
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /maintenance-records
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path:
        - data
    paginator:
      $ref: '#/definitions/paginator'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/maintenance_records'
- type: DeclarativeStream
  name: events
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /events
      request_parameters:
        start: EARLIEST
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path:
        - data
    paginator:
      $ref: '#/definitions/paginator'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/events'
  incremental_sync:
    type: DatetimeBasedCursor
    cursor_field: occurredAt
    cursor_datetime_formats:
    - '%Y-%m-%dT%H:%M:%S.%f%z'
    - '%Y-%m-%dT%H:%M:%S%z'
    datetime_format: '%Y-%m-%dT%H:%M:%S.%f%z'
    start_datetime:
      type: MinMaxDatetime
      datetime: '{{ (now_utc() - duration(''P29D'')).strftime(''%Y-%m-%dT%H:%M:%S.%f'') ~ ''+0000'' }}'
      datetime_format: '%Y-%m-%dT%H:%M:%S.%f%z'
    is_client_side_incremental: true
spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
    - api_key
    properties:
      api_key:
        type: string
        title: API Key
        description: Lexio API key (starts with lck_). Create it in Lexio under Settings > Developer >
          API tokens. API access is part of the Business plan.
        airbyte_secret: true
        order: 0
      api_url:
        type: string
        title: API URL
        description: Base URL of the Lexio Rent API v1. Leave the default unless Lexio support tells you
          otherwise.
        default: https://api.lexio.rent/api/external/v1
        order: 1
    additionalProperties: true
metadata:
  autoImportSchema:
    vehicles: false
    categories: false
    locations: false
    options: false
    deductibles: false
    deposits: false
    mileage_packages: false
    customers: false
    rentals: false
    maintenance_records: false
    events: false
schemas:
  vehicles:
    type: object
    properties:
      id:
        type: string
        format: uuid
        description: Identifiant du véhicule.
      plate:
        description: Immatriculation, en majuscules ; null si le véhicule n’en a pas. Une plaque ou un
          numéro de série est toujours présent.
        type:
        - string
        - 'null'
      serialNumber:
        description: Numéro de série (deux-roues non immatriculé, par exemple) ; null si absent.
        type:
        - string
        - 'null'
      vin:
        anyOf:
        - type: string
          maxLength: 17
        - type: 'null'
        description: Numéro d’identification du véhicule (VIN, 17 caractères au plus) ; null si absent.
      name:
        anyOf:
        - type: string
          maxLength: 100
        - type: 'null'
        description: Nom d’usage donné par le loueur (ex. « 208 blanche ») ; null si absent.
      brand:
        type: string
        maxLength: 50
        description: Marque (ex. Peugeot).
      model:
        type: string
        maxLength: 50
        description: Modèle (ex. 208).
      description:
        anyOf:
        - type: string
          maxLength: 1000
        - type: 'null'
        description: Description libre ; null si absente.
      color:
        anyOf:
        - type: string
          maxLength: 30
        - type: 'null'
        description: Couleur, en texte libre ; null si absente.
      vehicleType:
        type: string
        enum:
        - CITY
        - COMPACT
        - CROSSOVER
        - SEDAN
        - BREAK
        - SUV
        - OFF_ROAD
        - PICKUP
        - MINIVAN
        - VAN
        - UTILITY
        - COUPE
        - CONVERTIBLE
        - SPORT
        - LUXURY
        - MOTORCYCLE
        - SCOOTER
        description: 'Type de véhicule : il fixe la famille et les champs applicables.'
      family:
        type: string
        enum:
        - CAR
        - TWO_WHEELER
        description: Famille, déduite de `vehicleType`.
      energy:
        type: string
        enum:
        - FUEL
        - ELECTRIC
        description: Énergie, déduite de `fuelType`.
      fuelType:
        type: string
        enum:
        - PETROL
        - DIESEL
        - LPG
        - HYBRID
        - PLUGIN_HYBRID
        - ELECTRIC
        description: 'Carburant ou motorisation : il fixe l’énergie et les champs applicables.'
      transmission:
        anyOf:
        - type: string
          enum:
          - MANUAL
          - AUTOMATIC
        - type: 'null'
        description: Boîte de vitesses ; null si non applicable au profil (deux-roues électrique).
      seats:
        type: integer
        minimum: 1
        maximum: 50
        description: 'Nombre de places : 1 à 50 pour une voiture, 1 à 3 pour un deux-roues.'
      doors:
        anyOf:
        - type: integer
          minimum: 2
          maximum: 10
        - type: 'null'
        description: Nombre de portes ; null pour un deux-roues.
      modelYear:
        anyOf:
        - type: integer
          minimum: 1900
          maximum: 2100
        - type: 'null'
        description: Année modèle ; null si inconnue.
      registrationDate:
        anyOf:
        - type: string
          format: date
        - type: 'null'
        description: Date de première immatriculation (`YYYY-MM-DD`), jamais dans le futur ; null si inconnue.
      odometerKm:
        type: integer
        minimum: 0
        maximum: 10000000
        description: Kilométrage au compteur, en km.
      powerKw:
        anyOf:
        - type: integer
          minimum: 0
          maximum: 2000
        - type: 'null'
        description: Puissance en kW ; null si inconnue. Un thermique va jusqu’à 1471 kW (2000 ch), un
          électrique jusqu’à 2000 kW.
      fuelCapacityLiters:
        anyOf:
        - type: number
          minimum: 0
          maximum: 500
          description: Au plus 1 décimale.
        - type: 'null'
        description: Capacité du réservoir, en litres ; null pour un électrique ou si inconnue.
      batteryCapacityKwh:
        anyOf:
        - type: number
          exclusiveMinimum: 0
          maximum: 300
          description: Au plus 2 décimales.
        - type: 'null'
        description: Capacité de la batterie de traction, en kWh ; null si non applicable ou inconnue.
      rangeKm:
        anyOf:
        - type: integer
          minimum: 0
          maximum: 2000
        - type: 'null'
        description: Autonomie électrique, en km ; null si non applicable ou inconnue.
      chargePortType:
        anyOf:
        - type: string
          enum:
          - TYPE_1
          - TYPE_2
          - CCS
          - CHADEMO
          - DC
          - DOMESTIC
        - type: 'null'
        description: Prise de recharge ; null si non applicable ou inconnue.
      equipment:
        maxItems: 40
        type: array
        items:
          type: string
          enum:
          - AIR_CONDITIONING
          - HEATED_SEATS
          - LEATHER_SEATS
          - KEYLESS_START
          - ELECTRIC_TRUNK
          - CONVERTIBLE_ROOF
          - SUNROOF
          - PANORAMIC_ROOF
          - GPS
          - BLUETOOTH
          - CARPLAY
          - ANDROID_AUTO
          - WIRELESS_CHARGING
          - ABS
          - ESP
          - CRUISE_CONTROL
          - ADAPTIVE_CRUISE_CONTROL
          - BLIND_SPOT_MONITOR
          - PARKING_SENSORS
          - REAR_CAMERA
          - PARKING_ASSIST
          - DASHCAM
          - TURBO
          - POWER_STEERING
          - START_STOP
          - ADBLUE
          - TOW_BAR
          - TOP_CASE
          - WINDSHIELD
          - HEATED_GRIPS
          - USB_PORT
          - TRACTION_CONTROL
          - ANTI_THEFT_ALARM
          - REMOVABLE_BATTERY
          - SPARE_BATTERY
        description: Équipements présents, parmi ceux de la famille et de l’énergie du véhicule.
      categoryId:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        description: 'Catégorie tarifaire (`GET /categories/{categoryId}`) ; null : véhicule sans prix,
          non réservable (`NO_PRICING_CATEGORY`).'
      status:
        type: string
        enum:
        - OPERATIONAL
        - BREAKDOWN
        description: '`BREAKDOWN` : véhicule en panne, non réservable. `OPERATIONAL` sinon, location en
          cours comprise.'
      isActive:
        type: boolean
        description: 'false : véhicule mis hors service par le loueur, non réservable (`INACTIVE`).'
      isArchived:
        type: boolean
        description: 'true : véhicule archivé, sorti de la flotte et non modifiable.'
      isBookable:
        type: boolean
        description: 'true si `notBookableReasons` est vide. Ne dit rien de l’occupation sur une période
          : voir `GET /availability`.'
      notBookableReasons:
        maxItems: 5
        type: array
        items:
          type: string
          enum:
          - INACTIVE
          - ARCHIVED
          - BREAKDOWN
          - MAINTENANCE_OVERDUE
          - NO_PRICING_CATEGORY
        description: 'Raisons durables qui empêchent toute réservation ; `MAINTENANCE_OVERDUE` : entretien
          ou contrôle technique en retard, quand le loueur bloque les réservations sur ce retard.'
      isMaintenanceTracked:
        type: boolean
        description: true une fois le suivi d’entretien démarré (`maintenanceTrackingMode`) ; il ne s’arrête
          plus.
      maintenanceTrackingMode:
        anyOf:
        - type: string
          enum:
          - FROM_ZERO
          - ASSUME_UP_TO_DATE
          - MANUAL_HISTORY
        - type: 'null'
        description: 'Mode de démarrage du suivi d’entretien, définitif une fois posé ; null : suivi non
          démarré. `FROM_ZERO` (véhicule neuf ou sans historique fiable) et `MANUAL_HISTORY` (historique
          saisi par `POST /maintenance-records`) comptent les échéances depuis 0 km et la première immatriculation
          ; `ASSUME_UP_TO_D'
      displayOrder:
        type: integer
        description: Rang d’affichage choisi dans Lexio ; ordre de la liste.
      imageUrls:
        maxItems: 30
        type: array
        items:
          type: string
          format: uri
        description: Photos de présentation, URL publiques stables, dans l’ordre choisi dans Lexio.
      createdAt:
        type: string
        format: date-time
        description: Création, heure du loueur avec décalage.
      updatedAt:
        type: string
        format: date-time
        description: Dernière modification.
    $schema: http://json-schema.org/schema#
    additionalProperties: true
  categories:
    type: object
    properties:
      id:
        type: string
        format: uuid
        description: Identifiant de la catégorie tarifaire.
      name:
        type: string
        maxLength: 100
        description: Nom de la catégorie, unique dans l’organisation (casse ignorée).
      description:
        anyOf:
        - type: string
          maxLength: 500
        - type: 'null'
        description: Description libre ; null si absente.
      currency:
        type: string
        enum:
        - EUR
        - XPF
        - CHF
        - CAD
        - GBP
        - USD
        - XOF
        description: 'Devise ISO 4217 : tous les montants de la ressource sont dans cette devise.'
      baseDailyPriceHT:
        type: number
        description: 'Prix journalier HT de base. Le prix de chaque saison en découle : base × `priceFactor`
          de la saison (`GET /seasons`).'
      seasonPrices:
        maxItems: 50
        type: array
        items:
          type: object
          properties:
            seasonSlug:
              type: string
              minLength: 1
              maxLength: 50
              pattern: ^[a-z0-9_]+$
              description: Saison (`GET /seasons/{slug}`).
            dailyPriceHT:
              type: number
              description: Prix journalier HT de la catégorie dans cette saison.
          required:
          - seasonSlug
          - dailyPriceHT
        description: Prix journalier HT par saison, une entrée par saison de l’organisation ; recalculé
          par Lexio quand le prix de base ou un `priceFactor` change.
      overageRatePerKmHT:
        anyOf:
        - type: number
          minimum: 0
          maximum: 999999.9999
          description: Au plus 4 décimales.
        - type: 'null'
        description: 'Prix HT de chaque kilomètre au-delà des kilomètres inclus, 4 décimales au plus ;
          null : aucun prix de dépassement défini.'
      vehicleCount:
        type: integer
        minimum: 0
        description: Véhicules rattachés, archivés et inactifs compris ; non nul, il empêche la suppression.
      activeVehicleCount:
        type: integer
        minimum: 0
        description: Véhicules rattachés, actifs et non archivés.
      createdAt:
        type: string
        format: date-time
        description: Création, heure du loueur avec décalage.
      updatedAt:
        type: string
        format: date-time
        description: Dernière modification.
    $schema: http://json-schema.org/schema#
    additionalProperties: true
  locations:
    type: object
    properties:
      id:
        type: string
        format: uuid
        description: Identifiant du lieu.
      name:
        type: string
        description: Nom affiché au client.
      address:
        type: string
        description: Adresse postale, en une ligne.
      type:
        type: string
        enum:
        - AGENCY
        - AIRPORT
        - STATION
        - HOTEL
        - OTHER
        description: Nature du lieu.
      isActive:
        type: boolean
        description: 'false : lieu qui n’est plus proposé.'
      displayOrder:
        type: integer
        description: Rang d’affichage ; ordre de la liste.
    $schema: http://json-schema.org/schema#
    additionalProperties: true
  options:
    type: object
    properties:
      id:
        type: string
        format: uuid
        description: Identifiant de l’option.
      currency:
        type: string
        enum:
        - EUR
        - XPF
        - CHF
        - CAD
        - GBP
        - USD
        - XOF
        description: 'Devise ISO 4217 : tous les montants de la ressource sont dans cette devise.'
      name:
        type: string
        minLength: 1
        maxLength: 100
        description: Nom affiché au client.
      description:
        anyOf:
        - type: string
          maxLength: 500
        - type: 'null'
        description: Description libre ; null si absente.
      kind:
        type: string
        enum:
        - STANDARD
        - ADDITIONAL_DRIVER
        - YOUNG_DRIVER
        description: '`STANDARD` : option vendue à la quantité. `ADDITIONAL_DRIVER` : conducteur additionnel,
          réservable par une clé interne seulement. `YOUNG_DRIVER` : supplément jeune conducteur, appliqué
          par Lexio d’après l’âge des conducteurs, jamais demandé directement. Une seule option de chacun
          de ces deux dernier'
      group:
        type: string
        enum:
        - COMFORT
        - PROTECTION
        - ACCESSORIES
        - DELIVERY
        - SERVICES
        - OTHER
        description: Rubrique d’affichage de l’option.
      price:
        type: object
        properties:
          unit:
            type: string
            enum:
            - DAY
            - HOUR
            - WEEK
            - RENTAL
            description: '`DAY` : par jour facturé ; `HOUR` : par heure de location ; `WEEK` : par semaine
              entamée ; `RENTAL` : une fois par location.'
          amountHT:
            type: number
            description: 'Prix HT d’une unité de `unit`, pour un exemplaire ; 0 : option offerte antérieure.'
          maxAmountHT:
            anyOf:
            - type: number
              description: Montant en unités majeures, sur la grille de la devise de la ressource.
            - type: 'null'
            description: 'Plafond HT par exemplaire sur toute la location ; null : sans plafond.'
        required:
        - unit
        - amountHT
        - maxAmountHT
        description: Prix HT de l’option et son plafond.
      maxQuantity:
        type: integer
        minimum: 1
        maximum: 100
        description: 'Exemplaires au plus par location. Une option conducteur vaut toujours 1 ici : le
          conducteur additionnel se réserve jusqu’à 4 fois, borne lue dans `choices.options[].maxBookableQuantity`
          du devis.'
      stockCount:
        type: integer
        minimum: 1
        maximum: 1000
        description: Exemplaires louables en même temps, toutes locations confondues ; ignoré pour une
          option conducteur. Le reste disponible sur une période se lit dans `maxBookableQuantity` du
          devis.
      availableMonths:
        maxItems: 12
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 12
        description: 'Mois où l’option se vend (1 = janvier), chacun une fois : elle est proposée si la
          location touche l’un d’eux ; [] : toute l’année.'
      youngDriverAgeThreshold:
        anyOf:
        - type: integer
          minimum: 16
          maximum: 99
        - type: 'null'
        description: Âge au départ en dessous duquel le supplément s’applique à un conducteur ; null pour
          une option qui n’est pas `YOUNG_DRIVER`.
      imageUrls:
        maxItems: 1
        type: array
        items:
          type: string
          format: uri
        description: Image de l’option, URL signée valable une heure, à ne pas stocker ; [] sans image
          ; se dépose dans Lexio.
      isActive:
        type: boolean
        description: 'false : option retirée de la vente.'
      displayOrder:
        type: integer
        minimum: 0
        description: Rang d’affichage ; ordre de la liste.
      updatedAt:
        type: string
        format: date-time
        description: Dernière modification.
    $schema: http://json-schema.org/schema#
    additionalProperties: true
  deductibles:
    type: object
    properties:
      id:
        type: string
        format: uuid
        description: Identifiant de la franchise.
      currency:
        type: string
        enum:
        - EUR
        - XPF
        - CHF
        - CAD
        - GBP
        - USD
        - XOF
        description: 'Devise ISO 4217 : tous les montants de la ressource sont dans cette devise.'
      name:
        type: string
        minLength: 1
        maxLength: 100
        description: Nom affiché au client.
      description:
        anyOf:
        - type: string
          maxLength: 500
        - type: 'null'
        description: Description libre ; null si absente.
      categoryId:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        description: 'Catégorie tarifaire à laquelle l’élément est réservé ; null : toutes les catégories.'
      excessAmount:
        type: number
        description: 'Montant laissé à la charge du client en cas de sinistre. Hors total de la location
          et sans TVA : il n’est pas facturé.'
      price:
        oneOf:
        - type: object
          properties:
            mode:
              type: string
              const: FIXED_PER_DAY
              description: Prix fixe par jour facturé.
            amountHT:
              type: number
              description: 'Prix HT par jour facturé ; 0 : offert.'
          required:
          - mode
          - amountHT
        - type: object
          properties:
            mode:
              type: string
              const: PERCENT_OF_RENTAL
              description: Pourcentage du prix de location du véhicule.
            percent:
              type: number
              minimum: 0.01
              maximum: 100
              description: Pourcentage du prix HT de location du véhicule, hors options. Au plus 2 décimales.
          required:
          - mode
          - percent
        description: Prix HT de cette franchise (son rachat) pour le client.
        type: object
      linkedDepositId:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        description: 'Caution retenue avec cette franchise quand une offre omet `depositId`, si elle est
          active ; null (ou caution inactive) : la caution par défaut s’applique (`isDefault` des cautions).
          Pour une offre sans caution, envoyez `depositId: null`. À l’écriture : caution active, globale
          ou de la catégorie de l'
      isDefault:
        type: boolean
        description: 'Franchise retenue quand une offre omet `deductibleId` : défaut de la catégorie du
          véhicule, sinon défaut global. Un seul défaut par catégorie et un seul global ; en désigner
          un autre retire ce statut à l’ancien. Un défaut est toujours actif.'
      isActive:
        type: boolean
        description: 'false : retiré de la vente ; les locations qui le portent le gardent.'
      updatedAt:
        type: string
        format: date-time
        description: Dernière modification.
