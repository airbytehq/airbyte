data:
  allowedHosts:
    hosts:
      - api.todoist.com
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-todoist
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  connectorBuildOptions:
    # Please update to the latest version of the connector base image.
    # https://hub.docker.com/r/airbyte/python-connector-base
    # Please use the full address with sha256 hash to guarantee build reproducibility.
    baseImage: docker.io/airbyte/source-declarative-manifest:7.37.0.post8.dev39371221940@sha256:cd404547b5590b2babace1c7a1f841ad238e752573c7dc085b937e393d2d9291
  connectorSubtype: api
  connectorType: source
  definitionId: 1a3d38e4-dc6b-4154-b56b-582f9e978ecd
  dockerImageTag: 0.5.0
  dockerRepository: airbyte/source-todoist
  githubIssueLabel: source-todoist
  icon: todoist.svg
  license: ELv2
  name: Todoist
  releaseDate: 2023-12-10
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/todoist
  tags:
    - cdk:low-code
    - language:manifest-only
  connectorTestSuitesOptions:
    - suite: unitTests
    - suite: liveTests
      testConnections:
        - name: todoist_config_dev_null
          id: 2fe1267b-52cf-4f76-88f0-7e99a52992fc
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-TODOIST__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: Todoist API
      url: https://developer.todoist.com/api/v1/
      type: api_reference
    - title: Todoist authentication
      url: https://developer.todoist.com/api/v1/#tag/Authorization
      type: authentication_guide
  releases:
    breakingChanges:
      0.4.0:
        upgradeDeadline: "2026-10-21"
        deadlineAction: "auto_upgrade"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - tasks
              - projects
        message: >-
          Todoist shut down the REST API v2 that this connector used (every request now returns HTTP 410 "This endpoint is deprecated").
          Version 0.4.0 reads the `tasks` and `projects` streams from the Todoist API v1 (`https://api.todoist.com/api/v1`) instead.
          Todoist API v1 uses a new ID format and renamed or removed several fields, so both streams have a new schema.
          After upgrading, refresh the source schema and clear the `tasks` and `projects` streams, then run a sync.
          See https://docs.airbyte.com/integrations/sources/todoist-migrations for details.
metadataSpecVersion: "1.0"
