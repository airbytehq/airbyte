          request_parameters:
            dateType: transaction
            timezone: UTC
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
        decoder:
          type: JsonDecoder
        partition_router:
          type: ListPartitionRouter
          cursor_field: region
          values: "{{ config.get('regions', []) }}"
          request_option:
            type: RequestOption
            field_name: region
            inject_into: request_parameter
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: date
        lookback_window: P{{ config['lookback_days'] }}D
        cursor_datetime_formats:
          - "%Y-%m-%d"
        datetime_format: "%Y-%m-%d"
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ config[\"start_date\"] }}"
          datetime_format: "%Y-%m-%d"
        start_time_option:
          type: RequestOption
          field_name: startDate
          inject_into: request_parameter
        end_time_option:
          type: RequestOption
          field_name: endDate
          inject_into: request_parameter
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().strftime('%Y-%m-%dT23:59:59') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%S"
        step: P1D
        cursor_granularity: P1D
      transformations:
        - type: AddFields
          fields:
            - path:
                - date
              value: "{{ stream_interval.start_time }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/creative_performance"
    publishers:
      type: DeclarativeStream
      name: publishers
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /advertisers/{{ config['advertiserId'] }}/publishers
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
        decoder:
          type: JsonDecoder
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/publishers"
    accounts:
      type: DeclarativeStream
      name: accounts
      primary_key:
        - accountId
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /accounts
          http_method: GET
          request_parameters:
            type: advertiser
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - accounts
        decoder:
          type: JsonDecoder
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/accounts"
  base_requester:
    type: HttpRequester
    url_base: https://api.awin.com
    authenticator:
      type: BearerAuthenticator
      api_token: "{{ config[\"api_key\"] }}"

streams:
  - $ref: "#/definitions/streams/campaign_performance"
  - $ref: "#/definitions/streams/transactions"
  - $ref: "#/definitions/streams/publisher_performance"
  - $ref: "#/definitions/streams/creative_performance"
  - $ref: "#/definitions/streams/publishers"
  - $ref: "#/definitions/streams/accounts"

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - advertiserId
      - api_key
      - step_increment
      - lookback_days
      - start_date
    properties:
      advertiserId:
        type: string
        description: >-
          Your Awin Advertiser ID. You can find this in your Awin dashboard or
          account settings.
        name: advertiserId
        order: 0
        title: advertiserId
      api_key:
        type: string
        description: >-
          Your Awin API key. Generate this from your Awin account under API
          Credentials.
        order: 1
        title: API Key
        airbyte_secret: true
      step_increment:
        type: string
        description: >
          The time window size for each API request in ISO8601 duration format.

          For the campaign performance stream, Awin API explicitly limits the
          period between startDate and endDate to 400 days maximum.
        order: 2
        title: Step Increment
        default: P400D
      lookback_days:
        type: integer
        description: >-
          Number of days to look back on each sync to catch any updates to
          existing records.
        order: 3
        title: Lookback Days
      start_date:
        type: string
        description: Start date for data replication in YYYY-MM-DD format
        order: 4
        title: Start Date
        format: date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      regions:
        type: array
        description: >-
          Awin regions to request for the creative performance stream. The Awin
          creative report requires a region, so the stream reads one report per
          selected region and returns no records when none are selected.
        order: 5
        title: Creative Performance Regions
        items:
          type: string
          enum:
            - AT
            - AU
            - BE
            - BR
            - BU
            - CA
            - CH
            - DE
            - DK
            - ES
            - FI
            - FR
            - GB
            - IE
            - IT
            - NL
            - NO
            - PL
            - SE
            - US
    additionalProperties: true

