metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - "api.awin.com"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-awin-advertiser
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.47.0@sha256:b2ecb78040d4c4b42fa3537488d68a3b195f64b5fefcbc48ac0591479591a3f0
  connectorSubtype: api
  connectorType: source
  definitionId: 807cabe0-9c76-4132-8863-60f669dea534
  dockerImageTag: 0.1.0
  dockerRepository: airbyte/source-awin-advertiser
  githubIssueLabel: source-awin-advertiser
  icon: icon.svg
  license: ELv2
  name: AWIN Advertiser
  releaseDate: 2025-04-29
  releaseStage: alpha
  releases:
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/awin-advertiser
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  maxSecondsBetweenMessages: 3600
  suggestedStreams:
    streams:
      - transactions
      - campaign_performance
      - publisher_performance
  externalDocumentationUrls:
    - title: Advertiser API reference
      url: https://help.awin.com/apidocs/for-advertisers
      type: api_reference
    - title: API authentication
      url: https://help.awin.com/apidocs/api-authentication
      type: authentication_guide
    - title: Rate limits
      url: https://help.awin.com/apidocs/introduction-to-awins-apis
      type: rate_limits
    - title: Response codes
      url: https://help.awin.com/apidocs/response-codes
      type: api_reference
