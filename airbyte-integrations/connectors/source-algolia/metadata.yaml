metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - "*.algolianet.com"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-algolia
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.49.0@sha256:349bbed19f7f62315db4f04d87e2b0b52f9fd4b1131d78d6a981db1681d627ad
  connectorSubtype: api
  connectorType: source
  definitionId: a20aa64a-bb59-4782-97bf-afd6a241c737
  dockerImageTag: 0.0.60
  dockerRepository: airbyte/source-algolia
  githubIssueLabel: source-algolia
  icon: icon.svg
  license: ELv2
  name: Algolia
  releaseDate: 2024-09-16
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/algolia
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: API reference
      url: https://www.algolia.com/doc/rest-api/search/
      type: api_reference
    - title: Authentication
      url: https://www.algolia.com/doc/guides/security/api-keys/
      type: authentication_guide
    - title: Rate limits
      url: https://www.algolia.com/doc/guides/scaling/servers-clusters/#rate-limits
      type: rate_limits
  releases:
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
