include = ["${POE_GIT_DIR}/poe-tasks/manifest-only-connector-tasks.toml"]

[tasks.test-sandbox]
help = "Run the existing container tests against a published image through SaaS Sandbox."
shell = """
set -eu
test_root=$(mktemp -d)
trap 'rm -rf "$test_root"' EXIT
connector="$test_root/source-stripe"
mkdir -p "$connector/integration_tests" "$connector/secrets"
cp "$POE_PWD/metadata.yaml" "$POE_PWD/manifest.yaml" "$POE_PWD/acceptance-test-config.yml" "$connector/"
cp "$POE_PWD/integration_tests/invalid_config.json" "$connector/integration_tests/"
cp "$SASS_CONNECTOR_CONFIG" "$connector/secrets/config.json"
status=0
sandbox exec "$SASS_SCENARIO" -- airbyte-cdk image test "$connector" --image "$CONNECTOR_IMAGE" || status=$?
report="$connector/build/test-results/standard-tests-junit.xml"
if [ -f "$report" ]; then
  mkdir -p "$POE_PWD/build/test-results"
  cp "$report" "$POE_PWD/build/test-results/standard-tests-junit.xml"
fi
exit "$status"
"""

[tasks.test-sandbox.env]
CONNECTOR_IMAGE = { default = "airbyte/source-stripe:6.0.18" }
SASS_SCENARIO = { default = "stripe-customers" }
SASS_CONNECTOR_CONFIG = { default = "${POE_PWD}/integration_tests/config-sandbox.json" }
