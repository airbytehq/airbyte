version: "0.29.0"

definitions:
  schema_loader:
    file_path: "./source_posthog/schemas/{{ parameters['name'] }}.json"

  selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path: ["results"]

  requester:
    type: HttpRequester
    url_base: "{{ config.get('base_url') or 'https://app.posthog.com'}}/api/"
    http_method: "GET"
    error_handler:
      type: DefaultErrorHandler
      backoff_strategies:
        - type: WaitTimeFromHeader
          header: Retry-After
        - type: ExponentialBackoffStrategy
    authenticator:
      type: BearerAuthenticator
      api_token: "{{ config['api_key'] }}"

  paginator:
    type: DefaultPaginator
    pagination_strategy:
      type: CustomPaginationStrategy
      class_name: source_posthog.components.PosthogNextPageStrategy
    page_token_option:
      type: RequestPath

  retriever:
    type: SimpleRetriever
    record_selector:
      $ref: "#/definitions/selector"
    paginator:
      $ref: "#/definitions/paginator"

  base_stream:
    primary_key: "id"
    schema_loader:
      $ref: "#/definitions/schema_loader"
    retriever:
      $ref: "#/definitions/retriever"
      requester:
        $ref: "#/definitions/requester"

  projects_stream:
    $ref: "#/definitions/base_stream"
    $parameters:
      name: "projects"
      path: "projects"

  base_slicing_stream:
    $ref: "#/definitions/base_stream"
    retriever:
      $ref: "#/definitions/retriever"
      requester:
        $ref: "#/definitions/requester"
        path: "/projects/{{ stream_slice.id }}/{{ parameters['name'] }}"
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - stream: "#/definitions/projects_stream"
            parent_key: id
            partition_field: id

  cohorts_stream:
    $ref: "#/definitions/base_slicing_stream"
    $parameters:
      name: "cohorts"
      path: "cohorts"

  feature_flags_stream:
    $ref: "#/definitions/base_slicing_stream"
    $parameters:
      name: "feature_flags"
      path: "feature_flags"

  persons_stream:
    $ref: "#/definitions/base_slicing_stream"
    $parameters:
      name: "persons"
      path: "persons"

  annotations_stream:
    $ref: "#/definitions/base_slicing_stream"
    $parameters:
      name: "annotations"
      path: "annotations"

  insights_stream:
    $ref: "#/definitions/base_slicing_stream"
    $parameters:
      name: "insights"
      path: "insights"

  events_stream:
    $parameters:
      name: "events"
      path: "events"
    primary_key: "id"
    incremental_sync:
      type: CustomIncrementalSync
      class_name: source_posthog.components.EventsCartesianProductStreamSlicer
      cursor_field: timestamp
      stream_slicers:
        - type: SubstreamPartitionRouter
          parent_stream_configs:
            - stream: "#/definitions/projects_stream"
              parent_key: "id"
              partition_field: "project_id"
        - type: DatetimeBasedCursor
          start_datetime:
            datetime: "{{ config['start_date'] }}"
            datetime_format: "%Y-%m-%dT%H:%M:%S%z"
          end_datetime:
            datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%S%z') }}"
            datetime_format: "%Y-%m-%dT%H:%M:%S%z"
          datetime_format: "%Y-%m-%dT%H:%M:%S.%f%z"
          cursor_datetime_formats:
            - "%Y-%m-%dT%H:%M:%S.%f%z"
            - "%Y-%m-%dT%H:%M:%S+00:00"
          cursor_granularity: "PT0.000001S"
          step: "P{{ config.get('events_time_step', 30) }}D"
          cursor_field: timestamp
          start_time_option:
            field_name: after
            inject_into: request_parameter
          end_time_option:
            field_name: before
            inject_into: request_parameter
    schema_loader:
      $ref: "#/definitions/schema_loader"
    retriever:
      $ref: "#/definitions/retriever"
      requester:
        $ref: "#/definitions/requester"
        path: "/projects/{{ stream_slice.project_id }}/events/"
      paginator:
        type: NoPagination

  experiment_summaries_stream:
    $ref: "#/definitions/base_slicing_stream"
    $parameters:
      name: "experiments"
      path: "experiments"
    retriever:
      $ref: "#/definitions/retriever"
      requester:
        $ref: "#/definitions/requester"
        path: "/projects/{{ stream_slice.id }}/experiments"
      partition_router:
        - type: SubstreamPartitionRouter
          parent_stream_configs:
            - stream: "#/definitions/projects_stream"
              parent_key: id
              partition_field: id
        - type: ListPartitionRouter
          values: ["false", "true"]
          cursor_field: archived
          request_option:
            type: RequestOption
            field_name: archived
            inject_into: request_parameter

  experiments_stream:
    $ref: "#/definitions/base_stream"
    $parameters:
      name: "experiments"
    retriever:
      type: SimpleRetriever
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      paginator:
        type: NoPagination
      requester:
        $ref: "#/definitions/requester"
        path: "/projects/{{ stream_slice.parent_slice.id }}/experiments/{{ stream_slice.experiment_id }}/"
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - stream: "#/definitions/experiment_summaries_stream"
            parent_key: id
            partition_field: experiment_id

  experiment_results_stream:
    $ref: "#/definitions/experiments_stream"
    $parameters:
      name: "experiment_results"
    primary_key: ["project_id", "experiment_id"]
    transformations:
      - type: AddFields
        fields:
          - path: ["project_id"]
            value: "{{ stream_slice.parent_slice.id }}"
          - path: ["experiment_id"]
            value: "{{ stream_slice.experiment_id }}"
    retriever:
      type: SimpleRetriever
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      paginator:
        type: NoPagination
      requester:
        $ref: "#/definitions/requester"
        path: "/projects/{{ stream_slice.parent_slice.id }}/experiments/{{ stream_slice.experiment_id }}/metrics_recalculation/latest/"
        error_handler:
          type: CompositeErrorHandler
          error_handlers:
            - type: DefaultErrorHandler
              response_filters:
                - http_codes: [404]
                  action: IGNORE
            - type: DefaultErrorHandler
              backoff_strategies:
                - type: WaitTimeFromHeader
                  header: Retry-After
                - type: ExponentialBackoffStrategy
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - stream: "#/definitions/experiment_summaries_stream"
            parent_key: id
            partition_field: experiment_id

streams:
  - "#/definitions/projects_stream"
  - "#/definitions/cohorts_stream"
  - "#/definitions/feature_flags_stream"
  - "#/definitions/events_stream"
  - "#/definitions/annotations_stream"
  - "#/definitions/insights_stream"
  - "#/definitions/experiments_stream"
  - "#/definitions/experiment_results_stream"
  - "#/definitions/persons_stream"

check:
  type: CheckStream
  stream_names: ["projects"]
