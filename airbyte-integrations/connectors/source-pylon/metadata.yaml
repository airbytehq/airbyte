metadataSpecVersion: "1.0"
data:
  maxSecondsBetweenMessages: 3600
  suggestedStreams:
    streams:
      - accounts
      - contacts
      - issues
      - issue_statuses
      - tags
      - teams
      - users
      - custom_fields
  allowedHosts:
    hosts:
      - "api.usepylon.com"
      - "api.eu.usepylon.com"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-pylon
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.45.1@sha256:f98cd95b4263c30c76b23c67b9c43e817e4f6b000663081e91778748b50d32e1
  connectorSubtype: api
  connectorType: source
  definitionId: f2e53e88-3c6b-4e5a-b7c2-a1d9c5e8f4b6
  dockerImageTag: 0.0.31
  dockerRepository: airbyte/source-pylon
  githubIssueLabel: source-pylon
  icon: icon.svg
  license: ELv2
  name: Pylon
  releaseDate: "2026-02-18"
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/pylon
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: Pylon rate limits
      url: https://docs.usepylon.com/pylon-docs/developer/api/rate-limits
      type: rate_limits
    - title: Pylon API reference
      url: https://docs.usepylon.com/pylon-docs/developer/api/api-reference
      type: api_reference
    - title: Pylon authentication
      url: https://docs.usepylon.com/pylon-docs/developer/api/authentication
      type: authentication_guide
    - title: Pylon OpenAPI specification
      url: https://api.usepylon.com/openapi.json
      type: openapi_spec
    - title: Pylon changelog
      url: https://www.usepylon.com/changelog
      type: api_release_history
  releases:
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
