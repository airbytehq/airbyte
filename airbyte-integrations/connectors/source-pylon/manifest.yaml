version: 6.5.0

type: DeclarativeSource

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: "{{ config.get('num_workers', 3) }}"
  max_concurrency: 10

api_budget:
  type: HTTPAPIBudget
  ratelimit_remaining_header: X-Rate-Limit-Remaining
  status_codes_for_ratelimit_hit: [429]
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 30
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/activity-types$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 30
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/issue-statuses$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 120
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: POST
          url_base: https://api.usepylon.com
          url_path_pattern: ^/issues/search$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 120
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/issues/[^/]+/messages$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 120
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/issues/[^/]+/threads$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 120
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/knowledge-bases/[^/]+/articles$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 300
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/accounts$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 300
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/contacts$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 300
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/tags$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 300
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/teams$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 300
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/users$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 300
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/custom-fields$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 300
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/knowledge-bases$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 300
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/ticket-forms$
    - type: MovingWindowCallRatePolicy
      rates:
        - type: Rate
          limit: 300
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.usepylon.com
          url_path_pattern: ^/user-roles$

description: >-
  Pylon (https://usepylon.com) is a customer support platform.
  This connector replicates data from the Pylon REST API.
  API Docs: https://docs.usepylon.com/pylon-docs/developer/api

check:
  type: CheckStream
  stream_names:
    - tags

definitions:
  streams:
    accounts:
      type: DeclarativeStream
      name: accounts
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: accounts
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/accounts"

    contacts:
      type: DeclarativeStream
      name: contacts
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: contacts
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/contacts"

    issues:
      type: DeclarativeStream
      name: issues
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: issues/search
          http_method: POST
          request_body_json:
            filter:
              field: updated_at
              operator: time_range
              values:
                - "{{ stream_interval.start_time }}"
                - "{{ stream_interval.end_time }}"
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator_body"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: updated_at
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%S.%fZ"
          - "%Y-%m-%dT%H:%M:%SZ"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ config['start_date'] if config.get('start_date') else day_delta(-30, format='%Y-%m-%dT%H:%M:%SZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        step: P30D
        cursor_granularity: PT1S
      state_migrations:
        - type: CustomStateMigration
          class_name: source_declarative_manifest.components.MigrateIssuesCursorFromCreatedAtToUpdatedAt
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/issues"

    issue_messages:
      type: DeclarativeStream
      name: issue_messages
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: "issues/{{ stream_partition.issue_id }}/messages"
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              partition_field: issue_id
              stream:
                $ref: "#/definitions/streams/issues"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/issue_messages"
      transformations:
        - type: AddFields
          fields:
            - path:
                - issue_id
              value: "{{ stream_partition.issue_id }}"

    issue_threads:
      type: DeclarativeStream
      name: issue_threads
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: "issues/{{ stream_partition.issue_id }}/threads"
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              partition_field: issue_id
              stream:
                $ref: "#/definitions/streams/issues"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/issue_threads"
      transformations:
        - type: AddFields
          fields:
            - path:
                - issue_id
              value: "{{ stream_partition.issue_id }}"

    tags:
      type: DeclarativeStream
      name: tags
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: tags
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/tags"

    teams:
      type: DeclarativeStream
      name: teams
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: teams
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/teams"

    users:
      type: DeclarativeStream
      name: users
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: users
          http_method: GET
          request_parameters:
            include_deactivated: "true"
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/users"

    custom_fields:
      type: DeclarativeStream
      name: custom_fields
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: custom-fields
          http_method: GET
          request_parameters:
            object_type: "{{ stream_partition.object_type }}"
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
        partition_router:
          type: ListPartitionRouter
          values:
            - account
            - issue
            - contact
          cursor_field: object_type
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/custom_fields"

    knowledge_bases:
      type: DeclarativeStream
      name: knowledge_bases
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: knowledge-bases
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/knowledge_bases"

    knowledge_base_articles:
      type: DeclarativeStream
      name: knowledge_base_articles
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: "knowledge-bases/{{ stream_partition.knowledge_base_id }}/articles"
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              partition_field: knowledge_base_id
              stream:
                $ref: "#/definitions/streams/knowledge_bases"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/knowledge_base_articles"
      transformations:
        - type: AddFields
          fields:
            - path:
                - knowledge_base_id
              value: "{{ stream_partition.knowledge_base_id }}"

    ticket_forms:
      type: DeclarativeStream
      name: ticket_forms
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: ticket-forms
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/ticket_forms"

    user_roles:
      type: DeclarativeStream
      name: user_roles
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: user-roles
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/user_roles"

    activity_types:
      type: DeclarativeStream
      name: activity_types
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: activity-types
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/activity_types"

    issue_statuses:
      type: DeclarativeStream
      name: issue_statuses
      primary_key:
        - slug
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: issue-statuses
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/cursor_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/issue_statuses"

  base_requester:
    type: HttpRequester
    url_base: https://api.usepylon.com
    connect_timeout_in_seconds: 30
    read_timeout_in_seconds: 300
    authenticator:
      type: BearerAuthenticator
      api_token: "{{ config['api_token'] }}"

  error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
        max_waiting_time_in_seconds: 120
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        predicate: "{{ response.get('code') == 'wrong_region_token' }}"
        error_message: >-
          The Pylon token belongs to another region. Use a US API token for
          api.usepylon.com; EU tokens starting with pylon_api_eu_ are not supported.
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        predicate: "{{ response.get('code') == 'invalid_api_token' }}"
        error_message: >-
          Pylon rejects the API token because it is revoked, mistyped, or blocked by an IP allowlist.
          Check Settings > Integrations & dev > API tokens and allow Airbyte's IP addresses.
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        predicate: "{{ response.get('code') == 'invalid_authorization_header' }}"
        error_message: >-
          Pylon rejects the authorization header. Paste only the API token,
          without a 'Bearer ' prefix or spaces.
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        predicate: "{{ response.get('code') in ['organization_deactivated', 'organization_suspended'] }}"
        error_message: >-
          The Pylon organization is deactivated or suspended. Contact Pylon support to restore API access.
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes: [401]
        error_message: >-
          Pylon cannot authenticate the API token. Check the token in Settings > Integrations & dev > API tokens
          and update the token in your Airbyte source settings.
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes: [403]
        error_message: >-
          The API token's role is not allowed to read {{ request_url }}.
          Give the token's role access to this data in Pylon, or deselect this stream.
      - type: HttpResponseFilter
        action: RATE_LIMITED
        http_codes: [429]
        error_message: The Pylon API rate limit is exceeded.
      - type: HttpResponseFilter
        action: RETRY
        http_codes: [500, 502, 503, 504]
        error_message: The Pylon API is temporarily unavailable.

  cursor_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: cursor
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: limit
    pagination_strategy:
      type: CursorPagination
      page_size: 999
      cursor_value: "{{ response.get('pagination', {}).get('cursor', '') }}"
      stop_condition: "{{ not response.get('pagination', {}).get('has_next_page', False) }}"

  cursor_paginator_body:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: body_json
      field_name: cursor
    page_size_option:
      type: RequestOption
      inject_into: body_json
      field_name: limit
    pagination_strategy:
      type: CursorPagination
      page_size: 999
      cursor_value: "{{ response.get('pagination', {}).get('cursor', '') }}"
      stop_condition: "{{ not response.get('pagination', {}).get('has_next_page', False) }}"

streams:
  - $ref: "#/definitions/streams/accounts"
  - $ref: "#/definitions/streams/contacts"
  - $ref: "#/definitions/streams/issues"
  - $ref: "#/definitions/streams/issue_messages"
  - $ref: "#/definitions/streams/issue_threads"
  - $ref: "#/definitions/streams/tags"
  - $ref: "#/definitions/streams/teams"
  - $ref: "#/definitions/streams/users"
  - $ref: "#/definitions/streams/custom_fields"
  - $ref: "#/definitions/streams/knowledge_bases"
  - $ref: "#/definitions/streams/knowledge_base_articles"
  - $ref: "#/definitions/streams/ticket_forms"
  - $ref: "#/definitions/streams/user_roles"
  - $ref: "#/definitions/streams/activity_types"
  - $ref: "#/definitions/streams/issue_statuses"

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_token
    properties:
      api_token:
        type: string
        order: 0
        title: API Token
        description: >-
          Create a token under Settings > Integrations & dev > API tokens in Pylon.
          The token's role controls which streams you can read. Only the US API
          (api.usepylon.com) is supported; EU tokens starting with pylon_api_eu_ are
          not supported. Add Airbyte's IP addresses to any IP allowlist on the token.
        airbyte_secret: true
      start_date:
        type: string
        order: 1
        title: Start Date
        description: >-
          Start syncing issues updated since this date, in UTC, using the format
          YYYY-MM-DDTHH:MM:SSZ. Applies only to issues and its child streams,
          issue_messages and issue_threads. On every sync, messages and threads are
          re-read for every issue updated since this date.
          All other streams always sync in full. Defaults to 30 days ago.
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        examples:
          - "2024-01-01T00:00:00Z"
      num_workers:
        type: integer
        order: 2
        title: Number of Workers
        default: 3
        minimum: 1
        maximum: 10
        description: >-
          The number of concurrent workers used to read Pylon data. Pylon rate limits
          are shared by every integration using your organization's API tokens.
          Lower this value if other tools also call Pylon.
    additionalProperties: true

schemas:
  accounts:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    additionalProperties: true
    properties:
      id:
        type: string
      name:
        type:
          - "null"
          - string
      domain:
        type:
          - "null"
          - string
      domains:
        type:
          - "null"
          - array
        items:
          type: string
      primary_domain:
        type:
          - "null"
          - string
      created_at:
        type:
          - "null"
          - string
      latest_customer_activity_time:
        type:
          - "null"
          - string
      type:
        type:
          - "null"
          - string
      is_disabled:
        type:
          - "null"
          - boolean
      owner:
        type:
          - "null"
          - object
        additionalProperties: true
      channels:
        type:
          - "null"
          - array
        items:
          type: object
          additionalProperties: true
      crm_settings:
        type:
          - "null"
          - object
        additionalProperties: true
      custom_fields:
        type:
          - "null"
          - object
        additionalProperties: true
      external_ids:
        type:
          - "null"
          - array
        items:
          type: object
          additionalProperties: true
      tags:
        type:
          - "null"
          - array
        items:
          type: object
          additionalProperties: true
      associated_account_ids:
        type:
          - "null"
          - array
        items:
          type:
            - "null"
            - string
      latest_vendor_activity_time:
        type:
          - "null"
          - string
        format: date-time
      logo_url:
        type:
          - "null"
          - string
      parent_account_id:
        type:
          - "null"
          - string
      subaccount_ids:
        type:
          - "null"
          - array
        items:
          type:
            - "null"
