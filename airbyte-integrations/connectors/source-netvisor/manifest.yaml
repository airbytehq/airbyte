version: 7.28.2

type: DeclarativeSource

description: >-
  Access your company's Netvisor data for reporting and analysis. Supports
  Netvisor test and production environments.

check:
  type: CheckStream
  stream_names:
    - account_balances
    - accounting_ledger
    - accounting_periods
    - accounts
    - bank_accounts
    - dimensions
    - voucher_types

definitions:
  linked:
    HttpRequester:
      request_headers: >-
        {%- set values = dict(config, **(stream_interval or {})) -%}

        {%- if 'window_start' in values and 'window_end' in values -%}
          {%- set values = dict(values,
            window_start=(str_to_datetime(values['window_start']) - duration('P1D')).strftime('%Y-%m-%d'),
            window_end=(str_to_datetime(values['window_end']) + duration('P1D')).strftime('%Y-%m-%d')
          ) -%}
        {%- endif -%}

        {%- set url = parameters['base_urls'][config['environment']] ~
        (parameters['resource_url_template'] % values) -%}

        {%- set now = now_utc() -%}

        {%- set timestamp = now.strftime('%Y-%m-%d %H:%M:%S') -%}

        {%- set unix = '' ~ (now.timestamp() | int) -%}

        {%- set transaction = generate_uuid() -%}

        {%- set sender = 'Airbyte' -%}

        {%- set language = config.get('language', 'EN') -%}

        {%- set customer_id = config['customer_id'] | trim -%}

        {%- set customer_key = config['customer_key'] | trim -%}

        {%- set partner_id = config['partner_id'] | trim -%}

        {%- set partner_key = config['partner_key'] | trim -%}

        {%- set company = config['company_id'] | trim -%}

        {%- set secret = customer_key ~ '&' ~ partner_key -%}

        {%- set message = [url, sender, customer_id, timestamp, language,
            company, transaction, unix, customer_key, partner_key] | join('&') -%}
        {%- set mac = message | hmac(secret, 'sha256') -%}

        {{ {
          'X-Netvisor-Authentication-Sender': sender,
          'X-Netvisor-Authentication-CustomerId': customer_id,
          'X-Netvisor-Authentication-PartnerId': partner_id,
          'X-Netvisor-Authentication-Timestamp': timestamp,
          'X-Netvisor-Authentication-TimestampUnix': unix,
          'X-Netvisor-Authentication-TransactionId': transaction,
          'X-Netvisor-Interface-Language': language,
          'X-Netvisor-Organisation-ID': company,
          'X-Netvisor-Authentication-MAC': mac,
          'X-Netvisor-Authentication-MACHashCalculationAlgorithm': 'HMACSHA256',
          'X-Netvisor-Authentication-UseHTTPResponseStatusCodes': '1',
          'Accept': 'application/xml'
        } }}
      authenticator:
        type: NoAuth
        resource_url_template: accountingperiodlist.nv
        base_urls:
          test: https://isvapi.netvisor.fi/
          production: https://integration.netvisor.fi/
        $parameters:
          resource_url_template: accountingperiodlist.nv
          base_urls:
            test: https://isvapi.netvisor.fi/
            production: https://integration.netvisor.fi/
      error_handler:
        type: DefaultErrorHandler
        max_retries: 3
        response_filters:
          - type: HttpResponseFilter
            action: FAIL
            error_message: >-
              Netvisor rejected the request. Check API permissions, credentials
              and resource parameters.
            error_message_contains: <Status>FAILED</Status>
            resource_url_template: accountingperiodlist.nv
            base_urls:
              test: https://isvapi.netvisor.fi/
              production: https://integration.netvisor.fi/
            $parameters:
              resource_url_template: accountingperiodlist.nv
              base_urls:
                test: https://isvapi.netvisor.fi/
                production: https://integration.netvisor.fi/
        resource_url_template: accountingperiodlist.nv
        base_urls:
          test: https://isvapi.netvisor.fi/
          production: https://integration.netvisor.fi/
        $parameters:
          resource_url_template: accountingperiodlist.nv
          base_urls:
            test: https://isvapi.netvisor.fi/
            production: https://integration.netvisor.fi/
    SimpleRetriever:
      paginator:
        type: NoPagination
        resource_url_template: accountingperiodlist.nv
        $parameters:
          resource_url_template: accountingperiodlist.nv

streams:
  - type: DeclarativeStream
    name: account_balances
    retriever:
      type: SimpleRetriever
      decoder:
        type: XmlDecoder
        resource_url_template: accountbalance.nv?%(balance_query)s
        $parameters:
          resource_url_template: accountbalance.nv?%(balance_query)s
      paginator:
        type: NoPagination
        resource_url_template: accountbalance.nv?%(balance_query)s
        $parameters:
          resource_url_template: accountbalance.nv?%(balance_query)s
      requester:
        type: HttpRequester
        url: >-
          {%- set values = dict(config, **(stream_interval or {})) -%}

          {%- if 'window_start' in values and 'window_end' in values -%}
            {%- set values = dict(values,
              window_start=(str_to_datetime(values['window_start']) - duration('P1D')).strftime('%Y-%m-%d'),
              window_end=(str_to_datetime(values['window_end']) + duration('P1D')).strftime('%Y-%m-%d')
            ) -%}
          {%- endif -%}

          {{ parameters['base_urls'][config['environment']] ~
          (parameters['resource_url_template'] % values) }}
        http_method: GET
        authenticator:
          type: NoAuth
          resource_url_template: accountbalance.nv?%(balance_query)s
          base_urls:
            test: https://isvapi.netvisor.fi/
            production: https://integration.netvisor.fi/
          $parameters:
            resource_url_template: accountbalance.nv?%(balance_query)s
            base_urls:
              test: https://isvapi.netvisor.fi/
              production: https://integration.netvisor.fi/
        error_handler:
          type: DefaultErrorHandler
          max_retries: 3
          response_filters:
            - type: HttpResponseFilter
              action: FAIL
              error_message: >-
                Netvisor rejected the request. Check API permissions,
                credentials and resource parameters.
              error_message_contains: <Status>FAILED</Status>
              resource_url_template: accountbalance.nv?%(balance_query)s
              base_urls:
                test: https://isvapi.netvisor.fi/
                production: https://integration.netvisor.fi/
              $parameters:
                resource_url_template: accountbalance.nv?%(balance_query)s
                base_urls:
                  test: https://isvapi.netvisor.fi/
                  production: https://integration.netvisor.fi/
          resource_url_template: accountbalance.nv?%(balance_query)s
          base_urls:
            test: https://isvapi.netvisor.fi/
            production: https://integration.netvisor.fi/
          $parameters:
            resource_url_template: accountbalance.nv?%(balance_query)s
            base_urls:
              test: https://isvapi.netvisor.fi/
              production: https://integration.netvisor.fi/
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
        resource_url_template: accountbalance.nv?%(balance_query)s
        base_urls:
          test: https://isvapi.netvisor.fi/
          production: https://integration.netvisor.fi/
        $parameters:
          resource_url_template: accountbalance.nv?%(balance_query)s
          base_urls:
            test: https://isvapi.netvisor.fi/
            production: https://integration.netvisor.fi/
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - Root
            - AccountBalances
            - Account
          record_expander:
            type: RecordExpander
            on_no_records: emit_parent
            remain_original_record: true
            expand_records_from_field:
              - AccountBalance
            resource_url_template: accountbalance.nv?%(balance_query)s
            $parameters:
              resource_url_template: accountbalance.nv?%(balance_query)s
          resource_url_template: accountbalance.nv?%(balance_query)s
          $parameters:
            resource_url_template: accountbalance.nv?%(balance_query)s
        resource_url_template: accountbalance.nv?%(balance_query)s
        $parameters:
          resource_url_template: accountbalance.nv?%(balance_query)s
      partition_router:
        type: ListPartitionRouter
        values: |-
          {%- set start = str_to_datetime(config['start_date']) -%}
          {%- set end = str_to_datetime(now_utc().strftime('%Y-%m-%d')) -%}
          {%- set days = config.get('window_days', 30) -%}
          {%- set batches = (end - start).days // days + 1 -%}
          [{%- for _ in [none] * batches -%}
            {%- set batch_start = start + duration('P1D') * (loop.index0 * days) -%}
            {%- set batch_end = min(batch_start + duration('P1D') * (days - 1), end) -%}
            {%- set dates = batch_start.strftime('%Y-%m-%d') -%}
            {%- set query = 'balancedates=' ~ dates ~ '&intervaltype=0' if batch_start == batch_end else 'balancedates=' ~ dates ~ ',' ~ batch_end.strftime('%Y-%m-%d') ~ '&intervaltype=1' -%}
            {{- query | tojson -}},
          {%- endfor -%}]
        cursor_field: balance_query
        resource_url_template: accountbalance.nv?%(balance_query)s
        $parameters:
          resource_url_template: accountbalance.nv?%(balance_query)s
      resource_url_template: accountbalance.nv?%(balance_query)s
      $parameters:
        resource_url_template: accountbalance.nv?%(balance_query)s
    primary_key:
      - - company_id
      - - Netvisorkey
      - - Date
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        description: >-
          Daily account debit, credit and balance totals from the sync history
          start date through today (UTC), refreshed on every sync. Interpret
          totals using IsCumulative in the accounts stream. Monetary values
          retain Netvisor's exact decimal representation.
        required:
          - company_id
          - Netvisorkey
          - Date
          - Debet
          - Kredit
          - Balance
        properties:
          Date:
            type: string
            format: date
          Name:
            type:
              - string
              - "null"
          Debet:
            type: string
          Kredit:
            type: string
          Number:
            type:
              - string
              - "null"
          Balance:
            type: string
          company_id:
            type: string
          ForeignName:
            type: array
            items:
              type:
                - object
                - string
              properties:
                value:
                  type:
                    - string
                    - "null"
              additionalProperties: true
          Netvisorkey:
            type: string
            description: References NetvisorKey in the accounts stream.
        additionalProperties: true
      resource_url_template: accountbalance.nv?%(balance_query)s
      $parameters:
        resource_url_template: accountbalance.nv?%(balance_query)s
    transformations:
      - type: RemoveFields
        field_pointers:
          - - original_record
            - AccountBalance
        resource_url_template: accountbalance.nv?%(balance_query)s
        $parameters:
          resource_url_template: accountbalance.nv?%(balance_query)s
      - type: DpathFlattenFields
        field_path:
          - original_record
        delete_origin_value: true
        resource_url_template: accountbalance.nv?%(balance_query)s
        $parameters:
          resource_url_template: accountbalance.nv?%(balance_query)s
      - type: DpathFlattenFields
        field_path:
          - AccountBalance
        delete_origin_value: true
        resource_url_template: accountbalance.nv?%(balance_query)s
        $parameters:
          resource_url_template: accountbalance.nv?%(balance_query)s
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - __normalized
            value: |-
              {%- macro normalize(value) -%}
                {%- if value is mapping -%}
                  { {%- for key, child in value.items() -%}
                    {{- (key[1:] if key.startswith('@') else ('value' if key == '#text' else key)) | tojson -}}:
                    {{- normalize(child) -}},
                  {%- endfor -%} }
                {%- elif value is sequence and value is not string -%}
                  [{%- for child in value -%}{{ normalize(child) }},{%- endfor -%}]
                {%- elif value is string -%}{{ value | tojson }}
                {%- else -%}{{ value }}{%- endif -%}
              {%- endmacro -%} {{ normalize(record) }}
            resource_url_template: accountbalance.nv?%(balance_query)s
            $parameters:
              resource_url_template: accountbalance.nv?%(balance_query)s
        resource_url_template: accountbalance.nv?%(balance_query)s
        $parameters:
          resource_url_template: accountbalance.nv?%(balance_query)s
      - type: DpathFlattenFields
        field_path:
          - __normalized
        replace_record: true
        resource_url_template: accountbalance.nv?%(balance_query)s
        $parameters:
          resource_url_template: accountbalance.nv?%(balance_query)s
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - company_id
            value: "{{ config['company_id'] | trim }}"
            resource_url_template: accountbalance.nv?%(balance_query)s
            $parameters:
              resource_url_template: accountbalance.nv?%(balance_query)s
        resource_url_template: accountbalance.nv?%(balance_query)s
        $parameters:
          resource_url_template: accountbalance.nv?%(balance_query)s
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - ForeignName
            value: >-
              {%- set names = record.get('ForeignName') -%}

              {{ [] if names is none else ([names] if names is mapping or names
              is string else names) }}
            resource_url_template: accountbalance.nv?%(balance_query)s
            $parameters:
              resource_url_template: accountbalance.nv?%(balance_query)s
        condition: "{{ path[0] in record }}"
        resource_url_template: accountbalance.nv?%(balance_query)s
        $parameters:
          resource_url_template: accountbalance.nv?%(balance_query)s
    resource_url_template: accountbalance.nv?%(balance_query)s
    $parameters:
      resource_url_template: accountbalance.nv?%(balance_query)s
  - type: DeclarativeStream
    name: accounting_ledger
    retriever:
      type: SimpleRetriever
      decoder:
        type: XmlDecoder
        resource_url_template: >-
          accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
        $parameters:
          resource_url_template: >-
            accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
      paginator:
        type: NoPagination
        resource_url_template: >-
          accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
        $parameters:
          resource_url_template: >-
            accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
      requester:
        type: HttpRequester
        url: >-
          {%- set values = dict(config, **(stream_interval or {})) -%}

          {%- if 'window_start' in values and 'window_end' in values -%}
            {%- set values = dict(values,
              window_start=(str_to_datetime(values['window_start']) - duration('P1D')).strftime('%Y-%m-%d'),
              window_end=(str_to_datetime(values['window_end']) + duration('P1D')).strftime('%Y-%m-%d')
            ) -%}
          {%- endif -%}

          {{ parameters['base_urls'][config['environment']] ~
          (parameters['resource_url_template'] % values) }}
        http_method: GET
        authenticator:
          type: NoAuth
          resource_url_template: >-
            accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
          base_urls:
            test: https://isvapi.netvisor.fi/
            production: https://integration.netvisor.fi/
          $parameters:
            resource_url_template: >-
              accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
            base_urls:
              test: https://isvapi.netvisor.fi/
              production: https://integration.netvisor.fi/
        error_handler:
          type: DefaultErrorHandler
          max_retries: 3
          response_filters:
            - type: HttpResponseFilter
              action: FAIL
              error_message: >-
                Netvisor rejected the request. Check API permissions,
                credentials and resource parameters.
              error_message_contains: <Status>FAILED</Status>
              resource_url_template: >-
                accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
              base_urls:
                test: https://isvapi.netvisor.fi/
                production: https://integration.netvisor.fi/
              $parameters:
                resource_url_template: >-
                  accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
                base_urls:
                  test: https://isvapi.netvisor.fi/
                  production: https://integration.netvisor.fi/
          resource_url_template: >-
            accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
          base_urls:
            test: https://isvapi.netvisor.fi/
            production: https://integration.netvisor.fi/
          $parameters:
            resource_url_template: >-
              accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
            base_urls:
              test: https://isvapi.netvisor.fi/
              production: https://integration.netvisor.fi/
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
        resource_url_template: >-
          accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
        base_urls:
          test: https://isvapi.netvisor.fi/
          production: https://integration.netvisor.fi/
        $parameters:
          resource_url_template: >-
            accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
          base_urls:
            test: https://isvapi.netvisor.fi/
            production: https://integration.netvisor.fi/
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - Root
            - Vouchers
            - Voucher
          resource_url_template: >-
            accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
          $parameters:
            resource_url_template: >-
              accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
        resource_url_template: >-
          accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
        $parameters:
          resource_url_template: >-
            accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
      resource_url_template: >-
        accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
      $parameters:
        resource_url_template: >-
          accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
    primary_key:
      - - company_id
      - - NetvisorKey
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        required:
          - company_id
          - NetvisorKey
          - VoucherLine
        properties:
          Status:
            type:
              - string
              - "null"
          company_id:
            type: string
          NetvisorKey:
            type: string
          VoucherDate:
            type:
              - string
              - "null"
            format: date
          VoucherLine:
            type: array
            items:
              type: object
              properties:
                Status:
                  type:
                    - string
                    - "null"
                LineSum:
                  type:
                    - string
                    - "null"
                  description: >-
                    Exact posting amount as provided by Netvisor. Kept as text
                    to preserve monetary precision.
                VatCode:
                  type:
                    - string
                    - "null"
                Dimension:
                  type: array
                  items:
                    type: object
                    properties:
                      DimensionItem:
                        type:
                          - string
                          - "null"
                      DimensionName:
                        type:
                          - string
                          - "null"
                      DimensionItemCode:
                        type:
                          - string
                          - "null"
                      DimensionItemName:
                        type:
                          - string
                          - "null"
                    additionalProperties: true
                VatPercent:
                  type:
                    - number
                    - "null"
                Description:
                  type:
                    - string
                    - "null"
                NetvisorKey:
                  type:
                    - string
                    - "null"
                AccountNumber:
                  type:
                    - string
                    - "null"
                AccountDimension:
                  type:
                    - object
                    - "null"
                  properties:
                    type:
                      type:
                        - string
                        - "null"
                    value:
                      type:
                        - string
                        - "null"
                  additionalProperties: true
                CorporationEventTarget:
                  type:
                    - object
                    - "null"
                  properties:
                    EventStatus:
                      type:
                        - string
                        - "null"
                    TargetCompany:
                      type:
                        - object
                        - "null"
                      properties:
                        value:
                          type:
                            - string
                            - "null"
                        organisationidentifier:
                          type:
                            - string
                            - "null"
                      additionalProperties: true
                  additionalProperties: true
                TransactionAllocations:
                  type:
                    - object
                    - "null"
                  properties:
                    TransactionAllocation:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type:
                              - string
                              - "null"
                          VoucherNetvisorKey:
                            type:
                              - string
                              - "null"
                          VoucherLineNetvisorKey:
                            type:
                              - string
                              - "null"
                        additionalProperties: true
                  additionalProperties: true
                TransactionFollowUpStatus:
                  type:
                    - string
                    - "null"
              additionalProperties: true
          NetvisorGuid:
            type:
              - string
              - "null"
          VoucherClass:
            type:
              - object
              - "null"
            properties:
              value:
                type:
                  - string
                  - "null"
              netvisorkey:
                type:
                  - string
                  - "null"
            additionalProperties: true
          VoucherNumber:
            type:
              - string
              - "null"
          VoucherGenerator:
            type:
              - string
              - "null"
            description: >-
              Person or system that created the voucher, as reported by
              Netvisor.
          VoucherDescription:
            type:
              - string
              - "null"
          VoucherNetvisorURI:
            type:
              - string
              - "null"
          LinkedSourceNetvisorKey:
            type:
              - object
              - "null"
            properties:
              type:
                type:
                  - string
                  - "null"
              value:
                type:
                  - string
                  - "null"
            additionalProperties: true
          _netvisor_sync_window_end:
            type: string
            description: >-
              End date of the date range processed during the sync. Used to
              track sync progress.
            format: date
        additionalProperties: true
      resource_url_template: >-
        accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
      $parameters:
        resource_url_template: >-
          accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - __normalized
            value: |-
              {%- macro normalize(value) -%}
                {%- if value is mapping -%}
                  { {%- for key, child in value.items() -%}
                    {{- (key[1:] if key.startswith('@') else ('value' if key == '#text' else key)) | tojson -}}:
                    {{- normalize(child) -}},
                  {%- endfor -%} }
                {%- elif value is sequence and value is not string -%}
                  [{%- for child in value -%}{{ normalize(child) }},{%- endfor -%}]
                {%- elif value is string -%}{{ value | tojson }}
                {%- else -%}{{ value }}{%- endif -%}
