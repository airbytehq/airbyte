spec:
  type: Spec
  connection_specification:
    type: object
    title: Netvisor
    required:
      - environment
      - customer_id
      - customer_key
      - partner_id
      - partner_key
      - company_id
      - start_date
    properties:
      language:
        type: string
        description: >-
          Language for Netvisor's response messages, mainly errors. Choose FI
          (Finnish), SE (Swedish), or EN (English).
        enum:
          - FI
          - SE
          - EN
        order: 8
        title: Response language
        default: EN
      company_id:
        type: string
        description: Business ID of the Netvisor company to read.
        order: 5
        title: Company business ID
      partner_id:
        type: string
        description: >-
          Partner ID for the same test or production environment as the customer
          API identifiers.
        order: 3
        title: Partner ID
      start_date:
        type: string
        description: >-
          Start date for ledger changes and daily account balances. Ledger
          history uses entry modification dates; balances use accounting dates
          and are refreshed through today (UTC) on every sync. Choose a date
          before the earliest history you need. Reference data is always
          retrieved in full.
        order: 6
        title: Sync history start date
        format: date
      customer_id:
        type: string
        description: Customer API identifier with read access.
        order: 1
        title: Customer API ID
      environment:
        type: string
        description: >-
          Netvisor environment to connect to. Use customer and partner
          credentials issued for the selected environment.
        enum:
          - test
          - production
        order: 0
        title: Environment
      partner_key:
        type: string
        order: 4
        title: Partner key
        airbyte_secret: true
      window_days:
        type: integer
        description: >-
          Number of days of ledger changes or daily account balances to retrieve
          per request. Smaller values reduce response sizes; larger values
          reduce the number of requests.
        order: 7
        title: Days per request
        default: 30
        maximum: 31
        minimum: 1
      customer_key:
        type: string
        order: 2
        title: Customer API key
        airbyte_secret: true
  config_normalization_rules:
    type: ConfigNormalizationRules
    validations:
      - type: DpathValidator
        field_path:
          - _netvisor_valid_date_range
        validation_strategy:
          type: ValidateAdheresToSchema
          base_schema:
            type: boolean
            description: The sync history start date must be today or earlier.
            const: true
      - type: DpathValidator
        field_path:
          - window_days
        validation_strategy:
          type: ValidateAdheresToSchema
          base_schema:
            type: integer
            maximum: 31
            minimum: 1
    transformations:
      - type: ConfigAddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - _netvisor_valid_date_range
            value: "{{ config['start_date'] <= now_utc().strftime('%Y-%m-%d') }}"

