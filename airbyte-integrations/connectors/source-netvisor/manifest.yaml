version: 7.28.2

type: DeclarativeSource

description: >-
  Access your company's Netvisor data for reporting and analysis. Supports Netvisor test and production environments.

check:
  type: CheckStream
  stream_names:
    - account_balances
    - accounting_ledger
    - accounting_periods
    - accounts
    - bank_accounts
    - dimensions
    - voucher_types

definitions:
  netvisor_requester:
    type: HttpRequester
    $parameters:
      base_urls:
        test: https://isvapi.netvisor.fi/
        production: https://integration.netvisor.fi/
    http_method: GET
    authenticator:
      type: NoAuth
    url: |-
      {%- set values = dict(config, **(stream_interval or {})) -%}
      {%- if 'window_start' in values and 'window_end' in values -%}
        {%- set values = dict(values,
          window_start=(str_to_datetime(values['window_start']) - duration('P1D')).strftime('%Y-%m-%d'),
          window_end=(str_to_datetime(values['window_end']) + duration('P1D')).strftime('%Y-%m-%d')
        ) -%}
      {%- endif -%}
      {{ parameters['base_urls'][config['environment']] ~ (parameters['resource_url_template'] % values) }}
    request_headers: |-
      {%- set values = dict(config, **(stream_interval or {})) -%}
      {%- if 'window_start' in values and 'window_end' in values -%}
        {%- set values = dict(values,
          window_start=(str_to_datetime(values['window_start']) - duration('P1D')).strftime('%Y-%m-%d'),
          window_end=(str_to_datetime(values['window_end']) + duration('P1D')).strftime('%Y-%m-%d')
        ) -%}
      {%- endif -%}
      {%- set url = parameters['base_urls'][config['environment']] ~ (parameters['resource_url_template'] % values) -%}
      {%- set now = now_utc() -%}
      {%- set timestamp = now.strftime('%Y-%m-%d %H:%M:%S') -%}
      {%- set unix = '' ~ (now.timestamp() | int) -%}
      {%- set transaction = generate_uuid() -%}
      {%- set sender = 'Airbyte' -%}
      {%- set language = config.get('language', 'EN') -%}
      {%- set customer_id = config['customer_id'] | trim -%}
      {%- set customer_key = config['customer_key'] | trim -%}
      {%- set partner_id = config['partner_id'] | trim -%}
      {%- set partner_key = config['partner_key'] | trim -%}
      {%- set company = config['company_id'] | trim -%}
      {%- set secret = customer_key ~ '&' ~ partner_key -%}
      {%- set message = [url, sender, customer_id, timestamp, language,
          company, transaction, unix, customer_key, partner_key] | join('&') -%}
      {%- set mac = message | hmac(secret, 'sha256') -%}
      {{ {
        'X-Netvisor-Authentication-Sender': sender,
        'X-Netvisor-Authentication-CustomerId': customer_id,
        'X-Netvisor-Authentication-PartnerId': partner_id,
        'X-Netvisor-Authentication-Timestamp': timestamp,
        'X-Netvisor-Authentication-TimestampUnix': unix,
        'X-Netvisor-Authentication-TransactionId': transaction,
        'X-Netvisor-Interface-Language': language,
        'X-Netvisor-Organisation-ID': company,
        'X-Netvisor-Authentication-MAC': mac,
        'X-Netvisor-Authentication-MACHashCalculationAlgorithm': 'HMACSHA256',
        'X-Netvisor-Authentication-UseHTTPResponseStatusCodes': '1',
        'Accept': 'application/xml'
      } }}
    error_handler:
      type: DefaultErrorHandler
      response_filters:
        - type: HttpResponseFilter
          action: FAIL
          error_message_contains: <Status>FAILED</Status>
          error_message: Netvisor rejected the request. Check API permissions, credentials and resource parameters.
      max_retries: 3
  normalize_xml:
    type: AddFields
    fields:
      - type: AddedFieldDefinition
        path:
          - __normalized
        value: |-
          {%- macro normalize(value) -%}
            {%- if value is mapping -%}
              { {%- for key, child in value.items() -%}
                {{- (key[1:] if key.startswith('@') else ('value' if key == '#text' else key)) | tojson -}}:
                {{- normalize(child) -}},
              {%- endfor -%} }
            {%- elif value is sequence and value is not string -%}
              [{%- for child in value -%}{{ normalize(child) }},{%- endfor -%}]
            {%- elif value is string -%}{{ value | tojson }}
            {%- else -%}{{ value }}{%- endif -%}
          {%- endmacro -%} {{ normalize(record) }}
  replace_normalized_record:
    type: DpathFlattenFields
    field_path:
      - __normalized
    replace_record: true
  record_metadata:
    type: AddFields
    fields:
      - type: AddedFieldDefinition
        path:
          - company_id
        value: "{{ config['company_id'] | trim }}"
  streams:
    account_balances:
      type: DeclarativeStream
      name: account_balances
      $parameters:
        resource_url_template: accountbalance.nv?%(balance_query)s
      primary_key:
        - - company_id
        - - Netvisorkey
        - - Date
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/netvisor_requester"
        paginator:
          type: NoPagination
        partition_router:
          type: ListPartitionRouter
          cursor_field: balance_query
          values: |-
            {%- set start = str_to_datetime(config['start_date']) -%}
            {%- set end = str_to_datetime(now_utc().strftime('%Y-%m-%d')) -%}
            {%- set days = config.get('window_days', 30) -%}
            {%- set batches = (end - start).days // days + 1 -%}
            [{%- for _ in [none] * batches -%}
              {%- set batch_start = start + duration('P1D') * (loop.index0 * days) -%}
              {%- set batch_end = min(batch_start + duration('P1D') * (days - 1), end) -%}
              {%- set dates = batch_start.strftime('%Y-%m-%d') -%}
              {%- set query = 'balancedates=' ~ dates ~ '&intervaltype=0' if batch_start == batch_end else 'balancedates=' ~ dates ~ ',' ~ batch_end.strftime('%Y-%m-%d') ~ '&intervaltype=1' -%}
              {{- query | tojson -}},
            {%- endfor -%}]
        decoder:
          type: XmlDecoder
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - Root
              - AccountBalances
              - Account
            record_expander:
              type: RecordExpander
              expand_records_from_field:
                - AccountBalance
              remain_original_record: true
              on_no_records: emit_parent
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/account_balances"
      transformations:
        - type: RemoveFields
          field_pointers:
            - - original_record
              - AccountBalance
        - type: DpathFlattenFields
          field_path:
            - original_record
          delete_origin_value: true
        - type: DpathFlattenFields
          field_path:
            - AccountBalance
          delete_origin_value: true
        - $ref: "#/definitions/normalize_xml"
        - $ref: "#/definitions/replace_normalized_record"
        - $ref: "#/definitions/record_metadata"
        - type: AddFields
          condition: "{{ path[0] in record }}"
          fields:
            - type: AddedFieldDefinition
              path:
                - ForeignName
              value: |-
                {%- set names = record.get('ForeignName') -%}
                {{ [] if names is none else ([names] if names is mapping or names is string else names) }}

    accounting_ledger:
      type: DeclarativeStream
      name: accounting_ledger
      $parameters:
        resource_url_template: accountingledger.nv?lastmodifiedstart=%(window_start)s&lastmodifiedend=%(window_end)s&voucherstatus=1&showgenerator=1&includetransactionallocations=1
      incremental_sync:
        type: DatetimeBasedCursor
        datetime_format: "%Y-%m-%d"
        start_datetime: "{{ config['start_date'] }}"
        end_datetime: "{{ now_utc().strftime('%Y-%m-%d') }}"
        step: P{{ config.get('window_days', 30) }}D
        cursor_granularity: P1D
        lookback_window: P2D
        partition_field_start: window_start
        partition_field_end: window_end
        cursor_field: _netvisor_sync_window_end
      retriever:
        type: SimpleRetriever
        paginator:
          type: NoPagination
        decoder:
          type: XmlDecoder
        requester:
          $ref: "#/definitions/netvisor_requester"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - Root
              - Vouchers
              - Voucher
      primary_key:
        - - company_id
        - - NetvisorKey
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/accounting_ledger"
      transformations:
        - $ref: "#/definitions/normalize_xml"
        - $ref: "#/definitions/replace_normalized_record"
        - $ref: "#/definitions/record_metadata"
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - VoucherLine
              value: |-
                {%- set lines = record.get('VoucherLine') or [] -%}
                [{%- for line in ([lines] if lines is mapping else lines) -%}
                  {%- set line = dict(line) -%}
                  {%- set dimensions = line.get('Dimension') -%}
                  {%- if 'Dimension' in line -%}
                    {%- set line = dict(line, Dimension=[] if dimensions is none else ([dimensions] if dimensions is mapping or dimensions is string else dimensions)) -%}
                  {%- endif -%}
                  {%- set allocations = line.get('TransactionAllocations') -%}
                  {%- set items = allocations.get('TransactionAllocation') if allocations is mapping else none -%}
                  {%- if allocations is mapping and 'TransactionAllocation' in allocations -%}
                    {%- set line = dict(line, TransactionAllocations=dict(allocations, TransactionAllocation=[] if items is none else ([items] if items is mapping or items is string else items))) -%}
                  {%- endif -%}
                  {%- set number = line.get('VatPercent') -%}
                  {%- if number is not none -%}
                    {%- set number = number | trim | replace(',', '.') -%}
                    {%- set line = dict(line, VatPercent={'valid': number | float}.pop('valid' if number | regex_search('^([+-]?[0-9]+(?:[.][0-9]+)?)$') else 'Invalid VatPercent')) -%}
                  {%- endif -%}
                  {{- line -}},
                {%- endfor -%}]
            - type: AddedFieldDefinition
              path:
                - VoucherDate
              value: |-
                {%- set date = record.get('VoucherDate') -%}
                {%- set value = date.get('value') if date is mapping else date -%}
                {{ format_datetime(value, '%Y-%m-%d', '%d.%m.%Y' if '.' in value else '%Y-%m-%d') if value else none }}
            - type: AddedFieldDefinition
              path:
                - _netvisor_sync_window_end
              value: "{{ stream_interval['window_end'] }}"

    accounting_locks:
      type: DeclarativeStream
      name: accounting_locks
      $parameters:
        resource_url_template: accountingperiodlist.nv
      primary_key:
        - company_id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/netvisor_requester"
        paginator:
          type: NoPagination
        decoder:
          type: XmlDecoder
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - Root
              - AccountingPeriodList
              - PeriodLockInformation
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/accounting_locks"
      transformations:
        - $ref: "#/definitions/normalize_xml"
        - $ref: "#/definitions/replace_normalized_record"
        - $ref: "#/definitions/record_metadata"
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - AccountingPeriodLockDate
              value: |-
                {%- set date = record.get('AccountingPeriodLockDate') -%}
                {%- set value = date.get('value') if date is mapping else date -%}
                {{ format_datetime(value, '%Y-%m-%d', '%d.%m.%Y' if '.' in value else '%Y-%m-%d') if value else none }}
            - type: AddedFieldDefinition
              path:
                - VatPeriodLockDate
              value: |-
                {%- set date = record.get('VatPeriodLockDate') -%}
                {%- set value = date.get('value') if date is mapping else date -%}
                {{ format_datetime(value, '%Y-%m-%d', '%d.%m.%Y' if '.' in value else '%Y-%m-%d') if value else none }}
            - type: AddedFieldDefinition
              path:
                - PurchaseLockDate
              value: |-
                {%- set date = record.get('PurchaseLockDate') -%}
                {%- set value = date.get('value') if date is mapping else date -%}
                {{ format_datetime(value, '%Y-%m-%d', '%d.%m.%Y' if '.' in value else '%Y-%m-%d') if value else none }}

    accounting_periods:
      type: DeclarativeStream
      name: accounting_periods
      $parameters:
        resource_url_template: accountingperiodlist.nv
      primary_key:
        - - company_id
        - - NetvisorKey
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/netvisor_requester"
        paginator:
          type: NoPagination
        decoder:
          type: XmlDecoder
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - Root
              - AccountingPeriodList
              - Period
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/accounting_periods"
      transformations:
        - $ref: "#/definitions/normalize_xml"
        - $ref: "#/definitions/replace_normalized_record"
        - $ref: "#/definitions/record_metadata"
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - BeginDate
              value: |-
                {%- set date = record.get('BeginDate') -%}
                {%- set value = date.get('value') if date is mapping else date -%}
                {{ format_datetime(value, '%Y-%m-%d', '%d.%m.%Y' if '.' in value else '%Y-%m-%d') if value else none }}
            - type: AddedFieldDefinition
              path:
                - EndDate
              value: |-
                {%- set date = record.get('EndDate') -%}
                {%- set value = date.get('value') if date is mapping else date -%}
                {{ format_datetime(value, '%Y-%m-%d', '%d.%m.%Y' if '.' in value else '%Y-%m-%d') if value else none }}

    accounts:
      type: DeclarativeStream
      name: accounts
      $parameters:
        resource_url_template: accountlist.nv
      primary_key:
        - - company_id
        - - NetvisorKey
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/netvisor_requester"
        paginator:
          type: NoPagination
        decoder:
          type: XmlDecoder
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - Root
              - AccountList
              - Accounts
              - Account
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/accounts"
      transformations:
        - $ref: "#/definitions/normalize_xml"
        - $ref: "#/definitions/replace_normalized_record"
        - $ref: "#/definitions/record_metadata"
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - IsActive
              value: "{{ {'0': false, '1': true}.pop(record.get('IsActive') | trim) }}"
            - type: AddedFieldDefinition
              path:
                - IsCumulative
              value: "{{ {'0': false, '1': true}.pop(record.get('IsCumulative') | trim) }}"
            - type: AddedFieldDefinition
              path:
                - IsNaturalNegative
              value: "{{ {'0': false, '1': true}.pop(record.get('IsNaturalNegative') | trim) }}"
        - type: AddFields
          condition: "{{ path[0] in record }}"
          fields:
            - type: AddedFieldDefinition
              path:
                - Sort
              value: |-
                {%- set number = record.get('Sort') -%}
                {{ {'valid': number | int}.pop('valid' if number | trim | regex_search('^([+-]?[0-9]+)$') else 'Invalid Sort') if number is not none else none }}
            - type: AddedFieldDefinition
              path:
                - EndSort
              value: |-
                {%- set number = record.get('EndSort') -%}
                {{ {'valid': number | int}.pop('valid' if number | trim | regex_search('^([+-]?[0-9]+)$') else 'Invalid EndSort') if number is not none else none }}
            - type: AddedFieldDefinition
              path:
                - ForeignName
              value: |-
                {%- set names = record.get('ForeignName') -%}
                {{ [] if names is none else ([names] if names is mapping or names is string else names) }}

    bank_accounts:
      type: DeclarativeStream
      name: bank_accounts
      $parameters:
        resource_url_template: getbankaccounts.nv
      primary_key:
        - - company_id
        - - IBAN
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/netvisor_requester"
        paginator:
          type: NoPagination
        decoder:
          type: XmlDecoder
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - Root
              - BankAccounts
              - BankAccount
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/bank_accounts"
      transformations:
        - $ref: "#/definitions/normalize_xml"
        - $ref: "#/definitions/replace_normalized_record"
        - $ref: "#/definitions/record_metadata"

    default_accounts:
      type: DeclarativeStream
      name: default_accounts
      $parameters:
        resource_url_template: accountlist.nv
      primary_key:
        - company_id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/netvisor_requester"
        paginator:
          type: NoPagination
        decoder:
          type: XmlDecoder
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - Root
              - AccountList
              - CompanyDefaultAccounts
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/default_accounts"
      transformations:
        - $ref: "#/definitions/normalize_xml"
        - $ref: "#/definitions/replace_normalized_record"
        - $ref: "#/definitions/record_metadata"

    default_voucher_types:
      type: DeclarativeStream
      name: default_voucher_types
      $parameters:
        resource_url_template: vouchertypelist.nv
      primary_key:
        - company_id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/netvisor_requester"
        paginator:
          type: NoPagination
        decoder:
          type: XmlDecoder
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - Root
              - VoucherTypeList
              - DefaultVoucherTypes
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/default_voucher_types"
      transformations:
        - $ref: "#/definitions/normalize_xml"
        - $ref: "#/definitions/replace_normalized_record"
        - $ref: "#/definitions/record_metadata"

    dimensions:
      type: DeclarativeStream
      name: dimensions
      $parameters:
        resource_url_template: dimensionlist.nv?showhidden=1
      primary_key:
        - - company_id
        - - Netvisorkey
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/netvisor_requester"
        paginator:
          type: NoPagination
        decoder:
          type: XmlDecoder
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - Root
              - DimensionNameList
              - DimensionName
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/dimensions"
      transformations:
        - $ref: "#/definitions/normalize_xml"
        - $ref: "#/definitions/replace_normalized_record"
        - $ref: "#/definitions/record_metadata"
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - IsHidden
              value: "{{ {'false': false, 'true': true}.pop(record.get('IsHidden') | trim | lower) }}"
            - type: AddedFieldDefinition
              path:
                - LinkType
              value: |-
                {%- set number = record.get('LinkType') -%}
                {{ {'valid': number | int}.pop('valid' if number | trim | regex_search('^([+-]?[0-9]+)$') else 'Invalid LinkType') }}
            - type: AddedFieldDefinition
              path:
                - ActivityPeriodStart
              value: |-
                {%- set date = record.get('ActivityPeriodStart') -%}
                {%- set value = date.get('value') if date is mapping else date -%}
                {{ format_datetime(value, '%Y-%m-%d', '%d.%m.%Y' if '.' in value else '%Y-%m-%d') if value else none }}
            - type: AddedFieldDefinition
              path:
                - ActivityPeriodEnd
              value: |-
                {%- set date = record.get('ActivityPeriodEnd') -%}
                {%- set value = date.get('value') if date is mapping else date -%}
                {{ format_datetime(value, '%Y-%m-%d', '%d.%m.%Y' if '.' in value else '%Y-%m-%d') if value else none }}
            - type: AddedFieldDefinition
              path:
                - DimensionDetails
              value: |-
                {%- set details = record.get('DimensionDetails') or {} -%}
                {%- set items = details.get('DimensionDetail') or [] -%}
                {%- set normalized = [] -%}
                {%- for item in ([items] if items is mapping else items) -%}
                  {%- set item = dict(item, IsHidden={'false': false, 'true': true}.pop(item.get('IsHidden') | trim | lower)) -%}
                  {%- for field in ['Level', 'Sort', 'EndSort'] -%}
                    {%- set number = item.get(field) -%}
                    {%- set _ = item.update({field: {'valid': number | int}.pop('valid' if number | trim | regex_search('^([+-]?[0-9]+)$') else 'Invalid ' ~ field)}) -%}
                  {%- endfor -%}
                  {%- set _ = normalized.append(item) -%}
                {%- endfor -%}
                {{ dict(details, DimensionDetail=normalized) }}

    voucher_types:
      type: DeclarativeStream
      name: voucher_types
      $parameters:
        resource_url_template: vouchertypelist.nv
      primary_key:
        - - company_id
        - - NetvisorKey
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/netvisor_requester"
        paginator:
          type: NoPagination
        decoder:
          type: XmlDecoder
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - Root
              - VoucherTypeList
              - VoucherTypes
              - VoucherType
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/voucher_types"
      transformations:
        - $ref: "#/definitions/normalize_xml"
        - $ref: "#/definitions/replace_normalized_record"
        - $ref: "#/definitions/record_metadata"
        - type: AddFields
          condition: "{{ path[0] in record }}"
          fields:
            - type: AddedFieldDefinition
              path:
                - ForeignName
              value: |-
                {%- set names = record.get('ForeignName') -%}
                {{ [] if names is none else ([names] if names is mapping or names is string else names) }}

streams:
  - $ref: "#/definitions/streams/account_balances"
  - $ref: "#/definitions/streams/accounting_ledger"
  - $ref: "#/definitions/streams/accounting_locks"
  - $ref: "#/definitions/streams/accounting_periods"
  - $ref: "#/definitions/streams/accounts"
  - $ref: "#/definitions/streams/bank_accounts"
  - $ref: "#/definitions/streams/default_accounts"
  - $ref: "#/definitions/streams/default_voucher_types"
  - $ref: "#/definitions/streams/dimensions"
  - $ref: "#/definitions/streams/voucher_types"

spec:
  type: Spec
  connection_specification:
    title: Netvisor
    type: object
    required:
      - environment
      - customer_id
      - customer_key
      - partner_id
      - partner_key
      - company_id
      - start_date
    properties:
      environment:
        type: string
        order: 0
        title: Environment
        enum:
          - test
          - production
        description: Netvisor environment to connect to. Use customer and partner credentials issued for the selected environment.
      customer_id:
        type: string
        order: 1
        title: Customer API ID
        description: Customer API identifier with read access.
      customer_key:
        type: string
        order: 2
        title: Customer API key
        description: Customer API key created in Netvisor together with the customer API ID.
        airbyte_secret: true
      partner_id:
        type: string
        order: 3
        title: Partner ID
        description: Partner ID for the same test or production environment as the customer API identifiers.
      partner_key:
        type: string
        order: 4
        title: Partner key
        description: Partner key issued by Netvisor together with the partner ID for the selected environment.
        airbyte_secret: true
      company_id:
        type: string
        order: 5
        title: Company business ID
        description: Business ID of the Netvisor company to read.
      start_date:
        type: string
        order: 6
        title: Sync history start date
        format: date
        description:
          Start date for ledger changes and daily account balances. Ledger history uses entry modification dates;
          balances use accounting dates and are refreshed through today (UTC) on every sync.
          Choose a date before the earliest history you need. Reference data is always retrieved in full.
      window_days:
        type: integer
        order: 7
        title: Days per request
        default: 30
        minimum: 1
        maximum: 31
        description:
          Number of days of ledger changes or daily account balances to retrieve per request. Smaller values reduce response sizes;
          larger values reduce the number of requests.
      language:
        type: string
        order: 8
        title: Response language
        enum:
          - FI
          - SE
          - EN
        default: EN
        description:
          Language for Netvisor's response messages, mainly errors. Choose FI (Finnish), SE (Swedish),
          or EN (English).
  config_normalization_rules:
    type: ConfigNormalizationRules
    transformations:
      - type: ConfigAddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - _netvisor_valid_date_range
            value: "{{ 'start_date' not in config or config['start_date'] <= now_utc().strftime('%Y-%m-%d') }}"
    validations:
      - type: DpathValidator
        field_path:
          - _netvisor_valid_date_range
        validation_strategy:
          type: ValidateAdheresToSchema
          base_schema:
            type: boolean
            const: true
            description: The sync history start date must be today or earlier.
      - type: DpathValidator
        field_path:
          - window_days
        validation_strategy:
          type: ValidateAdheresToSchema
          base_schema:
            type: integer
            minimum: 1
            maximum: 31

concurrency_level:
  type: ConcurrencyLevel
  # Netvisor requires sequential calls; overlapping requests to the same company can cause errors.
  default_concurrency: 1

schemas:
  account_balances:
    type: object
    description:
      Daily account debit, credit and balance totals from the sync history start date through today (UTC), refreshed on every sync.
      Interpret totals using IsCumulative in the accounts stream. Monetary values retain Netvisor's exact decimal representation.
    properties:
      company_id:
        type: string
      Netvisorkey:
        type: string
        description: References NetvisorKey in the accounts stream.
      Number:
        type:
          - string
          - "null"
      Name:
        type:
          - string
          - "null"
      ForeignName:
        type: array
        items:
          type:
            - object
            - string
          properties:
            value:
              type:
                - string
                - "null"
          additionalProperties: true
      Date:
        type: string
        format: date
      Debet:
        type: string
      Kredit:
        type: string
      Balance:
        type: string
    additionalProperties: true
    required:
      - company_id
      - Netvisorkey
      - Date
      - Debet
      - Kredit
      - Balance

