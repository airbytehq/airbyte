spec:
  type: Spec
  connection_specification:
    title: Netvisor
    type: object
    required:
      - environment
      - customer_id
      - customer_key
      - partner_id
      - partner_key
      - company_id
      - start_date
    properties:
      environment:
        type: string
        order: 0
        title: Environment
        enum:
          - test
          - production
        description: Netvisor environment to connect to. Use customer and partner credentials issued for the selected environment.
      customer_id:
        type: string
        order: 1
        title: Customer API ID
        description: Customer API identifier with read access.
      customer_key:
        type: string
        order: 2
        title: Customer API key
        description: Customer API key created in Netvisor together with the customer API ID.
        airbyte_secret: true
      partner_id:
        type: string
        order: 3
        title: Partner ID
        description: Partner ID for the same test or production environment as the customer API identifiers.
      partner_key:
        type: string
        order: 4
        title: Partner key
        description: Partner key issued by Netvisor together with the partner ID for the selected environment.
        airbyte_secret: true
      company_id:
        type: string
        order: 5
        title: Company business ID
        description: Business ID of the Netvisor company to read.
      start_date:
        type: string
        order: 6
        title: Sync history start date
        format: date
        description:
          Start date for ledger changes and monthly account balance snapshots. Ledger history uses entry modification dates;
          balances include month ends from the configured start month and today's balance for the current month (UTC).
          Choose a date before the earliest history you need. Reference data is always retrieved in full.
      window_days:
        type: integer
        order: 7
        title: Days per request
        default: 30
        minimum: 1
        maximum: 31
        description: Initial number of days of ledger changes to retrieve per request.
          Ledger details are fetched in batches of up to 500 vouchers within each time window.
      language:
        type: string
        order: 8
        title: Response language
        enum:
          - FI
          - SE
          - EN
        default: EN
        description:
          Language for Netvisor's response messages, mainly errors. Choose FI (Finnish), SE (Swedish),
          or EN (English).
  config_normalization_rules:
    type: ConfigNormalizationRules
    transformations:
      - type: ConfigAddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - _netvisor_valid_date_range
            value: "{{ 'start_date' not in config or config['start_date'] <= now_utc().strftime('%Y-%m-%d') }}"
    validations:
      - type: DpathValidator
        field_path:
          - _netvisor_valid_date_range
        validation_strategy:
          type: ValidateAdheresToSchema
          base_schema:
            type: boolean
            const: true
            description: The sync history start date must be today or earlier.
      - type: DpathValidator
        field_path:
          - window_days
        validation_strategy:
          type: ValidateAdheresToSchema
          base_schema:
            type: integer
            minimum: 1
            maximum: 31

concurrency_level:
  type: ConcurrencyLevel
  # Netvisor requires sequential calls; overlapping requests to the same company can cause errors.
  default_concurrency: 1

schemas:
  account_balances:
    type: object
    description:
      One account balance snapshot per calendar month from the history start month, refreshed on every sync.
      Date is the month end for completed months and the sync date (UTC) for the current month.
      Interpret totals using IsCumulative in the accounts stream. Monetary values retain Netvisor's exact decimal representation.
    properties:
      company_id:
        type: string
      Netvisorkey:
        type: string
        description: References NetvisorKey in the accounts stream.
      Number:
        type:
          - string
          - 'null'
      Name:
        type:
          - string
          - 'null'
      ForeignName:
        type: array
        items:
          type:
            - object
            - string
          properties:
            value:
              type:
                - string
                - 'null'
          additionalProperties: true
      Date:
        type: string
        format: date
      Debet:
        type: string
      Kredit:
        type: string
      Balance:
        type: string
    additionalProperties: true
    required:
      - company_id
      - Netvisorkey
      - Date
      - Debet
      - Kredit
      - Balance

