# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-linkly:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    bypass_reason:
      "No Airbyte-managed sandbox credentials yet. Auth, pagination, partitioning and
      incremental requests are covered by the mock-server tests in unit_tests/"
  basic_read:
    bypass_reason:
      "No Airbyte-managed sandbox credentials yet. Auth, pagination, partitioning and
      incremental requests are covered by the mock-server tests in unit_tests/"
  incremental:
    bypass_reason:
      "The `clicks` cursor is a calendar day with a 2-day lookback, so the last
      records are re-emitted on sequential reads by design"
  full_refresh:
    bypass_reason:
      "No Airbyte-managed sandbox credentials yet. Auth, pagination, partitioning and
      incremental requests are covered by the mock-server tests in unit_tests/"
