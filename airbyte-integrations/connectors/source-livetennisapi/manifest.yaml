                  - integer
                  - 'null'
              name:
                type:
                  - string
                  - 'null'
              tour:
                type:
                  - string
                  - 'null'
                description: The record's OWN tour, which is NOT the `tour` filter vocabulary. It is granular
                  (`juniors_boys`, `juniors_girls`, `challenger_men`) where the filter is grouped (`juniors`,
                  `challenger`), and a doubles team reports it UPPERCASE (`ATP`) where an individual reports
                  lowercase (`atp`). Treat it as an opaque string; do not parse it into the filter enum.
              country:
                type:
                  - string
                  - 'null'
              ranking:
                type:
                  - integer
                  - 'null'
              ranking_points:
                type:
                  - integer
                  - 'null'
              ranking_movement:
                type:
                  - string
                  - 'null'
              hand:
                type:
                  - string
                  - 'null'
              backhand:
                type:
                  - integer
                  - 'null'
              birthday:
                type:
                  - string
                  - 'null'
                format: date
              is_doubles_team:
                type:
                  - boolean
                  - 'null'
              data_completeness:
                type:
                  - object
                  - 'null'
                description: How much biographical detail is known for this player, so a consumer can
                  distinguish "not in the feed" from "not yet fetched" without probing. Present on every
                  player in a match payload. Lower tours carry far less of it than main tour.
                properties:
                  known:
                    type:
                      - integer
                      - 'null'
                    description: Fields populated, of `of`. NULL on a doubles team, where per-player biography
                      does not apply — distinct from `0`, which means the fields apply and none are known.
                      Do not decode this into a non-nullable integer.
                  of:
                    type:
                      - integer
                      - 'null'
                    description: Fields considered. NULL on a doubles team, as for `known`.
                  missing:
                    type:
                      - array
                      - 'null'
                    description: Names of the unpopulated fields, e.g. ["backhand", "hand"].
                    items:
                      type:
                        - string
                        - 'null'
                  note:
                    type:
                      - string
                      - 'null'
                    description: Present only when the object is not applicable, explaining why (e.g.
