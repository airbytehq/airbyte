connector_image: airbyte/source-livetennisapi:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    bypass_reason: "No credentials are configured in Airbyte CI yet. A free key (no card, 1,000 requests/day) can be provisioned at https://livetennisapi.com/subscribe/free and covers live_matches, upcoming_matches, players and fixtures; completed_matches needs a BASIC key. The author has offered Airbyte an unmetered key that covers all five streams."
