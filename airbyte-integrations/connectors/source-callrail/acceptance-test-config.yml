# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-callrail:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
      # Restore `config_path: "secrets/config.json"` with `status: "succeed"` once the GSM test config is rotated.
      - bypass_reason: "The GSM test config fails `check` and `read` with 401 Unauthorized ('You do not have access.')"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  # Once the GSM test config is rotated, restore the `secrets/config.json` entries with
  # `configured_catalog_path: "integration_tests/configured_catalog.json"`, and in `basic_read`
  # `empty_streams` set to `- name: "calls"` and `- name: "conversations"`.
  basic_read:
    bypass_reason: "The GSM test config fails `check` and `read` with 401 Unauthorized ('You do not have access.')"
  full_refresh:
    bypass_reason: "The GSM test config fails `check` and `read` with 401 Unauthorized ('You do not have access.')"
