version: 6.59.0

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - currencies

definitions:
  streams:
    deals:
      type: DeclarativeStream
      name: deals
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/v2_requester"
          path: api/v2/deals
          http_method: GET
          request_parameters:
            limit: "500"
            sort_by: update_time
            sort_direction: asc
            status: "open,won,lost,deleted"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/v2_cursor_paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: update_time
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%SZ"
          - "%Y-%m-%dT%H:%M:%S.%fZ"
          - "%Y-%m-%d %H:%M:%S"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ format_datetime(config.get('replication_start_date') or '2010-01-01T00:00:00Z', '%Y-%m-%dT%H:%M:%SZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_time_option:
          type: RequestOption
          field_name: updated_since
          inject_into: request_parameter
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/deals"

    # GET /api/v2/deals returns only not-archived deals; archived deals are served by /api/v2/deals/archived
    # with the same parameters and record shape, so they are read as a separate stream (same schema).
    deals_archived:
      type: DeclarativeStream
      name: deals_archived
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/v2_requester"
          path: api/v2/deals/archived
          http_method: GET
          request_parameters:
            limit: "500"
            sort_by: update_time
            sort_direction: asc
            status: "open,won,lost,deleted"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/v2_cursor_paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: update_time
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%SZ"
          - "%Y-%m-%dT%H:%M:%S.%fZ"
          - "%Y-%m-%d %H:%M:%S"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ format_datetime(config.get('replication_start_date') or '2010-01-01T00:00:00Z', '%Y-%m-%dT%H:%M:%SZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_time_option:
          type: RequestOption
          field_name: updated_since
          inject_into: request_parameter
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/deals"

    deal_fields:
      type: DeclarativeStream
      name: deal_fields
      primary_key:
        - key
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/dealFields
          http_method: GET
          request_parameters:
            limit: "500"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: start
          pagination_strategy:
            type: CursorPagination
            cursor_value: "{{ ((response.get('additional_data') or {}).get('pagination') or {}).get('next_start') }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/deal_fields"
    goals:
      type: DeclarativeStream
      name: goals
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/goals/find
          http_method: GET
          request_parameters:
            limit: "50"
            # Without an assignee filter Pipedrive returns only the token owner's goals; any
            # `assignee.type` returns everyone's goals of that type.
            assignee.type: "{{ stream_partition.assignee_type }}"
        partition_router:
          type: ListPartitionRouter
          cursor_field: assignee_type
          values:
            - person
            - team
            - company
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
              - goals
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/goals"
    files:
      type: DeclarativeStream
      name: files
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/files
          http_method: GET
          request_parameters:
            limit: "100"
            # An immutable sort key: an edit during the read cannot move a row to another page and skip one
            # (a row deleted or archived before the current offset still shifts the next page back by one).
            sort: "id ASC"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: start
          pagination_strategy:
            type: CursorPagination
            cursor_value: "{{ ((response.get('additional_data') or {}).get('pagination') or {}).get('next_start') }}"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: update_time
        # Re-read the last hour: a row edited after the read passed it keeps an update_time below the new state.
        lookback_window: PT1H
        cursor_datetime_formats:
          - "%Y-%m-%d %H:%M:%S"
        datetime_format: "%Y-%m-%d %H:%M:%S"
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ format_datetime(config.get('replication_start_date') or '2010-01-01T00:00:00Z', '%Y-%m-%d %H:%M:%S') }}"
          datetime_format: "%Y-%m-%d %H:%M:%S"
        is_client_side_incremental: true
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/files"

