version: 6.59.0

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - currencies

definitions:
  streams:
    deals:
      type: DeclarativeStream
      name: deals
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: api/v2/deals
          http_method: GET
          request_parameters:
            api_token: "{{ config['api_token'] }}"
            limit: "500"
            sort_by: update_time
            sort_direction: asc
            status: "open,won,lost,deleted"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/v2_cursor_paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: update_time
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%SZ"
          - "%Y-%m-%dT%H:%M:%S.%fZ"
          - "%Y-%m-%d %H:%M:%S"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ format_datetime(config.get('replication_start_date') or '2010-01-01T00:00:00Z', '%Y-%m-%dT%H:%M:%SZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_time_option:
          type: RequestOption
          field_name: updated_since
          inject_into: request_parameter
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/deals"

    # GET /api/v2/deals returns only not-archived deals; archived deals are served by /api/v2/deals/archived
    # with the same parameters and record shape, so they are read as a separate stream (same schema).
    deals_archived:
      type: DeclarativeStream
      name: deals_archived
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
