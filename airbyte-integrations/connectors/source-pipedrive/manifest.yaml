# Rate limits: https://pipedrive.readme.io/docs/core-api-concepts-rate-limiting
# Burst limit is per API token on a rolling 2-second window; the lowest plan (Essential/Lite)
# allows 20 requests per 2 seconds, so the budget uses that floor since the plan is not knowable
# from config. `x-ratelimit-reset` is intentionally not used: Pipedrive sends a relative window
# in seconds while the CDK parses that header as an epoch timestamp. When Pipedrive reports zero calls
# left in `x-ratelimit-remaining`, the CDK drains the bucket until the 2-second window rolls; otherwise
# the fixed window below is the actual throttle. The matcher is path-based so it also covers the
# per-company hosts that OAuth uses (`https://<company>.pipedrive.com/api/...`).
api_budget:
  type: HTTPAPIBudget
  ratelimit_remaining_header: x-ratelimit-remaining
  status_codes_for_ratelimit_hit: [429]
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 20
          interval: PT2S
      matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: "^(/api)?/v[12]/"

# The CDK needs at least 2 workers: with one, the partition generator holds the only thread and a
# substream with many parents (`deal_products`, `deal_flow`) waits forever
# (`ConcurrentDeclarativeSource._LOWEST_SAFE_CONCURRENCY_LEVEL`). Saved configs may hold 1, so the
# spec keeps that minimum and the value is raised to 2 here.
concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: "{{ [config.get('num_workers') or 3, 2] | max }}"
  max_concurrency: 10

spec:
  type: Spec
  documentation_url: https://docs.airbyte.com/integrations/sources/pipedrive
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    # `credentials` is not listed as required: the spec backward-compatibility check cannot see the config
    # migration below and would report a newly required property as breaking. Each option requires its fields.
    properties:
      credentials:
        type: object
        title: Authentication
        description: Choose how to authenticate to Pipedrive.
        order: 0
        oneOf:
          - type: object
            title: OAuth2.0
            required:
              - auth_type
              - client_id
              - client_secret
              - refresh_token
              - api_domain
            properties:
              auth_type:
                type: string
                const: oauth2.0
                order: 0
              client_id:
                type: string
                title: Client ID
                description: The Client ID of your Pipedrive OAuth app.
                airbyte_secret: true
                order: 1
              client_secret:
                type: string
                title: Client Secret
                description: The Client Secret of your Pipedrive OAuth app.
                airbyte_secret: true
                order: 2
              refresh_token:
                type: string
                title: Refresh Token
                description: Refresh token used to renew the access token.
                airbyte_secret: true
                order: 3
              access_token:
                type: string
                title: Access Token
                description: Access token for authenticated requests; renewed automatically.
                airbyte_secret: true
                order: 4
              token_expiry_date:
                type: string
                title: Token Expiry Date
                description: The date-time when the access token expires.
                format: date-time
                order: 5
              api_domain:
                type: string
                title: API Domain
                description: >-
                  Company-specific API host returned by the OAuth token response, for
                  example https://mycompany.pipedrive.com. OAuth requests must go to this host.
                examples:
                  - https://mycompany.pipedrive.com
                # The Bearer token is sent to this host, so only a Pipedrive company host is accepted.
                pattern: "^https://[A-Za-z0-9-]+\\.pipedrive\\.com$"
                pattern_descriptor: "https://<company>.pipedrive.com"
                order: 6
            additionalProperties: true
          - type: object
            title: API Token
            required:
              - auth_type
              - api_token
            properties:
              auth_type:
                type: string
                const: api_token
                order: 0
              api_token:
                type: string
                title: API Token
                description: >-
                  Your personal Pipedrive API token. In Pipedrive, click your name (top
                  right) > Company settings > Personal preferences > API and copy the
                  token. If the API tab is missing, ask your Pipedrive admin to enable
                  API access for your user.
                airbyte_secret: true
                order: 1
            additionalProperties: true
      # Configs saved before 4.2.0 keep their top-level token after the migration below copies it into
      # `credentials`; declared as a hidden secret so the platform keeps it masked and 4.1.x can still read it.
      api_token:
        type: string
        title: API Token (before 4.2.0)
        description: The API token of configs saved before 4.2.0. The connector reads the token from Authentication.
        airbyte_secret: true
        airbyte_hidden: true
      replication_start_date:
        type: string
        title: Start Date
        description: >-
          Only records created or updated on or after this UTC date and time are
          replicated. Format YYYY-MM-DDTHH:MM:SSZ, for example
          2017-01-25T00:00:00Z. Defaults to 2010-01-01T00:00:00Z when left
          empty.
        default: "2010-01-01T00:00:00Z"
        examples:
          - "2017-01-25T00:00:00Z"
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}([T ][0-9]{2}:[0-9]{2}(:[0-9]{2}(\.[0-9]+)?)?(Z|[+-][0-9]{2}:?[0-9]{2})?)?$'
        pattern_descriptor: "YYYY-MM-DDTHH:MM:SSZ"
        order: 1
      num_workers:
        type: integer
        title: Number of concurrent workers
        description: >-
          Number of streams synced in parallel (2-10; a value of 1 runs with 2 workers). All requests
          share one client-side request budget sized to Pipedrive's lowest-plan burst limit, so higher
          values rarely make a sync faster.
        minimum: 1
        maximum: 10
        default: 3
        order: 2
    additionalProperties: true
  advanced_auth:
    auth_flow_type: oauth2.0
    predicate_key:
      - credentials
      - auth_type
    predicate_value: oauth2.0
    oauth_config_specification:
      oauth_connector_input_specification:
        consent_url: https://oauth.pipedrive.com/oauth/authorize?{{client_id_param}}&{{redirect_uri_param}}&{{state_param}}
        access_token_url: https://oauth.pipedrive.com/oauth/token
        access_token_headers:
          Authorization: "Basic {{ (client_id_value ~ ':' ~ client_secret_value) | b64encode }}"
          Content-Type: application/x-www-form-urlencoded
        access_token_params:
          grant_type: authorization_code
          redirect_uri: "{{ redirect_uri_value }}"
          code: "{{ auth_code_value }}"
        extract_output:
          - access_token
          - refresh_token
          - expires_in
          - api_domain
      complete_oauth_output_specification:
        type: object
        additionalProperties: false
        properties:
          refresh_token:
            type: string
            path_in_connector_config:
              - credentials
              - refresh_token
          access_token:
            type: string
            path_in_connector_config:
              - credentials
              - access_token
          token_expiry_date:
            type: string
            path_in_connector_config:
              - credentials
              - token_expiry_date
          api_domain:
            type: string
            path_in_connector_config:
              - credentials
              - api_domain
      complete_oauth_server_input_specification:
        type: object
        additionalProperties: false
        properties:
          client_id:
            type: string
          client_secret:
            type: string
      complete_oauth_server_output_specification:
        type: object
        additionalProperties: false
        properties:
          client_id:
            type: string
            path_in_connector_config:
              - credentials
              - client_id
          client_secret:
            type: string
            path_in_connector_config:
              - credentials
              - client_secret
  config_normalization_rules:
    type: ConfigNormalizationRules
    config_migrations:
      - type: ConfigMigration
        description: Lift the pre-2.0.0 `authorization.api_token` field to the top-level `api_token`.
        transformations:
          - type: ConfigAddFields
            fields:
              - type: AddedFieldDefinition
                path: ["api_token"]
                value: "{{ config.get('authorization', {}).get('api_token') }}"
            condition: "{{ config.get('api_token') is none and config.get('authorization', {}).get('api_token') is not none }}"
      # Runs after the lift above, so pre-2.0.0 configs reach the credentials shape in one pass. One field per
      # transformation: the condition is re-checked against the config the previous one changed.
      - type: ConfigMigration
        description: Wrap the flat `api_token` of 2.x-4.1.x configs into `credentials` with `auth_type` api_token.
        transformations:
          - type: ConfigAddFields
            fields:
              - type: AddedFieldDefinition
                path: ["credentials", "api_token"]
                value: "{{ config.get('api_token') }}"
                value_type: string
            condition: "{{ config.get('api_token') and not config.get('credentials', {}).get('api_token') and not config.get('credentials', {}).get('auth_type') }}"
          - type: ConfigAddFields
            fields:
              - type: AddedFieldDefinition
                path: ["credentials", "auth_type"]
                value: "api_token"
                value_type: string
            condition: "{{ config.get('credentials', {}).get('api_token') and not config.get('credentials', {}).get('auth_type') }}"
      - type: ConfigMigration
        description: Lower a `num_workers` above 10 to 10; versions 2.3.0 to 2.3.7 allowed up to 40 and saved configs keep the old value.
        transformations:
          - type: ConfigAddFields
            fields:
              - type: AddedFieldDefinition
                path: ["num_workers"]
                value: "10"
                value_type: integer
            condition: "{{ config.get('num_workers') is number and config.get('num_workers') > 10 }}"

