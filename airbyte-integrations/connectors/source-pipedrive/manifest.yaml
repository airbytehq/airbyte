  # Two request bases. With an API token both API versions live on the shared host the vendor OpenAPI documents
  # (v1 server https://api.pipedrive.com/v1, v2 server https://api.pipedrive.com/api/v2). With OAuth every request
  # must go to the company host from the token response (`credentials.api_domain`), where both versions sit under
  # /api/. Stream paths keep their `v1/` or `api/v2/` prefix: v1 streams use this requester, v2 streams
  # `v2_requester`, so the token URLs stay exactly as before.
  base_requester:
    type: HttpRequester
    url_base: "{{ (config['credentials']['api_domain'] ~ '/api/') if config.get('credentials', {}).get('auth_type') == 'oauth2.0' else 'https://api.pipedrive.com/' }}"
    authenticator:
      type: SelectiveAuthenticator
      authenticator_selection_path:
        - credentials
        - auth_type
      authenticators:
        oauth2.0:
          type: OAuthAuthenticator
          client_id: "{{ config['credentials']['client_id'] }}"
          client_secret: "{{ config['credentials']['client_secret'] }}"
          refresh_token: "{{ config['credentials']['refresh_token'] }}"
          token_refresh_endpoint: https://oauth.pipedrive.com/oauth/token
          grant_type: refresh_token
          # Pipedrive expects the client credentials as a Basic header; with this header set the CDK leaves them
          # out of the request body.
          refresh_request_headers:
            Authorization: "Basic {{ (config['credentials']['client_id'] + ':' + config['credentials']['client_secret']) | base64encode }}"
          refresh_token_updater:
            refresh_token_name: refresh_token
            access_token_config_path:
              - credentials
              - access_token
            refresh_token_config_path:
              - credentials
              - refresh_token
            token_expiry_date_config_path:
              - credentials
              - token_expiry_date
        # Pipedrive documents only the `x-api-token` header for API tokens
        # (https://pipedrive.readme.io/docs/core-api-concepts-authentication); the `api_token` query
        # parameter is no longer documented and would also put the token in every URL.
        api_token:
          type: ApiKeyAuthenticator
          api_token: "{{ config['credentials']['api_token'] }}"
          inject_into:
            type: RequestOption
            inject_into: header
            field_name: x-api-token
    error_handler:
      $ref: "#/definitions/base_error_handler"
  v2_requester:
    $ref: "#/definitions/base_requester"
    url_base: "{{ (config['credentials']['api_domain'] ~ '/') if config.get('credentials', {}).get('auth_type') == 'oauth2.0' else 'https://api.pipedrive.com/' }}"
  base_error_handler:
    type: DefaultErrorHandler
    max_retries: 10
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: x-ratelimit-reset
        max_waiting_time_in_seconds: 300
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - $ref: "#/definitions/error_filters/scope_mismatch"
      - $ref: "#/definitions/error_filters/oauth_token_rejected"
      - $ref: "#/definitions/error_filters/unauthorized"
      - $ref: "#/definitions/error_filters/payment_required"
      - $ref: "#/definitions/error_filters/forbidden"
      - $ref: "#/definitions/error_filters/gone"
      - $ref: "#/definitions/error_filters/feature_not_enabled"
      - $ref: "#/definitions/error_filters/not_implemented"
      - $ref: "#/definitions/error_filters/rate_limited"
  error_filters:
    # Pipedrive answers 403 "Scope and URL mismatch" when the OAuth app was not granted the scope an endpoint needs.
    # That is a setup problem, not a per-record permission, so it is listed first everywhere and fails even on
    # streams that skip other 403s. No http_codes: the CDK ORs the criteria, so a code list would catch every 403.
    scope_mismatch:
      type: HttpResponseFilter
      error_message_contains: "Scope and URL mismatch"
      action: FAIL
      failure_type: config_error
      error_message: >-
        The Pipedrive OAuth app lacks the scope this stream needs (403: Scope and URL mismatch). On Airbyte Cloud,
        deselect the stream and contact Airbyte support; with your own Pipedrive OAuth app, grant the scope in the
        Pipedrive Developer Hub and re-authenticate the source.
    # A request signed just before the access token expires can reach Pipedrive after it expired (the request budget
    # may hold it after signing), so an OAuth 401 refreshes the token once and retries; a second rejection fails as
    # config_error. A predicate cannot see the config, so it keys on the company host: API-token requests go to
    # api.pipedrive.com and keep failing at once through `unauthorized`.
    oauth_token_rejected:
      type: HttpResponseFilter
      predicate: "{{ (response if response is mapping else {}).get('errorCode') == 401 and '://api.pipedrive.com/' not in request_url }}"
      action: REFRESH_TOKEN_THEN_RETRY
      error_message: Pipedrive rejected the OAuth access token; refreshing it once and retrying.
    unauthorized:
      type: HttpResponseFilter
      http_codes: [401]
      action: FAIL
      failure_type: config_error
      error_message: >-
        {%- if config.get('credentials', {}).get('auth_type') == 'oauth2.0' -%}
        Pipedrive rejected the OAuth access token (401: {{ (((response if response is mapping else {}).get('error') or 'unauthorized access') ~ '')[:300] }}).
        Re-authenticate the source in Airbyte: the refresh token expired or was revoked, or the app was
        uninstalled from this Pipedrive company.
        {%- else -%}
        Pipedrive rejected the API token (401: {{ (((response if response is mapping else {}).get('error') or 'unauthorized access') ~ '')[:300] }}).
        In Pipedrive, open Company settings > Personal preferences > API, copy the current API token
        and update it in the connector configuration. If the API tab is missing, ask a Pipedrive
        company admin to enable API access for your user.
        {%- endif -%}
    payment_required:
      type: HttpResponseFilter
      http_codes: [402]
      action: FAIL
      failure_type: config_error
      error_message: >-
        Your Pipedrive company account is not active (402: {{ (((response if response is mapping else {}).get('error') or 'payment required') ~ '')[:300] }}).
        The trial has expired or billing details are missing. Reactivate the company account in
        Pipedrive billing settings, then retry the sync.
    forbidden:
      type: HttpResponseFilter
      http_codes: [403]
      action: FAIL
      failure_type: config_error
      error_message: >-
        Pipedrive refused the request (403: {{ (((response if response is mapping else {}).get('error') or 'forbidden') ~ '')[:300] }}).
        The Pipedrive user the source connects as does not have permission to read this data, the Pipedrive plan
        does not include it, or Pipedrive's Cloudflare protection blocked the requests after repeated rate-limit
        violations. Connect as a user with access to this data, upgrade the plan, or reduce the sync frequency and
        retry later.
    gone:
      type: HttpResponseFilter
      http_codes: [410]
      action: FAIL
      error_message: >-
        Pipedrive reports this resource as permanently removed (410: {{ (((response if response is mapping else {}).get('error') or 'gone') ~ '')[:300] }}).
        The endpoint may have been retired by Pipedrive. Upgrade to the latest connector version or
        disable the affected stream.
    feature_not_enabled:
      type: HttpResponseFilter
      http_codes: [415]
      action: FAIL
      failure_type: config_error
      error_message: >-
        Pipedrive reports that a feature this stream reads is not enabled for your company
        (415: {{ (((response if response is mapping else {}).get('error') or 'feature is not enabled') ~ '')[:300] }}).
        Enable the feature in Pipedrive company settings, or deselect the stream.
    not_implemented:
      type: HttpResponseFilter
      http_codes: [501]
      action: FAIL
      failure_type: system_error
      error_message: >-
        Pipedrive does not support a request the connector sent (501: {{ (((response if response is mapping else {}).get('error') or 'not implemented') ~ '')[:300] }}).
        This is a connector defect; report it to Airbyte with the stream name.
    rate_limited:
      type: HttpResponseFilter
      http_codes: [429]
      action: RATE_LIMITED
      error_message: >-
        Pipedrive rate limit reached (429: {{ (((response if response is mapping else {}).get('error') or 'request over limit') ~ '')[:300] }}). Airbyte waits for
        the window reported by the x-ratelimit-reset header and retries. Burst limits are 20-120 requests
        per 2 seconds per token depending on plan. If every request is rejected, the daily API token budget
        is exhausted and resets at midnight (Pipedrive server time): reduce sync frequency or upgrade the plan.
    # The CDK default retries these too, but on the per-stream handlers they must match before html_error_page,
    # or an HTML maintenance or gateway page fails instead of being retried. No message, so the CDK mapping keeps
    # its text for these statuses.
    server_error_retry:
      type: HttpResponseFilter
      http_codes: [408, 500, 502, 503, 504]
      action: RETRY
    # The other standard 5xx and Cloudflare's 520-527 and 530, for the same reason. The CDK mapping has no text for
    # them, so the message keeps Pipedrive's body in the final error once the retries run out.
    gateway_error_retry:
      type: HttpResponseFilter
      http_codes: [505, 506, 507, 508, 509, 510, 511, 520, 521, 522, 523, 524, 525, 526, 527, 530]
      action: RETRY
      error_message: >-
        Pipedrive or its Cloudflare edge answered with a server or gateway error on every retry
        ({{ (((response if response is mapping else {}).get('error') or 'server error') ~ '')[:300] }}). Retry the sync later.
    # No message or failure type, so the CDK default classification applies (FAIL, system_error). Listed before
    # html_error_page so an HTML 400 or 405 keeps it.
    client_error:
      type: HttpResponseFilter
      http_codes: [400, 405]
      action: FAIL
    # The same, for requesters that do not skip a 404: API v2 answers a route it does not know with an HTML 404 page.
    not_found:
      type: HttpResponseFilter
      http_codes: [404]
      action: FAIL
    # Every status filter must come first: the predicate cannot see the status, and HttpResponseFilter matches
    # status OR predicate. Pipedrive answers with HTML for Cloudflare's 403 block after repeated rate-limit
    # violations and for an API v2 route it does not know (404); a missing record answers with JSON.
    html_error_page:
      type: HttpResponseFilter
      predicate: "{{ 'text/html' in (headers.get('Content-Type') or '') }}"
      action: FAIL
      failure_type: config_error
      error_message: >-
        Pipedrive answered with an HTML page instead of JSON. Pipedrive's Cloudflare protection sends one (403)
        after repeated rate-limit violations: reduce the sync frequency and retry later. If this keeps happening,
        Pipedrive may no longer serve an endpoint this stream reads; report it to Airbyte with the stream name.
  substream_missing_parent_error_handler:
    $ref: "#/definitions/base_error_handler"
    response_filters:
      - $ref: "#/definitions/error_filters/scope_mismatch"
      - $ref: "#/definitions/error_filters/oauth_token_rejected"
      - $ref: "#/definitions/error_filters/unauthorized"
      - $ref: "#/definitions/error_filters/payment_required"
      - $ref: "#/definitions/error_filters/feature_not_enabled"
      - $ref: "#/definitions/error_filters/not_implemented"
      - $ref: "#/definitions/error_filters/rate_limited"
      - $ref: "#/definitions/error_filters/server_error_retry"
      - $ref: "#/definitions/error_filters/gateway_error_retry"
      - $ref: "#/definitions/error_filters/client_error"
      - $ref: "#/definitions/error_filters/html_error_page"
      # After the HTML guard: a deleted or merged parent answers with JSON, while an HTML 404 is a route
      # Pipedrive no longer serves and must not empty the stream silently.
      - type: HttpResponseFilter
        http_codes: [404, 410]
        action: IGNORE
        error_message: >-
          Pipedrive no longer has the parent record for this request ({{ (((response if response is mapping else {}).get('error') or 'not found') ~ '')[:300] }});
          it was deleted or merged after the parent stream was read. Skipping its child records and continuing.
      - type: HttpResponseFilter
        http_codes: [403]
        action: IGNORE
        error_message: >-
          Pipedrive denied access to the parent record for this request ({{ (((response if response is mapping else {}).get('error') or 'forbidden') ~ '')[:300] }});
          the Pipedrive user the source connects as cannot see it. Skipping its child records and continuing.
          Connect as a user with wider visibility to sync these records.
  v2_cursor_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: cursor
    pagination_strategy:
      type: CursorPagination
      cursor_value: "{{ (response.get('additional_data') or {}).get('next_cursor') }}"

