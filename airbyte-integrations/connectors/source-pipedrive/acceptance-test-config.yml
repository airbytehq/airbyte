# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-pipedrive:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        fail_on_extra_columns: false
        empty_streams:
          - name: files
          - name: filters
          - name: leads
          - name: notes
          - name: activities
          - name: pipelines
          - name: products
          - name: stages
          - name: deal_products
          - name: mail
          - name: call_logs
            bypass_reason: "Sandbox account has no call logs (requires a phone integration)."
          - name: lead_sources
            bypass_reason: "Sandbox account has no leads / lead sources."
          - name: legacy_teams
            bypass_reason: "Sandbox account has no legacy teams (deprecated feature)."
          - name: projects
            bypass_reason: "Sandbox account does not have the Projects add-on."
          - name: tasks
            bypass_reason: "Sandbox account does not have the Projects add-on."
          - name: deal_installments
            bypass_reason: "Sandbox account plan does not include deal installments."
          - name: deal_flow
            bypass_reason: "Sandbox account has no deals, so no deal change history."
          - name: permission_set_assignments
            bypass_reason: "Sandbox account token is not an admin token."
      - config_path: "secrets/config.json"
        expect_records:
          path: "integration_tests/expected_records.jsonl"
          exact_order: no
        configured_catalog_path: "integration_tests/configured_catalog.json"
        fail_on_extra_columns: false
        empty_streams:
          - name: files
          - name: filters
          - name: leads
          - name: notes
          - name: activities
          - name: pipelines
          - name: products
          - name: stages
          - name: deal_products
          - name: mail
          - name: deals
          - name: users
          - name: persons
          - name: call_logs
            bypass_reason: "Sandbox account has no call logs (requires a phone integration)."
          - name: lead_sources
            bypass_reason: "Sandbox account has no leads / lead sources."
          - name: legacy_teams
            bypass_reason: "Sandbox account has no legacy teams (deprecated feature)."
          - name: projects
            bypass_reason: "Sandbox account does not have the Projects add-on."
          - name: tasks
            bypass_reason: "Sandbox account does not have the Projects add-on."
          - name: deal_installments
            bypass_reason: "Sandbox account plan does not include deal installments."
          - name: deal_flow
            bypass_reason: "Sandbox account has no deals, so no deal change history."
          - name: permission_set_assignments
            bypass_reason: "Sandbox account token is not an admin token."

  incremental:
    bypass_reason: "All incremental streams are empty in sandbox account."
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
