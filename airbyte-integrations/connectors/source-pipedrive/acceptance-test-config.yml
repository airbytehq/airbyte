# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-pipedrive:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
      - config_path: "integration_tests/invalid_token_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        fail_on_extra_columns: false
        empty_streams:
          - name: mail
            bypass_reason: "Sandbox user has no Pipedrive mail connection: GET /v1/mailbox/mailThreads returns data: [] for every folder."
          - name: mailThreads
            bypass_reason: "Sandbox user has no Pipedrive mail connection, so there are no threads to list."
          - name: call_logs
            bypass_reason: "Sandbox company has no phone integration, so GET /v1/callLogs returns no rows."
          - name: legacy_teams
            bypass_reason: "Sandbox company has the Teams feature disabled: GET /v1/legacyTeams answers 403, which the stream ignores."
          - name: projects
            bypass_reason: "Sandbox plan lacks the Projects suite: GET /api/v2/projects answers 402, which the stream ignores."
          - name: tasks
            bypass_reason: "Sandbox plan lacks the Projects suite: GET /api/v2/tasks answers 402, which the stream ignores."
          - name: deal_installments
            bypass_reason: "Sandbox plan has no access to installments: GET /api/v2/deals/installments answers 403, which the stream ignores."
      - config_path: "secrets/config.json"
        expect_records:
          path: "integration_tests/expected_records.jsonl"
          exact_order: no
        configured_catalog_path: "integration_tests/configured_catalog.json"
        fail_on_extra_columns: false
        empty_streams:
          - name: mail
            bypass_reason: "Sandbox user has no Pipedrive mail connection: GET /v1/mailbox/mailThreads returns data: [] for every folder."
          - name: mailThreads
            bypass_reason: "Sandbox user has no Pipedrive mail connection, so there are no threads to list."
          - name: call_logs
            bypass_reason: "Sandbox company has no phone integration, so GET /v1/callLogs returns no rows."
          - name: legacy_teams
            bypass_reason: "Sandbox company has the Teams feature disabled: GET /v1/legacyTeams answers 403, which the stream ignores."
          - name: projects
            bypass_reason: "Sandbox plan lacks the Projects suite: GET /api/v2/projects answers 402, which the stream ignores."
          - name: tasks
            bypass_reason: "Sandbox plan lacks the Projects suite: GET /api/v2/tasks answers 402, which the stream ignores."
          - name: deal_installments
            bypass_reason: "Sandbox plan has no access to installments: GET /api/v2/deals/installments answers 403, which the stream ignores."

  incremental:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        future_state:
          future_state_path: "integration_tests/abnormal_state.json"
