data:
  ab_internal:
    ql: 300
    sl: 100
  allowedHosts:
    hosts:
      - api.pipedrive.com
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-pipedrive
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  connectorSubtype: api
  connectorType: source
  definitionId: d8286229-c680-4063-8c59-23b9b391c700
  dockerImageTag: 2.6.0
  dockerRepository: airbyte/source-pipedrive
  documentationUrl: https://docs.airbyte.com/integrations/sources/pipedrive
  githubIssueLabel: source-pipedrive
  icon: pipedrive.svg
  license: ELv2
  maxSecondsBetweenMessages: 10800
  name: Pipedrive
  releases:
    breakingChanges:
      2.0.0:
        upgradeDeadline: 2023-10-04
        message:
          "This version removes the `pipeline_ids` field from the `deal_fields`
          stream. Config has changed to only use API key. Please update your config."
  releaseDate: 2021-07-19
  releaseStage: alpha
  suggestedStreams:
    streams:
      - deals
      - persons
      - organizations
      - activities
      - leads
      - pipelines
      - stages
      - users
  supportLevel: community
  tags:
    - cdk:low-code
    - language:manifest-only
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: pipedrive_old_config_dev_null
          id: 7bd5c95e-ead8-42a7-8c5a-6cfd50b1f0e0
        - name: pipedrive_config_dev_null
          id: 8278c55c-e9e9-4403-a001-b47aaac3535f
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-PIPEDRIVE__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.28.3@sha256:6c926ab34644e3fb6f5422aea148599eef8a8d877cd8b8b28b3e7af914d93bbf
  externalDocumentationUrls:
    - title: Pipedrive API reference
      url: https://developers.pipedrive.com/docs/api/v1
      type: api_reference
    - title: Changelog
      url: https://developers.pipedrive.com/changelog
      type: api_release_history
    - title: Pipedrive authentication
      url: https://pipedrive.readme.io/docs/core-api-concepts-authentication
      type: authentication_guide
    - title: Pipedrive rate limits
      url: https://pipedrive.readme.io/docs/core-api-concepts-rate-limiting
      type: rate_limits
    - title: API v1 endpoint deprecation announcement
      url: https://developers.pipedrive.com/changelog/post/deprecation-of-selected-api-v1-endpoints
      type: api_deprecations
    - title: Deprecated API v1 endpoints out of support
      url: https://developers.pipedrive.com/changelog/post/deprecated-apiv1-endpoints-become-out-of-support
      type: api_deprecations
    - title: API v2 migration guide
      url: https://pipedrive.readme.io/docs/pipedrive-api-v2-migration-guide
      type: api_deprecations
    - title: Changes to the API (breaking change policy)
      url: https://pipedrive.readme.io/docs/changes-to-the-api
      type: api_deprecations
    - title: OpenAPI specification
      url: https://developers.pipedrive.com/docs/api/v1/openapi.yaml
      type: openapi_spec
metadataSpecVersion: "1.0"
