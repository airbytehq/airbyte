data:
  ab_internal:
    ql: 300
    sl: 100
  allowedHosts:
    hosts:
      - api.pipedrive.com
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-pipedrive
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  connectorSubtype: api
  connectorType: source
  definitionId: d8286229-c680-4063-8c59-23b9b391c700
  dockerImageTag: 3.0.0
  dockerRepository: airbyte/source-pipedrive
  documentationUrl: https://docs.airbyte.com/integrations/sources/pipedrive
  githubIssueLabel: source-pipedrive
  icon: pipedrive.svg
  license: ELv2
  maxSecondsBetweenMessages: 10800
  name: Pipedrive
  releases:
    breakingChanges:
      "3.0.0":
        upgradeDeadline: "2026-09-25"
        deadlineAction: "disable"
        message: >-
          Version 3.0.0 reads deals, persons, organizations, activities, products, pipelines, stages and deal_products from Pipedrive API v2 and reads notes, files, filters, users and leads from their list endpoints instead of the Recents feed, which capped history to one month. Record shapes, primary keys, sync modes and timestamp types change on 23 streams. After upgrading, refresh the source schema, clear the affected streams and run a sync. Clearing removes rows for records deleted in Pipedrive; back them up first if you need them. See https://docs.airbyte.com/integrations/sources/pipedrive-migrations#upgrading-to-300.
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - deals
              - persons
              - organizations
              - activities
              - products
              - pipelines
              - stages
              - notes
              - files
              - filters
              - users
              - deal_products
              - deal_fields
              - activity_fields
              - organization_fields
              - person_fields
              - product_fields
              - lead_labels
              - leads
              - activity_types
              - currencies
              - permission_sets
              - roles
      2.0.0:
        upgradeDeadline: 2023-10-04
        message:
          "This version removes the `pipeline_ids` field from the `deal_fields`
          stream. Config has changed to only use API key. Please update your config."
  releaseDate: 2021-07-19
  releaseStage: alpha
  suggestedStreams:
    streams:
      - deals
      - persons
      - organizations
      - activities
      - leads
      - pipelines
      - stages
      - users
  supportLevel: community
  tags:
    - cdk:low-code
    - language:manifest-only
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: pipedrive_old_config_dev_null
          id: 7bd5c95e-ead8-42a7-8c5a-6cfd50b1f0e0
        - name: pipedrive_config_dev_null
          id: 8278c55c-e9e9-4403-a001-b47aaac3535f
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-PIPEDRIVE__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.28.3@sha256:6c926ab34644e3fb6f5422aea148599eef8a8d877cd8b8b28b3e7af914d93bbf
  externalDocumentationUrls:
    - title: Pipedrive API reference
      url: https://developers.pipedrive.com/docs/api/v1
      type: api_reference
    - title: Changelog
      url: https://developers.pipedrive.com/changelog
      type: api_release_history
    - title: Pipedrive authentication
      url: https://pipedrive.readme.io/docs/core-api-concepts-authentication
      type: authentication_guide
    - title: Pipedrive rate limits
      url: https://pipedrive.readme.io/docs/core-api-concepts-rate-limiting
      type: rate_limits
metadataSpecVersion: "1.0"
