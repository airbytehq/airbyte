data:
  connectorSubtype: api
  connectorType: source
  definitionId: 1901024c-0249-45d0-bcac-31a954652927
  dockerImageTag: 1.0.0
  dockerRepository: airbyte/source-instatus
  githubIssueLabel: source-instatus
  icon: instatus.svg
  license: ELv2
  name: Instatus
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-instatus
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releases:
    breakingChanges:
      1.0.0:
        message: >-
          The `name` field of the `metrics` stream changes type from string to object,
          because the Instatus API returns metric names as translation objects, such as
          `{"default": "Response time"}`. Only connections that sync the `metrics` stream are
          affected. After upgrading, refresh the source schema and clear the `metrics` stream.
          For details, see the migration guide:
          https://docs.airbyte.com/integrations/sources/instatus-migrations#upgrading-to-100
        upgradeDeadline: "2026-10-29"
        deadlineAction: auto_upgrade
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - metrics
  releaseStage: alpha
  documentationUrl: https://docs.airbyte.com/integrations/sources/instatus
  tags:
    - cdk:low-code
    - language:manifest-only
  ab_internal:
    sl: 100
    ql: 100
  supportLevel: community
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: instatus_config_dev_null
          id: 6c2e5836-6ed5-400d-987e-4d6d37fad4b4
    - suite: unitTests
