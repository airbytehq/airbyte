# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-netsuite:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "source_netsuite/spec.yaml"
  connection:
    tests:
      # This config's realm is not a valid hostname, so `check` raises instead of reporting FAILED.
      - config_path: "sample_files/invalid_config.json"
        status: "exception"
      - bypass_reason: "The GSM test config fails `check` and `discover` with 401 Unauthorized"
  discovery:
    bypass_reason: "The GSM test config fails `check` and `discover` with 401 Unauthorized"
  basic_read:
    bypass_reason: "The GSM test config fails `check` and `discover` with 401 Unauthorized"
  full_refresh:
    bypass_reason: "The GSM test config fails `check` and `discover` with 401 Unauthorized"
  incremental:
    bypass_reason: "The GSM test config fails `check` and `discover` with 401 Unauthorized"
