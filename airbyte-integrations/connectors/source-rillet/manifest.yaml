spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    title: Rillet Source Spec
    required:
      - api_key
    additionalProperties: true
    properties:
      api_key:
        type: string
        title: API Key
        description:
          Rillet API key. Ask your Rillet team to enable API access, then create a key under
          Organization Settings > API Access (https://app.rillet.io/settings/api-access).
        airbyte_secret: true
        order: 0
      environment:
        type: string
        title: Environment
        description: Use sandbox for keys issued for https://sandbox.api.rillet.com.
        enum:
          - production
          - sandbox
        default: production
        order: 1
      start_date:
        type: string
        title: Start Date
        description:
          "Only used by incremental streams on the first sync: records updated after this UTC
          timestamp are read. Leave empty to read the full history."
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        examples:
          - "2025-01-01T00:00:00Z"
        order: 2
concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: 2
