version: 7.45.0
type: DeclarativeSource
description:
  Sync your general ledger, chart of accounts, accounts receivable, accounts payable and banking
  data from the Rillet Accounting API. Streams with an updated_at field sync incrementally using the API's
  updated.gt filter.
check:
  type: CheckStream
  stream_names:
    - organization
definitions:
  error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    response_filters:
      - &id001
        type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 401
          - 403
        error_message:
          Rillet rejected the API key (HTTP {{ response.status_code if response is defined
          else '' }}). Check that the key is valid for the selected environment and that API access is enabled
          for your organization.
      - &id002
        type: HttpResponseFilter
        action: RETRY
        http_codes:
          - 429
          - 500
          - 502
          - 503
          - 504
    backoff_strategies: &id003
      - type: ExponentialBackoffStrategy
        factor: 5
  error_handler_ignore_404:
    type: DefaultErrorHandler
    max_retries: 5
    response_filters:
      - type: HttpResponseFilter
        action: IGNORE
        http_codes:
          - 404
        error_message: The organization has no book periods yet.
      - *id001
      - *id002
    backoff_strategies: *id003
  base_requester:
    type: HttpRequester
    url_base:
      "{{ 'https://sandbox.api.rillet.com' if config.get('environment') == 'sandbox' else
      'https://api.rillet.com' }}"
    http_method: GET
    authenticator:
      type: BearerAuthenticator
      api_token: "{{ config['api_key'] }}"
    request_headers:
      X-Rillet-API-Version: "4"
    error_handler:
      $ref: "#/definitions/error_handler"
  cursor_paginator:
    type: DefaultPaginator
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: limit
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: cursor
    pagination_strategy:
      type: CursorPagination
      page_size: 100
      cursor_value: "{{ response.get('pagination', {}).get('next_cursor') }}"
      stop_condition: "{{ not response.get('pagination', {}).get('next_cursor') }}"
  updated_at_cursor:
    type: DatetimeBasedCursor
    cursor_field: updated_at
    cursor_datetime_formats:
      - "%Y-%m-%dT%H:%M:%S.%fZ"
      - "%Y-%m-%dT%H:%M:%SZ"
      - "%Y-%m-%dT%H:%M:%S.%f%z"
      - "%Y-%m-%dT%H:%M:%S%z"
    datetime_format: "%Y-%m-%dT%H:%M:%SZ"
    start_datetime:
      type: MinMaxDatetime
      datetime: "{{ config.get('start_date') or '1970-01-01T00:00:00Z' }}"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
    start_time_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: updated.gt
