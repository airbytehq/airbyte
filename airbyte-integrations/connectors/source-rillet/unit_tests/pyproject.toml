[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-rillet-tests"
version = "0.0.0"
description = "Unit tests for source-rillet"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10,<3.13"
airbyte-cdk = "^7"
freezegun = "^1.5"
pytest = "^8"
pytest-mock = "^3.14"
pyyaml = "^6"
requests-mock = "^1.12.1"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*",
]
