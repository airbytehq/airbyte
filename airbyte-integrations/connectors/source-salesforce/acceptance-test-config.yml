# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-salesforce:dev
test_strictness_level: high
acceptance_tests:
  spec:
    tests:
      - spec_path: "source_salesforce/spec.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "secrets/config_sandbox.json"
        status: "succeed"
        empty_streams:
          - name: "EntitySubscription"
            bypass_reason: "The sandbox test user lacks the View All Data permission that this Chatter object needs. Only the in-process Standard Tests of CDK versions before 7.36 read with this connection config"
          - name: "FeedAttachment"
            bypass_reason: "The sandbox test user lacks the View All Data permission that this Chatter object needs. Only the in-process Standard Tests of CDK versions before 7.36 read with this connection config"
          - name: "FeedComment"
            bypass_reason: "The sandbox test user lacks the View All Data permission that this Chatter object needs. Only the in-process Standard Tests of CDK versions before 7.36 read with this connection config"
          - name: "FeedItem"
            bypass_reason: "The sandbox test user lacks the View All Data permission that this Chatter object needs. Only the in-process Standard Tests of CDK versions before 7.36 read with this connection config"
          - name: "FeedRevision"
            bypass_reason: "The sandbox test user lacks the View All Data permission that this Chatter object needs. Only the in-process Standard Tests of CDK versions before 7.36 read with this connection config"
          - name: "TopicAssignment"
            bypass_reason: "The sandbox test user lacks the View All Data permission that this Chatter object needs. Only the in-process Standard Tests of CDK versions before 7.36 read with this connection config"
          - name: "RecommendationResponse"
            bypass_reason: "The sandbox org discovers this object but rejects every query on it as not supported. Only the in-process Standard Tests of CDK versions before 7.36 read with this connection config"
      - config_path: "integration_tests/invalid_config.json"
        status: "exception"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        expect_records:
          path: "integration_tests/expected_records.jsonl"
        empty_streams:
          - name: "ActiveScratchOrg"
            bypass_reason: "impossible to fill the stream with data because it is an organic traffic"
          - name: "ActiveScratchOrgFeed"
            bypass_reason: "impossible to fill the stream with data because it is an organic traffic"
          - name: "ActiveScratchOrgHistory"
            bypass_reason: "impossible to fill the stream with data because it is an organic traffic"
          - name: "ActiveScratchOrgShare"
            bypass_reason: "impossible to fill the stream with data because it is an organic traffic"
          - name: "ActiveFeatureLicenseMetric"
            bypass_reason: "impossible to fill the stream with data because it is an organic traffic"
          - name: "Describe"
            bypass_reason: "Data is not permanent"
          - name: "LeadHistory"
            bypass_reason: "Data is not permanent"
        fail_on_extra_columns: false
        timeout_seconds: 7200
  incremental:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/incremental_catalog.json"
        future_state:
          future_state_path: "integration_tests/future_state.json"
        timeout_seconds: 7200
        # skip incremental tests as filter condition greater than or equal is used, so last record for any stream state is duplicated
        skip_comprehensive_incremental_tests: true
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        timeout_seconds: 3600
