[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-datadog-tests"
version = "0.0.1"
description = "Unit tests for source-datadog"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11,<3.13"
# Keep in step with the base image in ../metadata.yaml.
airbyte-cdk = "7.48.0"
pytest = "^8"
pytest-timeout = "^2"
requests-mock = "^1"

# This table also keeps pytest from picking up the pytest.ini at the repo root.
[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*",
]
# A test that pages forever fails here. The thread method ends the run at once, so no reader
# thread outlives the mock and calls the real API.
timeout = 30
timeout_method = "thread"
