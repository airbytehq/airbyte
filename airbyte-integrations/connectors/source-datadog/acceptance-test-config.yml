# Read by the CDK's standard tests, which `poe test-integration-tests` runs:
# https://docs.airbyte.com/platform/connector-development/local-connector-development#running-tests
connector_image: airbyte/source-datadog:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
        config_path: "secrets/config.json"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        empty_streams:
          - name: audit_logs
            bypass_reason: The audit trail holds an event only when someone changes the test organization, and the default window is 30 days
          - name: incident_teams
            bypass_reason: The vendor removed this endpoint; the breaking release replaces the stream
          - name: logs
            bypass_reason: Seed log lines age out of the test organization's 15-day retention
          - name: downtimes
            bypass_reason: The v1 list cannot return downtimes made with the v2 API; the breaking release moves the stream
          - name: incidents
            bypass_reason: The test organization holds no incident
          - name: synthetic_tests
            bypass_reason: The test organization holds no Synthetic test
  incremental:
    tests:
      - config_path: "secrets/config.json"
        future_state:
          future_state_path: "integration_tests/abnormal_state.json"
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
