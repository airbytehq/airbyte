# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-datadog:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        empty_streams:
          - name: audit_logs
            bypass_reason: The test key's role cannot read the audit trail yet
          - name: incident_teams
            bypass_reason: The vendor removed this endpoint; the breaking release replaces the stream
          - name: logs
            bypass_reason: Seed log lines age out of the test organization's 15-day retention
          - name: downtimes
            bypass_reason: The v1 list cannot return downtimes made with the v2 API; the breaking release moves the stream
          - name: incidents
            bypass_reason: The test organization holds no incident
          - name: synthetic_tests
            bypass_reason: The test organization holds no Synthetic test
  incremental:
    bypass_reason: "This connector does not implement incremental sync"
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
