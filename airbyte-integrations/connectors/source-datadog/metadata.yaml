data:
  allowedHosts:
    hosts:
      - api.${site}
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-datadog
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  releases:
    breakingChanges:
      1.0.0:
        message: "Spec and schema are inline now, and default start and end date is setup for incremental sync."
        upgradeDeadline: "2024-09-18"
      2.0.0:
        message: "`is_read_only` has been removed from the `dashboards` stream schema. This attribute is deprecated as per API upgrade. See more [here](https://docs.datadoghq.com/dashboards/guide/is-read-only-deprecation/)"
        upgradeDeadline: "2024-12-13"
  connectorSubtype: api
  connectorType: source
  definitionId: 1cfc30c7-82db-43f4-9fd7-ac1b42312cda
  dockerImageTag: 2.0.25
  dockerRepository: airbyte/source-datadog
  githubIssueLabel: source-datadog
  icon: datadog.svg
  license: ELv2
  maxSecondsBetweenMessages: 3600
  name: Datadog
  releaseDate: 2023-08-27
  releaseStage: alpha
  suggestedStreams:
    streams:
      - metrics
      - dashboards
      - monitors
      - incidents
      - service_level_objectives
      - users
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/datadog
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    sl: 100
    ql: 100
  connectorTestSuitesOptions:
    - suite: unitTests
    - suite: liveTests
      testConnections:
        - name: datadog_config_dev_null
          id: 168fe6d6-d7fd-4d8e-8efb-db69857d7daf
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-DATADOG__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.48.0@sha256:cf202b16aef3395e0bdbaa1a2e66ff6aaf123f8836e6324743ded50c4b8d6586
  externalDocumentationUrls:
    - title: Datadog API reference
      url: https://docs.datadoghq.com/api/latest/
      type: api_reference
    - title: Datadog authentication
      url: https://docs.datadoghq.com/account_management/api-app-keys/
      type: authentication_guide
    - title: Datadog rate limits
      url: https://docs.datadoghq.com/api/latest/rate-limits/
      type: rate_limits
    - title: Datadog Status
      url: https://status.datadoghq.com/
      type: status_page
    - title: Datadog API v1 OpenAPI spec
      url: https://raw.githubusercontent.com/DataDog/datadog-api-client-python/master/.generator/schemas/v1/openapi.yaml
      type: openapi_spec
    - title: Datadog API v2 OpenAPI spec
      url: https://raw.githubusercontent.com/DataDog/datadog-api-client-python/master/.generator/schemas/v2/openapi.yaml
      type: openapi_spec
    - title: Datadog API client repository
      url: https://github.com/DataDog/datadog-api-client-python
      type: spec_repository
metadataSpecVersion: "1.0"
