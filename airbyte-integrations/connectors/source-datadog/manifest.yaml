            type:
              - integer
              - "null"
            description: >-
              The amount of time in seconds to call incident after detection.
              Equals the difference of detected and created.
          time_to_repair:
            type:
              - integer
              - "null"
            description: >-
              The amount of time in seconds to resolve customer impact after
