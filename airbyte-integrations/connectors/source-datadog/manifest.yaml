            type:
              - boolean
              - "null"
            description: A flag indicating whether the incident caused customer impact.
          detected:
            type:
              - string
              - "null"
            description: Timestamp when the incident was detected.
            format: date-time
          fields:
            type:
              - object
              - "null"
