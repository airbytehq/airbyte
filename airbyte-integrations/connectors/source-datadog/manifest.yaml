version: 6.33.4

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - dashboards

definitions:
  streams:
    audit_logs:
      type: DeclarativeStream
      name: audit_logs
      primary_key:
        - id
      $parameters:
        required_permission: audit_logs_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/audit/events
          http_method: GET
          request_parameters:
            filter[to]:
              $ref: "#/definitions/window_end_bound"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[cursor]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[limit]
            inject_into: request_parameter
          pagination_strategy:
            type: CursorPagination
            page_size: 1000
            cursor_value: >-
              {{ ((response.get('meta') or {}).get('page') or {}).get('after') }}
            stop_condition: >-
              {{ last_page_size == 0 or not
              ((response.get('meta') or {}).get('page') or {}).get('after') }}
      incremental_sync:
        $ref: "#/definitions/timestamp_cursor"
      transformations:
        - $ref: "#/definitions/sync_date_from_timestamp"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/audit_logs"
    authn_mappings:
      type: DeclarativeStream
      name: authn_mappings
      primary_key:
        - id
      $parameters:
        required_permission: user_access_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/authn_mappings
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[number]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[size]
            inject_into: request_parameter
          pagination_strategy:
            type: PageIncrement
            page_size: 100
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/authn_mappings"
    dashboard_lists:
      type: DeclarativeStream
      name: dashboard_lists
      primary_key:
        - id
      $parameters:
        required_permission: dashboards_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/dashboard/lists/manual
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - dashboard_lists
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/dashboard_lists"
    ip_allowlist:
      type: DeclarativeStream
      name: ip_allowlist
      primary_key:
        - id
      $parameters:
        required_permission: org_management
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/ip_allowlist
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/ip_allowlist"
    organization:
      type: DeclarativeStream
      name: organization
      primary_key:
        - public_id
      $parameters:
        required_permission: org_management
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/org
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - orgs
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/organization"
    permissions:
      type: DeclarativeStream
      name: permissions
      primary_key:
        - id
      $parameters:
        required_permission: user_access_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/permissions
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/permissions"
    roles:
      type: DeclarativeStream
      name: roles
      primary_key:
        - id
      $parameters:
        required_permission: user_access_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/roles
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[number]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[size]
            inject_into: request_parameter
          pagination_strategy:
            type: PageIncrement
            page_size: 100
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/roles"
    rum_applications:
      type: DeclarativeStream
      name: rum_applications
      primary_key:
        - id
      $parameters:
        required_permission: rum_apps_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/rum/applications
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      transformations:
        - type: RemoveFields
          field_pointers:
            - - attributes
              - client_token
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/rum_applications"
    service_definitions:
      type: DeclarativeStream
      name: service_definitions
      primary_key:
        - id
      $parameters:
        required_permission: apm_service_catalog_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/services/definitions
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[number]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[size]
            inject_into: request_parameter
          pagination_strategy:
            type: PageIncrement
            page_size: 100
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/service_definitions"
    slo_corrections:
      type: DeclarativeStream
      name: slo_corrections
      primary_key:
        - id
      $parameters:
        required_permission: slos_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/slo/correction
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: offset
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: request_parameter
          pagination_strategy:
            type: OffsetIncrement
            page_size: 25
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/slo_corrections"
    synthetics_global_variables:
      type: DeclarativeStream
      name: synthetics_global_variables
      primary_key:
        - id
      $parameters:
        required_permission: synthetics_global_variable_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/synthetics/variables
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - variables
      transformations:
        - type: RemoveFields
          field_pointers:
            - - value
              - value
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/synthetics_global_variables"
    synthetics_locations:
      type: DeclarativeStream
      name: synthetics_locations
      primary_key:
        - id
      $parameters:
        required_permission: synthetics_private_location_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/synthetics/locations
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - locations
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/synthetics_locations"
    teams:
      type: DeclarativeStream
      name: teams
      primary_key:
        - id
      $parameters:
        required_permission: teams_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/team
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[number]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[size]
            inject_into: request_parameter
          pagination_strategy:
            type: PageIncrement
            page_size: 100
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/teams"
    dashboards:
      type: DeclarativeStream
      name: dashboards
      primary_key:
        - id
      $parameters:
        required_permission: dashboards_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/dashboard
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - dashboards
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: start
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: count
            inject_into: request_parameter
          pagination_strategy:
            type: OffsetIncrement
            page_size: 100
        partition_router:
          type: ListPartitionRouter
          cursor_field: deleted
          values:
            - "false"
            - "true"
          request_option:
            type: RequestOption
            field_name: filter[deleted]
            inject_into: request_parameter
      transformations:
        - type: AddFields
          fields:
            - path:
                - deleted
              value: "{{ stream_partition['deleted'] == 'true' }}"
              value_type: boolean
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/dashboards"
    downtimes:
      type: DeclarativeStream
      name: downtimes
      primary_key:
        - id
      $parameters:
        required_permission: monitors_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/downtime
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/downtimes"
    incident_teams:
      type: DeclarativeStream
      name: incident_teams
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/teams
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          pagination_strategy:
            type: CursorPagination
            cursor_value: >-
              {{ last_record['meta']['pagination']['next_offset'] if last_record
              else None }}
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/incident_teams"
    incidents:
      type: DeclarativeStream
      name: incidents
      primary_key:
        - id
      $parameters:
        required_permission: incident_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/incidents
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[offset]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[size]
            inject_into: request_parameter
          pagination_strategy:
            type: OffsetIncrement
            page_size: 100
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/incidents"
    logs:
      type: DeclarativeStream
      name: logs
      primary_key:
        - id
      $parameters:
        required_permission: logs_read_data
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/logs/events
          http_method: GET
          request_parameters:
            filter[query]: "{{ config['query'] }}"
            filter[to]:
              $ref: "#/definitions/window_end_bound"
          error_handler:
            $ref: "#/definitions/error_handler"
            response_filters:
              - type: HttpResponseFilter
                action: FAIL
                failure_type: config_error
                http_codes:
                  - 400
                error_message: >-
                  {%- set errors = response.get('errors') if response is mapping else none -%}
                  {%- set details = (errors if errors is string else (errors | select('string') | join(', ')
                  if errors is sequence and errors is not mapping else ''))[:300] -%}
                  Datadog rejected the log search query{{ ': ' ~ details if details
                  else '' }}. Check the Query field.
              - $ref: "#/definitions/missing_permission_filter"
              - $ref: "#/definitions/rejected_keys_filter"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[cursor]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[limit]
            inject_into: request_parameter
          pagination_strategy:
            type: CursorPagination
            page_size: "{{ config.get('max_records_per_request', 5000) }}"
            cursor_value: >-
              {{ ((response.get('meta') or {}).get('page') or {}).get('after') }}
            stop_condition: >-
              {{ last_page_size == 0 or not
              ((response.get('meta') or {}).get('page') or {}).get('after') }}
      incremental_sync:
        $ref: "#/definitions/timestamp_cursor"
      transformations:
        - $ref: "#/definitions/sync_date_from_timestamp"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/logs"
    metrics:
      type: DeclarativeStream
      name: metrics
      primary_key:
        - id
      $parameters:
        required_permission: metrics_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/metrics
          http_method: GET
          request_parameters:
            window[seconds]: "5184000"
          error_handler:
            $ref: "#/definitions/error_handler"
            response_filters:
              - type: HttpResponseFilter
                action: FAIL
                failure_type: transient_error
                http_codes:
                  - 410
                error_message: >-
                  The page cursor of the Datadog metrics list is expired. The
                  next sync reads the list from the first page.
              - $ref: "#/definitions/missing_permission_filter"
              - $ref: "#/definitions/rejected_keys_filter"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[cursor]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[size]
            inject_into: request_parameter
          pagination_strategy:
            type: CursorPagination
            page_size: 10000
            cursor_value: >-
              {{ ((response.get('meta') or {}).get('pagination') or
              {}).get('next_cursor') }}
            stop_condition: >-
              {{ last_page_size == 0 or not ((response.get('meta') or
              {}).get('pagination') or {}).get('next_cursor') }}
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/metrics"
    monitors:
      type: DeclarativeStream
      name: monitors
      primary_key:
        - id
      $parameters:
        required_permission: monitors_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/monitor
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/monitors"
    service_level_objectives:
      type: DeclarativeStream
      name: service_level_objectives
      primary_key:
        - id
      $parameters:
        required_permission: slos_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/slo
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: offset
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: request_parameter
          pagination_strategy:
            type: OffsetIncrement
            page_size: 1000
        partition_router:
          type: ListPartitionRouter
          cursor_field: deleted
          values:
            - "false"
            - "true"
          request_option:
            type: RequestOption
            field_name: is_deleted
            inject_into: request_parameter
      transformations:
        - type: AddFields
          fields:
            - path:
                - deleted
              value: "{{ stream_partition['deleted'] == 'true' }}"
              value_type: boolean
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/service_level_objectives"
    synthetic_tests:
      type: DeclarativeStream
      name: synthetic_tests
      $parameters:
        required_permission: synthetics_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/synthetics/tests
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
            response_filters:
              - type: HttpResponseFilter
                action: FAIL
                failure_type: config_error
                http_codes:
                  - 404
                error_message: >-
                  Synthetic Monitoring is not active for this Datadog account.
                  Deselect the synthetic_tests stream or activate Synthetic
                  Monitoring in Datadog.
              - $ref: "#/definitions/missing_permission_filter"
              - $ref: "#/definitions/rejected_keys_filter"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - tests
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page_number
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page_size
            inject_into: request_parameter
          pagination_strategy:
            type: PageIncrement
            page_size: 100
            start_from_page: 0
            inject_on_first_request: true
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/synthetic_tests"
    users:
      type: DeclarativeStream
      name: users
      primary_key:
        - id
      $parameters:
        required_permission: user_access_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/users
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[number]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[size]
            inject_into: request_parameter
          pagination_strategy:
            type: PageIncrement
            page_size: 100
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/users"
  base_requester:
    type: HttpRequester
    url_base: https://api.{{ config['site'] }}/api/
    request_headers:
      DD-APPLICATION-KEY: "{{ config['application_key'] }}"
    authenticator:
      type: ApiKeyAuthenticator
      api_token: "{{ config[\"api_key\"] }}"
      inject_into:
        type: RequestOption
        field_name: DD-API-KEY
        inject_into: header
    error_handler:
      $ref: "#/definitions/error_handler"
  error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: X-RateLimit-Reset
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - $ref: "#/definitions/missing_permission_filter"
      - $ref: "#/definitions/rejected_keys_filter"
  missing_permission_filter:
    type: HttpResponseFilter
    action: FAIL
    failure_type: config_error
    predicate: >-
      {%- set errors = response.get('errors') if response is mapping else none -%}
      {%- set details = errors if errors is string else (errors | select('string') | join(', ')
      if errors is sequence and errors is not mapping else '') -%}
      {{ 'Failed permission authorization checks' in details }}
    error_message: >-
      {%- set errors = response.get('errors') if response is mapping else none -%}
      {%- set details = (errors if errors is string else (errors | select('string') | join(', ')
      if errors is sequence and errors is not mapping else ''))[:300] -%}
      {%- set permission = parameters.get('required_permission') -%}
      The Application Key lacks {{ 'the ' ~ permission ~ ' permission' if permission
      else 'a permission that this stream requires' }}{{ ': ' ~ details if details
      else '' }}. Grant {{ permission if permission else 'the missing permission' }}
      to the Application Key in Datadog.
  rejected_keys_filter:
    type: HttpResponseFilter
    action: FAIL
    failure_type: config_error
    http_codes:
      - 401
      - 403
    error_message: >-
      {%- set errors = response.get('errors') if response is mapping else none -%}
      {%- set details = (errors if errors is string else (errors | select('string') | join(', ')
      if errors is sequence and errors is not mapping else ''))[:300] -%}
      Datadog rejected the API Key or the Application Key{{ ': ' ~ details if details
      else '' }}. Check that both keys are complete and valid and belong to the
      selected Site.
  timestamp_cursor:
    type: DatetimeBasedCursor
    cursor_field: sync_date
    lookback_window: P1D
    cursor_datetime_formats:
      - "%Y-%m-%dT%H:%M:%S.%fZ"
      - "%Y-%m-%dT%H:%M:%SZ"
    datetime_format: "%Y-%m-%dT%H:%M:%S.%fZ"
    start_datetime:
      type: MinMaxDatetime
      datetime: >-
        {{ config['start_date'] or day_delta(-30,
        format='%Y-%m-%dT%H:%M:%SZ') }}
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
    start_time_option:
      type: RequestOption
      field_name: filter[from]
      inject_into: request_parameter
    end_datetime:
      type: MinMaxDatetime
      datetime: >-
        {{ config['end_date'] or now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
    step: P1M
    cursor_granularity: PT0.000001S
  window_end_bound: >-
    {{ format_datetime(str_to_datetime(stream_interval['end_time']) +
    duration('PT0.000001S'), '%Y-%m-%dT%H:%M:%S.%fZ') }}
  sync_date_from_timestamp:
    type: AddFields
    fields:
      - path:
          - sync_date
        value: "{{ record['attributes']['timestamp'] }}"

