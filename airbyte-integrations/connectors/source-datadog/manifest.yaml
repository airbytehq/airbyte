version: 6.33.4

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - dashboards

definitions:
  streams:
    audit_logs:
      type: DeclarativeStream
      name: audit_logs
      primary_key:
        - id
      $parameters:
        required_permission: audit_logs_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/audit/events
          http_method: GET
          request_parameters:
            filter[to]:
              $ref: "#/definitions/window_end_bound"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[cursor]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[limit]
            inject_into: request_parameter
          pagination_strategy:
            type: CursorPagination
            page_size: 1000
            cursor_value: >-
              {{ ((response.get('meta') or {}).get('page') or {}).get('after') }}
            stop_condition: >-
              {{ last_page_size == 0 or not
              ((response.get('meta') or {}).get('page') or {}).get('after') }}
      incremental_sync:
        $ref: "#/definitions/timestamp_cursor"
      transformations:
        - $ref: "#/definitions/sync_date_from_timestamp"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/audit_logs"
    dashboards:
      type: DeclarativeStream
      name: dashboards
      primary_key:
        - id
      $parameters:
        required_permission: dashboards_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/dashboard
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - dashboards
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: start
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: count
            inject_into: request_parameter
          pagination_strategy:
            type: OffsetIncrement
            page_size: 100
        partition_router:
          type: ListPartitionRouter
          cursor_field: deleted
          values:
            - "false"
            - "true"
          request_option:
            type: RequestOption
            field_name: filter[deleted]
            inject_into: request_parameter
      transformations:
        - type: AddFields
          fields:
            - path:
                - deleted
              value: "{{ stream_partition['deleted'] == 'true' }}"
              value_type: boolean
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/dashboards"
    downtimes:
      type: DeclarativeStream
      name: downtimes
      primary_key:
        - id
      $parameters:
        required_permission: monitors_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/downtime
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/downtimes"
    aws_cur_configs:
      type: DeclarativeStream
      name: aws_cur_configs
      primary_key:
        - id
      $parameters:
        required_permission: cloud_cost_management_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/cost/aws_cur_config
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/aws_cur_configs"
    aws_integrations:
      type: DeclarativeStream
      name: aws_integrations
      primary_key:
        - id
      $parameters:
        required_permission: aws_configuration_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/integration/aws/accounts
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      transformations:
        - type: RemoveFields
          field_pointers:
            - - attributes
              - auth_config
              - access_key_id
            - - attributes
              - auth_config
              - secret_access_key
            - - attributes
              - auth_config
              - external_id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/aws_integrations"
    azure_integrations:
      type: DeclarativeStream
      name: azure_integrations
      primary_key:
        - tenant_name
        - client_id
      $parameters:
        required_permission: azure_configuration_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/integration/azure
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
      transformations:
        - type: RemoveFields
          field_pointers:
            - - client_secret
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/azure_integrations"
    azure_uc_configs:
      type: DeclarativeStream
      name: azure_uc_configs
      primary_key:
        - id
      $parameters:
        required_permission: cloud_cost_management_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/cost/azure_uc_config
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/azure_uc_configs"
    cloudflare_accounts:
      type: DeclarativeStream
      name: cloudflare_accounts
      primary_key:
        - id
      $parameters:
        required_permission: integrations_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/integrations/cloudflare/accounts
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      transformations:
        - type: RemoveFields
          field_pointers:
            - - attributes
              - api_key
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/cloudflare_accounts"
    confluent_accounts:
      type: DeclarativeStream
      name: confluent_accounts
      primary_key:
        - id
      $parameters:
        required_permission: integrations_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/integrations/confluent-cloud/accounts
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      transformations:
        - type: RemoveFields
          field_pointers:
            - - attributes
              - api_key
            - - attributes
              - api_secret
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/confluent_accounts"
    fastly_accounts:
      type: DeclarativeStream
      name: fastly_accounts
      primary_key:
        - id
      $parameters:
        required_permission: integrations_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/integrations/fastly/accounts
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      transformations:
        - type: RemoveFields
          field_pointers:
            - - attributes
              - api_key
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/fastly_accounts"
    gcp_integrations:
      type: DeclarativeStream
      name: gcp_integrations
      primary_key:
        - id
      $parameters:
        required_permission: gcp_configuration_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/integration/gcp/accounts
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/gcp_integrations"
    okta_accounts:
      type: DeclarativeStream
      name: okta_accounts
      primary_key:
        - id
      $parameters:
        required_permission: integrations_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/integrations/okta/accounts
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      transformations:
        - type: RemoveFields
          field_pointers:
            - - attributes
              - api_key
            - - attributes
              - client_secret
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/okta_accounts"
    opsgenie_accounts:
      type: DeclarativeStream
      name: opsgenie_accounts
      primary_key:
        - id
      $parameters:
        required_permission: integrations_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/integration/opsgenie/accounts
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      transformations:
        - type: RemoveFields
          field_pointers:
            - - attributes
              - api_key
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/opsgenie_accounts"
    incident_teams:
      type: DeclarativeStream
      name: incident_teams
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/teams
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          pagination_strategy:
            type: CursorPagination
            cursor_value: >-
              {{ last_record['meta']['pagination']['next_offset'] if last_record
              else None }}
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/incident_teams"
    incidents:
      type: DeclarativeStream
      name: incidents
      primary_key:
        - id
      $parameters:
        required_permission: incident_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/incidents
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[offset]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[size]
            inject_into: request_parameter
          pagination_strategy:
            type: OffsetIncrement
            page_size: 100
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/incidents"
    logs:
      type: DeclarativeStream
      name: logs
      primary_key:
        - id
      $parameters:
        required_permission: logs_read_data
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/logs/events
          http_method: GET
          request_parameters:
            filter[query]: "{{ config['query'] }}"
            filter[to]:
              $ref: "#/definitions/window_end_bound"
          error_handler:
            $ref: "#/definitions/error_handler"
            response_filters:
              - type: HttpResponseFilter
                action: FAIL
                failure_type: config_error
                http_codes:
                  - 400
                error_message: >-
                  {%- set errors = response.get('errors') if response is mapping else none -%}
                  {%- set details = (errors if errors is string else (errors | select('string') | join(', ')
                  if errors is sequence and errors is not mapping else ''))[:300] -%}
                  Datadog rejected the log search query{{ ': ' ~ details if details
                  else '' }}. Check the Query field.
              - $ref: "#/definitions/missing_permission_filter"
              - $ref: "#/definitions/rejected_keys_filter"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[cursor]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[limit]
            inject_into: request_parameter
          pagination_strategy:
            type: CursorPagination
            page_size: "{{ config.get('max_records_per_request', 5000) }}"
            cursor_value: >-
              {{ ((response.get('meta') or {}).get('page') or {}).get('after') }}
            stop_condition: >-
              {{ last_page_size == 0 or not
              ((response.get('meta') or {}).get('page') or {}).get('after') }}
      incremental_sync:
        $ref: "#/definitions/timestamp_cursor"
      transformations:
        - $ref: "#/definitions/sync_date_from_timestamp"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/logs"
    metrics:
      type: DeclarativeStream
      name: metrics
      primary_key:
        - id
      $parameters:
        required_permission: metrics_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/metrics
          http_method: GET
          request_parameters:
            window[seconds]: "5184000"
          error_handler:
            $ref: "#/definitions/error_handler"
            response_filters:
              - type: HttpResponseFilter
                action: FAIL
                failure_type: transient_error
                http_codes:
                  - 410
                error_message: >-
                  The page cursor of the Datadog metrics list is expired. The
                  next sync reads the list from the first page.
              - $ref: "#/definitions/missing_permission_filter"
              - $ref: "#/definitions/rejected_keys_filter"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[cursor]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[size]
            inject_into: request_parameter
          pagination_strategy:
            type: CursorPagination
            page_size: 10000
            cursor_value: >-
              {{ ((response.get('meta') or {}).get('pagination') or
              {}).get('next_cursor') }}
            stop_condition: >-
              {{ last_page_size == 0 or not ((response.get('meta') or
              {}).get('pagination') or {}).get('next_cursor') }}
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/metrics"
    monitors:
      type: DeclarativeStream
      name: monitors
      primary_key:
        - id
      $parameters:
        required_permission: monitors_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/monitor
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/monitors"
    service_level_objectives:
      type: DeclarativeStream
      name: service_level_objectives
      primary_key:
        - id
      $parameters:
        required_permission: slos_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/slo
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: offset
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: request_parameter
          pagination_strategy:
            type: OffsetIncrement
            page_size: 1000
        partition_router:
          type: ListPartitionRouter
          cursor_field: deleted
          values:
            - "false"
            - "true"
          request_option:
            type: RequestOption
            field_name: is_deleted
            inject_into: request_parameter
      transformations:
        - type: AddFields
          fields:
            - path:
                - deleted
              value: "{{ stream_partition['deleted'] == 'true' }}"
              value_type: boolean
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/service_level_objectives"
    synthetic_tests:
      type: DeclarativeStream
      name: synthetic_tests
      $parameters:
        required_permission: synthetics_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v1/synthetics/tests
          http_method: GET
          error_handler:
            $ref: "#/definitions/error_handler"
            response_filters:
              - type: HttpResponseFilter
                action: FAIL
                failure_type: config_error
                http_codes:
                  - 404
                error_message: >-
                  Synthetic Monitoring is not active for this Datadog account.
                  Deselect the synthetic_tests stream or activate Synthetic
                  Monitoring in Datadog.
              - $ref: "#/definitions/missing_permission_filter"
              - $ref: "#/definitions/rejected_keys_filter"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - tests
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page_number
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page_size
            inject_into: request_parameter
          pagination_strategy:
            type: PageIncrement
            page_size: 100
            start_from_page: 0
            inject_on_first_request: true
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/synthetic_tests"
    users:
      type: DeclarativeStream
      name: users
      primary_key:
        - id
      $parameters:
        required_permission: user_access_read
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: v2/users
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page[number]
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: page[size]
            inject_into: request_parameter
          pagination_strategy:
            type: PageIncrement
            page_size: 100
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/users"
  base_requester:
    type: HttpRequester
    url_base: https://api.{{ config['site'] }}/api/
    request_headers:
      DD-APPLICATION-KEY: "{{ config['application_key'] }}"
    authenticator:
      type: ApiKeyAuthenticator
      api_token: "{{ config[\"api_key\"] }}"
      inject_into:
        type: RequestOption
        field_name: DD-API-KEY
        inject_into: header
    error_handler:
      $ref: "#/definitions/error_handler"
  error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: X-RateLimit-Reset
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - $ref: "#/definitions/missing_permission_filter"
      - $ref: "#/definitions/rejected_keys_filter"
  missing_permission_filter:
    type: HttpResponseFilter
    action: FAIL
    failure_type: config_error
    predicate: >-
      {%- set errors = response.get('errors') if response is mapping else none -%}
      {%- set details = errors if errors is string else (errors | select('string') | join(', ')
      if errors is sequence and errors is not mapping else '') -%}
      {{ 'Failed permission authorization checks' in details }}
    error_message: >-
      {%- set errors = response.get('errors') if response is mapping else none -%}
      {%- set details = (errors if errors is string else (errors | select('string') | join(', ')
      if errors is sequence and errors is not mapping else ''))[:300] -%}
      {%- set permission = parameters.get('required_permission') -%}
      The Application Key lacks {{ 'the ' ~ permission ~ ' permission' if permission
      else 'a permission that this stream requires' }}{{ ': ' ~ details if details
      else '' }}. Grant {{ permission if permission else 'the missing permission' }}
      to the Application Key in Datadog.
  rejected_keys_filter:
    type: HttpResponseFilter
    action: FAIL
    failure_type: config_error
    http_codes:
      - 401
      - 403
    error_message: >-
      {%- set errors = response.get('errors') if response is mapping else none -%}
      {%- set details = (errors if errors is string else (errors | select('string') | join(', ')
      if errors is sequence and errors is not mapping else ''))[:300] -%}
      Datadog rejected the API Key or the Application Key{{ ': ' ~ details if details
      else '' }}. Check that both keys are complete and valid and belong to the
      selected Site.
  timestamp_cursor:
    type: DatetimeBasedCursor
    cursor_field: sync_date
    lookback_window: P1D
    cursor_datetime_formats:
      - "%Y-%m-%dT%H:%M:%S.%fZ"
      - "%Y-%m-%dT%H:%M:%SZ"
    datetime_format: "%Y-%m-%dT%H:%M:%S.%fZ"
    start_datetime:
      type: MinMaxDatetime
      datetime: >-
        {{ config['start_date'] or day_delta(-30,
        format='%Y-%m-%dT%H:%M:%SZ') }}
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
    start_time_option:
      type: RequestOption
      field_name: filter[from]
      inject_into: request_parameter
    end_datetime:
      type: MinMaxDatetime
      datetime: >-
        {{ config['end_date'] or now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
    step: P1M
    cursor_granularity: PT0.000001S
  window_end_bound: >-
    {{ format_datetime(str_to_datetime(stream_interval['end_time']) +
    duration('PT0.000001S'), '%Y-%m-%dT%H:%M:%S.%fZ') }}
  sync_date_from_timestamp:
    type: AddFields
    fields:
      - path:
          - sync_date
        value: "{{ record['attributes']['timestamp'] }}"

streams:
  - $ref: "#/definitions/streams/audit_logs"
  - $ref: "#/definitions/streams/dashboards"
  - $ref: "#/definitions/streams/downtimes"
  - $ref: "#/definitions/streams/aws_cur_configs"
  - $ref: "#/definitions/streams/aws_integrations"
  - $ref: "#/definitions/streams/azure_integrations"
  - $ref: "#/definitions/streams/azure_uc_configs"
  - $ref: "#/definitions/streams/cloudflare_accounts"
  - $ref: "#/definitions/streams/confluent_accounts"
  - $ref: "#/definitions/streams/fastly_accounts"
  - $ref: "#/definitions/streams/gcp_integrations"
  - $ref: "#/definitions/streams/okta_accounts"
  - $ref: "#/definitions/streams/opsgenie_accounts"
  - $ref: "#/definitions/streams/incident_teams"
  - $ref: "#/definitions/streams/incidents"
  - $ref: "#/definitions/streams/logs"
  - $ref: "#/definitions/streams/metrics"
  - $ref: "#/definitions/streams/monitors"
  - $ref: "#/definitions/streams/service_level_objectives"
  - $ref: "#/definitions/streams/synthetic_tests"
  - $ref: "#/definitions/streams/users"

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: "{{ config.get('num_workers', 3) }}"
  max_concurrency: 10

api_budget:
  type: HTTPAPIBudget
  ratelimit_remaining_header: X-RateLimit-Remaining
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 100
          interval: PT60S
      matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: ^/api/v2/audit/events$
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 60
          interval: PT60S
      matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: ^/api/v1/dashboard$
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 60
          interval: PT60S
      matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: ^/api/v1/downtime$
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 100
          interval: PT60S
      matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: ^/api/v2/incidents$
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 300
          interval: PT60S
      matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: ^/api/v2/logs/events$
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 50
          interval: PT10S
      matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: ^/api/v2/metrics$
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 1000
          interval: PT10S
      matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: ^/api/v1/monitor$
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 1000
          interval: PT10S
      matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: ^/api/v1/slo$
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 12000
          interval: PT60S
      matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: ^/api/v1/synthetics/tests$

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
      - application_key
    properties:
      api_key:
        type: string
        description: Datadog API key
        order: 0
        title: API Key
        airbyte_secret: true
      application_key:
        type: string
        description: Datadog application key
        order: 1
        title: Application Key
        airbyte_secret: true
      query:
        type: string
        description: >-
          The search query. This applies to the logs stream in every sync mode.
          If empty, it'll collect all logs.
        order: 2
        title: Query
      start_date:
        type: string
        description: >-
          UTC date and time in the format 2017-01-25T00:00:00Z. Any data before
          this date will not be replicated. This applies to the logs and
          audit_logs streams in every sync mode.
        order: 3
        title: Start date
        default: "2023-12-01T00:00:00Z"
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        examples:
          - "2022-10-01T00:00:00Z"
      site:
        type: string
        description: The site where Datadog data resides in.
        enum:
          - datadoghq.com
          - us3.datadoghq.com
          - us5.datadoghq.com
          - datadoghq.eu
          - ddog-gov.com
          - us2.ddog-gov.com
          - ap1.datadoghq.com
          - ap2.datadoghq.com
          - uk1.datadoghq.com
        order: 4
        title: Site
        default: datadoghq.com
      end_date:
        type: string
        description: >-
          UTC date and time in the format 2017-01-25T00:00:00Z. Data after this
          date will not be replicated. An empty value means the time of the
          sync. This applies to the logs and audit_logs streams in every sync
          mode.
        order: 5
        title: End date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        examples:
          - "2022-10-01T00:00:00Z"
      max_records_per_request:
        type: integer
        description: >-
          Maximum number of records to collect per request. This is the page
          size of the logs stream.
        order: 6
        title: Max records per requests
        default: 5000
        maximum: 5000
        minimum: 1
      queries:
        type: array
        description: List of queries to be run and used as inputs.
        items:
          type: object
          required:
            - name
            - data_source
            - query
          properties:
            name:
              type: string
              description: The variable name for use in queries.
              order: 1
              title: Query Name
            query:
              type: string
              description: A classic query string.
              order: 3
              title: Query
            data_source:
              type: string
              description: A data source that is powered by the platform.
              enum:
                - metrics
                - cloud_cost
                - logs
                - rum
              order: 2
              title: Data Source
        order: 7
        title: Queries
        default: []
      num_workers:
        type: integer
        description: >-
          How many streams and slices are read at the same time. Lower it if
          syncs hit Datadog rate limits.
        order: 8
        title: Number of concurrent workers
        default: 3
        maximum: 10
        minimum: 2
    additionalProperties: true

