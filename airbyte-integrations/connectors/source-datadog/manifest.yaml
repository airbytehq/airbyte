        type:
          - string
          - "null"
        description: Identifier of the dashboard author.
        readOnly: true
      created_at:
        type:
          - string
          - "null"
        description: Creation date of the dashboard.
        format: date-time
        readOnly: true
      deleted:
        type:
          - boolean
          - "null"
        description: >-
          Whether the dashboard is deleted. The connector sets it from the
          request that returned the record.
        readOnly: true
      deleted_at:
        type:
          - string
          - "null"
        description: Deletion date of the dashboard.
        format: date-time
        readOnly: true
      id:
        type:
          - string
          - "null"
        description: Dashboard identifier.
        readOnly: true
      layout_type:
        type:
          - string
          - "null"
        description: Layout type of the dashboard
        enum:
          - ordered
          - free
        readOnly: true
      modified_at:
        type:
          - string
          - "null"
        description: Modification date of the dashboard.
        format: date-time
        readOnly: true
      title:
        type:
          - string
          - "null"
        description: Title of the dashboard.
        readOnly: true
      url:
        type:
          - string
          - "null"
        description: URL of the dashboard.
        readOnly: true
  downtimes:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    additionalProperties: true
    properties:
      active:
        type:
          - boolean
          - "null"
        description: If a scheduled downtime currently exists.
        readOnly: true
      active_child:
        type:
          - object
          - "null"
        description: >-
          The downtime object definition of the active child for the original
          parent recurring downtime.
        additionalProperties: true
      canceled:
        type:
          - integer
          - "null"
        description: If a scheduled downtime is canceled.
        readOnly: true
      child_id:
        type:
          - integer
          - "null"
      created:
        type:
          - integer
          - "null"
      creator_id:
        type:
          - integer
          - "null"
        description: User ID of the downtime creator.
        readOnly: true
      disabled:
        type:
          - boolean
          - "null"
        description: If a downtime has been disabled.
        readOnly: true
      downtime_type:
        type:
          - integer
          - "null"
        description: >-
          0 for a downtime applied on * or all, 1 when the downtime is only
          scoped to hosts, or 2 when the downtime is scoped to anything but
          hosts.
        readOnly: true
      end:
        type:
          - integer
          - "null"
        description: >-
          POSIX timestamp to end the downtime. If not provided, the downtime is
          in effect indefinitely until you cancel it.
        readOnly: true
      id:
        type:
          - integer
          - "null"
        description: The downtime ID.
        readOnly: true
      message:
        type:
          - string
          - "null"
        description: A message to include with notifications for this downtime.
        readOnly: true
      modified:
        type:
          - integer
          - "null"
      monitor_id:
        type:
          - integer
          - "null"
        description: >-
          A single monitor to which the downtime applies. If not provided, the
          downtime applies to all monitors.
        readOnly: true
      monitor_tags:
        type:
          - array
          - "null"
        description: A comma-separated list of monitor tags.
        items:
          type: string
        readOnly: true
      mute_first_recovery_notification:
        type:
          - boolean
          - "null"
        description: If the first recovery notification during a downtime should be muted.
        readOnly: true
      notify_end_states:
        type:
          - array
          - "null"
