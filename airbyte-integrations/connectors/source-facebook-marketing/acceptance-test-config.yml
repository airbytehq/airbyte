# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-facebook-marketing:dev
test_strictness_level: "high"
acceptance_tests:
  spec:
    tests:
      - spec_path: "integration_tests/spec.json"
        backward_compatibility_tests_config:
          # adding new breakdowns, action breakdowns and fields
          disable_for_version: "3.3.27"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "secrets/config_no_date.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        empty_streams:
          - name: "ads_insights_action_product_id"
            bypass_reason: "Data cannot be seeded in the test account, integration tests added for the stream instead"
          - name: "videos"
            bypass_reason: "Data cannot be seeded in the test account, integration tests added for the stream instead"
          - name: "ads_insights"
            bypass_reason: "The test ad accounts have never delivered an ad (lifetime spend 0), so Meta returns no insights rows in any window; needs a running campaign in the test account"
          - name: "ads_insights_action_type"
            bypass_reason: "The test ad accounts have never delivered an ad (lifetime spend 0), so Meta returns no insights rows in any window; needs a running campaign in the test account"
