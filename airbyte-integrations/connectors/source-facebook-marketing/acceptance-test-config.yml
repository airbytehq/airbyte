# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-facebook-marketing:dev
test_strictness_level: "high"
acceptance_tests:
  spec:
    tests:
      - spec_path: "integration_tests/spec.json"
        backward_compatibility_tests_config:
          # adding new breakdowns, action breakdowns and fields
          disable_for_version: "3.3.27"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "secrets/config_no_date.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        empty_streams:
          - name: "ads_insights_action_product_id"
            bypass_reason: "Data cannot be seeded in the test account, integration tests added for the stream instead"
          - name: "videos"
            bypass_reason: "Data cannot be seeded in the test account, integration tests added for the stream instead"
          - name: "ads_insights"
            bypass_reason: "The window of this config (March 2023) is older than the 37 months of insights that Meta keeps, so the stream returns no rows; move the window in the test secret, then remove this entry"
          - name: "ads_insights_action_type"
            bypass_reason: "The window of this config (March 2023) is older than the 37 months of insights that Meta keeps, so the stream returns no rows; move the window in the test secret, then remove this entry"
          - name: "ads_insights_age_and_gender"
            bypass_reason: "The window of this config (March 2023) is older than the 37 months of insights that Meta keeps, so the stream returns no rows; move the window in the test secret, then remove this entry"
          - name: "ads_insights_comscore_market"
            bypass_reason: "The window of this config (March 2023) is older than the 37 months of insights that Meta keeps, so the stream returns no rows; move the window in the test secret, then remove this entry"
          - name: "ads_insights_country"
            bypass_reason: "The window of this config (March 2023) is older than the 37 months of insights that Meta keeps, so the stream returns no rows; move the window in the test secret, then remove this entry"
          - name: "ads_insights_platform_and_device"
            bypass_reason: "The window of this config (March 2023) is older than the 37 months of insights that Meta keeps, so the stream returns no rows; move the window in the test secret, then remove this entry"
          - name: "ads_insights_region"
            bypass_reason: "The window of this config (March 2023) is older than the 37 months of insights that Meta keeps, so the stream returns no rows; move the window in the test secret, then remove this entry"
  incremental:
    tests:
      - config_path: "secrets/config.json"
        future_state:
          future_state_path: "integration_tests/future_state.json"
        # ads_insights is currently failing because there is a lookback window and the minimum value is one day
        skip_comprehensive_incremental_tests: true
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
