data:
  ab_internal:
    ql: 400
    sl: 300
  allowedHosts:
    hosts:
      - "*.googleapis.com"
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.33.0@sha256:3343cc05b79b9a3c07fa90152bd5348da7154b44f63521857bd2a745883d85cd
  connectorSubtype: file
  connectorType: source
  definitionId: 71607ba1-c0ac-4799-8049-7f4b90dd50f7
  dockerImageTag: 0.12.41
  dockerRepository: airbyte/source-google-sheets
  documentationUrl: https://docs.airbyte.com/integrations/sources/google-sheets
  externalDocumentationUrls:
    - title: Google Workspace developer release notes
      url: https://developers.google.com/workspace/release-notes
      type: api_release_history
    - title: Google Sheets API release notes
      url: https://developers.google.com/workspace/sheets/release-notes
      type: api_release_history
    - title: Google Sheets API reference
      url: https://developers.google.com/workspace/sheets/api/reference/rest
      type: api_reference
    - title: Using OAuth 2.0 to access Google APIs
      url: https://developers.google.com/identity/protocols/oauth2
      type: authentication_guide
    - title: OAuth 2.0 scopes for Google APIs
      url: https://developers.google.com/identity/protocols/oauth2/scopes
      type: permissions_scopes
    - title: Google Sheets API usage limits
      url: https://developers.google.com/workspace/sheets/api/limits
      type: rate_limits
  githubIssueLabel: source-google-sheets
  icon: google-sheets.svg
  license: Elv2
  maxSecondsBetweenMessages: 60
  name: Google Sheets
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-google-sheets
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  releases:
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
  supportLevel: certified
  tags:
    - language:manifest-only
    - cdk:low-code
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: temp-google-sheets_service_config_dev_null
