version: 7.45.0
type: DeclarativeSource
description: Sync workers, users, org structure, time and leave, IT, talent, custom objects and audit data from
  the Rippling REST Platform API v2. Workers, time entries, app users, worker time splits, compensation band details,
  worker changes and the activity log sync incrementally using the API's server-side filter.
check:
  type: CheckStream
  stream_names:
  - companies
concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: '{{ config.get(''num_workers'', 3) }}'
  max_concurrency: 10
definitions:
  error_handler:
    type: DefaultErrorHandler
    max_retries: 6
    response_filters:
    - type: HttpResponseFilter
      action: FAIL
      failure_type: config_error
      http_codes:
      - 401
      error_message: Rippling rejected the API token (HTTP 401). Tokens are revoked when their owner is terminated
        or the token is unused for 30 days; create a new token under Tools > Developer > API Tokens.
    - type: HttpResponseFilter
      action: FAIL
      failure_type: config_error
      http_codes:
      - 403
      error_message: Rippling returned HTTP 403. The token is missing the scope for this stream, or the token owner's
        permission profile or company plan does not include it. Add the scope to the token or deselect the stream.
    - type: HttpResponseFilter
      action: RETRY
      http_codes:
      - 429
      - 500
      - 502
      - 503
      - 504
    backoff_strategies:
    - type: WaitTimeFromHeader
      header: Retry-After
    - type: ExponentialBackoffStrategy
      factor: 5
  base_requester:
    type: HttpRequester
    url_base: https://rest.ripplingapis.com
    http_method: GET
    authenticator:
      type: BearerAuthenticator
      api_token: '{{ config[''api_token''] }}'
    request_headers:
      Accept: application/json
      Rippling-Api-Version: '{{ config.get(''api_version'') or ''2024-08-01'' }}'
    error_handler:
      $ref: '#/definitions/error_handler'
  record_selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path:
      - results
  paginator:
    type: DefaultPaginator
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: limit
    page_token_option:
      type: RequestPath
    pagination_strategy:
      type: CursorPagination
      page_size: 100
      cursor_value: '{{ response.get(''next_link'') }}'
      stop_condition: '{{ not response.get(''next_link'') }}'
  start_datetime: &id002
    type: MinMaxDatetime
    datetime: '{{ config.get(''start_date'') or ''1970-01-01T00:00:00Z'' }}'
    datetime_format: '%Y-%m-%dT%H:%M:%SZ'
  cursor_datetime_formats: &id001
  - '%Y-%m-%dT%H:%M:%S.%f%z'
  - '%Y-%m-%dT%H:%M:%S%z'
  - '%Y-%m-%dT%H:%M:%S.%fZ'
  - '%Y-%m-%dT%H:%M:%SZ'
  updated_at_cursor:
    type: DatetimeBasedCursor
    cursor_field: updated_at
    cursor_datetime_formats: *id001
    datetime_format: '%Y-%m-%dT%H:%M:%SZ'
    start_datetime: *id002
  applied_on_cursor:
    type: DatetimeBasedCursor
    cursor_field: applied_on
    cursor_datetime_formats: *id001
    datetime_format: '%Y-%m-%dT%H:%M:%SZ'
    start_datetime: *id002
  occurred_at_cursor:
    type: DatetimeBasedCursor
    cursor_field: occurred_at
    cursor_datetime_formats: *id001
    datetime_format: '%Y-%m-%dT%H:%M:%SZ'
    start_datetime:
      type: MinMaxDatetime
      datetime: '{{ config.get(''start_date'') or ''1970-01-01T00:00:00Z'' }}'
      datetime_format: '%Y-%m-%dT%H:%M:%SZ'
      min_datetime: '{{ (now_utc() - duration(''P89D'')).strftime(''%Y-%m-%dT%H:%M:%SZ'') }}'
  streams:
    companies:
      type: DeclarativeStream
      name: companies
      primary_key:
      - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: /companies/
        record_selector:
          $ref: '#/definitions/record_selector'
        paginator:
          $ref: '#/definitions/paginator'
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            id:
