spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
    - api_token
    additionalProperties: true
    properties:
      api_token:
        type: string
        title: API Token
        description: A Rippling API token created under Tools > Developer > API Tokens. The token can only read
          what its owner's permission profile and selected scopes allow.
        airbyte_secret: true
        order: 0
      start_date:
        type: string
        title: Start Date
        description: UTC date and time in the format YYYY-MM-DDTHH:mm:ssZ. Incremental streams only read records
          changed on or after this date on the first sync. Leave empty to read all history.
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        examples:
        - '2024-01-01T00:00:00Z'
        format: date-time
        order: 1
      api_version:
        type: string
        title: API Version
        description: Dated Rippling API version sent in the Rippling-Api-Version header. Defaults to 2024-08-01.
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
        - '2024-08-01'
        order: 2
      num_workers:
        type: integer
        title: Number of concurrent workers
        description: Number of streams read in parallel. Rippling allows 600 requests per 10 seconds per endpoint.
        minimum: 1
        maximum: 10
        default: 3
        order: 3
