data:
  allowedHosts:
    hosts:
      - api.customer.io
      - api-eu.customer.io
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-customer-io
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  connectorBuildOptions:
    # Please update to the latest version of the connector base image.
    # https://hub.docker.com/r/airbyte/python-connector-base
    # Please use the full address with sha256 hash to guarantee build reproducibility.
    baseImage: docker.io/airbyte/source-declarative-manifest:7.33.0@sha256:3343cc05b79b9a3c07fa90152bd5348da7154b44f63521857bd2a745883d85cd
  connectorSubtype: api
  connectorType: source
  definitionId: 34f697bc-b989-4eda-b06f-d0f39b88825b
  dockerImageTag: 1.0.0
  dockerRepository: airbyte/source-customer-io
  githubIssueLabel: source-customer-io
  icon: customer-io.svg
  license: ELv2
  maxSecondsBetweenMessages: 1800
  name: Customer.io
  releaseDate: 2023-08-20
  releaseStage: alpha
  suggestedStreams:
    streams:
      - campaigns
      - campaigns_actions
      - newsletters
      - broadcasts
      - segments
      - transactional_messages
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/customer-io
  tags:
    - cdk:low-code
    - language:manifest-only
  externalDocumentationUrls:
    - title: Customer.io App API reference
      url: https://docs.customer.io/integrations/api/app/
      type: api_reference
    - title: Customer.io App API authentication
      url: https://docs.customer.io/integrations/api/app/#authentication
      type: authentication_guide
    - title: Customer.io App API rate limits
      url: https://docs.customer.io/integrations/api/app/#rate-limits
      type: rate_limits
    - title: Customer.io release notes
      url: https://docs.customer.io/release-notes/
      type: api_release_history
    - title: Customer.io Status
      url: https://status.customerio.com/
      type: status_page
  releases:
    breakingChanges:
      "1.0.0":
        upgradeDeadline: "2026-10-21"
        deadlineAction: "disable"
        message: >-
          Version 1.0.0 corrects declared field types to match Customer.io's API reference: campaigns_actions.from_id and reply_to_id become integers, newsletters.sent_at becomes an integer, so typed destinations stop writing it as null, and the tags, trigger_segment_ids and content_ids arrays of campaigns and newsletters declare their item types. If you sync newsletters to Snowflake or SQL Server, drop the sent_at column of its destination table before the first sync on 1.0.0; it holds only nulls. Then refresh the source schema. On S3 Data Lake, clear campaigns, campaigns_actions and newsletters if they use an Incremental or Full refresh | Append mode; on other destinations, clear only newsletters in those modes, and only to fill sent_at on older rows. Clearing removes rows for records deleted in Customer.io and, in Append modes, earlier versions of each record; back up the tables first if you need them. See https://docs.airbyte.com/integrations/sources/customer-io-migrations#upgrading-to-100.
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - campaigns
              - campaigns_actions
              - newsletters
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
metadataSpecVersion: "1.0"
