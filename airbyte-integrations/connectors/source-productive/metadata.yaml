metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - "api.productive.io"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-productive
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.47.0@sha256:b2ecb78040d4c4b42fa3537488d68a3b195f64b5fefcbc48ac0591479591a3f0
  connectorSubtype: api
  connectorType: source
  definitionId: 51766ab3-df25-4c8c-98a4-647440d0dfbb
  dockerImageTag: 0.1.5
  dockerRepository: airbyte/source-productive
  githubIssueLabel: source-productive
  icon: icon.svg
  license: ELv2
  name: Productive
  releaseDate: 2024-09-11
  releaseStage: alpha
  supportLevel: community
  releases:
    breakingChanges:
      0.1.0:
        message: >-
          The retired project_assignments stream has been removed. Refresh your schema and select memberships instead.
          The boards stream now reads folders and returns the resource type folders.
          See https://docs.airbyte.com/integrations/sources/productive-migrations for migration steps.
        upgradeDeadline: "2026-10-21"
        deadlineAction: disable
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - project_assignments
              - boards
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
  documentationUrl: https://docs.airbyte.com/integrations/sources/productive
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: Productive API documentation
      url: https://developer.productive.io/
      type: api_reference
