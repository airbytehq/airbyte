data:
  ab_internal:
    ql: 200
    sl: 100
  allowedHosts:
    hosts:
      - api.linkedin.com
      - www.linkedin.com
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-linkedin-pages
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.39.1@sha256:dc2fc3c346aee695a7967db5c1a0701732a2d075f0c67856934eb1f4b360f06d
  connectorSubtype: api
  connectorType: source
  definitionId: af54297c-e8f8-4d63-a00d-a94695acc9d3
  dockerImageTag: 2.0.0
  dockerRepository: airbyte/source-linkedin-pages
  documentationUrl: https://docs.airbyte.com/integrations/sources/linkedin-pages
  githubIssueLabel: source-linkedin-pages
  icon: icon.svg
  license: ELv2
  maxSecondsBetweenMessages: 3600
  name: Linkedin Pages
  releaseDate: 2022-08-11
  releaseStage: alpha
  releases:
    breakingChanges:
      2.0.0:
        message: "Version 2.0.0 changes the declared type of epoch-millisecond fields from number to integer: `timeRangeStart` and `timeRangeEnd` in `follower_statistics_time_bound` and `share_statistics_time_bound`, and `id`, `created.time` and `lastModified.time` in `organization_lookup`. Values do not change. It also declares primary keys on the six streams that existed before 1.3.0. After upgrading, refresh the source schema. BigQuery, Snowflake, Databricks, ClickHouse, MS SQL Server and MotherDuck need nothing else. Postgres and Redshift fail the sync while views depend on these columns. S3 Data Lake and GCS Data Lake cannot change these columns and fail incremental and append syncs of the three streams until you refresh them with Remove records or clear them. LinkedIn only serves the last 12 months of time-bound statistics, so refreshing a time-bound stream with Remove records or clearing it permanently deletes older rows: back up those tables first. Connections that do not sync these three streams need no action. Migration guide: https://docs.airbyte.com/integrations/sources/linkedin-pages-migrations#upgrading-to-200"
        upgradeDeadline: "2026-12-22"
        deadlineAction: disable
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - organization_lookup
              - follower_statistics_time_bound
              - share_statistics_time_bound
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
  supportLevel: community
  suggestedStreams:
    streams:
      - total_follower_count
      - share_statistics_time_bound
      - follower_statistics
  tags:
    - cdk:low-code
    - language:manifest-only
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: linkedin-pages_config_dev_null
          id: 4460fd33-21fe-46de-83ee-b886aaf38803
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-LINKEDIN-PAGES__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: LinkedIn Pages API
      url: https://learn.microsoft.com/en-us/linkedin/marketing/integrations/community-management/organizations
      type: api_reference
    - title: LinkedIn authentication
      url: https://learn.microsoft.com/en-us/linkedin/shared/authentication/authentication
      type: authentication_guide
    - title: LinkedIn rate limits
      url: https://learn.microsoft.com/en-us/linkedin/shared/api-guide/concepts/rate-limits
      type: rate_limits
    - title: LinkedIn Marketing API versioning and release history
      url: https://learn.microsoft.com/en-us/linkedin/marketing/versioning
      type: api_release_history
metadataSpecVersion: "1.0"
