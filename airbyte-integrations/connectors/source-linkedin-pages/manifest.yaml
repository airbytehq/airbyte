version: 4.3.0
type: DeclarativeSource
definitions:
  bearer_authenticator:
    type: BearerAuthenticator
    api_token: "{{ config['credentials']['access_token'] }}"
  oauth_authenticator:
    type: OAuthAuthenticator
    client_id: "{{ config['credentials']['client_id'] }}"
    client_secret: "{{ config['credentials']['client_secret'] }}"
    refresh_token: "{{ config['credentials']['refresh_token'] }}"
    token_refresh_endpoint: "https://www.linkedin.com/oauth/v2/accessToken"
  selective_authenticator:
    type: SelectiveAuthenticator
    authenticator_selection_path:
      - "credentials"
      - "auth_method"
    authenticators:
      oAuth2.0:
        type: OAuthAuthenticator
        client_id: "{{ config['credentials']['client_id'] }}"
        client_secret: "{{ config['credentials']['client_secret'] }}"
        refresh_token: "{{ config['credentials']['refresh_token'] }}"
        token_refresh_endpoint: "https://www.linkedin.com/oauth/v2/accessToken"
      access_token:
        type: BearerAuthenticator
        api_token: "{{ config['credentials']['access_token'] }}"
  unauthorized_filter:
    type: HttpResponseFilter
    action: FAIL
    failure_type: config_error
    http_codes: [401]
    error_message: >-
      LinkedIn rejected the credentials (401). The access token has expired or
      was revoked; re-authenticate the source. LinkedIn said:
      {{ ('' ~ ((response if response is mapping else {}).get('message') or 'see the LinkedIn error response'))[:300] }}
  forbidden_filter:
    type: HttpResponseFilter
    action: FAIL
    failure_type: config_error
    http_codes: [403]
    error_message: >-
      LinkedIn denied the request (403). The token needs the rw_organization_admin
      scope (plus r_organization_social or r_organization_social_feed for posts,
      comments and reactions), and the LinkedIn member who authorized it must have
      the ADMINISTRATOR role on organization {{ config['org_id'] }}. LinkedIn said:
      {{ ('' ~ ((response if response is mapping else {}).get('message') or 'see the LinkedIn error response'))[:300] }}
  rate_limit_filter:
    type: HttpResponseFilter
    action: RATE_LIMITED
    http_codes: [429]
    error_message: "LinkedIn rate limit reached (429); retrying with backoff. Daily quotas reset at midnight UTC."
  server_error_filter:
    type: HttpResponseFilter
    action: RETRY
    http_codes: [500, 502, 503, 504]
  not_found_filter:
    type: HttpResponseFilter
    action: FAIL
    failure_type: config_error
    http_codes: [404]
    error_message: >-
      LinkedIn returned 404 for organization {{ config['org_id'] }}. The page may
      be deactivated, the Organization ID may be wrong, or the app may lack access
      to this API. LinkedIn said:
      {{ ('' ~ ((response if response is mapping else {}).get('message') or 'see the LinkedIn error response'))[:300] }}
  version_sunset_filter:
    type: HttpResponseFilter
    action: FAIL
    failure_type: system_error
    http_codes: [426]
    error_message: >-
      LinkedIn no longer accepts the API version this connector version sends (426).
      Upgrade the source to the latest version. LinkedIn said:
      {{ ('' ~ ((response if response is mapping else {}).get('message') or 'see the LinkedIn error response'))[:300] }}
  base_error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - $ref: "#/definitions/unauthorized_filter"
      - $ref: "#/definitions/forbidden_filter"
      - $ref: "#/definitions/not_found_filter"
      - $ref: "#/definitions/rate_limit_filter"
      - $ref: "#/definitions/server_error_filter"
      - $ref: "#/definitions/version_sunset_filter"
  time_bound_error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      # The window is clamped to what LinkedIn serves, so this 400 means a connector bug, not a config problem.
      - type: HttpResponseFilter
        action: FAIL
        failure_type: system_error
        error_message_contains: Invalid timeIntervals parameter
        error_message: >-
          LinkedIn rejected the statistics time window (400). LinkedIn said:
          {{ ('' ~ ((response if response is mapping else {}).get('message') or 'see the LinkedIn error response'))[:300] }}
      - $ref: "#/definitions/unauthorized_filter"
      - $ref: "#/definitions/forbidden_filter"
      - $ref: "#/definitions/not_found_filter"
      - $ref: "#/definitions/rate_limit_filter"
      - $ref: "#/definitions/server_error_filter"
      - $ref: "#/definitions/version_sunset_filter"
  child_error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      # A post deleted after the posts read returns 404 for its comments and reactions.
      - type: HttpResponseFilter
        action: IGNORE
        http_codes: [404]
      - $ref: "#/definitions/unauthorized_filter"
      - $ref: "#/definitions/forbidden_filter"
      - $ref: "#/definitions/rate_limit_filter"
      - $ref: "#/definitions/server_error_filter"
      - $ref: "#/definitions/version_sunset_filter"
  community_requester:
    type: HttpRequester
    url_base: https://api.linkedin.com/rest
    http_method: GET
    request_headers:
      Linkedin-Version: "202610"
      X-Restli-Protocol-Version: "2.0.0"
    authenticator:
      $ref: "#/definitions/selective_authenticator"
    error_handler:
      $ref: "#/definitions/base_error_handler"
  stats_requester:
    type: HttpRequester
    url_base: https://api.linkedin.com/rest
    http_method: GET
    request_headers:
      Linkedin-Version: "202610"
    authenticator:
      $ref: "#/definitions/selective_authenticator"
    error_handler:
      $ref: "#/definitions/base_error_handler"
  offset_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: start
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: count
    pagination_strategy:
      type: OffsetIncrement
      page_size: 100
      inject_on_first_request: true
  # LinkedIn's posts finder can return a short page while more posts follow; only paging.links marks the end.
  posts_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: start
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: count
    pagination_strategy:
      type: CursorPagination
      page_size: 100
      cursor_value: "{{ response.paging.start + response.paging.count }}"
      stop_condition: "{{ not (((response.get('paging') or {}).get('links') or []) | selectattr('rel', 'equalto', 'next') | list) }}"
  streams:
    posts:
      type: DeclarativeStream
      name: posts
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            id:
              type: ["null", string]
            container:
              type: ["null", string]
            author:
              type: ["null", string]
            commentary:
              type: ["null", string]
            content:
              type: ["null", object]
            createdAt:
              type: ["null", integer]
            lastModifiedAt:
              type: ["null", integer]
            publishedAt:
              type: ["null", integer]
            lifecycleState:
              type: ["null", string]
            lifecycleStateInfo:
              type: ["null", object]
            visibility:
              type: ["null", string]
            distribution:
              type: ["null", object]
            isReshareDisabledByAuthor:
              type: ["null", boolean]
            reshareContext:
              type: ["null", object]
            adContext:
              type: ["null", object]
            contentLandingPage:
              type: ["null", string]
            contentCallToActionLabel:
              type: ["null", string]
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/community_requester"
          path: /posts
          request_parameters:
            author: "urn:li:organization:{{ config['org_id'] }}"
            q: author
            sortBy: LAST_MODIFIED
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - elements
        paginator:
          $ref: "#/definitions/posts_paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: lastModifiedAt
        cursor_datetime_formats:
          - "%ms"
        datetime_format: "%ms"
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ config.get('start_date') or day_delta(-730, format='%Y-%m-%dT%H:%M:%SZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        is_client_side_incremental: true
    post_comments:
      type: DeclarativeStream
      name: post_comments
      primary_key:
        - object
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            id:
              type: ["null", string]
            commentUrn:
              type: ["null", string]
            "$URN":
              type: ["null", string]
            actor:
              type: ["null", string]
            agent:
              type: ["null", string]
            object:
              type: ["null", string]
            parentComment:
              type: ["null", string]
            message:
              type: ["null", object]
            content:
              type: ["null", array]
            created:
              type: ["null", object]
              properties:
                actor:
                  type: ["null", string]
                time:
                  type: ["null", integer]
            lastModified:
              type: ["null", object]
              properties:
                actor:
                  type: ["null", string]
                time:
                  type: ["null", integer]
            likesSummary:
              type: ["null", object]
            commentsSummary:
              type: ["null", object]
            post_urn:
              type: ["null", string]
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/community_requester"
          path: /socialActions/{{ stream_partition.post_urn | urlencode }}/comments
          error_handler:
            $ref: "#/definitions/child_error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - elements
        paginator:
          $ref: "#/definitions/offset_paginator"
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              partition_field: post_urn
              incremental_dependency: false
              stream:
                $ref: "#/definitions/streams/posts"
      transformations:
        - type: AddFields
          fields:
            - path:
                - post_urn
              value: "{{ stream_partition.post_urn }}"
              type: AddedFieldDefinition
    post_reactions:
      type: DeclarativeStream
      name: post_reactions
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            id:
              type: ["null", string]
            root:
              type: ["null", string]
            reactionType:
              type: ["null", string]
            created:
              type: ["null", object]
              properties:
                actor:
                  type: ["null", string]
                time:
                  type: ["null", integer]
            lastModified:
              type: ["null", object]
              properties:
                actor:
                  type: ["null", string]
                time:
                  type: ["null", integer]
            deleted:
              type: ["null", object]
              properties:
                actor:
                  type: ["null", string]
                time:
                  type: ["null", integer]
            post_urn:
              type: ["null", string]
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/community_requester"
          path: /reactions/(entity:{{ stream_partition.post_urn | urlencode }})
          request_parameters:
            q: entity
          error_handler:
            $ref: "#/definitions/child_error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - elements
        paginator:
          $ref: "#/definitions/offset_paginator"
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              partition_field: post_urn
              incremental_dependency: false
              stream:
                $ref: "#/definitions/streams/posts"
      transformations:
        - type: AddFields
          fields:
            - path:
                - post_urn
              value: "{{ stream_partition.post_urn }}"
              type: AddedFieldDefinition
    page_statistics:
      type: DeclarativeStream
      name: page_statistics
      primary_key:
        - organization
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            organization:
              type: ["null", string]
            totalPageStatistics:
              type: ["null", object]
            pageStatisticsBySeniority:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByIndustryV2:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByGeoCountry:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByGeo:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByTargetedContent:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByStaffCountRange:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByFunction:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/stats_requester"
          path: /organizationPageStatistics
          request_parameters:
            q: organization
            organization: "urn:li:organization:{{ config['org_id'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - elements
        paginator:
          type: NoPagination
    page_statistics_time_bound:
      type: DeclarativeStream
      name: page_statistics_time_bound
      primary_key:
        - organization
        - timeRangeStart
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            organization:
              type: ["null", string]
            totalPageStatistics:
              type: ["null", object]
            pageStatisticsBySeniority:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByIndustryV2:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByGeoCountry:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByGeo:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByTargetedContent:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByStaffCountRange:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByFunction:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            timeRangeStart:
              type: ["null", integer]
            timeRangeEnd:
              type: ["null", integer]
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/stats_requester"
          path: /organizationPageStatistics
          request_parameters:
            q: organization
            organization: "urn:li:organization:{{ config['org_id'] }}"
            timeIntervals.timeGranularityType: "{{ config['time_granularity_type'] or 'DAY' }}"
          error_handler:
            $ref: "#/definitions/time_bound_error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - elements
        paginator:
          type: NoPagination
      transformations:
        - type: AddFields
          fields:
            - path:
                - timeRangeStart
              value: "{{ record.timeRange.start }}"
              type: AddedFieldDefinition
            - path:
                - timeRangeEnd
              value: "{{ record.timeRange.end }}"
              type: AddedFieldDefinition
        - type: RemoveFields
          field_pointers:
            - - timeRange
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: timeRangeEnd
        cursor_datetime_formats:
          - "%ms"
        datetime_format: "%ms"
        start_datetime:
          type: MinMaxDatetime
          datetime: >-
            {{ max(day_delta(-365, format='%Y-%m-%d') + 'T00:00:00Z', config['start_date'][:10] + 'T00:00:00Z') if config.get('start_date') else day_delta(-365, format='%Y-%m-%d') + 'T00:00:00Z' }}
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: timeIntervals.timeRange.start
        end_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: timeIntervals.timeRange.end
        end_datetime:
          type: MinMaxDatetime
          datetime: >-
            {{ day_delta(-2, format='%Y-%m') + '-01T00:00:00Z' if config.get('time_granularity_type') == 'MONTH' else day_delta(-2, format='%Y-%m-%d') + 'T00:00:00Z' }}
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: "{{ config.get('num_workers', 3) }}"
  max_concurrency: 10
check:
  type: CheckStream
  stream_names:
    - organization_lookup
streams:
  - type: DeclarativeStream
    name: organization_lookup
    primary_key: []
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        additionalProperties: true
        properties:
          alternativeNames:
            type:
              - array
              - "null"
          autoCreated:
            type:
              - boolean
              - "null"
          created:
            properties:
              actor:
                type:
                  - string
                  - "null"
              time:
                type:
                  - number
                  - "null"
            type:
              - object
              - "null"
          defaultLocale:
            properties:
              country:
                type:
                  - string
                  - "null"
              language:
                type:
                  - string
                  - "null"
            type:
              - object
              - "null"
          groups:
            type:
              - array
              - "null"
          id:
            type:
              - number
              - "null"
          lastModified:
            properties:
              actor:
                type:
                  - string
                  - "null"
              time:
                type:
                  - number
                  - "null"
            type:
              - object
              - "null"
          localizedName:
            type:
              - string
              - "null"
          localizedSpecialties:
            type:
              - array
              - "null"
          locations:
            type:
              - array
              - "null"
          name:
            properties:
              localized:
                properties:
                  ru_RU:
                    type:
                      - string
                      - "null"
                additionalProperties:
                  type:
                    - string
                    - "null"
                type:
                  - object
                  - "null"
              preferredLocale:
                properties:
                  country:
                    type:
                      - string
                      - "null"
                  language:
                    type:
                      - string
                      - "null"
                type:
                  - object
                  - "null"
            type:
              - object
              - "null"
          organizationType:
            type:
              - string
              - "null"
          primaryOrganizationType:
            type:
              - string
              - "null"
          specialties:
            type:
              - array
              - "null"
          staffCountRange:
            type:
              - string
              - "null"
          vanityName:
            type:
              - string
              - "null"
          versionTag:
            type:
              - string
              - "null"
        type: object
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://api.linkedin.com/rest
        path: /organizations/{{ config['org_id'] }}
        http_method: GET
        request_parameters: {}
        request_headers:
          Linkedin-Version: "202610"
        authenticator:
          type: SelectiveAuthenticator
          authenticator_selection_path:
            - "credentials"
            - "auth_method"
          authenticators:
            oAuth2.0:
              type: OAuthAuthenticator
              client_id: "{{ config['credentials']['client_id'] }}"
              client_secret: "{{ config['credentials']['client_secret'] }}"
              refresh_token: "{{ config['credentials']['refresh_token'] }}"
              token_refresh_endpoint: "https://www.linkedin.com/oauth/v2/accessToken"
            access_token:
              type: BearerAuthenticator
              api_token: "{{ config['credentials']['access_token'] }}"
        error_handler:
          $ref: "#/definitions/base_error_handler"
        request_body_json: {}
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      paginator:
        type: NoPagination
      partition_router: []
  - type: DeclarativeStream
    name: follower_statistics
    primary_key: []
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        additionalProperties: true
        properties:
          followerCountsByAssociationType:
            type:
              - array
              - "null"
          followerCountsByFunction:
            type:
              - array
              - "null"
          followerCountsByGeo:
            type:
              - array
              - "null"
          followerCountsByGeoCountry:
            type:
              - array
              - "null"
          followerCountsByIndustry:
            type:
              - array
              - "null"
          followerCountsBySeniority:
            type:
              - array
              - "null"
          followerCountsByStaffCountRange:
            type:
              - array
              - "null"
          organizationalEntity:
            type:
              - string
              - "null"
        type: object
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://api.linkedin.com/rest
        path: /organizationalEntityFollowerStatistics
        http_method: GET
        request_parameters:
          q: organizationalEntity
          organizationalEntity: urn:li:organization:{{ config['org_id'] }}
        request_headers:
          Linkedin-Version: "202610"
        authenticator:
          type: SelectiveAuthenticator
          authenticator_selection_path:
            - "credentials"
            - "auth_method"
          authenticators:
            oAuth2.0:
              type: OAuthAuthenticator
              client_id: "{{ config['credentials']['client_id'] }}"
              client_secret: "{{ config['credentials']['client_secret'] }}"
              refresh_token: "{{ config['credentials']['refresh_token'] }}"
              token_refresh_endpoint: "https://www.linkedin.com/oauth/v2/accessToken"
            access_token:
              type: BearerAuthenticator
              api_token: "{{ config['credentials']['access_token'] }}"
        error_handler:
          $ref: "#/definitions/base_error_handler"
        request_body_json: {}
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - elements
      paginator:
        type: NoPagination
      partition_router: []
  - type: DeclarativeStream
    name: share_statistics
    primary_key: []
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        additionalProperties: true
        properties:
          organizationalEntity:
            type:
              - string
              - "null"
          totalShareStatistics:
            properties:
              clickCount:
                type:
                  - number
                  - "null"
              commentCount:
                type:
                  - number
                  - "null"
              commentMentionsCount:
                type:
                  - number
                  - "null"
              engagement:
                type:
                  - number
                  - "null"
              impressionCount:
                type:
                  - number
                  - "null"
              likeCount:
                type:
