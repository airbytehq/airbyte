version: 4.3.0
type: DeclarativeSource
definitions:
  bearer_authenticator:
    type: BearerAuthenticator
    api_token: "{{ config['credentials']['access_token'] }}"
  oauth_authenticator:
    type: OAuthAuthenticator
    client_id: "{{ config['credentials']['client_id'] }}"
    client_secret: "{{ config['credentials']['client_secret'] }}"
    refresh_token: "{{ config['credentials']['refresh_token'] }}"
    token_refresh_endpoint: "https://www.linkedin.com/oauth/v2/accessToken"
  selective_authenticator:
    type: SelectiveAuthenticator
    authenticator_selection_path:
      - "credentials"
      - "auth_method"
    authenticators:
      oAuth2.0:
        type: OAuthAuthenticator
        client_id: "{{ config['credentials']['client_id'] }}"
        client_secret: "{{ config['credentials']['client_secret'] }}"
        refresh_token: "{{ config['credentials']['refresh_token'] }}"
        token_refresh_endpoint: "https://www.linkedin.com/oauth/v2/accessToken"
      access_token:
        type: BearerAuthenticator
        api_token: "{{ config['credentials']['access_token'] }}"
  base_error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    backoff_strategies:
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - type: HttpResponseFilter
        action: RETRY
        failure_type: transient_error
        http_codes:
          - 429
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 401
        error_message: "Authentication failed. Re-authenticate the LinkedIn Pages source and ensure the token has not expired."
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 403
        error_message: "Access denied by LinkedIn. Confirm the authenticated member is an ADMINISTRATOR of the organization and the app has the r_organization_social (posts, comments, reactions) and rw_organization_admin (page statistics) scopes."
  child_error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    backoff_strategies:
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - type: HttpResponseFilter
        action: IGNORE
        http_codes:
          - 404
      - type: HttpResponseFilter
        action: RETRY
        failure_type: transient_error
        http_codes:
          - 429
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 401
        error_message: "Authentication failed. Re-authenticate the LinkedIn Pages source and ensure the token has not expired."
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 403
        error_message: "Access denied by LinkedIn. Confirm the authenticated member is an ADMINISTRATOR of the organization and the app has the r_organization_social (posts, comments, reactions) and rw_organization_admin (page statistics) scopes."
  time_bound_error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    backoff_strategies:
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - type: HttpResponseFilter
        action: IGNORE
        http_codes:
          - 400
        error_message_contains: End time must be greater than start time
      - type: HttpResponseFilter
        action: RETRY
        failure_type: transient_error
        http_codes:
          - 429
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 401
        error_message: "Authentication failed. Re-authenticate the LinkedIn Pages source and ensure the token has not expired."
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 403
        error_message: "Access denied by LinkedIn. Confirm the authenticated member is an ADMINISTRATOR of the organization and the app has the r_organization_social (posts, comments, reactions) and rw_organization_admin (page statistics) scopes."
  community_requester:
    type: HttpRequester
    url_base: https://api.linkedin.com/rest
    http_method: GET
    request_headers:
      Linkedin-Version: "202610"
      X-Restli-Protocol-Version: "2.0.0"
    authenticator:
      $ref: "#/definitions/selective_authenticator"
    error_handler:
      $ref: "#/definitions/base_error_handler"
  stats_requester:
    type: HttpRequester
    url_base: https://api.linkedin.com/rest
    http_method: GET
    request_headers:
      Linkedin-Version: "202610"
    authenticator:
      $ref: "#/definitions/selective_authenticator"
    error_handler:
      $ref: "#/definitions/base_error_handler"
  offset_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: start
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: count
    pagination_strategy:
      type: OffsetIncrement
      page_size: 100
      inject_on_first_request: true
  streams:
    posts:
      type: DeclarativeStream
      name: posts
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            id:
              type: ["null", string]
            author:
              type: ["null", string]
            commentary:
              type: ["null", string]
            content:
              type: ["null", object]
            createdAt:
              type: ["null", integer]
            lastModifiedAt:
              type: ["null", integer]
            publishedAt:
              type: ["null", integer]
            lifecycleState:
              type: ["null", string]
            lifecycleStateInfo:
              type: ["null", object]
            visibility:
              type: ["null", string]
            distribution:
              type: ["null", object]
            isReshareDisabledByAuthor:
              type: ["null", boolean]
            reshareContext:
              type: ["null", object]
            adContext:
              type: ["null", object]
            contentLandingPage:
              type: ["null", string]
            contentCallToActionLabel:
              type: ["null", string]
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/community_requester"
          path: /posts
          request_parameters:
            author: "urn:li:organization:{{ config['org_id'] }}"
            q: author
            sortBy: LAST_MODIFIED
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - elements
        paginator:
          $ref: "#/definitions/offset_paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: lastModifiedAt
        cursor_datetime_formats:
          - "%ms"
        datetime_format: "%ms"
        start_datetime:
          type: MinMaxDatetime
          datetime:
            "{{ (max(day_delta(-730, format='%Y-%m-%dT%H:%M:%SZ'), config['start_date']))
            if 'start_date' in config else day_delta(-730, format='%Y-%m-%dT%H:%M:%SZ')
            }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        is_client_side_incremental: true
    post_comments:
      type: DeclarativeStream
      name: post_comments
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            id:
              type: ["null", integer]
            commentUrn:
              type: ["null", string]
            "$URN":
              type: ["null", string]
            actor:
              type: ["null", string]
            agent:
              type: ["null", string]
            object:
              type: ["null", string]
            parentComment:
              type: ["null", string]
            message:
              type: ["null", object]
            content:
              type: ["null", array]
            created:
              type: ["null", object]
              properties:
                actor:
                  type: ["null", string]
                time:
                  type: ["null", integer]
            lastModified:
              type: ["null", object]
              properties:
                actor:
                  type: ["null", string]
                time:
                  type: ["null", integer]
            likesSummary:
              type: ["null", object]
            commentsSummary:
              type: ["null", object]
            post_urn:
              type: ["null", string]
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/community_requester"
          path: /socialActions/{{ stream_partition.post_urn | urlencode }}/comments
          error_handler:
            $ref: "#/definitions/child_error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - elements
        paginator:
          $ref: "#/definitions/offset_paginator"
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              partition_field: post_urn
              incremental_dependency: false
              stream:
                $ref: "#/definitions/streams/posts"
      transformations:
        - type: AddFields
          fields:
            - path:
                - post_urn
              value: "{{ stream_partition.post_urn }}"
              type: AddedFieldDefinition
    post_reactions:
      type: DeclarativeStream
      name: post_reactions
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            id:
              type: ["null", string]
            root:
              type: ["null", string]
            reactionType:
              type: ["null", string]
            created:
              type: ["null", object]
              properties:
                actor:
                  type: ["null", string]
                time:
                  type: ["null", integer]
            lastModified:
              type: ["null", object]
              properties:
                actor:
                  type: ["null", string]
                time:
                  type: ["null", integer]
            post_urn:
              type: ["null", string]
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/community_requester"
          path: /reactions/(entity:{{ stream_partition.post_urn | urlencode }})
          request_parameters:
            q: entity
          error_handler:
            $ref: "#/definitions/child_error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - elements
        paginator:
          $ref: "#/definitions/offset_paginator"
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              partition_field: post_urn
              incremental_dependency: false
              stream:
                $ref: "#/definitions/streams/posts"
      transformations:
        - type: AddFields
          fields:
            - path:
                - post_urn
              value: "{{ stream_partition.post_urn }}"
              type: AddedFieldDefinition
    page_statistics:
      type: DeclarativeStream
      name: page_statistics
      primary_key:
        - organization
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            organization:
              type: ["null", string]
            totalPageStatistics:
              type: ["null", object]
            pageStatisticsBySeniority:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByIndustryV2:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByGeoCountry:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByGeo:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByTargetedContent:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByStaffCountRange:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByFunction:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/stats_requester"
          path: /organizationPageStatistics
          request_parameters:
            q: organization
            organization: "urn:li:organization:{{ config['org_id'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - elements
        paginator:
          type: NoPagination
    page_statistics_time_bound:
      type: DeclarativeStream
      name: page_statistics_time_bound
      primary_key:
        - organization
        - timeRangeStart
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          additionalProperties: true
          properties:
            organization:
              type: ["null", string]
            totalPageStatistics:
              type: ["null", object]
            pageStatisticsBySeniority:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByIndustryV2:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByGeoCountry:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByGeo:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByTargetedContent:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByStaffCountRange:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            pageStatisticsByFunction:
              type: ["null", array]
              items:
                type: object
                additionalProperties: true
            timeRangeStart:
              type: ["null", integer]
            timeRangeEnd:
              type: ["null", integer]
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/stats_requester"
          path: /organizationPageStatistics
          request_parameters:
            q: organization
            organization: "urn:li:organization:{{ config['org_id'] }}"
            timeIntervals.timeGranularityType: "{{ config['time_granularity_type'] or 'DAY' }}"
          error_handler:
            $ref: "#/definitions/time_bound_error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - elements
        paginator:
          type: NoPagination
      transformations:
        - type: AddFields
          fields:
            - path:
                - timeRangeStart
              value: "{{ record.timeRange.start }}"
              type: AddedFieldDefinition
            - path:
                - timeRangeEnd
              value: "{{ record.timeRange.end }}"
              type: AddedFieldDefinition
        - type: RemoveFields
          field_pointers:
            - - timeRange
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: timeRangeEnd
        cursor_datetime_formats:
          - "%ms"
        datetime_format: "%ms"
        start_datetime:
          type: MinMaxDatetime
          datetime:
            "{{ (max(day_delta(-365, format='%Y-%m-%d'), config['start_date'][:10]) ~ 'T00:00:00Z')
            if 'start_date' in config else (day_delta(-365, format='%Y-%m-%d') ~ 'T00:00:00Z')
            }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: timeIntervals.timeRange.start
        end_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: timeIntervals.timeRange.end
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ day_delta(-2, format='%Y-%m-%d') ~ 'T00:00:00Z' }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
check:
  type: CheckStream
  stream_names:
    - organization_lookup
streams:
  - type: DeclarativeStream
    name: organization_lookup
    primary_key: []
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        additionalProperties: true
        properties:
          alternativeNames:
            type:
              - array
              - "null"
          autoCreated:
            type:
              - boolean
              - "null"
          created:
            properties:
              actor:
                type:
                  - string
                  - "null"
              time:
                type:
                  - number
                  - "null"
            type:
              - object
              - "null"
          defaultLocale:
            properties:
              country:
                type:
                  - string
                  - "null"
              language:
                type:
                  - string
                  - "null"
            type:
              - object
              - "null"
          groups:
            type:
              - array
              - "null"
          id:
            type:
              - number
              - "null"
          lastModified:
            properties:
              actor:
                type:
                  - string
                  - "null"
              time:
                type:
                  - number
                  - "null"
            type:
              - object
              - "null"
          localizedName:
            type:
              - string
              - "null"
          localizedSpecialties:
            type:
              - array
              - "null"
          locations:
            type:
              - array
              - "null"
          name:
            properties:
              localized:
                properties:
                  ru_RU:
                    type:
                      - string
                      - "null"
                type:
                  - object
                  - "null"
              preferredLocale:
                properties:
                  country:
                    type:
                      - string
                      - "null"
                  language:
                    type:
                      - string
                      - "null"
                type:
                  - object
                  - "null"
            type:
              - object
              - "null"
          organizationType:
            type:
              - string
              - "null"
          primaryOrganizationType:
            type:
              - string
              - "null"
          specialties:
            type:
              - array
              - "null"
          vanityName:
            type:
              - string
              - "null"
          versionTag:
            type:
              - string
              - "null"
        type: object
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://api.linkedin.com/rest
        path: /organizations/{{ config['org_id'] }}
        http_method: GET
        request_parameters: {}
        request_headers:
          Linkedin-Version: "202610"
        authenticator:
          type: SelectiveAuthenticator
          authenticator_selection_path:
            - "credentials"
            - "auth_method"
          authenticators:
            oAuth2.0:
              type: OAuthAuthenticator
              client_id: "{{ config['credentials']['client_id'] }}"
              client_secret: "{{ config['credentials']['client_secret'] }}"
              refresh_token: "{{ config['credentials']['refresh_token'] }}"
              token_refresh_endpoint: "https://www.linkedin.com/oauth/v2/accessToken"
            access_token:
              type: BearerAuthenticator
              api_token: "{{ config['credentials']['access_token'] }}"
        error_handler:
          type: CompositeErrorHandler
          error_handlers:
            - type: DefaultErrorHandler
              response_filters:
                - type: HttpResponseFilter
                  action: FAIL
                  http_codes:
                    - 429
                  error_message: >-
                    {{ "\n\nStream Organization Lookup: LinkedIn API requests
                    are rate limited.\n" + "Rate limits specify the maximum
                    number of API calls that can be made in a 24 hour period.\n"
                    + "These limits reset at midnight UTC every day.\n" + "You
                    can find more information here
                    https://docs.airbyte.com/integrations/sources/linkedin-pages.\n"
                    + "Also quotas and usage are here:
                    https://www.linkedin.com/developers/apps.\n" }}
        request_body_json: {}
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      paginator:
        type: NoPagination
      partition_router: []
  - type: DeclarativeStream
    name: follower_statistics
    primary_key: []
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        additionalProperties: true
