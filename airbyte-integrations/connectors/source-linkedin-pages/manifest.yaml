                  error_message: >-
                    {{ "\n\nStream Follower Statistics: LinkedIn API requests
                    are rate limited.\n" + "Rate limits specify the maximum
                    number of API calls that can be made in a 24 hour period.\n"
                    + "These limits reset at midnight UTC every day.\n" + "You
                    can find more information here
                    https://docs.airbyte.com/integrations/sources/linkedin-pages.\n"
                    + "Also quotas and usage are here:
                    https://www.linkedin.com/developers/apps.\n" }}
        request_body_json: {}
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - elements
      paginator:
        type: NoPagination
      partition_router: []
  - type: DeclarativeStream
    name: share_statistics
    primary_key: []
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        additionalProperties: true
        properties:
          organizationalEntity:
            type:
              - string
              - "null"
          totalShareStatistics:
            properties:
              clickCount:
                type:
                  - number
                  - "null"
              commentCount:
                type:
                  - number
                  - "null"
              commentMentionsCount:
                type:
                  - number
                  - "null"
              engagement:
                type:
                  - number
                  - "null"
              impressionCount:
                type:
                  - number
                  - "null"
              likeCount:
                type:
                  - number
                  - "null"
              shareCount:
                type:
                  - number
                  - "null"
              shareMentionsCount:
                type:
                  - number
                  - "null"
              uniqueImpressionsCount:
                type:
                  - number
                  - "null"
            type:
              - object
              - "null"
        type: object
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://api.linkedin.com/rest
        path: /organizationalEntityShareStatistics
        http_method: GET
        request_parameters:
          q: organizationalEntity
          organizationalEntity: urn:li:organization:{{ config['org_id'] }}
        request_headers:
          Linkedin-Version: "202610"
        authenticator:
          type: SelectiveAuthenticator
          authenticator_selection_path:
            - "credentials"
            - "auth_method"
          authenticators:
            oAuth2.0:
              type: OAuthAuthenticator
              client_id: "{{ config['credentials']['client_id'] }}"
              client_secret: "{{ config['credentials']['client_secret'] }}"
              refresh_token: "{{ config['credentials']['refresh_token'] }}"
              token_refresh_endpoint: "https://www.linkedin.com/oauth/v2/accessToken"
            access_token:
              type: BearerAuthenticator
              api_token: "{{ config['credentials']['access_token'] }}"
        error_handler:
          type: CompositeErrorHandler
          error_handlers:
            - type: DefaultErrorHandler
              response_filters:
                - type: HttpResponseFilter
                  action: FAIL
                  http_codes:
