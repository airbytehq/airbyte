spec:
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - org_id
    properties:
      credentials:
        type: object
        oneOf:
          - type: object
            title: OAuth2.0
            required:
              - client_id
              - client_secret
              - refresh_token
            properties:
              client_id:
                type: string
                title: Client ID
                description: The client ID of the LinkedIn developer application.
                airbyte_secret: true
              auth_method:
                type: string
                const: oAuth2.0
              client_secret:
                type: string
                title: Client secret
                description: The client secret of the LinkedIn developer application.
                airbyte_secret: true
              refresh_token:
                type: string
                title: Refresh token
                description: >-
                  The token value generated using the LinkedIn Developers OAuth
                  Token Tools. See the <a
                  href="https://docs.airbyte.com/integrations/sources/linkedin-pages/">docs</a>
                  to obtain yours.
                airbyte_secret: true
          - type: object
            title: Access token
            required:
              - access_token
            properties:
              auth_method:
                type: string
                const: access_token
              access_token:
                type: string
                title: Access token
                description: >-
                  The token value generated using the LinkedIn Developers OAuth
                  Token Tools. See the <a
                  href="https://docs.airbyte.com/integrations/sources/linkedin-pages/">docs</a>
                  to obtain yours.
                airbyte_secret: true
        order: 0
        title: Authentication
      org_id:
        type: string
        order: 1
        title: Organization ID
        examples:
          - "123456789"
        description: The numeric ID of the LinkedIn organization (company page) to sync. Find it in the page admin URL, e.g. linkedin.com/company/123456789/admin.
        airbyte_secret: true
      start_date:
        type: string
        order: 2
        title: Start Date
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        description: >-
          UTC date and time from which to sync, in the format
          YYYY-MM-DDT00:00:00Z. Time-bound statistics are only available from the
          last 12 months up to 2 days before today, so an earlier date is clamped
          to 12 months ago for them. Posts, and the comments and reactions on
          them, are synced for posts last modified since this date, or the last
          2 years if you leave it blank.
      time_granularity_type:
        enum:
          - DAY
          - MONTH
        type: string
        order: 3
        title: Time Granularity Type
        default: DAY
        description: >-
          Granularity of the statistics for metrics per time period. Must be
          either "DAY" or "MONTH"
      num_workers:
        type: integer
        title: Number of concurrent workers
        minimum: 1
        maximum: 10
        default: 3
        order: 4
        description: >-
          Number of concurrent requests. LinkedIn enforces a per-application
          daily quota, so increase this only if you understand your quota.
    additionalProperties: true
  config_normalization_rules:
    type: ConfigNormalizationRules
    config_migrations:
      - type: ConfigMigration
        description: Version 1.0.0 changed org_id from an integer to a string.
        transformations:
          - type: ConfigAddFields
            condition: "{{ config.get('org_id') is number }}"
            fields:
              - type: AddedFieldDefinition
                path:
                  - org_id
                value: "{{ config.get('org_id') }}"
                value_type: string
      - type: ConfigMigration
        description: >-
          The Python connector read a top-level access_token whenever
          credentials.auth_method was missing. Move that token into credentials.
        transformations:
          - type: ConfigAddFields
            condition: "{{ config.get('access_token') is string and (config.get('credentials') is none or (config.get('credentials') is mapping and not config['credentials'].get('auth_method'))) }}"
            fields:
              - type: AddedFieldDefinition
                path:
                  - credentials
                  - access_token
                value: "{{ config.get('access_token') }}"
                value_type: string
          - type: ConfigAddFields
            condition: "{{ config.get('access_token') is string and config.get('credentials') is mapping and not config['credentials'].get('auth_method') and config['credentials'].get('access_token') == config.get('access_token') }}"
            fields:
              - type: AddedFieldDefinition
                path:
                  - credentials
                  - auth_method
                value: access_token
                value_type: string
          - type: ConfigRemoveFields
            condition: "{{ config.get('access_token') is string and config.get('credentials') is mapping and config['credentials'].get('auth_method') == 'access_token' and config['credentials'].get('access_token') == config.get('access_token') }}"
            field_pointers:
              - - access_token
  type: Spec
metadata:
  autoImportSchema:
    organization_lookup: false
    follower_statistics: false
