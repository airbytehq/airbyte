spec:
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - org_id
    properties:
      credentials:
        type: object
        oneOf:
          - type: object
            title: OAuth2.0
            required:
              - client_id
              - client_secret
              - refresh_token
            properties:
              client_id:
                type: string
                title: Client ID
                description: The client ID of the LinkedIn developer application.
                airbyte_secret: true
              auth_method:
                type: string
                const: oAuth2.0
              client_secret:
                type: string
                title: Client secret
                description: The client secret of the LinkedIn developer application.
                airbyte_secret: true
              refresh_token:
                type: string
                title: Refresh token
                description: >-
                  The token value generated using the LinkedIn Developers OAuth
                  Token Tools. See the <a
                  href="https://docs.airbyte.com/integrations/sources/linkedin-pages/">docs</a>
                  to obtain yours.
                airbyte_secret: true
          - type: object
            title: Access token
            required:
              - access_token
            properties:
              auth_method:
                type: string
                const: access_token
              access_token:
                type: string
                title: Access token
                description: >-
                  The token value generated using the LinkedIn Developers OAuth
                  Token Tools. See the <a
                  href="https://docs.airbyte.com/integrations/sources/linkedin-pages/">docs</a>
                  to obtain yours.
                airbyte_secret: true
        order: 0
        title: Authentication
      org_id:
        type: string
        order: 1
        title: Organization ID
        examples:
          - "123456789"
        description: Specify the Organization ID
        airbyte_secret: true
      start_date:
        type: string
        order: 2
        title: Start Date
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        default: "2023-01-01T00:00:00Z"
        description: >-
          Start date for getting metrics per time period. Must be atmost 12
          months before the request date (UTC) and atleast 2 days prior to the
          request date (UTC). See https://bit.ly/linkedin-pages-date-rules {{ "\n"
          }} {{ response.errorDetails }}
      time_granularity_type:
        enum:
          - DAY
          - MONTH
        type: string
        order: 3
        title: Time Granularity Type
        default: DAY
        description: >-
          Granularity of the statistics for metrics per time period. Must be
          either "DAY" or "MONTH"
    additionalProperties: true
  type: Spec
metadata:
  autoImportSchema:
    organization_lookup: false
    follower_statistics: false
    share_statistics: false
    total_follower_count: false
    follower_statistics_time_bound: false
    share_statistics_time_bound: false
