    type: HttpRequester
    url_base: https://api.quora.com/ads/v0
    error_handler:
      type: CompositeErrorHandler
      error_handlers:
        - type: DefaultErrorHandler
          max_retries: 4
          response_filters:
            - type: HttpResponseFilter
              action: RETRY
              http_codes:
                - 429
              error_message: >-
                Quora rate limit reached (2000 requests/hour per OAuth client
                per ad account, shared across all reporting endpoints) —
                retrying with backoff.
          backoff_strategies:
            - type: ExponentialBackoffStrategy
