definitions:
  streams:
    account:
      type: DeclarativeStream
      name: account
      retriever:
        type: SimpleRetriever
        paginator:
          $ref: "#/definitions/report_paginator"
        requester:
          $ref: "#/definitions/base_requester"
          path: /accounts/{{ config["account_id"] }}
          http_method: GET
          request_parameters:
            fields: >-
              accountId,accountName,accountCurrency,clicks,conversions,conversionRate,costPerLead,formCompletionRate,impressions,leadsGenerated,spend
            conversionTypes: >-
              {{ (["Generic"] + (config.get("conversion_types") or [])) | unique
              | join(",") }}
            attributionWindows: >-
              {{ (config.get("attribution_windows") or
              ["CLICK_28_DAY","VIEW_1_DAY"]) | join(",") }}
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      primary_key:
        - date
        - accountId
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/account"
      transformations:
        - type: AddFields
          fields:
            - path:
                - date
              value: "{{ stream_interval.start_time }}"
      incremental_sync:
        type: DatetimeBasedCursor
        step: P1D
        cursor_field: date
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ config[\"start_date\"] }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        datetime_format: "%Y-%m-%d"
        end_time_option:
          type: RequestOption
          field_name: endDate
          inject_into: request_parameter
        lookback_window: P28D
        start_time_option:
          type: RequestOption
          field_name: startDate
          inject_into: request_parameter
        cursor_granularity: P1D
        cursor_datetime_formats:
          - "%Y-%m-%d"
