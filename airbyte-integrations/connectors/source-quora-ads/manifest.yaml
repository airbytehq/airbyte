version: 7.0.4

type: DeclarativeSource

description: >-
  Documentation reference:

  Visit
  https://www.quora.com/ads/api9169a6d6e9b42452d500a61717d87d15d5fa49ec5b53030741178130#section/Overview
  for API documentation

check:
  type: CheckStream
  stream_names:
    - account

definitions:
  linked:
    HttpRequester:
      error_handler:
        type: CompositeErrorHandler
        error_handlers:
          - type: DefaultErrorHandler
            max_retries: 4
            response_filters:
              - type: HttpResponseFilter
                action: RETRY
                http_codes:
                  - 429
                error_message: >-
                  Quora rate limit reached (2000 requests/hour per OAuth client
                  per ad account, shared across all reporting endpoints) —
                  retrying with backoff.
            backoff_strategies:
              - type: ExponentialBackoffStrategy
                factor: 60
          - type: DefaultErrorHandler
            backoff_strategies:
              - type: ExponentialBackoffStrategy
                factor: 7
      authenticator:
        type: OAuthAuthenticator
        scopes:
          - ads_read
        client_id: "{{ config[\"client_id\"] }}"
        grant_type: refresh_token
        client_secret: "{{ config[\"client_secret\"] }}"
        refresh_token: "{{ config[\"client_refresh_token\"] }}"
        expires_in_name: expires_in
        access_token_name: access_token
        refresh_request_body: {}
        refresh_token_updater:
          access_token_config_path:
            - oauth_access_token
          refresh_token_config_path:
            - client_refresh_token
          token_expiry_date_config_path:
            - oauth_token_expiry_date
        token_refresh_endpoint: https://www.quora.com/_/oauth/token
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestOption
          field_name: offset
          inject_into: request_parameter
        pagination_strategy:
          type: OffsetIncrement
          page_size: 25

