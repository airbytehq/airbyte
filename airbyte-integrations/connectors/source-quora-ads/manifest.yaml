spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - account_id
      - client_id
      - client_secret
      - client_refresh_token
      - start_date
    properties:
      client_id:
        type: string
        order: 1
        title: Client ID
        airbyte_secret: true
      account_id:
        type: string
        order: 0
        title: Account ID
      start_date:
        type: string
        order: 4
        title: Start date
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      client_secret:
        type: string
        order: 2
        title: Client secret
        airbyte_secret: true
      oauth_access_token:
        type: string
        description: >-
          The current access token. This field might be overridden by the
          connector based on the token refresh endpoint response.
        order: 5
        title: Access token
        airbyte_secret: true
      client_refresh_token:
        type: string
        order: 3
        title: Refresh token
        airbyte_secret: true
      oauth_token_expiry_date:
        type: string
        description: >-
          The date the current access token expires in. This field might be
          overridden by the connector based on the token refresh endpoint
          response.
        order: 6
        title: Token expiry date
        format: date-time
      conversion_types:
        type: array
        description: >-
          Additional conversion types to return for the `conversions` and
          `conversionRate` fields. Quora returns `Generic` only by default, so
          any other type your account fires is silently absent until listed
          here.

          `Generic` is always included whether or not it appears in this list,
          and cannot be removed. Downstream models read it as a named key, so
          dropping it would null those columns rather than fail visibly. Listing
          it explicitly is harmless.
        order: 7
        title: Conversion types
        default:
          - Generic
        items:
          type: string
          enum:
            - Generic
            - AppInstall
            - Purchase
            - GenerateLead
            - CompleteRegistration
            - AddPaymentInfo
            - AddToCart
            - AddToWishlist
            - InitiateCheckout
            - Search
      attribution_windows:
        type: array
        description: >-
          Windows used to attribute a conversion back to a click or view. Keep
          the streams' `lookback_window` at least as long as the longest window
          selected here, or conversions attributed late are never re-fetched and
          the historical rows stay short.
        order: 8
        title: Attribution windows
        default:
          - CLICK_28_DAY
          - VIEW_1_DAY
        items:
          type: string
          enum:
            - CLICK_28_DAY
            - VIEW_1_DAY
    additionalProperties: true
  advanced_auth:
    auth_flow_type: oauth2.0
    oauth_config_specification:
      oauth_connector_input_specification:
        consent_url: >-
          https://www.quora.com/_/oauth/authorize?{{client_id_key}}={{client_id_value}}&{{redirect_uri_key}}={{redirect_uri_value}}&response_type=code&{{scope_key}}={{scope_value}}&{{state_key}}={{state_value}}
        scope: ads_read
        access_token_url: https://www.quora.com/_/oauth/token
        access_token_headers:
          Content-Type: application/x-www-form-urlencoded
        access_token_params:
          "{{ auth_code_key }}": "{{ auth_code_value }}"
          "{{ client_id_key }}": "{{ client_id_value }}"
          "{{ client_secret_key }}": "{{ client_secret_value }}"
          "{{ redirect_uri_key }}": "{{ redirect_uri_value }}"
          grant_type: authorization_code
        extract_output:
          - access_token
          - refresh_token
        state:
          min: 32
          max: 44
      complete_oauth_output_specification:
        required:
          - refresh_token
        properties:
          refresh_token:
            type: string
            path_in_connector_config:
              - client_refresh_token
      complete_oauth_server_input_specification:
        required:
          - client_id
          - client_secret
        properties:
          client_id:
            type: string
          client_secret:
            type: string
      complete_oauth_server_output_specification:
        required:
          - client_id
          - client_secret
        properties:
          client_id:
            type: string
            path_in_connector_config:
              - client_id
          client_secret:
            type: string
            path_in_connector_config:
              - client_secret

