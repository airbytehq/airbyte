data:
  ab_internal:
    ql: 200
    sl: 200
  allowedHosts:
    hosts:
      - ${subdomain}.zendesk.com
      - zendesk.com
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.25.1@sha256:cdbd1578932d121f2852c065fbabebc49ccbf00078606dc503be5e4c66b373df
  connectorSubtype: api
  connectorType: source
  definitionId: c8630570-086d-4a40-99ae-ea5b18673071
  dockerImageTag: 2.0.25
  dockerRepository: airbyte/source-zendesk-talk
  documentationUrl: https://docs.airbyte.com/integrations/sources/zendesk-talk
  externalDocumentationUrls:
    - title: Developer Updates
      url: https://support.zendesk.com/hc/en-us/sections/4405298889242-Developer-updates
    - title: Changelog
      url: https://developer.zendesk.com/api-reference/changelog/changelog/
      type: api_release_history
    - title: Zendesk Talk API reference
      url: https://developer.zendesk.com/api-reference/voice/talk-api/introduction/
      type: api_reference
    - title: Zendesk authentication
      url: https://developer.zendesk.com/api-reference/introduction/security-and-auth/
      type: authentication_guide
    - title: Zendesk feature removal announcements
      url: https://support.zendesk.com/hc/en-us/articles/4408843026714-What-is-being-removed-updated-April-2026
      type: api_deprecations
    - title: Zendesk rate limits
      url: https://developer.zendesk.com/api-reference/ticketing/account-configuration/usage_limits/
      type: rate_limits
    - title: Zendesk Status
      url: https://status.zendesk.com/
      type: status_page
  githubIssueLabel: source-zendesk-talk
  icon: zendesk-talk.svg
  license: ELv2
  maxSecondsBetweenMessages: 300
  name: Zendesk Talk
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-zendesk-talk
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  supportLevel: certified
  releases:
    breakingChanges:
      2.0.0:
        upgradeDeadline: "2026-01-30"
        message: "This version adds OAuth2.0 with refresh token support. Users who authenticate via OAuth must re-authenticate to use the new flow with rotating refresh tokens."
      1.0.0:
        upgradeDeadline: "2024-05-31"
        message: >-
          The source Zendesk Talk connector is being migrated from the Python CDK
          to our declarative low-code CDK.  Due to changes to the incremental stream
          state message format and the removal of a nonexistent field from  the ivrs
          stream schema, this migration constitutes a breaking change. After updating,
          please reset your source  before resuming syncs. For more information, see
          our migration documentation for source Zendesk Talk.
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
  suggestedStreams:
    streams:
      - calls
      - call_legs
  tags:
    - language:manifest-only
    - cdk:low-code
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: zendesk-talk_config_dev_null
          id: 22e00a6c-7c05-4a2a-bbbe-2b74dd788b7b
        - name: zendesk-talk_config_old_dev_null
          id: 7bfa51b9-6c79-43fa-8b5b-291d979dd710
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-ZENDESK-TALK_OLD__CREDS
          fileName: config_old.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE-ZENDESK-TALK__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
metadataSpecVersion: "1.0"
