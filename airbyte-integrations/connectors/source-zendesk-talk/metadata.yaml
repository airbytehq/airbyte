  githubIssueLabel: source-zendesk-talk
  icon: zendesk-talk.svg
  license: ELv2
  maxSecondsBetweenMessages: 300
  name: Zendesk Talk
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-zendesk-talk
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  supportLevel: certified
  releases:
    breakingChanges:
      3.0.0:
        message: >-
          The `calls` and `call_legs` streams are removed. Zendesk is ending access to its
          Incremental APIs for third-party integrations, including the Talk incremental call
          and call-leg exports these streams read from, and names no replacement endpoint for
          them. Zendesk blocks third-party integrations from these endpoints between
          December 2, 2026 and January 19, 2027 and deactivates API tokens on April 30, 2027,
          so version 2.x has no supported way to sync the two streams. Sources whose
          connections never select `calls` or `call_legs` are upgraded automatically and need
          no action. A source with any connection that lists the two streams, including
          paused connections, stays on 2.x until you upgrade it. Before upgrading, remove
          `calls` and `call_legs` from the stream selection of every connection on that
          source: a sync on 3.0.0 that still lists them can replace their destination tables
          with empty ones in overwrite modes, and Zendesk can't provide that call history
          again. Then upgrade, refresh the source schema so the two streams leave the
          connection, and turn back on any connection Airbyte disabled; no other stream needs
          a clear or re-sync, and the call history already synced stays in your destination.
          On Airbyte Cloud, every connection on a source kept on 2.x by this change is
          disabled after December 2, 2026 until the source is upgraded. See the
          [migration guide](https://docs.airbyte.com/integrations/sources/zendesk-talk-migrations#upgrading-to-300).
        upgradeDeadline: "2026-12-02"
        deadlineAction: disable
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - calls
              - call_legs
      2.0.0:
        upgradeDeadline: "2026-01-30"
        message: "This version adds OAuth2.0 with refresh token support. Users who authenticate via OAuth must re-authenticate to use the new flow with rotating refresh tokens."
      1.0.0:
        upgradeDeadline: "2024-05-31"
        message: >-
          The source Zendesk Talk connector is being migrated from the Python CDK
          to our declarative low-code CDK.  Due to changes to the incremental stream
          state message format and the removal of a nonexistent field from  the ivrs
          stream schema, this migration constitutes a breaking change. After updating,
          please reset your source  before resuming syncs. For more information, see
          our migration documentation for source Zendesk Talk.
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
  suggestedStreams:
    streams:
      - agents_activity
      - account_overview
      - phone_numbers
  tags:
    - language:manifest-only
    - cdk:low-code
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: zendesk-talk_config_dev_null
          id: 22e00a6c-7c05-4a2a-bbbe-2b74dd788b7b
        - name: zendesk-talk_config_old_dev_null
          id: 7bfa51b9-6c79-43fa-8b5b-291d979dd710
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-ZENDESK-TALK_OLD__CREDS
          fileName: config_old.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE-ZENDESK-TALK__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
metadataSpecVersion: "1.0"
