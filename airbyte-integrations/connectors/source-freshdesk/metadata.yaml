data:
  ab_internal:
    ql: 200
    sl: 200
  allowedHosts:
    hosts:
      - "*.freshdesk.com"
      - "s3.amazonaws.com"
      - "*.s3.amazonaws.com"
      - "*.cloudfront.net"
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.47.0@sha256:b2ecb78040d4c4b42fa3537488d68a3b195f64b5fefcbc48ac0591479591a3f0
  connectorSubtype: api
  connectorType: source
  definitionId: ec4b9503-13cb-48ab-a4ab-6ade4be46567
  dockerImageTag: 4.0.0
  dockerRepository: airbyte/source-freshdesk
  documentationUrl: https://docs.airbyte.com/integrations/sources/freshdesk
  externalDocumentationUrls:
    - title: Changelog
      url: https://developers.freshdesk.com/api/#change_log
      type: api_release_history
  githubIssueLabel: source-freshdesk
  icon: freshdesk.svg
  license: ELv2
  maxSecondsBetweenMessages: 60
  name: Freshdesk
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-freshdesk
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releases:
    breakingChanges:
      4.0.0:
        message: >
          The sla_policies stream now emits its primary key id as an integer rather than
          the digit string emitted since version 3.3.6. Connections syncing sla_policies
          must refresh the source schema and refresh that stream. If your destination
          widened the id column to a string, back up any data you need to retain and
          clear the stream's destination data before re-syncing to rebuild the column
          as an integer. See the Freshdesk migration guide for details.
        upgradeDeadline: "2026-12-14"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - sla_policies
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
  releaseStage: generally_available
  suggestedStreams:
    streams:
      - tickets
      - agents
      - groups
  supportLevel: certified
  tags:
    - language:manifest-only
    - cdk:low-code
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: freshdesk_config_dev_null
          id: 5232fac1-675b-4138-abd7-f0ff04a40a8c
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-FRESHDESK__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
metadataSpecVersion: "1.0"
