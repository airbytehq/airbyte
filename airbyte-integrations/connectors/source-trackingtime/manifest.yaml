version: 7.45.1
type: DeclarativeSource
description: TrackingTime is time tracking software for agencies, professional services, and teams that
  bill by the hour. This connector syncs time entries, projects, tasks, customers, services, and users
  from the TrackingTime API.
check:
  type: CheckStream
  stream_names:
  - customers
definitions:
  base_requester:
    type: HttpRequester
    url_base: https://api.trackingtime.co/api/v4
    http_method: GET
    authenticator:
      type: BasicHttpAuthenticator
      username: API_TOKEN
      password: '{{ config[''app_password''] }}'
    request_headers:
      Content-Type: application/json
      User-Agent: airbyte-source-trackingtime
  data_selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path:
      - data
  page_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: page
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: page_size
    pagination_strategy:
      type: PageIncrement
      page_size: 1000
      start_from_page: 0
      inject_on_first_request: true
  tasks_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: page
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: page_size
    pagination_strategy:
      type: PageIncrement
      page_size: 100
      start_from_page: 0
      inject_on_first_request: true
  remove_secrets:
    type: RemoveFields
    field_pointers:
    - - '**'
      - token
    - - '**'
      - json
    - - invite_link
streams:
- type: DeclarativeStream
  name: time_entries
  primary_key:
  - ID
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /events/flat
      request_parameters:
        filter: COMPANY
        include_custom_fields: 'true'
    record_selector:
      $ref: '#/definitions/data_selector'
    paginator:
      $ref: '#/definitions/page_paginator'
  incremental_sync:
    type: DatetimeBasedCursor
    cursor_field: Start
    cursor_datetime_formats:
    - '%Y-%m-%d %H:%M:%S'
    datetime_format: '%Y-%m-%d'
    start_datetime:
      type: MinMaxDatetime
      datetime: '{{ config[''start_date''] }}'
      datetime_format: '%Y-%m-%d'
    end_datetime:
      type: MinMaxDatetime
      datetime: '{{ now_utc().strftime(''%Y-%m-%d'') }}'
      datetime_format: '%Y-%m-%d'
    step: P1M
    cursor_granularity: P1D
    lookback_window: P30D
    start_time_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: from
    end_time_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: to
  transformations:
  - type: RemoveFields
    field_pointers:
    - - Icalendar Token
    - - User Avatar Url
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/time_entries'
- type: DeclarativeStream
  name: projects
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /projects
      request_parameters:
        filter: ALL
    record_selector:
      $ref: '#/definitions/data_selector'
  transformations:
  - $ref: '#/definitions/remove_secrets'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/projects'
- type: DeclarativeStream
  name: tasks
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /tasks
      request_parameters:
        filter: ALL
    record_selector:
      $ref: '#/definitions/data_selector'
    paginator:
      $ref: '#/definitions/tasks_paginator'
  transformations:
  - $ref: '#/definitions/remove_secrets'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/tasks'
- type: DeclarativeStream
  name: customers
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /customers
    record_selector:
      $ref: '#/definitions/data_selector'
  transformations:
  - $ref: '#/definitions/remove_secrets'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/customers'
- type: DeclarativeStream
  name: services
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /services
    record_selector:
      $ref: '#/definitions/data_selector'
  transformations:
  - $ref: '#/definitions/remove_secrets'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/services'
- type: DeclarativeStream
  name: users
  primary_key:
  - id
  retriever:
    type: SimpleRetriever
    requester:
      $ref: '#/definitions/base_requester'
      path: /users
      request_parameters:
        filter: ALL
    record_selector:
      $ref: '#/definitions/data_selector'
  transformations:
  - $ref: '#/definitions/remove_secrets'
  schema_loader:
    type: InlineSchemaLoader
    schema:
      $ref: '#/schemas/users'
spec:
  type: Spec
  documentation_url: https://docs.airbyte.com/integrations/sources/trackingtime
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
    - app_password
    - start_date
    additionalProperties: true
    properties:
      app_password:
        type: string
        title: App Password
        description: TrackingTime app password. Create one in TrackingTime under Profile Settings > App
          Passwords.
        airbyte_secret: true
        order: 0
      start_date:
        type: string
        title: Start Date
        description: Time entries starting on or after this date are synced. Format YYYY-MM-DD.
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
        - '2026-01-01'
        order: 1
