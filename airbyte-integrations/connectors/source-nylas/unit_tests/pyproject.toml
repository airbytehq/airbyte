[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-nylas-unit-tests"
version = "0.0.0"
description = "Unit tests for source-nylas"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10,<3.13"
airbyte-cdk = "7.45.0"
pytest = "^8"
freezegun = "^1.4.0"
pytest-mock = "^3.6.1"
requests-mock = "^1.12.1"
