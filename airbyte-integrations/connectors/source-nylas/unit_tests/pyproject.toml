[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-nylas-tests"
version = "0.0.0"
description = "Mock server tests for source-nylas"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
airbyte-cdk = { version = "7.47.0", extras = ["test"] }
pytest = "^8"
pytest-mock = "^3.6.1"
requests-mock = "^1.12.1"

[tool.pytest.ini_options]
filterwarnings = ["ignore:This class is experimental*"]
