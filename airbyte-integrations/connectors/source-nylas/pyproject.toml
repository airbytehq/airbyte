[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-nylas"
version = "0.0.78"
description = "Tests for the manifest-only Nylas source."
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11,<3.14"
airbyte-cdk = "7.47.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-mock = "^3.12.0"
requests-mock = "^1.11.0"
freezegun = "^1.4.0"
