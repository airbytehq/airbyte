# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-ashby:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        empty_streams:
          - name: "offers"
            bypass_reason: "Sandbox account cannot seed this stream"
          - name: "job_templates"
            bypass_reason: "Sandbox account has no job templates/approvals; covered by mock-server tests"
          - name: "approvals"
            bypass_reason: "Sandbox account has no job templates/approvals; covered by mock-server tests"
          - name: "source_tracking_links"
            bypass_reason: "Sandbox account has no source tracking links; covered by mock-server tests"
        # Records of `applications`, `job_postings` do not match their declared schema (found 2026-10-09).
        # Fix those schemas, then remove this opt-out.
        validate_schema: false
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
