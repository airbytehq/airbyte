data:
  connectorSubtype: api
  connectorType: source
  definitionId: 4e8c9fa0-3634-499b-b948-11581b5c3efa
  allowedHosts:
    hosts:
      - api.ashbyhq.com
  maxSecondsBetweenMessages: 3600
  dockerImageTag: 2.0.0
  dockerRepository: airbyte/source-ashby
  githubIssueLabel: source-ashby
  icon: ashby.svg
  license: ELv2
  name: Ashby
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-ashby
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: alpha
  documentationUrl: https://docs.airbyte.com/integrations/sources/ashby
  tags:
    - cdk:low-code
    - language:manifest-only
  ab_internal:
    sl: 100
    ql: 100
  suggestedStreams:
    streams:
      - applications
      - candidates
      - jobs
      - job_postings
      - users
      - interview_schedules
  supportLevel: community
  connectorTestSuitesOptions:
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-ASHBY__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.33.0@sha256:3343cc05b79b9a3c07fa90152bd5348da7154b44f63521857bd2a745883d85cd
  externalDocumentationUrls:
    - title: API documentation
      url: https://developers.ashbyhq.com/
      type: api_reference
    - title: Authentication
      url: https://developers.ashbyhq.com/#authentication
      type: authentication_guide
  releases:
    breakingChanges:
      2.0.0:
        message: "Version 2.0.0 corrects four stream schemas to match the Ashby API. `applications.archiveReason` changes from a string to an object, and `job_postings.publishedDate` changes from a date-time to a date. `application_criteria_evaluations` gains a primary key of `application_id` and `id` and drops the always-null `assessmentType`, `criterionName`, and `jobId` columns. `interviews` drops twelve always-null scheduled-interview columns; use `interview_schedules` for that data. Connections that don't sync these four streams are unaffected. After upgrading, refresh the source schema. If an S3 Data Lake or Iceberg sync then fails with a schema-evolution error, drop the affected tables and refresh those streams. See https://docs.airbyte.com/integrations/sources/ashby-migrations#upgrading-to-200."
        upgradeDeadline: "2026-11-09"
        deadlineAction: "auto_upgrade"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - applications
              - job_postings
              - application_criteria_evaluations
              - interviews
      1.0.0:
        message: "This release declares item schemas for ten previously-untyped array columns across the `applications`, `candidates`, and `jobs` streams (`customFields`, `hiringTeam`, `emailAddresses`, `fileHandles`, `phoneNumbers`, `socialLinks`, and `tags`). This re-types those columns on data-lake destinations such as S3 Data Lake and Iceberg. Users must refresh the affected streams or recreate the affected tables after upgrading."
        upgradeDeadline: "2026-09-01"
        deadlineAction: "auto_upgrade"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - applications
              - candidates
              - jobs
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
metadataSpecVersion: "1.0"
