[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-ashby-tests"
version = "0.0.0"
description = "Unit tests for source-ashby"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10,<3.13"
# Matches the `source-declarative-manifest:7.25.1` base image pinned in metadata.yaml.
airbyte-cdk = "~7.25.1"
pytest = "^8"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*"
]
