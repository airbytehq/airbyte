spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
      - start_date
    properties:
      api_key:
        type: string
        title: Ashby API key
        description: >-
          The Ashby API Key, see <a
          href=\"https://developers.ashbyhq.com/reference/authentication\">doc</a>
          here.
        airbyte_secret: true
        order: 0
      start_date:
        type: string
        title: Start date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        description: >-
          Only applications, application feedback, and interview schedules
          created on or after this date are replicated, and application history
          and application criteria evaluations are read only for those
          applications. All other streams are read in full on every sync.
          Format: 2017-01-25T00:00:00Z.
        examples:
          - "2017-01-25T00:00:00Z"
        order: 1
    additionalProperties: true
