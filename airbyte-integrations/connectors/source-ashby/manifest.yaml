              - "null"
              - object
          currentInterviewStage:
            type:
              - "null"
              - object
          customFields:
            type:
              - "null"
              - array
          hiringTeam:
            type:
              - "null"
              - array
          id:
            type:
              - "null"
              - string
          job:
            type:
              - "null"
              - object
          status:
            type:
              - "null"
              - string
          source:
            type:
              - "null"
              - object
            properties:
              id:
                type:
                  - "null"
                  - string
              isArchived:
                type:
                  - "null"
                  - boolean
              sourceType:
                type:
                  - "null"
                  - object
                properties:
                  id:
                    type:
                      - "null"
                      - string
                  isArchived:
                    type:
                      - "null"
