version: 4.3.0
type: DeclarativeSource
definitions:
  response_filters:
    rate_limited:
      type: HttpResponseFilter
      action: RATE_LIMITED
      http_codes: [429]
    server_error:
      type: HttpResponseFilter
      action: RETRY
      http_codes: [500, 502, 503, 504]
    unauthorized:
      type: HttpResponseFilter
      action: FAIL
      failure_type: config_error
      http_codes: [401]
      error_message: >-
        Ashby rejected the API key (HTTP 401 Unauthorized). Check that the API key in the
        source settings is correct and still active, or generate a new key in Ashby under
        Admin > API Keys.
    missing_endpoint_permission:
      type: HttpResponseFilter
      action: FAIL
      failure_type: config_error
      predicate: >-
        {{ response.get('success', true) == false and
        response.get('errorInfo', {}).get('code') == 'missing_endpoint_permission' }}
      error_message: >-
        The Ashby API key lacks a module permission this stream needs:
        {{ response.get('errorInfo', {}).get('message', 'missing_endpoint_permission') }}.
        Enable the permission on the key in Ashby under Admin > API Keys, or deselect the stream.
    forbidden:
      type: HttpResponseFilter
      action: FAIL
      failure_type: config_error
      http_codes: [403]
      error_message: >-
        Ashby refused the request (HTTP 403 Forbidden). The API key may be deactivated or
        lack access; generate a new key in Ashby under Admin > API Keys.
    success_false:
      type: HttpResponseFilter
      action: FAIL
      predicate: "{{ response.get('success', true) == false }}"
      error_message: >-
        {%- set info = response.get('errorInfo') or {} -%}
        {%- set first = (response.get('errors') or [{}])[0] -%}
        Ashby returned an error
        ({{ info.get('code') or (first.get('code') if first is mapping else first) or 'unknown' }}):
        {{ info.get('message') or (first.get('message') if first is mapping else first) or 'no message provided' }}
        (request ID: {{ info.get('requestId') or 'unavailable' }}).
  application_updated_at_cursor:
    # application.list has no updatedAt filter (updatedAfter is ignored) and is ordered by
    # createdAt, so the record_filter on each application.list selector filters on updatedAt
    # from the slice start. State is the latest updatedAt seen in a scan that can run for
    # hours; the 1-day lookback re-reads applications updated mid-scan, for scans up to ~24
    # hours (about 140,000 applications at 100 history requests per minute).
    # is_client_side_incremental would ignore lookback_window on CDK 7.32.0.
    type: DatetimeBasedCursor
    cursor_field: updatedAt
    cursor_datetime_formats:
      - "%Y-%m-%dT%H:%M:%S.%f%z"
      - "%Y-%m-%dT%H:%M:%S%z"
    datetime_format: "%Y-%m-%dT%H:%M:%S.%fZ"
    start_datetime:
      type: MinMaxDatetime
      datetime: "{{ config['start_date'] }}"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
    lookback_window: P1D
  error_handler:
    type: DefaultErrorHandler
    max_retries: 6
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - $ref: "#/definitions/response_filters/rate_limited"
      - $ref: "#/definitions/response_filters/server_error"
      - $ref: "#/definitions/response_filters/unauthorized"
      - $ref: "#/definitions/response_filters/missing_endpoint_permission"
      - $ref: "#/definitions/response_filters/forbidden"
      - $ref: "#/definitions/response_filters/success_false"
  streams:
    interview_plans:
      type: DeclarativeStream
      name: interview_plans
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          type: HttpRequester
          url_base: https://api.ashbyhq.com
          authenticator:
            type: BasicHttpAuthenticator
            username: "{{ config['api_key'] }}"
            password: ""
          path: /interviewPlan.list
          http_method: POST
          error_handler:
            $ref: "#/definitions/error_handler"
          request_body_json:
            includeArchived: true
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - results
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: body_json
            field_name: cursor
          page_size_option:
            type: RequestOption
            inject_into: body_json
            field_name: limit
          pagination_strategy:
            type: CursorPagination
            page_size: 100
            cursor_value: "{{ response.nextCursor }}"
            stop_condition: "{{ not response.moreDataAvailable }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          type: object
          $schema: http://json-schema.org/draft-07/schema#
          additionalProperties: true
          properties:
            id:
              type:
                - "null"
                - string
            title:
              type:
                - "null"
                - string
            isArchived:
              type:
                - "null"
                - boolean
            createdAt:
              type:
                - "null"
                - string
              format: date-time
            updatedAt:
              type:
                - "null"
                - string
              format: date-time
concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: 2
api_budget:
  type: HTTPAPIBudget
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 100
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: /application\.listHistory
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 100
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: /application\.listCriteriaEvaluations
