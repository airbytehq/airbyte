spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
      - start_date
    properties:
      api_key:
        type: string
        title: Ashby API key
        description: >-
          The Ashby API Key, see <a
          href=\"https://developers.ashbyhq.com/reference/authentication\">doc</a>
          here.
        airbyte_secret: true
        order: 0
      start_date:
        type: string
        title: Start date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        description: >-
          UTC date and time in the format 2017-01-25T00:00:00Z. Any data before
          this date will not be replicated.
        examples:
          - "2017-01-25T00:00:00Z"
        order: 1
    additionalProperties: true
metadata:
  autoImportSchema:
    applications: false
    archive_reasons: false
    candidate_tags: false
    candidates: false
    custom_fields: false
    departments: false
    feedback_form_definitions: false
    interview_schedules: false
    job_postings: false
    jobs: false
    locations: false
    offers: false
    sources: false
    users: false
    interviews: false
    interview_stages: false
    application_criteria_evaluations: false
