                  - "null"
                  - string
              applicationFormDefinitionId:
                type:
                  - "null"
                  - string
                format: uuid
              applicationFormFieldPath:
                type:
                  - "null"
                  - string
          criterionName:
            type:
              - "null"
              - string
          evaluatedAt:
            type:
