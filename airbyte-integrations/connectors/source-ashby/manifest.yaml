  - type: DeclarativeStream
    name: application_history
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://api.ashbyhq.com
        authenticator:
          type: BasicHttpAuthenticator
          username: "{{ config['api_key'] }}"
          password: "{{ config['api_key'] }}"
        path: /application.listHistory
        http_method: POST
        request_body_json:
          applicationId: "{{ stream_partition.application_id }}"
        error_handler:
          type: DefaultErrorHandler
          response_filters:
            - type: HttpResponseFilter
              action: RATE_LIMITED
              http_codes:
                - 429
            - type: HttpResponseFilter
              action: RETRY
              http_codes:
                - 500
                - 502
                - 503
                - 504
            - type: HttpResponseFilter
              action: IGNORE
              predicate: >-
                {{ response.get('success', true) == false and
                response.get('errorInfo', {}).get('code') == 'application_not_found' }}
              error_message: >-
                Ashby applicationId request returned application_not_found:
                {{ response.get('errorInfo', {}).get('message', 'Application not found') }}.
            - type: HttpResponseFilter
              action: FAIL
              predicate: "{{ response.get('success', true) == false }}"
              error_message: >-
                Ashby applicationId request failed with code
                {{ response.get('errorInfo', {}).get('code', 'unknown') }}:
                {{ response.get('errorInfo', {}).get('message') or
                (response.get('errors') and response.get('errors')[0].get('message')) or
                'Unknown error' }}.
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - results
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestOption
          inject_into: body_json
          field_name: cursor
        page_size_option:
          type: RequestOption
          inject_into: body_json
          field_name: limit
        pagination_strategy:
          type: CursorPagination
          page_size: 100
          cursor_value: "{{ response.nextCursor }}"
          stop_condition: "{{ not response.moreDataAvailable }}"
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              type: DeclarativeStream
              name: applications_for_history
              primary_key:
                - id
              retriever:
                type: SimpleRetriever
                requester:
                  type: HttpRequester
                  url_base: https://api.ashbyhq.com
                  authenticator:
                    type: BasicHttpAuthenticator
                    username: "{{ config['api_key'] }}"
                    password: "{{ config['api_key'] }}"
                  path: /application.list
                  http_method: POST
                  request_body_json:
                    createdAfter: "{{ timestamp(config['start_date']) * 1000 }}"
                record_selector:
                  type: RecordSelector
                  extractor:
                    type: DpathExtractor
                    field_path:
                      - results
                paginator:
                  type: DefaultPaginator
                  page_token_option:
                    type: RequestOption
                    inject_into: body_json
                    field_name: cursor
                  page_size_option:
                    type: RequestOption
                    inject_into: body_json
                    field_name: limit
                  pagination_strategy:
                    type: CursorPagination
                    page_size: 100
                    cursor_value: "{{ response.nextCursor }}"
                    stop_condition: "{{ not response.moreDataAvailable }}"
              schema_loader:
                type: InlineSchemaLoader
                schema:
                  type: object
                  $schema: http://json-schema.org/draft-07/schema#
                  additionalProperties: true
                  properties:
                    id:
                      type: string
            parent_key: id
            partition_field: application_id
            extra_fields:
              - - status
              - - createdAt
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - application_id
            value: "{{ stream_partition.application_id }}"
          - type: AddedFieldDefinition
            path:
              - application_status
            value: "{{ stream_slice.extra_fields['status'] }}"
          - type: AddedFieldDefinition
            path:
              - application_created_at
            value: "{{ stream_slice.extra_fields['createdAt'] }}"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: true
        properties:
          id:
            type: string
            format: uuid
          application_id:
            type:
              - "null"
              - string
          application_status:
            type:
              - "null"
              - string
          application_created_at:
            type:
              - "null"
              - string
            format: date-time
          stageId:
            type:
              - "null"
              - string
            format: uuid
          title:
            type:
              - "null"
              - string
          enteredStageAt:
            type:
              - "null"
              - string
            format: date-time
          leftStageAt:
            type:
              - "null"
              - string
            format: date-time
          stageNumber:
            type:
              - "null"
              - integer
          actorId:
            type:
              - "null"
              - string
          allowedActions:
            type:
              - "null"
              - array
            items:
              type: string
spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
      - start_date
    properties:
      api_key:
        type: string
        title: Ashby API key
        description: >-
          The Ashby API Key, see <a
          href=\"https://developers.ashbyhq.com/reference/authentication\">doc</a>
          here.
        airbyte_secret: true
        order: 0
      start_date:
        type: string
        title: Start date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        description: >-
          UTC date and time in the format 2017-01-25T00:00:00Z. Any data before
          this date will not be replicated.
        examples:
          - "2017-01-25T00:00:00Z"
        order: 1
    additionalProperties: true
metadata:
  autoImportSchema:
    applications: false
    archive_reasons: false
