  testedStreams:
    capture_usage_daily:
      isStale: false
      hasRecords: true
      streamHash: fec369fd7a0a394a94f48d356bd43bafbc4e8c59
      hasResponse: true
      primaryKeysAreUnique: true
      primaryKeysArePresent: true
      responsesAreSuccessful: true
    wallet_usage_records:
      isStale: false
