              - "null"
          open_status:
            type:
              - number
              - "null"
          refund_json:
            type:
              - string
              - "null"
          refund_type:
            type:
              - number
              - "null"
          coin_balance:
            type:
              - number
              - "null"
          coupon_money:
            type:
              - number
              - "null"
          create_admin:
            type:
              - string
              - "null"
          refund_money:
            type:
              - number
              - "null"
          sales_rebate:
            type:
              - number
              - "null"
          package_price:
            type:
              - number
              - "null"
          invoice_number:
            type:
              - string
