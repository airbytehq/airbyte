      streamHash: be10bc4e0440cc1fd3348bfeaaeb60825b57189b
      hasResponse: true
      primaryKeysAreUnique: true
      primaryKeysArePresent: true
      responsesAreSuccessful: true
    wallet_balance_snapshot:
      isStale: false
