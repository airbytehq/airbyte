        additionalProperties: true
  - type: DeclarativeStream
    name: wallet_balance_snapshot
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url: https://api-m.novada.com/v1/wallet/balance
        http_method: POST
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['api_key'] }}"
        error_handler:
          type: DefaultErrorHandler
          max_retries: 3
          response_filters:
            - type: HttpResponseFilter
              action: FAIL
              predicate: "{{ response.code != 0 }}"
              failure_type: config_error
              error_message: "Novada API error {{ response.code }}: {{ response.msg }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        properties:
          balance:
            type:
              - number
              - "null"
        additionalProperties: true

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - start_date
      - api_key
    properties:
      api_key:
        type: string
        order: 2
        title: API Key
        airbyte_secret: true
      start_date:
        type: string
        description: UTC ISO 8601, for example 2026-09-20T00:00:00Z
        order: 0
        title: Start Date
      wallet_page_size:
        type: integer
        order: 1
        title: Wallet Page Size
        default: 10
        minimum: 1
    additionalProperties: true

