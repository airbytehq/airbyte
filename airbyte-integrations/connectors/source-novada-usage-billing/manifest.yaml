version: 7.28.2

type: DeclarativeSource

description: >-
  Read-only Novada source connector for syncing daily capture usage, wallet
  usage records, and wallet balance to Airbyte destinations for cost monitoring
  and billing reconciliation. Uses a Bearer API key; no external resources are
  modified.

check:
  type: CheckStream
  stream_names:
    - capture_usage_daily

definitions:
  linked:
    HttpRequester:
      authenticator:
        type: BearerAuthenticator
        api_token: "{{ config['api_key'] }}"
      error_handler:
        type: DefaultErrorHandler
        max_retries: 3
        response_filters:
          - type: HttpResponseFilter
            action: FAIL
            predicate: "{{ response.code != 0 }}"
            failure_type: config_error
            error_message: "Novada API error {{ response.code }}: {{ response.msg }}"

streams:
  - type: DeclarativeStream
    name: capture_usage_daily
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url: https://api-m.novada.com/v1/capture/logs
        http_method: POST
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['api_key'] }}"
        error_handler:
          type: DefaultErrorHandler
          max_retries: 3
          response_filters:
            - type: HttpResponseFilter
              action: FAIL
              predicate: "{{ response.code != 0 }}"
              failure_type: config_error
              error_message: "Novada API error {{ response.code }}: {{ response.msg }}"
              error_message_contains: ""
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
            - list
    primary_key: time_label
    incremental_sync:
      type: DatetimeBasedCursor
      step: P30D
      cursor_field: time_label
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config['start_date'] }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      datetime_format: "%Y-%m-%d %H:%M:%S"
      end_time_option:
        type: RequestOption
        field_name: end_time
        inject_into: request_parameter
      lookback_window: P1D
      start_time_option:
        type: RequestOption
        field_name: start_time
        inject_into: request_parameter
      cursor_granularity: P1D
      cursor_datetime_formats:
        - "%Y-%m-%d"
      partition_field_end: ""
      partition_field_start: ""
  - type: DeclarativeStream
    name: wallet_usage_records
    retriever:
      type: SimpleRetriever
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: limit
          inject_into: body_data
        page_token_option:
          type: RequestOption
          field_name: page
          inject_into: body_data
        pagination_strategy:
          type: PageIncrement
          page_size: "{{ config['wallet_page_size'] }}"
          start_from_page: 1
          inject_on_first_request: true
      requester:
        type: HttpRequester
        url: https://api-m.novada.com/v1/wallet/usage_record
        http_method: POST
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['api_key'] }}"
        error_handler:
          type: DefaultErrorHandler
          max_retries: 3
          response_filters:
            - type: HttpResponseFilter
              action: FAIL
              predicate: "{{ response.code != 0 }}"
              failure_type: config_error
              error_message: "Novada API error {{ response.code }}: {{ response.msg }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
            - list
    primary_key: id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        required:
          - id
        properties:
          type:
            type:
              - number
              - "null"
          description:
            type:
              - string
              - "null"
          id:
            type: number
          uid:
            type:
              - number
              - "null"
          coin:
            type:
              - number
              - "null"
          money:
            type:
              - number
              - "null"
          belong:
            type:
              - number
              - "null"
          origin:
            type:
              - number
              - "null"
          pay_sn:
            type:
              - string
              - "null"
          source:
            type:
              - number
              - "null"
          status:
            type:
              - number
              - "null"
          currency:
            type:
              - string
              - "null"
          order_id:
            type:
              - string
              - "null"
          pay_cate:
            type:
              - number
              - "null"
          pay_time:
            type:
              - number
              - "null"
          pay_type:
            type:
