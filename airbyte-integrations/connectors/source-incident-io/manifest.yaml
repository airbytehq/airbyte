        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: after
          page_size_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: page_size
          pagination_strategy:
            type: CursorPagination
            page_size: 25
            cursor_value: "{{ response.get('pagination_meta', {}).get('after') }}"
            stop_condition: "{{ response.get('pagination_meta', {}).get('after') is none }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/escalation_paths"
  base_error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: retry-after
        max_waiting_time_in_seconds: 600
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 401
        error_message: "The API key is invalid or has been revoked. Create a new key in incident.io under Settings > API keys and update the connector configuration."
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 403
        error_message: "The API key lacks a permission this stream needs: {{ ((response.get('errors') or [{}])[0].get('message') or 'see the incident.io error response')[:300] }}. Grant it in incident.io under Settings > API keys, or deselect the stream."
      - type: HttpResponseFilter
        action: RATE_LIMITED
        http_codes:
          - 429
        error_message: "incident.io rate limit reached. Retrying after the Retry-After interval."
      - type: HttpResponseFilter
        action: RETRY
        http_codes:
          - 408
          - 500
          - 502
          - 503
          - 504
        error_message: "incident.io returned a transient error. Retrying."
      - type: HttpResponseFilter
        action: FAIL
        failure_type: system_error
        http_codes:
          - 400
          - 404
          - 405
          - 406
          - 409
          - 412
          - 413
          - 422
        error_message: "incident.io rejected the request: {{ ((response.get('errors') or [{}])[0].get('message') or 'see the incident.io error response')[:300] }}"
  base_requester:
    type: HttpRequester
    url_base: https://api.incident.io
    authenticator:
      type: BearerAuthenticator
      api_token: "{{ config[\"api_key\"] }}"
    error_handler:
      type: CompositeErrorHandler
      error_handlers:
        - $ref: "#/definitions/base_error_handler"
  updated_at_cursor:
    type: DatetimeBasedCursor
    cursor_field: updated_at
    cursor_datetime_formats:
      - "%Y-%m-%dT%H:%M:%S.%fZ"
      - "%Y-%m-%dT%H:%M:%SZ"
    datetime_format: "%Y-%m-%dT%H:%M:%S.%fZ"
    step: "{{ config.get('time_window') or 'P30D' }}"
    cursor_granularity: "PT0.000001S"
    lookback_window: "PT5M"
    start_datetime:
      type: MinMaxDatetime
      datetime: "{{ config.get('start_date') or '2020-01-01T00:00:00Z' }}"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"

