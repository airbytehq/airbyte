      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /v1/incident_attachments
          http_method: GET
          error_handler:
            $ref: "#/definitions/base_error_handler"
            response_filters:
              - type: HttpResponseFilter
                action: IGNORE
                http_codes:
                  - 404
              - $ref: "#/definitions/base_error_handler/response_filters/0"
              - $ref: "#/definitions/base_error_handler/response_filters/1"
              - $ref: "#/definitions/base_error_handler/response_filters/2"
              - $ref: "#/definitions/base_error_handler/response_filters/3"
              - $ref: "#/definitions/base_error_handler/response_filters/4"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - incident_attachments
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              request_option:
                type: RequestOption
                inject_into: request_parameter
                field_name: incident_id
              partition_field: incident_id
              stream:
                $ref: "#/definitions/streams/incidents"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/incident_attachments"
