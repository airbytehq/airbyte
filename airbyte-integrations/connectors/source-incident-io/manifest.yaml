api_budget:
  type: HTTPAPIBudget
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 60
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          method: GET
          url_base: https://api.incident.io
          url_path_pattern: ^/v2/incidents$
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 1200
          interval: PT1M
      matchers: []
  ratelimit_remaining_header: x-ratelimit-remaining
  status_codes_for_ratelimit_hit:
    - 429

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
    properties:
      api_key:
        type: string
        description: API key to use. Find it at https://app.incident.io/settings/api-keys
        name: api_key
        title: API Key
        airbyte_secret: true
        order: 0
      start_date:
        type: string
        title: Start Date
        description: "Only sync records updated on or after this UTC date for the incremental streams (incidents, alerts, escalations, actions, follow-ups). The default predates all incident.io data, so everything is synced. Streams read per incident, such as `incident_attachments`, follow the same scope and only cover incidents updated on or after this date."
        format: date-time
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        default: "2020-01-01T00:00:00Z"
        examples:
          - "2024-01-01T00:00:00Z"
        order: 1
      time_window:
        type: string
        title: Time window
        description: "Size of each date window requested from incident.io on incremental streams, in whole days as an ISO 8601 duration (for example P30D, P7D, P365D). The minimum is P1D because incidents and escalations filter by date. Smaller windows let more requests run in parallel on large accounts; larger windows mean fewer requests on small accounts. Defaults to P30D."
        default: "P30D"
        pattern: "^P[1-9][0-9]*D$"
        examples:
          - "P30D"
          - "P7D"
          - "P365D"
        order: 2
      num_workers:
        type: integer
        title: Number of concurrent workers
        description: "Number of streams and partitions read in parallel. Higher values can speed up large syncs but use more of the incident.io rate limit (1,200 requests per minute per API key, 60 per minute on incidents). Defaults to 4."
        default: 4
        minimum: 1
        maximum: 10
        order: 3
    additionalProperties: true

