version: 7.33.0

type: DeclarativeSource

description: >-
  The Incident.io source connector which ingests data from the incident API.
  Incident.io is an on call, status pages and incident response tool.
  The source supports a number of API changes.
  For more information, checkout the website https://incident.io/
  
  An API key is required for authentication and using this connector.
  In order to obtain an API key, you must have a PRO or above account.
  Once logged-in, you will find your API key your dashboard settings.
  You can find more about their API here https://api-docs.incident.io/
  
check:
  type: CheckStream
  stream_names:
    - incidents

definitions:
  streams:
    actions:
      type: DeclarativeStream
      name: actions
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /v3/actions
          http_method: GET
          request_parameters:
            updated_at[date_range]: "{{ stream_interval['start_time'] }}~{{ stream_interval['end_time'] }}"
        partition_router:
          type: ListPartitionRouter
          cursor_field: incident_mode
          values:
            - standard
            - retrospective
            - test
            - tutorial
            - stream
          request_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: incident_mode
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - actions
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: after
          page_size_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: page_size
          pagination_strategy:
            type: CursorPagination
            page_size: 250
            cursor_value: "{{ response.get('pagination_meta', {}).get('after') }}"
            stop_condition: "{{ response.get('pagination_meta', {}).get('after') is none }}"
      incremental_sync:
        $ref: "#/definitions/updated_at_cursor"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/actions"
    catalog_types:
      type: DeclarativeStream
      name: catalog_types
      primary_key:
        - id
      retriever:
