    breakingChanges:
      1.0.0:
        message: >-
          Version 1.0.0 replaces the top-level `password` configuration field with
          a `credentials` block that supports both SSH password and SSH key
          authentication. Existing connections using the legacy `password` field
          will continue to work (the connector auto-converts to the new format),
          but you must re-save your connection configuration in the UI to use the
          new credential format. See the [migration guide](https://docs.airbyte.com/integrations/destinations/sftp-json-migrations).
