version: 7.40.0
type: DeclarativeSource

description: >-
  Source for the Partoo REST API v2 (https://developers.partoo.co): businesses,
  reviews, messaging, posts, users, organizations, feedback, and presence /
  review analytics.

check:
  type: CheckStream
  stream_names:
    - businesses

# Partoo allows 300 requests per minute per organization; stay under it.
api_budget:
  type: HTTPAPIBudget
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 280
          interval: PT1M
      matchers: []

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: 4
  max_concurrency: 8

definitions:
  requester:
    type: HttpRequester
    url_base: >-
      {{ 'https://api.sandbox.partoo.co/v2' if config.get('environment') == 'sandbox' else 'https://api.partoo.co/v2' }}
    http_method: GET
    authenticator:
      type: ApiKeyAuthenticator
      api_token: "{{ config['api_key'] }}"
      inject_into:
        type: RequestOption
        inject_into: header
        field_name: x-APIKey
    error_handler:
      type: DefaultErrorHandler
      response_filters:
        - type: HttpResponseFilter
          action: RATE_LIMITED
          http_codes:
            - 429
      backoff_strategies:
        - type: WaitTimeFromHeader
          header: Retry-After

  # Most list endpoints: ?page=N&per_page=M, 1-indexed.
  page_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: page
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: per_page
    pagination_strategy:
      type: PageIncrement
      start_from_page: 1
      page_size: 100
      inject_on_first_request: true

  # /conversations and /messages: ?cursor=<next_cursor>.
  cursor_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: cursor
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: per_page
    pagination_strategy:
      type: CursorPagination
      cursor_value: "{{ response.next_cursor }}"
      stop_condition: "{{ not response.next_cursor }}"
      page_size: 100

  start_datetime:
    type: MinMaxDatetime
    datetime: "{{ config['start_date'] }}"
    datetime_format: "%Y-%m-%dT%H:%M:%SZ"

  streams:
    businesses:
      type: DeclarativeStream
      name: businesses
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/requester"
          path: /business/search
          request_parameters:
            order_by: modified
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - businesses
        paginator:
          $ref: "#/definitions/page_paginator"
      # No modified__lte filter exists, so the whole range is one slice.
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: modified
        datetime_format: "%s_as_float"
        start_datetime:
          $ref: "#/definitions/start_datetime"
        start_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: modified__gte
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/businesses"

    reviews:
      type: DeclarativeStream
      name: reviews
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/requester"
          path: /reviews
          request_parameters:
            order_by: update_date
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - reviews
        paginator:
          $ref: "#/definitions/page_paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: update_date
        datetime_format: "%Y-%m-%dT%H:%M:%S"
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%S.%f%z"
          - "%Y-%m-%dT%H:%M:%S%z"
        start_datetime:
          $ref: "#/definitions/start_datetime"
        step: P30D
        cursor_granularity: PT1S
        start_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: update_date__gte
        end_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: update_date__lte
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/reviews"

    conversations:
      type: DeclarativeStream
      name: conversations
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/requester"
          path: /conversations
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - conversations
        paginator:
          $ref: "#/definitions/cursor_paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: last_message_date
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        cursor_datetime_formats:
          - "%Y-%m-%d %H:%M:%S.%f%z"
          - "%Y-%m-%d %H:%M:%S%z"
          - "%Y-%m-%dT%H:%M:%S.%f%z"
          - "%Y-%m-%dT%H:%M:%S%z"
        start_datetime:
          $ref: "#/definitions/start_datetime"
        step: P30D
        cursor_granularity: PT1S
        start_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: last_message_date__gte
        end_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: last_message_date__lte
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/conversations"

    # One request chain per conversation. incremental_dependency re-reads only
    # conversations whose last_message_date moved since the previous sync.
    messages:
      type: DeclarativeStream
      name: messages
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/requester"
          path: /messages
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - messages
        paginator:
          $ref: "#/definitions/cursor_paginator"
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                $ref: "#/definitions/streams/conversations"
              parent_key: id
              partition_field: conversation_id
              incremental_dependency: true
              request_option:
                type: RequestOption
                inject_into: request_parameter
                field_name: conversation_id
      # /messages has no date filter: records older than the state are dropped client-side.
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: date
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        cursor_datetime_formats:
          - "%Y-%m-%d %H:%M:%S.%f%z"
          - "%Y-%m-%d %H:%M:%S%z"
          - "%Y-%m-%dT%H:%M:%S.%f%z"
          - "%Y-%m-%dT%H:%M:%S%z"
        start_datetime:
          $ref: "#/definitions/start_datetime"
        is_client_side_incremental: true
        global_substream_cursor: true
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/messages"

    # The API filters posts by publication dates, not by updated_at, so this is full refresh.
    # /posts requires an explicit business scope; apply_to_all_business covers every business.
    posts:
      type: DeclarativeStream
      name: posts
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/requester"
          path: /posts
          request_parameters:
            apply_to_all_business: "True"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - posts
        paginator:
          $ref: "#/definitions/page_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/posts"

    users:
      type: DeclarativeStream
      name: users
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/requester"
          path: /user/search
          request_parameters:
            display_business_ids: "true"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - users
        paginator:
          $ref: "#/definitions/page_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/users"

    organizations:
      type: DeclarativeStream
      name: organizations
      primary_key:
        - org_id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/requester"
          path: /org/search
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - orgs
        paginator:
          $ref: "#/definitions/page_paginator"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/organizations"

    # Feedback Management is BETA on Partoo's side (2-week notice on changes).
    # Its endpoints document no per_page parameter: pages are fixed at 30.
    feedback_forms:
      type: DeclarativeStream
      name: feedback_forms
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/requester"
          path: /feedback/feedback_form
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - items
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: page
          pagination_strategy:
            type: PageIncrement
            start_from_page: 1
            page_size: 30
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/feedback_forms"

    feedback_results:
      type: DeclarativeStream
      name: feedback_results
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/requester"
          path: /feedback/feedback_result
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - items
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: page
          pagination_strategy:
            type: PageIncrement
            start_from_page: 1
            page_size: 30
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: created
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%S%z"
          - "%Y-%m-%dT%H:%M:%S.%f%z"
        start_datetime:
          $ref: "#/definitions/start_datetime"
        step: P30D
        cursor_granularity: PT1S
        start_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: created__gte
        end_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: created__lte
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/feedback_results"

    # Google Business Profile metrics per business per day. Google revises the
    # last ~5 days, so each sync re-reads a week.
    presence_metrics_daily:
      type: DeclarativeStream
      name: presence_metrics_daily
      primary_key:
        - business_id
        - date
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/requester"
          path: /presence_analytics/metrics
          request_parameters:
            metrics: >-
              business_impressions_desktop_maps,business_impressions_desktop_search,business_impressions_mobile_maps,business_impressions_mobile_search,business_direction_requests,call_clicks,website_clicks
            dimensions: business,day
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - metrics
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: page
          page_size_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: per_page
          pagination_strategy:
            type: PageIncrement
            start_from_page: 1
            page_size: 500
            inject_on_first_request: true
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: date
        datetime_format: "%Y-%m-%d"
        start_datetime:
          $ref: "#/definitions/start_datetime"
        step: P30D
        cursor_granularity: P1D
        lookback_window: P7D
        start_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: filter_date__gte
        end_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: filter_date__lte
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/presence_metrics_daily"

    # Review metrics accept a single dimension, so business x day is built by
    # requesting dimensions=business over one-day slices and stamping the date.
    # The date filter applies to review update_date, so a day's figures cover
    # the reviews updated that day.
    review_metrics_daily:
      type: DeclarativeStream
      name: review_metrics_daily
      primary_key:
        - business_id
        - date
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/requester"
          path: /review_analytics/metrics
          request_parameters:
            metrics: average_rating,reviews_count,rating_distribution,reply_time,reply_means
            dimensions: business
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          $ref: "#/definitions/page_paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: date
        datetime_format: "%Y-%m-%dT%H:%M:%S"
        cursor_datetime_formats:
          - "%Y-%m-%d"
        start_datetime:
          $ref: "#/definitions/start_datetime"
        step: P1D
        cursor_granularity: PT1S
        lookback_window: P2D
        start_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: update_date__gte
        end_time_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: update_date__lte
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - business_id
              value: "{{ record['dimension'] }}"
            - type: AddedFieldDefinition
              path:
                - date
              value: "{{ stream_slice['start_time'][:10] }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/review_metrics_daily"

streams:
  - $ref: "#/definitions/streams/businesses"
  - $ref: "#/definitions/streams/reviews"
  - $ref: "#/definitions/streams/conversations"
  - $ref: "#/definitions/streams/messages"
  - $ref: "#/definitions/streams/posts"
  - $ref: "#/definitions/streams/users"
  - $ref: "#/definitions/streams/organizations"
  - $ref: "#/definitions/streams/feedback_forms"
  - $ref: "#/definitions/streams/feedback_results"
  - $ref: "#/definitions/streams/presence_metrics_daily"
  - $ref: "#/definitions/streams/review_metrics_daily"

spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - api_key
      - start_date
    additionalProperties: true
    properties:
      api_key:
        type: string
        title: API Key
        description: Partoo API key, sent as the x-APIKey header. Ask your Partoo Account Manager for one.
        airbyte_secret: true
        order: 0
      start_date:
        type: string
        title: Start Date
        description: Earliest date to replicate for incremental streams, in UTC.
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        examples:
          - "2025-01-01T00:00:00Z"
        format: date-time
        order: 1
      environment:
        type: string
        title: Environment
        description: Sandbox has no reviews or analytics data.
        enum:
          - production
          - sandbox
        default: production
        order: 2

# Schemas were inferred from live Partoo API responses (a production test org).
