acceptance_tests:
  basic_read:
    tests:
      - config_path: secrets/config.json
        empty_streams:
          - name: issues
            bypass_reason: "Project issues are not being returned by the Sentry API."
          - name: events
            bypass_reason: "No event records exist for the test project."
          - name: releases
            bypass_reason: "The test organization has no releases left: the releases API returns none."
  connection:
    tests:
      - config_path: secrets/config.json
        status: succeed
      - config_path: integration_tests/invalid_config.json
        status: failed
  discovery:
    tests:
      - config_path: secrets/config.json
  full_refresh:
    tests:
      - config_path: secrets/config.json
        configured_catalog_path: integration_tests/configured_catalog_full_refresh.json
        # Token with project:read only (no org:read / event:read). A 403 fails the stream
        # (config_error), so the three streams that need the missing scopes are excluded;
        # the rest must still sync with this token.
      - config_path: secrets/config_limited_scopes.json
        configured_catalog_path: integration_tests/configured_catalog_full_refresh.json
        empty_streams:
          - name: all_projects_detail
            bypass_reason: "The limited-scope token gets 403 Forbidden on this stream."
          - name: issues
            bypass_reason: "The limited-scope token gets 403 Forbidden on this stream."
          - name: projects
            bypass_reason: "The limited-scope token gets 403 Forbidden on this stream."
  incremental:
    tests:
      - config_path: secrets/config.json
        skip_comprehensive_incremental_tests: true
        configured_catalog_path: integration_tests/configured_catalog.json
        future_state:
          bypass_reason: "Concurrent incremental streams emit a state with the most recent record or the lower boundary instead of the incoming abnormal state value"
          missing_streams:
            - name: issues
              bypass_reason: "Project issues are not being returned by the Sentry API."
            - name: events
              bypass_reason: "No event records exist for the test project."
  spec:
    tests:
      - spec_path: manifest.yaml
connector_image: airbyte/source-sentry:dev
test_strictness_level: high
