[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-okta-unit-tests"
version = "0.0.0"
description = "Unit tests for source-okta"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11,<3.14"
airbyte-cdk = "~7.47"
pytest = "^8"
pytest-mock = "^3.6.1"
requests-mock = "^1.12.1"
cryptography = ">=43"

[tool.pytest.ini_options]
filterwarnings = ["ignore:This class is experimental*"]
