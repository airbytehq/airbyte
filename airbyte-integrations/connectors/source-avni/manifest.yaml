version: 7.33.0
definitions:
  selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path:
      - content
  requester:
    type: HttpRequester
    url_base: https://app.avniproject.org/api
    http_method: GET
    authenticator:
      type: SessionTokenAuthenticator
      login_requester:
        type: HttpRequester
        url: https://cognito-idp.ap-south-1.amazonaws.com/
        http_method: POST
        request_headers:
          X-Amz-Target: AWSCognitoIdentityProviderService.InitiateAuth
          Content-Type: application/x-amz-json-1.1
        request_body:
          type: RequestBodyJsonObject
          value:
            AuthFlow: USER_PASSWORD_AUTH
            AuthParameters:
              USERNAME: '{{ config[''username''] }}'
              PASSWORD: '{{ config[''password''] }}'
        authenticator:
          type: SessionTokenAuthenticator
          login_requester:
            type: HttpRequester
            url: https://app.avniproject.org/idp-details
            http_method: GET
          session_token_path:
          - cognito
          - clientId
          expiration_duration: P1D
          request_authentication:
            type: ApiKey
            inject_into:
              type: RequestOption
              inject_into: body_json
              field_name: ClientId
        error_handler:
          type: DefaultErrorHandler
          response_filters:
          - type: HttpResponseFilter
            action: FAIL
            failure_type: config_error
            http_codes:
            - 400
            error_message: 'Avni login failed: check your username and password.'
      session_token_path:
      - AuthenticationResult
      - IdToken
      # Refresh before the shortest configurable Cognito ID-token lifetime.
      expiration_duration: PT4M
      request_authentication:
        type: ApiKey
        inject_into:
          type: RequestOption
          inject_into: header
          field_name: auth-token
  retriever:
    type: SimpleRetriever
    record_selector:
      $ref: '#/definitions/selector'
    paginator:
      type: DefaultPaginator
      page_size_option:
        type: RequestOption
        inject_into: request_parameter
        field_name: size
      pagination_strategy:
        type: PageIncrement
        page_size: 100
      page_token_option:
        type: RequestOption
        inject_into: request_parameter
        field_name: page
    requester:
      $ref: '#/definitions/requester'
  incremental_base:
    type: DatetimeBasedCursor
    cursor_field: last_modified_at
    datetime_format: '%Y-%m-%dT%H:%M:%S.%fZ'
    start_datetime:
      datetime: '{{ config[''start_date''] }}'
      datetime_format: '%Y-%m-%dT%H:%M:%S.%fZ'
    start_time_option:
      field_name: lastModifiedDateTime
      inject_into: request_parameter
  transformations_base:
  - type: AddFields
    fields:
    - path:
      - last_modified_at
      value: '{{ record[''audit''][''Last modified at''] }}'
  base_stream:
    type: DeclarativeStream
    retriever:
      $ref: '#/definitions/retriever'
  subjects_stream:
    $ref: '#/definitions/base_stream'
    name: subjects
    primary_key: ID
    incremental_sync:
      $ref: '#/definitions/incremental_base'
    transformations:
      $ref: '#/definitions/transformations_base'
    retriever:
      $ref: '#/definitions/retriever'
      requester:
        $ref: '#/definitions/requester'
        path: /subjects
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/draft-07/schema#
        type: object
        additionalProperties: true
        properties:
          ID:
            type: string
          External ID:
            type:
            - 'null'
            - string
          Voided:
            type: boolean
          Subject type:
            type:
            - 'null'
            - string
          Registration location:
            type:
            - 'null'
            - object
            additionalProperties: true
            properties:
              X:
                type:
                - 'null'
                - number
              Y:
                type:
                - 'null'
                - number
                example: 74.7364501
          Registration date:
            type:
            - 'null'
            - string
          location:
            type:
            - 'null'
            - object
            additionalProperties: true
          relatives:
            type:
            - 'null'
            - array
            items:
              type: object
              additionalProperties: true
              properties:
                Voided:
                  type: boolean
                Relationship type:
                  type:
                  - 'null'
                  - string
                Relative ID:
                  type:
                  - 'null'
                  - string
                Relative external ID:
                  type:
                  - 'null'
                  - string
                Enter date:
                  type:
                  - 'null'
                  - string
                Exit date:
                  type:
                  - 'null'
                  - string
          observations:
            type:
            - 'null'
            - object
            additionalProperties: true
          encounters:
            type:
            - 'null'
            - array
            items:
              type:
              - 'null'
              - string
              format: uuid
          enrolments:
            type:
            - 'null'
            - array
            items:
              type:
              - 'null'
              - string
              format: uuid
          last_modified_at:
            type: string
            format: YYYY-MM-DDTHH:mm:ss.sssZ
          catchments:
            type:
            - 'null'
            - array
            items:
              type:
              - 'null'
              - string
          audit:
            type:
            - 'null'
            - object
            additionalProperties: true
            properties:
              Created at:
                type:
                - 'null'
                - string
                format: YYYY-MM-DDTHH:mm:ss.sssZ
              Last modified at:
                type:
                - 'null'
                - string
                format: YYYY-MM-DDTHH:mm:ss.sssZ
              Created by:
                type:
                - 'null'
                - string
              Last modified by:
                type:
                - 'null'
                - string
          Groups:
            type:
            - 'null'
            - array
            items:
              type:
              - 'null'
              - string
