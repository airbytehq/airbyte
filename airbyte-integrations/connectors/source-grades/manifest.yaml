# Generated by scripts/build-manifest.mjs from src/manifest.base.yaml and the Grades.com OpenAPI spec.
# Do not edit by hand.
version: 7.45.0

type: DeclarativeSource

description: >-
  Sync your Grades.com businesses, reviews from every connected review site, replies, daily review stats,
  the review agent's queue, AI Reputation history, review radar mentions and review requests into your warehouse.

# locations needs companies:read; review_stats needs reviews:read, so a key without either scope fails the
# connection test with the scope text instead of failing later in the sync.
check:
  type: CheckStream
  stream_names:
    - locations
    - review_stats

definitions:
  authenticator:
    type: BearerAuthenticator
    api_token: "{{ config['api_key'] | trim }}"

  # 401 and missing scopes are configuration errors; 429 waits for Retry-After (120 requests/minute per key);
  # 5xx retries with exponential backoff.
  error_handler:
    type: DefaultErrorHandler
    max_retries: 8
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 401
        error_message: >-
          Grades.com refused the API key (unknown, expired or revoked). Create a key in my.grades.com > Connect your
          AI > API keys with the scopes reviews:read and companies:read.
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 403
        predicate: "{{ 'required_scopes' in response }}"
        error_message: >-
          The API key lacks a scope this stream needs. Give the key the scopes reviews:read and companies:read.
      - type: HttpResponseFilter
        action: RATE_LIMITED
        http_codes:
          - 429
      - type: HttpResponseFilter
        action: RETRY
        http_codes:
          - 500
          - 502
          - 503
          - 504

  # Per-business streams skip a business instead of failing the sync when the business's plan does not include the
  # data (402), the caller's role is not enough (403 without a scope problem, e.g. review requests need an admin) or
  # the business is a location whose group view lives on its HQ (409 not_an_hq).
  company_error_handler:
    type: DefaultErrorHandler
    max_retries: 8
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 401
        error_message: >-
          Grades.com refused the API key (unknown, expired or revoked). Create a key in my.grades.com > Connect your
          AI > API keys with the scopes reviews:read and companies:read.
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 403
        predicate: "{{ 'required_scopes' in response }}"
        error_message: >-
          The API key lacks a scope this stream needs. Give the key the scopes reviews:read and companies:read.
      - type: HttpResponseFilter
        action: IGNORE
        http_codes:
          - 402
          - 403
          - 409
        error_message: "Skipped one business for this stream (plan, role or group view)."
      - type: HttpResponseFilter
        action: RATE_LIMITED
        http_codes:
          - 429
      - type: HttpResponseFilter
        action: RETRY
        http_codes:
          - 500
          - 502
          - 503
          - 504

  requester:
    type: HttpRequester
    http_method: GET
    authenticator:
      $ref: "#/definitions/authenticator"
    error_handler:
      $ref: "#/definitions/error_handler"
    request_headers:
      Accept: application/json

  company_requester:
    type: HttpRequester
    http_method: GET
    authenticator:
      $ref: "#/definitions/authenticator"
    error_handler:
      $ref: "#/definitions/company_error_handler"
    request_headers:
      Accept: application/json

  # The v1 cursor: pass meta.next_cursor back as `cursor` until it is null.
  cursor_paginator:
    type: DefaultPaginator
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: limit
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: cursor
    pagination_strategy:
      type: CursorPagination
      page_size: 100
      cursor_value: "{{ response.get('meta', {}).get('next_cursor') }}"
      stop_condition: "{{ not response.get('meta', {}).get('next_cursor') }}"

  data_selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path:
        - data

  add_company_uuid:
    type: AddFields
    fields:
      - type: AddedFieldDefinition
        path:
          - company_uuid
        value: "{{ stream_partition.company_uuid }}"

  locations_stream:
    type: DeclarativeStream
    name: locations
    primary_key:
      - uuid
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/requester"
        url: "https://app.grades.com/api/v1/companies"
      paginator:
        $ref: "#/definitions/cursor_paginator"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
        record_filter:
          type: RecordFilter
          condition: "{{ not config.get('company_uuids') or record['uuid'] in config.get('company_uuids') }}"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/locations"

  # Every per-business stream runs once per business the key reaches (agency keys: every client location).
  company_partitions:
    type: SubstreamPartitionRouter
    parent_stream_configs:
      - type: ParentStreamConfig
        stream:
          $ref: "#/definitions/locations_stream"
        parent_key: uuid
        partition_field: company_uuid

  # The daily-stats streams send one request per business and day. Their businesses come from a probe: one request
  # for today per business, to the same endpoint. A key without the scope fails the stream on that first request
  # (one error, not one per day); a business the endpoint skips (plan, role, location under an HQ) gets no days.
  review_stats_daily_probe:
    type: DeclarativeStream
    name: review_stats_daily_probe
    primary_key:
      - company_uuid
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/locations/stats"
        request_parameters:
          from: "{{ now_utc().strftime('%Y-%m-%d') }}"
          to: "{{ now_utc().strftime('%Y-%m-%d') }}"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/definitions/probe_schema"

  review_request_stats_daily_probe:
    type: DeclarativeStream
    name: review_request_stats_daily_probe
    primary_key:
      - company_uuid
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/review-requests/stats"
        request_parameters:
          from: "{{ now_utc().strftime('%Y-%m-%d') }}"
          to: "{{ now_utc().strftime('%Y-%m-%d') }}"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/definitions/probe_schema"

  probe_schema:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    additionalProperties: true
    properties:
      company_uuid:
        type: string

  review_stats_daily_partitions:
    type: SubstreamPartitionRouter
    parent_stream_configs:
      - type: ParentStreamConfig
        stream:
          $ref: "#/definitions/review_stats_daily_probe"
        parent_key: company_uuid
        partition_field: company_uuid

  review_request_stats_daily_partitions:
    type: SubstreamPartitionRouter
    parent_stream_configs:
      - type: ParentStreamConfig
        stream:
          $ref: "#/definitions/review_request_stats_daily_probe"
        parent_key: company_uuid
        partition_field: company_uuid

  utc_cursor_formats:
    - "%Y-%m-%dT%H:%M:%SZ"
    - "%Y-%m-%dT%H:%M:%S.%fZ"
    - "%Y-%m-%dT%H:%M:%S%z"

  start_datetime:
    type: MinMaxDatetime
    datetime: "{{ config.get('start_date') or '2005-01-01' }}T00:00:00Z"
    datetime_format: "%Y-%m-%dT%H:%M:%SZ"

  now_datetime:
    type: MinMaxDatetime
    datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
    datetime_format: "%Y-%m-%dT%H:%M:%SZ"

  stats_start_date:
    type: MinMaxDatetime
    datetime: "{{ config.get('stats_start_date') or day_delta(-90, format='%Y-%m-%d') }}"
    datetime_format: "%Y-%m-%d"

  # Day windows end before this date, so tomorrow = up to and including today.
  today:
    type: MinMaxDatetime
    datetime: "{{ day_delta(1, format='%Y-%m-%d') }}"
    datetime_format: "%Y-%m-%d"

streams:
  - $ref: "#/definitions/locations_stream"

  - type: DeclarativeStream
    name: sources
    primary_key:
      - company_uuid
      - driver
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/sources"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/sources"

  # Reviews, removed ones included (removed_at set). Incremental on the publish date (the only date filter the API
  # has); the lookback window re-reads recent reviews so replies, edits and removals on them are picked up.
  - type: DeclarativeStream
    name: reviews
    primary_key:
      - uuid
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/reviews"
        request_parameters:
          sort: oldest
          include_removed: "true"
          start_date: "{{ format_datetime(stream_interval.start_time, '%Y-%m-%d') }}"
          end_date: "{{ format_datetime(stream_interval.end_time, '%Y-%m-%d') }}"
      paginator:
        $ref: "#/definitions/cursor_paginator"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
      # include_review_text off: text and title are dropped from the record (null columns in the destination).
      - type: AddFields
        condition: "{{ not config.get('include_review_text', True) }}"
        fields:
          - type: AddedFieldDefinition
            path:
              - text
            value: "{{ None }}"
          - type: AddedFieldDefinition
            path:
              - title
            value: "{{ None }}"
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: published_at
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      cursor_datetime_formats:
        $ref: "#/definitions/utc_cursor_formats"
      start_datetime:
        $ref: "#/definitions/start_datetime"
      end_datetime:
        $ref: "#/definitions/now_datetime"
      step: P1Y
      cursor_granularity: PT1S
      lookback_window: "P{{ config.get('lookback_days', 30) }}D"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/reviews"

  # The business's public replies: one row per review that has one.
  - type: DeclarativeStream
    name: review_replies
    primary_key:
      - review_uuid
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/reviews"
        request_parameters:
          sort: oldest
          include_removed: "true"
          has_company_response: "true"
      paginator:
        $ref: "#/definitions/cursor_paginator"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - review_uuid
            value: "{{ record['uuid'] }}"
      - type: RemoveFields
        field_pointers:
          - - uuid
          - - text
          - - title
          - - author
          - - avatar
          - - hidden
          - - edited_at
          - - deleted_at
          - - removal_reason
          - - created_at
          - - tags
          - - sentiment
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/review_replies"

  # The current rating stats of each business (rated reviews only); append it to keep a history of snapshots.
  - type: DeclarativeStream
    name: review_stats
    primary_key:
      - company_uuid
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/stats"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - synced_at
            value: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/review_stats"

  # One row per business and day (in the HQ's timezone): reviews published that day, their average, replies and
  # unanswered negatives. Read through the group view, so an HQ returns every location; a location under an HQ is
  # skipped on its own (409 not_an_hq) and comes with its HQ when the key reaches the HQ as a group.
  - type: DeclarativeStream
    name: review_stats_daily
    primary_key:
      - company_uuid
      - date
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/locations/stats"
        request_parameters:
          from: "{{ stream_interval.start_time }}"
          to: "{{ stream_interval.start_time }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
            - locations
      partition_router:
        $ref: "#/definitions/review_stats_daily_partitions"
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - date
            value: "{{ stream_interval.start_time }}"
          - type: AddedFieldDefinition
            path:
              - company_uuid
            value: "{{ record['location']['uuid'] }}"
          - type: AddedFieldDefinition
            path:
              - group_company_uuid
            value: "{{ stream_partition.company_uuid }}"
      # All-time and "now" figures of the group view (review_stats and locations carry them), not per day.
      - type: RemoveFields
        field_pointers:
          - - reviews_total
          - - rating_average
          - - pending_agent_actions
          - - rank
          - - previous_new_reviews
          - - previous_rating_average
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: date
      datetime_format: "%Y-%m-%d"
      start_datetime:
        $ref: "#/definitions/stats_start_date"
      end_datetime:
        $ref: "#/definitions/today"
      step: P1D
      cursor_granularity: P1D
      lookback_window: P2D
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/review_stats_daily"

  # The review agent's drafts and their outcomes. No date filter in the API: every sync reads the list and emits
  # the actions updated since the last sync.
  - type: DeclarativeStream
    name: agent_actions
    primary_key:
      - uuid
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/agent/actions"
      paginator:
        $ref: "#/definitions/cursor_paginator"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
      - type: AddFields
        condition: "{{ not config.get('include_review_text', True) and record.get('review') }}"
        fields:
          - type: AddedFieldDefinition
            path:
              - review
              - text
            value: "{{ None }}"
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      is_client_side_incremental: true
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      cursor_datetime_formats:
        $ref: "#/definitions/utc_cursor_formats"
      start_datetime:
        $ref: "#/definitions/start_datetime"
      end_datetime:
        $ref: "#/definitions/now_datetime"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/agent_actions"

  # AI Reputation: one row per check and assistant (sentiment, rating accuracy, mention). Incremental on run_at
  # (`since`); the API returns the newest 100 rows per assistant, so a first sync covers at most that many.
  - type: DeclarativeStream
    name: ai_reputation_history
    primary_key:
      - company_uuid
      - run_id
      - engine
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/radar/ai-perception"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
            - history
      partition_router:
        - $ref: "#/definitions/company_partitions"
        - type: ListPartitionRouter
          cursor_field: engine
          values:
            - gemini
            - openai
            - perplexity
            - anthropic
          request_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: engine
    transformations:
      - $ref: "#/definitions/add_company_uuid"
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: run_at
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      cursor_datetime_formats:
        $ref: "#/definitions/utc_cursor_formats"
      start_datetime:
        $ref: "#/definitions/start_datetime"
      end_datetime:
        $ref: "#/definitions/now_datetime"
      start_time_option:
        type: RequestOption
        inject_into: request_parameter
        field_name: since
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/ai_reputation_history"

  # The latest AI Reputation answer of each assistant, with its text, cited URLs and rating quotes. Every probe has
  # its own id, so append + dedup keeps every answer ever seen.
  - type: DeclarativeStream
    name: ai_reputation_probes
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/radar/ai-perception"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
            - probes
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/ai_reputation_probes"

  # Review radar: pages on the web and in AI answers that mention the business (dismissed ones included).
  - type: DeclarativeStream
    name: radar_mentions
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/radar/mentions"
      paginator:
        $ref: "#/definitions/cursor_paginator"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        - $ref: "#/definitions/company_partitions"
        - type: ListPartitionRouter
          cursor_field: status
          values:
            - new
            - seen
            - dismissed
          request_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: status
    transformations:
      - $ref: "#/definitions/add_company_uuid"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/radar_mentions"

  - type: DeclarativeStream
    name: review_flags
    primary_key:
      - uuid
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/flags"
      paginator:
        $ref: "#/definitions/cursor_paginator"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/review_flags"

  # Review requests (admins of the business; other roles are skipped).
  - type: DeclarativeStream
    name: review_requests
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/review-requests"
      paginator:
        $ref: "#/definitions/cursor_paginator"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/review_requests"

  - type: DeclarativeStream
    name: review_request_contacts
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/review-requests/contacts"
      paginator:
        $ref: "#/definitions/cursor_paginator"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/review_request_contacts"

  - type: DeclarativeStream
    name: review_request_campaigns
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/review-requests/campaigns"
        request_parameters:
          include_archived: "1"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/review_request_campaigns"

  # Opt-out history (Grades.com never deletes it).
  - type: DeclarativeStream
    name: review_request_opt_outs
    primary_key:
      - company_uuid
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/review-requests/opt-outs"
      paginator:
        $ref: "#/definitions/cursor_paginator"
      record_selector:
        $ref: "#/definitions/data_selector"
      partition_router:
        $ref: "#/definitions/company_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/review_request_opt_outs"

  # One row per business and day: review requests created that day and what came of them so far.
  - type: DeclarativeStream
    name: review_request_stats_daily
    primary_key:
      - company_uuid
      - date
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/company_requester"
        url: "https://app.grades.com/api/v1/companies/{{ stream_partition.company_uuid }}/review-requests/stats"
        request_parameters:
          from: "{{ stream_interval.start_time }}"
          to: "{{ stream_interval.start_time }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
            - totals
      partition_router:
        $ref: "#/definitions/review_request_stats_daily_partitions"
    transformations:
      - $ref: "#/definitions/add_company_uuid"
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - date
            value: "{{ stream_interval.start_time }}"
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: date
      datetime_format: "%Y-%m-%d"
      start_datetime:
        $ref: "#/definitions/stats_start_date"
      end_datetime:
        $ref: "#/definitions/today"
      step: P1D
      cursor_granularity: P1D
      lookback_window: P7D
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/review_request_stats_daily"

spec:
  type: Spec
  documentation_url: https://docs.airbyte.com/integrations/sources/grades
  connection_specification:
    type: object
    title: Grades.com Source Spec
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
    properties:
      api_key:
        type: string
        title: API Key
        description: >-
          A Grades.com secret API key (starts with gk_live_). Create one in my.grades.com > Connect your AI >
          API keys with the scopes reviews:read and companies:read. An agency key reaches every client location.
        airbyte_secret: true
        order: 0
      company_uuids:
        type: array
        title: Businesses
        description: >-
          Optional: the uuids of the businesses to sync (the locations stream lists them). Empty = every business
          the key reaches.
        items:
          type: string
        order: 1
      start_date:
        type: string
        title: Start Date
        description: >-
          Optional: sync reviews published on or after this date (YYYY-MM-DD). Default 2005-01-01 (all reviews).
        format: date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2024-01-01"
        order: 2
      stats_start_date:
        type: string
        title: Daily Stats Start Date
        description: >-
          Optional: first day of the daily stats streams (one request per business and day). Default 90 days ago.
        format: date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2026-01-01"
        order: 3
      include_review_text:
        type: boolean
        title: Include Review Text
        description: >-
          Sync the text and title of each review (on by default: it is your own data). Off removes them from reviews
          and from the review agent's queue.
        default: true
        order: 4
      lookback_days:
        type: integer
        title: Lookback Window (Days)
        description: >-
          Incremental syncs re-read reviews published this many days before the last sync, so new replies, edits and
          removals on recent reviews arrive. Default 30.
        default: 30
        minimum: 0
        maximum: 365
        order: 5
    additionalProperties: true

api_budget:
  type: HTTPAPIBudget
  ratelimit_remaining_header: X-RateLimit-Remaining
  ratelimit_reset_header: Retry-After
  status_codes_for_ratelimit_hit:
    - 429
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 110
          interval: PT1M
      matchers: []

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: 2
  max_concurrency: 4

