metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - "www.googleapis.com"
      - "oauth2.googleapis.com"
  maxSecondsBetweenMessages: 3600
  suggestedStreams:
    streams:
      - events
      - calendarlist
      - settings
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  releases:
    breakingChanges:
      1.0.0:
        message: "Version 1.0.0 changes three streams. `events`: the primary key changes from `id` to `[calendar_id, id]`, because Google keeps event IDs unique per calendar only; `calendar_id` now holds the calendar's real ID, so connections configured with the alias `primary` get the account's email address; and date and date-time fields are typed as dates and timestamps. `calendars` now returns calendar resources instead of calendar-list entries. `colors` gets the primary key `kind`, and its `updated` field is typed as a timestamp. Leaving Calendar Id empty now reads every calendar in the account's calendar list, including hidden ones. After upgrading, refresh the source schema and clear the affected streams. See https://docs.airbyte.com/integrations/sources/google-calendar-migrations#upgrading-to-100"
        upgradeDeadline: "2026-11-07"
        deadlineAction: "disable"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - "events"
              - "calendars"
              - "colors"
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-google-calendar
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.33.0@sha256:3343cc05b79b9a3c07fa90152bd5348da7154b44f63521857bd2a745883d85cd
  connectorSubtype: api
  connectorType: source
  definitionId: c01b6259-bdf4-45ff-bcd5-66424cd2f18b
  dockerImageTag: 1.0.0
  dockerRepository: airbyte/source-google-calendar
  githubIssueLabel: source-google-calendar
  icon: icon.svg
  license: ELv2
  name: Google Calendar
  releaseDate: 2024-10-06
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/google-calendar
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: Google Calendar API reference
      url: https://developers.google.com/calendar/api/v3/reference
      type: api_reference
    - title: Google Calendar authentication
      url: https://developers.google.com/calendar/api/guides/auth
      type: authentication_guide
    - title: Google Calendar quotas
      url: https://developers.google.com/calendar/api/guides/quota
      type: rate_limits
    - title: Google Workspace Status
      url: https://www.google.com/appsstatus/
      type: status_page
