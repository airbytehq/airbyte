version: 5.10.2

type: DeclarativeSource

description: Solves https://github.com/airbytehq/airbyte/issues/45995

check:
  type: CheckStream
  stream_names:
    - colors

definitions:
  streams:
    colors:
      type: DeclarativeStream
      name: colors
      primary_key:
        - calendar
        - event
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: colors
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/colors"
    settings:
      type: DeclarativeStream
      name: settings
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: users/me/settings
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - items
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: pageToken
          pagination_strategy:
            type: CursorPagination
            cursor_value: "{{ response.get('nextPageToken') }}"
            stop_condition: "{{ response.get('nextPageToken') is not defined }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/settings"
    calendarlist:
      type: DeclarativeStream
      name: calendarlist
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: users/me/calendarList
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - items
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: pageToken
          pagination_strategy:
            type: CursorPagination
            cursor_value: "{{ response.get('nextPageToken') }}"
            stop_condition: "{{ response.get('nextPageToken') is not defined }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/calendarlist"
    calendars:
      type: DeclarativeStream
      name: calendars
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: users/me/calendarList
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - items
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: pageToken
          pagination_strategy:
            type: CursorPagination
            cursor_value: "{{ response.get('nextPageToken') }}"
            stop_condition: "{{ response.get('nextPageToken') is not defined }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/calendars"
    events:
      type: DeclarativeStream
      name: events
      primary_key:
        - id
      incremental_sync:
        type: OpaqueTokenCursor
        token_path:
          - nextSyncToken
        cursor_field: updated
        token_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: syncToken
        completion_condition: "{{ response.get('nextPageToken') is not defined or response.get('nextPageToken') is none }}"
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: calendars/{{ config['calendarid'] }}/events
          http_method: GET
          error_handler:
            $ref: "#/definitions/events_error_handler"
          request_parameters:
            showDeleted: "true"
            maxResults: "2500"
            singleEvents: "false"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - items
          record_filter:
            type: RecordFilter
            condition: "{{ not config.get('start_date') or not record.get('updated') or str_to_datetime(record.get('updated')) >= str_to_datetime(config.get('start_date')) }}"
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: pageToken
          pagination_strategy:
            type: CursorPagination
            cursor_value: "{{ response.get('nextPageToken') }}"
            stop_condition: "{{ response.get('nextPageToken') is not defined }}"
      transformations:
        # Cancelled event stubs omit `updated`; stamp them so they replace the prior row under dedup.
        - type: AddFields
          condition: "{{ not record.get('updated') }}"
          fields:
            - path:
                - updated
              value: "{{ format_datetime(now_utc(), '%Y-%m-%dT%H:%M:%S.%fZ') }}"
        - type: AddFields
          fields:
            - path:
                - calendar_id
              value: "{{ config['calendarid'] }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/events"
  base_requester:
    type: HttpRequester
    url_base: https://www.googleapis.com/calendar/v3/
    authenticator:
      type: OAuthAuthenticator
      client_id: "{{ config['client_id'] }}"
      grant_type: refresh_token
      client_secret: "{{ config['client_secret'] }}"
      refresh_token: "{{ config['client_refresh_token_2'] }}"
      refresh_request_body: {}
      token_refresh_endpoint: https://oauth2.googleapis.com/token
    error_handler:
      type: CompositeErrorHandler
      error_handlers:
        - type: DefaultErrorHandler
          backoff_strategies:
            - type: ExponentialBackoffStrategy
              factor: 5
          response_filters:
            - type: HttpResponseFilter
              http_codes:
                - 401
              action: FAIL
              failure_type: config_error
              error_message: "Google rejected the OAuth credentials for the Calendar API. Re-authorize the connector or generate a new refresh token for the configured client."
            - type: HttpResponseFilter
              predicate: "{{ 'rateLimitExceeded' in response.get('error', {}) | string or 'userRateLimitExceeded' in response.get('error', {}) | string }}"
              action: RATE_LIMITED
            - type: HttpResponseFilter
              # 403 usageLimits errors that do not clear within the sync (project or user quota).
              # Excludes the body's 429 status so a 429 with the same reason still goes to RATE_LIMITED; a string
              # or missing code is tolerated. http_codes would OR with the predicate and catch every 403, and the
              # CDK's `string` filter wraps non-strings in triple quotes, so the code is compared as int or str.
              predicate: "{{ response.get('error', {}).get('code') not in (429, '429') and ('quotaExceeded' in response.get('error', {}) | string or 'dailyLimitExceeded' in response.get('error', {}) | string) }}"
              action: FAIL
              failure_type: transient_error
              error_message: "The Google Calendar API quota for this project or user is exhausted. The sync will succeed once the quota resets; no configuration change is needed."
            - type: HttpResponseFilter
              http_codes:
                - 403
              action: FAIL
              failure_type: config_error
              error_message: "The authorized Google account lacks access to the configured calendar or the Calendar API is disabled."
            - type: HttpResponseFilter
              http_codes:
                - 404
              action: FAIL
              failure_type: config_error
              error_message: "The calendar configured in \"Calendar Id\" was not found by the Google Calendar API. Check the ID in the calendar's settings, or use 'primary'."
            - type: HttpResponseFilter
              # 410 with reason `deleted` (calendar removed) or `fullSyncRequired` (only possible with
              # syncToken, which this connector does not send): the user must act, not wait.
              # The `string` filter JSON-encodes the body, so match the JSON form of the reason.
              predicate: "{{ '\\\"reason\\\": \\\"deleted\\\"' in response.get('error', {}) | string or 'fullSyncRequired' in response.get('error', {}) | string }}"
              action: FAIL
              failure_type: config_error
              error_message: "The calendar configured in \"Calendar Id\" no longer exists or requires a full re-sync. Check the ID, then reset the events stream."
            - type: HttpResponseFilter
              # 410 updatedMinTooLongAgo: Google's window moved under a cursor that was within our
              # margin. Nothing in the configuration causes it; the next sync clears the stale cursor
              # and re-reads, so classify as transient rather than blaming the user.
              http_codes:
                - 410
              action: FAIL
              failure_type: transient_error
              error_message: "Google Calendar rejected the saved sync position of the events stream as too old. The next sync re-reads the calendar automatically; reset the events stream to do it now."
            - type: HttpResponseFilter
              http_codes:
                - 429
              action: RATE_LIMITED
            - type: HttpResponseFilter
              http_codes:
                - 500
                - 502
                - 503
                - 504
              action: RETRY

  events_error_handler:
    type: CompositeErrorHandler
    error_handlers:
      - type: DefaultErrorHandler
        backoff_strategies:
          - type: ExponentialBackoffStrategy
            factor: 5
        response_filters:
          - type: HttpResponseFilter
            http_codes:
              - 401
            action: FAIL
            failure_type: config_error
            error_message: "Google rejected the OAuth credentials for the Calendar API. Re-authorize the connector or generate a new refresh token for the configured client."
          - type: HttpResponseFilter
            predicate: "{{ 'rateLimitExceeded' in response.get('error', {}) | string or 'userRateLimitExceeded' in response.get('error', {}) | string }}"
            action: RATE_LIMITED
          - type: HttpResponseFilter
            # 403 usageLimits errors that do not clear within the sync (project or user quota).
            # Excludes the body's 429 status so a 429 with the same reason still goes to RATE_LIMITED; a string
            # or missing code is tolerated. http_codes would OR with the predicate and catch every 403, and the
            # CDK's `string` filter wraps non-strings in triple quotes, so the code is compared as int or str.
            predicate: "{{ response.get('error', {}).get('code') not in (429, '429') and ('quotaExceeded' in response.get('error', {}) | string or 'dailyLimitExceeded' in response.get('error', {}) | string) }}"
            action: FAIL
            failure_type: transient_error
            error_message: "The Google Calendar API quota for this project or user is exhausted. The sync will succeed once the quota resets; no configuration change is needed."
          - type: HttpResponseFilter
            http_codes:
              - 403
            action: FAIL
            failure_type: config_error
            error_message: "The authorized Google account lacks access to the configured calendar or the Calendar API is disabled."
          - type: HttpResponseFilter
            http_codes:
              - 404
            action: FAIL
            failure_type: config_error
            error_message: "The calendar configured in \"Calendar Id\" was not found by the Google Calendar API. Check the ID in the calendar's settings, or use 'primary'."
          - type: HttpResponseFilter
            # The `string` filter JSON-encodes the body, so match the JSON form of the reason.
            predicate: "{{ response.get('error', {}).get('code') in (410, '410') and 'fullSyncRequired' in response.get('error', {}) | string }}"
            action: RESET_OPAQUE_TOKEN
            error_message: "Google Calendar rejected the saved events sync token and requires a full re-read."
          - type: HttpResponseFilter
            predicate: "{{ response.get('error', {}).get('code') in (410, '410') and '\\\"reason\\\": \\\"deleted\\\"' in response.get('error', {}) | string }}"
            action: FAIL
            failure_type: config_error
            error_message: "The calendar configured in \"Calendar Id\" no longer exists. Check the ID or use 'primary'."
          - type: HttpResponseFilter
            http_codes:
              - 429
            action: RATE_LIMITED
          - type: HttpResponseFilter
            http_codes:
              - 500
              - 502
              - 503
              - 504
            action: RETRY

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: "{{ config.get('num_workers', 3) }}"
  max_concurrency: 10

api_budget:
  type: HTTPAPIBudget
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 500
          interval: PT1M
      matchers: []

streams:
  - $ref: "#/definitions/streams/colors"
  - $ref: "#/definitions/streams/settings"
  - $ref: "#/definitions/streams/calendarlist"
  - $ref: "#/definitions/streams/calendars"
  - $ref: "#/definitions/streams/events"

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - client_id
      - client_secret
      - client_refresh_token_2
      - calendarid
    properties:
      client_id:
        type: string
        order: 0
        title: Client ID
        description: The client ID of the Google Cloud OAuth 2.0 application used to access the Calendar API.
        airbyte_secret: true
      client_secret:
        type: string
        order: 1
        title: Client secret
        description: The client secret of the Google Cloud OAuth 2.0 application.
        airbyte_secret: true
      client_refresh_token_2:
        type: string
        order: 2
        title: Refresh token
        description: A refresh token obtained for the OAuth application with the Calendar API scope. It is exchanged for an access token at the start of every sync.
        airbyte_secret: true
      calendarid:
        type: string
        order: 3
        title: Calendar Id
        description: The ID of the calendar to sync events from, found in the calendar's settings in Google Calendar (for the primary calendar this is the account's email address). The alias 'primary' also works, but it is stored verbatim in the events' calendar_id column, so prefer the real ID when that column should join to calendarlist.
      start_date:
        type: string
        order: 4
        title: Start date
        format: date-time
        description: Only sync events last modified on or after this date. Events without an updated timestamp are always included. A recurring series counts as one event whose modification time is its last edit, so a start date also drops series that have not been edited since then.
      num_workers:
        type: integer
        order: 5
        title: Number of concurrent workers
        description: The number of worker threads used to fetch data concurrently.
        minimum: 1
        maximum: 10
        default: 3
    additionalProperties: true


