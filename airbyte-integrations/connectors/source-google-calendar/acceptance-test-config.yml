# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-google-calendar:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
        # Spec moved credentials under a `credentials` object in 0.2.0; a runtime
        # ConfigMigration rewrites legacy flat configs, but the static spec comparison
        # flags the change, so backward-compat checks are disabled for that version.
        backward_compatibility_tests_config:
          disable_for_version: "0.2.0"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog_full_refresh.json"
        empty_streams:
          - name: "events"
            bypass_reason: "Test calendar has no events"
          - name: "acl"
            bypass_reason: "Sandbox account owns no shared calendars; ACL returns no entries"
          - name: "freebusy"
            bypass_reason: "Test calendar has no busy blocks in the query window"
  incremental:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        future_state:
          future_state_path: "integration_tests/abnormal_state.json"
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog_full_refresh.json"
