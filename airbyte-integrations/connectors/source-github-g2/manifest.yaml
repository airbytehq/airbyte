  graphql_reduce_page_size_filter:
    type: HttpResponseFilter
    http_codes:
    - 502
    - 504
    action: REDUCE_PAGE_SIZE
    failure_type: transient_error
    error_message: GitHub could not resolve the GraphQL query within its deadline. Retrying the same page with a smaller page size.
  graphql_body_not_found_skip_filter:
    type: HttpResponseFilter
    predicate: "{{ response is mapping\n   and ((response.get('errors') or []) | selectattr('type', 'defined')\n        | selectattr('type', 'in',\
      \ ['NOT_FOUND', 'FORBIDDEN']) | list | length) > 0 }}"
    action: IGNORE
    error_message: GitHub could not resolve this repository or denied access to it (GraphQL NOT_FOUND or FORBIDDEN). The repository may have been
      deleted or renamed, or the token may be missing the `repo` scope or SAML SSO authorization for it. Skipping it.
  graphql_body_rate_limited_filter:
    type: HttpResponseFilter
    predicate: "{{ response is mapping\n   and ((response.get('errors') or []) | selectattr('type', 'defined')\n        | selectattr('type', 'equalto',\
      \ 'RATE_LIMITED') | list | length) > 0 }}"
    action: RATE_LIMITED
    error_message: GitHub GraphQL rate limit hit. Waiting for the rate limit window to reset before retrying.
  graphql_body_error_filter:
    type: HttpResponseFilter
    predicate: '{{ response is mapping and ((response.get(''errors'') or []) | length) > 0 }}'
    action: RETRY
    failure_type: transient_error
    error_message: GitHub GraphQL returned errors in the response body. Retrying.
  graphql_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      $ref: '#/definitions/rate_limit_backoff_strategies'
    response_filters:
    - $ref: '#/definitions/graphql_body_rate_limited_filter'
    - $ref: '#/definitions/graphql_reduce_page_size_filter'
    - $ref: '#/definitions/graphql_body_not_found_skip_filter'
    - $ref: '#/definitions/graphql_body_error_filter'
    - $ref: '#/definitions/success_filter'
    - $ref: '#/definitions/retry_after_rate_limit_filter'
    - $ref: '#/definitions/primary_rate_limit_filter'
    - $ref: '#/definitions/secondary_rate_limit_filter'
    - $ref: '#/definitions/exhausted_quota_filter'
    - $ref: '#/definitions/not_found_skip_filter'
    - $ref: '#/definitions/forbidden_skip_filter'
    - $ref: '#/definitions/gone_fail_filter'
  graphql_requester:
    $ref: '#/definitions/requester_base'
    http_method: POST
    path: graphql
    error_handler:
      $ref: '#/definitions/graphql_error_handler'
  graphql_page_size_reduction:
    type: PageSizeReduction
    reduction_factor: 2
    minimum_page_size: 1
    max_attempts: 5
    reset_policy: NEVER
    backoff_seconds: 10
    retries_at_minimum_page_size: 3
    failure_message: GitHub kept rejecting this query at every page size the connector asked for, so a smaller page is not what it is waiting
      for. This is usually a transient condition on GitHub's side and the next sync succeeds; if one repository fails this way on every attempt,
      removing it from the source configuration lets the others sync.
  graphql_paginator:
    type: DefaultPaginator
    page_size_option:
      type: RequestOption
      inject_into: body_json
      field_path:
      - variables
      - first
    page_token_option:
      type: RequestOption
      inject_into: body_json
      field_path:
      - variables
      - after
  graphql_large_stream_page_size: 10
  releases_stream:
    type: DeclarativeStream
    name: releases
    primary_key: id
    retriever:
      type: SimpleRetriever
      page_size_reduction:
        $ref: '#/definitions/graphql_page_size_reduction'
      requester:
        $ref: '#/definitions/graphql_requester'
        request_body:
          type: RequestBodyJsonObject
          value:
            query: |
              query Releases($owner: String!, $name: String!, $first: Int!, $after: String) {
                repository(owner: $owner, name: $name) {
                  releases(first: $first, after: $after, orderBy: {field: CREATED_AT, direction: DESC}) {
                    nodes {
                      node_id: id
                      id: databaseId
                      name
                      tag_name: tagName
                      created_at: createdAt
                      published_at: publishedAt
                      updated_at: updatedAt
                      draft: isDraft
                      prerelease: isPrerelease
                      body: description
                      body_html: descriptionHTML
                      html_url: url
                      tagCommit { target_commitish: oid }
                      author {
