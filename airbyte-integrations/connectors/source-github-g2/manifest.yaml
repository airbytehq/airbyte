version: 7.28.3
type: DeclarativeSource
definitions:
  wildcard_organizations: '{{ config.get(''repositories'', []) | map(''regex_search'', ''^([^/]+)/[^/]*[*]'') | select | unique | list }}'
  wildcard_repository_filter: "{{ (config.get('repositories', []) | map('regex_search', '^(.*[*].*)$') | select | list | length) == 0\n   or record['full_name']\
    \ | regex_search('^((' ~ (config.get('repositories', []) | map('regex_search', '^(.*[*].*)$') | select | map('replace', '*', '.*') | join(')|('))\
    \ ~ '))') }}"
  large_stream_page_size: '10'
  requester_base:
    type: HttpRequester
    url_base: '{{ config.get(''api_url'', ''https://api.github.com'').rstrip(''/'') }}'
    authenticator:
      type: RateLimitedMultipleTokenAuthenticator
      tokens: '{{ config.get(''access_token'', config.get(''credentials'', {}).get(''access_token'', config.get(''credentials'', {}).get(''personal_access_token'',
        ''''))) }}'
      token_delimiter: ','
      auth_method: token
      header: Authorization
      max_wait_time: PT{{ config['max_waiting_time'] if config.get('max_waiting_time') is not none else 120 }}M
      quota_status_source:
        type: QuotaStatusSource
        url: '{{ config.get(''api_url'', ''https://api.github.com'').rstrip(''/'') }}/rate_limit'
        request_headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: '2022-11-28'
        unavailable_status_codes:
        - 404
      quotas:
      - type: TokenQuota
        name: rest
        remaining_path:
        - resources
        - core
        - remaining
        reset_path:
        - resources
        - core
        - reset
        limit_path:
        - resources
        - core
        - limit
        remaining_header: X-RateLimit-Remaining
        reset_header: X-RateLimit-Reset
        limit_header: X-RateLimit-Limit
      - type: TokenQuota
        name: graphql
        remaining_path:
        - resources
        - graphql
        - remaining
        reset_path:
        - resources
        - graphql
        - reset
        limit_path:
        - resources
        - graphql
        - limit
        remaining_header: X-RateLimit-Remaining
        reset_header: X-RateLimit-Reset
        limit_header: X-RateLimit-Limit
        matchers:
        - type: HttpRequestRegexMatcher
          url_path_pattern: /graphql
    request_headers:
      User-Agent: PostmanRuntime/7.28.0
    error_handler:
      $ref: '#/definitions/strict_access_error_handler'
  repository_scoped_requester:
    $ref: '#/definitions/requester_base'
    http_method: GET
    request_parameters:
      per_page: '100'
    error_handler:
      $ref: '#/definitions/skip_inaccessible_error_handler'
  large_stream_repository_scoped_requester:
    $ref: '#/definitions/requester_base'
    http_method: GET
    request_parameters:
      per_page:
        $ref: '#/definitions/large_stream_page_size'
    error_handler:
      $ref: '#/definitions/skip_inaccessible_error_handler'
  rate_limit_backoff_strategies:
  - type: WaitTimeFromHeader
    header: Retry-After
    max_waiting_time_in_seconds: '{{ (config[''max_waiting_time''] if config.get(''max_waiting_time'') is not none else 120) * 60 + 1 }}'
  - type: WaitUntilTimeFromHeader
    header: X-RateLimit-Reset
    min_wait: 60
    max_waiting_time_in_seconds: '{{ (config[''max_waiting_time''] if config.get(''max_waiting_time'') is not none else 120) * 60 + 1 }}'
  success_filter:
    type: HttpResponseFilter
    http_codes:
    - 200
    action: SUCCESS
  unauthorized_fail_filter:
    type: HttpResponseFilter
    http_codes:
    - 401
    action: FAIL
    failure_type: config_error
    error_message: GitHub authentication failed (HTTP 401). Please verify your Personal Access Token or OAuth credentials are valid and not expired.
  retry_after_rate_limit_filter:
    type: HttpResponseFilter
    predicate: '{{ ''Retry-After'' in headers }}'
    action: RATE_LIMITED
    error_message: GitHub rate limit hit. Waiting for the rate limit window to reset before retrying.
  primary_rate_limit_filter:
    type: HttpResponseFilter
    error_message_contains: API rate limit exceeded
    action: RATE_LIMITED
    error_message: GitHub rate limit hit. Waiting for the rate limit window to reset before retrying.
  secondary_rate_limit_filter:
    type: HttpResponseFilter
    error_message_contains: secondary rate limit
    action: RATE_LIMITED
    error_message: GitHub secondary rate limit hit. Waiting before retrying.
  exhausted_quota_filter:
    type: HttpResponseFilter
    predicate: '{{ headers.get(''X-RateLimit-Remaining'') == ''0'' and response is mapping and response.get(''message'') is not none }}'
    action: RATE_LIMITED
    error_message: 'GitHub rate limit exhausted (X-RateLimit-Remaining: 0). Waiting for the rate limit window to reset before retrying.'
  disabled_feature_skip_filter:
    type: HttpResponseFilter
    predicate: "{{ response is mapping\n   and ((response.get('message') or '') | string\n        | regex_search('(?i)\\\\b(issues|projects|discussions)\
      \ (?:are|is) disabled\\\\b')) != '' }}"
    action: IGNORE
    error_message: 'Skipping this repository: GitHub reports the feature backing this stream is disabled for it (HTTP 410 Gone).'
  gone_fail_filter:
    type: HttpResponseFilter
    http_codes:
    - 410
    action: FAIL
    failure_type: config_error
    error_message: GitHub returned 410 Gone for an unexpected reason. The endpoint or API version may be deprecated. Verify the connector version
      is current and the endpoint is still supported.
  not_found_skip_filter:
    type: HttpResponseFilter
    http_codes:
    - 404
    action: IGNORE
    error_message: Syncing this stream isn't available for this organization/repository (HTTP 404). Skipping.
  forbidden_fail_filter:
    type: HttpResponseFilter
    http_codes:
    - 403
    action: FAIL
    failure_type: config_error
    error_message: 'GitHub denied access (HTTP 403). Your token may be missing required scopes (this connector typically needs: repo, read:org,
      read:user, read:project, workflow), or this organization may require SAML SSO authorization. See https://docs.github.com/en/rest/using-the-rest-api/troubleshooting-the-rest-api'
  forbidden_skip_filter:
    type: HttpResponseFilter
    http_codes:
    - 403
    action: IGNORE
    error_message: GitHub denied access to this repository or organization (HTTP 403). Your token may be missing required scopes (`read:org` for
      the organization-scoped streams, `repo` for repository data), or this organization may require SAML SSO authorization. Skipping it.
  empty_repository_skip_filter:
    type: HttpResponseFilter
    http_codes:
    - 409
    action: IGNORE
    error_message: Skipping this repository (HTTP 409 Conflict). The repository is likely empty (no commits).
  strict_access_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      $ref: '#/definitions/rate_limit_backoff_strategies'
    response_filters:
    - $ref: '#/definitions/success_filter'
    - $ref: '#/definitions/retry_after_rate_limit_filter'
    - $ref: '#/definitions/primary_rate_limit_filter'
    - $ref: '#/definitions/secondary_rate_limit_filter'
    - $ref: '#/definitions/exhausted_quota_filter'
    - $ref: '#/definitions/unauthorized_fail_filter'
    - $ref: '#/definitions/not_found_skip_filter'
    - $ref: '#/definitions/forbidden_fail_filter'
    - $ref: '#/definitions/gone_fail_filter'
  skip_inaccessible_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      $ref: '#/definitions/rate_limit_backoff_strategies'
    response_filters:
    - $ref: '#/definitions/success_filter'
    - $ref: '#/definitions/retry_after_rate_limit_filter'
    - $ref: '#/definitions/primary_rate_limit_filter'
    - $ref: '#/definitions/secondary_rate_limit_filter'
    - $ref: '#/definitions/exhausted_quota_filter'
    - $ref: '#/definitions/unauthorized_fail_filter'
    - $ref: '#/definitions/disabled_feature_skip_filter'
    - $ref: '#/definitions/not_found_skip_filter'
    - $ref: '#/definitions/forbidden_skip_filter'
    - $ref: '#/definitions/empty_repository_skip_filter'
    - $ref: '#/definitions/gone_fail_filter'
  comments_error_handler:
    $ref: '#/definitions/skip_inaccessible_error_handler'
    max_retries: 7
  resolve_explicit_repository_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      $ref: '#/definitions/rate_limit_backoff_strategies'
    response_filters:
    - $ref: '#/definitions/success_filter'
    - $ref: '#/definitions/retry_after_rate_limit_filter'
    - $ref: '#/definitions/primary_rate_limit_filter'
    - $ref: '#/definitions/secondary_rate_limit_filter'
    - $ref: '#/definitions/exhausted_quota_filter'
    - $ref: '#/definitions/unauthorized_fail_filter'
    - $ref: '#/definitions/not_found_skip_filter'
    - $ref: '#/definitions/forbidden_skip_filter'
    - $ref: '#/definitions/gone_fail_filter'
  stargazers_restricted_not_found_skip_filter:
    type: HttpResponseFilter
    http_codes:
    - 404
    action: IGNORE
    error_message: 'Repository `{{ request_url | regex_search(''/repos/([^/]+/[^/]+)/'') }}`: GitHub returned HTTP 404 for this repository''s
      stargazers list. GitHub only lists stargazers to repository admins and collaborators, so this is expected when the token is neither; it
      can also mean the repository was deleted or renamed. Skipping it.'
  stargazers_restricted_forbidden_skip_filter:
    type: HttpResponseFilter
    http_codes:
    - 403
    action: IGNORE
    error_message: 'Repository `{{ request_url | regex_search(''/repos/([^/]+/[^/]+)/'') }}`: GitHub denied access to this repository''s stargazers
      list (HTTP 403). GitHub only lists stargazers to repository admins and collaborators, so the token needs admin or collaborator access to
      the repository (and SAML SSO authorization if the organization requires it). Skipping it.'
  stargazers_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      $ref: '#/definitions/rate_limit_backoff_strategies'
    response_filters:
    - $ref: '#/definitions/success_filter'
    - $ref: '#/definitions/retry_after_rate_limit_filter'
    - $ref: '#/definitions/primary_rate_limit_filter'
    - $ref: '#/definitions/secondary_rate_limit_filter'
    - $ref: '#/definitions/exhausted_quota_filter'
    - $ref: '#/definitions/unauthorized_fail_filter'
    - $ref: '#/definitions/disabled_feature_skip_filter'
    - $ref: '#/definitions/stargazers_restricted_not_found_skip_filter'
    - $ref: '#/definitions/stargazers_restricted_forbidden_skip_filter'
    - $ref: '#/definitions/empty_repository_skip_filter'
    - $ref: '#/definitions/gone_fail_filter'
  page_link_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestPath
    pagination_strategy:
      type: CursorPagination
      cursor_value: '{{ headers.get("link", {}).get("next", {}).get("url", "") }}'
  repositories_resolver_stream:
    type: DeclarativeStream
    name: repositories_resolver
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester_base'
        path: orgs/{{ stream_partition.organization }}/repos
        http_method: GET
        use_cache: true
        request_parameters:
          per_page: '100'
          sort: updated
          direction: desc
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
        record_filter:
          type: RecordFilter
          condition:
            $ref: '#/definitions/wildcard_repository_filter'
      paginator:
        $ref: '#/definitions/page_link_paginator'
      partition_router:
        type: ListPartitionRouter
        values:
          $ref: '#/definitions/wildcard_organizations'
        cursor_field: organization
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: https://json-schema.org/draft-07/schema#
        type: object
        properties:
          id:
            type:
            - 'null'
            - integer
          full_name:
            type:
            - 'null'
            - string
          owner:
            type:
            - 'null'
            - object
            properties:
              login:
                type:
                - 'null'
                - string
  repository_stats_stream:
    type: DeclarativeStream
    name: repository_stats
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester_base'
        path: repos/{{ stream_partition.repository }}
        http_method: GET
        use_cache: true
        request_parameters:
          per_page: '100'
        error_handler:
          $ref: '#/definitions/resolve_explicit_repository_error_handler'
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      partition_router:
        type: ListPartitionRouter
        values: '{{ config.get(''repositories'', []) | map(''regex_search'', ''^([^*]+)$'') | select | unique | list }}'
        cursor_field: repository
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: https://json-schema.org/draft-07/schema#
        type: object
        properties:
          id:
            type:
            - 'null'
            - integer
          full_name:
            type:
            - 'null'
            - string
          organization:
            type:
            - 'null'
            - object
            properties:
              login:
                type:
                - 'null'
                - string
  repository_partition_router:
    type: UnionPartitionRouter
    partition_field: repository
    partition_routers:
    - type: SubstreamPartitionRouter
      parent_stream_configs:
      - type: ParentStreamConfig
        stream:
          $ref: '#/definitions/repositories_resolver_stream'
        parent_key: full_name
        partition_field: repository
        extra_fields:
        - - default_branch
    - type: SubstreamPartitionRouter
      parent_stream_configs:
      - type: ParentStreamConfig
        stream:
          $ref: '#/definitions/repository_stats_stream'
        parent_key: full_name
        partition_field: repository
        extra_fields:
        - - default_branch
  organization_partition_router:
    type: UnionPartitionRouter
    partition_field: organization
    partition_routers:
    - type: ListPartitionRouter
      values:
        $ref: '#/definitions/wildcard_organizations'
      cursor_field: organization
    - type: SubstreamPartitionRouter
      parent_stream_configs:
      - type: ParentStreamConfig
        stream:
          $ref: '#/definitions/repository_stats_stream'
        parent_key: organization/login
        partition_field: organization
  organization_resolution_partition_router:
    type: UnionPartitionRouter
    partition_field: organization
    partition_routers:
    - type: SubstreamPartitionRouter
      parent_stream_configs:
      - type: ParentStreamConfig
        stream:
          $ref: '#/definitions/repositories_resolver_stream'
        parent_key: owner/login
        partition_field: organization
    - type: SubstreamPartitionRouter
      parent_stream_configs:
      - type: ParentStreamConfig
        stream:
          $ref: '#/definitions/repository_stats_stream'
        parent_key: organization/login
        partition_field: organization
  repositories_stream:
    type: DeclarativeStream
    name: repositories
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester_base'
        path: orgs/{{ stream_partition.organization }}/repos
        http_method: GET
        request_parameters:
          per_page: '100'
          sort: updated
          direction: desc
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
        record_filter:
          type: RecordFilter
          condition:
            $ref: '#/definitions/wildcard_repository_filter'
      paginator:
        $ref: '#/definitions/page_link_paginator'
      partition_router:
        $ref: '#/definitions/organization_partition_router'
    transformations:
    - type: AddFields
      fields:
      - path:
        - organization
        value: '{{ stream_partition.organization }}'
    - type: DpathFlattenFields
      field_path:
      - security_and_analysis
      - secret_scanning
      delete_origin_value: true
      key_transformation:
        type: KeyTransformation
        prefix: security_and_analysis_secret_scanning_
    - type: DpathFlattenFields
      field_path:
      - security_and_analysis
      - secret_scanning_push_protection
      delete_origin_value: true
      key_transformation:
        type: KeyTransformation
        prefix: security_and_analysis_secret_scanning_push_protection_
    - type: DpathFlattenFields
      field_path:
      - security_and_analysis
      - secret_scanning_validity_checks
      delete_origin_value: true
      key_transformation:
        type: KeyTransformation
        prefix: security_and_analysis_secret_scanning_validity_checks_
    - type: DpathFlattenFields
      field_path:
      - security_and_analysis
      - dependabot_security_updates
      delete_origin_value: true
      key_transformation:
        type: KeyTransformation
        prefix: security_and_analysis_dependabot_security_updates_
    - type: DpathFlattenFields
      field_path:
      - owner
      delete_origin_value: true
      key_transformation:
        type: KeyTransformation
        prefix: owner_
    - type: DpathFlattenFields
      field_path:
      - license
      delete_origin_value: true
      key_transformation:
        type: KeyTransformation
        prefix: license_
    - type: DpathFlattenFields
      field_path:
      - permissions
      delete_origin_value: true
      key_transformation:
        type: KeyTransformation
        prefix: permissions_
    - type: DpathFlattenFields
      field_path:
      - security_and_analysis
      delete_origin_value: true
      key_transformation:
        type: KeyTransformation
        prefix: security_and_analysis_
    - type: CustomTransformation
      class_name: source_declarative_manifest.components.EnforceDeclaredSchema
      schema:
