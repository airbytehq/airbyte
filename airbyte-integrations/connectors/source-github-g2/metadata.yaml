data:
  ab_internal:
    ql: 400
    sl: 300
  allowedHosts:
    hosts:
      - ${api_url}
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.37.1@sha256:9ef4125a09cb4ce3a3ad12ffd326817ad6ddadb2957cced297bd731e3bc6b0e4
  connectorSubtype: api
  connectorType: source
  definitionId: 1b271d53-df7e-4d37-9951-974a3b4c8981
  dockerImageTag: 1.0.0
  dockerRepository: airbyte/source-github-g2
  documentationUrl: https://docs.airbyte.com/integrations/sources/github-g2
  githubIssueLabel: source-github-g2
  icon: github.svg
  license: ELv2
  maxSecondsBetweenMessages: 3600
  name: GitHub (Experimental, Gen 2)
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-github-g2
  registryOverrides:
    cloud:
      enabled: true
      public: false
    oss:
      enabled: false
  releaseStage: alpha
  releases:
    breakingChanges:
      1.0.0:
        message: "The workflow_job_steps, contributor_activity_weeks, and release_assets child streams were removed. workflow_job_steps has no replacement: workflow_jobs retains job-level status, conclusion, started_at, completed_at, and created_at, but step names and per-step timing are no longer emitted. contributor_activity_weeks has no replacement, and per-week additions, deletions, and commits are no longer emitted. Release asset download URLs are available in releases.asset_download_urls. Other release asset metadata (id, name, size, download_count, content_type, digest, label, state, and uploader) is no longer emitted; keep the existing release_assets table if needed. Refresh the source schema and clear the affected streams."
        upgradeDeadline: "2026-11-07"
        deadlineAction: "auto_upgrade"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - workflow_jobs
              - contributor_activity
              - releases
              - workflow_job_steps
              - contributor_activity_weeks
              - release_assets
    rolloutConfiguration:
      enableProgressiveRollout: false
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: slow
  suggestedStreams:
    streams:
      - branches
      - comments
      - issues
      - organizations
      - pull_requests
      - repositories
      - stargazers
      - tags
      - teams
      - users
  supportLevel: community
  tags:
    - language:manifest-only
    - cdk:low-code
  connectorTestSuitesOptions:
    - suite: unitTests
  externalDocumentationUrls:
    - title: Breaking changes
      url: https://docs.github.com/en/rest/about-the-rest-api/breaking-changes
      type: api_deprecations
    - title: GitHub REST API reference
      url: https://docs.github.com/en/rest
      type: api_reference
    - title: API Versions
      url: https://docs.github.com/en/rest/about-the-rest-api/api-versions
      type: api_release_history
    - title: GitHub API changelog
      url: https://github.blog/changelog/
      type: api_release_history
    - title: GitHub authentication
      url: https://docs.github.com/en/rest/overview/authenticating-to-the-rest-api
      type: authentication_guide
    - title: GitHub REST API OpenAPI specification
      url: https://github.com/github/rest-api-description
      type: openapi_spec
    - title: GitHub rate limits
      url: https://docs.github.com/en/rest/overview/rate-limits-for-the-rest-api
      type: rate_limits
    - title: GitHub Status
      url: https://www.githubstatus.com/
      type: status_page
metadataSpecVersion: "1.0"
