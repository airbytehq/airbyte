  githubIssueLabel: source-chift
  icon: icon.svg
  license: ELv2
  name: Chift
  releases:
    breakingChanges:
      0.1.0:
        message: >-
          Two objects that carry integration-defined rather than contract-defined keys are now
          declared schemaless, matching Chift's own OpenAPI contract (both are free-form objects
          there): `connections.data`, whose payload differs per integration, and
          `syncs.mappings[].sub_mappings[].target_field.display_condition`, a condition
          expression tree with an open-ended operator set. On destinations that materialize
          declared nested shapes (S3 and GCS in Avro or Parquet format) each object was written
          as a record holding only the enumerated keys - every other key was dropped silently -
          and now becomes a JSON string that preserves every key. Destinations that already store
          whole objects as JSON or VARIANT columns (BigQuery, Snowflake, Iceberg-based) keep the
          same column contents; for them only the declared catalog shape changes. Users reading
          `data.folder_id` or the `display_condition` sub-fields as nested columns need to
          refresh the source schema, reset the `connections` and `syncs` streams, and parse the
          JSON string instead. See the
          [migration guide](https://docs.airbyte.com/integrations/sources/chift-migrations) for
          the per-warehouse extraction equivalents.
        upgradeDeadline: "2026-10-31"
        deadlineAction: "disable"
        scopedImpact:
          - scopeType: stream
            impactedScopes: ["connections", "syncs"]
  releaseDate: 2025-10-13
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/chift
  tags:
