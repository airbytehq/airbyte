documentationUrl: https://docs.airbyte.com/integrations/sources/facebook-pages
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: Facebook Pages Spec
  type: object
  required:
    - access_token
    - page_id
  additionalProperties: true
  properties:
    access_token:
      type: string
      title: Page Access Token
      description: Facebook Page Access Token
      airbyte_secret: true
      order: 0
    page_id:
      type: string
      title: Page ID
      description: Page ID
      order: 1
    page_size:
      type: integer
      title: Page Size For post and post_insights streams
      description: The number of records per page for paginated streams (post, post_insights). Decrease if encountering "reduce the amount of data" errors.
      default: 100
      minimum: 1
      maximum: 100
      order: 2
    start_date:
      type: string
      title: Start Date
      description: >-
        Only used when the page_insights stream runs in Incremental mode. Insights before this date
        are not synced, and the stream requests history from this date in 90-day windows, which is
        the most Meta returns per request. Leave empty to request only Meta's default window on the
        first incremental sync. Meta keeps about two years of Page Insights history.
      format: date-time
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
      examples: ["2024-01-01T00:00:00Z"]
      order: 3
advanced_auth:
  auth_flow_type: oauth2.0
  oauth_config_specification:
    complete_oauth_output_specification:
      type: object
      properties:
        access_token:
          type: string
          path_in_connector_config:
            - access_token
    complete_oauth_server_input_specification:
      type: object
      properties:
        client_id:
          type: string
        client_secret:
          type: string
    complete_oauth_server_output_specification: {}
