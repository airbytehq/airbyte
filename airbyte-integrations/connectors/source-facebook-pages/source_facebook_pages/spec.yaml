documentationUrl: https://docs.airbyte.com/integrations/sources/facebook-pages
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: Facebook Pages Spec
  type: object
  required:
    - access_token
    - page_id
  additionalProperties: true
  properties:
    access_token:
      type: string
      title: Page Access Token
      description: Facebook Page Access Token
      airbyte_secret: true
      order: 0
    page_id:
      type: string
      title: Page ID
      description: Page ID
      order: 1
    page_size:
      type: integer
      title: Page Size For post and post_insights streams
      description: The number of records per page for paginated streams (post, post_insights). Decrease if encountering "reduce the amount of data" errors.
      default: 100
      minimum: 1
      maximum: 100
      order: 2
    page_insights_metrics:
      type: array
      title: Page Insights Metrics
      description: >-
        Metrics requested by the page_insights stream. Leave empty to use the connector defaults. See
        https://developers.facebook.com/docs/graph-api/reference/insights/ for valid metrics. Facebook
        rejects the whole request if any metric is invalid or deprecated.
      items:
        type: string
      examples:
        - ["page_post_engagements", "page_views_total", "page_actions_post_reactions_like_total"]
      order: 3
    post_insights_metrics:
      type: array
      title: Post Insights Metrics
      description: >-
        Metrics requested by the post_insights stream. Leave empty to use the connector defaults.
      items:
        type: string
      examples:
        - ["post_media_view", "post_clicks"]
      order: 4
    video_insights_metrics:
      type: array
      title: Video Insights Metrics
      description: >-
        Lifetime metrics requested for each Page video by the video_insights stream. Leave empty to use
        the connector defaults. See https://developers.facebook.com/docs/graph-api/reference/video/video_insights/
      items:
        type: string
      examples:
        - ["total_video_views", "total_video_complete_views"]
      order: 5
    reel_insights_metrics:
      type: array
      title: Reel Insights Metrics
      description: >-
        Lifetime metrics requested for each Page reel by the reel_insights stream. Leave empty to use the
        connector defaults. See https://developers.facebook.com/docs/graph-api/reference/video/video_insights/#reels-metrics
      items:
        type: string
      examples:
        - ["blue_reels_play_count", "fb_reels_total_plays"]
      order: 6
advanced_auth:
  auth_flow_type: oauth2.0
  oauth_config_specification:
    complete_oauth_output_specification:
      type: object
      properties:
        access_token:
          type: string
          path_in_connector_config:
            - access_token
    complete_oauth_server_input_specification:
      type: object
      properties:
        client_id:
          type: string
        client_secret:
          type: string
    complete_oauth_server_output_specification: {}
