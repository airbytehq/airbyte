metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - ${base_url}
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-uptick
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.39.1@sha256:dc2fc3c346aee695a7967db5c1a0701732a2d075f0c67856934eb1f4b360f06d
  connectorTestSuitesOptions:
    - suite: unitTests
    - suite: integrationTests
      testSecrets:
        - name: SECRET_SOURCE-UPTICK__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-UPTICK__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  connectorSubtype: api
  connectorType: source
  definitionId: 54c75c42-df4a-4f3e-a5f3-d50cf80f1649
  dockerImageTag: 2.1.4
  dockerRepository: airbyte/source-uptick
  githubIssueLabel: source-uptick
  icon: icon.svg
  license: ELv2
  maxSecondsBetweenMessages: 3600
  name: Uptick
  releaseDate: 2025-06-10
  releaseStage: generally_available
  releases:
    breakingChanges:
      2.0.0:
        message: "This release upgrades the Uptick API from v2.15 to v2.16, which removes `properties.access_signaturereq` and `servicetasks.from_stock`. It also changes the type of `properties.address`, `properties.coords` and `branches.business_hours` from string to object and `servicequotes.product_subtotal` from string to number, and makes `majorservices` full refresh only because the endpoint has no `updated` timestamp. Users syncing these streams must update downstream references and refresh the source schema after upgrading. Users syncing `majorservices` incrementally must switch it to full refresh. See the [Uptick migration guide](https://docs.airbyte.com/integrations/sources/uptick-migrations#upgrading-to-200) for details."
        upgradeDeadline: "2026-11-16"
        deadlineAction: "auto_upgrade"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - properties
              - servicetasks
              - branches
              - servicequotes
              - majorservices
      1.0.0:
        message: "This release upgrades the Uptick API from v2.14 to v2.15 and removes fields from the `branches`, `defectquotelineitems`, `servicetasks`, and `tasksessions` streams. Users syncing these streams must update downstream references and refresh the source schema after upgrading. See the [Uptick migration guide](https://docs.airbyte.com/integrations/sources/uptick-migrations#upgrading-to-100) for details and replacement fields."
        upgradeDeadline: "2026-08-20"
        deadlineAction: "auto_upgrade"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - branches
              - defectquotelineitems
              - servicetasks
              - tasksessions
      0.4.0:
        message: "Breaking changes: The assets stream no longer includes floorplan_location_id. The tasksessions stream has removed hours (use duration_hours instead), sell_hours, appointment_attendance, is_suspicious_started, and is_suspicious_finished fields. See migration guide for details."
        upgradeDeadline: "2025-12-23"
  suggestedStreams:
    streams:
      - clients
      - tasks
      - properties
      - invoices
      - users
      - routines
      - assets
  supportLevel: certified
  documentationUrl: https://docs.airbyte.com/integrations/sources/uptick
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 300
    sl: 200
  externalDocumentationUrls:
    - title: Uptick API overview and patch notes
      url: https://support.uptickhq.com/en/articles/6728314-uptick-api-overview-and-patch-notes
      type: api_reference
    - title: Uptick API patch notes
      url: https://support.uptickhq.com/en/articles/6728314-uptick-api-overview-and-patch-notes
      type: api_release_history
    - title: Uptick API getting started
      url: https://support.uptickhq.com/en/articles/6728442-uptick-api-getting-started
      type: authentication_guide
    - title: Uptick API sample Postman collection
      url: https://support.uptickhq.com/en/articles/6728183-uptick-api-sample-postman-collection
      type: other
