[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-uptick-tests"
version = "0.0.1"
description = "Unit tests for source-uptick"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10,<3.13"
# PLACEHOLDER: git ref of airbyte-python-cdk#1173; replace with the released version "X.Y.Z" before pushing.
airbyte-cdk = { git = "https://github.com/airbytehq/airbyte-python-cdk.git", branch = "devin/1790165041-bounded-refresh-retry" }
pytest = "^8"
requests-mock = "^1"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*",
]
