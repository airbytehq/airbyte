[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-uptick-tests"
version = "0.0.1"
description = "Unit tests for source-uptick"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10,<3.13"
# Dev pre-release of airbyte-python-cdk#1173 — replace with the released version before merge.
airbyte-cdk = "7.30.0.post6.dev36119801648"
pytest = "^8"
requests-mock = "^1"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*",
]
