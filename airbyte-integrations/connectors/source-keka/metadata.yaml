metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - "*.keka.com"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-keka
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.35.0@sha256:0557872c74928d6b338b208a97fe52e9e8aed8d9674d85d5b5b540bf91c8110c
  connectorSubtype: api
  connectorType: source
  definitionId: 54664ae8-39aa-467f-9703-9b343ee23b9b
  dockerImageTag: 0.1.2
  dockerRepository: airbyte/source-keka
  githubIssueLabel: source-keka
  icon: icon.svg
  license: ELv2
  name: Keka
  releaseDate: 2025-01-29
  releaseStage: alpha
  releases:
    breakingChanges:
      0.1.0:
        message: >-
          All Keka sources must now configure their company subdomain instead of using
          the hard-coded master host. Set the subdomain before the first sync after
          upgrading. See https://docs.airbyte.com/integrations/sources/keka-migrations
          for instructions.
        upgradeDeadline: "2026-10-22"
        deadlineAction: disable
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - Employees
              - Attendance
              - Clients
              - Projects
              - Project Timesheets
              - Leave Type
              - Leave Request
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/keka
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: Keka API documentation
      url: https://developers.keka.com/
      type: api_reference
