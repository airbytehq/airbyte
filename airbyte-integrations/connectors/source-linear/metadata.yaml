metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - api.linear.app
  suggestedStreams:
    streams:
      - issues
      - projects
      - teams
      - users
      - comments
      - cycles
      - issue_labels
      - workflow_states
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-linear
  releases:
    rolloutConfiguration:
      enableProgressiveRollout: false
    breakingChanges:
      1.0.0:
        message: "This release corrects Linear date and datetime schemas so destinations receive accurate date and timestamp column types, and removes fields deprecated by Linear: `users.inviteHash`, `users.calendarHash`, `teams.inviteHash`, `teams.private`, `teams.markedAsDuplicateWorkflowState` (with its derived `teams.markedAsDuplicateWorkflowStateId`), and `customer_statuses.type` (`teams.visibility` replaces `teams.private`). Users syncing any of these streams are affected: `attachments`, `comments`, `customer_needs`, `customer_statuses`, `customer_tiers`, `customers`, `cycles`, `issue_labels`, `issue_relations`, `issues`, `project_milestones`, `project_statuses`, `projects`, `teams`, `users`, and `workflow_states`. After upgrading and before the first sync, refresh the source schema, update downstream references to removed fields or string casts, and clear those streams. See the [Linear 1.0.0 migration guide](https://docs.airbyte.com/integrations/sources/linear-migrations#upgrading-to-100) for field-level details and steps."
        upgradeDeadline: "2026-09-11"
        deadlineAction: "disable"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              [
                "attachments",
                "comments",
                "customer_needs",
                "customer_statuses",
                "customer_tiers",
                "customers",
                "cycles",
                "issue_labels",
                "issue_relations",
                "issues",
                "project_milestones",
                "project_statuses",
                "projects",
                "teams",
                "users",
                "workflow_states",
              ]
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.28.1@sha256:2a3c870b5a43b525210647a969064c8e4713b792cd1c443df8d5f2b7e0d9e872
  connectorSubtype: api
  connectorType: source
  definitionId: 1c5d8316-ed42-4473-8fbc-2626f03f070c
  dockerImageTag: 1.0.0
  dockerRepository: airbyte/source-linear
  githubIssueLabel: source-linear
  icon: icon.svg
  license: ELv2
  maxSecondsBetweenMessages: 1800
  name: Linear
  releaseDate: 2025-04-11
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/linear
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  connectorTestSuitesOptions:
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-LINEAR__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE-LINEAR__CREDS_OAUTH
          fileName: config_oauth.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: Linear API reference
      url: https://developers.linear.app/docs/graphql/working-with-the-graphql-api
      type: api_reference
    - title: Linear authentication
      url: https://developers.linear.app/docs/oauth/authentication
      type: authentication_guide
    - title: Linear rate limits
      url: https://developers.linear.app/docs/graphql/working-with-the-graphql-api#rate-limiting
      type: rate_limits
    - title: Linear Status
      url: https://status.linear.app/
      type: status_page
