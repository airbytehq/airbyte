metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - api.linear.app
  suggestedStreams:
    streams:
      - issues
      - projects
      - teams
      - users
      - comments
      - cycles
      - issue_labels
      - workflow_states
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-linear
  releases:
    rolloutConfiguration:
      enableProgressiveRollout: false
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.28.1@sha256:2a3c870b5a43b525210647a969064c8e4713b792cd1c443df8d5f2b7e0d9e872
  connectorSubtype: api
  connectorType: source
  definitionId: 1c5d8316-ed42-4473-8fbc-2626f03f070c
  dockerImageTag: 0.2.20
  dockerRepository: airbyte/source-linear
  githubIssueLabel: source-linear
  icon: icon.svg
  license: ELv2
  maxSecondsBetweenMessages: 1800
  name: Linear
  releaseDate: 2025-04-11
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/linear
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  connectorTestSuitesOptions:
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-LINEAR__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE-LINEAR__CREDS_OAUTH
          fileName: config_oauth.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: Linear API reference
      url: https://developers.linear.app/docs/graphql/working-with-the-graphql-api
      type: api_reference
    - title: Linear authentication
      url: https://developers.linear.app/docs/oauth/authentication
      type: authentication_guide
    - title: Linear rate limits
      url: https://developers.linear.app/docs/graphql/working-with-the-graphql-api#rate-limiting
      type: rate_limits
    - title: Linear Status
      url: https://status.linear.app/
      type: status_page
