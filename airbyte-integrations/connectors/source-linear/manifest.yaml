# Linear API documented rate limits (per-user, per-hour windows):
# - API key auth: 2,500 requests / hour (approximately 0.69 req/sec).
# - OAuth app auth: 5,000 requests / hour (approximately 1.39 req/sec).
# - Workspace OAuth auth: dynamic uplift based on paid seat count.
# - Source: https://linear.app/developers/rate-limiting
#
# Starting concurrency follows the connector concurrency tuning playbook
# (Path A, tuned against the lowest documented tier — 2,500 req/hr API key):
# floor((2500/3600) / 4) = 0 ≤ 2 triggers the low-rate-limit special case →
# starting_concurrency = 4, step = 1. Empirical tuning will adjust against
# the documented 2,500 req/hr ceiling.
#
# The user-facing `num_workers` config field (see spec below) overrides the
# default at the connection level; users on the higher-ceiling OAuth tiers
# (5,000 req/hr or workspace OAuth dynamic uplift) can raise it up to the
# max_concurrency ceiling, while users on the 2,500 req/hr API-key tier
# should generally stay at or below the default of 4 to avoid sustained
# rate-limit pressure.
api_budget:
  type: HTTPAPIBudget
  ratelimit_remaining_header: "X-RateLimit-Requests-Remaining"
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: "{{ 20 if config.get('credentials', {}).get('auth_type') == 'OAuth2.0' else 10 }}"
          interval: PT10S
        - limit: "{{ 80 if config.get('credentials', {}).get('auth_type') == 'OAuth2.0' else 40 }}"
          interval: PT1M
        - limit: "{{ 5000 if config.get('credentials', {}).get('auth_type') == 'OAuth2.0' else 2500 }}"
          interval: PT1H
      matchers: []

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: "{{ config.get('num_workers', 4) }}"
  max_concurrency: 16

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - credentials
    properties:
      credentials:
        type: object
        title: Authentication
        description: Choose how to authenticate to Linear.
        order: 0
        oneOf:
          - type: object
            title: OAuth2.0
            required:
              - auth_type
              - client_id
              - client_secret
              - refresh_token
            properties:
              auth_type:
                type: string
                title: Authentication Method
                const: "OAuth2.0"
                order: 0
              client_id:
                type: string
                title: Client ID
                description: >-
                  The Client ID of your Linear OAuth application. Create or view
                  your applications in Linear under Settings → API →
                  Applications.
                airbyte_secret: true
                order: 1
              client_secret:
                type: string
                title: Client Secret
                description: >-
                  The Client Secret of your Linear OAuth application, shown
                  alongside the Client ID in Linear under Settings → API →
                  Applications.
                airbyte_secret: true
                order: 2
              refresh_token:
                type: string
                title: Refresh Token
                description: >-
                  The Refresh Token that Linear returns when your OAuth
                  application completes the OAuth 2.0 authorization flow. The
                  connector uses it to refresh expired access tokens.
                airbyte_secret: true
                order: 3
              access_token:
                type: string
                title: Access Token
                description: >-
                  The access token that Linear returns when the connector
                  refreshes your OAuth 2.0 credentials.
                airbyte_secret: true
                order: 4
              token_expiry_date:
                type: string
                title: Token Expiry Date
                description: >-
                  The date and time when the current OAuth 2.0 access token
                  expires.
                format: date-time
                order: 5
          - type: object
            title: API Key
            required:
              - auth_type
              - api_key
            properties:
              auth_type:
                type: string
                title: Authentication Method
                const: "API Key"
                order: 0
              api_key:
                type: string
                title: API Key
                description: >-
                  Your Linear personal API key. In Linear, go to Settings →
                  Security & access → Personal API keys, then click Create key
                  and copy the generated key. The key inherits your Linear
                  user's workspace permissions.
                airbyte_secret: true
                order: 1
      start_date:
        type: string
        order: 1
        title: Start Date
        description: >-
          UTC date and time in the ISO 8601 format (e.g.
          2020-01-01T00:00:00.000Z). Any records updated before this date will
          not be replicated. Only applies to streams that support incremental
          sync. If unset, defaults to two years ago.
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
        examples:
          - "2020-01-01T00:00:00.000Z"
      num_workers:
        type: integer
        order: 2
        title: Number of concurrent workers
        description: >-
          Number of worker threads used to read streams in parallel. Higher
          values can speed up syncs but increase the risk of hitting Linear's
          rate limits. The Linear API limits per-user requests by
          authentication type: API key auth allows 2,500 requests/hour, OAuth
          allows 5,000 requests/hour, and workspace OAuth scales dynamically
          with paid seats. OAuth has a lower hourly complexity budget
          (2,000,000 points versus 3,000,000 for API keys), which is usually
          the binding limit for this GraphQL connector. Stay at the default
          unless you have observed headroom in your rate-limit usage. See <a
          href="https://linear.app/developers/rate-limiting">Linear API rate
          limits</a> for details.
        default: 4
        minimum: 1
        maximum: 10
    additionalProperties: true
  advanced_auth:
    auth_flow_type: oauth2.0
    predicate_key:
      - credentials
      - auth_type
    predicate_value: "OAuth2.0"
    oauth_config_specification:
      oauth_connector_input_specification:
        scopes:
          - scope: "read"
          - scope: "customer:read"
          - scope: "initiative:read"
        scopes_join_strategy: comma
        consent_url: "https://linear.app/oauth/authorize?{{client_id_param}}&{{redirect_uri_param}}&response_type=code&{{state_param}}&{{scopes_param}}&actor=app&prompt=consent"
        access_token_url: "https://api.linear.app/oauth/token"
        access_token_headers:
          Content-Type: "application/x-www-form-urlencoded"
        access_token_params:
          grant_type: "authorization_code"
          code: "{{ auth_code_value }}"
          client_id: "{{ client_id_value }}"
          client_secret: "{{ client_secret_value }}"
          redirect_uri: "{{ redirect_uri_value }}"
        extract_output:
          - access_token
          - refresh_token
          - expires_in
      complete_oauth_output_specification:
        type: object
        additionalProperties: false
        properties:
          refresh_token:
            type: string
            path_in_connector_config:
              - credentials
              - refresh_token
          access_token:
            type: string
            path_in_connector_config:
              - credentials
              - access_token
          token_expiry_date:
            type: string
            path_in_connector_config:
              - credentials
              - token_expiry_date
      complete_oauth_server_input_specification:
        type: object
        additionalProperties: false
        properties:
          client_id:
            type: string
          client_secret:
            type: string
      complete_oauth_server_output_specification:
        type: object
        additionalProperties: false
        properties:
          client_id:
            type: string
            path_in_connector_config:
              - credentials
              - client_id
          client_secret:
            type: string
            path_in_connector_config:
              - credentials
              - client_secret
  config_normalization_rules:
    type: ConfigNormalizationRules
    config_migrations:
      - type: ConfigMigration
        description: Migrate flat api_key config to nested credentials structure for OAuth 2.0 support
        transformations:
          - type: ConfigAddFields
            fields:
              - type: AddedFieldDefinition
                path: ["credentials", "auth_type"]
                value: "API Key"
            condition: "{{ not config.get('credentials') and config.get('api_key') }}"
          - type: ConfigAddFields
            fields:
              - type: AddedFieldDefinition
                path: ["credentials", "api_key"]
                value: "{{ config['api_key'] }}"
            condition: "{{ not config.get('credentials', {}).get('api_key') and config.get('api_key') }}"


