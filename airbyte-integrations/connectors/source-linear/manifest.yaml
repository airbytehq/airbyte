  base_requester:
    type: HttpRequester
    url_base: https://api.linear.app/graphql
    error_handler:
      type: DefaultErrorHandler
      backoff_strategies:
        - type: WaitUntilTimeFromHeader
          header: X-RateLimit-Requests-Reset
          regex: ^\d{10}
          min_wait: 60
        - type: WaitUntilTimeFromHeader
          header: X-RateLimit-Endpoint-Requests-Reset
          regex: ^\d{10}
          min_wait: 60
        - type: WaitUntilTimeFromHeader
          header: X-RateLimit-Complexity-Reset
          regex: ^\d{10}
          min_wait: 60
        - type: ConstantBackoffStrategy
          backoff_time_in_seconds: 60
      response_filters:
        # 1 · Rate limits — unchanged, must stay first.
        - predicate: "{{ 'errors' in response and response['errors'] and response['errors'][0].get('extensions', {}).get('code') == 'RATELIMITED' }}"
          action: RATE_LIMITED
          failure_type: transient_error
          error_message: "Rate limit exceeded for Linear API."
        # 2 · Authentication — surface Linear's own message.
        - predicate: "{{ 'errors' in response and response['errors'] and response['errors'][0].get('extensions', {}).get('code') == 'AUTHENTICATION_ERROR' }}"
          action: FAIL
          failure_type: config_error
          error_message: >-
            Linear rejected the credentials.
            If you authenticated with an API key, confirm it has not been revoked in Linear under Settings → Security & access → Personal API keys.
            If you authenticated with OAuth, re-authenticate to obtain a new refresh token.
            Linear's message: {{ response['errors'][0].get('extensions', {}).get('userPresentableMessage', 'authentication failed') }}
        # 3 · Permission and plan gating — user-correctable, but not a credential problem.
        #     This handler is shared by all 20 streams and by `check`, so the text must stay stream-agnostic.
        - predicate: "{{ 'errors' in response and response['errors'] and (response['errors'][0].get('extensions', {}).get('code') in ['FORBIDDEN', 'FEATURE_NOT_ACCESSIBLE'] or response['errors'][0].get('extensions', {}).get('type') in ['forbidden', 'feature not accessible']) and not (response.get('data') or {}).values() | select | list }}"
          action: FAIL
          failure_type: config_error
          error_message: >-
            Linear denied access to this data.
            Confirm the credentials you configured can read the teams and data this stream covers. If the failing stream is
            customers, customer_needs, customer_statuses or customer_tiers, your workspace also needs Linear's Customer
            Requests feature enabled (Workspace Settings > Customer requests) and, for OAuth sources, the customer:read
            scope. Deselect the stream if you cannot grant it access.
            Linear's message: {{ response['errors'][0].get('extensions', {}).get('userPresentableMessage', 'access denied') }}
        # 4 · Query defects — permanent. Fail immediately; do NOT let the HTTP 500 case retry.
        - predicate: "{{ 'errors' in response and response['errors'] and response['errors'][0].get('extensions', {}).get('code') == 'GRAPHQL_VALIDATION_FAILED' }}"
          action: FAIL
          failure_type: system_error
          error_message: >-
            Linear rejected the connector's query as invalid.
            This is a connector defect, not a configuration problem. Please report it to Airbyte support.
            Linear's message: {{ response['errors'][0].get('message', 'validation failed') }}
        # 4b · Retryable transport statuses. Must sit after the GRAPHQL_VALIDATION_FAILED filter
        #      (so malformed queries still fail fast) and before the catch-all below, which has
        #      no status guard and would otherwise shadow the CDK's DEFAULT_ERROR_MAPPING.
        - http_codes: [429]
          action: RATE_LIMITED
          failure_type: transient_error
          error_message: "Rate limit exceeded for Linear API."
        - http_codes: [408, 500, 502, 503, 504]
          action: RETRY
          failure_type: transient_error
          error_message: "Linear returned a transient error; retrying."
        # 5 · Catch-all for data-less GraphQL errors not classified above. Partial-success pages
        #     flow to the extractor; 408/429/5xx are handled by the status filters above.
        - predicate: "{{ 'errors' in response and response['errors'] and not (response.get('data') or {}).values() | select | list }}"
          action: FAIL
          failure_type: system_error
          error_message: >-
            {%- set errs = response['errors'] -%}
            {%- set err = errs[0] if errs is iterable and errs is not string and errs is not mapping else errs -%}
            {%- set ext = err.get('extensions') if err is mapping else none -%}
            Linear returned an error: {{ (ext.get('userPresentableMessage') if ext is mapping else none)
            or (err.get('message') if err is mapping else err | string) or 'unknown error' }}
    authenticator:
      type: SelectiveAuthenticator
      authenticator_selection_path: ["credentials", "auth_type"]
      authenticators:
        "API Key":
          type: ApiKeyAuthenticator
          api_token: "{{ config['credentials']['api_key'] }}"
          inject_into:
            type: RequestOption
            field_name: Authorization
            inject_into: header
        "OAuth2.0":
          type: OAuthAuthenticator
          client_id: "{{ config['credentials']['client_id'] }}"
          client_secret: "{{ config['credentials']['client_secret'] }}"
          refresh_token: "{{ config['credentials']['refresh_token'] }}"
          token_refresh_endpoint: "https://api.linear.app/oauth/token"
          access_token_name: access_token
          grant_type: refresh_token
          refresh_token_updater:
            refresh_token_name: refresh_token
            access_token_config_path: ["credentials", "access_token"]
            refresh_token_config_path: ["credentials", "refresh_token"]
            token_expiry_date_config_path: ["credentials", "token_expiry_date"]
          refresh_token_error_status_codes: [400, 401]
          refresh_token_error_key: "error"
          refresh_token_error_values:
            ["invalid_grant", "invalid_request", "invalid_client", "unauthorized_client"]

