version: 6.48.15

type: DeclarativeSource

description: >-
  Linear is a project management and issue tracking tool designed specifically
  for product and engineering teams. It focuses on streamlining issues, sprints,
  and product roadmaps with a user-friendly experience and strong support.
  Unlike traditional project management software that tries to do everything,
  Linear emphasizes speed, simplicity, and clarity.

check:
  type: CheckStream
  stream_names:
    - issues

definitions:
  incremental_sync_updated_at:
    type: DatetimeBasedCursor
    cursor_field: updatedAt
    cursor_datetime_formats:
      - "%Y-%m-%dT%H:%M:%S.%fZ"
    datetime_format: "%Y-%m-%dT%H:%M:%S.%fZ"
    start_datetime:
      type: MinMaxDatetime
      datetime: "{{ config.get('start_date', (now_utc() - duration('P2Y')).strftime('%Y-%m-%dT%H:%M:%S.000Z')) }}"
      datetime_format: "%Y-%m-%dT%H:%M:%S.%fZ"
    start_time_option:
      type: RequestOption
      inject_into: body_json
      field_path:
        - variables
        - filter
        - updatedAt
        - gte
  base_issues_stream:
    type: DeclarativeStream
    name: issues
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/base_requester"
        path: /
        http_method: POST
        request_headers:
          Content-Type: application/json
        request_body_json:
          query: >-
            query Issues($after: String, $filter: IssueFilter, $orderBy: PaginationOrderBy) { issues(after: $after, first: 25, includeArchived: true, filter: $filter, orderBy: $orderBy) {
            nodes { id addedToCycleAt addedToProjectAt addedToTeamAt
            archivedAt assignee { id } autoArchivedAt autoClosedAt branchName
            canceledAt completedAt createdAt creator { id }
            customerTicketCount cycle { id } description descriptionState
            dueDate estimate identifier integrationSourceType labelIds number
            parent { id } previousIdentifiers priority priorityLabel
            prioritySortOrder project { id } projectMilestone { id }
            reactionData snoozedBy { id } snoozedUntilAt sortOrder startedAt
            state { id } startedTriageAt subIssueSortOrder team { id } title
            trashed triagedAt updatedAt url attachments { nodes { id } }
            sourceComment { id } labels { nodes { id } } slaType slaStartedAt
            slaMediumRiskAt slaHighRiskAt slaBreachesAt relations { nodes { id
            } } subscribers { nodes { id } } } pageInfo { hasNextPage
            endCursor } } }
          variables:
            orderBy: updatedAt
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
            - issues
            - nodes
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestOption
          inject_into: body_json
          field_path:
            - variables
            - after
        pagination_strategy:
          type: CursorPagination
          cursor_value: "{{ response.data.issues.pageInfo.endCursor or \"\" }}"
          stop_condition: "{{ response.data.issues.pageInfo.hasNextPage is false }}"
      decoder:
        type: JsonDecoder
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - assigneeId
            value: "{{ record.assignee.id }}"
      - type: RemoveFields
        field_pointers:
          - - assignee
            - id
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - creatorId
            value: "{{ record.creator.id }}"
      - type: RemoveFields
        field_pointers:
          - - creator
            - id
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - cycleId
            value: "{{ record.cycle.id }}"
      - type: RemoveFields
        field_pointers:
          - - cycle
            - id
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - stateId
            value: "{{ record.state.id }}"
      - type: RemoveFields
        field_pointers:
          - - state
            - id
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - teamId
            value: "{{ record.team.id }}"
      - type: RemoveFields
        field_pointers:
          - - team
            - id
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - parentId
            value: "{{ record.parent.id }}"
      - type: RemoveFields
        field_pointers:
          - - parent
            - id
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - projectId
            value: "{{ record.project.id }}"
      - type: RemoveFields
        field_pointers:
          - - project
            - id
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - milestoneId
            value: "{{ record.projectMilestone.id }}"
      - type: RemoveFields
        field_pointers:
          - - projectMilestone
            - id
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - attachmentIds
            value: "{{ record.attachments.nodes | map(attribute='id') | list }}"
      - type: RemoveFields
        field_pointers:
          - - attachments
            - nodes
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - labelIds
            value: "{{ record.labels.nodes | map(attribute='id') | list }}"
      - type: RemoveFields
        field_pointers:
          - - labels
            - nodes
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - subscriberIds
            value: "{{ record.subscribers.nodes | map(attribute='id') | list }}"
      - type: RemoveFields
        field_pointers:
          - - subscribers
            - nodes
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - relationIds
            value: "{{ record.relations.nodes | map(attribute='id') | list }}"
      - type: RemoveFields
        field_pointers:
          - - relations
            - nodes
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - sourceCommentId
            value: "{{ record.sourceComment.id }}"
      - type: RemoveFields
        field_pointers:
          - - sourceComment
            - id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/issues"
  streams:
    issues:
      $ref: "#/definitions/base_issues_stream"
      incremental_sync:
        $ref: "#/definitions/incremental_sync_updated_at"
    customers:
      type: DeclarativeStream
      name: customers
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /
          http_method: POST
          request_headers:
            Content-Type: application/json
          request_body_json:
            query: >-
              query Customers($after: String, $filter: CustomerFilter, $orderBy: PaginationOrderBy) { customers(after: $after, first:
              50, includeArchived: true, filter: $filter, orderBy: $orderBy) { nodes { approximateNeedCount archivedAt createdAt domains
              externalIds id logoUrl name owner { id } revenue size
              slackChannelId slugId status { id } tier { id } updatedAt }
              pageInfo { endCursor hasNextPage } } }
            variables:
              orderBy: updatedAt
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
              - customers
              - nodes
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: body_json
            field_path:
              - variables
              - after
          pagination_strategy:
            type: CursorPagination
            cursor_value: "{{ response.data.customers.pageInfo.endCursor or \"\" }}"
            stop_condition: "{{ response.data.customers.pageInfo.hasNextPage is false }}"
        decoder:
          type: JsonDecoder
      incremental_sync:
        $ref: "#/definitions/incremental_sync_updated_at"

      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - statusId
              value: "{{ record['status']['id'] }}"
        - type: RemoveFields
          field_pointers:
            - - status
              - id
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - tierId
              value: "{{ record['tier']['id'] }}"
        - type: RemoveFields
          field_pointers:
            - - tier
              - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/customers"
