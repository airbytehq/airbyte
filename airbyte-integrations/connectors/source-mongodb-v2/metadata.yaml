data:
  ab_internal:
    ql: 200
    sl: 200
  allowedHosts:
    hosts:
      - ${connection_string}
  connectorBuildOptions:
    baseImage: docker.io/airbyte/java-connector-base:2.0.4@sha256:5f343797cfcf021ca98ba9bdf5970ef66cbf6222d8cc17b0d61d13860a5bcc2b
  connectorIPCOptions:
    dataChannel:
      version: "0.0.2"
      supportedSerialization: ["JSONL", "PROTOBUF"]
      supportedTransport: ["SOCKET", "STDIO"]
  connectorSubtype: database
  connectorTestSuitesOptions:
    - suite: unitTests
    - suite: integrationTests
      testSecrets:
        - fileName: config.json
          name: SECRET_SOURCE-MONGODB-V2__CREDS
          secretStore:
            alias: airbyte-connector-testing-secret-store
            type: GSM
    - suite: acceptanceTests
      testSecrets:
        - fileName: config.json
          name: SECRET_SOURCE-MONGODB-V2__CREDS
          secretStore:
            alias: airbyte-connector-testing-secret-store
            type: GSM
  connectorType: source
  definitionId: b2e713cd-cc36-4c0a-b5bd-b47cb8a0561e
  dockerImageTag: 3.0.0
  dockerRepository: airbyte/source-mongodb-v2
  documentationUrl: https://docs.airbyte.com/integrations/sources/mongodb-v2
  githubIssueLabel: source-mongodb-v2
  icon: mongodb.svg
  license: ELv2
  maxSecondsBetweenMessages: 7200
  name: MongoDb
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  releases:
    breakingChanges:
      3.0.0:
        message:
          "This is a full rewrite of the MongoDB source on the Bulk CDK. Change data
          capture now reads the replica-set change stream with the native MongoDB
          driver instead of Debezium. Existing connections upgrade in place: the
          saved CDC position (the MongoDB resume token Debezium stored), the
          initial-snapshot state and saved configurations are all read as-is, so no
          reset is required. The Debezium-only settings 'initial_waiting_seconds' and
          'queue_size' are removed from the spec (saved configurations that still
          carry them are accepted and the values ignored). Views are no longer
          discovered as streams, boolean fields are now typed as boolean, and a
          collection whose _id values are of more than one type fails the sync
          instead of risking missed documents. See the migration guide for details."
        upgradeDeadline: "2026-12-31"
        scopedImpact:
          - scopeType: stream
            impactedScopes: ["*"]
      2.0.0:
        message:
          "**Important: This version introduces multiple database support for MongoDB v2 source connector.**

          This update changes the configuration schema from a single `database` field to a `databases` array field,
          allowing you to sync data from multiple MongoDB databases in a single connection.

          **What to expect when upgrading:**

          1. You will need to reconfigure your MongoDB source connector to use the new `databases` array field
          2. If you're using CDC incremental sync mode, we recommend testing this upgrade in a staging environment first

          **Migration steps:**

          1. After upgrading, edit your MongoDB source configuration
          2. Add your existing database to the new `databases` array field
          3. Add any additional databases you want to sync
          4. Save the configuration and run a sync

          For more information, please refer to the [MongoDB v2 documentation](https://docs.airbyte.com/integrations/sources/mongodb-v2) and the [migration guide](https://docs.airbyte.com/integrations/sources/mongodb-v2-migrations).
          "
        upgradeDeadline: "2025-08-31"
      1.0.0:
        message:
          "**We advise against upgrading until you have run a test upgrade
          as outlined [here](https://docs.airbyte.com/integrations/sources/mongodb-v2-migrations).**  This
          version brings a host of updates to the MongoDB source connector, significantly
          increasing its scalability and reliability, especially for large collections.
          As of this version with checkpointing, [CDC incremental updates](https://docs.airbyte.com/understanding-airbyte/cdc)
          and improved schema discovery, this connector is also now [certified](https://docs.airbyte.com/integrations/).
          Selecting `Upgrade` will upgrade **all** connections using this source,
          require you to reconfigure the source, then run a full reset on **all**
          of your connections.

          "
        upgradeDeadline: "2023-12-01"
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: slow
  supportLevel: certified
  tags:
    - language:java
  externalDocumentationUrls:
    - title: MongoDB documentation
      url: https://www.mongodb.com/docs/
      type: api_reference
    - title: Release Notes
      url: https://www.mongodb.com/docs/manual/release-notes/
      type: api_release_history
    - title: MongoDB authentication
      url: https://www.mongodb.com/docs/manual/core/authentication/
      type: authentication_guide
    - title: MongoDB server source code
      url: https://github.com/mongodb/mongo
      type: code_repository
metadataSpecVersion: "1.0"
