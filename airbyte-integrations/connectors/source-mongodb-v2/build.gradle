plugins {
    id 'airbyte-bulk-connector'
    id "io.airbyte.gradle.docker"
    id 'airbyte-connector-docker-convention'
}

application {
    mainClass = 'io.airbyte.integrations.source.mongodb.MongoDbSource'
}

airbyteBulkConnector {
    core = 'extract'
    toolkits = []
}

dependencies {
    implementation 'org.mongodb:mongodb-driver-sync:5.13.0'
    // Wire compression: the driver negotiates snappy with the server when this is on the classpath.
    implementation 'org.xerial.snappy:snappy-java:1.1.10.8'

    testFixturesImplementation 'org.testcontainers:mongodb:1.21.4'
    testImplementation 'org.testcontainers:mongodb:1.21.4'
}
