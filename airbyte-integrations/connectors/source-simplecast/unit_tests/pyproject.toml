[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-simplecast-tests"
version = "0.0.0"
description = "Unit tests for source-simplecast"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11,<3.13"
airbyte-cdk = "7.47.0"
pytest = "^8"
pytest-timeout = "^2.3"
requests-mock = "^1.12.1"

[tool.pytest.ini_options]
filterwarnings = ["ignore:This class is experimental*"]
