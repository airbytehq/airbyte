[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-simplecast-tests"
version = "0.0.1"
description = "Unit tests for source-simplecast"
authors = ["Airbyte <contact@airbyte.io>"]

[tool.poetry.dependencies]
python = "^3.10,<3.13"
airbyte-cdk = { version = "7.45.0", extras = ["dev"] }
pytest = "^7.4"
requests-mock = "^1"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*",
]
