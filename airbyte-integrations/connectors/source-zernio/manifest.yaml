spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    title: Zernio
    required:
      - api_key
    additionalProperties: true
    properties:
      api_key:
        type: string
        title: API Key
        description: Zernio API key (dashboard > API Keys). Sent as a Bearer token; reads every profile on the team.
        airbyte_secret: true
        order: 0
      start_date:
        type: string
        title: Start date
        description: >-
          Earliest date (YYYY-MM-DD) for post analytics, post timelines,
          follower stats and daily metrics. Zernio only holds what it has synced
          since each account was connected, so an earlier date costs a few empty
          requests, nothing more.
        pattern: ^\d{4}-\d{2}-\d{2}$
        default: "2025-01-01"
        order: 1
