# See [Connector Acceptance Tests](https://docs.airbyte.io/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-weatherstack:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        empty_streams:
          - name: "historical"
            bypass_reason: "The plan of the GSM test config does not include historical data (HTTP 400, error code 603)"
          - name: "location_lookup"
            bypass_reason: "The plan of the GSM test config does not include the autocomplete API (HTTP 403, error code 105)"
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        empty_streams:
          - name: "historical"
            bypass_reason: "The plan of the GSM test config does not include historical data (HTTP 400, error code 603)"
          - name: "location_lookup"
            bypass_reason: "The plan of the GSM test config does not include the autocomplete API (HTTP 403, error code 105)"
