---
airbyte:
  connector:
    data-channel:
      medium: ${DATA_CHANNEL_MEDIUM:STDIO}
      format: ${DATA_CHANNEL_FORMAT:JSONL}
      socket-paths: ${DATA_CHANNEL_SOCKET_PATHS:}
    output:
      buffer-byte-size-threshold-for-flush: 8192
    exception-classifiers:
      regex:
        # Rules are applied in order to a Throwable's message and to the messages of its causes,
        # after MongoDbExceptionClassifier has classified transient driver failures by type and
        # server error code. See
        # airbyte-cdk/bulk/core/base/src/main/kotlin/io/airbyte/cdk/output/ExceptionClassifier.kt
        rules:
          - pattern: (?i).*Exception authenticating MongoCredential.*
            input-example: >-
              com.mongodb.MongoSecurityException: Exception authenticating
              MongoCredential{mechanism=SCRAM-SHA-256, userName='root', source='admin', password=<hidden>, mechanismProperties=<hidden>}
            error: config
            # Same user-facing message as the legacy (Debezium) connector.
            output: "Authentication failed.  Please check the source's configured credentials."

          # The driver phrases this "Command execution failed on MongoDB server with error 13"
          # since 5.x and "Command failed with error 13" before; match the code and name only.
          - pattern: (?i).*error 13 \(Unauthorized\).*
            input-example: >-
              com.mongodb.MongoCommandException: Command execution failed on MongoDB server with error 13 (Unauthorized):
              'not authorized on test_db to execute command { listCollections: 1, authorizedCollections: true, nameOnly: true }' on server mongo:27017.
            error: config
            output: >-
              The configured MongoDB user is not authorized to read the configured databases. Grant it
              the 'read' role on the database (or 'readAnyDatabase' when several databases are
              configured), or set the Database Names to the databases it may read. See
              https://docs.airbyte.com/integrations/sources/mongodb#step-1-create-a-dedicated-read-only-mongodb-user

          # Server error 40573: a change stream was opened on a standalone server, which has no
          # oplog. CHECK passes there (as the legacy connector's did), so this is the first thing
          # an incremental sync against a standalone server reports.
          - pattern: (?i).*(error 40573|\$changeStream stage is only supported on replica sets).*
            input-example: >-
              com.mongodb.MongoCommandException: Command execution failed on MongoDB server with error 40573 (Location40573):
              'The $changeStream stage is only supported on replica sets' on server mongo:27017.
            error: config
            output: >-
              Incremental (CDC) syncs need a replica set or a sharded cluster: the configured MongoDB
              instance is a standalone server, which has no oplog and no change streams. Convert it to
              a replica set (a single-node replica set is enough), or sync its collections in Full
              Refresh mode. See https://docs.airbyte.com/integrations/sources/mongodb#requirements

          # Server selection timed out: a wrong host during CHECK (reported as a config error
          # there regardless), a network blip or an election mid-READ (retry from the checkpoint).
          # MongoDbExceptionClassifier handles the exception type; this rule covers a wrapped
          # message that lost the type.
          - pattern: (?i).*Timed out.*while waiting for a server that matches.*
            input-example: >-
              com.mongodb.MongoTimeoutException: Timed out while waiting for a server that matches
              ReadPreferenceServerSelector{readPreference=primary}. Client view of cluster state is {type=UNKNOWN, ...}
            error: transient
            output: >-
              No MongoDB server could be reached within the server selection timeout. Check that the
              hosts in the connection string are correct and reachable from Airbyte (firewall, IP allow
              list, DNS) and that the replica set has a primary; the sync is retried.

          # Server error 10334 (BSONObjectTooLarge): a change-stream event exceeded the 16MB BSON
          # limit. Same actionable message as the legacy (Debezium) connector.
          - pattern: (?i).*(error 10334|BSONObjectTooLarge).*
            input-example: >-
              com.mongodb.MongoCommandException: Command failed with error 10334 (BSONObjectTooLarge):
              'BSONObj size: 16810000 (0x1008B90) is invalid. Size must be between 0 and 16793600(16MB)' on server mongo:27017.
            error: config
            output: >-
              A document in your MongoDB database exceeds the 16MB BSON size limit when processed through
              CDC (Change Data Capture) change streams. This error occurs specifically during
              incremental/CDC syncs when change stream events become too large. To resolve this issue, you
              have several options: (1) Switch the affected stream(s) to 'Full Refresh' sync mode instead of
              'Incremental' mode, which does not use change streams. (2) Identify and restructure
              the large documents in your MongoDB collection to stay under 16MB. (3) Deselect streams
              containing documents that are too large. For more information, see
              https://docs.airbyte.com/integrations/sources/mongodb#mongodb-cdc-limitations
