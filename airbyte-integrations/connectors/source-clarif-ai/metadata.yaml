metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - "api.clarifai.com"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-clarif-ai
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.47.0@sha256:b2ecb78040d4c4b42fa3537488d68a3b195f64b5fefcbc48ac0591479591a3f0
  connectorSubtype: api
  connectorType: source
  definitionId: 7fbeaeea-2d0d-4f13-8200-fa228494d91c
  dockerImageTag: 1.0.0
  dockerRepository: airbyte/source-clarif-ai
  githubIssueLabel: source-clarif-ai
  icon: icon.svg
  license: ELv2
  name: Clarif-ai
  releaseDate: 2024-10-21
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/clarif-ai
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: Clarifai API reference
      url: https://docs.clarifai.com/api-guide/api-overview
      type: api_reference
    - title: Clarifai authentication
      url: https://docs.clarifai.com/api-guide/api-overview/api-clients
      type: authentication_guide
    - title: Clarifai Status
      url: https://status.clarifai.com/
      type: status_page
  releases:
    breakingChanges:
      1.0.0:
        message: >-
          The modified_at field in applications, datasets, and models is now emitted with six fractional
          digits so incremental state advances for Clarifai timestamps with nanosecond precision.
          Sub-microsecond precision is discarded. Review downstream timestamp comparisons and joins
          before upgrading; no schema refresh, state reset, or stream clear is required. Other streams
          are unchanged. See the
          [migration guide](https://docs.airbyte.com/integrations/sources/clarif-ai-migrations#upgrading-to-100).
        upgradeDeadline: "2026-11-27"
        deadlineAction: disable
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - applications
              - datasets
              - models
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
