  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releases:
    breakingChanges:
      0.1.0:
        message: >-
          This version reads datasets through the Hugging Face `datasets` library instead of the
          dataset viewer API, which is faster and supports private and gated datasets. The `rows`
          and `splits` streams are replaced by one stream per dataset subset and split, and records
          now carry the dataset columns directly instead of the dataset viewer payload. The optional
          token setting moves from `api_token` to `token` (existing `api_token` values are still
          read). After upgrading, refresh the source schema and run a full reset. See the
          [migration guide](https://docs.airbyte.com/integrations/sources/hugging-face-datasets-migrations)
          for the full steps.
        upgradeDeadline: "2026-12-22"
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-hugging-face-datasets
  releaseDate: 2024-11-28
  releaseStage: alpha
  supportLevel: community
  tags:
