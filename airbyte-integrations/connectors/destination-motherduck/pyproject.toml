[tool.poetry]
name = "airbyte-destination-motherduck"
version = "0.2.7"
description = "Destination implementation for MotherDuck."
authors = ["Guen Prawiroatmodjo, Simon Späti, Airbyte"]
license = "ELv2"
readme = "README.md"

[[tool.poetry.packages]]
include = "destination_motherduck"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"

# NOTE: You can toggle between pinned and local CDK version for testing:
airbyte-cdk = {version = "^7.0.0", extras = ["sql"]}
# airbyte-cdk = { path = "../../../airbyte-cdk/python", extras = ["sql"] }
duckdb = ">=1.4.2,<2.0"
duckdb-engine = "^0.17.0"
numpy = ">=2.0.0,<3.0"
pyarrow = ">=18.0.0"
sqlalchemy = ">=1.4.51,!=2.0.36,<2.0.45"
rich = "^13.7.0"
overrides = "^7.4.0"
python-ulid = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
ruff = "^0.7.1"
black = "^23.7.0"
mypy = "^1.5.1"
faker = "24.4.0"
coverage = "^7.5.3"
freezegun = "^1.5.1"
poethepoet = "^0.35.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poe]
include = [
    # Shared tasks definition file(s) can be imported here.
    # Run `poe` or `poe --help` to see the list of available tasks.
    "${POE_GIT_DIR}/poe-tasks/poetry-connector-tasks.toml",
]
[tool.poetry.scripts]
destination-motherduck = "destination_motherduck.run:run"
