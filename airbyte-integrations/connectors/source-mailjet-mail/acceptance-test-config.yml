# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-mailjet-mail:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    bypass_reason: "The CI test secret's API key gets 401 Unauthorized on every stream. Refreshing it needs a Mailjet account. Live tests are bypassed until a new secret is stored."
  basic_read:
    bypass_reason: "The CI test secret's API key gets 401 Unauthorized on every stream. Refreshing it needs a Mailjet account. Live tests are bypassed until a new secret is stored."
  # TODO uncomment this block to specify that the tests should assert the connector outputs the records provided in the input file a file
  #        expect_records:
  #          path: "integration_tests/expected_records.jsonl"
  #          exact_order: no
  full_refresh:
    bypass_reason: "The CI test secret's API key gets 401 Unauthorized on every stream. Refreshing it needs a Mailjet account. Live tests are bypassed until a new secret is stored."
