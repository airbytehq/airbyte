data:
  allowedHosts:
    hosts:
      - api.gong.io
      - app.gong.io
  ab_internal:
    ql: 300
    sl: 200
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.37.1@sha256:9ef4125a09cb4ce3a3ad12ffd326817ad6ddadb2957cced297bd731e3bc6b0e4
  connectorSubtype: api
  maxSecondsBetweenMessages: 86400
  connectorType: source
  definitionId: 32382e40-3b49-4b99-9c5c-4076501914e7
  dockerImageTag: 1.5.4
  dockerRepository: airbyte/source-gong
  documentationUrl: https://docs.airbyte.com/integrations/sources/gong
  githubIssueLabel: source-gong
  icon: gong.svg
  license: ELv2
  name: Gong
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releases:
    breakingChanges:
      1.0.0:
        message: "The `extensiveCalls` stream schema has changed: the `context` field type changed from `object` to `array`, and the `value` field within `context.objects.fields` now accepts `string`, `number`, `boolean`, `object`, and `array` types instead of only `object`. Users syncing the `extensiveCalls` stream must refresh the source schema and reset the stream after upgrading. For more information, see the [Gong migration guide](https://docs.airbyte.com/integrations/sources/gong-migrations)."
        upgradeDeadline: "2026-04-13"
        deadlineAction: "auto_upgrade"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - "extensiveCalls"
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
  releaseStage: generally_available
  suggestedStreams:
    streams:
      - calls
      - extensiveCalls
      - callTranscripts
      - users
      - answeredScorecards
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-gong
  supportLevel: certified
  tags:
    - cdk:low-code
    - language:manifest-only
  connectorTestSuitesOptions:
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE_GONG_CREDS_OAUTH
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: Gong API reference
      url: https://help.gong.io/apidocs
      type: api_reference
    - title: Gong authentication
      url: https://help.gong.io/docs/create-an-app-for-gong
      type: authentication_guide
    - title: Gong rate limits
      url: https://help.gong.io/apidocs
      type: rate_limits
    - title: Gong technical release notes
      url: https://help.gong.io/docs/release-notes
      type: api_release_history
    - title: "Public API change: Deprecating Call Action Items in the extensive endpoint"
      url: https://help.gong.io/docs/public-api-change-deprecating-call-action-items-in-the-extensive-endpoint
      type: api_deprecations
    - title: Gong trusted IPs for OAuth integrations
      url: https://help.gong.io/docs/configure-trusted-ips-for-your-integration
      type: authentication_guide
metadataSpecVersion: "1.0"
