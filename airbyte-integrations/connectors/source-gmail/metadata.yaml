metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - "gmail.googleapis.com"
  suggestedStreams:
    streams:
      - messages_details
      - labels_details
      - drafts
      - profile
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-gmail
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.39.1@sha256:dc2fc3c346aee695a7967db5c1a0701732a2d075f0c67856934eb1f4b360f06d
  connectorSubtype: api
  maxSecondsBetweenMessages: 3600
  connectorType: source
  definitionId: f7833dac-fc18-4feb-a2a9-94b22001edc6
  dockerImageTag: 1.0.1
  dockerRepository: airbyte/source-gmail
  githubIssueLabel: source-gmail
  icon: icon.svg
  license: ELv2
  name: Gmail
  releaseDate: 2024-10-09
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/gmail
  tags:
    - language:manifest-only
    - cdk:low-code
  connectorTestSuitesOptions:
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-GMAIL__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: Gmail API reference
      url: https://developers.google.com/gmail/api/reference/rest
      type: api_reference
    - title: Gmail authentication
      url: https://developers.google.com/gmail/api/auth/about-auth
      type: authentication_guide
    - title: Gmail API quotas
      url: https://developers.google.com/gmail/api/reference/quota
      type: rate_limits
    - title: Google Workspace Status
      url: https://www.google.com/appsstatus/
      type: status_page
    - title: Gmail API release notes
      url: https://developers.google.com/workspace/gmail/release-notes
      type: api_release_history
  releases:
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
    breakingChanges:
      1.0.0:
        message: >-
          The `profile` stream now uses `emailAddress` as its primary key. Gmail documents the
          affected count and size fields as int32, so they are now typed as integers instead of
          numbers: `profile.messagesTotal`, `profile.threadsTotal`; `labels_details.messagesTotal`,
          `messagesUnread`, `threadsTotal`, `threadsUnread`; `messages_details.sizeEstimate` and
          the nested `payload.body.size` and `payload.parts[].body.size` fields; and
          `threads_details.messages[].sizeEstimate` and the same nested fields under
          `messages[].payload`. The values don't change. If you sync the `profile`,
          `labels_details`, `messages_details` or `threads_details` streams, refresh the source
          schema after upgrading. Most destinations convert the columns automatically; a data
          refresh is needed only if a sync then fails with a schema-evolution error. See the
          [migration guide](https://docs.airbyte.com/integrations/sources/gmail-migrations#upgrading-to-100).
        upgradeDeadline: "2026-11-10"
        deadlineAction: auto_upgrade
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - profile
              - labels_details
              - messages_details
              - threads_details
