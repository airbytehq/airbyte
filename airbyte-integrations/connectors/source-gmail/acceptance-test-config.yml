# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-gmail:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
  incremental:
    bypass_reason: "The CDK standard tests do not collect incremental-only configs, and the parent messages list is filtered by start_date rather than the messages_details cursor, so an incremental re-sync re-reads every message ID"
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
