# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-gmail:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
  incremental:
    bypass_reason: "The parent messages list is filtered by start_date, not by the messages_details cursor, so an incremental re-sync re-reads every message ID; the CDK standard tests do not run incremental scenarios yet"
  full_refresh:
    bypass_reason: "Full refresh reads are covered by basic_read; the CDK standard tests do not run a separate full_refresh scenario"
