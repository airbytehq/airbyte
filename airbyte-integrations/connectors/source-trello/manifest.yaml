                height:
                  type: ["null", "integer"]
                url:
                  type: ["null", "string"]
          backgroundTile:
            type: ["null", "boolean"]
          backgroundBrightness:
            type: ["null", "string"]
          backgroundBottomColor:
            type: ["null", "string"]
          backgroundTopColor:
            type: ["null", "string"]
          canBePublic:
            type: ["null", "boolean"]
          canBeEnterprise:
            type: ["null", "boolean"]
          canBeOrg:
            type: ["null", "boolean"]
          canBePrivate:
            type: ["null", "boolean"]
          canInvite:
            type: ["null", "boolean"]
      subscribed:
