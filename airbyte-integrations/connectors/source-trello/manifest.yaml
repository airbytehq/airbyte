      closed:
        type: ["null", "boolean"]
      idOrganization:
        type: ["null", "string"]
      idEnterprise:
        type: ["null", "string"]
      limits:
        type: ["null", "object"]
        properties:
          attachments:
            type: ["null", "object"]
            properties:
              perBoard:
                type: ["null", "object"]
