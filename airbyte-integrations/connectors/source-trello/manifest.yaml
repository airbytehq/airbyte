        format: date-time
      datePluginDisable:
        type: ["null", "string"]
        format: date-time
      creationMethod:
        type: ["null", "string"]
      ixUpdate:
        type: ["null", "string"]
      enterpriseOwned:
        type: ["null", "boolean"]
      idBoardSource:
        type: ["null", "string"]
      id:
        type: string
      starred:
        type: ["null", "boolean"]
      url:
        type: ["null", "string"]
      powerUps:
        type: ["null", "array"]
        items:
          type: ["null", "string"]
      premiumFeatures:
        type: ["null", "array"]
        items:
          type: ["null", "string"]
      idTags:
        type: ["null", "array"]
        items:
          type: ["null", "string"]
      prefs:
        type: ["null", "object"]
        properties:
