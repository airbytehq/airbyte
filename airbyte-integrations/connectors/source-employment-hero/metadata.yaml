metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - "api.employmenthero.com"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-employment-hero
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.35.0@sha256:0557872c74928d6b338b208a97fe52e9e8aed8d9674d85d5b5b540bf91c8110c
  connectorSubtype: api
  connectorType: source
  definitionId: e2db518e-ef68-40bb-a2b6-b9f9aabbadb3
  dockerImageTag: 0.1.1
  dockerRepository: airbyte/source-employment-hero
  githubIssueLabel: source-employment-hero
  icon: icon.svg
  license: ELv2
  name: Employment-Hero
  releaseDate: 2024-09-25
  releases:
    breakingChanges:
      0.1.0:
        message: >-
          Authentication now uses the Employment Hero OAuth 2.0 refresh-token flow
          instead of a static access token. Employment Hero access tokens expire
          after 15 minutes, so every existing connection using the `API Key`
          field fails with `Unauthorized`. All users must edit the source and
          enter the OAuth application's Client ID, Client Secret and a Refresh
          Token. See the [Employment Hero migration guide](https://docs.airbyte.com/integrations/sources/employment-hero-migrations)
          for details.
        upgradeDeadline: "2026-10-21"
        deadlineAction: "disable"
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/employment-hero
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: Employment Hero API reference
      url: https://developer.employmenthero.com/
      type: api_reference
    - title: Employment Hero authentication
      url: https://developer.employmenthero.com/api-references/authentication
      type: authentication_guide
