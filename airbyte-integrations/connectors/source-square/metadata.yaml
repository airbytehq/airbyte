data:
  ab_internal:
    ql: 300
    sl: 100
  allowedHosts:
    hosts:
      - connect.squareupsandbox.com
      - connect.squareup.com
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.28.4@sha256:da2dee37f8b6532edfcbde6b5402a14e5d7364b2b7dbfbcb61e9cad85c25fe63
  connectorSubtype: api
  connectorType: source
  definitionId: 77225a51-cd15-4a13-af02-65816bd0ecf4
  dockerImageTag: 1.7.29
  dockerRepository: airbyte/source-square
  documentationUrl: https://docs.airbyte.com/integrations/sources/square
  githubIssueLabel: source-square
  icon: square.svg
  license: ELv2
  name: Square
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: beta
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-square
  supportLevel: community
  tags:
    - cdk:low-code
    - language:manifest-only
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: square_config_oauth_dev_null
          id: 83af0127-0962-4e07-ac73-c19f37326810
        - name: square_config_dev_null
          id: ac295afb-3984-45cc-9a67-73d35297671d
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-SQUARE__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE_SQUARE_OAUTH_CREDS
          fileName: config_oauth.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: Square API reference
      url: https://developer.squareup.com/reference/square
      type: api_reference
    - title: Square API Release Notes
      url: https://developer.squareup.com/docs/release-notes
      type: api_release_history
    - title: Square Connect API changelog
      url: https://developer.squareup.com/docs/changelog/connect
      type: api_release_history
    - title: Square API lifecycle (deprecation and retirement policy)
      url: https://developer.squareup.com/docs/build-basics/api-lifecycle
      type: api_deprecations
    - title: Square Labor API (Shift to Timecard migration)
      url: https://developer.squareup.com/docs/labor-api/what-it-does
      type: api_reference
    - title: Square authentication
      url: https://developer.squareup.com/docs/build-basics/access-tokens
      type: authentication_guide
    - title: Square OAuth API overview
      url: https://developer.squareup.com/docs/oauth-api/overview
      type: authentication_guide
    - title: Square Status
      url: https://www.issquareup.com/
      type: status_page
metadataSpecVersion: "1.0"
