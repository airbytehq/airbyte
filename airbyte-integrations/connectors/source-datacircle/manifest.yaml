version: 7.48.0

type: DeclarativeSource

description: >-
  Datacircle benchmarks the GTM APIs (LinkedIn profiles, email finders, company data, web search and more) and ranks
  every plan on its sheet at https://datacircle.dev. This source reads its open API, with no key: every API, who is best
  for each, every plan with its price and score, and a provider's ranks.

check:
  type: CheckStream
  stream_names:
    - apis
    - plans

definitions:
  requester:
    type: HttpRequester
    http_method: GET
    request_headers:
      Accept: application/json
    error_handler:
      type: DefaultErrorHandler
      max_retries: 5
      backoff_strategies:
        - type: WaitTimeFromHeader
          header: Retry-After
        - type: ExponentialBackoffStrategy
          factor: 5
      response_filters:
        - type: HttpResponseFilter
          http_codes:
            - 400
          action: FAIL
          failure_type: config_error
          error_message: '{{ response.get("error") }}'

  apis_stream:
    type: DeclarativeStream
    name: apis
    primary_key:
      - slug
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        url: https://api.datacircle.dev/v1/apis
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/apis'

  # The APIs best_plans reads: every API, or the one the config's API names.
  chosen_apis_stream:
    $ref: '#/definitions/apis_stream'
    name: chosen_apis
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        url: https://api.datacircle.dev/v1/apis
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
        record_filter:
          type: RecordFilter
          condition: >-
            {{ not config.get("api") or record["slug"] == config["api"].strip()
            or record["api"] | lower == config["api"].strip() | lower }}

  best_plans_stream:
    type: DeclarativeStream
    name: best_plans
    primary_key:
      - api_slug
      - rank
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url: https://api.datacircle.dev/v1/apis/{{ stream_partition.api_slug }}/best
        http_method: GET
        request_headers:
          Accept: application/json
        request_parameters:
          limit: '{{ config.get("best_plans_limit") or 10 }}'
        error_handler:
          type: DefaultErrorHandler
          max_retries: 5
          backoff_strategies:
            - type: WaitTimeFromHeader
              header: Retry-After
            - type: ExponentialBackoffStrategy
              factor: 5
          response_filters:
            # An API taken off the sheet between the two calls.
            - type: HttpResponseFilter
              http_codes:
                - 404
              action: IGNORE
            - type: HttpResponseFilter
              http_codes:
                - 400
              action: FAIL
              failure_type: config_error
              error_message: '{{ response.get("error") }}'
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - plans
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: '#/definitions/chosen_apis_stream'
            parent_key: slug
            partition_field: api_slug
    transformations:
      - type: AddFields
        fields:
          - path:
              - api_slug
            value: '{{ stream_partition.api_slug }}'
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/best_plans'

  plans_stream:
    type: DeclarativeStream
    name: plans
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        url: https://api.datacircle.dev/v1/plans
        request_parameters:
          api: '{{ config.get("api", "").strip() }}'
          query: '{{ config.get("query", "").strip() }}'
          sort: score
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - plans
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: limit
        page_token_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: offset
        pagination_strategy:
          type: OffsetIncrement
          page_size: 50
          inject_on_first_request: false
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/plans'

  providers_stream:
    type: DeclarativeStream
    name: providers
    primary_key:
      - slug
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url: https://api.datacircle.dev/v1/providers/{{ stream_partition.provider_slug }}
        http_method: GET
        request_headers:
          Accept: application/json
        error_handler:
          type: DefaultErrorHandler
          max_retries: 5
          backoff_strategies:
            - type: WaitTimeFromHeader
              header: Retry-After
            - type: ExponentialBackoffStrategy
              factor: 5
          response_filters:
            - type: HttpResponseFilter
              http_codes:
                - 404
              action: FAIL
              failure_type: config_error
              error_message: '{{ response.get("error") }}'
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      partition_router:
        type: ListPartitionRouter
        cursor_field: provider_slug
        values: '{{ config.get("providers") or [] }}'
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/providers'

streams:
  - $ref: '#/definitions/apis_stream'
  - $ref: '#/definitions/best_plans_stream'
  - $ref: '#/definitions/plans_stream'
  - $ref: '#/definitions/providers_stream'

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: 2

api_budget:
  type: HTTPAPIBudget
  policies:
    # The API answers at most 60 calls a minute from one address.
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 55
          interval: PT1M
      matchers: []

spec:
  type: Spec
  documentation_url: https://docs.airbyte.com/integrations/sources/datacircle
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required: []
    additionalProperties: true
    properties:
      api:
        type: string
        title: API
        description: >-
          Sync one API only, by its name or its slug as the apis stream gives them (linkedin-profile, email-finder).
          The plans and best_plans streams then read that API's plans alone. Every API when left empty.
        examples:
          - linkedin-profile
          - email-finder
        order: 0
      query:
        type: string
        title: Search words
        description: >-
          Sync only the plans whose provider or plan name holds every one of these words, ignoring case and accents.
        examples:
          - bright data
        order: 1
      best_plans_limit:
        type: integer
        title: Best plans per API
        description: How many plans the best_plans stream reads for each API, best first, from 1 to 50.
        default: 10
        minimum: 1
        maximum: 50
        order: 2
      providers:
        type: array
        title: Providers
        description: >-
          The providers the providers stream reads, each by its slug: its name in lowercase letters and digits, the rest
          a hyphen (bright-data for Bright Data). Left empty, that stream reads none.
        items:
          type: string
        examples:
          - - bright-data
        order: 3

