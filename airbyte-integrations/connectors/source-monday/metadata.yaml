data:
  ab_internal:
    ql: 200
    sl: 200
  allowedHosts:
    hosts:
      - api.monday.com
      - auth.monday.com
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.30.0@sha256:a249dd191ff2b4e5a7c6fd3749395d4a2f5beee988165ebabfacb17199e5b378
  connectorSubtype: api
  connectorType: source
  definitionId: 80a54ea2-9959-4040-aac1-eee42423ec9b
  dockerImageTag: 3.0.0
  releases:
    rolloutConfiguration:
      enableProgressiveRollout: false
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
    breakingChanges:
      3.0.0:
        message: "Monday.com is moving to OAuth 2.1 and stops accepting legacy OAuth access tokens on 2026-10-01 (https://developer-community.monday.com/product-updates/oauth-2-1-is-now-open-for-all-monday-developers-5326). The connector now authenticates through Monday's new token endpoint with PKCE and rotating refresh tokens. Sources that use the OAuth2.0 authorization method stop syncing after the upgrade until they are re-authenticated once (Authenticate your Monday account); sources that use a Personal API Token are not affected. See the [migration guide](https://docs.airbyte.com/integrations/sources/monday-migrations#upgrading-to-300) for details."
        upgradeDeadline: "2026-09-30"
        deadlineAction: "auto_upgrade"
      2.0.0:
        message: "Source Monday has deprecated API version 2023-07. We have upgraded the connector to the latest API version 2024-01. In this new version, the Id field has changed from an integer to a string in the streams Boards, Items, Tags, Teams, Updates, Users and Workspaces. Please reset affected streams."
        upgradeDeadline: "2024-01-15"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              [
                "boards",
                "items",
                "tags",
                "teams",
                "updates",
                "users",
                "workspaces",
              ]
  dockerRepository: airbyte/source-monday
  documentationUrl: https://docs.airbyte.com/integrations/sources/monday
  githubIssueLabel: source-monday
  icon: monday.svg
  license: ELv2
  maxSecondsBetweenMessages: 60
  name: Monday
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-monday
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  suggestedStreams:
    streams:
      - items
      - boards
  supportLevel: certified
  tags:
    - language:manifest-only
    - cdk:low-code
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: monday_config_oauth_dev_null
          id: 42a1b99a-0ef5-4442-945e-e4291376fb55
        - name: monday_config_dev_null
          id: 4533adbf-ea50-44ae-bafd-62bccad2ddf3
        - name: monday_config_api_token_dev_null
          id: 81b8f4db-d37f-4135-9a55-d62e0a163701
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE_MONDAY_API_CREDS
          fileName: config_api_token.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE_MONDAY_CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE_MONDAY_OAUTH_CREDS
          fileName: config_oauth.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: monday.com API reference
      url: https://developer.monday.com/api-reference/docs
      type: api_reference
    - title: monday.com API release notes
      url: https://developer.monday.com/api-reference/docs/release-notes
      type: api_release_history
    - title: monday.com API changelog
      url: https://developer.monday.com/api-reference/changelog
      type: api_release_history
    - title: monday.com API versioning and deprecation policy
      url: https://developer.monday.com/api-reference/docs/api-versioning
      type: api_deprecations
    - title: monday.com authentication
      url: https://developer.monday.com/api-reference/docs/authentication
      type: authentication_guide
    - title: monday.com OAuth and permissions
      url: https://developer.monday.com/apps/docs/oauth
      type: authentication_guide
    - title: monday.com OAuth 2.1 migration guide
      url: https://developer.monday.com/apps/docs/migrating-to-the-new-oauth-flow
      type: api_deprecations
    - title: monday.com rate limits
      url: https://developer.monday.com/api-reference/docs/rate-limits
      type: rate_limits
    - title: monday.com Status
      url: https://status.monday.com/
      type: status_page
    - title: monday.com GraphQL API schema repository
      url: https://github.com/mondaycom/monday-graphql-api
      type: spec_repository
    - title: monday.com User entity migration guide (2026-04 to 2026-10)
      url: https://developer.monday.com/api-reference/docs/migrating-user-entity-to-2026-10
      type: api_deprecations
metadataSpecVersion: "1.0"
