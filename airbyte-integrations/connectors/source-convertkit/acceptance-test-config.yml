# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-convertkit:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    bypass_reason: "The CI test secret predates the 0.3.0 spec (no start_date or credentials) and its API key is rejected by the Kit v4 API. Refreshing it needs a Kit account. Live tests are bypassed until a new secret is stored."
  basic_read:
    bypass_reason: "The CI test secret predates the 0.3.0 spec (no start_date or credentials) and its API key is rejected by the Kit v4 API. Refreshing it needs a Kit account. Live tests are bypassed until a new secret is stored."
