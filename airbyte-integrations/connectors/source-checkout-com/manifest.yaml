spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - credentials
    additionalProperties: true
    properties:
      credentials:
        title: Authentication
        type: object
        order: 0
        oneOf:
          - title: OAuth (access key)
            type: object
            required:
              - auth_type
              - client_id
              - client_secret
            properties:
              auth_type:
                type: string
                const: oauth
                order: 0
              client_id:
                title: Access key ID
                type: string
                airbyte_secret: true
                order: 1
                description: Access key ID (starts with ack_) from Developers > Keys in the Checkout.com Dashboard.
              client_secret:
                title: Access key secret
                type: string
                airbyte_secret: true
                order: 2
          - title: Secret API key
            type: object
            required:
              - auth_type
              - secret_key
            properties:
              auth_type:
                type: string
                const: secret_key
                order: 0
              secret_key:
                title: Secret key
                type: string
                airbyte_secret: true
                order: 1
                description: Secret API key (sk_... or sk_sbox_...).
      environment:
        title: Environment
        type: string
        enum:
          - production
          - sandbox
        default: production
        order: 1
      account_prefix:
        title: Account prefix
        type: string
        order: 2
        description:
          The unique prefix of your base URL (the part before .api.checkout.com), shown in the Dashboard under
          Developers > Overview. Leave empty to use the global api.checkout.com host.
      start_date:
        title: Start date
        type: string
        format: date-time
        order: 3
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        examples:
          - "2026-01-01T00:00:00Z"
        description:
          UTC date and time to start syncing from. Defaults to 90 days ago, which is the payments search default
          lookback.
      payments_window_minutes:
        title: Payments search window (minutes)
        type: integer
        minimum: 1
        maximum: 1440
        default: 60
        order: 4
        description:
          Payments are read through the search API one time window at a time, up to 1,000 payments per window.
          Lower this if a sync fails because a window held more than 1,000 payments.
      payments_query:
        title: Payments search query
