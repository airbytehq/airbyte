      step: PT{{ config.get('payments_window_minutes', 60) }}M
      cursor_granularity: PT0S
      start_time_option:
        type: RequestOption
        inject_into: body_json
        field_name: from
      end_time_option:
        type: RequestOption
        inject_into: body_json
        field_name: to
    transformations:
      - type: AddFields
