version: 7.45.0
type: DeclarativeSource
description: Sync disputes, payments, payment actions, financial actions, reports and workflows from the Checkout.com API.
check:
  type: CheckStream
  stream_names:
    - disputes
definitions:
  error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    response_filters:
      - &id001
        type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 401
          - 403
        error_message:
          Checkout.com rejected the credentials (HTTP {{ response.status_code if response is defined else '' }}).
          Check that they belong to the selected environment and have the scope this stream needs (disputes:view, payments:search,
          gateway:payment-details, reports:view, flow:workflows, financial-actions:view).
      - &id002
        type: HttpResponseFilter
        action: RETRY
        http_codes:
          - 429
          - 500
          - 502
          - 503
          - 504
    backoff_strategies: &id003
      - type: ExponentialBackoffStrategy
        factor: 5
  authenticator:
    type: SelectiveAuthenticator
    authenticator_selection_path:
      - credentials
      - auth_type
    authenticators:
      oauth:
        type: OAuthAuthenticator
        client_id: "{{ config['credentials']['client_id'] }}"
        client_secret: "{{ config['credentials']['client_secret'] }}"
        grant_type: client_credentials
        token_refresh_endpoint:
          https://{{ config['account_prefix'] ~ '.' if config.get('account_prefix') else '' }}access.{{
          'sandbox.' if config.get('environment') == 'sandbox' else '' }}checkout.com/connect/token
      secret_key:
        type: BearerAuthenticator
        api_token: "{{ config['credentials']['secret_key'] }}"
  base_requester:
    type: HttpRequester
    url_base:
      https://{{ config['account_prefix'] ~ '.' if config.get('account_prefix') else '' }}api.{{ 'sandbox.' if config.get('environment')
      == 'sandbox' else '' }}checkout.com
    http_method: GET
    authenticator:
      $ref: "#/definitions/authenticator"
    error_handler:
      $ref: "#/definitions/error_handler"
streams:
  - type: DeclarativeStream
    name: disputes
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/base_requester"
        path: /disputes
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: limit
        page_token_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: skip
        pagination_strategy:
          type: OffsetIncrement
          page_size: 250
          inject_on_first_request: false
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: last_update
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%S.%fZ"
        - "%Y-%m-%dT%H:%M:%SZ"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config.get('start_date') or day_delta(-90, format='%Y-%m-%dT%H:%M:%SZ') }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      step: P30D
      cursor_granularity: PT0S
      start_time_option:
        type: RequestOption
        inject_into: request_parameter
        field_name: from
      end_time_option:
        type: RequestOption
        inject_into: request_parameter
        field_name: to
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - last_update
            value:
              "{{ format_datetime(record['last_update'], '%Y-%m-%dT%H:%M:%S.%fZ') if record.get('last_update') else None
              }}"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          id:
            type:
              - "null"
              - string
          entity_id:
            type:
              - "null"
