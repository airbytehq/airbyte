            additionalProperties: true
            properties:
              self:
                type:
                  - "null"
                  - object
                additionalProperties: true
                properties:
                  href: {}
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: true
  - type: DeclarativeStream
    name: payments
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/base_requester"
        path: /payments/search
        http_method: POST
        request_body_json:
          query: "{{ config.get('payments_query') or 'amount:>=0' }}"
          limit: 1000
        error_handler:
          type: DefaultErrorHandler
          max_retries: 5
          response_filters:
            - *id001
            - *id002
            - type: HttpResponseFilter
              action: FAIL
              failure_type: config_error
              predicate: "{{ 'next' in response.get('_links', {}) or response.get('data', []) | length >= 1000 }}"
              error_message:
                A Checkout.com payments search window held more than 1,000 payments. Lower the payments search window
                so every window fits in a single page; no payments were skipped.
          backoff_strategies: *id003
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: requested_on
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%S.%fZ"
        - "%Y-%m-%dT%H:%M:%SZ"
