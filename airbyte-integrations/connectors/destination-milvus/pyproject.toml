[build-system]
requires = [ "poetry-core>=1.0.0",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "airbyte-destination-milvus"
version = "0.0.61"
description = "Airbyte destination implementation for Milvus."
authors = ["Airbyte <contact@airbyte.io>"]
license = "ELv2"
readme = "README.md"
documentation = "https://docs.airbyte.com/integrations/destinations/milvus"
homepage = "https://airbyte.com"
repository = "https://github.com/airbytehq/airbyte"

[[tool.poetry.packages]]
include = "destination_milvus"

[tool.poetry.dependencies]
python = "^3.10,<3.12"
airbyte-cdk = { version = ">=7.7.0,<8.0.0", extras = ["vector-db-based"] }
# environs 9.5.0, pulled in by pymilvus, reads marshmallow.__version_info__, removed in marshmallow 4.
marshmallow = ">=3.20,<4.0"
pymilvus = "2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
ruff = "^0.3.2"
mypy = "^1.9.0"

[tool.poetry.scripts]
destination-milvus = "destination_milvus.run:run"


[tool.poe]
include = [
    # Shared tasks definition file(s) can be imported here.
    # Run `poe` or `poe --help` to see the list of available tasks.
    "${POE_GIT_DIR}/poe-tasks/poetry-connector-tasks.toml",
]
