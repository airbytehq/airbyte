[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-quickbooks-tests"
version = "0.0.1"
description = "Unit tests for source-quickbooks"
authors = ["Airbyte <contact@airbyte.io>"]

[tool.poetry.dependencies]
python = "^3.10,<3.13"
airbyte-cdk = "^7"
pytest = "^8"
pyyaml = "^6"
jinja2 = "^3"
freezegun = "^1"
requests-mock = "^1"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*",
]
