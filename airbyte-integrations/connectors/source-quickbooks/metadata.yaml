data:
  allowedHosts:
    hosts:
      - sandbox-quickbooks.api.intuit.com
      - quickbooks.api.intuit.com
      - oauth.platform.intuit.com
  connectorSubtype: api
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.30.0@sha256:a249dd191ff2b4e5a7c6fd3749395d4a2f5beee988165ebabfacb17199e5b378
  connectorType: source
  definitionId: cf9c4355-b171-4477-8f2d-6c5cc5fc8b7e
  dockerImageTag: 4.2.0
  dockerRepository: airbyte/source-quickbooks
  githubIssueLabel: source-quickbooks
  icon: quickbooks.svg
  license: ELv2
  maxSecondsBetweenMessages: 5400
  name: QuickBooks
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-quickbooks
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  suggestedStreams:
    streams:
      - invoices
      - customers
      - items
      - payments
      - accounts
      - journal_entries
  releaseStage: generally_available
  releases:
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
    breakingChanges:
      3.0.0:
        message:
          "Some fields in `bills`, `credit_memos`, `items`, `refund_receipts`,
          and `sales_receipts` streams have been changed from `integer` to `number`
          to fix normalization. You may need to refresh the connection schema for
          those streams (skipping the reset), and running a sync. Alternatively, you
          can just run a reset."
        upgradeDeadline: "2023-10-04"
      4.0.0:
        message:
          "The config no longer has a nested credentials field, while the config
          fields remain the same, they are now at the root level instead of being
          nested inside a credentials object. This is done to fix the refresh
          token issue where it wasn't getting updated after 24 hours. Connections
          created before 4.0.0 had to repopulate the config fields; since 4.2.0 the
          connector migrates a nested `credentials` config to the root-level fields
          automatically, so no manual repopulation is needed."
        upgradeDeadline: "2025-02-15"
  documentationUrl: https://docs.airbyte.com/integrations/sources/quickbooks
  tags:
    - cdk:low-code
    - language:manifest-only
  ab_internal:
    sl: 200
    ql: 300
  supportLevel: certified
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: quickbooks_config_dev_null
          id: 211394cc-91d6-4450-9563-fa0be54a6c25
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-QUICKBOOKS__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: QuickBooks Online API
      url: https://developer.intuit.com/app/developer/qbo/docs/api/accounting/all-entities/account
      type: api_reference
    - title: QuickBooks Online API Changelog
      url: https://developer.intuit.com/app/developer/qbo/docs/changelog
      type: api_release_history
    - title: QuickBooks authentication
      url: https://developer.intuit.com/app/developer/qbo/docs/develop/authentication-and-authorization
      type: authentication_guide
    - title: QuickBooks rate limits
      url: https://developer.intuit.com/app/developer/qbo/docs/develop/troubleshooting/error-codes#rate-limits
      type: rate_limits
metadataSpecVersion: "1.0"
