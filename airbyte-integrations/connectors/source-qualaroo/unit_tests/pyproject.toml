[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-qualaroo-tests"
version = "0.0.0"
description = "Unit tests for source-qualaroo"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10,<3.13"
airbyte-cdk = "^7"
pytest = "^8"
requests_mock = "^1"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*"
]
