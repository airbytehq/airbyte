            sort_creative_set_id: ASC
            sort_asset_id: ASC
        record_selector:
          $ref: "#/definitions/base_record_selector"
        paginator:
          $ref: "#/definitions/base_paginator"
      incremental_sync:
        $ref: "#/definitions/asset_report_incremental_sync"
      transformations:
