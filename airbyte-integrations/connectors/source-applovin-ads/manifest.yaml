          fields:
            - type: AddedFieldDefinition
              path:
                - date
              value: "{{ stream_slice.start_time }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/asset_report_daily"

streams:
  - $ref: "#/definitions/streams/advertiser_report_daily"
  - $ref: "#/definitions/streams/advertiser_report_hourly"
  - $ref: "#/definitions/streams/web_report_daily"
  - $ref: "#/definitions/streams/web_report_hourly"
  - $ref: "#/definitions/streams/asset_report_daily"

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    title: AppLovin Ads Source Spec
    required:
      - api_key
      - start_date
    properties:
      api_key:
        type: string
        title: Report Key
        description: >-
          Your AppLovin Report Key. In the AppLovin dashboard, click your account
          in the top right and select Keys. The Management Key, Campaign
          Management Key, and CAPI Key do not work for reporting.
        airbyte_secret: true
        order: 0
      start_date:
        type: string
        title: Start Date
        description: >-
          UTC date to start replicating from, in YYYY-MM-DD format. AppLovin only
          serves the last 45 days for app campaign and asset reports, the last
          90 days for web campaign reports, and the last 30 days for the hourly
          reports, so earlier dates are clamped to the oldest available day.
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2026-01-01"
        order: 1
      end_date:
        type: string
        title: End Date
        description: >-
          UTC date to replicate up to, inclusive, in YYYY-MM-DD format. Defaults
          to today.
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2026-06-30"
        order: 2
      lookback_window:
        type: integer
        title: Lookback Window (days)
        description: >-
          Number of days before the last synced date to re-request on every
          incremental sync. AppLovin restates recent metrics as attribution
          arrives, so a lookback keeps already-synced days up to date.
        default: 3
        minimum: 0
        maximum: 45
        order: 3
      attribution_mode:
        type: string
        title: Web Attribution Mode
        description: >-
          Attribution mode for the web campaign reports. Click counts
          click-through conversions only; click and view also counts
          view-through conversions.
        enum:
          - click
          - click_and_view
        default: click
        order: 4
      num_workers:
        type: integer
        title: Number of Concurrent Workers
        description: Number of streams to sync concurrently.
        default: 2
        minimum: 1
        maximum: 20
        order: 5
    additionalProperties: true

metadata:
  autoImportSchema:
    advertiser_report_daily: false
    advertiser_report_hourly: false
    web_report_daily: false
    web_report_hourly: false
    asset_report_daily: false
  yamlComponents:
    global:
      - authenticator

