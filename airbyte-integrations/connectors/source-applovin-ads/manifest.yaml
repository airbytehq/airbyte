spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    title: AppLovin Ads Source Spec
    required:
      - api_key
      - start_date
    properties:
      api_key:
        type: string
        title: Report Key
        description: >-
          Your AppLovin Report Key. In the AppLovin dashboard, click your account
          in the top right and select Keys. The Management Key, Campaign
          Management Key, and CAPI Key do not work for reporting.
        airbyte_secret: true
        order: 0
      start_date:
        type: string
        title: Start Date
        description: >-
          UTC date to start replicating from, in YYYY-MM-DD format. AppLovin only
          serves the last 45 days for app campaign and asset reports, and the last
          90 days for web campaign reports, so earlier dates are clamped to the
          oldest available day.
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2026-01-01"
        order: 1
      end_date:
        type: string
        title: End Date
        description: >-
          UTC date to replicate up to, inclusive, in YYYY-MM-DD format. Defaults
          to today.
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2026-06-30"
        order: 2
      lookback_window:
        type: integer
        title: Lookback Window (days)
        description: >-
          Number of days before the last synced date to re-request on every
          incremental sync. AppLovin restates recent metrics as attribution
          arrives, so a lookback keeps already-synced days up to date.
        default: 3
        minimum: 0
        maximum: 45
        order: 3
      cohort_lookback_window:
        type: integer
        title: Cohort Lookback Window (days)
        description: >-
          Number of days before the last synced date to re-request for the MAX
          cohort streams. Cohort metrics are indexed by install day and keep
          changing as the cohort ages, so a given day's 45-day figures are not
          final until 45 days after that day. Lowering this reduces request
          volume at the cost of leaving older cohorts stale.
        default: 45
        minimum: 0
        maximum: 45
        order: 4
      attribution_mode:
        type: string
        title: Web Attribution Mode
        description: >-
          Attribution mode for the web campaign report. Click counts
          click-through conversions only; click and view also counts
          view-through conversions.
        enum:
          - click
          - click_and_view
        default: click
        order: 5
      num_workers:
        type: integer
        title: Number of Concurrent Workers
        description: Number of streams to sync concurrently.
        default: 2
        minimum: 1
        maximum: 20
        order: 6
    additionalProperties: true

metadata:
  autoImportSchema:
    advertiser_report_daily: false
    web_report_daily: false
    asset_report_daily: false
    max_report_daily: false
    max_cohort_revenue_daily: false
    max_cohort_impressions_daily: false
    max_cohort_sessions_daily: false
  yamlComponents:
    global:
      - authenticator

