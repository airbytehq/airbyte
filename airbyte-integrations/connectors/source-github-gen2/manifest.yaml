version: 7.23.1
type: DeclarativeSource
check:
  type: CheckStream
  stream_names:
  - repositories
definitions:
  selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path: []
    schema_normalization: Default
  requester:
    type: HttpRequester
    url_base: "{{ config.get('api_url', 'https://api.github.com').rstrip('/') }}"
    http_method: GET
    authenticator:
      type: BearerAuthenticator
      api_token: "{{ config['access_token'] }}"
    request_headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: '2022-11-28'
  paginator:
    type: DefaultPaginator
    page_size_option:
      type: RequestOption
      field_name: per_page
      inject_into: request_parameter
    page_token_option:
      type: RequestPath
    pagination_strategy:
      type: CursorPagination
      page_size: 100
      cursor_value: "{{ headers.link.next.url }}"
      stop_condition: "{{ 'next' not in headers.link }}"
  repository_partition_router:
    type: ListPartitionRouter
    cursor_field: repository
    values: "{{ config['repositories'] }}"
  base_repo_retriever:
    type: SimpleRetriever
    record_selector:
      $ref: '#/definitions/selector'
    requester:
      $ref: '#/definitions/requester'
    paginator:
      $ref: '#/definitions/paginator'
    partition_router:
      $ref: '#/definitions/repository_partition_router'
  incremental_sync_with_since:
    type: DatetimeBasedCursor
    cursor_field: updated_at
    cursor_datetime_formats:
    - '%Y-%m-%dT%H:%M:%SZ'
    datetime_format: '%Y-%m-%dT%H:%M:%SZ'
    start_datetime: "{{ config.get('start_date', '2010-01-01T00:00:00Z') }}"
    start_time_option:
      type: RequestOption
      field_name: since
      inject_into: request_parameter
  incremental_sync_commits:
    type: DatetimeBasedCursor
    cursor_field: commit_committer_date
    cursor_datetime_formats:
    - '%Y-%m-%dT%H:%M:%SZ'
    datetime_format: '%Y-%m-%dT%H:%M:%SZ'
    start_datetime: "{{ config.get('start_date', '2010-01-01T00:00:00Z') }}"
    start_time_option:
      type: RequestOption
      field_name: since
      inject_into: request_parameter
  incremental_sync_workflow_runs:
    type: DatetimeBasedCursor
    cursor_field: updated_at
    cursor_datetime_formats:
    - '%Y-%m-%dT%H:%M:%SZ'
    datetime_format: '%Y-%m-%dT%H:%M:%SZ'
    start_datetime: "{{ config.get('start_date', '2010-01-01T00:00:00Z') }}"
    start_time_option:
      type: RequestOption
      field_name: created
      inject_into: request_parameter
  repositories_stream:
    type: DeclarativeStream
    name: repositories
    primary_key:
    - id
    retriever:
      type: SimpleRetriever
      record_selector:
        $ref: '#/definitions/selector'
      requester:
        $ref: '#/definitions/requester'
        path: "/repos/{{ stream_slice.repository }}"
      paginator:
        type: NoPagination
      partition_router:
        $ref: '#/definitions/repository_partition_router'
    transformations:
    - type: AddFields
      fields:
      - path:
        - api_url
        value: "{{ record.get('url') }}"
      - path:
        - owner_id
        value: "{{ record.get('owner', {}).get('id') }}"
      - path:
        - owner_login
        value: "{{ record.get('owner', {}).get('login') }}"
      - path:
        - owner_type
        value: "{{ record.get('owner', {}).get('type') }}"
      - path:
        - license_key
        value: "{{ record.get('license', {}).get('key') if record.get('license') else None }}"
      - path:
