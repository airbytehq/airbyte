plugins {
    id 'airbyte-bulk-connector'
    id "io.airbyte.gradle.docker"
    id 'airbyte-connector-docker-convention'
}

application {
    mainClass = 'io.airbyte.integrations.source.bigquery.BigQuerySource'
    // The read streams rows with a bounded heap, and the Storage Read API path
    // ('use_storage_read_api') additionally uses Apache Arrow OFF-HEAP direct memory. Override the
    // Bulk CDK default JVM args (which pre-commit and cap the heap at 75% of the container via
    // Initial/MaxRAMPercentage): pre-committing 75% and then allocating Arrow off-heap on top
    // inflates the pod's footprint and, on small single-node deployments (e.g. abctl, where the
    // whole cluster shares one VM), starves co-located pods and gets the Airbyte server OOMKilled.
    // Cap the heap at 50% so Arrow and native memory have room inside the pod, don't pre-commit it,
    // keep fail-fast on heap exhaustion, and open java.nio for Arrow. Mirrors source-snowflake.
    applicationDefaultJvmArgs = [
            '-XX:+ExitOnOutOfMemoryError',
            '-XX:MaxRAMPercentage=50.0',
            '--add-opens=java.base/java.nio=ALL-UNNAMED',
    ]
}

airbyteBulkConnector {
    core = 'extract'
    toolkits = ['extract-jdbc']
}

dependencies {
    // Google's official, Apache-2.0 licensed BigQuery JDBC driver (java.sql.Driver via ServiceLoader).
    implementation 'com.google.cloud:google-cloud-bigquery-jdbc:1.4.0'
    // Native client, used for schema discovery (nested STRUCT/ARRAY fields and primary keys).
    // Same version as the one the JDBC driver above pulls in transitively.
    implementation 'com.google.cloud:google-cloud-bigquery:2.71.0'
    // Storage Read API client (google-cloud-bigquerystorage 3.33.0) and Apache Arrow 17.0.0 come
    // with the JDBC driver; the read path additionally needs Arrow's buffer decompression (LZ4
    // through commons-compress, ZSTD through zstd-jni). Same Arrow version as the driver's.
    implementation 'org.apache.arrow:arrow-compression:17.0.0'

    // ghcr.io/goccy/bigquery-emulator wrapper.
    testFixturesImplementation 'org.testcontainers:gcloud:1.21.4'
    testImplementation 'org.testcontainers:gcloud:1.21.4'
}

// Apache Arrow (Storage Read API read path) accesses java.nio.Buffer internals; the connector image
// gets this flag from applicationDefaultJvmArgs above, the test JVM needs it too.
tasks.withType(Test).configureEach {
    jvmArgs '--add-opens=java.base/java.nio=ALL-UNNAMED'
}
