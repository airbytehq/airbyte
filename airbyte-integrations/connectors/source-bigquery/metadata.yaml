  releases:
    breakingChanges:
      1.0.0:
        message:
          "**The BigQuery source has been rebuilt on Airbyte's Bulk CDK.** It reads tables through the
          BigQuery Storage Read API, checkpoints full refresh syncs so that large tables resume after an
          interruption, discovers nested `STRUCT` and `ARRAY` schemas and primary key constraints, and
          supports speed mode. Saved configurations and incremental sync state keep working.

          **What changed:** `DATE`, `DATETIME`, `TIME` and `TIMESTAMP` columns are now typed as Airbyte
          date and time types instead of strings, `JSON` columns as JSON, and `BYTES` columns declare their
          base64 encoding; `STRUCT` and `ARRAY` columns carry their nested schema; `PRIMARY KEY`
          constraints become source-defined primary keys; only columns of a supported cursor type can be
          chosen as the incremental cursor; and the credentials must be a service account key.

          **What to do:** after upgrading, refresh the source schema of your connections. If a sync fails
          after the type change, refresh the affected streams. Connections whose cursor column is a `BOOL`,
          `BYTES`, `JSON`, `STRUCT` or `ARRAY` column must choose a new cursor. See the
          [migration guide](https://docs.airbyte.com/integrations/sources/bigquery-migrations).
          "
        upgradeDeadline: "2026-12-31"
