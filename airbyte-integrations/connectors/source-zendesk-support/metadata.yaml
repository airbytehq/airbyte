data:
  ab_internal:
    ql: 400
    sl: 300
  allowedHosts:
    hosts:
      - ${subdomain}.zendesk.com
      - zendesk.com
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.35.0@sha256:0557872c74928d6b338b208a97fe52e9e8aed8d9674d85d5b5b540bf91c8110c
  connectorSubtype: api
  connectorType: source
  definitionId: 79c1aa37-dae3-42ae-b333-d1c105477715
  dockerImageTag: 6.0.0
  dockerRepository: airbyte/source-zendesk-support
  documentationUrl: https://docs.airbyte.com/integrations/sources/zendesk-support
  githubIssueLabel: source-zendesk-support
  icon: zendesk-support.svg
  license: ELv2
  maxSecondsBetweenMessages: 60
  name: Zendesk Support
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-zendesk-support
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  releases:
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
    breakingChanges:
      1.0.0:
        message: "`cursor_field` for `Tickets` stream is changed to `generated_timestamp`"
        upgradeDeadline: "2023-07-19"
      2.0.0:
        message: The `Deleted Tickets` stream was removed. Deleted tickets are still available from the Tickets stream.
        upgradeDeadline: "2023-10-04"
      3.0.0:
        message: "This version includes breaking changes to the `TicketsMetric` stream.  The cursor field has been updated to `generated_timestamp`. It is necessary to refresh the data and schema for the affected stream. Please see the migration guide for additional details."
        upgradeDeadline: "2024-09-09"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - "ticket_metrics"
      4.0.0:
        message: "This version includes breaking changes to the `Tags` stream. The pagination strategy has been changed from `Offset` to `Cursor-Based`. It is necessary to reset the stream. Please see the migration guide for additional details."
        upgradeDeadline: "2024-09-09"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - "tags"
      5.0.0:
        message: "This version adds OAuth2.0 with refresh token support. Users who authenticate via OAuth must re-authenticate to use the new flow with rotating refresh tokens."
        upgradeDeadline: "2026-01-30"
      6.0.0:
        message: >-
          Zendesk stops serving its Incremental Export APIs to third-party integrations such as Airbyte
          between 2026-12-02 and 2027-01-19, and versions before 6.0.0 stop syncing the affected streams once
          Zendesk blocks these calls for your account (Zendesk identifies integrations by their OAuth
          application, so connections that authenticate with an API token may be blocked later or not at all). This version reads `tickets`, `users`, `user_identities`,
          `organizations` and `articles` from Zendesk's list endpoints, `ticket_metrics` from the metric
          sets side-loaded on the ticket list (a first sync and a full-refresh sync now start at the Start
          Date instead of reading every metric set), and `ticket_comments`, `ticket_events` and
          `ticket_metric_events` ticket by ticket, as `side_conversations` and `ticket_audits_per_ticket`
          already did. The `tickets` cursor changes from `generated_timestamp` to `updated_at` and the
          `ticket_metric_events` cursor from `time` to `_ab_updated_at`; saved state is migrated
          automatically and no reset is required. Deleted tickets, deleted users (`active: false`) and deleted organizations
          are no longer replicated by these streams; use `deleted_tickets` for deleted tickets. `tickets`,
          `ticket_metrics` and `side_conversations` no longer reach archived tickets (use `tickets_search` for
          archived ticket records), while `ticket_comments`, `ticket_events`, `ticket_metric_events` and
          `ticket_audits_per_ticket` find them through Zendesk's search index. Incremental syncs no longer pick up ticket updates that
          change only `generated_timestamp`, and a ticket's metric events are read only when the ticket
          itself changes. Incremental sync modes keep the rows already in your destination; a sync mode
          that replaces the table, or a cleared stream, rebuilds it without those records, so back up
          such tables before upgrading if you need them. Connections still on an older version after 2026-12-02
          are upgraded automatically, so make that backup before then. Connections that sync only other streams are
          not affected. `ticket_events` records now carry the Ticket Audits
          API shape (`via` holds the channel name such as `web` instead of a label such as `Web form`,
          `child_events` keep the audit event fields, `updater_id` is the audit author, which is `-1` for
          changes Zendesk made itself and the API user instead of the requester for tickets created through
          the API). Syncs of the per-ticket streams make one request
          per created or updated ticket, and a changed ticket re-emits all of its comments, events,
          metric events and side conversations (deduplicate on `id`). See the migration guide: https://docs.airbyte.com/integrations/sources/zendesk-support-migrations#upgrading-to-600
        upgradeDeadline: "2026-12-02"
        deadlineAction: "auto_upgrade"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - "tickets"
              - "users"
              - "user_identities"
              - "organizations"
              - "articles"
              - "ticket_comments"
              - "ticket_events"
              - "ticket_metric_events"
              - "ticket_metrics"
              - "side_conversations"
              - "ticket_audits_per_ticket"
  suggestedStreams:
    streams:
      - brands
      - deleted_tickets
      - groups
      - organizations
      - satisfaction_ratings
      - tags
      - ticket_audits
      - ticket_comments
      - ticket_fields
      - ticket_forms
      - ticket_events
      - ticket_metric_events
      - ticket_metrics
      - tickets
      - users
  supportLevel: certified
  supportsFileTransfer: true
  tags:
    - cdk:low-code
    - language:manifest-only
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: zendesk-support_config_dev_null
          id: 0c87dd87-c04e-4fed-a86a-fa4b6acdfef6
        - name: zendesk-support_config_ticket_metrics_dev_null
          id: 36dad615-075b-46ed-8191-6436ca0abc29
        - name: zendesk-support_config_oauth_dev_null
          id: 3fef7ac6-3265-457d-9d18-cb0906ba6dde
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-ZENDESK-SUPPORT_OAUTH_CRED
          fileName: config_oauth.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE-ZENDESK-SUPPORT_TOKEN_CRED
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: Zendesk Support API
      url: https://developer.zendesk.com/api-reference/ticketing/introduction/
      type: api_reference
    - title: API Changelog
      url: https://developer.zendesk.com/api-reference/changelog/changelog/
      type: api_release_history
    - title: Zendesk API changelog
      url: https://developer.zendesk.com/api-reference/ticketing/introduction/#changes
      type: api_release_history
    - title: Zendesk authentication
      url: https://developer.zendesk.com/api-reference/ticketing/introduction/#security-and-authentication
      type: authentication_guide
    - title: Zendesk rate limits
      url: https://developer.zendesk.com/api-reference/ticketing/account-configuration/usage_limits/
      type: rate_limits
    - title: Zendesk Status
      url: https://status.zendesk.com/
      type: status_page
    - title: Zendesk feature removal announcements
      url: https://support.zendesk.com/hc/en-us/articles/4408843026714-What-is-being-removed-updated-April-2026
      type: api_deprecations
metadataSpecVersion: "1.0"
