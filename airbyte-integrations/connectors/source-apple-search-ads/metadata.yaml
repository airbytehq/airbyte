data:
  connectorSubtype: api
  connectorType: source
  definitionId: e59c8416-c2fa-4bd3-9e95-52677ea281c1
  dockerImageTag: 1.1.17
  dockerRepository: airbyte/source-apple-search-ads
  githubIssueLabel: source-apple-search-ads
  icon: icon.svg
  license: ELv2
  name: Apple Ads
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-apple-search-ads
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: alpha
  releases:
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
    breakingChanges:
      1.0.0:
        message: This release introduces changes to incremental sync of `adgroups_daily_reports` and `keywords_daily_reports` streams, changing stream's state from per-partition state to usage of a global state cursor. This will decrease the time of read for the streams. To migrate the Source Apple Ads to the new version, users will need to clear the affected streams. For more info please follow the process in migration guide.
        upgradeDeadline: "2025-11-04"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - "adgroups_report_daily"
              - "keywords_report_daily"
  maxSecondsBetweenMessages: 10800
  documentationUrl: https://docs.airbyte.com/integrations/sources/apple-search-ads
  tags:
    - cdk:low-code
    - language:manifest-only
  ab_internal:
    sl: 100
    ql: 100
  connectorTestSuitesOptions:
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-APPLE-SEARCH-ADS__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  supportLevel: community
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.30.0@sha256:a249dd191ff2b4e5a7c6fd3749395d4a2f5beee988165ebabfacb17199e5b378
  externalDocumentationUrls:
    - title: Apple Ads API reference
      url: https://developer.apple.com/documentation/apple_ads
      type: api_reference
    - title: Campaign Management API 5 release history (includes sunset notice)
      url: https://developer.apple.com/documentation/apple_ads/apple-search-ads-campaign-management-api-5
      type: api_release_history
    - title: Apple Ads Platform API changelog (successor API)
      url: https://developer.apple.com/documentation/apple-ads-platform-api/changelog-apple-ads-platform-api
      type: api_release_history
    - title: Authentication
      url: https://developer.apple.com/documentation/apple_ads/implementing-oauth-for-the-apple-search-ads-api
      type: authentication_guide
metadataSpecVersion: "1.0"
