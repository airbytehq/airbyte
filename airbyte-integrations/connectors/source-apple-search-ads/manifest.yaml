spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - org_id
      - client_id
      - start_date
      - client_secret
    properties:
      org_id:
        type: integer
        description: >-
          The identifier of the organization that owns the campaign. Your Org Id
          is the same as your account in the Apple Search Ads UI.
        order: 0
        title: Org Id
      end_date:
        type: string
        description: Data is retrieved until that date (included)
        order: 1
        title: End Date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2021-01-01"
      client_id:
        type: string
        description: >-
          The client ID of your Apple Ads API user. Apple shows it in Account
          Settings > API after you upload the user's public key. See <a
          href="https://developer.apple.com/documentation/apple_ads/implementing-oauth-for-the-apple-search-ads-api">Implementing
          OAuth for the Apple Ads API</a>.
        order: 2
        title: Client Id
        airbyte_secret: true
      start_date:
        type: string
        description: >-
          Start getting data from that date. Apple serves daily reports for the
          last 90 days only, so report streams need a Start Date within that
          window.
        order: 3
        title: Start Date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2020-01-01"
      client_secret:
        type: string
        description: >-
          A client secret JWT that you sign with the API user's private key
          (ES256). Apple accepts a client secret for at most 180 days, so
          generate a new one and update this field before it expires. See <a
          href="https://developer.apple.com/documentation/apple_ads/implementing-oauth-for-the-apple-search-ads-api">Implementing
          OAuth for the Apple Ads API</a>.
        order: 4
        title: Client Secret
        airbyte_secret: true
      lookback_window:
        type: integer
        description: >-
          Apple Search Ads uses a 30-day attribution window. However, you may
          consider smaller values in order to shorten sync durations, at the
          cost of missing late data attributions.
        order: 5
        title: Lookback Window
        default: 30
        pattern: ^(30|[1-2][0-9]|[1-9])$
        examples:
          - 7
      backoff_factor:
        type: integer
        description: >-
          Multiplier for the delay between retries of temporary Apple Ads API
          errors on the report streams. Valid values are integers between 1 and 20.
        order: 6
        title: Exponential Backoff Factor
        airbyte_hidden: true
        default: 5
        pattern: ^(20|1[0-9]|[1-9])$
        examples:
          - 10
      timezone:
        type: string
        default: UTC
        description: >-
          The timezone for the reporting data. Use 'ORTZ' for Organization Time
          Zone or 'UTC' for Coordinated Universal Time. Default is UTC.
        enum:
          - ORTZ
          - UTC
        order: 7
        title: Time Zone
      token_refresh_endpoint:
        type: string
        description: >-
          Apple's OAuth token endpoint. Change it only when requests to Apple's
          token endpoint must go through a proxy.
        title: Token Refresh Endpoint
        airbyte_hidden: true
        default: >-
          https://appleid.apple.com/auth/oauth2/token?grant_type=client_credentials&scope=searchadsorg
        order: 8
      num_workers:
        type: integer
        description: >-
          The number of concurrent workers for syncing data. Increase this
          value to speed up syncs for accounts with many campaigns and ad
          groups, at the cost of higher API usage. Valid values are 1 to 20.
        order: 9
        title: Number of Workers
        default: 2
        minimum: 1
        maximum: 20
        examples:
          - 5
    additionalProperties: true

