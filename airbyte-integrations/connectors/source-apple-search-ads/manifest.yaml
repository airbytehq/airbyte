            - type: ParentStreamConfig
              parent_key: id
              partition_field: adgroup_id
              stream:
                $ref: "#/definitions/streams/adgroups"
        decoder:
          type: JsonDecoder
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/keywords"
    campaigns_report_daily:
      type: DeclarativeStream
      selector:
        extractor:
          field_path:
            - data
            - reportingDataResponse
            - row
      name: campaigns_report_daily
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /reports/campaigns
          http_method: POST
          request_headers:
            X-AP-Context: orgId={{ config.org_id }}
          request_body_json:
            endTime: "{{ stream_slice.end_time }}"
            groupBy: "[ 'countryOrRegion' ]"
            selector: >-
              { "orderBy": [ { "field": "countryOrRegion", "sortOrder":
              "ASCENDING" } ] }
            timeZone: "{{ config.get('timezone') or 'UTC' }}"
            startTime: "{{ stream_slice.start_time }}"
            granularity: DAILY
          error_handler:
            $ref: "#/definitions/report_error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
              - reportingDataResponse
              - row
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_path:
              - selector
              - pagination
              - offset
            inject_into: body_json
          page_size_option:
            type: RequestOption
            field_path:
              - selector
              - pagination
              - limit
            inject_into: body_json
          pagination_strategy:
            type: OffsetIncrement
            page_size: 1000
        decoder:
          type: JsonDecoder
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: date
        lookback_window: P{{ config.get('lookback_window', 30) }}D
        cursor_datetime_formats:
          - "%Y-%m-%d"
        datetime_format: "%Y-%m-%d"
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ config.start_date }}"
          datetime_format: "%Y-%m-%d"
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ config.end_date or today_utc() }}"
          datetime_format: "%Y-%m-%d"
        step: P1D
        cursor_granularity: P1D
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - campaignId
              value: "{{ record.metadata.campaignId }}"
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - date
              value: "{{ stream_slice.start_time }}"
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - countryorregion
              value: "{{ record.metadata.countryOrRegion }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/campaigns_report_daily"
    adgroups_report_daily:
