version: 6.48.15

type: DeclarativeSource

description: >-
  Add extract `countryOrRegion` value from `metadata` field and add it as a new
  separate one.

  Now when `metadata` field is used as a primary key to run a proper
  deduplication for metrics grouped by `countryOrRegion` it may cause duplicate
  if `metadata` has changes for other keys but with the same `date` and
  `campaignid`.

  Adding an ability to set just `countryOrRegion` as primary key instead of the
  whole `metadata` field solves the issue

check:
  type: CheckStream
  stream_names:
    - campaigns

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: "{{ config.get('num_workers', 2) }}"
  max_concurrency: 20

definitions:
  response_filters:
    token_expired:
      type: HttpResponseFilter
      action: REFRESH_TOKEN_THEN_RETRY
      http_codes:
        - 401
      error_message: >-
        Apple Ads rejected the credentials (401) even after refreshing the
        access token. The client secret JWT may have expired (Apple caps it at
        180 days) or the API user lost access; generate a new client secret and
        update the source.
        {%- set apple_error = response.get('error') if response is mapping and response.get('error') is mapping else {} -%}
        {%- set apple_errors = apple_error.get('errors') if apple_error.get('errors') is sequence and apple_error.get('errors') is not string and apple_error.get('errors') is not mapping else [] -%}
        {%- set first_error = apple_errors[0] if apple_errors else {} -%}
        {%- set apple_message = first_error.get('message') if first_error is mapping and first_error.get('message') is string and first_error.get('message') else 'no error details returned' -%}
        {{ ' Apple said: ' ~ apple_message[:300] }}
    invalid_request:
      type: HttpResponseFilter
      action: FAIL
      http_codes:
        - 400
      failure_type: system_error
      error_message: >-
        Apple Ads rejected the request as invalid (400).
        {%- set apple_error = response.get('error') if response is mapping and response.get('error') is mapping else {} -%}
        {%- set apple_errors = apple_error.get('errors') if apple_error.get('errors') is sequence and apple_error.get('errors') is not string and apple_error.get('errors') is not mapping else [] -%}
        {%- set first_error = apple_errors[0] if apple_errors else {} -%}
        {%- set apple_message = first_error.get('message') if first_error is mapping and first_error.get('message') is string and first_error.get('message') else 'no error details returned' -%}
        {{ ' Apple said: ' ~ apple_message[:300] }}
    invalid_report_request:
      type: HttpResponseFilter
      action: FAIL
      http_codes:
        - 400
      failure_type: config_error
      error_message: >-
        Apple Ads rejected the report request (400). Apple serves daily reports
        for the last 90 days only: set the Start Date within that window, or
        refresh the stream if it has not synced for a long time.
        {%- set apple_error = response.get('error') if response is mapping and response.get('error') is mapping else {} -%}
        {%- set apple_errors = apple_error.get('errors') if apple_error.get('errors') is sequence and apple_error.get('errors') is not string and apple_error.get('errors') is not mapping else [] -%}
        {%- set first_error = apple_errors[0] if apple_errors else {} -%}
        {%- set apple_message = first_error.get('message') if first_error is mapping and first_error.get('message') is string and first_error.get('message') else 'no error details returned' -%}
        {{ ' Apple said: ' ~ apple_message[:300] }}
    forbidden:
      type: HttpResponseFilter
      action: FAIL
      http_codes:
        - 403
      failure_type: config_error
      error_message: >-
        Apple Ads denied access (403) for org {{ config.get('org_id') }}.
        Check that the API user has an API role (for example API Account
        Manager or API Account Read Only) on this organization.
        {%- set apple_error = response.get('error') if response is mapping and response.get('error') is mapping else {} -%}
        {%- set apple_errors = apple_error.get('errors') if apple_error.get('errors') is sequence and apple_error.get('errors') is not string and apple_error.get('errors') is not mapping else [] -%}
        {%- set first_error = apple_errors[0] if apple_errors else {} -%}
        {%- set apple_message = first_error.get('message') if first_error is mapping and first_error.get('message') is string and first_error.get('message') else 'no error details returned' -%}
        {{ ' Apple said: ' ~ apple_message[:300] }}
    not_found:
      type: HttpResponseFilter
      action: FAIL
      http_codes:
        - 404
      failure_type: system_error
      error_message: >-
        Apple Ads returned 404 for {{ request_url }}. A campaign or ad group may
        have been deleted while the sync was running.
        {%- set apple_error = response.get('error') if response is mapping and response.get('error') is mapping else {} -%}
        {%- set apple_errors = apple_error.get('errors') if apple_error.get('errors') is sequence and apple_error.get('errors') is not string and apple_error.get('errors') is not mapping else [] -%}
        {%- set first_error = apple_errors[0] if apple_errors else {} -%}
        {%- set apple_message = first_error.get('message') if first_error is mapping and first_error.get('message') is string and first_error.get('message') else 'no error details returned' -%}
        {{ ' Apple said: ' ~ apple_message[:300] }}
    keyword_missing:
      type: HttpResponseFilter
      action: IGNORE
      predicate: >-
        {%- set apple_error = response.get('error') if response is mapping and response.get('error') is mapping else {} -%}
        {%- set apple_errors = apple_error.get('errors') if apple_error.get('errors') is sequence and apple_error.get('errors') is not string and apple_error.get('errors') is not mapping else [] -%}
        {%- set first_error = apple_errors[0] if apple_errors else {} -%}
        {%- set apple_message = first_error.get('message') if first_error is mapping and first_error.get('message') is string else '' -%}
        {{ 'CAMPAIGN DOES NOT CONTAIN KEYWORD' in apple_message }}
  error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      - type: ExponentialBackoffStrategy
    response_filters:
      - $ref: "#/definitions/response_filters/token_expired"
      - $ref: "#/definitions/response_filters/invalid_request"
      - $ref: "#/definitions/response_filters/forbidden"
      - $ref: "#/definitions/response_filters/not_found"
  report_error_handler:
    type: DefaultErrorHandler
    max_retries: 10
    backoff_strategies:
      - type: ExponentialBackoffStrategy
        factor: "{{ config.get('backoff_factor', 5) }}"
    response_filters:
      - $ref: "#/definitions/response_filters/token_expired"
      - $ref: "#/definitions/response_filters/invalid_report_request"
      - $ref: "#/definitions/response_filters/forbidden"
      - $ref: "#/definitions/response_filters/not_found"
  keywords_report_error_handler:
    type: DefaultErrorHandler
    max_retries: 10
    backoff_strategies:
      - type: ExponentialBackoffStrategy
        factor: "{{ config.get('backoff_factor', 5) }}"
    response_filters:
      - $ref: "#/definitions/response_filters/keyword_missing"
      - $ref: "#/definitions/response_filters/token_expired"
      - $ref: "#/definitions/response_filters/invalid_report_request"
      - $ref: "#/definitions/response_filters/forbidden"
      - $ref: "#/definitions/response_filters/not_found"
  streams:
    campaigns:
      type: DeclarativeStream
      selector:
        extractor:
          field_path:
            - data
      name: campaigns
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /campaigns
          http_method: GET
          request_headers:
            X-AP-Context: orgId={{ config.org_id }}
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: offset
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: request_parameter
          pagination_strategy:
            type: OffsetIncrement
            page_size: 1000
        decoder:
          type: JsonDecoder
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/campaigns"
    adgroups:
      type: DeclarativeStream
      selector:
        extractor:
          field_path:
            - data
      name: adgroups
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /campaigns/{{ stream_slice.campaign_id }}/adgroups
          http_method: GET
          request_headers:
            X-AP-Context: orgId={{ config.org_id }}
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: offset
            inject_into: request_parameter
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: request_parameter
          pagination_strategy:
            type: OffsetIncrement
            page_size: 1000
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              partition_field: campaign_id
              stream:
                $ref: "#/definitions/streams/campaigns"
        decoder:
          type: JsonDecoder
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/adgroups"
    keywords:
      type: DeclarativeStream
      selector:
        extractor:
          field_path:
            - data
      name: keywords
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: >-
            /campaigns/{{ stream_slice.parent_slice.campaign_id }}/adgroups/{{
            stream_slice.adgroup_id }}/targetingkeywords
          http_method: GET
          request_headers:
            X-AP-Context: orgId={{ config.org_id }}
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
        paginator:
