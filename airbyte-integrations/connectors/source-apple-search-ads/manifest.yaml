  base_requester:
    type: HttpRequester
    url_base: https://api.searchads.apple.com/api/v5
    authenticator:
      type: OAuthAuthenticator
      client_id: "{{ config.client_id }}"
      grant_type: client_credentials
      client_secret: "{{ config.client_secret }}"
      token_refresh_endpoint: "{{ config.get('token_refresh_endpoint', 'https://appleid.apple.com/auth/oauth2/token?grant_type=client_credentials&scope=searchadsorg') }}"
      refresh_token_error_status_codes:
        - 400
        - 401
      refresh_token_error_key: error
      refresh_token_error_values:
        - invalid_client
        - invalid_grant
        - invalid_request
        - unauthorized_client
        - unsupported_grant_type
        - invalid_scope
      refresh_request_body: {}

streams:
