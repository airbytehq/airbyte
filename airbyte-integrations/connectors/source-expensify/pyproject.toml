[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "0.1.2"
name = "source-expensify"
description = "Source implementation for Expensify."
authors = ["Renan Greca <renan.greca@canonical.com>"]
readme = "README.md"
homepage = "https://airbyte.com"
repository = "https://github.com/canonical/airbyte"
[[tool.poetry.packages]]
include = "source_expensify"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
airbyte-cdk = ">=7.28.3,<8.0.0"

[tool.poetry.scripts]
source-expensify = "source_expensify.run:run"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-mock = "^3.6.1"
freezegun = "^1.5.5"
requests-mock = "^1.12.1"
ruff = "^0.11.5"
licenseheaders = "^0.8.8"


[tool.poe]
include = [
    # Shared tasks definition file(s) can be imported here.
    # Run `poe` or `poe --help` to see the list of available tasks.
    "${POE_GIT_DIR}/poe-tasks/poetry-connector-tasks.toml",
]
