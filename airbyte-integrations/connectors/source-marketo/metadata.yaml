data:
  ab_internal:
    ql: 200
    sl: 100
  allowedHosts:
    hosts:
      - "*.mktorest.com"
  connectorBuildOptions:
    baseImage: docker.io/airbyte/python-connector-base:4.0.2@sha256:9fdb1888c4264cf6fee473649ecb593f56f58e5d0096a87ee0b231777e2e3e73
  connectorSubtype: api
  connectorType: source
  definitionId: 9e0556f4-69df-4522-a3fb-03264d36b348
  dockerImageTag: 2.1.3
  dockerRepository: airbyte/source-marketo
  documentationUrl: https://docs.airbyte.com/integrations/sources/marketo
  githubIssueLabel: source-marketo
  icon: marketo.svg
  license: ELv2
  maxSecondsBetweenMessages: 86400
  name: Marketo
  releases:
    breakingChanges:
      2.0.0:
        message: >-
          The `leads` stream now filters Marketo's Bulk Lead Extract on `updatedAt`
          instead of `createdAt`, so incremental syncs capture updates to
          pre-existing leads (previously silently dropped). Users syncing the
          `leads` stream in incremental mode should refresh the source schema
          and reset the stream after upgrading to backfill historical updates
          missed by earlier versions. Full refresh syncs of `leads` are not
          affected. See the migration guide for details.
        upgradeDeadline: "2026-05-22"
        deadlineAction: "auto_upgrade"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - leads
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
  remoteRegistries:
    pypi:
      enabled: true
      packageName: airbyte-source-marketo
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  supportLevel: community
  tags:
    - language:python
    - cdk:low-code
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: marketo_config_dev_null
          id: 4df9fc18-4d29-44c5-aa52-c74d8066d0bd
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-MARKETO__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: Marketo REST API
      url: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/rest-api
      type: api_reference
    - title: Marketo REST API endpoint reference
      url: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/endpoint-reference
      type: api_reference
    - title: Marketo authentication
      url: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/authentication
      type: authentication_guide
    - title: Marketo custom services (API credentials)
      url: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/custom-services
      type: authentication_guide
    - title: Marketo integration best practices (API limits)
      url: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/marketo-integration-best-practices
      type: rate_limits
    - title: Marketo Engage release notes
      url: https://experienceleague.adobe.com/en/docs/marketo/using/release-notes/current
      type: api_release_history
    - title: Marketo Get Lead API updates (migration guide)
      url: https://experienceleague.adobe.com/en/docs/marketo-developer/marketo/rest/lead-database/migration
      type: api_deprecations
metadataSpecVersion: "1.0"
