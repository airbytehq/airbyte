# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-omnisend:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
      - bypass_reason: "The CI test secret's API key gets 403 Forbidden on every stream (contacts, campaigns, carts, orders, products). Refreshing it needs an Omnisend account. Live tests are bypassed until a new secret is stored."
  discovery:
    bypass_reason: "The CI test secret's API key gets 403 Forbidden on every stream (contacts, campaigns, carts, orders, products). Refreshing it needs an Omnisend account. Live tests are bypassed until a new secret is stored."
  basic_read:
    bypass_reason: "The CI test secret's API key gets 403 Forbidden on every stream (contacts, campaigns, carts, orders, products). Refreshing it needs an Omnisend account. Live tests are bypassed until a new secret is stored."
  full_refresh:
    bypass_reason: "The CI test secret's API key gets 403 Forbidden on every stream (contacts, campaigns, carts, orders, products). Refreshing it needs an Omnisend account. Live tests are bypassed until a new secret is stored."
