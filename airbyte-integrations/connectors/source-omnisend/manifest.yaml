    analytics_reports:
      type: DeclarativeStream
      name: analytics_reports
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/reporting_requester'
          path: analytics/reports
          http_method: POST
          request_body_json:
            queries:
            - alias: activity
              metrics:
              - name: sent
              - name: failed
              - name: markedAsSpamUnique
              - name: unsubscribedUnique
              - name: openedUnique
              - name: opened
              - name: clickedUnique
              - name: clicked
              - name: attributedOrders
              - name: attributedOrdersUnique
              - name: attributedRevenue
              - name: openRate
              - name: clickRate
              - name: failRate
              - name: markedAsSpamRate
              - name: unsubscribeRate
              - name: attributedOrderRate
              - name: attributedRevenuePerOrder
              - name: attributedRevenuePerSent
              dimensions:
              - name: marketingActivityID
              - name: marketingActivityType
              dateRange:
                interval: '{{ stream_partition.period }}'
            - alias: channel
              metrics:
              - name: sent
              - name: failed
              - name: markedAsSpamUnique
              - name: unsubscribedUnique
              - name: openedUnique
              - name: opened
              - name: clickedUnique
              - name: clicked
              - name: attributedOrders
              - name: attributedOrdersUnique
              - name: attributedRevenue
              - name: openRate
              - name: clickRate
              - name: failRate
              - name: markedAsSpamRate
              - name: unsubscribeRate
              - name: attributedOrderRate
              - name: attributedRevenuePerOrder
              - name: attributedRevenuePerSent
              dimensions:
              - name: marketingActivityType
              - name: messageChannel
              dateRange:
                interval: '{{ stream_partition.period }}'
            - alias: automation_message
              metrics:
              - name: sent
              - name: failed
              - name: markedAsSpamUnique
              - name: unsubscribedUnique
              - name: openedUnique
              - name: opened
              - name: clickedUnique
              - name: clicked
              - name: attributedOrders
              - name: attributedOrdersUnique
              - name: attributedRevenue
              - name: openRate
              - name: clickRate
              - name: failRate
              - name: markedAsSpamRate
              - name: unsubscribeRate
              - name: attributedOrderRate
              - name: attributedRevenuePerOrder
              - name: attributedRevenuePerSent
              dimensions:
              - name: marketingActivityID
              - name: messageID
              filters:
              - name: marketingActivityType
                operator: in
                values:
                - Automation
              dateRange:
                interval: '{{ stream_partition.period }}'
            - alias: overview
              metrics:
              - name: sent
              - name: failed
              - name: markedAsSpamUnique
              - name: unsubscribedUnique
              - name: openedUnique
              - name: opened
              - name: clickedUnique
              - name: clicked
              - name: attributedOrders
              - name: attributedOrdersUnique
              - name: attributedRevenue
              - name: openRate
              - name: clickRate
              - name: failRate
              - name: markedAsSpamRate
              - name: unsubscribeRate
              - name: attributedOrderRate
              - name: attributedRevenuePerOrder
              - name: attributedRevenuePerSent
              dimensions: []
              dateRange:
                interval: '{{ stream_partition.period }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
            - reports
        partition_router:
          type: ListPartitionRouter
          cursor_field: period
          values: '{{ config.get(''reporting_periods'', [''lastMonth'']) if config.get(''enable_reporting'', False) else [] }}'
      schema_loader:
        type: InlineSchemaLoader
        schema:
          type: object
          additionalProperties: true
          properties:
            alias:
              type: string
            rows:
              type: array
              items:
                type: object
                additionalProperties: true
            metrics:
              type: array
              items:
                type: object
                additionalProperties: true
            dimensions:
              type: array
              items:
                type: object
                additionalProperties: true
            query_period:
              type: string
            date_basis:
              type: string
            query_window_start:
              type: string
            query_window_end:
              type: string
      transformations:
      - type: AddFields
        fields:
        - type: AddedFieldDefinition
          path:
          - query_period
          value: '{{ stream_partition.period }}'
        - type: AddedFieldDefinition
          path:
          - date_basis
          value: send
    analytics_statistics:
      type: DeclarativeStream
      name: analytics_statistics
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/reporting_requester'
          path: analytics/statistics
          http_method: POST
          request_body_json:
            queries:
            - alias: audience_growth
              metrics:
              - name: subscribedEmail
              - name: unsubscribedEmail
              - name: subscribedSms
              - name: unsubscribedSms
              - name: subscribedPush
              - name: unsubscribedPush
              dimensions:
              - name: timestamp
                granularity: month
              dateRange:
                from: '{{ stream_partition.window[''from''] }}'
                to: '{{ stream_partition.window[''to''] }}'
            - alias: sales
              metrics:
              - name: totalOrders
              - name: totalRevenue
              - name: attributedOrders
              - name: attributedRevenue
              dimensions:
              - name: timestamp
                granularity: month
              dateRange:
                from: '{{ stream_partition.window[''from''] }}'
                to: '{{ stream_partition.window[''to''] }}'
            - alias: delivery_failures
              metrics:
              - name: failed
              dimensions:
              - name: timestamp
                granularity: month
              - name: bounceType
              - name: deliveryFailureReason
              dateRange:
                from: '{{ stream_partition.window[''from''] }}'
                to: '{{ stream_partition.window[''to''] }}'
            - alias: subscription_sources
              metrics:
              - name: subscribedEmail
              - name: subscribedSms
              - name: subscribedPush
              dimensions:
              - name: timestamp
                granularity: month
              - name: subscriptionMethod
              dateRange:
                from: '{{ stream_partition.window[''from''] }}'
                to: '{{ stream_partition.window[''to''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
            - statistics
        partition_router:
          type: ListPartitionRouter
          cursor_field: window
          values: '{{ config.get(''statistics_windows'', []) if config.get(''enable_reporting'', False) else [] }}'
      schema_loader:
        type: InlineSchemaLoader
        schema:
          type: object
          additionalProperties: true
          properties:
            alias:
              type: string
            rows:
              type: array
              items:
                type: object
                additionalProperties: true
            metrics:
              type: array
              items:
                type: object
                additionalProperties: true
            dimensions:
              type: array
              items:
                type: object
                additionalProperties: true
            query_period:
              type: string
            date_basis:
              type: string
            query_window_start:
              type: string
            query_window_end:
              type: string
      transformations:
      - type: AddFields
        fields:
        - type: AddedFieldDefinition
          path:
          - query_period
          value: '{{ stream_partition.window[''from''] }}'
        - type: AddedFieldDefinition
          path:
          - date_basis
          value: event
        - type: AddedFieldDefinition
          path:
          - query_window_start
          value: '{{ stream_partition.window[''from''] }}'
        - type: AddedFieldDefinition
          path:
          - query_window_end
          value: '{{ stream_partition.window[''to''] }}'
    form_reports:
      type: DeclarativeStream
      name: form_reports
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/reporting_requester'
          path: forms/{{ stream_partition.form_id }}/report/periodic
          http_method: GET
          request_parameters:
            createdAtFrom: '{{ stream_partition.window[''from''] }}'
            createdAtTo: '{{ stream_partition.window[''to''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
        partition_router:
        - type: SubstreamPartitionRouter
          parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: '#/definitions/streams/forms'
            parent_key: id
            partition_field: form_id
        - type: ListPartitionRouter
          cursor_field: window
          values: '{{ config.get(''form_report_windows'', []) if config.get(''enable_reporting'', False) else [] }}'
      schema_loader:
        type: InlineSchemaLoader
        schema:
          type: object
          additionalProperties: true
          properties:
            formID:
              type:
              - 'null'
              - string
            form_id:
              type: string
            granularity:
              type:
              - 'null'
              - string
            rows:
              type: array
              items:
                type: object
                additionalProperties: true
            date_basis:
              type: string
            query_window_start:
              type: string
            query_window_end:
              type: string
      transformations:
      - type: AddFields
        fields:
        - type: AddedFieldDefinition
          path:
          - form_id
          value: '{{ stream_partition.form_id }}'
        - type: AddedFieldDefinition
          path:
          - date_basis
          value: form_activity
        - type: AddedFieldDefinition
          path:
          - query_window_start
          value: '{{ stream_partition.window[''from''] }}'
        - type: AddedFieldDefinition
          path:
          - query_window_end
          value: '{{ stream_partition.window[''to''] }}'
