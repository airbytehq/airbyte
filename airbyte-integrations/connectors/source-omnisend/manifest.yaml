        partition_router:
          type: ListPartitionRouter
          cursor_field: window
          values: '{{ config.get(''daily_statistics_windows'', []) if config.get(''enable_reporting'', False) else [] }}'
      schema_loader:
        type: InlineSchemaLoader
        schema:
          type: object
          additionalProperties: true
          properties:
