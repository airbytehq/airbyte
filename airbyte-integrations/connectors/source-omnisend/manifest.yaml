    type: HttpRequester
    url_base: https://api.omnisend.com/v3/
    authenticator:
      type: ApiKeyAuthenticator
      api_token: "{{ config[\"api_key\"] }}"
      inject_into:
        type: RequestOption
        field_name: X-API-KEY
        inject_into: header

  reporting_requester:
    type: HttpRequester
    url_base: https://api.omnisend.com/api/
    authenticator:
      type: ApiKeyAuthenticator
      api_token: Omnisend-API-Key {{ config.get('reporting_api_key') or config['api_key'] }}
      inject_into:
        type: RequestOption
        field_name: Authorization
        inject_into: header
    request_headers:
      Omnisend-Version: '2026-03-15'
      Content-Type: application/json
    error_handler:
      type: DefaultErrorHandler
      max_retries: 3
      backoff_strategies:
      - type: ExponentialBackoffStrategy
        factor: 30
      response_filters:
      - type: HttpResponseFilter
        http_codes: [400, 401, 403, 404, 410, 415, 422]
        action: FAIL
        failure_type: config_error
      - type: HttpResponseFilter
        http_codes:
        - 429
        action: FAIL
        failure_type: transient_error
        error_message: 'Omnisend rate limit reached. No automatic retry is made. Wait for the brand''s sliding-window quota before restarting. retryAfter
