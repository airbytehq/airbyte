[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-smsmode-rcs-unit-tests"
version = "0.0.1"
description = "Unit tests for the source-smsmode-rcs connector"
authors = ["Airbyte <contact@airbyte.io>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10,<3.12"

[tool.poetry.group.dev.dependencies]
airbyte-cdk = "7.24.0"
pytest = "^8"
requests-mock = "^1.12"

[tool.pytest.ini_options]
testpaths = ["."]
