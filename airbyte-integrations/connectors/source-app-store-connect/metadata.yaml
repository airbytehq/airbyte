metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - api.appstoreconnect.apple.com
      - "*.s3.*.amazonaws.com"
      - "*.s3-*.amazonaws.com"
      - "*.s3.amazonaws.com"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-app-store-connect
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.47.0@sha256:b2ecb78040d4c4b42fa3537488d68a3b195f64b5fefcbc48ac0591479591a3f0
  connectorSubtype: api
  connectorType: source
  definitionId: b7a89e51-b4b0-464c-99e4-e1820d8f5c15
  dockerImageTag: 0.1.0
  dockerRepository: airbyte/source-app-store-connect
  githubIssueLabel: source-app-store-connect
  icon: icon.svg
  license: ELv2
  maxSecondsBetweenMessages: 10800
  name: App Store Connect
  releaseDate: 2026-09-10
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/app-store-connect
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  releases:
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
  suggestedStreams:
    streams:
      - app_download
      - app_store_installations_and_deletions
      - list_id_apps
      - customer_reviews_per_app
      - app_store_installations_and_deletions_historical
      - app_download_historical
      - sales_report
  connectorTestSuitesOptions:
    - suite: unitTests
    - suite: acceptanceTests
  externalDocumentationUrls:
    - title: App Store Connect API reference
      url: https://developer.apple.com/documentation/appstoreconnectapi
      type: api_reference
    - title: Generating tokens for API requests
      url: https://developer.apple.com/documentation/appstoreconnectapi/generating-tokens-for-api-requests
      type: authentication_guide
    - title: Identifying rate limits
      url: https://developer.apple.com/documentation/appstoreconnectapi/identifying-rate-limits
      type: rate_limits
    - title: Downloading analytics reports
      url: https://developer.apple.com/documentation/appstoreconnectapi/downloading-analytics-reports
      type: other
    - title: App Store Connect API OpenAPI specification
      url: https://developer.apple.com/sample-code/app-store-connect/app-store-connect-openapi-specification.zip
      type: openapi_spec
    - title: App Store Connect API release notes
      url: https://developer.apple.com/documentation/appstoreconnectapi/app-store-connect-api-release-notes
      type: api_release_history
    - title: Analytics Reports reference
      url: https://developer.apple.com/documentation/analytics-reports
      type: data_model_reference
