# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-app-store-connect:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    bypass_reason: "No sandbox App Store Connect account with an in-effect developer agreement is available for testing."
  incremental:
    bypass_reason: "No sandbox App Store Connect account with an in-effect developer agreement is available for testing."
  full_refresh:
    bypass_reason: "No sandbox App Store Connect account with an in-effect developer agreement is available for testing."
