          type: RecordFilter
          condition: "{{ (record.get('Date') or '') | length > 0 }}"
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: "#/streams/27"
            parent_key: download_url
            extra_fields:
              - - app_id
              - - report_id
              - - instance_id
              - - processing_date
              - - access_type
            partition_field: download_url
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/draft-07/schema#
        properties:
          Date:
            type:
              - string
              - "null"
          Counts:
            type:
              - string
              - "null"
          Device:
            type:
              - string
              - "null"
          app_id:
            type:
              - string
              - "null"
          App Name:
            type:
              - string
              - "null"
          Page Type:
            type:
              - string
              - "null"
          Pre-Order:
            type:
              - string
              - "null"
          Territory:
            type:
              - string
              - "null"
          report_id:
            type:
              - string
              - "null"
          App Version:
            type:
              - string
              - "null"
          Source Type:
            type:
              - string
              - "null"
          access_type:
            type:
              - string
              - "null"
          instance_id:
            type:
              - string
              - "null"
          Download Type:
