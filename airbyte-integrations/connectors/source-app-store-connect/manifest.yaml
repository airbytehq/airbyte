version: 7.23.7

type: DeclarativeSource

description: >-
  The App Store Connect app lets you monitor your app's sales and downloads,
  reply to App Store Review, get notified of new reviews, respond to reviews,
  and more.

# TODO(spike): raising this further looks safe from the rate-limit math (still well under
# Apple's per-key budget), but hasn't been validated empirically. Worth a follow-up
# to bump it on a test sync, watching for 429/RATE_LIMIT_EXCEEDED in the logs and confirming
# actual duration improves roughly proportionally, before landing a higher value in production.
max_concurrent_async_job_count: 1

check:
  type: CheckStream
  stream_names:
    - list_id_apps

definitions:
  analytics_standard_reports:
    $ref: "#/streams/19"
    name: analytics_standard_reports
    retriever:
      $ref: "#/streams/19/retriever"
      requester:
        $ref: "#/streams/19/retriever/requester"
        request_parameters:
          filter[name]: "{{ parameters['report_name'] }}"
  analytics_standard_instances:
    $ref: "#/streams/20"
    name: analytics_standard_instances
    retriever:
      $ref: "#/streams/20/retriever"
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - $ref: "#/streams/20/retriever/partition_router/parent_stream_configs/0"
            stream:
              $ref: "#/definitions/analytics_standard_reports"
  analytics_standard_segments:
    $ref: "#/streams/21"
    name: analytics_standard_segments
    retriever:
      $ref: "#/streams/21/retriever"
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - $ref: "#/streams/21/retriever/partition_router/parent_stream_configs/0"
            stream:
              $ref: "#/definitions/analytics_standard_instances"
  analytics_standard_download:
    $ref: "#/streams/23"
    retriever:
      $ref: "#/streams/23/retriever"
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - $ref: "#/streams/23/retriever/partition_router/parent_stream_configs/0"
            stream:
              $ref: "#/definitions/analytics_standard_segments"
  linked:
    HttpRequester:
      authenticator:
        type: JwtAuthenticator
        algorithm: ES256
        secret_key: "{{ config['secret_key'] }}"
        jwt_headers:
          kid: "{{ config['kid'] }}"
          typ: JWT
        jwt_payload:
          aud: appstoreconnect-v1
          iss: "{{ config['iss'] }}"
        header_prefix: Bearer
        token_duration: 900
      error_handler:
        type: DefaultErrorHandler
        max_retries: 3
        response_filters:
          - type: HttpResponseFilter
            action: IGNORE
            http_codes:
              - 404
              - 410
          # Do not use error_message_contains here: CDK reads the response body to
          # evaluate it, which consumes the gzip stream before the CSV decoder runs.
          - type: HttpResponseFilter
            action: IGNORE
            http_codes:
              - 400
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 401
              - 429
              - 500
              - 502
              - 503
              - 504
        backoff_strategies:
          - type: ExponentialBackoffStrategy
            factor: 2
      request_parameters:
        filter[accessType]: ONGOING
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestPath
        page_size_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: limit
        pagination_strategy:
          type: CursorPagination
          page_size: 200
          cursor_value: "{{ response.get('links', {}).get('next') }}"
          stop_condition: "{{ not response.get('links', {}).get('next') }}"
    DailyReportDateField:
      type: AddedFieldDefinition
      path:
        - report_date
      value: "{{ stream_interval.start_time }}"
      value_type: string
    # Nested GzipDecoder: Apple's application/a-gzip is not in the CDK allowlist, so a single
    # GzipDecoder falls through to CsvDecoder on raw bytes. Nesting makes the fallback path
    # gunzip once (Amazon Ads pattern).
    SalesReportCsvDecoder:
      type: GzipDecoder
      decoder:
        type: GzipDecoder
        decoder:
          type: CsvDecoder
          encoding: utf-8
          delimiter: \t
    DailyReportCursorField:
      type: AddedFieldDefinition
      path:
        - _sync_cursor
      value: >-
        {{ format_datetime(str_to_datetime(stream_interval.start_time[:10]) +
        duration('P1D'), '%Y-%m-%d') }}
      value_type: string
    MonthlyReportDateField:
      type: AddedFieldDefinition
      path:
        - report_date
      value: "{{ stream_interval.start_time }}"
      value_type: string
    AnalyticsApiErrorHandler:
      type: DefaultErrorHandler
      max_retries: 3
      response_filters:
        - type: HttpResponseFilter
          action: IGNORE
          http_codes:
            - 400
            - 403
            - 404
            - 410
        - type: HttpResponseFilter
          action: RETRY
          http_codes:
            - 401
            - 429
            - 500
            - 502
            - 503
            - 504
      backoff_strategies:
        - type: ExponentialBackoffStrategy
          factor: 2
    MonthlyReportCursorField:
      type: AddedFieldDefinition
      path:
        - _sync_cursor
      value: >-
        {{ format_datetime(str_to_datetime(stream_interval.start_time[:10]) +
        duration('P1M'), '%Y-%m-%d') }}
      value_type: string
    # Analytics segment downloads are fetched from S3 presigned URLs with standard gzip
    # Content-Encoding. Use a single GzipDecoder — not SalesReportCsvDecoder, which is
    # for salesReports API responses that use application/a-gzip (see comment above).
    AnalyticsReportCsvDecoder:
      type: GzipDecoder
      decoder:
        type: CsvDecoder
        encoding: utf-8
        delimiter: \t
    DailyReportIncrementalSync:
      type: DatetimeBasedCursor
      step: P1D
      cursor_field: _sync_cursor
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ (today_utc() - duration('P1D')).strftime('%Y-%m-%d') }}"
        datetime_format: "%Y-%m-%d"
      start_datetime:
        type: MinMaxDatetime
        datetime: >-
          {%- if 'sales_reports_start_date' in config and
          config['sales_reports_start_date'] and
          config['sales_reports_start_date'] != 'None' -%} {{-
          config['sales_reports_start_date'] -}} {%- else -%} {{- (today_utc() -
          duration('P365D')).strftime('%Y-%m-%d') -}} {%- endif -%}
        min_datetime: "{{ (today_utc() - duration('P365D')).strftime('%Y-%m-%d') }}"
        datetime_format: "%Y-%m-%d"
        min_datetime_format: "%Y-%m-%d"
      datetime_format: "%Y-%m-%d"
      cursor_granularity: P1D
      cursor_datetime_formats:
        - "%Y-%m-%d"
    MonthlyReportIncrementalSync:
      type: DatetimeBasedCursor
      step: P1M
      cursor_field: _sync_cursor
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ (today_utc() - duration('P35D')).strftime('%Y-%m') }}-01"
        datetime_format: "%Y-%m-%d"
      start_datetime:
        type: MinMaxDatetime
        datetime: >-
          {%- if 'finance_reports_start_date' in config and
          config['finance_reports_start_date'] and
          config['finance_reports_start_date'] != 'None' -%} {{-
          config['finance_reports_start_date'] ~ '-01' -}} {%- else -%} {{-
          (today_utc() - duration('P11M')).strftime('%Y-%m') ~ '-01' -}} {%-
          endif -%}
        min_datetime: "{{ (today_utc() - duration('P11M')).strftime('%Y-%m') }}-01"
        datetime_format: "%Y-%m-%d"
        min_datetime_format: "%Y-%m-%d"
      datetime_format: "%Y-%m-%d"
      cursor_granularity: P1M
      cursor_datetime_formats:
        - "%Y-%m-%d"
        - "%Y-%m"
    AnalyticsDownloadErrorHandler:
      type: DefaultErrorHandler
      max_retries: 3
      response_filters:
        - type: HttpResponseFilter
          action: RETRY
          http_codes:
            - 401
            - 403
        - type: HttpResponseFilter
          action: IGNORE
          http_codes:
            - 400
            - 404
            - 410
        - type: HttpResponseFilter
          action: RETRY
          http_codes:
            - 401
            - 429
            - 500
            - 502
            - 503
            - 504
      backoff_strategies:
        - type: ExponentialBackoffStrategy
          factor: 2
    AnalyticsReportIncrementalSync:
      type: DatetimeBasedCursor
      step: P100Y
      cursor_field: processing_date
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ (today_utc() - duration('P1D')).strftime('%Y-%m-%d') }}"
        datetime_format: "%Y-%m-%d"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config['analytics_reports_start_date'] }}"
        min_datetime: "{{ config['analytics_reports_start_date'] }}"
        datetime_format: "%Y-%m-%d"
        min_datetime_format: "%Y-%m-%d"
      datetime_format: "%Y-%m-%d"
      lookback_window: P0D
      cursor_granularity: P1D
      cursor_datetime_formats:
        - "%Y-%m-%d"
      is_client_side_incremental: true
    SubscriptionEventReportIncrementalSync:
      type: DatetimeBasedCursor
      step: P1D
      cursor_field: _sync_cursor
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ (today_utc() - duration('P2D')).strftime('%Y-%m-%d') }}"
        datetime_format: "%Y-%m-%d"
      start_datetime:
        type: MinMaxDatetime
        datetime: >-
          {%- if 'subscription_event_reports_start_date' in config and
          config['subscription_event_reports_start_date'] and
          config['subscription_event_reports_start_date'] != 'None' -%} {{-
          config['subscription_event_reports_start_date'] -}} {%- else -%} {{-
          (today_utc() - duration('P365D')).strftime('%Y-%m-%d') -}} {%- endif
          -%}
        min_datetime: "{{ (today_utc() - duration('P365D')).strftime('%Y-%m-%d') }}"
        datetime_format: "%Y-%m-%d"
        min_datetime_format: "%Y-%m-%d"
      datetime_format: "%Y-%m-%d"
      cursor_granularity: P1D
      cursor_datetime_formats:
        - "%Y-%m-%d"


  # Named parent for substreams; #/definitions/streams/list_id_apps survives stream reordering.
  streams:
    list_id_apps:
      type: DeclarativeStream
      name: list_id_apps
      retriever:
        type: SimpleRetriever
        paginator:
          $ref: "#/definitions/linked/SimpleRetriever/paginator"
        requester:
          type: HttpRequester
          url: https://api.appstoreconnect.apple.com/v1/apps
          http_method: GET
          authenticator:
            $ref: "#/definitions/linked/HttpRequester/authenticator"
          error_handler:
            $ref: "#/definitions/linked/HttpRequester/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      schema_loader:
        type: InlineSchemaLoader
        schema:
          type: object
          $schema: http://json-schema.org/draft-07/schema#
          properties:
            type:
              type:
                - string
                - "null"
            id:
              type:
                - string
                - "null"
            sku:
              type:
                - string
                - "null"
            name:
              type:
                - string
                - "null"
            bundleId:
              type:
                - string
                - "null"
            primaryLocale:
              type:
                - string
                - "null"
            isOrEverWasMadeForKids:
              type:
                - boolean
                - "null"
            streamlinedPurchasingEnabled:
              type:
                - boolean
                - "null"
          additionalProperties: true
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - name
              value: "{{ (record.get('attributes') or {}).get('name') }}"
              value_type: string
            - type: AddedFieldDefinition
              path:
                - bundleId
              value: "{{ (record.get('attributes') or {}).get('bundleId') }}"
              value_type: string
            - type: AddedFieldDefinition
              path:
                - sku
              value: "{{ (record.get('attributes') or {}).get('sku') }}"
              value_type: string
            - type: AddedFieldDefinition
              path:
                - primaryLocale
              value: "{{ (record.get('attributes') or {}).get('primaryLocale') }}"
              value_type: string
            - type: AddedFieldDefinition
              path:
                - isOrEverWasMadeForKids
              value: >-
                {{ (record.get('attributes') or {}).get('isOrEverWasMadeForKids')
                }}
              value_type: boolean
            - type: AddedFieldDefinition
              path:
                - streamlinedPurchasingEnabled
              value: >-
                {{ (record.get('attributes') or
                {}).get('streamlinedPurchasingEnabled') }}
              value_type: boolean
        - type: RemoveFields
          field_pointers:
            - - attributes
            - - relationships
            - - links
