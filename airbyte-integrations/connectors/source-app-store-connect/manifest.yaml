version: 7.28.2

type: DeclarativeSource

description: >-
  The App Store Connect app lets you monitor your app's sales and downloads,
  reply to App Store Review, get notified of new reviews, respond to reviews,
  and more.

check:
  type: CheckStream
  stream_names:
    - list_id_apps

definitions:
  linked:
    HttpRequester:
      authenticator:
        type: JwtAuthenticator
        algorithm: ES256
        secret_key: "{{ config['secret_key'] }}"
        jwt_headers:
          kid: "{{ config['kid'] }}"
          typ: JWT
        jwt_payload:
          aud: appstoreconnect-v1
          iss: "{{ config['iss'] }}"
        header_prefix: Bearer
        token_duration: 1200
      error_handler:
        type: DefaultErrorHandler
        max_retries: 3
        response_filters:
          - type: HttpResponseFilter
            action: IGNORE
            http_codes:
              - 404
              - 410
          - type: HttpResponseFilter
            action: IGNORE
            http_codes:
              - 400
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 429
              - 500
              - 502
              - 503
              - 504
        backoff_strategies:
          - type: ExponentialBackoffStrategy
            factor: 2
      request_parameters:
        filter[accessType]: ONGOING
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestPath
        pagination_strategy:
          type: CursorPagination
          cursor_value: "{{ response.get('links', {}).get('next') }}"
          stop_condition: "{{ not response.get('links', {}).get('next') }}"
    DailyReportDateField:
      type: AddedFieldDefinition
      path:
        - report_date
      value: "{{ stream_interval.start_time }}"
      value_type: string
    SalesReportCsvDecoder:
      type: GzipDecoder
      decoder:
        type: GzipDecoder
        decoder:
          type: CsvDecoder
          encoding: utf-8
          delimiter: \t
    DailyReportCursorField:
      type: AddedFieldDefinition
      path:
        - _sync_cursor
      value: >-
        {{ format_datetime(str_to_datetime(stream_interval.start_time[:10]) +
        duration('P1D'), '%Y-%m-%d') }}
      value_type: string
    MonthlyReportDateField:
      type: AddedFieldDefinition
      path:
        - report_date
      value: "{{ stream_interval.start_time }}"
      value_type: string
    AnalyticsApiErrorHandler:
      type: DefaultErrorHandler
      max_retries: 3
      response_filters:
        - type: HttpResponseFilter
          action: IGNORE
          http_codes:
            - 400
            - 403
            - 404
            - 410
        - type: HttpResponseFilter
          action: RETRY
          http_codes:
            - 429
            - 500
            - 502
            - 503
            - 504
      backoff_strategies:
        - type: ExponentialBackoffStrategy
          factor: 2
    MonthlyReportCursorField:
      type: AddedFieldDefinition
      path:
        - _sync_cursor
      value: >-
        {{ format_datetime(str_to_datetime(stream_interval.start_time[:10]) +
        duration('P1M'), '%Y-%m-%d') }}
      value_type: string
    AnalyticsReportCsvDecoder:
      type: GzipDecoder
      decoder:
        type: CsvDecoder
        encoding: utf-8
        delimiter: \t
    DailyReportIncrementalSync:
      type: DatetimeBasedCursor
      step: P1D
      cursor_field: _sync_cursor
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ (today_utc() - duration('P1D')).strftime('%Y-%m-%d') }}"
        datetime_format: "%Y-%m-%d"
      start_datetime:
        type: MinMaxDatetime
        datetime: >-
          {%- if 'sales_reports_start_date' in config and
          config['sales_reports_start_date'] and
          config['sales_reports_start_date'] != 'None' -%} {{-
          config['sales_reports_start_date'] -}} {%- else -%} {{- (today_utc() -
          duration('P365D')).strftime('%Y-%m-%d') -}} {%- endif -%}
        min_datetime: "{{ (today_utc() - duration('P365D')).strftime('%Y-%m-%d') }}"
        datetime_format: "%Y-%m-%d"
        min_datetime_format: "%Y-%m-%d"
      datetime_format: "%Y-%m-%d"
      cursor_granularity: P1D
      cursor_datetime_formats:
        - "%Y-%m-%d"
    MonthlyReportIncrementalSync:
      type: DatetimeBasedCursor
      step: P1M
      cursor_field: _sync_cursor
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ (today_utc() - duration('P35D')).strftime('%Y-%m') }}-01"
        datetime_format: "%Y-%m-%d"
      start_datetime:
        type: MinMaxDatetime
        datetime: >-
          {%- if 'finance_reports_start_date' in config and
          config['finance_reports_start_date'] and
          config['finance_reports_start_date'] != 'None' -%} {{-
          config['finance_reports_start_date'] ~ '-01' -}} {%- else -%} {{-
          (today_utc() - duration('P11M')).strftime('%Y-%m') ~ '-01' -}} {%-
          endif -%}
        min_datetime: "{{ (today_utc() - duration('P11M')).strftime('%Y-%m') }}-01"
        datetime_format: "%Y-%m-%d"
        min_datetime_format: "%Y-%m-%d"
      datetime_format: "%Y-%m-%d"
      cursor_granularity: P1M
      cursor_datetime_formats:
        - "%Y-%m-%d"
        - "%Y-%m"
    AnalyticsDownloadErrorHandler:
      type: DefaultErrorHandler
      max_retries: 3
      response_filters:
        - type: HttpResponseFilter
          action: RETRY
          http_codes:
            - 403
        - type: HttpResponseFilter
          action: IGNORE
          http_codes:
            - 400
            - 404
            - 410
        - type: HttpResponseFilter
          action: RETRY
          http_codes:
            - 429
            - 500
            - 502
            - 503
            - 504
      backoff_strategies:
        - type: ExponentialBackoffStrategy
          factor: 2
    AnalyticsReportIncrementalSync:
      type: DatetimeBasedCursor
      step: P100Y
      cursor_field: processing_date
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ (today_utc() - duration('P1D')).strftime('%Y-%m-%d') }}"
        datetime_format: "%Y-%m-%d"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config['analytics_reports_start_date'] }}"
        min_datetime: "{{ config['analytics_reports_start_date'] }}"
        datetime_format: "%Y-%m-%d"
        min_datetime_format: "%Y-%m-%d"
      datetime_format: "%Y-%m-%d"
      lookback_window: P0D
      cursor_granularity: P1D
      cursor_datetime_formats:
        - "%Y-%m-%d"
      is_client_side_incremental: true
    SubscriptionEventReportIncrementalSync:
      type: DatetimeBasedCursor
      step: P1D
      cursor_field: _sync_cursor
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ (today_utc() - duration('P2D')).strftime('%Y-%m-%d') }}"
        datetime_format: "%Y-%m-%d"
      start_datetime:
        type: MinMaxDatetime
        datetime: >-
          {%- if 'subscription_event_reports_start_date' in config and
          config['subscription_event_reports_start_date'] and
          config['subscription_event_reports_start_date'] != 'None' -%} {{-
          config['subscription_event_reports_start_date'] -}} {%- else -%} {{-
          (today_utc() - duration('P365D')).strftime('%Y-%m-%d') -}} {%- endif
          -%}
        min_datetime: "{{ (today_utc() - duration('P365D')).strftime('%Y-%m-%d') }}"
        datetime_format: "%Y-%m-%d"
        min_datetime_format: "%Y-%m-%d"
      datetime_format: "%Y-%m-%d"
      cursor_granularity: P1D
      cursor_datetime_formats:
        - "%Y-%m-%d"

streams:
  - type: DeclarativeStream
    name: list_id_apps
    retriever:
      type: SimpleRetriever
      paginator:
        $ref: "#/definitions/linked/SimpleRetriever/paginator"
      requester:
        type: HttpRequester
        url: https://api.appstoreconnect.apple.com/v1/apps
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/draft-07/schema#
        properties:
          type:
            type:
              - string
              - "null"
          id:
            type:
              - string
              - "null"
          sku:
            type:
              - string
              - "null"
          name:
            type:
              - string
              - "null"
          bundleId:
            type:
              - string
              - "null"
          primaryLocale:
            type:
              - string
              - "null"
          isOrEverWasMadeForKids:
            type:
              - boolean
              - "null"
          streamlinedPurchasingEnabled:
            type:
              - boolean
              - "null"
        additionalProperties: true
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - name
            value: "{{ (record.get('attributes') or {}).get('name') }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - bundleId
            value: "{{ (record.get('attributes') or {}).get('bundleId') }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - sku
            value: "{{ (record.get('attributes') or {}).get('sku') }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - primaryLocale
            value: "{{ (record.get('attributes') or {}).get('primaryLocale') }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - isOrEverWasMadeForKids
            value: >-
              {{ (record.get('attributes') or {}).get('isOrEverWasMadeForKids')
              }}
            value_type: boolean
          - type: AddedFieldDefinition
            path:
              - streamlinedPurchasingEnabled
            value: >-
              {{ (record.get('attributes') or
              {}).get('streamlinedPurchasingEnabled') }}
            value_type: boolean
      - type: RemoveFields
        field_pointers:
          - - attributes
          - - relationships
          - - links
