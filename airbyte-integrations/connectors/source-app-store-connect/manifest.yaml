version: 7.28.2

type: DeclarativeSource

description: >-
  Replicate app metadata, customer reviews, Sales and Trends reports, finance
  reports, and App Store Analytics reports from App Store Connect.

check:
  type: CheckStream
  stream_names:
    - list_id_apps

definitions:
  linked:
    HttpRequester:
      authenticator:
        type: JwtAuthenticator
        algorithm: ES256
        secret_key: "{{ config['secret_key'] }}"
        jwt_headers:
          kid: "{{ config['kid'] }}"
          typ: JWT
        jwt_payload:
          aud: appstoreconnect-v1
          iss: "{{ config['iss'] }}"
        header_prefix: Bearer
        token_duration: 900
      error_handler:
        type: DefaultErrorHandler
        max_retries: 3
        response_filters:
          - type: HttpResponseFilter
            action: IGNORE
            http_codes:
              - 404
              - 410
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 401
              - 429
              - 500
              - 502
              - 503
              - 504
        backoff_strategies:
          - type: ExponentialBackoffStrategy
            factor: 2
      request_parameters:
        filter[accessType]: ONGOING
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestPath
        pagination_strategy:
          type: CursorPagination
          cursor_value: "{{ response.get('links', {}).get('next') }}"
          stop_condition: "{{ not response.get('links', {}).get('next') }}"

streams:
  - type: DeclarativeStream
    name: list_id_apps
    retriever:
      type: SimpleRetriever
      paginator:
        $ref: "#/definitions/linked/SimpleRetriever/paginator"
      requester:
        type: HttpRequester
        url: https://api.appstoreconnect.apple.com/v1/apps
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/draft-07/schema#
        properties:
          type:
            type:
              - string
              - "null"
          id:
            type:
              - string
              - "null"
          attributes:
            type:
              - object
              - "null"
            additionalProperties: true
          sku:
            type:
              - string
              - "null"
          name:
            type:
              - string
              - "null"
          bundleId:
            type:
              - string
              - "null"
          primaryLocale:
            type:
              - string
              - "null"
          isOrEverWasMadeForKids:
            type:
              - boolean
              - "null"
          streamlinedPurchasingEnabled:
            type:
              - boolean
              - "null"
        additionalProperties: true
    primary_key:
      - id
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - name
            value: "{{ (record.get('attributes') or {}).get('name') }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - bundleId
            value: "{{ (record.get('attributes') or {}).get('bundleId') }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - sku
            value: "{{ (record.get('attributes') or {}).get('sku') }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - primaryLocale
            value: "{{ (record.get('attributes') or {}).get('primaryLocale') }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - isOrEverWasMadeForKids
            value: >-
              {{ (record.get('attributes') or {}).get('isOrEverWasMadeForKids')
              }}
            value_type: boolean
          - type: AddedFieldDefinition
            path:
              - streamlinedPurchasingEnabled
            value: >-
              {{ (record.get('attributes') or {}).get('streamlinedPurchasingEnabled',
              (record.get('attributes') or {}).get('streamlinedBuyEnabled')) }}
            value_type: boolean
      - type: RemoveFields
        field_pointers:
          - - relationships
          - - links
  - type: DeclarativeStream
