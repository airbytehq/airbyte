spec:
  type: Spec
  documentation_url: >-
    https://developer.apple.com/documentation/appstoreconnectapi/get-v1-salesreports
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - iss
      - kid
      - secret_key
      - vendorID
      - analytics_reports_start_date
    properties:
      iss:
        type: string
        description: The ISS (Issuer) to use for the JWT token
        order: 0
        title: JWT Payload ISS
        airbyte_secret: true
      kid:
        type: string
        description: The KID (Key ID) to use for the JWT token
        order: 1
        title: JWT Header KID
        airbyte_secret: true
      vendorID:
        type: string
        order: 3
        title: vendorID
        airbyte_secret: true
      secret_key:
        type: string
        description: The secret key to use for the JWT token
        order: 2
        title: JWT Secret Key
        multiline: true
        airbyte_secret: true
      sales_reports_start_date:
        type: string
        description: >-
          Earliest report date (YYYY-MM-DD) for daily Sales and Trends streams
          (sales_report, subscription_report, subscriber_report). Does not apply
          to subscription_event_report (see
          subscription_event_reports_start_date). When unset, defaults to
          Apple's 365-day retention window on the first sync (empty cursor);
          later syncs advance from saved state with T-2 lag via end_datetime.
          Set explicitly to override the start date.
        order: 5
        title: Sales reports start date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2025-01-01"
      reviews_start_date:
        type: string
        order: 4
        title: Reviews start date
        default: "2020-01-01T00:00:00Z"
      finance_reports_start_date:
        type: string
        description: >-
          Earliest report month (YYYY-MM) for finance_report. When unset,
          defaults to Apple's 12-month retention window (~11 months) on the
          first sync (empty cursor). End month is the latest available (month
          before T-35 days). Set explicitly to override the start month.
        order: 6
        title: Finance reports start date
        pattern: ^[0-9]{4}-[0-9]{2}$
        examples:
          - 2025-01
      analytics_reports_start_date:
        type: string
        description: >-
          Earliest processing date (YYYY-MM-DD) for ongoing App Store Analytics
          reports (app_store_installations_and_deletions, app_download). Set to
          the ONGOING report request creation date or later; Apple does not
          backfill before that. End date is yesterday (today minus 1 day).
        order: 9
        title: Analytics reports start date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2026-07-16"
      subscription_event_skip_dates:
        type: array
        description: >-
          Daily report dates (YYYY-MM-DD) to skip for subscription_event_report.
          Apple occasionally returns an undecodable ZIP (b'PK') for these days.
          Remapped to 2099-01-01 so Apple 404/410 is IGNORE'd and the cursor
          advances with no rows. Set explicitly when needed (e.g. 2026-06-09).
        items:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        order: 8
        title: Subscription event skip dates
        examples:
          - - "2026-06-09"
      subscription_event_reports_start_date:
        type: string
        description: >-
          Earliest report date (YYYY-MM-DD) for subscription_event_report
          incremental sync. Independent of sales_reports_start_date so a sales
          backfill does not widen SUBSCRIPTION_EVENT slices. When unset,
          defaults to Apple's 365-day retention window. End date uses a T-3
          completeness lag (SUBSCRIPTION_EVENT data is final ~3 days after the
          event date; see Apple Sales/Trends report docs).
        order: 7
        title: Subscription event reports start date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2025-07-01"
    additionalProperties: true
