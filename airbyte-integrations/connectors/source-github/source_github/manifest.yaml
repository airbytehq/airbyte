  # `workflow_runs_for_attempts` is the parent listing behind `workflow_run_attempts`, not a catalog
  # stream: the exposed `workflow_runs` stream is still Python (streams.py::WorkflowRuns) and stays
  # there until the workflow family is migrated. Both read the same endpoint, so this definition
  # deliberately mirrors WorkflowRuns' incremental contract instead of inventing a second one.
  #
  # Four differences from WorkflowRuns, all forced by what the declarative components can express:
  #  - the 32-day pagination break is anchored on `start_date` rather than on the cursor,
  #    because a stop condition cannot see the cursor, so an incremental sync pages back further
  #    than legacy did (see the paginator below);
  #  - the run listing is fetched a second time when both streams are selected, because a manifest
  #    stream and a Python stream cannot share a read - `use_cache` would not help, the two build
  #    separate cache backends and only this one sends `created`;
  #  - the cursor boundary is inclusive. `ConcurrentCursor.should_be_synced` is
  #    `start <= value <= end` where `SemiIncrementalMixin` used a strict `>`, so the newest run of
  #    each repository is re-read once per sync. Deduplicating destinations absorb it;
  #  - a repository added to `repositories` after the first sync starts from the global cursor,
  #    not from `start_date`. ConcurrentPerPartitionCursor seeds an unknown partition from the
  #    global cursor (its own docstring: "The history data added after the initial sync will be
  #    missing"), where legacy backfilled it. The `repositories` stream above carries the same
  #    caveat for the same reason.
  workflow_runs_for_attempts_stream:
    type: DeclarativeStream
    name: workflow_runs_for_attempts
    primary_key: "id"
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/requester_base"
        path: "repos/{{ stream_partition.repository }}/actions/runs"
        http_method: GET
        # Legacy skipped a 403 on a repo-scoped stream with a warning rather than failing the
        # sync (streams.py:176-183), and one repository the token cannot read Actions for must
        # not take the other repositories down with it.
        error_handler:
          $ref: "#/definitions/error_handler_repo_scoped"
        request_parameters:
          # WorkflowRuns is not a `large_stream`, so it pages at constants.DEFAULT_PAGE_SIZE.
          per_page: "100"
          # Deliberately no `created` filter, however tempting it is as a server-side form of the
          # legacy pagination break. GitHub caps this endpoint at 1000 results whenever `actor`,
          # `branch`, `check_suite_id`, `created`, `event`, `head_sha` or `status` is present, and
          # the truncation is invisible. Measured on a 23352-run repository:
          # `created=>=1970-01-01` served pages 1-10 with `total_count: 23352`, then answered page
          # 11 with an empty array, `total_count: 0` and no `rel="next"` link; the unfiltered
          # listing returned 100 records on page 20 of the same repository. A filtered listing
          # would silently drop every run past the newest 1000 while the cursor advanced past
          # them, so no later sync would go back for them.
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["workflow_runs"]
      paginator:
        $ref: "#/definitions/page_link_paginator"
        pagination_strategy:
          $ref: "#/definitions/page_link_paginator/pagination_strategy"
          # The legacy pagination break (streams.py::WorkflowRuns.read_records), as far as a
          # declarative stop condition can carry it. The listing is ordered by `created_at`
          # descending, and GitHub refuses to re-run a workflow more than 32 days after it was
          # created, so once a page ends below `start_date - 32 days` nothing further down can
          # have been updated after `start_date` - and the cursor is never below `start_date`.
          #
          # Anchored on `start_date` rather than on the cursor because a `stop_condition` is
          # evaluated with `config`, `response`, `headers`, `last_record` and `last_page_size`
          # only. An incremental sync therefore pages back to `start_date - 32 days` instead of
          # to `cursor - 32 days`: more pages than legacy spent on an incremental sync, exactly
          # what legacy spent on its first sync, and exactly what legacy spent on every sync of a
          # config with no `start_date` (`break_point` stayed None and it paged the whole
          # history).
          #
          # Anchored on the raw page tail rather than on `last_record`, which is the wrong value
          # here twice over: `SimpleRetriever._read_pages` assigns it from records that survived
          # the record selector, and this stream's selector is the `is_client_side_incremental`
          # decorator. A page of runs that are all older than the cursor - which is exactly what
          # the deep pages of an old listing are - leaves `last_record` at None and never breaks,
          # and a record that does survive the filter has `updated_at >= cursor >= start_date`,
          # so by the same 32-day rule its `created_at` is inside the window and the comparison
          # can never be true. `response` is the decoded body, which the filter cannot touch.
          #
          # `(config.get('start_date') or '') != ''` rather than a bare `config.get('start_date')`:
          # InterpolatedBoolean compares the *rendered* string against a fixed false-values list
          # that does not include "None", so a present-but-null `start_date` would render "None",
          # read as true, and stop pagination after the first page. `is string` for the same class
          # of reason: `JinjaInterpolation._eval` swallows a TypeError and returns the raw
          # template, which reads as true, so comparing a null `created_at` with `<` would stop
          # the walk and lose every page behind it.
          stop_condition: >-
            {{ (config.get('start_date') or '') != ''
            and (response.get('workflow_runs') or []) | length > 0
            and response['workflow_runs'][-1].get('created_at') is string
            and response['workflow_runs'][-1]['created_at'] < format_datetime(str_to_datetime(config['start_date']) - duration('P32D'), '%Y-%m-%dT%H:%M:%SZ') }}
      partition_router:
        $ref: "#/definitions/repository_partition_router"
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: "updated_at"
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%SZ"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      start_datetime:
        type: MinMaxDatetime
        # Same `or` guard as the `repositories` stream: a present-but-null `start_date` would
        # otherwise reach MinMaxDatetime as the literal string "None" and abort the stream.
        datetime: "{{ config.get('start_date') or '1970-01-01T00:00:00Z' }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      # Filters the listing on `updated_at` exactly as the legacy SemiIncrementalMixin did. Not
      # `is_data_feed`: that stops paginating once a page ends at or below the cursor, and this
      # listing is ordered by `created_at`, not by `updated_at` - a run created long ago and
      # re-run yesterday sits far down the listing, so a cursor-field stop condition would cut
      # the sync short of exactly the records this stream exists for.
      is_client_side_incremental: true
    schema_loader:
      type: InlineSchemaLoader
      # Only the fields this stream is read for: the cursor, the run URL and attempt count the
      # child slices on, and `created_at`, which the paginator's stop condition compares against
      # the re-run window. The records are never emitted to a destination.
      schema:
        $schema: https://json-schema.org/draft-07/schema#
        type: object
        properties:
          id:
            type:
              - "null"
              - integer
          url:
            type:
              - "null"
              - string
          run_attempt:
            type:
              - "null"
              - integer
          created_at:
            type:
              - "null"
              - string
          updated_at:
            type:
              - "null"
              - string

  # The stream oncall#8827 asked for. `GET /repos/{owner}/{repo}/actions/runs` returns one record
  # per run - the latest attempt - so when a workflow is re-run every earlier attempt disappears
  # from `workflow_runs`, and no amount of primary-key surgery on that stream brings them back
  # because they were never emitted. They are only reachable through the per-attempt endpoint, one
  # attempt per request, which is what this stream reads.
  # https://docs.github.com/en/rest/actions/workflow-runs?apiVersion=2022-11-28#get-a-workflow-run-attempt
  workflow_run_attempts_stream:
    type: DeclarativeStream
    name: workflow_run_attempts
    # Every attempt of a run carries the same `id`, so `run_attempt` is what makes a record unique.
    primary_key:
      - id
      - run_attempt
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/requester_base"
        # `run_url` is the parent record's `url`, an absolute URL. HttpRequester._join_url urljoins
        # the path onto `url_base` and an absolute path wins, so this stays on whatever host the
        # config names - GitHub Enterprise Server included - without repeating `url_base` here.
        # The first request of each partition targets the latest attempt; the paginator below walks
        # back from there, so this stream costs `run_attempt` requests per run.
        # `or 1` because `run_attempt` is not required by GitHub's workflow-run schema and
        # SubstreamPartitionRouter._extract_extra_fields yields None for a missing field, which
        # Jinja renders as the literal "None" - the request would 404 and the run would be
        # dropped in full. A run without `run_attempt` has exactly one attempt.
        path: "{{ stream_partition.run_url }}/attempts/{{ stream_slice.extra_fields.run_attempt or 1 }}"
        http_method: GET
        error_handler:
          $ref: "#/definitions/error_handler_attempt_chain"
      record_selector:
        type: RecordSelector
        extractor:
          # Unlike the listing, the attempt endpoint returns a single workflow run object.
          type: DpathExtractor
          field_path: []
        # `field_path: []` emits whatever the body is, so a 200 carrying an envelope rather than
        # a run - GitHub answers `{"message": ...}` with 200 on some redirect and deprecation
        # paths - would otherwise land in the destination as a row whose whole primary key is
        # null. Both key fields are required, and deliberately nothing invents a missing
        # `run_attempt`: the attempt number is only knowable from the request path, which a
        # transformation cannot see, so defaulting it to 1 would label a mid-chain attempt as
        # attempt 1 and collide with the real one. Skipping the unkeyable record loses that one
        # attempt; mislabelling it silently overwrites a good one on a deduplicating destination.
        # The walk itself continues either way - the paginator only stops on proven non-descent.
        record_filter:
          type: RecordFilter
          condition: "{{ record.get('id') is integer and record.get('run_attempt') is integer }}"
      paginator:
        # `previous_attempt_url` is the documented back-link from an attempt to the one before it,
        # and null on the first attempt - so the attempt chain is literally a cursor pagination and
        # needs no attempt arithmetic. There is no "list attempts" endpoint to page instead.
        type: DefaultPaginator
        page_token_option:
          type: RequestPath
        pagination_strategy:
          type: CursorPagination
          cursor_value: "{{ response['previous_attempt_url'] }}"
          # First clause is the normal end of the walk: attempt 1 reports a null
          # `previous_attempt_url`. The rest is a loop guard, because `DefaultPaginator` has no
          # page cap and `last_page_token_value` is not passed to `stop_condition`
          # (cursor_pagination_strategy.py), so a link that points at the current attempt, or
          # oscillates between two, would page until the sync is killed.
          #
          # It stops only on positive proof that the chain failed to descend - a link whose
          # attempt number is not below the attempt just read. Everything else keeps walking:
          # a missing or non-integer `run_attempt` makes `is number` false and the guard yields
          # False rather than truncating the chain, and it never evaluates `<` on mismatched
          # types. That matters because `JinjaInterpolation._eval` swallows a `TypeError` and
          # returns the raw template, which `InterpolatedBoolean` then reads as true - so an
          # expression that can raise is an expression that silently stops the walk.
          # The regex is not anchored on the end of the string: `.../attempts/3/` and
          # `.../attempts/3?x=1` would both fail to match an anchored pattern, and the guard would
          # then wave through exactly the malformed links it exists to catch.
          stop_condition: >-
            {{ not response.get('previous_attempt_url')
            or (response.get('url') is string
            and not response['previous_attempt_url'].startswith(response['url'] ~ '/attempts/'))
            or (response.get('run_attempt') is number
            and (response['previous_attempt_url'] | regex_search('/attempts/([0-9]+)(?:[/?#]|$)') or '') != ''
            and (response['previous_attempt_url'] | regex_search('/attempts/([0-9]+)(?:[/?#]|$)') | int) >= response['run_attempt']) }}
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: "#/definitions/workflow_runs_for_attempts_stream"
            parent_key: "url"
            partition_field: "run_url"
            # The latest attempt number, needed to address the first request of the chain. The
            # listing already carries it, so it costs no extra call.
            extra_fields:
              - - run_attempt
            # This is what makes the stream incremental. The parent decides which runs are new by
            # filtering on the run's own `updated_at`; every attempt of a run it yields is emitted
            # whatever that attempt's `updated_at` says. Filtering the attempts themselves would
            # drop precisely the records this stream exists for - a sync landing between the first
            # attempt finishing and the re-run starting leaves the cursor above attempt 1's
            # `updated_at`, and attempt 1 would then never be emitted by any sync.
            incremental_dependency: true
    incremental_sync:
      # Required for `incremental_dependency` to take effect: the CDK only persists parent state
      # inside the child's state, and only for a child that declares a cursor of its own
      # (model_to_component_factory::_warn_on_ineffective_incremental_dependency). This cursor
      # deliberately does no filtering - no `is_client_side_incremental`, no request options - so
      # it tracks the high-water mark and nothing else, and the parent state next to it is what
      # actually narrows the next sync.
      type: DatetimeBasedCursor
      cursor_field: "updated_at"
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%SZ"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config.get('start_date') or '1970-01-01T00:00:00Z' }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      # One partition per workflow run, so per-partition state would grow by an entry per run and
      # be dropped again at ConcurrentPerPartitionCursor.DEFAULT_MAX_PARTITIONS_NUMBER. A run is
      # never revisited once its attempts are read, so there is nothing per-partition worth
      # keeping; the parent's per-repository state carries the resumption point.
      global_substream_cursor: true
