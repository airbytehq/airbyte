version: "7.28.2"
type: DeclarativeSource

definitions:
  # Config-derived Jinja fragments, hoisted so the two routers that expand wildcards and the
  # two record filters that match against them cannot drift apart. `$ref` in value position
  # resolves to the scalar before component construction, so these behave exactly like the
  # literal strings they replace.
  #
  # `wildcard_organizations` lists the orgs named by a wildcard entry (`org/*`, `org/prefix*`,
  # `org/pre*fix`). The star is matched wherever it sits in the repo part, which makes this
  # expression the exact complement of the explicit-repo list below (`^([^*]+)$`, i.e. "contains
  # no star") and consistent with `wildcard_repository_filter`. An earlier `[*]$` anchor left an
  # entry with an interior star matching neither list, so it was dropped with no request and no
  # warning while the legacy Python resolver expanded it.
  # `wildcard_repository_filter` keeps a repo whose `full_name` matches any wildcard entry —
  # and passes everything when config declares no wildcard at all, which is the legacy
  # `Repositories(pattern=None)` behavior. That pass-all clause is inert for the resolver
  # stream, whose partitions *are* the wildcard orgs: with no wildcards it has no partitions
  # and the filter never runs.
  wildcard_organizations: "{{ config.get('repositories', []) | map('regex_search', '^([^/]+)/[^/]*[*]') | select | unique | list }}"
  wildcard_repository_filter: >-
    {{ (config.get('repositories', []) | map('regex_search', '^(.*[*].*)$') | select | list | length) == 0
       or record['full_name'] | regex_search('^((' ~ (config.get('repositories', []) | map('regex_search', '^(.*[*].*)$') | select | map('replace', '*', '.*') | join(')|(')) ~ '))') }}

  requester_base:
    type: HttpRequester
    url_base: "{{ config.get('api_url', 'https://api.github.com').rstrip('/') }}"
    authenticator:
      type: RateLimitedMultipleTokenAuthenticator
      # Precedence must match SourceGithub.get_access_token: legacy root-level
      # `access_token` first, then `credentials.access_token`, then
      # `credentials.personal_access_token` — so manifest and Python streams
      # always authenticate with the same token.
      tokens: "{{ config.get('access_token', config.get('credentials', {}).get('access_token', config.get('credentials', {}).get('personal_access_token', ''))) }}"
      token_delimiter: ","
      auth_method: "token"
      header: "Authorization"
      # Same `is not none` guard as the backoff caps below, and for the same reason. A default
      # in `.get` only applies when the key is *absent*: a present-but-null `max_waiting_time`
      # (reachable via the API, Terraform or embedded use) returns None, which renders as the
      # literal "None", so the previous expression produced "PTNoneM" and every command failed at
      # startup. The error reads `ISO8601Error: Unrecognised ISO 8601 date format: ''` because
      # isodate splits on the "T" and reports the empty date half, not because the value was
      # empty. `check_connection` passes 0 deliberately, so the guard must distinguish null from
      # 0 — which is why this is `is not none` rather than `or 120`.
      max_wait_time: "PT{{ config['max_waiting_time'] if config.get('max_waiting_time') is not none else 120 }}M"
      quota_status_source:
        type: QuotaStatusSource
        url: "{{ config.get('api_url', 'https://api.github.com').rstrip('/') }}/rate_limit"
        request_headers:
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
        # GitHub Enterprise Server ships with HTTP API rate limiting disabled, and an instance
        # in that state answers `GET /rate_limit` with 404 {"message": "Rate limiting is not
        # enabled."}. Seeding runs before the first stream request, so without this the whole
        # connection died on a generic "Resource not found" — every command, not just sync.
        # Listed statuses seed that token's pools as untracked instead: no exhaustion waits, no
        # proactive throttling, no rotation on exhaustion, while requests are still signed and
        # tokens still rotate. Only 404, deliberately. An untracked token stays untracked for
        # the whole sync (the endpoint is never consulted for it again), so a status the
        # endpoint can also return transiently would cost quota tracking for the entire run.
        # 401/403 must never be listed — a revoked credential would then read as "quota
        # tracking unavailable" instead of as an auth failure. GitHub documents 404 as a
        # possible response for this endpoint but never states that it means rate limiting is
        # off; that mapping comes from GHES responses in the wild, which is exactly why the CDK
        # leaves it to the connector.
        unavailable_status_codes: [404]
      quotas:
        - type: TokenQuota
          name: rest
          remaining_path: ["resources", "core", "remaining"]
          reset_path: ["resources", "core", "reset"]
          limit_path: ["resources", "core", "limit"]
          # Reconcile the pool against every response, not just the initial /rate_limit
          # seeding. GitHub returns these headers on every authenticated REST response, and
          # the local counters drift whenever the token is shared with another client, when
          # requests overlap under `concurrency_level`, or when a sync outlives its seeding.
          remaining_header: "X-RateLimit-Remaining"
          reset_header: "X-RateLimit-Reset"
          limit_header: "X-RateLimit-Limit"
          # No `exhaustion_status_codes`, deliberately. GitHub's 403 is not exclusively a
          # rate-limit code: a secondary limit (403 + `Retry-After`, primary quota untouched)
          # and a missing-scope denial both use it, and neither carries
          # `X-RateLimit-Remaining: 0`. Listing 403 would zero the pool for those, which on a
          # single-token config leaves nothing to rotate to and turns a retryable wait into
          # "Rate limit is exceeded for all provided tokens." Primary exhaustion needs no
          # status code here: GitHub reports it as `X-RateLimit-Remaining: 0`, which the
          # header reconciliation above already picks up.
        - type: TokenQuota
          name: graphql
          remaining_path: ["resources", "graphql", "remaining"]
          reset_path: ["resources", "graphql", "reset"]
          limit_path: ["resources", "graphql", "limit"]
          # /graphql answers with the same header names, scoped to the separate GraphQL
          # point budget, so the pool reconciles the same way as `rest`.
          remaining_header: "X-RateLimit-Remaining"
          reset_header: "X-RateLimit-Reset"
          limit_header: "X-RateLimit-Limit"
          matchers:
            - type: HttpRequestRegexMatcher
              url_path_pattern: "/graphql"
    request_headers:
      User-Agent: "PostmanRuntime/7.28.0"
    error_handler:
      $ref: "#/definitions/strict_access_error_handler"

  # Requester for the repo-scoped child streams (`repos/{repository}/...`). Same transport
  # as `requester_base`, but an inaccessible or empty single repository is skipped instead
  # of failing the sync — see `skip_inaccessible_error_handler`.
  repository_scoped_requester:
    $ref: "#/definitions/requester_base"
    http_method: GET
    request_parameters:
      # constants.DEFAULT_PAGE_SIZE — none of these streams was a `large_stream`, so the
      # deprecated `page_size_for_large_streams` config never applied to them.
      per_page: "100"
    error_handler:
      $ref: "#/definitions/skip_inaccessible_error_handler"

  # --- Error handling -------------------------------------------------------------
  #
  # Replicates the legacy GithubStreamABC error contract. Rate limits are waited out
  # instead of failing the sync; GitHub signals them three different ways, and the legacy
  # handler retried on any of them
  # (errors_handlers.py::GithubStreamABCErrorHandler.interpret_response), so all three are
  # matched by the filters below, ahead of the 404/403/409 filters:
  #   1. a `Retry-After` header (sent on most, but per the docs not all, secondary-limit
  #      responses);
  #   2. an "API rate limit exceeded" message (primary limit) or an "exceeded a secondary
  #      rate limit" message (secondary limit without `Retry-After` — note secondary limits
  #      are tracked separately from the primary quota, so `X-RateLimit-Remaining` may still
  #      be non-zero);
  #   3. `X-RateLimit-Remaining: 0` on an error response, which is the fallback the docs
  #      prescribe when `Retry-After` is absent. The declarative predicate cannot see the
  #      status code, so "is an error response" is approximated by GitHub's error envelope
  #      (a JSON object with a `message`); successful payloads are arrays, or objects
  #      without a top-level `message`, and must not match — the request that spends the
  #      last quota point returns 200 with `X-RateLimit-Remaining: 0` and its records have
  #      to be kept (token rotation handles the exhausted token).
  # Unmatched responses (401, 429, 5xx, ...) fall back to the CDK default mapping.
  #
  # What differs per requester is only the terminal 403/409 handling, so the filters are
  # separate definitions composed into the two handlers at the end of this block.
  # `DefaultErrorHandler` returns the first matching filter, which is why order matters:
  # every handler lists `success_filter` first — it evaluates filters before checking
  # `response.ok`, so a 200 carrying `Retry-After` would otherwise be classified
  # RATE_LIMITED and have its records discarded — then the rate-limit filters, then the
  # terminal 404/403/409/410 ones.
  #
  # DELIBERATE DIVERGENCE — 502/504 after retries. Both handlers leave 5xx to the CDK default
  # mapping, so a repository that keeps returning 502/504 is retried and then fails the stream.
  # Legacy retried the same way but `GithubStreamABC.read_records` caught the exhausted-retries
  # `AirbyteTracedException` for 502/504, logged a warning and moved on to the next repository
  # (the `BAD_GATEWAY` and `GATEWAY_TIMEOUT` branches of that method), i.e. it reported a
  # COMPLETE sync with that repository's records silently missing. Failing the stream is the
  # better contract, and `SourceGithub.continue_sync_on_stream_failure` keeps the other streams
  # going. Parity is not
  # reachable declaratively anyway: `DefaultErrorHandler` has no "retry N times, then ignore",
  # and a `502/504 -> IGNORE` filter would drop the repository on the *first* blip instead of
  # retrying it. Pinned by `test_repeated_502_fails_the_stream`.
  #
  # KNOWN GAP — skip logging. The `IGNORE` path logs the filter's `error_message` at INFO with
  # no slice context, whereas legacy logged `Skipping <stream> for repository <repo>` at
  # WARNING. `HttpResponseFilter.error_message` only interpolates `response` and `headers`, so
  # neither the stream name nor `stream_partition` is reachable from here. Follow-up: give
  # `HttpResponseFilter` access to the stream slice in the CDK (same bucket as the token
  # rotation follow-up noted below).
  rate_limit_backoff_strategies:
    # Both strategies are capped by the user's Max Waiting Time, so that setting bounds every
    # rate-limit wait rather than only the ones the authenticator decides before sending.
    # `check_connection` resolves the manifest with `max_waiting_time: 0`, which makes the cap 1s:
    # an interactive check then fails in seconds with the rate-limit message instead of sleeping
    # until the reset. A sync keeps the user's budget.
    #
    # Requires CDK >= 7.28.1, which ships airbytehq/airbyte-python-cdk#1126. Before it,
    # `HttpClient` asked the authenticator for a spare credential only *after* a strategy returned
    # a wait, and a cap raises instead of returning — so a budget shorter than the distance to the
    # reset ended the stream rather than rotating onto a healthy token (measured on 7.28.0: 30min
    # budget against a 60min reset failed with a second token idle). The rotation question is now
    # asked first and the cap only governs waits that are actually taken, which
    # `test_short_wait_budget_does_not_cost_token_rotation` proves end to end. 7.28.1 also resolves
    # the cap at construction, so an expression this manifest got wrong fails at startup rather
    # than at whichever rate limit reaches it first.
    #
    # `is not none` rather than `or 120`: a present-but-null `max_waiting_time` would reach the
    # multiplication as None, and a falsy test would read check's deliberate 0 as absent and hand
    # it 120 minutes. `+ 1` keeps the budget inclusive — the CDK compares with `>=`, so a user on
    # the spec's minimum of 1 minute would otherwise get a 60s cap equal to the `min_wait: 60`
    # floor below, and every headerless 5xx would fail instead of retrying.
    - type: WaitTimeFromHeader
      header: "Retry-After"
      max_waiting_time_in_seconds: "{{ (config['max_waiting_time'] if config.get('max_waiting_time') is not none else 120) * 60 + 1 }}"
    - type: WaitUntilTimeFromHeader
      header: "X-RateLimit-Reset"
      min_wait: 60
      # The cap is compared against the computed wait, not the raw reset timestamp, and it is
      # applied after `min_wait` — so during check, where the cap is 1s, even the 60s floor below
      # is refused.
      max_waiting_time_in_seconds: "{{ (config['max_waiting_time'] if config.get('max_waiting_time') is not none else 120) * 60 + 1 }}"
      # The 60s floor the legacy strategy enforced (backoff_strategies.py), so a reset
      # timestamp already in the past, or seconds away, doesn't turn into a tight retry
      # loop against a quota that hasn't actually refilled.
      #
      # It does NOT land on exactly the same responses legacy floored. Measured:
      #
      #                                     here    legacy
      #   403 + Retry-After: 30              30s      60s    <- floor missing
      #   403 + X-RateLimit-Reset now+10     60s      60s
      #   403 + reset already past           60s      60s
      #   500 / timeout, no such headers     60s     expo    <- floor leaking
      #
      # Two CDK strategies with mismatched options are why: WaitTimeFromHeader has no
      # `min_wait` at all, so Retry-After is used raw; WaitUntilTimeFromHeader returns
      # `min_wait` outright when its header is *absent* rather than treating it as a floor
      # on a computed wait, and backoff_strategies are shared by every retryable response
      # on the requesters that inherit these handlers.
      #
      # Accepted deliberately, after measuring the alternatives:
      #   - A CompositeErrorHandler with `min_wait` on a rate-limit-only branch changes
      #     nothing. `CompositeErrorHandler.backoff_strategies` flattens every child's
      #     strategies into one list -- its own docstring says the list "is not used to map
      #     different strategies to different error conditions" -- and HttpClient takes the
      #     first truthy one regardless of which branch matched. Byte-identical backoffs.
      #   - Dropping `min_wait` fixes the leak but costs more: a stale or near reset then
      #     returns None, the rate-limit path lands on backoff.expo with jitter=None, and
      #     the retry budget is spent at 1s, 2s, 4s, 8s, 16s against a limit that has not
      #     refilled. That is what the floor exists to prevent.
      #
      # The fix belongs in the CDK: WaitUntilTimeFromHeader should return None when its
      # header is missing (`min_wait` is documented as a "minimum time to wait for safety",
      # i.e. a floor on a computed wait), and WaitTimeFromHeader should gain `min_wait`.
      # With the header present but stale, max(negative, min_wait) already yields 60s, so
      # the floor survives exactly where it belongs. Four other connectors combine these
      # two strategies and would move the same way.
      #
      # Until then: a headerless 5xx or a connection timeout waits 60s per attempt, up to
      # max_retries (5), on every stream that inherits these handlers.
      # The wait below is only paid when rotating cannot help. CDK 7.26.0 reconciles the
      # authenticator's counters against every response (the `*_header` fields on the
      # quota pools above), so a primary rate limit — which GitHub reports as
      # `X-RateLimit-Remaining: 0` — spends the rejected token's pool, and `HttpClient`
      # asks `has_alternative_token` before sleeping on a RATE_LIMITED resolution: with a
      # spare token it retries in 0.1s on that token instead of waiting out this window.
      # This covers the reactive rotation the legacy strategy did at the 10-minute mark
      # (backoff_strategies.py) and applies to manifest and Python streams alike, since
      # both share one authenticator.
      # Still waited out, correctly: a secondary rate limit, where the token's counters
      # stay positive. GitHub scopes secondary limits per account, so rotating to another
      # token of the same account would only be rejected again.

  # Short-circuit successful responses before any rate-limit filter sees them.
  # DefaultErrorHandler evaluates response_filters *before* it checks `response.ok`
  # (default_error_handler.py::interpret_response) and returns on the first match, so
  # without this a 200 that merely carries `Retry-After` — GHE, a proxy or a CDN
  # throttling on its own account — is classified RATE_LIMITED: its records are
  # discarded and the request is retried until `max_retries` runs out, failing the
  # stream. The guard has to live in its own filter rather than as a conjunct in the
  # predicates below, because `http_codes` is OR'd with `predicate` inside a filter
  # (http_response_filter.py::_matches_filter) and the predicate context carries only
  # the parsed body and the headers — no status code.
  # Deliberately 200 only: GitHub answers 202 on /stats/contributors to mean "still
  # computing, retry later", which `contributor_activity` backs off on today and which
  # must not become a success when that stream migrates onto one of these handlers.
  success_filter:
    type: HttpResponseFilter
    http_codes: [200]
    action: SUCCESS

  retry_after_rate_limit_filter:
    type: HttpResponseFilter
    predicate: "{{ 'Retry-After' in headers }}"
    action: RATE_LIMITED
    error_message: "GitHub rate limit hit. Waiting for the rate limit window to reset before retrying."

  primary_rate_limit_filter:
    type: HttpResponseFilter
    error_message_contains: "API rate limit exceeded"
    action: RATE_LIMITED
    error_message: "GitHub rate limit hit. Waiting for the rate limit window to reset before retrying."

  secondary_rate_limit_filter:
    type: HttpResponseFilter
    error_message_contains: "secondary rate limit"
    action: RATE_LIMITED
    error_message: "GitHub secondary rate limit hit. Waiting before retrying."

  exhausted_quota_filter:
    type: HttpResponseFilter
    # `is not none` (rather than a bare `response.get('message')`) is required:
    # InterpolatedBoolean compares the *rendered* string against a fixed
    # false-values list that does not include "None", so a falsy `.get()` would
    # evaluate to true and rate-limit successful responses.
    predicate: "{{ headers.get('X-RateLimit-Remaining') == '0' and response is mapping and response.get('message') is not none }}"
    action: RATE_LIMITED
    error_message: "GitHub rate limit exhausted (X-RateLimit-Remaining: 0). Waiting for the rate limit window to reset before retrying."

  # GitHub answers 410 Gone when the feature backing an endpoint is turned off for the
  # repository ("Issues are disabled for this repo.", "Projects are disabled for this repo."),
  # and the legacy handler skipped exactly those (errors_handlers.py::is_gone_with_feature_disabled).
  # 410 is absent from the CDK default mapping, so without this filter such a response would be
  # retried five times behind the 60s backoff floor and then fail the stream.
  #
  # This has to be a predicate rather than `http_codes: [410] + error_message_contains`:
  # HttpResponseFilter ORs its conditions, so combining them would skip *every* 410. The predicate
  # cannot see the status code, so it keys off GitHub's error envelope instead — the same
  # `response is mapping` guard the quota filter above uses, since a successful list response is a
  # JSON array and a successful single-repo response has no top-level `message`. `| string` keeps a
  # non-string `message` from raising inside the template.
  #
  # Because the status code is invisible here, the message match is deliberately narrower than
  # legacy's bare "is disabled"/"are disabled": it must name a feature GitHub can actually turn off
  # for a repository behind one of this connector's endpoints. Legacy could afford the loose match
  # because it had already established `status_code == 410`; here the same loose match would also
  # swallow a 401 "Your account is disabled" or any future error whose wording happens to mention
  # something disabled, silently dropping the repository. Migrating a stream whose feature can be
  # disabled per repository means adding that word to the list below — and the failure mode if it
  # is forgotten is `gone_fail_filter` failing the stream with an actionable message, not a silent
  # skip.
  #
  # Two escaping traps, both silent:
  #   - `!= ''` rather than `is not none`. The CDK's `regex_search` filter returns an empty string
  #     on no match, and InterpolatedBoolean's false-values list does not contain "None", so
  #     `is not none` would render "True" for every response and skip everything.
  #   - `\\b`, not `\b`. Jinja parses its own string literals with Python escapes, so a single
  #     `\b` reaches `re` as a backspace character (0x08) and the pattern never matches — the
  #     failure is a filter that quietly stops skipping, not an error.
  disabled_feature_skip_filter:
    type: HttpResponseFilter
    predicate: >-
      {{ response is mapping
         and ((response.get('message') or '') | string
              | regex_search('(?i)\\b(issues|projects|discussions) (?:are|is) disabled\\b')) != '' }}
    action: IGNORE
    error_message: "Skipping this repository: GitHub reports the feature backing this stream is disabled for it (HTTP 410 Gone)."

  # Any other 410 is unexpected and fails fast with the legacy message
  # (errors_handlers.py::GITHUB_DEFAULT_ERROR_MAPPING). Must come after
  # `disabled_feature_skip_filter`, which is the expected case.
  gone_fail_filter:
    type: HttpResponseFilter
    http_codes: [410]
    action: FAIL
    failure_type: config_error
    error_message: >-
      GitHub returned 410 Gone for an unexpected reason. The endpoint or API version may be
      deprecated. Verify the connector version is current and the endpoint is still supported.

  # 404 on an organization or repository is skipped with a warning so one deleted repo or
  # renamed org doesn't fail the whole sync (`check` enumerates the partition routers below
  # and relies on the same skip semantics).
  not_found_skip_filter:
    type: HttpResponseFilter
    http_codes: [404]
    action: IGNORE
    error_message: "Syncing this stream isn't available for this organization/repository (HTTP 404). Skipping."

  # Legacy re-raised 403 for `Repositories` (the `Organizations` branch of
  # `GithubStreamABC.read_records`), so the repo listing and the resolver streams fail with an
  # actionable scopes/SSO message. That is what lets `check` catch a token with bad scopes.
  forbidden_fail_filter:
    type: HttpResponseFilter
    http_codes: [403]
    action: FAIL
    failure_type: config_error
    error_message: >-
      GitHub denied access (HTTP 403). Your token may be missing required scopes
      (this connector typically needs: repo, read:org, read:user, read:project, workflow),
      or this organization may require SAML SSO authorization.
      See https://docs.github.com/en/rest/using-the-rest-api/troubleshooting-the-rest-api

  # Legacy skipped 403 with a warning for the repo-scoped streams (the non-`Organizations`
  # branch of `GithubStreamABC.read_records`): one repository the token cannot read must not
  # fail the other partitions. This filter runs after the rate-limit filters above, so a
  # secondary-limit 403 is still retried rather than silently dropping the repository.
  forbidden_skip_filter:
    type: HttpResponseFilter
    http_codes: [403]
    action: IGNORE
    error_message: >-
      GitHub denied access to this repository (HTTP 403). Your token may be missing
      required scopes, or this organization may require SAML SSO authorization. Skipping
      this repository.

  # GitHub answers 409 "Git Repository is empty." for a repository with no commits
  # (`branches` and `tags` hit this). Legacy IGNOREd that exact message and retried any
  # other 409 until `read_records` warned and skipped the slice, so skipping every 409
  # here is the same observable outcome without spending the retry budget.
  empty_repository_skip_filter:
    type: HttpResponseFilter
    http_codes: [409]
    action: IGNORE
    error_message: "Skipping this repository (HTTP 409 Conflict). The repository is likely empty (no commits)."

  strict_access_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      $ref: "#/definitions/rate_limit_backoff_strategies"
    response_filters:
      - $ref: "#/definitions/success_filter"
      - $ref: "#/definitions/retry_after_rate_limit_filter"
      - $ref: "#/definitions/primary_rate_limit_filter"
      - $ref: "#/definitions/secondary_rate_limit_filter"
      - $ref: "#/definitions/exhausted_quota_filter"
      # No `disabled_feature_skip_filter` here, deliberately. The endpoints on this handler are
      # the repository listing and resolution (`/orgs/{org}/repos`, `/repos/{owner}/{repo}`), which
      # have no per-repository feature to disable and so never send that 410. Including it would
      # let any error envelope mentioning a disabled feature match *before* `forbidden_fail_filter`
      # and turn the 403 that `check` relies on into a silent skip.
      - $ref: "#/definitions/not_found_skip_filter"
      - $ref: "#/definitions/forbidden_fail_filter"
      - $ref: "#/definitions/gone_fail_filter"

  skip_inaccessible_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      $ref: "#/definitions/rate_limit_backoff_strategies"
    response_filters:
      - $ref: "#/definitions/success_filter"
      - $ref: "#/definitions/retry_after_rate_limit_filter"
      - $ref: "#/definitions/primary_rate_limit_filter"
      - $ref: "#/definitions/secondary_rate_limit_filter"
      - $ref: "#/definitions/exhausted_quota_filter"
      - $ref: "#/definitions/disabled_feature_skip_filter"
      - $ref: "#/definitions/not_found_skip_filter"
      - $ref: "#/definitions/forbidden_skip_filter"
      - $ref: "#/definitions/empty_repository_skip_filter"
      - $ref: "#/definitions/gone_fail_filter"

  page_link_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: "page"
    pagination_strategy:
      # GitHub's documented end-of-data signal is the absence of a `rel="next"` link
      # header — a short page is not guaranteed to be the last page. This mirrors the
      # legacy `GithubStreamABC.next_page_token`, which parsed `page` out of that same link.
      # Inferring the end from `last_page_size < 100` instead would silently truncate the org
      # repo list that drives every downstream partition.
      # CursorPaginationStrategy replaces `headers["link"]` with `response.links`, so this
      # walks that dict. Chained `.get(...)` with defaults is required rather than
      # `headers.link.next.url`: on the last page there is no `next` link, and attribute
      # access would raise Jinja's UndefinedError. InterpolatedString defaults `default` to
      # the template itself, so JinjaInterpolation.eval's UndefinedError guard just
      # re-evaluates the same failing expression and the error escapes, failing the sync.
      # On the last page there is no `next` link, so `regex_search` gets "" and returns None;
      # CursorPaginationStrategy ends on `token if token else None`, so pagination stops.
      type: CursorPagination
      cursor_value: '{{ headers.get("link", {}).get("next", {}).get("url", "") | regex_search("[?&]page=([0-9]+)") }}'

  # Resolver streams: internal parent streams used only to drive the shared
  # partition routers below. They are not exposed in the catalog.
  #
  # `repositories_resolver` expands wildcard patterns (e.g. `org/*`) by listing
  # each wildcard org's repos and filtering them against the anchored pattern
  # derived inline from config. `repository_stats` resolves explicit `org/repo`
  # entries and exposes the canonical `full_name` and `organization.login`;
  # entries that 404 are skipped with a warning (see `requester_base`'s
  # error_handler), matching the legacy warn-and-continue behavior.
  repositories_resolver_stream:
    type: DeclarativeStream
    name: repositories_resolver
    primary_key: "id"
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/requester_base"
        path: "orgs/{{ stream_partition.organization }}/repos"
        http_method: GET
        use_cache: true
        request_parameters:
          per_page: "100"
          sort: "updated"
          direction: "desc"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
        record_filter:
          type: RecordFilter
          condition:
            $ref: "#/definitions/wildcard_repository_filter"
      paginator:
        $ref: "#/definitions/page_link_paginator"
      partition_router:
        type: ListPartitionRouter
        values:
          $ref: "#/definitions/wildcard_organizations"
        cursor_field: "organization"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: https://json-schema.org/draft-07/schema#
        type: object
        properties:
          id:
            type:
              - "null"
              - integer
          full_name:
            type:
              - "null"
              - string
          owner:
            type:
              - "null"
              - object
            properties:
              login:
                type:
                  - "null"
                  - string

  repository_stats_stream:
    type: DeclarativeStream
    name: repository_stats
    primary_key: "id"
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/requester_base"
        path: "repos/{{ stream_partition.repository }}"
        http_method: GET
        use_cache: true
        # Kept for request-shape parity with the legacy resolver (GitHub ignores
        # per_page on single-repo GETs).
        request_parameters:
          per_page: "100"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      partition_router:
        type: ListPartitionRouter
        values: "{{ config.get('repositories', []) | map('regex_search', '^([^*]+)$') | select | unique | list }}"
        cursor_field: "repository"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: https://json-schema.org/draft-07/schema#
        type: object
        properties:
          id:
            type:
              - "null"
              - integer
          full_name:
            type:
              - "null"
              - string
          organization:
            type:
              - "null"
              - object
            properties:
              login:
                type:
                  - "null"
                  - string

  # Shared partition routers. Repo-scoped streams reference
  # `repository_partition_router`; org-scoped streams reference
  # `organization_partition_router`.
  #
  # `repository_partition_router` yields the deduplicated union of
  # wildcard-expanded repos and validated explicit repos.
  #
  # `organization_partition_router` yields the deduplicated union of wildcard
  # orgs (derived inline from config) and the orgs owning explicit repos.
  # User-owned repos have no `organization` object, so the substream child
  # skips them (they contribute a repository but not an organization).
  repository_partition_router:
    type: UnionPartitionRouter
    partition_field: repository
    partition_routers:
      - type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: "#/definitions/repositories_resolver_stream"
            parent_key: "full_name"
            partition_field: "repository"
      - type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: "#/definitions/repository_stats_stream"
            parent_key: "full_name"
            partition_field: "repository"

  organization_partition_router:
    type: UnionPartitionRouter
    partition_field: organization
    partition_routers:
      - type: ListPartitionRouter
        values:
          $ref: "#/definitions/wildcard_organizations"
        cursor_field: "organization"
      - type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: "#/definitions/repository_stats_stream"
            parent_key: "organization/login"
            partition_field: "organization"

  repositories_stream:
    type: DeclarativeStream
    name: repositories
    primary_key: "id"
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/requester_base"
        path: "orgs/{{ stream_partition.organization }}/repos"
        http_method: GET
        request_parameters:
          per_page: "100"
          sort: "updated"
          direction: "desc"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
        record_filter:
          type: RecordFilter
          condition:
            $ref: "#/definitions/wildcard_repository_filter"
      paginator:
        $ref: "#/definitions/page_link_paginator"
      partition_router:
        $ref: "#/definitions/organization_partition_router"
    transformations:
      - type: AddFields
        fields:
          - path: ["organization"]
            value: "{{ stream_partition.organization }}"
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: "updated_at"
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%SZ"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      start_datetime:
        type: MinMaxDatetime
        # `or` rather than `config.get('start_date', default)`: the default is only
        # substituted when the key is *absent*, so a present-but-null `start_date`
        # (reachable via the API, Terraform or embedded use) would reach MinMaxDatetime as
        # the literal string "None" and abort the stream. Any falsy value falls back to the
        # epoch, matching the legacy "no start_date means replicate everything" behavior.
        datetime: "{{ config.get('start_date') or '1970-01-01T00:00:00Z' }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      # The listing is served most-recent-first (`sort=updated&direction=desc`), so the
      # cursor stop condition ends pagination at the first page whose last record is at or
      # below the partition cursor. This replaces the legacy `Repositories.is_sorted =
      # "desc"` early break; without it every incremental sync walked the org's entire
      # repo listing (ceil(repos/100) requests per org per sync instead of ~1).
      # The CDK's data-feed post-pagination filter drops the boundary page's records that
      # are at or below the partition cursor, so only records newer than the cursor are
      # emitted. Note that ConcurrentPerPartitionCursor seeds a partition that has no state
      # from the *global* cursor, so repos of an org added to `repositories` after the
      # first sync are only emitted if updated after that cursor.
      is_data_feed: true
    state_migrations:
      - type: LegacyToPerPartitionStateMigration
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: https://json-schema.org/draft-07/schema#
        type: object
        properties:
          id:
            description: Unique identifier of the repository.
