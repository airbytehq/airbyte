  # --- Repo-scoped full-refresh REST streams --------------------------------------
  #
  # The streams below differ only in path, primary key and schema, so they share this
  # retriever. Each is partitioned by `repository_partition_router`, and `page` pagination
  # follows GitHub's `rel="next"` link header exactly as the legacy streams did.
  repository_scoped_retriever:
    type: SimpleRetriever
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path: []
    paginator:
      $ref: "#/definitions/page_link_paginator"
    partition_router:
      $ref: "#/definitions/repository_partition_router"

  # Replaces the legacy `GithubStream.transform`, which stamped the
  # partition's repository onto every record. None of these streams carries `reactions`,
  # so the `+1`/`-1` renaming that transform also did is not needed here.
  add_repository_transformation:
    - type: AddFields
      fields:
        - path: ["repository"]
          value: "{{ stream_partition.repository }}"

  assignees_stream:
    # API docs: https://docs.github.com/en/rest/issues/assignees?apiVersion=2022-11-28#list-assignees
    type: DeclarativeStream
    name: assignees
    primary_key: "id"
    retriever:
      $ref: "#/definitions/repository_scoped_retriever"
      requester:
        $ref: "#/definitions/repository_scoped_requester"
        path: "repos/{{ stream_partition.repository }}/assignees"
    transformations:
      $ref: "#/definitions/add_repository_transformation"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: https://json-schema.org/draft-07/schema#
        type: object
        properties:
          repository:
            description: Repository where the assignee is assigned
            type: string
          login:
            description: Username of the assignee
            type:
              - "null"
              - string
          id:
            description: Unique identifier of the assignee
            type:
              - "null"
              - integer
          node_id:
            description: Node ID of the assignee
            type:
              - "null"
              - string
          avatar_url:
            description: URL of the assignee's avatar image
            type:
              - "null"
              - string
          gravatar_id:
            description: Gravatar ID of the assignee
            type:
              - "null"
              - string
          url:
            description: URL of the assignee's account
            type:
              - "null"
              - string
          html_url:
            description: URL of the assignee's GitHub profile
            type:
              - "null"
              - string
          followers_url:
            description: URL of the assignee's followers
            type:
              - "null"
              - string
          following_url:
            description: URL of the assignee's following
            type:
              - "null"
              - string
          gists_url:
            description: URL of the assignee's gists
            type:
              - "null"
              - string
          starred_url:
            description: URL of the assignee's starred items
            type:
              - "null"
              - string
          subscriptions_url:
            description: URL of the assignee's subscriptions
            type:
              - "null"
              - string
          organizations_url:
            description: URL of the assignee's organizations
            type:
              - "null"
              - string
          repos_url:
            description: URL of the assignee's repositories
            type:
              - "null"
              - string
          events_url:
            description: URL of the assignee's events
            type:
              - "null"
              - string
          received_events_url:
            description: URL of the assignee's received events
            type:
              - "null"
              - string
          type:
            description: Type of the assignee's account
            type:
              - "null"
              - string
          site_admin:
            description: Boolean indicating if the assignee is a site administrator
            type:
              - "null"
              - boolean

  branches_stream:
    # API docs: https://docs.github.com/en/rest/branches/branches?apiVersion=2022-11-28#list-branches
    type: DeclarativeStream
    name: branches
    primary_key: ["repository", "name"]
    retriever:
      $ref: "#/definitions/repository_scoped_retriever"
      requester:
        $ref: "#/definitions/repository_scoped_requester"
        path: "repos/{{ stream_partition.repository }}/branches"
    transformations:
      $ref: "#/definitions/add_repository_transformation"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: https://json-schema.org/draft-07/schema#
        type: object
        properties:
          repository:
            description: Details about the repository associated with the branch.
            type: string
          name:
            description: The name of the branch.
            type:
              - "null"
              - string
          commit:
            description: Details about the commit associated with the branch.
            type:
              - "null"
              - object
            properties:
              sha:
                description: The unique identifier of the commit.
                type:
                  - "null"
                  - string
              url:
                description: The URL to view details of the commit.
                type:
                  - "null"
