  # --- GraphQL streams ------------------------------------------------------------
  #
  # The GraphQL streams post a parameterized document to `/graphql` and let the paginator
  # inject `variables.first` and `variables.after`. Injecting into `variables` (rather than
  # inlining the values into the query text, as the legacy sgqlc builders did) is what makes
  # `REDUCE_PAGE_SIZE` work: the CDK rebuilds the request body on the retry, so a reduced
  # page size actually reaches GitHub.
  #
  # `combine_mappings` merges nested body_json paths when the values do not collide, so the
  # requester owning `variables.owner`/`variables.name` and the paginator owning
  # `variables.first`/`variables.after` compose without either clobbering the other.

  # GitHub answers 502/504 when a GraphQL query is too expensive to resolve inside its
  # internal deadline — it is a statement about the size of *this* request, not a transient
  # server fault, so retrying the identical query just burns the budget and times out again.
  # The legacy handler (`errors_handlers.GitHubGraphQLErrorHandler`) tried to halve
  # `stream.page_size` and return RETRY, but HttpClient replays the same PreparedRequest and
  # the oversized `first` was already serialized into the body, so the retry never benefited;
  # only a later page saw the smaller size, and any non-502/504 response reset it. This action
  # re-enters the fetch with a smaller `first`, which is the behavior that was intended.
  graphql_reduce_page_size_filter:
    type: HttpResponseFilter
    http_codes: [502, 504]
    action: REDUCE_PAGE_SIZE
    failure_type: transient_error
    error_message: >-
      GitHub could not resolve the GraphQL query within its deadline. Retrying the same page
      with a smaller page size.

  graphql_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      $ref: "#/definitions/rate_limit_backoff_strategies"
    response_filters:
      - $ref: "#/definitions/success_filter"
      - $ref: "#/definitions/retry_after_rate_limit_filter"
      - $ref: "#/definitions/primary_rate_limit_filter"
      - $ref: "#/definitions/secondary_rate_limit_filter"
      - $ref: "#/definitions/exhausted_quota_filter"
      # Must precede the skip/fail filters below: those match on status alone, and a 502/504
      # that reached one of them first would be retried unchanged or skipped outright.
      - $ref: "#/definitions/graphql_reduce_page_size_filter"
      - $ref: "#/definitions/not_found_skip_filter"
      - $ref: "#/definitions/forbidden_skip_filter"
      - $ref: "#/definitions/gone_fail_filter"

  graphql_requester:
    $ref: "#/definitions/requester_base"
    http_method: POST
    path: "graphql"
    error_handler:
      $ref: "#/definitions/graphql_error_handler"

  # Halving on every 502/504, floored at 1, giving up after 5 reductions in a single page
  # loop. `reset_policy: NEVER` keeps the reduced size for the rest of the partition:
  # restoring it after each good page re-triggers the timeout on the next page, which is the
  # ineffective behavior the legacy handler had. The size is local to one `_read_pages` call,
  # so one repository reducing does not change the page size any other repository is using.
  graphql_page_size_reduction:
    type: PageSizeReduction
    reduction_factor: 2
    minimum_page_size: 1
    max_attempts: 5
    reset_policy: NEVER

  graphql_paginator:
    type: DefaultPaginator
    page_size_option:
      type: RequestOption
      inject_into: body_json
      field_path: ["variables", "first"]
    page_token_option:
      type: RequestOption
      inject_into: body_json
      field_path: ["variables", "after"]

  # `page_size_for_large_streams` is deprecated but still honored, and the legacy default of
  # 10 is preserved deliberately: this migration is meant to be behavior-preserving, and
  # `REDUCE_PAGE_SIZE` is the safety net rather than a licence to raise the default. Raising
  # it is a separate, measurable change.
  graphql_large_stream_page_size: "{{ config['page_size_for_large_streams'] if config.get('page_size_for_large_streams') is not none else 10 }}"

  releases_stream:
    # API docs: https://docs.github.com/en/graphql/reference/objects#release
    # GraphQL rather than REST, to get past the REST listing's 10,000-result pagination cap.
    type: DeclarativeStream
    name: releases
    primary_key: "id"
    retriever:
      type: SimpleRetriever
      page_size_reduction:
        $ref: "#/definitions/graphql_page_size_reduction"
      requester:
        $ref: "#/definitions/graphql_requester"
        request_body_json:
          query: |
            query Releases($owner: String!, $name: String!, $first: Int!, $after: String) {
              repository(owner: $owner, name: $name) {
                name
                owner { login }
                releases(first: $first, after: $after, orderBy: {field: CREATED_AT, direction: ASC}) {
                  nodes {
                    node_id: id
                    id: databaseId
                    name
                    tag_name: tagName
                    created_at: createdAt
                    published_at: publishedAt
                    updated_at: updatedAt
                    draft: isDraft
                    prerelease: isPrerelease
                    body: description
                    body_html: descriptionHTML
                    html_url: url
                    tagCommit { target_commitish: oid }
                    author {
                      __typename
                      ... on User {
                        node_id: id
                        id: databaseId
                        login
                        avatar_url: avatarUrl
                        html_url: url
                        site_admin: isSiteAdmin
                      }
                    }
                    assets: releaseAssets(first: 100) {
                      nodes {
                        node_id: id
                        name
                        content_type: contentType
                        size
                        download_count: downloadCount
                        created_at: createdAt
                        updated_at: updatedAt
                        browser_download_url: downloadUrl
                        url
                        uploader: uploadedBy {
                          __typename
                          ... on User { id: databaseId }
                        }
                      }
                      pageInfo { hasNextPage }
                    }
                    reaction_groups: reactionGroups {
                      content
                      reactors { totalCount }
                    }
                    mentions_connection: mentions(first: 0) { totalCount }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          variables:
            owner: "{{ stream_partition.repository.split('/')[0] }}"
            name: "{{ stream_partition.repository.split('/')[1] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["data", "repository", "releases", "nodes"]
      paginator:
        $ref: "#/definitions/graphql_paginator"
        pagination_strategy:
          type: CursorPagination
          # `repository` is null when the token cannot see the repo, so every hop is
          # null-guarded; a bare `response.data.repository.releases` would raise instead of
          # ending the partition cleanly.
          page_size: "{{ config['page_size_for_large_streams'] if config.get('page_size_for_large_streams') is not none else 10 }}"
          cursor_value: "{{ ((((response.get('data') or {}).get('repository') or {}).get('releases') or {}).get('pageInfo') or {}).get('endCursor') }}"
          stop_condition: "{{ not ((((response.get('data') or {}).get('repository') or {}).get('releases') or {}).get('pageInfo') or {}).get('hasNextPage') }}"
      partition_router:
        $ref: "#/definitions/repository_partition_router"
    transformations:
      - type: CustomTransformation
        class_name: source_github.components.ReleasesRecordTransformation
    incremental_sync:
      # Semi-incremental, matching legacy `SemiIncrementalMixin`: the query is ordered
      # CREATED_AT ASC and every page is read, with records at or below the partition cursor
      # dropped client-side. Ascending order means there is no early exit to take, so
      # `is_data_feed` would be wrong here.
      type: DatetimeBasedCursor
      cursor_field: "created_at"
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%SZ"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config.get('start_date') or '1970-01-01T00:00:00Z' }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      is_client_side_incremental: true
    state_migrations:
      - type: LegacyToPerPartitionStateMigration
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: https://json-schema.org/draft-07/schema#
        type: object
        properties:
          repository:
            description: The repository associated with the release.
            type: string
          url:
            description: The REST API URL for the release (synthesized from GraphQL data).
            type:
            - 'null'
