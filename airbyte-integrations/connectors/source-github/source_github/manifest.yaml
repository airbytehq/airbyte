  # Requester for the organization-scoped streams (`orgs/{organization}/...`). Same transport as
  # `requester_base`; an organization the token cannot read is skipped rather than failing the
  # sync, which is what the legacy `GithubStreamABC.read_records` did for these three streams
  # (404 -> "isn't available for organization", 403 -> "may be missing the `read:org` scope").
  #
  # `use_cache` is here for `teams` specifically. The Python `Teams` class stays behind as
  # `TeamMembers`' parent (see its docstring) and it caches too, so both name their cache
  # `teams.sqlite` and one read of `orgs/{org}/teams` serves the declarative stream and the
  # parent read. Without it the listing is fetched twice per organization whenever `teams` and
  # `team_members` are both selected. Harmless for `organizations` and `users`, which read each
  # URL once either way.
  organization_scoped_requester:
    $ref: "#/definitions/requester_base"
    use_cache: true
    http_method: GET
    request_parameters:
      # `Organizations.page_size = 100`, inherited by Teams and Users.
      per_page: "100"
    error_handler:
      $ref: "#/definitions/skip_inaccessible_error_handler"

  organization_scoped_retriever:
    type: SimpleRetriever
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path: []
    paginator:
      $ref: "#/definitions/page_link_paginator"
    # `organization_resolution_partition_router`, not `organization_partition_router`: these
    # endpoints only exist for real organizations, so the partition list has to be the
    # payload-confirmed one. The config-derived router hands over any wildcard owner, including a
    # personal account, and it also yields an org whose wildcard matched no repository — the Python
    # streams these replaced saw neither, because `SourceGithub` filters its enumeration down to
    # the owners of resolved repositories. See that definition's comment.
    partition_router:
      $ref: "#/definitions/organization_resolution_partition_router"

  # Replaces the legacy `Organizations.transform`, which stamped the partition's organization onto
  # every record. Applied to `teams` and `users` only: `Organizations.parse_response` yielded the
  # API payload untouched, and `organizations.json` has no `organization` property, so injecting
  # it there would add a field the Python implementation never emitted.
  add_organization_transformation:
    - type: AddFields
      fields:
        - path: ["organization"]
          value: "{{ stream_partition.organization }}"

