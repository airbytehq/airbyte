          html_url:
            description: The HTML URL for the release.
            type:
            - 'null'
            - string
          assets_url:
            description: The URL to fetch information about the assets linked to this release (synthesized from GraphQL
              data).
            type:
            - 'null'
            - string
          upload_url:
            description: The URL for uploading assets to the release (synthesized from GraphQL data).
