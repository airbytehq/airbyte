connector_image: airbyte/source-github:dev
test_strictness_level: "high"
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "secrets/config_oauth.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
      - config_path: "secrets/config_oauth.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        empty_streams:
          - name: "events"
            bypass_reason: "Only events created within the past 90 days can be showed. Stream is tested with integration tests."
          - name: project_cards
            bypass_reason: "The test repository has no Projects (classic) data to return; GitHub has sunset Projects (classic)."
          - name: project_columns
            bypass_reason: "The test repository has no Projects (classic) data to return; GitHub has sunset Projects (classic)."
          - name: projects
            bypass_reason: "The test repository has no Projects (classic) data to return; GitHub has sunset Projects (classic)."
          - name: workflow_jobs
            bypass_reason: "The test account returned no records for this stream on 2026-10-09; declared empty until test data is seeded."
          - name: workflow_runs
            bypass_reason: "The test account returned no records for this stream on 2026-10-09; declared empty until test data is seeded."
          - name: "workflow_run_attempts"
            bypass_reason: "airbytehq/integration-test reports total_count 0 for GET /actions/runs, so there is no run to read an attempt of. Covered by unit tests instead."
  incremental:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        future_state:
          future_state_path: "integration_tests/abnormal_state.json"
        skip_comprehensive_incremental_tests: true
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog_full_refresh_test.json"
