version: 7.28.2

type: DeclarativeSource

description: Pull data from GitHub.

check:
  type: CheckStream
  stream_names:
    - pull_requests

streams:
  - type: DeclarativeStream
    name: pull_requests
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['access_token'] }}"
        request_headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        http_method: GET
        request_parameters:
          state: all
          sort: updated
          direction: asc
          per_page: "100"
        url: >-
          https://api.github.com/repos/{{ config['owner'] }}/{{ config['repo']
          }}/pulls
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestPath
        pagination_strategy:
          type: CursorPagination
          cursor_value: "{{ headers.get('link', {}).get('next', {}).get('url') }}"
          stop_condition: "{{ not headers.get('link', {}).get('next', {}).get('url') }}"
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%SZ"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config['start_date'] }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      partition_field_end: ""
      partition_field_start: ""
