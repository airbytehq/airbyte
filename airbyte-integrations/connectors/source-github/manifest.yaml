spec:
  type: Spec
  documentation_url: https://docs.github.com/en/rest/pulls/pulls
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    additionalProperties: true
    required:
      - access_token
      - owner
      - repo
      - start_date
    properties:
      access_token:
        type: string
        description: >-
          A personal access token (classic or fine-grained), GitHub App token,
          or GITHUB_TOKEN with the required scopes/permissions for the endpoints
          you wish to access. You can create a personal access token at
          https://github.com/settings/tokens. For fine-grained tokens, see
          https://github.com/settings/personal-access-tokens/new?type=beta.
        title: GitHub Access Token
        airbyte_secret: true
        order: 0
      owner:
        type: string
        description: The GitHub user or organization that owns the repository.
        title: Repository Owner
        order: 1
      repo:
        type: string
        description: The name of the repository (without the owner).
        title: Repository Name
        order: 2
      start_date:
        type: string
        description: Only pull requests updated at or after this date are synced.
        title: Start Date
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        examples:
          - "2024-01-01T00:00:00Z"
        order: 3

