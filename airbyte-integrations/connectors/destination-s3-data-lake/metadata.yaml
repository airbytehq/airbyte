data:
  ab_internal:
    ql: 100
    sl: 100
    requireVersionIncrementsInPullRequests: true
  connectorBuildOptions:
    baseImage: docker.io/airbyte/java-connector-base:2.0.1@sha256:ec89bd1a89e825514dd2fc8730ba299a3ae1544580a078df0e35c5202c2085b3
  connectorIPCOptions:
    dataChannel:
      version: "0.0.2"
      supportedSerialization: ["JSONL", "PROTOBUF"]
      supportedTransport: ["SOCKET", "STDIO"]
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  connectorSubtype: file
  connectorTestSuitesOptions:
    - suite: unitTests
    - suite: integrationTests
      testSecrets:
        - name: SECRET_DESTINATION-ICEBERG_V2_S3_GLUE_CONFIG
          fileName: glue.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_DESTINATION-ICEBERG_V2_S3_GLUE_ASSUME_ROLE_CONFIG
          fileName: glue_assume_role.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_DESTINATION-ICEBERG_V2_S3_GLUE_ASSUME_ROLE_SYSTEM_AWS_CONFIG
          fileName: glue_aws_assume_role.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  connectorType: destination
  definitionId: 716ca874-520b-4902-9f80-9fad66754b89
  # TK: the exact release version is not settled yet. 0.4.0 is a best guess (minor bump
  # because this is a breaking change on a pre-1.0.0 connector) and must be updated —
  # here, in `releases.breakingChanges`, in the changelog, and in the migration guide —
  # once the real release version is known.
  dockerImageTag: 0.4.0
  dockerRepository: airbyte/destination-s3-data-lake
  documentationUrl: https://docs.airbyte.com/integrations/destinations/s3-data-lake
  githubIssueLabel: destination-s3-data-lake
  icon: icon.svg
  license: ELv2
  name: S3 Data Lake
  releaseStage: alpha
  releases:
    breakingChanges:
      # TK: version and upgradeDeadline are placeholders — update both when the release
      # version and date are settled (destinations require at least one month of lead time).
      0.4.0:
        message:
          'This version writes the nested fields of `_airbyte_meta` (`sync_id`, `changes`, and the
          members of `changes`) as optional rather than required Iceberg fields, so external catalog
          consumers such as BigQuery Omni can read Airbyte-written Iceberg tables. Existing tables are
          migrated in place on the next sync; no user action is required to upgrade. This upgrade cannot
          be rolled back: once a table''s `_airbyte_meta` fields are optional, earlier connector versions
          fail with `Schema evolution for column "_airbyte_meta" ... is not allowed`. See the
          [migration guide](https://docs.airbyte.com/integrations/destinations/s3-data-lake-migrations)
          before pinning back to an older version.'
        upgradeDeadline: "2026-10-01"
        deadlineAction: "auto_upgrade"
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
  supportLevel: certified
  supportsRefreshes: true
  tags:
    - language:java
  externalDocumentationUrls:
    - title: AWS S3 documentation
      url: https://docs.aws.amazon.com/s3/
      type: api_reference
    - title: IAM authentication
      url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
      type: authentication_guide
    - title: Bucket policies and permissions
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-policy-language-overview.html
      type: permissions_scopes
metadataSpecVersion: "1.0"
