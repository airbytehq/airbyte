data:
  ab_internal:
    ql: 200
    sl: 200
  allowedHosts:
    hosts:
      - "*.zendesk.com"
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.45.0@sha256:a4947a37ef760ff501856dbeec22830826c1d214f0e530abfa9831e57f019809
  connectorSubtype: api
  connectorType: source
  definitionId: 40d24d0f-b8f9-4fe0-9e6c-b06c0f3f45e4
  dockerImageTag: 2.0.0
  dockerRepository: airbyte/source-zendesk-chat
  documentationUrl: https://docs.airbyte.com/integrations/sources/zendesk-chat
  externalDocumentationUrls:
    - title: Developer Updates
      url: https://support.zendesk.com/hc/en-us/sections/4405298889242-Developer-updates
    - title: Changelog
      url: https://developer.zendesk.com/api-reference/changelog/changelog/
      type: api_release_history
    - title: Zendesk Chat API reference
      url: https://developer.zendesk.com/api-reference/live-chat/introduction/
      type: api_reference
    - title: Chat authentication
      url: https://developer.zendesk.com/documentation/live-chat/getting-started/auth/
      type: authentication_guide
    - title: Zendesk feature removal announcements
      url: https://support.zendesk.com/hc/en-us/articles/4408843026714-What-is-being-removed-updated-April-2026
      type: api_deprecations
    - title: Zendesk Status
      url: https://status.zendesk.com/
      type: status_page
  githubIssueLabel: source-zendesk-chat
  icon: zendesk-chat.svg
  license: ELv2
  name: Zendesk Chat
  maxSecondsBetweenMessages: 60
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-zendesk-chat
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  releases:
    breakingChanges:
      2.0.0:
        message: >-
          Zendesk stops serving incremental exports to third-party integrations such as Airbyte from
          2026-12-02, so the `chats` stream now reads chats through the Search Chats and List Chats
          endpoints instead. Its cursor field changes from `update_timestamp` to `timestamp` and the
          fields `deleted`, `update_timestamp` and `engagements` are removed from the stream; deleted
          chats are no longer reported. Connections that sync `chats` incrementally are paused after the
          upgrade because their cursor field no longer exists: refresh the source schema and accept the
          new cursor to resume. Existing state is migrated automatically and no clear is required.
          Connections that sync `chats` in full refresh mode and connections without the `chats` stream
          need no action. See the migration guide:
          https://docs.airbyte.com/integrations/sources/zendesk-chat-migrations#upgrading-to-200
        upgradeDeadline: "2026-12-01"
        deadlineAction: auto_upgrade
        scopedImpact:
          - scopeType: stream
            impactedScopes: ["chats"]
      1.0.0:
        message: "The subdomain configuration field is now required following a Live Chat API update."
        upgradeDeadline: "2024-11-12"
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
  suggestedStreams:
    streams:
      - chats
  supportLevel: certified
  tags:
    - language:manifest-only
    - cdk:low-code
  connectorTestSuitesOptions:
    - suite: unitTests
    - suite: liveTests
      testConnections:
        - name: zendesk-chat_config_oauth_dev_null
          id: 3801d70c-d197-4bc2-a989-c48888a47fb2
        - name: zendesk-chat_config_old_dev_null
          id: 39ac48ce-6b9d-4b1d-9b62-3fd899ae1981
        - name: zendesk-chat_config_dev_null
          id: 5f92e2b6-8d51-4517-8c9a-6a1a1b29cebe
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE_ZENDESK_CHAT_CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE_ZENDESK_CHAT_OAUTH_CREDS
          fileName: config_oauth.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE_ZENDESK_CHAT_OLD_CREDS
          fileName: config_old.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
metadataSpecVersion: "1.0"
