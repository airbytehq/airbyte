# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-google-directory:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "source_google_directory/spec.json"
  connection:
    tests:
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
      - bypass_reason: "The GSM test configs fail `check`: the service account is not authorized for the requested scopes (unauthorized_client), and the OAuth client of config_oauth.json was deleted"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    bypass_reason: "The GSM test configs fail `check`: the service account is not authorized for the requested scopes (unauthorized_client), and the OAuth client of config_oauth.json was deleted"
  full_refresh:
    bypass_reason: "The GSM test configs fail `check`: the service account is not authorized for the requested scopes (unauthorized_client), and the OAuth client of config_oauth.json was deleted"
