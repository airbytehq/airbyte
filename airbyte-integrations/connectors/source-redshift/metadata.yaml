  dockerImageTag: 1.0.0
  dockerRepository: airbyte/source-redshift
  documentationUrl: https://docs.airbyte.com/integrations/sources/redshift
  githubIssueLabel: source-redshift
  icon: redshift.svg
  license: ELv2
  name: Redshift
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releases:
    breakingChanges:
      1.0.0:
        message: >-
          Redshift `date`, `timestamp`, and `timestamptz` columns are now discovered as Airbyte date,
          timestamp without time zone, and timestamp with time zone types instead of unformatted
          strings, so typed destinations can create native temporal columns. This affects only streams
          that contain at least one of these column types; `time` and `timetz` columns are unchanged.
          Destinations that can't change an existing string column to a date or timestamp column may
          fail with a schema evolution error. If that happens, refresh the source schema and clear the
          affected streams. For details, see the migration guide:
          https://docs.airbyte.com/integrations/sources/redshift-migrations#upgrading-to-100
        upgradeDeadline: "2026-10-27"
        deadlineAction: "auto_upgrade"
  releaseStage: alpha
  supportLevel: community
  tags:
    - language:java
  externalDocumentationUrls:
    - title: Amazon Redshift documentation
      url: https://docs.aws.amazon.com/redshift/
      type: api_reference
    - title: Redshift authentication
      url: https://docs.aws.amazon.com/redshift/latest/mgmt/generating-user-credentials.html
      type: authentication_guide
    - title: AWS Status
      url: https://health.aws.amazon.com/health/status
      type: status_page
