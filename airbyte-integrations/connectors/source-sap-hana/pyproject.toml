[build-system]
requires = [ "poetry-core>=1.0.0",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "0.4.1"
name = "source-sap-hana"
description = "Source implementation for SAP HANA (hdbcli): resumable full refresh, cursor-based incremental, SSH tunnel."
authors = [ "Jacopo Bonomi <jacopobonomi18@gmail.com>",]
license = "MIT"
readme = "README.md"
documentation = "https://docs.airbyte.com/integrations/sources/sap-hana"
homepage = "https://airbyte.com"
repository = "https://github.com/airbytehq/airbyte"
[[tool.poetry.packages]]
include = "source_sap_hana"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
airbyte-cdk = ">=7.30.0,<8"
hdbcli = ">=2.20"
paramiko = ">=3.4"

[tool.poetry.scripts]
source-sap-hana = "source_sap_hana.run:run"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"  # Intentionally broad to avoid conflicts with CDK
pytest-mock = ">=3.6.1"  # Intentionally broad to avoid conflicts with CDK

[tool.pytest.ini_options]
addopts = "-m 'not image_tests'"
markers = [
    "integration: requires a reachable SAP HANA instance (secrets/config.json)",
    "image_tests: builds and runs the Docker image",
]

[tool.poe]
include = [
    # Shared tasks definition file(s) can be imported here.
    # Run `poe` or `poe --help` to see the list of available tasks.
    "${POE_GIT_DIR}/poe-tasks/poetry-connector-tasks.toml",
]
