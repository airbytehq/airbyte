[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-freshservice-tests"
version = "0.1.0"
description = "Unit tests for source-freshservice"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
airbyte-cdk = { version = "7.39.1", extras = ["manifest", "testing"] }
