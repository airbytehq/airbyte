version: 7.23.7

type: DeclarativeSource

description: >-
  Syncs cards, transactions and reimbursements, plus Ramp's organisation, spend-control, accounts-payable
  and procurement resources, from Ramp's developer API.

check:
  type: CheckStream
  stream_names:
    - transactions

definitions:
  linked:
    HttpRequester:
      authenticator:
        type: SessionTokenAuthenticator
        login_requester:
          type: HttpRequester
          url: "{{ config.get('api_url', 'https://api.ramp.com').rstrip('/') }}/developer/v1/token"
          http_method: POST
          authenticator:
            type: BasicHttpAuthenticator
            username: "{{ config['client_id'] }}"
            password: "{{ config['client_secret'] }}"
          request_body:
            type: RequestBodyUrlEncodedForm
            value:
              grant_type: client_credentials
              # One token for every stream's scope. Ramp grants the subset the app has and silently drops the
              # rest, so a missing scope only fails its own stream (403 DEVELOPER_7100), never the login.
              scope: >-
                transactions:read cards:read reimbursements:read users:read departments:read locations:read
                entities:read business:read funds:read spend_programs:read bills:read vendors:read
                receipts:read merchants:read purchase_orders:read
          error_handler:
            type: DefaultErrorHandler
            max_retries: 5
            response_filters:
              - type: HttpResponseFilter
                http_codes:
                  - 400
                  - 401
                action: FAIL
                failure_type: config_error
                # Ramp does not fail the token call for a scope the app lacks: it drops the scope and the
                # data call later returns 403 DEVELOPER_7100, handled by the shared error handler.
                error_message: >-
                  Ramp rejected the client ID or client secret ({{ (response.get('error_v2') or {}).get('message')
                  or response.get('error_description') or response.get('error') or 'no details' }}).
                  Copy both again from Ramp > Company > Developer > your app, and check the app uses the
                  Client Credentials grant.
        session_token_path:
          - access_token
        expiration_duration: PT240H
        request_authentication:
          type: Bearer
      error_handler:
        type: DefaultErrorHandler
        max_retries: 5
        backoff_strategies:
          - type: ExponentialBackoffStrategy
            factor: 2
        # A filter matches when the status code is in `http_codes` OR the predicate is true, so the
        # Ramp-specific filters below match on `error_v2.error_code` alone.
        response_filters:
          - type: HttpResponseFilter
            predicate: "{{ (response.get('error_v2') or {}).get('error_code') == 'DEVELOPER_7100' }}"
            action: FAIL
            failure_type: config_error
            error_message: >-
              Your Ramp app is not allowed to read this data ({{ (response.get('error_v2') or {}).get('message') }}).
              In Ramp, open Company > Developer > your app, grant the missing read scope, then re-test the
              source.{{ parameters.get('access_note', '') }}
          - type: HttpResponseFilter
            predicate: "{{ (response.get('error_v2') or {}).get('error_code') == 'DEVELOPER_7002' }}"
            action: FAIL
            failure_type: config_error
            error_message: >-
              Ramp no longer accepts this connector's access token. Check that the Ramp app still exists and
              its client secret has not been rotated, then re-test the source.
          - type: HttpResponseFilter
            http_codes:
              - 401
            action: FAIL
            failure_type: config_error
            error_message: >-
              Ramp rejected the connector's credentials. Re-enter the client ID and client secret from
              Ramp > Company > Developer > your app.
          - type: HttpResponseFilter
            http_codes:
              - 403
            action: FAIL
            failure_type: config_error
            error_message: >-
              Ramp denied access to this data. In Ramp, open Company > Developer > your app and check it has the
              {{ parameters.get('required_scope', 'required read') }} scope, then re-test the
              source.{{ parameters.get('access_note', '') }}
      request_headers:
        Content-Type: application/json
    Paginator:
      type: DefaultPaginator
      page_size_option:
        type: RequestOption
        field_name: page_size
        inject_into: request_parameter
      page_token_option:
        type: RequestOption
        field_name: start
        inject_into: request_parameter
      pagination_strategy:
        type: CursorPagination
        cursor_value: "{{ last_record['id'] }}"
        stop_condition: "{{ not (response.get('page') or {}).get('next') }}"
        page_size: 50
    # `Paginator` for list endpoints that take their filters and page token in a JSON body.
    BodyPaginator:
      type: DefaultPaginator
      page_size_option:
        type: RequestOption
        field_name: page_size
        inject_into: body_json
      page_token_option:
        type: RequestOption
        field_name: start
        inject_into: body_json
      pagination_strategy:
        type: CursorPagination
        cursor_value: "{{ last_record['id'] }}"
        stop_condition: "{{ not (response.get('page') or {}).get('next') }}"
        page_size: 50
    # Requester and retriever shared by the streams added after 0.1.0; each stream sets only its `url`.
    Requester:
      type: HttpRequester
      http_method: GET
      authenticator:
        $ref: "#/definitions/linked/HttpRequester/authenticator"
      error_handler:
        $ref: "#/definitions/linked/HttpRequester/error_handler"
      request_headers:
        $ref: "#/definitions/linked/HttpRequester/request_headers"
    Retriever:
      type: SimpleRetriever
      paginator:
        $ref: "#/definitions/linked/Paginator"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
  streams:
    vendors:
      type: DeclarativeStream
      name: vendors
      $parameters:
        required_scope: vendors:read
      primary_key:
        - id
      retriever:
        $ref: "#/definitions/linked/Retriever"
        requester:
          $ref: "#/definitions/linked/Requester"
          url: "{{ config.get('api_url', 'https://api.ramp.com').rstrip('/') }}/developer/v1/vendors"
          request_parameters:
            include_subsidiary: "true"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          type: object
          $schema: http://json-schema.org/draft-07/schema#
          additionalProperties: true
          required:
            - id
          properties:
            accounting_vendor_remote_id:
              type:
                - string
                - "null"
              description: The accounting remote id of the vendor.
            address:
              type:
                - object
                - "null"
              description: The default address of the vendor.
            addresses:
              type:
                - array
                - "null"
              items:
                type: object
              description: The addresses of the vendor.
            billing_frequency:
              type:
                - string
                - "null"
              description: The billing frequency for this vendor.
            contacts:
              type:
                - array
                - "null"
              items:
                type: string
              description: Unique identifiers of contacts associated with this vendor.
            country:
              type:
                - string
                - "null"
              description: The 2-letter country of the vendor.
            created_at:
              type:
                - string
                - "null"
              format: date-time
              description: The date and time when this vendor was created.
            default_entity_id:
              type:
                - string
                - "null"
              description: Unique identifier of the default business entity associated with this vendor.
            default_payment_method:
              type:
                - object
                - "null"
              description: Default payment method for this vendor, including update source and policy.
            description:
              type:
                - string
                - "null"
              description: Description of the vendor.
            external_vendor_id:
              type:
                - string
                - "null"
              description: Customer-defined external identifier for the vendor.
            federal_tax_classification:
              type:
                - string
                - "null"
              description: The federal tax classification of the vendor.
            id:
              type: string
              description: Unique identifier of the vendor.
            is_active:
              type:
                - boolean
                - "null"
              description: Whether this vendor is active.
            is_deletable:
              type:
                - boolean
                - "null"
              description: Whether this vendor is deletable.
            merchant_id:
              type:
                - string
                - "null"
              description: The id of the card merchant.
            name:
              type:
                - string
                - "null"
              description: Name of the vendor.
            name_legal:
              type:
                - string
                - "null"
              description: Legal name of the vendor.
            net_payment_terms:
              type:
                - integer
                - "null"
              description: Number of days after receipt that payment is due. 0 means due on receipt.
            parent_vendor_id:
              type:
                - string
                - "null"
              description: Unique identifier of the parent vendor, if this vendor has one.
            sk_category_id:
              type:
                - integer
                - "null"
              description: Ramp category code of the vendor.
            sk_category_name:
              type:
                - string
                - "null"
              description: The category name of the vendor.
            state:
              type:
                - string
                - "null"
            status:
              type:
                - string
                - "null"
              description: Status of the vendor, such as ACTIVE; returned by Ramp but not in its OpenAPI spec.
            subsidiary:
              type:
                - array
                - "null"
              items:
                type: string
              description: ERP subsidiary identifiers associated with this vendor.
            tax_address:
              type:
                - object
                - "null"
              description: The tax address of the vendor.
            total_spend_all_time:
              type:
                - object
                - "null"
              description: Total spend for all time for this vendor.
            total_spend_last_30_days:
              type:
                - object
                - "null"
              description: Total spend for the last 30 days for this vendor.
            total_spend_last_365_days:
              type:
                - object
                - "null"
              description: Total spend for the last 365 days for this vendor.
            total_spend_ytd:
              type:
                - object
                - "null"
              description: Total spend year-to-date for this vendor.
            vendor_owner_id:
              type:
                - string
                - "null"
              description: Unique identifier of the user which owns this vendor.
            vendor_type:
              type:
                - string
                - "null"
              description: The type of vendor if bill pay.

streams:
  - type: DeclarativeStream
    name: cards
    $parameters:
      required_scope: cards:read
    retriever:
      type: SimpleRetriever
      paginator:
        $ref: "#/definitions/linked/Paginator"
      requester:
        type: HttpRequester
        url: "{{ config.get('api_url', 'https://api.ramp.com').rstrip('/') }}/developer/v1/cards"
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
    primary_key:
      - id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: true
        required:
          - id
        properties:
          id:
            type: string
            description: Ramp card UUID
          display_name:
            type:
              - string
              - "null"
            description: Card display name.
          state:
            type:
              - string
              - "null"
            description: e.g. ACTIVE
          is_physical:
            type:
              - boolean
              - "null"
          cardholder_id:
            type:
              - string
              - "null"
          cardholder_name:
            type:
              - string
              - "null"
          card_program_id:
            type:
              - string
              - "null"
          last_four:
            type:
              - string
              - "null"
            description: Last four digits of the card number.
          entity_id:
            type:
              - string
              - "null"
          created_at:
            type:
              - string
              - "null"
          expiration:
            type:
              - string
              - "null"
            description: MMYY format (e.g. "0430")
          has_program_overridden:
            type:
              - boolean
              - "null"
          fulfillment:
            type:
              - object
              - "null"
            description: Nested object - fulfillment_status, shipping_date, etc.
          spending_restrictions:
            type:
              - object
              - "null"
            description: Nested object - interval, auto_lock_date, etc.
    transformations:
      - type: KeysToSnakeCase
  - type: DeclarativeStream
    name: transactions
    $parameters:
      required_scope: transactions:read
    retriever:
      type: SimpleRetriever
      paginator:
        $ref: "#/definitions/linked/Paginator"
      requester:
        type: HttpRequester
        url: "{{ config.get('api_url', 'https://api.ramp.com').rstrip('/') }}/developer/v1/transactions"
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
        # Ramp omits declined transactions unless `state=ALL` is sent, and returns `merchant_data` as null
        # unless `include_merchant_data=true` is sent.
        request_parameters:
          state: ALL
          include_merchant_data: "true"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
    primary_key:
      - id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: true
        required:
          - id
        properties:
          id:
            type: string
            description: Ramp transaction UUID
          amount:
            type:
              - number
              - "null"
          currency_code:
            type:
              - string
              - "null"
            description: e.g. USD
          card_id:
            type:
              - string
              - "null"
            description: Join key to cards stream
          card_holder:
            type:
              - object
              - "null"
            description: Nested - first_name, employee_id, location_name, etc.
          state:
            type:
              - string
              - "null"
            description: e.g. PENDING
          sync_status:
            type:
              - string
              - "null"
            description: e.g. NOT_SYNC_READY
          synced_at:
            type:
              - string
              - "null"
            description: ERP sync time. Null if not yet synced.
          updated_at:
            type:
              - string
              - "null"
            description: >-
              When the transaction was last updated. Used as the incremental
              cursor.
          user_transaction_time:
            type:
              - string
              - "null"
            description: When the transaction occurred.
          accounting_date:
            type:
              - string
              - "null"
          merchant_id:
            type:
              - string
              - "null"
          merchant_name:
            type:
              - string
              - "null"
          merchant_descriptor:
            type:
              - string
              - "null"
          merchant_category_code:
            type:
              - string
              - "null"
          merchant_category_code_description:
            type:
              - string
              - "null"
          merchant_location:
            type:
              - object
              - "null"
          sk_category_id:
            type:
              - integer
              - "null"
          sk_category_name:
            type:
              - string
              - "null"
          spend_program_id:
            type:
              - string
              - "null"
          limit_id:
            type:
              - string
              - "null"
          entity_id:
            type:
              - string
              - "null"
          original_transaction_amount:
            type:
              - object
              - "null"
            description: Nested - amount, minor_unit_conversion_rate, currency
          line_items:
            type:
              - array
              - "null"
          accounting_categories:
            type:
              - array
              - "null"
          accounting_field_selections:
            type:
              - array
              - "null"
          policy_violations:
            type:
              - array
              - "null"
          receipts:
            type:
              - array
              - "null"
          disputes:
            type:
              - array
              - "null"
          memo:
            type:
              - string
              - "null"
          trip_id:
            type:
              - string
              - "null"
          trip_name:
            type:
              - string
              - "null"
          card_present:
            type:
              - boolean
              - "null"
          network_merchant_id:
            type:
              - string
              - "null"
          settlement_date:
            type:
              - string
              - "null"
          minor_unit_conversion_rate:
            type:
              - integer
              - "null"
          all_requirements_met_and_approved:
            type:
              - boolean
              - "null"
          decline_details:
            type:
              - object
              - "null"
            description: Why the transaction was declined. Null unless state is DECLINED.
          entity_amount:
            type:
              - object
              - "null"
          fund_id:
            type:
              - string
              - "null"
          merchant_amount:
            type:
              - object
              - "null"
          original_transaction_id:
            type:
              - string
              - "null"
          statement_id:
            type:
              - string
              - "null"
          merchant_data:
            type:
              - object
              - "null"
            description: >-
              Purchase data provided by the merchant - auto_rental, flight, lodging, receipt (itemised
              lines) and reference. Null when the merchant sends none.
          attendees:
            type:
              - array
              - "null"
            items:
              type: object
            description: Attendees of the transaction - name, and user_id when the attendee is a Ramp user.
          requires_accounting_vendor_creation_to_sync:
            type:
              - boolean
              - "null"
            description: >-
              Whether an accounting vendor must be created and coded to the transaction before it can sync.
              Ramp omits it unless vendor creation on sync is enabled.
    transformations:
      - type: KeysToSnakeCase
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%S%z"
        - "%Y-%m-%dT%H:%M:%S.%f%z"
        - "%Y-%m-%dT%H:%M:%SZ"
        - "%Y-%m-%dT%H:%M:%S.%fZ"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ format_datetime(config.get('start_date', '2019-01-01T00:00:00Z'), '%Y-%m-%dT%H:%M:%SZ') }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      # `updated_after` is not in Ramp's published parameter list for /transactions; the sandbox honours it
      # inclusively (probed 2026-09-24, see airbytehq/airbyte-internal-issues#17540). If Ramp ever ignores it,
      # the stream re-reads everything and emits duplicates rather than losing records.
      start_time_option:
        type: RequestOption
        field_name: updated_after
        inject_into: request_parameter
  - type: DeclarativeStream
    name: reimbursements
    $parameters:
      required_scope: reimbursements:read
    retriever:
      type: SimpleRetriever
      paginator:
        $ref: "#/definitions/linked/Paginator"
      requester:
        type: HttpRequester
        url: "{{ config.get('api_url', 'https://api.ramp.com').rstrip('/') }}/developer/v1/reimbursements"
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
      partition_router:
        type: ListPartitionRouter
        cursor_field: direction
        values:
          - BUSINESS_TO_USER
          - USER_TO_BUSINESS
        request_option:
          type: RequestOption
          field_name: direction
          inject_into: request_parameter
    primary_key:
      - id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/draft-07/schema#
        additionalProperties: true
        required:
          - id
        properties:
          type:
            type:
              - string
              - "null"
            description: e.g. OUT_OF_POCKET
          id:
            type: string
            description: Ramp reimbursement UUID
          amount:
            type:
              - number
              - "null"
          currency:
            type:
              - string
              - "null"
          direction:
            type:
              - string
              - "null"
            description: >-
              BUSINESS_TO_USER (out-of-pocket reimbursement) or USER_TO_BUSINESS
              (repayment)
          state:
            type:
              - string
              - "null"
            description: e.g. PENDING
          sync_status:
            type:
              - string
              - "null"
          synced_at:
            type:
              - string
              - "null"
          submitted_at:
            type:
              - string
              - "null"
          approved_at:
            type:
              - string
              - "null"
          created_at:
            type:
              - string
              - "null"
          updated_at:
            type:
              - string
              - "null"
            description: >-
              When the reimbursement was last updated. Used as the incremental
              cursor.
          accounting_date:
            type:
              - string
              - "null"
          transaction_date:
            type:
              - string
              - "null"
          memo:
            type:
              - string
              - "null"
            description: Free-text memo on the reimbursement.
          merchant:
            type:
              - string
              - "null"
          merchant_id:
            type:
              - string
              - "null"
          user_id:
            type:
              - string
              - "null"
          user_email:
            type:
              - string
              - "null"
          user_full_name:
            type:
              - string
              - "null"
          entity_id:
            type:
              - string
              - "null"
          trip_id:
            type:
              - string
              - "null"
          spend_limit_id:
            type:
              - string
              - "null"
          accounting_field_selections:
            type:
              - array
              - "null"
          line_items:
            type:
              - array
              - "null"
          attendees:
            type:
              - array
              - "null"
          receipts:
            type:
              - array
              - "null"
          original_reimbursement_amount:
            type:
              - object
              - "null"
          payee_amount:
            type:
              - object
              - "null"
          entity_amount:
            type:
              - object
              - "null"
          fund_id:
            type:
              - string
              - "null"
          merchant_amount:
            type:
              - object
              - "null"
          payment_batch_id:
            type:
              - string
              - "null"
          payment_id:
            type:
              - string
              - "null"
          payment_processed_at:
            type:
              - string
              - "null"
            format: date-time
          repayment_transaction_id:
            type:
              - string
              - "null"
          funding_source:
            type:
              - string
              - "null"
            description: >-
              NOT_RAMP_FUNDED, PAID_OUTSIDE_RAMP, PENDING (not known before payment) or RAMP_FUNDED (does not
              confirm settlement). Null when Ramp cannot determine it.
          employee_id:
            type:
              - string
              - "null"
            description: Employee ID of the person who made the reimbursement.
          distance:
            type:
              - number
              - "null"
            description: Trip distance in miles, for mileage reimbursements.
          start_location:
            type:
              - string
              - "null"
            description: Starting location of the trip, for mileage reimbursements.
          end_location:
            type:
              - string
              - "null"
            description: Ending location of the trip, for mileage reimbursements.
          waypoints:
            type:
              - array
              - "null"
            items:
              type: string
            description: Intermediate stops during the trip, for mileage reimbursements.
    transformations:
      - type: KeysToSnakeCase
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%S%z"
        - "%Y-%m-%dT%H:%M:%S.%f%z"
        - "%Y-%m-%dT%H:%M:%SZ"
        - "%Y-%m-%dT%H:%M:%S.%fZ"
      start_datetime:
        type: MinMaxDatetime
