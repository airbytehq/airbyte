  - $ref: "#/definitions/streams/vendors"
  - type: DeclarativeStream
    name: vendor_contacts
    $parameters:
      required_scope: vendors:read
    primary_key:
      - vendor_id
      - id
    retriever:
      $ref: "#/definitions/linked/Retriever"
      requester:
        $ref: "#/definitions/linked/Requester"
        url: "{{ config.get('api_url', 'https://api.ramp.com').rstrip('/') }}/developer/v1/vendors/{{ stream_partition['vendor_id'] }}/contacts"
        # A vendor deleted after the parent read returns 404; skip it instead of failing the stream.
        # The 404 handler goes first: on FAIL the composite falls through and returns the shared handler's result.
        error_handler:
          type: CompositeErrorHandler
          error_handlers:
            - type: DefaultErrorHandler
              max_retries: 5
              response_filters:
                - type: HttpResponseFilter
                  http_codes:
                    - 404
                  action: IGNORE
            - $ref: "#/definitions/linked/HttpRequester/error_handler"
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: "#/definitions/streams/vendors"
            parent_key: id
            partition_field: vendor_id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
