spec:
  type: Spec
  documentation_url: https://docs.ramp.com/developer-api
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - client_id
      - client_secret
    properties:
      client_id:
        type: string
        description: >-
          Client ID of the Ramp developer app (Ramp > Company > Developer). The app needs the Client
          Credentials grant and the scopes `transactions:read`, `cards:read` and `reimbursements:read`. Every
          other stream needs its own read scope, such as `users:read` or `bills:read`, granted only if you sync it.
        title: Ramp Client ID
        airbyte_secret: true
        order: 0
      client_secret:
        type: string
        description: Your Ramp API client secret.
        title: Ramp Client Secret
        airbyte_secret: true
        order: 1
      start_date:
        type: string
        description: >-
          Only transactions and reimbursements changed on or after this date, and receipts created on or
          after it, are synced on the first sync. Use UTC, for example 2024-01-01T00:00:00Z.
        title: Start Date
        format: date-time
        default: "2019-01-01T00:00:00Z"
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$
        examples:
          - "2024-01-01T00:00:00Z"
        order: 2
      api_url:
        type: string
        description: >-
          Ramp API base URL. All production Ramp accounts use the default. Set
          to https://demo-api.ramp.com only when testing against a Ramp
          sandbox app.
        title: API Base URL
        default: https://api.ramp.com
        pattern: ^https://
        airbyte_hidden: true
        order: 3
    additionalProperties: true

# Ramp allows 200 requests per 10-second rolling window per IP; keep some headroom.
api_budget:
  type: HTTPAPIBudget
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 180
          interval: PT10S
      matchers: []

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: 1
