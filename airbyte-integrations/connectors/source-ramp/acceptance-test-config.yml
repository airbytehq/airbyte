# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-ramp:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
        # 1.2.0 moves client_id/client_secret under `credentials` and limits api_url to Ramp's two
        # hosts. The config migration rewrites saved configs into the new shape, and every live
        # Cloud config already uses https://api.ramp.com, so no saved config fails validation.
        backward_compatibility_tests_config:
          disable_for_version: "1.1.0"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
  incremental:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        future_state:
          future_state_path: "integration_tests/abnormal_state.json"
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
