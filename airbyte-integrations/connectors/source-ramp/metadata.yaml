  dockerRepository: airbyte/source-ramp
  githubIssueLabel: source-ramp
  maxSecondsBetweenMessages: 3600
  icon: icon.svg
  license: ELv2
  name: Ramp
  releaseDate: 2026-08-05
  releaseStage: alpha
  supportLevel: community
  suggestedStreams:
    streams:
      - transactions
      - cards
      - reimbursements
  documentationUrl: https://docs.airbyte.com/integrations/sources/ramp
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
