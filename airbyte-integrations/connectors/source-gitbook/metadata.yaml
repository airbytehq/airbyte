metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - "api.gitbook.com"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-gitbook
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.37.1@sha256:9ef4125a09cb4ce3a3ad12ffd326817ad6ddadb2957cced297bd731e3bc6b0e4
  connectorSubtype: api
  connectorType: source
  definitionId: d1fcdf3a-dcfd-4b2e-a32c-d8a7a2e9790c
  dockerImageTag: 0.1.2
  dockerRepository: airbyte/source-gitbook
  githubIssueLabel: source-gitbook
  icon: icon.svg
  license: ELv2
  name: GitBook
  releaseDate: 2024-10-30
  releaseStage: alpha
  releases:
    breakingChanges:
      0.1.0:
        message: "The `insights_traffic` stream has been removed because GitBook removed the `GET /v1/spaces/{spaceId}/insights/traffic` endpoint from its API (it now returns `404 API operation not found`). Users syncing `insights_traffic` must deselect it from their connection; no other streams are affected."
        upgradeDeadline: "2026-10-21"
        deadlineAction: "auto_upgrade"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - insights_traffic
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/gitbook
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: GitBook API documentation
      url: https://developer.gitbook.com/
      type: api_reference
    - title: GitBook authentication
      url: https://developer.gitbook.com/gitbook-api/authentication
      type: authentication_guide
