  base_requester:
    type: HttpRequester
    url_base: https://app.pennylane.com/api/external/v2/
    authenticator:
      type: BearerAuthenticator
      api_token: '{{ config["api_key"] }}'
    error_handler:
      type: DefaultErrorHandler
      backoff_strategies:
      - type: WaitUntilTimeFromHeader
        header: ratelimit-reset
        min_wait: 1
      response_filters:
      - type: HttpResponseFilter
        http_codes:
        - 429
        action: RATE_LIMITED
        error_message: Pennylane rate limit reached.
  child_requester:
    type: HttpRequester
    url_base: https://app.pennylane.com/api/external/v2/
    authenticator:
      type: BearerAuthenticator
      api_token: '{{ config["api_key"] }}'
    error_handler:
      type: DefaultErrorHandler
      backoff_strategies:
      - type: WaitUntilTimeFromHeader
        header: ratelimit-reset
        min_wait: 1
      response_filters:
      - type: HttpResponseFilter
        http_codes:
        - 429
        action: RATE_LIMITED
        error_message: Pennylane rate limit reached.
      - type: HttpResponseFilter
        http_codes:
        - 404
        action: IGNORE
        error_message: Invoice no longer exists, skipping its nested records.
