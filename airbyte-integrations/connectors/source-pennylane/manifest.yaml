spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
    - start_time
    - api_key
    properties:
      start_time:
        type: string
        order: 0
        title: Start time
        description: Only records last updated at or after this date are synced. Use an early date to
          sync the full history.
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        examples:
        - '2010-01-01T00:00:00Z'
      api_key:
        type: string
        order: 1
        title: API Key
        description: Pennylane Company API v2 token with read access to the synced resources.
        airbyte_secret: true
    additionalProperties: true
