version: 7.27.0
type: DeclarativeSource
description: Pennylane Company API v2.
check:
  type: CheckStream
  stream_names:
  - customer_invoices
concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: 8
  max_concurrency: 8
api_budget:
  type: HTTPAPIBudget
  ratelimit_reset_header: ratelimit-reset
  ratelimit_remaining_header: ratelimit-remaining
  status_codes_for_ratelimit_hit:
  - 429
  policies:
  - type: MovingWindowCallRatePolicy
    rates:
    - type: Rate
      limit: 25
      interval: PT5S
    matchers:
    - type: HttpRequestRegexMatcher
      url_base: https://app.pennylane.com/api/external/v2/
definitions:
  streams:
    customer_invoices:
      type: DeclarativeStream
      name: customer_invoices
      primary_key:
      - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: customer_invoices
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
            - items
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: cursor
          page_size_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: limit
          pagination_strategy:
            type: CursorPagination
            page_size: 100
            cursor_value: '{{ response.get("next_cursor") }}'
            stop_condition: '{{ not response.get("has_more") }}'
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: updated_at
        cursor_datetime_formats:
        - '%Y-%m-%dT%H:%M:%S.%fZ'
        - '%Y-%m-%dT%H:%M:%SZ'
        datetime_format: '%Y-%m-%dT%H:%M:%S.%fZ'
        end_datetime:
          type: MinMaxDatetime
          datetime: '{{ format_datetime(now_utc() - duration(''PT5M''), ''%Y-%m-%dT%H:%M:%SZ'') }}'
          datetime_format: '%Y-%m-%dT%H:%M:%SZ'
        start_datetime:
          type: MinMaxDatetime
          datetime: '{{ config["start_time"] }}'
          datetime_format: '%Y-%m-%dT%H:%M:%SZ'
        is_client_side_incremental: true
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/customer_invoices'
