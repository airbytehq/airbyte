            field_name: cursor
          page_size_option:
            type: RequestOption
            inject_into: request_parameter
            field_name: limit
          pagination_strategy:
            type: CursorPagination
            page_size: 100
            cursor_value: '{{ response.get("next_cursor") }}'
            stop_condition: '{{ not response.get("has_more") }}'
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: '#/definitions/streams/billing_subscriptions'
            parent_key: id
            partition_field: billing_subscription_id
            incremental_dependency: true
            extra_fields:
            - - updated_at
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: subscription_updated_at
        cursor_datetime_formats:
        - '%Y-%m-%dT%H:%M:%S.%fZ'
        - '%Y-%m-%dT%H:%M:%SZ'
        datetime_format: '%Y-%m-%dT%H:%M:%S.%fZ'
        end_datetime:
          type: MinMaxDatetime
          datetime: '{{ format_datetime(now_utc() - duration(''PT5M''), ''%Y-%m-%dT%H:%M:%SZ'') }}'
          datetime_format: '%Y-%m-%dT%H:%M:%SZ'
        start_datetime:
          type: MinMaxDatetime
          datetime: '{{ config["start_time"] }}'
          datetime_format: '%Y-%m-%dT%H:%M:%SZ'
        global_substream_cursor: true
      transformations:
      - type: AddFields
        fields:
        - type: AddedFieldDefinition
          path:
          - billing_subscription_id
          value: '{{ stream_partition.billing_subscription_id }}'
          value_type: integer
        - type: AddedFieldDefinition
          path:
          - subscription_updated_at
          value: '{{ stream_slice.extra_fields[''updated_at''] }}'
          value_type: string
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/billing_subscription_lines'
    trial_balance:
      type: DeclarativeStream
      name: trial_balance
      primary_key:
