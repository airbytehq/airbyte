metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - "app.pennylane.com"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-pennylane
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.47.0@sha256:b2ecb78040d4c4b42fa3537488d68a3b195f64b5fefcbc48ac0591479591a3f0
  connectorSubtype: api
  connectorType: source
  definitionId: b9e4a306-4e3b-4387-a01d-c00d03d8c28c
  dockerImageTag: 0.4.0
  dockerRepository: airbyte/source-pennylane
  githubIssueLabel: source-pennylane
  icon: icon.svg
  maxSecondsBetweenMessages: 3600
  license: ELv2
  name: Pennylane
  releaseDate: 2024-08-21
  releaseStage: alpha
  releases:
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
  suggestedStreams:
    streams:
      - customer_invoices
      - supplier_invoices
      - customers
      - suppliers
      - products
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/pennylane
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: Pennylane API reference (v2)
      url: https://pennylane.readme.io/reference
      type: api_reference
    - title: Pennylane API reference (v1)
      url: https://pennylane.readme.io/v1.0/reference
      type: api_reference
    - title: Pennylane API changelog
      url: https://pennylane.readme.io/changelog
      type: api_release_history
    - title: Pennylane API v2 vs v1
      url: https://pennylane.readme.io/docs/api-v2-vs-v1
      type: api_deprecations
    - title: Rate limiting (v1)
      url: https://pennylane.readme.io/v1.0/docs/rate-limiting-1
      type: rate_limits
    - title: Rate limiting (v2)
      url: https://pennylane.readme.io/docs/rate-limiting-1
      type: rate_limits
    - title: OAuth 2.0 walkthrough
      url: https://pennylane.readme.io/docs/oauth-20-walkthrough
      type: authentication_guide
    - title: API scopes (v1)
      url: https://pennylane.readme.io/v1.0/docs/v1-scopes
      type: permissions_scopes
