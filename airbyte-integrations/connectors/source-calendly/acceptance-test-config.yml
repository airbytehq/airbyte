# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-calendly:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        empty_streams:
          - name: groups
            bypass_reason: "No groups on this account."
          - name: teams
            bypass_reason: "No teams on this account."
          - name: organization_invitations
            bypass_reason: "No invitations on this account."
          - name: webhook_subscriptions
            bypass_reason: "No webhook subscriptions on this account."
          - name: contacts
            bypass_reason: "Contacts are plan-gated on the Free plan."
          - name: outgoing_communications
            bypass_reason: "Outgoing communications require Enterprise."
          - name: activity_log_entries
            bypass_reason: "Activity logs require Enterprise."
          - name: meeting_recaps
            bypass_reason: "Meeting recaps require a paid Notetaker plan."
          - name: routing_forms
            bypass_reason: "Routing forms require Teams."
          - name: routing_form_submissions
            bypass_reason: "Routing forms require Teams, so no submission partitions exist."
          - name: group_relationships
            bypass_reason: "No groups on the Free plan, so no relationship partitions exist."
  incremental:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/incremental_catalog.json"
        future_state:
          future_state_path: "integration_tests/abnormal_state.json"
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
