metadataSpecVersion: "1.0"
data:
  allowedHosts:
    hosts:
      - "api.calendly.com"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-calendly
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.45.0@sha256:a4947a37ef760ff501856dbeec22830826c1d214f0e530abfa9831e57f019809
  connectorSubtype: api
  connectorType: source
  definitionId: b8f2cbee-b073-4dd8-9b80-97d7bae967a4
  dockerImageTag: 1.0.0
  dockerRepository: airbyte/source-calendly
  githubIssueLabel: source-calendly
  icon: icon.svg
  license: ELv2
  name: Calendly
  releaseDate: 2025-01-27
  releaseStage: alpha
  supportLevel: community
  maxSecondsBetweenMessages: 3600
  suggestedStreams:
    streams:
      - scheduled_events
      - event_invitees
      - event_types
      - organization_memberships
      - api_user
  connectorTestSuitesOptions:
    - suite: acceptanceTests
  documentationUrl: https://docs.airbyte.com/integrations/sources/calendly
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: Calendly OpenAPI specification
      url: https://developer.calendly.com/openapi/calendly-api.yaml
      type: openapi_spec
    - title: Calendly API reference
      url: https://developer.calendly.com/api-docs/overview/api/reference
      type: api_reference
    - title: Calendly authentication
      url: https://developer.calendly.com/docs/authentication/overview
      type: authentication_guide
    - title: Calendly personal access tokens
      url: https://developer.calendly.com/docs/authentication/how-to-authenticate-with-personal-access-tokens
      type: authentication_guide
    - title: Calendly authorization scopes
      url: https://developer.calendly.com/docs/authentication/scopes
      type: permissions_scopes
    - title: Calendly API release notes
      url: https://developer.calendly.com/release-notes
      type: api_release_history
    - title: Calendly API rate limits
      url: https://developer.calendly.com/api-docs/overview/rate-limits
      type: rate_limits
    - title: Calendly Status
      url: https://status.calendly.com/
      type: status_page
  releases:
    breakingChanges:
      1.0.0:
        message: >-
          Version 1.0.0 fixes incremental syncs of scheduled_events and event_invitees, which stopped reading new bookings and cancellations after an upcoming event was synced, and corrects declared types in api_user, event_types, groups, organization_memberships, scheduled_events and event_invitees: datetime fields become timestamps, and position fields and event_types.duration_options items become integers. The first sync after the upgrade reads every scheduled event from your start date with its invitees again, so the cursor change needs no clear. Refresh the source schema. On S3 Data Lake and GCS Data Lake, clear these streams if they sync in an append or incremental mode, or every sync fails. On ClickHouse, clear the streams synced in Full refresh | Append or Incremental | Append, and event_types in Incremental | Append + Deduped, before the first 1.0.0 sync, or existing timestamps become empty. On Postgres and Redshift, drop views on the retyped columns first. Clearing deletes rows that Calendly no longer returns. See https://docs.airbyte.com/integrations/sources/calendly-migrations#upgrading-to-100.
        upgradeDeadline: "2026-12-01"
        deadlineAction: disable
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - scheduled_events
              - event_invitees
              - api_user
              - event_types
              - groups
              - organization_memberships
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
