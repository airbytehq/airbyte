  base_requester:
    type: HttpRequester
    url_base: https://api.calendly.com
    authenticator:
      type: BearerAuthenticator
      api_token: "{{ config[\"api_key\"] }}"
    error_handler:
      $ref: "#/definitions/base_error_handler"
  base_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: X-RateLimit-Reset
    response_filters:
      - $ref: "#/definitions/error_filters/unauthorized"
      - $ref: "#/definitions/error_filters/forbidden"
      - $ref: "#/definitions/error_filters/not_found"
      - $ref: "#/definitions/error_filters/server_error"
  invitees_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: X-RateLimit-Reset
    response_filters:
      - $ref: "#/definitions/error_filters/unauthorized"
      - $ref: "#/definitions/error_filters/forbidden"
      - type: HttpResponseFilter
        http_codes: [404]
        action: IGNORE
        error_message: "Skipping invitees of a scheduled event that Calendly no longer returns (404): {{ request_url }}"
      - $ref: "#/definitions/error_filters/server_error"
  # 429 keeps the CDK default (RATE_LIMITED) and waits for X-RateLimit-Reset through backoff_strategies.
  error_filters:
    unauthorized:
      type: HttpResponseFilter
      http_codes: [401]
      action: FAIL
      failure_type: config_error
      error_message: >-
        Calendly rejected the personal access token because it is invalid or revoked.
        Create a new token in Calendly (open the Profile menu, select Developer, then Personal access tokens)
        and update it in the Airbyte source settings.
        Calendly response (401): {{ (response if response is mapping else {}).get('message', 'Unauthorized') }}
    forbidden:
      type: HttpResponseFilter
      http_codes: [403]
      action: FAIL
      failure_type: config_error
      error_message: >-
        Calendly denied access. The personal access token needs the read scope of every selected stream, as listed in the Calendly source documentation, and it must belong to an owner or admin of the Calendly organization because Calendly shows organization-wide scheduled events only to them.
        Create a new token and update it in the Airbyte source settings.
        Calendly response (403): {{ (response if response is mapping else {}).get('message', 'Forbidden') }}{{ ' Missing scopes: ' ~ (response['required_scopes'] | join(', ')) if response is mapping and response.get('required_scopes') else '' }}
    not_found:
      type: HttpResponseFilter
      http_codes: [404]
      action: FAIL
      failure_type: system_error
      error_message: >-
        Calendly returned 404 for {{ request_url }}: {{ (response if response is mapping else {}).get('message', 'Not found') }}
    server_error:
      type: HttpResponseFilter
      http_codes: [500, 502, 503, 504]
      action: RETRY
      error_message: Calendly API is temporarily unavailable.

