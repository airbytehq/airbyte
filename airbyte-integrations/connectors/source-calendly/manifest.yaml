api_budget:
  type: HTTPAPIBudget
  ratelimit_remaining_header: X-RateLimit-Remaining
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 500
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          url_base: https://api.calendly.com

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: 4

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - credentials
      - start_date
    properties:
      credentials:
        title: Authentication
        description: >-
          Sign in to Calendly with OAuth, or use a personal access token. Authenticate as an owner or admin of the
          Calendly organization: Calendly shows organization-wide data, such as scheduled events and webhook
          subscriptions, only to them.
        type: object
        order: 0
        oneOf:
          - title: OAuth
            type: object
            required:
              - auth_type
              - client_id
              - client_secret
              - refresh_token
            properties:
              auth_type:
                type: string
                const: oauth2.0
                order: 0
              client_id:
                type: string
                title: Client ID
                description: Client ID of the Calendly OAuth application.
                airbyte_secret: true
                order: 1
              client_secret:
                type: string
                title: Client secret
                description: Client secret of the Calendly OAuth application.
                airbyte_secret: true
                order: 2
              refresh_token:
                type: string
                title: Refresh token
                description: OAuth refresh token. Calendly issues a new one on every token refresh.
                airbyte_secret: true
                order: 3
              access_token:
                type: string
                title: Access token
                description: OAuth access token, refreshed automatically before it expires.
                airbyte_secret: true
                airbyte_hidden: true
                order: 4
              token_expiry_date:
                type: string
                title: Access token expiry date
                description: Expiry of the OAuth access token, set automatically.
                format: date-time
                airbyte_hidden: true
                order: 5
          - title: Personal access token
            type: object
            required:
              - auth_type
              - api_key
            properties:
              auth_type:
                type: string
                const: api_key
                order: 0
              api_key:
                type: string
                description: >-
                  Calendly personal access token. In Calendly, open the Profile menu, select Developer, then Personal access tokens, and create a token with the read scope of every stream you sync; the Calendly source documentation lists the scopes for each stream. Create it as an owner or admin of the Calendly organization: Calendly shows organization-wide data, such as scheduled events and webhook subscriptions, only to them.
                order: 1
                title: Calendly personal access token
                airbyte_secret: true
      start_date:
        type: string
        order: 1
        title: Start date (UTC)
        description: >-
          Sync scheduled events starting on or after this time, and outgoing communications, activity log entries
          and meeting recaps from this time on, in UTC ISO-8601 format.
        examples: ["2024-01-01T00:00:00Z"]
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      lookback_days:
        type: number
        description: >-
          Incremental syncs of scheduled_events resume from the start time of the latest event
          already synced minus this many days, so events in that range are read again with their
          latest status, such as a cancellation. Set it to at least how far in advance invitees can
          book so that new bookings for earlier times are not missed.
        title: Lookback window (days)
        default: 0
        order: 2
    additionalProperties: true
  advanced_auth:
    auth_flow_type: oauth2.0
    predicate_key: ["credentials", "auth_type"]
    predicate_value: oauth2.0
    oauth_config_specification:
      oauth_connector_input_specification:
        consent_url: https://auth.calendly.com/oauth/authorize?{{client_id_param}}&response_type=code&{{redirect_uri_param}}&{{state_param}}&code_challenge_method=S256&code_challenge={{ state_value | codechallengeS256 }}
        state:
          min: 43
          max: 128
        access_token_url: https://auth.calendly.com/oauth/token
        access_token_headers:
          Authorization: "Basic {{ (client_id_value ~ ':' ~ client_secret_value) | b64encode }}"
          Content-Type: application/x-www-form-urlencoded
        access_token_params:
          grant_type: authorization_code
          code: "{{ auth_code_value }}"
          client_id: "{{ client_id_value }}"
          redirect_uri: "{{ redirect_uri_value }}"
          code_verifier: "{{ state_value }}"
        extract_output:
          - access_token
          - refresh_token
          - expires_in
      complete_oauth_output_specification:
        type: object
        additionalProperties: false
        properties:
          access_token:
            type: string
            path_in_connector_config: ["credentials", "access_token"]
          refresh_token:
            type: string
            path_in_connector_config: ["credentials", "refresh_token"]
          token_expiry_date:
            type: string
            path_in_connector_config: ["credentials", "token_expiry_date"]
      complete_oauth_server_input_specification:
        type: object
        additionalProperties: true
        properties:
          client_id:
            type: string
          client_secret:
            type: string
      complete_oauth_server_output_specification:
        type: object
        additionalProperties: true
        properties:
          client_id:
            type: string
            path_in_connector_config: ["credentials", "client_id"]
          client_secret:
            type: string
            path_in_connector_config: ["credentials", "client_secret"]
  config_normalization_rules:
    type: ConfigNormalizationRules
    config_migrations:
      - type: ConfigMigration
        description: Move the top-level personal access token into credentials.
        transformations:
          - type: ConfigAddFields
            condition: "{{ config.get('api_key') is string and (config.get('credentials') or {}).get('auth_type') is not string }}"
            fields:
              - type: AddedFieldDefinition
                path: ["credentials", "api_key"]
                value: "{{ config['api_key'] }}"
                value_type: string
              - type: AddedFieldDefinition
                path: ["credentials", "auth_type"]
                value: api_key
                value_type: string
          - type: ConfigRemoveFields
            condition: "{{ (config.get('credentials') or {}).get('auth_type') is string }}"
            field_pointers:
              - ["api_key"]

