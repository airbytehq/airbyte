api_budget:
  type: HTTPAPIBudget
  ratelimit_remaining_header: X-RateLimit-Remaining
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 500
          interval: PT1M
      matchers:
        - type: HttpRequestRegexMatcher
          url_base: https://api.calendly.com

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: 4

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
      - start_date
    properties:
      api_key:
        type: string
        description: >-
          Calendly personal access token. In Calendly, open the Profile menu, select Developer, then Personal access tokens, and create a token with the read scope of every stream you sync; the Calendly source documentation lists the scopes for each stream. Create it as an owner or admin of the Calendly organization: Calendly shows organization-wide scheduled events only to them.
        order: 0
        title: Calendly personal access token
        airbyte_secret: true
      start_date:
        type: string
        order: 1
        title: Start date (UTC)
        description: >-
          Sync scheduled events starting on or after this time, in UTC ISO-8601 format.
        examples: ["2024-01-01T00:00:00Z"]
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      lookback_days:
        type: number
        description: >-
          Incremental syncs of scheduled_events resume from the start time of the latest event
          already synced minus this many days, so events in that range are read again with their
          latest status, such as a cancellation. Set it to at least how far in advance invitees can
          book so that new bookings for earlier times are not missed.
        title: Lookback window (days)
        default: 0
        order: 2
    additionalProperties: true

metadata:
  autoImportSchema:
    event_types: true
    api_user: true
    groups: true
    organization_memberships: true
    scheduled_events: true
    event_invitees: true
    teams: false
    event_type_memberships: false
    group_relationships: false
    user_availability_schedules: false
    locations: false
    organization_invitations: false
    webhook_subscriptions: false
  testedStreams:
    event_types:
      hasRecords: true
      streamHash: 6c819421adad712f45f956571c5aa4546e48c793
      hasResponse: true
      primaryKeysAreUnique: true
      primaryKeysArePresent: true
      responsesAreSuccessful: true
    api_user:
      hasRecords: true
      streamHash: e30bfb0bf840b3b649ea7a68f6c3e81df9172412
      hasResponse: true
      primaryKeysAreUnique: true
      primaryKeysArePresent: true
