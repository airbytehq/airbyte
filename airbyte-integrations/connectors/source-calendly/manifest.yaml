            count: "100"
        record_selector:
          $ref: "#/definitions/collection_selector"
        paginator:
          $ref: "#/definitions/page_token_paginator"
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: start_time
        is_client_side_incremental: true
        lookback_window: P3D
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%S.%fZ"
          - "%Y-%m-%dT%H:%M:%SZ"
          - "%Y-%m-%dT%H:%M:%S%z"
        datetime_format: "%Y-%m-%dT%H:%M:%S.%fZ"
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ config['start_date'] }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        end_datetime:
          type: MinMaxDatetime
          datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%S.%fZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%S.%fZ"
        start_time_option:
          type: RequestOption
          field_name: start_time
          inject_into: request_parameter
        end_time_option:
          type: RequestOption
          field_name: end_time
          inject_into: request_parameter
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/meeting_recaps"
  base_requester:
    type: HttpRequester
    url_base: https://api.calendly.com
    authenticator:
      $ref: "#/definitions/authenticator"
    error_handler:
      $ref: "#/definitions/base_error_handler"
  authenticator:
    type: SelectiveAuthenticator
    authenticator_selection_path: ["credentials", "auth_type"]
    authenticators:
      oauth2.0: "#/definitions/oauth_authenticator"
      api_key: "#/definitions/personal_access_token_authenticator"
  personal_access_token_authenticator:
    type: BearerAuthenticator
    api_token: "{{ config['credentials']['api_key'] }}"
  oauth_authenticator:
    type: OAuthAuthenticator
    token_refresh_endpoint: https://auth.calendly.com/oauth/token
    grant_type: refresh_token
    client_id: "{{ config['credentials']['client_id'] }}"
    client_secret: "{{ config['credentials']['client_secret'] }}"
    refresh_token: "{{ config['credentials']['refresh_token'] }}"
    access_token_value: "{{ config['credentials'].get('access_token', '') }}"
    refresh_request_headers:
      Authorization: "Basic {{ (config['credentials']['client_id'] ~ ':' ~ config['credentials']['client_secret']) | base64encode }}"
    refresh_request_body:
      client_id: "{{ config['credentials']['client_id'] }}"
    refresh_token_error_status_codes: [400, 401]
    refresh_token_error_key: error
    refresh_token_error_values: [invalid_grant, invalid_client]
    refresh_token_error_messages:
      invalid_grant: >-
        Calendly rejected the OAuth refresh token because it is expired, revoked or was already used.
        Re-authenticate with Calendly in the Airbyte source settings.
      invalid_client: >-
        Calendly rejected the OAuth client ID or client secret.
        Re-authenticate with Calendly in the Airbyte source settings.
    refresh_token_updater:
      refresh_token_name: refresh_token
      access_token_config_path: ["credentials", "access_token"]
      refresh_token_config_path: ["credentials", "refresh_token"]
      token_expiry_date_config_path: ["credentials", "token_expiry_date"]
  base_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: X-RateLimit-Reset
    response_filters:
      - $ref: "#/definitions/error_filters/unauthorized"
      - $ref: "#/definitions/error_filters/forbidden"
      - $ref: "#/definitions/error_filters/not_found"
      - $ref: "#/definitions/error_filters/server_error"
  invitees_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: X-RateLimit-Reset
    response_filters:
      - $ref: "#/definitions/error_filters/unauthorized"
      - $ref: "#/definitions/error_filters/forbidden"
      - type: HttpResponseFilter
        http_codes: [404]
        action: IGNORE
        error_message: "Skipping invitees of a scheduled event that Calendly no longer returns (404): {{ request_url }}"
      - $ref: "#/definitions/error_filters/server_error"
  # Requests per member or event type: one that left or was deleted mid-sync is skipped, not fatal.
  fan_out_error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: X-RateLimit-Reset
    response_filters:
      - $ref: "#/definitions/error_filters/unauthorized"
      # No http_codes here: CDK 7.45 ORs them with error_message_contains, which would ignore every 403.
      - type: HttpResponseFilter
        error_message_contains: not in your organization
        action: IGNORE
        error_message: "Skipping a member who left the Calendly organization during the sync: {{ request_url }}"
      - $ref: "#/definitions/error_filters/forbidden"
      - type: HttpResponseFilter
        http_codes: [404]
        action: IGNORE
        error_message: "Skipping a member or event type that Calendly no longer returns (404): {{ request_url }}"
      - $ref: "#/definitions/error_filters/server_error"
  collection_selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path: [collection]
  page_token_paginator:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      field_name: page_token
      inject_into: request_parameter
    pagination_strategy:
      type: CursorPagination
      cursor_value: "{{ response.get('pagination', {}).get('next_page_token') }}"
      stop_condition: "{{ not response.get('pagination', {}).get('next_page_token') }}"
  organization_router:
    type: SubstreamPartitionRouter
    parent_stream_configs:
      - type: ParentStreamConfig
        parent_key: current_organization
        partition_field: organization_uri
        request_option:
          type: RequestOption
          field_name: organization
          inject_into: request_parameter
        stream:
          $ref: "#/definitions/streams/api_user"
  submissions_error_handler:
    $ref: "#/definitions/base_error_handler"
    response_filters:
      - $ref: "#/definitions/error_filters/unauthorized"
      - $ref: "#/definitions/error_filters/forbidden"
      - type: HttpResponseFilter
        http_codes: [404]
        action: IGNORE
        error_message: "Skipping submissions of a routing form that Calendly no longer returns (404)."
      - $ref: "#/definitions/error_filters/server_error"
  plan_gated_error_handler:
    $ref: "#/definitions/base_error_handler"
    response_filters:
      - type: HttpResponseFilter
        predicate: >-
          {{ response is mapping and 'required_scopes' not in response and (response.get('message') or '').rstrip('.') in [
            'Please upgrade your Calendly account to Enterprise',
            'Please upgrade to a paid Calendly account',
            'Meeting recap access is not available. Required features are not enabled for your account',
            'Contact creation is not available. Required features are not enabled for your account'
          ] }}
        action: IGNORE
        error_message: >-
          Calendly skipped this stream: outgoing communications and activity logs require Enterprise;
          contacts require a paid plan; meeting recaps require a paid plan with Notetaker enabled.
          Upgrade the Calendly plan or deselect the stream.
          Calendly response: {{ response.get('message') }}
      - $ref: "#/definitions/error_filters/unauthorized"
      - $ref: "#/definitions/error_filters/forbidden"
      - $ref: "#/definitions/error_filters/not_found"
      - $ref: "#/definitions/error_filters/server_error"
  # 429 keeps the CDK default (RATE_LIMITED) and waits for X-RateLimit-Reset through backoff_strategies.
  error_filters:
    unauthorized:
      type: HttpResponseFilter
      http_codes: [401]
      action: REFRESH_TOKEN_THEN_RETRY
      failure_type: config_error
      error_message: >-
        Calendly rejected the access token because it is invalid, expired or revoked.
        If the source uses OAuth, re-authenticate with Calendly in the Airbyte source settings.
        If it uses a personal access token, create a new token in Calendly (open the Profile menu, select Developer,
        then Personal access tokens) and update it in the Airbyte source settings.
        Calendly response (401): {{ (response if response is mapping else {}).get('message', 'Unauthorized') }}
    forbidden:
      type: HttpResponseFilter
      http_codes: [403]
      action: FAIL
      failure_type: config_error
      error_message: >-
        Calendly denied access. The credentials need the read scope of every selected stream
        (users:read is also required for organization-scoped streams), and they must belong to an owner or admin of the
        Calendly organization because Calendly shows organization-wide data, such as scheduled events, webhook subscriptions,
        activity logs and outgoing communications, only to them.
        Re-authenticate as an owner or admin, or create a new personal access token, and update it in the Airbyte source settings.
        Calendly response (403): {{ (response if response is mapping else {}).get('message', 'Forbidden') }}{{ ' Missing scopes: ' ~ (response['required_scopes'] | join(', ')) if response is mapping and response.get('required_scopes') else '' }}
    not_found:
      type: HttpResponseFilter
      http_codes: [404]
      action: FAIL
      failure_type: system_error
      error_message: >-
        Calendly returned 404 for {{ request_url }}: {{ (response if response is mapping else {}).get('message', 'Not found') }}
    server_error:
      type: HttpResponseFilter
      http_codes: [500, 502, 503, 504]
      action: RETRY
      error_message: Calendly API is temporarily unavailable.

