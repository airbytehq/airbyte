  connection_specification:
    type: object
    title: DC Hub Spec
    $schema: http://json-schema.org/draft-07/schema#
    required: []
    properties:
      isos:
        type: array
        description: >-
          US grid operators (ISOs/RTOs) to sync for the grid_intelligence and
          interconnection_queue streams. Leave empty for all seven.
        items:
          type: string
          enum:
            - PJM
            - ERCOT
            - CAISO
            - MISO
            - SPP
            - NYISO
            - ISONE
        order: 1
        title: Grid operators
        default:
          - PJM
          - ERCOT
          - CAISO
          - MISO
          - SPP
          - NYISO
          - ISONE
      api_key:
        type: string
        description: >-
          Optional DC Hub API key, sent as the X-API-Key header. Without one,
          most streams return a preview and grid_intelligence is skipped. Get a
          key with one POST to https://dchub.cloud/api/v1/keys/claim (no account
          needed), or see https://dchub.cloud/developers.
        order: 0
        title: API Key
        airbyte_secret: true
    additionalProperties: true

