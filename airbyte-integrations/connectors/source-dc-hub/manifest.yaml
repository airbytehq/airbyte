version: 7.28.2

type: DeclarativeSource

description: >-
  DC Hub (dchub.cloud): data center and energy intelligence. The Data Center
  Power Index (DCPI) scores 300+ markets daily on where data centers can get
  grid power. Also available as 94 MCP tools at https://dchub.cloud/mcp.

check:
  type: CheckStream
  stream_names:
    - dcpi_verdicts

definitions:
  linked:
    HttpRequester:
      request_headers:
        Accept: application/json
        X-API-Key: "{{ config.get('api_key') or None }}"
        User-Agent: airbyte-source-dchub/0.1.0
      error_handler:
        type: DefaultErrorHandler
        response_filters:
          - type: HttpResponseFilter
            action: IGNORE
            http_codes:
              - 401
              - 402
              - 403
            error_message: >-
              DC Hub answered {{ response.status_code }}: this stream needs an
              API key (one POST to https://dchub.cloud/api/v1/keys/claim).
              Skipped.

streams:
