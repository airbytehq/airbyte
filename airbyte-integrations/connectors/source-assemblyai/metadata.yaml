  releases:
    breakingChanges:
      1.0.0:
        message: AssemblyAI has deprecated LeMUR, so the lemur_response stream and its request_id setting have been removed. Connections selecting lemur_response must refresh the source schema and deselect it; transcript-only connections need no migration. No data clear is required. See the <a href='https://docs.airbyte.com/integrations/sources/assemblyai-migrations#upgrading-to-100'>migration guide</a>.
        upgradeDeadline: "2026-10-21"
        deadlineAction: disable
        scopedImpact:
          - scopeType: stream
            impactedScopes: ["lemur_response"]
