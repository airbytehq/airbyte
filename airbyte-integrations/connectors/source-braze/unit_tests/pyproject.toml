[build-system]
requires = [ "poetry-core>=1.0.0",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-braze-tests"
version = "0.4.0"
description = "Unit tests for source-braze"
authors = ["Airbyte <contact@airbyte.io>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
airbyte-cdk = "7.47.0"
pytest = "^8"
freezegun = "^1.5"
requests-mock = "^1.12"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*"
]
