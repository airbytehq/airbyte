    - agenda_items
    - discussion_groups
    - tracks
    - webinars
    - event_members

streams:
  - type: DeclarativeStream
    name: organizations
    description: Organizations stream. Events are the base object of Goldcast.
    retriever:
      type: SimpleRetriever
      paginator:
        type: DefaultPaginator
        pagination_strategy:
          type: OffsetIncrement
          page_size: 100
        page_size_option:
          type: RequestOption
          field_name: limit
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: offset
          inject_into: request_parameter
      requester:
        type: HttpRequester
        http_method: GET
        url: https://customapi.goldcast.io/core/organization/
        authenticator:
          type: ApiKeyAuthenticator
          header: X-Cvent-Authorization
          api_token: "Token {{ config['access_key'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - results
    primary_key: id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
