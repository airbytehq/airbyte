  - type: DeclarativeStream
    name: webinars
    description: Webinars stream. Information on the webinars of events.
    retriever:
      type: SimpleRetriever
      paginator:
        type: NoPagination
      requester:
        type: HttpRequester
        http_method: GET
        url: >-
          https://customapi.goldcast.io/event/webinars/{{
          stream_partition.event }}
        authenticator:
          type: ApiKeyAuthenticator
          header: X-Cvent-Authorization
          api_token: "Token {{ config['access_key'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      partition_router:
        - type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              partition_field: event
              # Not registered as a top-level stream on purpose: this exists only to
              # drive the webinars partition router. The events endpoint returns every
              # event type, but /event/webinars/{id} 400s for non-webinar events, so we
              # scope the parent to event_type=Webinar via the API's own filter instead
              # of a client-side filter.
              stream:
                type: DeclarativeStream
                name: webinar_events
                description: >-
                  Webinar-type events only. Internal parent for the webinars stream;
                  not exposed as a syncable stream.
                retriever:
                  type: SimpleRetriever
                  paginator:
                    type: DefaultPaginator
                    pagination_strategy:
                      type: OffsetIncrement
                      page_size: 100
                    page_size_option:
                      type: RequestOption
                      field_name: limit
                      inject_into: request_parameter
                    page_token_option:
                      type: RequestOption
                      field_name: offset
                      inject_into: request_parameter
                  requester:
                    type: HttpRequester
                    http_method: GET
                    url: https://customapi.goldcast.io/event/?event_type=Webinar
                    authenticator:
                      type: ApiKeyAuthenticator
                      header: X-Cvent-Authorization
                      api_token: "Token {{ config['access_key'] }}"
                  record_selector:
                    type: RecordSelector
                    extractor:
                      type: DpathExtractor
                      field_path:
                        - results
                primary_key: id
                schema_loader:
                  type: InlineSchemaLoader
                  schema:
                    type: object
                    additionalProperties: true
                    properties:
                      id:
                        type: string
