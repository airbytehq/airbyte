  - type: DeclarativeStream
    name: event_members
    description: Events members stream. Information on who particpated on events.
    retriever:
      type: SimpleRetriever
      paginator:
        type: DefaultPaginator
        pagination_strategy:
          type: OffsetIncrement
          page_size: 100
        page_size_option:
          type: RequestOption
          field_name: limit
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: offset
          inject_into: request_parameter
      requester:
        type: HttpRequester
        http_method: GET
        url: >-
          https://customapi.goldcast.io/event/event-members?event={{
          stream_partition.event }}
        authenticator:
          type: ApiKeyAuthenticator
          header: X-Cvent-Authorization
          api_token: "Token {{ config['access_key'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - results
      partition_router:
        - type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                type: DeclarativeStream
                name: events
                description: Events stream. Events are the base object of Goldcast.
                retriever:
                  type: SimpleRetriever
                  paginator:
                    type: DefaultPaginator
                    pagination_strategy:
                      type: OffsetIncrement
                      page_size: 100
                    page_size_option:
                      type: RequestOption
                      field_name: limit
                      inject_into: request_parameter
                    page_token_option:
                      type: RequestOption
                      field_name: offset
                      inject_into: request_parameter
                  requester:
                    type: HttpRequester
                    http_method: GET
                    url: https://customapi.goldcast.io/event/
