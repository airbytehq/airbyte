  - type: DeclarativeStream
    name: agenda_items
    description: Agenda items stream. Agenda items are associated to events.
    retriever:
      type: SimpleRetriever
      paginator:
        type: DefaultPaginator
        pagination_strategy:
          type: OffsetIncrement
          page_size: 100
        page_size_option:
          type: RequestOption
          field_name: limit
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: offset
          inject_into: request_parameter
      requester:
        type: HttpRequester
        http_method: GET
        url: https://customapi.goldcast.io/event/agenda-item/
        authenticator:
          type: ApiKeyAuthenticator
          header: X-Cvent-Authorization
          api_token: "Token {{ config['access_key'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - results
    primary_key: id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        properties:
          description:
            type:
              - string
              - "null"
          id:
            type: number
          event:
            type:
              - string
              - "null"
          title:
            type:
              - string
              - "null"
          start_time:
            type:
              - string
              - "null"
          end_time:
            type:
              - string
              - "null"
