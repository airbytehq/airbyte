          field_name: limit
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: offset
          inject_into: request_parameter
      requester:
        type: HttpRequester
        http_method: GET
        url: https://customapi.goldcast.io/event/tracks/
        authenticator:
          type: ApiKeyAuthenticator
          header: X-Cvent-Authorization
          api_token: "Token {{ config['access_key'] }}"
      record_selector:
        type: RecordSelector
        extractor:
