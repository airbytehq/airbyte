[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-goldcast-tests"
version = "0.0.0"
description = "Unit tests for source-goldcast"
authors = ["Airbyte <contact@airbyte.io>"]

[tool.poetry.dependencies]
python = "^3.10,<3.13"
airbyte-cdk = "^7"
pytest = "^8"
# `airbyte_cdk.test.mock_http.HttpMocker` imports `requests_mock`, which the CDK does not
# declare itself, so tests using it fail at collection without this.
requests-mock = "^1"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*"
]
