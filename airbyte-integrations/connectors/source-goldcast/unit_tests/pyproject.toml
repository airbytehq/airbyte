[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-goldcast-tests"
version = "0.0.0"
description = "Unit tests for source-goldcast"
authors = ["Airbyte <contact@airbyte.io>"]

[tool.poetry.dependencies]
python = "^3.10,<3.13"
pytest = "^8"
# These tests assert on the parsed `manifest.yaml` only, so the CDK is not needed.
pyyaml = "^6"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*"
]
