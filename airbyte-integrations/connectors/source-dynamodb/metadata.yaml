  name: DynamoDB
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: alpha
  supportLevel: community
  releases:
    breakingChanges:
      1.0.0:
        message:
          "**The DynamoDB source has been rebuilt on Airbyte's Bulk CDK.** It reads large tables with
          parallel scans, saves its position during full refresh and incremental syncs so that they
          resume after an interruption, supports speed mode, reads large numbers exactly and accepts
          integer cursors. Saved access key configurations and incremental sync state keep working.

          **What changed:** role based authentication (an empty access key, with credentials taken
          from the environment the connector runs in) is no longer available; **AWS Region** is
          required; **DynamoDB Endpoint** must be an `http` or `https` URL; stream schemas use
          Airbyte's standard type shapes, so every column shows a schema change at the next schema
          refresh; empty tables are no longer discovered.

          **What to do:** edit sources that used role based authentication to use an access key, or an
          access key with an IAM role to assume, and set the region. Then refresh the source schema of
          each connection. See the
          [migration guide](https://docs.airbyte.com/integrations/sources/dynamodb-migrations).
          "
        upgradeDeadline: "2026-12-31"
  tags:
    - language:java
  externalDocumentationUrls:
    - title: Amazon DynamoDB API reference
      url: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/
      type: api_reference
