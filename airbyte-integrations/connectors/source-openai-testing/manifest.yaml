        request_parameters:
          group_by: project_id,user_id,model
          bucket_width: 1d
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
          record_expander:
            type: RecordExpander
            on_no_records: emit_parent
            remain_original_record: true
            expand_records_from_field:
              - results
    primary_key:
      - snapshot_date
      - project_id
      - user_id
      - model
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        required:
          - snapshot_date
          - project_id
          - user_id
          - model
          - start_time
        properties:
          model:
            type: string
          user_id:
            type: string
          end_time:
            type:
              - string
              - "null"
          project_id:
            type: string
          start_time:
            type: string
          snapshot_date:
            type: string
          num_model_requests:
            type:
              - number
              - "null"
        additionalProperties: true
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - start_time
            value: >-
              {{ record.start_time if record.start_time is defined else
              record.original_record.start_time }}
            value_type: string
          - type: AddedFieldDefinition
            path:
              - end_time
            value: >-
              {{ record.end_time if record.end_time is defined else
              record.original_record.end_time }}
            value_type: string
          - type: AddedFieldDefinition
            path:
              - snapshot_date
            value: >-
              {{ format_datetime((record.start_time if record.start_time is
              defined else record.original_record.start_time) | int, '%Y-%m-%d')
              }}
            value_type: string
          - type: AddedFieldDefinition
            path:
              - project_id
            value: "{{ record.project_id if record.project_id is defined else none }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - model
            value: "{{ record.model if record.model is defined else none }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - user_id
            value: "{{ record.user_id if record.user_id is defined else none }}"
            value_type: string
    incremental_sync:
      type: DatetimeBasedCursor
      step: P1D
      cursor_field: start_time
      end_datetime:
        type: MinMaxDatetime
        datetime: >-
          {{ format_datetime((config['end_time'] or
          today_utc().strftime('%Y-%m-%d')), '%s') }}
        datetime_format: "%s"
      start_datetime:
