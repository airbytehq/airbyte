version: 7.28.2

type: DeclarativeSource

description: tetsing

check:
  type: CheckStream
  stream_names:
    - users

definitions:
  linked:
    HttpRequester:
      authenticator:
        type: BearerAuthenticator
        api_token: "{{ config['openai_token'] }}"
      error_handler:
        type: DefaultErrorHandler
        max_retries: 5
        response_filters:
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 429
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 500
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 502
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 503
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 504
        backoff_strategies:
          - type: ExponentialBackoffStrategy
            factor: 5
      request_headers:
        Content-Type: application/json
        OpenAI-Organization: "{{ config['openai_organization'] }}"
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: limit
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: after
          inject_into: request_parameter
        pagination_strategy:
          type: CursorPagination
          page_size: 20
          cursor_value: "{{ response.last_id }}"
          stop_condition: "{{ response.has_more is false }}"
    CompliancePaginator:
      type: DefaultPaginator
      page_size_option:
        type: RequestOption
        field_name: limit
        inject_into: request_parameter
      page_token_option:
        type: RequestOption
        field_name: after
        inject_into: request_parameter
      pagination_strategy:
        type: CursorPagination
        page_size: 1000
        cursor_value: "{{ response.last_id }}"
        stop_condition: "{{ response.has_more is false }}"
    ComplianceHistoricalPaginator:
      type: DefaultPaginator
      page_size_option:
        type: RequestOption
        field_name: limit
        inject_into: request_parameter
      page_token_option:
        type: RequestOption
        field_name: after
        inject_into: request_parameter
      pagination_strategy:
        type: CursorPagination
        page_size: 100
        cursor_value: "{{ response.last_id }}"
        stop_condition: "{{ response.has_more is false }}"
    ComplianceAuthenticator:
      type: BearerAuthenticator
      api_token: "{{ config['openai_compliance_token'] }}"

streams:
  - type: DeclarativeStream
    name: users
    retriever:
      type: SimpleRetriever
      paginator:
        type: DefaultPaginator
