spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - openai_organization
      - openai_token
      - start_time
      - openai_compliance_token
      - workspace_id
    properties:
      end_time:
        type: string
        description: >-
          The end time for querying the API in YYYY-MM-DD (defaults to today if
          omitted)
        order: 3
        title: End Time
      start_time:
        type: string
        description: The start time for querying the API in YYYY-MM-DD
        order: 2
        title: Start time
      openai_token:
        type: string
        description: The API key token used for authorizing API requests
        order: 1
        title: OpenAI-token
        airbyte_secret: true
      workspace_id:
        type: string
        description: The ID of the workspace.
        order: 5
        title: Workspace ID
      openai_organization:
        type: string
        description: The organization (organization_id) associated with the request
        order: 0
        title: OpenAI-Organization
      openai_compliance_token:
        type: string
        description: >-
          The API key token used for authorizing compliance API endpoint
          requests
        order: 4
        title: OpenAI-compliance-token
        airbyte_secret: true
    additionalProperties: true

