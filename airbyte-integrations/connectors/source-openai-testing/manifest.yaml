            - type: HttpResponseFilter
              action: RETRY
              http_codes:
                - 503
              error_message_contains: ""
            - type: HttpResponseFilter
              action: RETRY
              http_codes:
                - 504
              error_message_contains: ""
          backoff_strategies:
            - type: ExponentialBackoffStrategy
              factor: 5
              jitter_range_in_seconds: null
        request_parameters:
          after: >-
            {{ next_page_token['next_page_token'] if next_page_token else
            stream_interval['start_time'] }}
          event_type: CONVERSATION_MESSAGE
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
    primary_key:
      - id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        required:
          - id
          - snapshot_date
        properties:
          id:
            type: string
          end_time:
            type:
              - string
              - "null"
          file_name:
            type:
              - string
              - "null"
          file_size:
            type:
              - number
              - "null"
          event_type:
            type:
              - string
              - "null"
          file_sha256:
            type:
              - string
              - "null"
          snapshot_date:
            type: string
        additionalProperties: true
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - snapshot_date
            value: "{{ stream_interval['start_time'] }}"
            value_type: string
    incremental_sync:
      type: DatetimeBasedCursor
      step: P1D
      cursor_field: snapshot_date
      end_datetime:
        type: MinMaxDatetime
        datetime: >-
          {{ format_datetime((config['end_time'] if config['end_time'] else
          now_utc().strftime('%Y-%m-%d')), '%Y-%m-%dT%H:%M:%SZ') }}
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ format_datetime(config['start_time'], '%Y-%m-%dT%H:%M:%SZ') }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      end_time_option:
        type: RequestOption
        field_name: before
        inject_into: request_parameter
      cursor_granularity: PT1S
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%SZ"
        - "%Y-%m-%dT%H:%M:%S.%fZ"
      partition_field_end: ""
      partition_field_start: ""
