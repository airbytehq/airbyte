          type: RequestOption
          field_name: limit
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: after
          inject_into: request_parameter
        pagination_strategy:
          type: CursorPagination
          page_size: 20
          cursor_value: "{{ response.last_id }}"
          stop_condition: "{{ response.has_more is false }}"
      requester:
        type: HttpRequester
        url: https://api.openai.com/v1/organization/users
        http_method: GET
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['openai_token'] }}"
        error_handler:
          type: DefaultErrorHandler
          max_retries: 5
          response_filters:
            - type: HttpResponseFilter
              action: RETRY
              http_codes:
                - 429
              error_message_contains: ""
            - type: HttpResponseFilter
              action: RETRY
              http_codes:
                - 500
              error_message_contains: ""
            - type: HttpResponseFilter
              action: RETRY
              http_codes:
                - 502
              error_message_contains: ""
            - type: HttpResponseFilter
              action: RETRY
              http_codes:
                - 503
              error_message_contains: ""
            - type: HttpResponseFilter
              action: RETRY
              http_codes:
                - 504
              error_message_contains: ""
          backoff_strategies:
            - type: ExponentialBackoffStrategy
              factor: 5
              jitter_range_in_seconds: null
        request_headers:
          Content-Type: application/json
          OpenAI-Organization: "{{ config['openai_organization'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
    primary_key: id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        required:
          - id
        properties:
          id:
            type: string
          name:
            type:
              - string
              - "null"
          role:
            type:
              - string
              - "null"
          email:
            type:
              - string
              - "null"
          added_at:
            type:
              - number
              - "null"
        additionalProperties: true
  - type: DeclarativeStream
    name: conversation_messages
    retriever:
      type: SimpleRetriever
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: limit
          inject_into: request_parameter
        pagination_strategy:
          type: CursorPagination
          page_size: 100
          cursor_value: "{{ response.last_end_time }}"
          stop_condition: "{{ response.has_more is false or not response.last_end_time }}"
      requester:
        type: HttpRequester
        url: >-
          https://api.chatgpt.com/v1/compliance/workspaces/{{
          config['workspace_id'] }}/logs
        http_method: GET
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['openai_compliance_token'] }}"
        error_handler:
          type: DefaultErrorHandler
          max_retries: 5
          response_filters:
            - type: HttpResponseFilter
