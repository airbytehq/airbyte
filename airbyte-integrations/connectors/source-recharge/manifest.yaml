version: 7.46.0
definitions:
  selector:
    description: Base records selector for Full Refresh streams
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path:
      - '{{ parameters.get(''data_path'')}}'
    schema_normalization: Default
  authenticator:
    type: ApiKeyAuthenticator
    api_token: '{{ config[''access_token''] }}'
    inject_into:
      type: RequestOption
      inject_into: header
      field_name: X-Recharge-Access-Token
  paginator_deprecated_api:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: page
    page_size_option:
      inject_into: request_parameter
      field_name: limit
      type: RequestOption
    pagination_strategy:
      type: PageIncrement
      start_from_page: 1
      page_size: 250
      inject_on_first_request: false
  paginator_modern_api:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: cursor
    page_size_option:
      inject_into: request_parameter
      type: RequestOption
      field_name: limit
    pagination_strategy:
      type: CursorPagination
      page_size: 250
      cursor_value: '{{ response.get("next_cursor", {}) }}'
      stop_condition: '{{ not response.get("next_cursor", {}) }}'
  requester_base:
    description: Default Base Requester for Full Refresh streams
    type: HttpRequester
    url_base: https://api.rechargeapps.com/
    path: '{{ parameters[''name''] }}'
    http_method: GET
    authenticator:
      $ref: '#/definitions/authenticator'
    error_handler:
      type: DefaultErrorHandler
      max_retries: 10
      response_filters:
      - http_codes:
        - 429
        action: RETRY
  requester_deprecated_api:
    $ref: '#/definitions/requester_base'
    request_headers:
      x-recharge-version: 2021-01
  requester_modern_api:
    $ref: '#/definitions/requester_base'
    request_headers:
      x-recharge-version: 2021-11
  retriever_api_deprecated:
    description: Default Retriever for Deprecated API `2021-01` Full Refresh streams.
    record_selector:
      $ref: '#/definitions/selector'
    requester:
      $ref: '#/definitions/requester_deprecated_api'
    paginator:
      $ref: '#/definitions/paginator_deprecated_api'
  retriever_api_modern:
    description: Default Retriever for Modern API `2021-11` Full Refresh streams.
    record_selector:
      $ref: '#/definitions/selector'
    requester:
      $ref: '#/definitions/requester_modern_api'
    paginator:
      $ref: '#/definitions/paginator_modern_api'
    ignore_stream_slicer_parameters_on_paginated_requests: true
  retriever_metafields:
    $ref: '#/definitions/retriever_api_modern'
    partition_router:
      type: ListPartitionRouter
      cursor_field: owner_resource
      values:
      - address
      - order
      - charge
      - customer
      - store
      - subscription
      request_option:
        inject_into: request_parameter
        type: RequestOption
        field_name: owner_resource
  base_stream:
    primary_key: id
  base_deprecated_api_stream:
    $ref: '#/definitions/base_stream'
    retriever:
      $ref: '#/definitions/retriever_api_deprecated'
  base_modern_api_stream:
    $ref: '#/definitions/base_stream'
    retriever:
      $ref: '#/definitions/retriever_api_modern'
  base_incremental_stream:
    $ref: '#/definitions/base_modern_api_stream'
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      cursor_datetime_formats:
      - '%Y-%m-%dT%H:%M:%S%z'
      - '%Y-%m-%dT%H:%M:%S'
      datetime_format: '%Y-%m-%dT%H:%M:%S%z'
      lookback_window: P{{ config.get('lookback_window_days', 0) }}D
      start_datetime:
        type: MinMaxDatetime
        datetime: '{{ config[''start_date''] }}'
        datetime_format: '%Y-%m-%dT%H:%M:%SZ'
      start_time_option:
        type: RequestOption
        field_name: updated_at_min
        inject_into: request_parameter
    retriever:
      $ref: '#/definitions/retriever_api_modern'
      requester:
        $ref: '#/definitions/requester_modern_api'
        request_parameters:
          sort_by: '{{ ''updated_at-asc'' if not next_page_token else '''' }}'
  base_incremental_events_stream:
    $ref: '#/definitions/base_modern_api_stream'
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: created_at
      cursor_datetime_formats:
      - '%Y-%m-%dT%H:%M:%S%z'
      - '%Y-%m-%dT%H:%M:%S'
      datetime_format: '%Y-%m-%dT%H:%M:%S%z'
      start_datetime:
        type: MinMaxDatetime
        datetime: '{{ config[''start_date''] }}'
        datetime_format: '%Y-%m-%dT%H:%M:%SZ'
        min_datetime: '{{ day_delta(-7, ''%Y-%m-%dT%H:%M:%SZ'') }}'
      start_time_option:
        type: RequestOption
        field_name: created_at_min
        inject_into: request_parameter
  collections_stream:
    description: 'Collections Stream: https://developer.rechargepayments.com/2021-11/collections/collections_list'
    $ref: '#/definitions/base_modern_api_stream'
    $parameters:
      name: collections
      data_path: collections
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/collections'
  metafields_stream:
    description: 'Metafields Stream: https://developer.rechargepayments.com/2021-11/metafields'
    $ref: '#/definitions/base_modern_api_stream'
    retriever:
      $ref: '#/definitions/retriever_metafields'
    $parameters:
      name: metafields
      data_path: metafields
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/metafields'
  plans_stream:
    description: 'Plans Stream: https://developer.rechargepayments.com/2021-11/plans/plans_list'
    $ref: '#/definitions/base_modern_api_stream'
    $parameters:
      name: plans
      data_path: plans
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/plans'
  shop_stream:
    description: 'Shop Stream: https://developer.rechargepayments.com/v1-shopify?python#shop Shop endpoint is not available
      in 2021-11 API version'
    $ref: '#/definitions/base_deprecated_api_stream'
    retriever:
      $ref: '#/definitions/retriever_api_deprecated'
      paginator:
        type: NoPagination
      record_selector:
        $ref: '#/definitions/selector'
        extractor:
          type: DpathExtractor
          field_path: []
    primary_key:
    - id
    transformations:
    - type: AddFields
      fields:
      - path:
        - id
        value_type: integer
        value: '{{ record.shop.get(''id'') or record.store.get(''id'') }}'
    $parameters:
      name: shop
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/shop'
  payment_methods_stream:
    description: 'Payment Methods Stream: https://developer.rechargepayments.com/2021-11/payment_methods/payment_methods_list'
    $ref: '#/definitions/base_modern_api_stream'
    $parameters:
      name: payment_methods
      data_path: payment_methods
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/payment_methods'
  addresses_stream:
    description: 'Addresses Stream: https://developer.rechargepayments.com/2021-11/addresses/list_addresses'
    $ref: '#/definitions/base_incremental_stream'
    $parameters:
      name: addresses
      data_path: addresses
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/addresses'
  charges_stream:
    description: 'Charges Stream: https://developer.rechargepayments.com/2021-11/charges/charge_list'
    $ref: '#/definitions/base_incremental_stream'
    $parameters:
      name: charges
      data_path: charges
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/charges'
  customers_stream:
    description: 'Customers Stream: https://developer.rechargepayments.com/2021-11/customers/customers_list'
    $ref: '#/definitions/base_incremental_stream'
    $parameters:
      name: customers
      data_path: customers
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/customers'
  discounts_stream:
    description: 'Discounts Stream: https://developer.rechargepayments.com/2021-11/discounts/discounts_list'
    $ref: '#/definitions/base_incremental_stream'
    $parameters:
      name: discounts
      data_path: discounts
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/discounts'
  onetimes_stream:
    description: 'Onetimes Stream: https://developer.rechargepayments.com/2021-11/onetimes/onetimes_list'
    $ref: '#/definitions/base_incremental_stream'
    $parameters:
      name: onetimes
      data_path: onetimes
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/onetimes'
  subscriptions_stream:
    $ref: '#/definitions/base_incremental_stream'
    $parameters:
      name: subscriptions
      data_path: subscriptions
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/subscriptions'
  events_stream:
    description: 'Events Stream: https://developer.rechargepayments.com/2021-11/events/events_list'
    $ref: '#/definitions/base_incremental_events_stream'
    $parameters:
      name: events
      data_path: events
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/events'
  bundle_selections_stream:
    description: 'Bundle Selections Stream: https://developer.rechargepayments.com/2021-11/bundle_selections/bundle_selection_list'
    $ref: '#/definitions/base_incremental_stream'
    $parameters:
      name: bundle_selections
      data_path: bundle_selections
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/bundle_selections'
  credit_adjustments_stream:
    description: 'Credit Adjustments Stream: https://developer.rechargepayments.com/2021-11/credits/credit_adjustment_list'
    $ref: '#/definitions/base_incremental_stream'
    $parameters:
      name: credit_adjustments
      data_path: credit_adjustments
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/credit_adjustments'
  orders_deprecated:
    type: DeclarativeStream
    $ref: '#/definitions/base_stream'
    $parameters:
      name: orders
      data_path: orders
    retriever:
      $ref: '#/definitions/retriever_api_deprecated'
      requester:
        $ref: '#/definitions/requester_deprecated_api'
        request_parameters:
          sort_by: updated_at-asc
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      datetime_format: '%Y-%m-%d %H:%M:%S'
      cursor_datetime_formats:
      - '%Y-%m-%d %H:%M:%S'
      - '%Y-%m-%dT%H:%M:%S%z'
      - '%Y-%m-%dT%H:%M:%S'
      start_datetime:
        type: MinMaxDatetime
        datetime: '{{ config[''start_date''] }}'
        datetime_format: '%Y-%m-%dT%H:%M:%SZ'
      step: P30D
      cursor_granularity: PT1S
      start_time_option:
        type: RequestOption
        field_name: updated_at_min
        inject_into: request_parameter
      end_time_option:
        type: RequestOption
        field_name: updated_at_max
        inject_into: request_parameter
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/orders'
  orders_modern:
    type: DeclarativeStream
    $ref: '#/definitions/base_stream'
    $parameters:
      name: orders
      data_path: orders
    retriever:
      $ref: '#/definitions/retriever_api_modern'
      requester:
        $ref: '#/definitions/requester_modern_api'
        request_parameters:
          sort_by: '{{ ''updated_at-asc'' if not next_page_token else '''' }}'
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      datetime_format: '%Y-%m-%d %H:%M:%S'
      cursor_datetime_formats:
      - '%Y-%m-%d %H:%M:%S'
      - '%Y-%m-%dT%H:%M:%S%z'
      - '%Y-%m-%dT%H:%M:%S'
      start_datetime:
        type: MinMaxDatetime
        datetime: '{{ config[''start_date''] }}'
        datetime_format: '%Y-%m-%dT%H:%M:%SZ'
      step: P30D
      cursor_granularity: PT1S
      start_time_option:
        type: RequestOption
        field_name: updated_at_min
        inject_into: request_parameter
      end_time_option:
        type: RequestOption
        field_name: updated_at_max
        inject_into: request_parameter
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/orders'
streams:
- '#/definitions/addresses_stream'
- '#/definitions/charges_stream'
- '#/definitions/collections_stream'
- '#/definitions/customers_stream'
- '#/definitions/discounts_stream'
- '#/definitions/metafields_stream'
- '#/definitions/onetimes_stream'
- '#/definitions/plans_stream'
- '#/definitions/shop_stream'
- '#/definitions/subscriptions_stream'
- '#/definitions/events_stream'
- '#/definitions/bundle_selections_stream'
- '#/definitions/credit_adjustments_stream'
- '#/definitions/payment_methods_stream'
- type: ConditionalStreams
  condition: '{{ config.get(''use_orders_deprecated_api'', false) }}'
  streams:
  - $ref: '#/definitions/orders_deprecated'
    type: DeclarativeStream
- type: ConditionalStreams
  condition: '{{ not config.get(''use_orders_deprecated_api'', false) }}'
  streams:
  - $ref: '#/definitions/orders_modern'
    type: DeclarativeStream
check:
  type: CheckStream
  stream_names:
  - shop
spec:
  documentation_url: https://docs.airbyte.com/integrations/sources/recharge
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    title: Recharge Spec
    type: object
    required:
    - start_date
    - access_token
    additionalProperties: true
    properties:
      start_date:
        type: string
        title: Start Date
        description: The date from which you'd like to replicate data for Recharge API, in the format YYYY-MM-DDT00:00:00Z.
          Any data before this date will not be replicated.
        examples:
        - '2021-05-14T00:00:00Z'
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        format: date-time
      access_token:
        type: string
        title: Access Token
        description: The value of the Access Token generated. See the <a href="https://docs.airbyte.com/integrations/sources/recharge">docs</a>
          for more information.
        airbyte_secret: true
      use_orders_deprecated_api:
        type: boolean
        title: Use `Orders` Deprecated API
        description: Define whether or not the `Orders` stream should use the deprecated `2021-01` API version, or use `2021-11`,
          otherwise.
        default: true
      lookback_window_days:
        type: integer
        title: Lookback Window (in days)
        description: Specifies how many days of historical data should be reloaded each time the recharge connector runs.
        default: 0
