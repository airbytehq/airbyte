# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-greenhouse:dev
test_strictness_level: "high"
# Live lanes run on both authentication branches:
# - config_client_credentials.json: a static, read-only Harvest v3 custom integration
#   credential on the test account. It doesn't rotate, so it survives consecutive runs.
# - config_oauth.json: the Airbyte partner app's Authorization Code grant. Greenhouse
#   refresh tokens are single-use, so every run rotates the stored credential. The CDK
#   test harness persists the rotated config under secrets/updated_configurations/ and
#   CI writes it back to GSM after the tests (`airbyte-ops secrets push`), so consecutive
#   runs keep working (airbytehq/airbyte-internal-issues#17023). If the secret still
#   drifts (e.g. a run was killed before the push step), re-mint it by hand.
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config_client_credentials.json"
        status: "succeed"
      - config_path: "secrets/config_oauth.json"
        status: "succeed"
      - config_path: "integration_tests/config_invalid.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config_client_credentials.json"
      - config_path: "secrets/config_oauth.json"
  basic_read:
    tests:
      # Restore expect_records from a regenerated live Harvest v3 read before enabling fixture validation.
      - config_path: "secrets/config_client_credentials.json"
        empty_streams:
          # These three hold no records on the test account and cannot be seeded through
          # Harvest v3: eeoc and demographics_answers only exist once a candidate submits
          # the questionnaire themselves (POST /v3/eeoc returns 404 - there is no write
          # endpoint), and offers need a live offer. All three have mock read tests in
          # unit_tests/test_pagination.py: test_eeoc_uses_submitted_at_filter_and_cursor_only_follow_up
          # and test_bypassed_streams_paginate_and_filter_on_the_first_page_only[offers|demographics_answers].
          - name: eeoc
            bypass_reason: "Test account has no submitted EEOC responses"
          - name: demographics_answers
            bypass_reason: "Test account has no submitted demographic answers"
          - name: offers
            bypass_reason: "Test account has no offers"
      - config_path: "secrets/config_oauth.json"
        empty_streams:
          # Same empty streams, reasons, and unit-test coverage as the client-credentials lane above.
          - name: eeoc
            bypass_reason: "Test account has no submitted EEOC responses"
          - name: demographics_answers
            bypass_reason: "Test account has no submitted demographic answers"
          - name: offers
            bypass_reason: "Test account has no offers"
  full_refresh:
    tests:
      - config_path: "secrets/config_client_credentials.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
  incremental:
    tests:
      - config_path: "secrets/config_client_credentials.json"
        configured_catalog_path: "integration_tests/incremental_configured_catalog.json"
        future_state:
          future_state_path: "integration_tests/abnormal_state.json"
