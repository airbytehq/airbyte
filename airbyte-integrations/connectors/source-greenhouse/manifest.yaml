        description: Timestamp the interview was first placed on a calendar through a Greenhouse calendaring integration (Google, Outlook, or Greenhouse Schedule), in ISO 8601. `null` for interviews that have never been scheduled via the calendar pipeline.
        type:
        - 'null'
        - string
        format: date-time
      starts_at:
        description: "Interview start time, in ISO 8601. `null` for interviews that have not yet been scheduled (for example, assigned take-home tests or interviews awaiting candidate availability) and for all-day events \u2014 see `all_day_start_on`."
        type:
        - 'null'
        - string
        format: date-time
      status:
        description: Lifecycle status of the interview. `to_be_scheduled` is the pre-schedule placeholder; `scheduled` is on the calendar; `awaiting_feedback` is past with scorecards outstanding; `complete` is past with all scorecards in; `collect_feedback` and `skipped` are alternative terminal states; `to_be_sent`, `sent`, and `received` are used for take-home tests sent through Greenhouse.
        type:
        - 'null'
        - string
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
      video_conferencing_url:
        description: Join URL for the interview's video conference, auto-populated by Greenhouse's Zoom, Google Meet, or Microsoft Teams integrations when one is attached during scheduling. `null` when no video conferencing was added.
        type:
        - 'null'
        - string
  job_posts:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      active:
        description: If `true`, the post has not been deleted. Deleted posts are excluded by default; pass `active=false` on the list endpoint to retrieve them.
        type:
        - 'null'
        - boolean
      content:
        description: "HTML body of the post shown to candidates on the job board. For internal posts this returns the `internal_content` instead. Sanitized server-side \u2014 only a limited element/attribute allowlist (including `iframe`, `video`, `source`) survives. `null` while the post is still being scaffolded."
        type:
        - 'null'
        - string
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      demographic_question_set_id:
        description: Id of the demographic question set surfaced to candidates on this post for diversity, equity, and inclusion (DE&I) reporting. `null` when the post does not collect demographic data.
        type:
        - 'null'
        - integer
      featured:
        description: If `true`, the post is currently featured on the organization's internal job board and surfaces in the weekly internal-jobs email. Only internal posts can be featured, and at most three can be featured at a time.
        type:
        - 'null'
        - boolean
      first_published_at:
        description: Timestamp the post first transitioned to `live`, in ISO 8601. `null` for posts that have never been published.
        type:
        - 'null'
        - string
        format: date-time
      id:
        type:
        - 'null'
        - integer
      internal:
        description: If `true`, the post lives on an internal job board and is visible only to existing employees signed in to the internal board. If `false`, the post is external and lives on a public-facing `job_board`. Set by the board the post is associated with at create time.
        type:
        - 'null'
        - boolean
      internal_content:
        description: HTML body shown on the internal job board when the post is also configured as internal. `null` for external-only posts. Same sanitization rules as `content`.
        type:
        - 'null'
        - string
      job_board_id:
        description: Id of the `job_board` this post is published to. Resolves to either an external (careers site, syndicated board) or internal job board depending on `internal`. Each post belongs to exactly one board at a time.
        type:
        - 'null'
        - integer
      job_id:
        description: Id of the parent job (requisition) this post belongs to. A single job can have multiple posts; the job is the source of truth for the hiring team, openings, and interview plan.
        type:
        - 'null'
        - integer
      language:
        description: ISO 639-1 locale of the post, used to render the candidate-facing application form in the matching language (e.g. `en`, `fr`, `ja`). `null` when no locale has been chosen.
        type:
        - 'null'
        - string
      live:
        description: "If `true`, the post is published (`job_application_status` is `live`) and its job board is also live. A post on an unpublished board is **not** `live` \u2014 its `public_url` returns a 404 until the board is enabled."
        type:
        - 'null'
        - boolean
      public_url:
        description: Canonical public URL of the post on its job board, including the `gh_jid` tracking parameter. `null` when the post has no associated job board or the board has no public URL configured.
        type:
        - 'null'
        - string
        format: uri
      questions:
        description: Application form questions presented to candidates on this post, including default questions (resume, cover letter, basic info) and any custom questions configured by the hiring team. Ordered as they appear on the form.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - object
          properties:
            answer_type:
              description: Input type the candidate uses to answer. `short_text` and `long_text` are free-text inputs, `single_select` and `multi_select` use the `options` array, `boolean` is a yes/no, `attachment` accepts a file upload, and `hidden` is set programmatically without rendering a field.
              type:
              - 'null'
              - string
            description:
              description: Help text shown below the question label to give candidates additional context. `null` when no help text is set.
              type:
              - 'null'
              - string
            id:
              description: Id of the question. `null` for default questions that are rendered from configuration rather than persisted per post (e.g. the built-in `first_name` field).
              type:
              - 'null'
              - integer
            label:
              description: Human-readable label rendered above the input on the application form.
              type:
              - 'null'
              - string
            name:
              description: Stable form-field name used when submitting an application (e.g. `question_42` for a custom question, `first_name` for a default field). Use this when mapping responses back to a question.
              type:
              - 'null'
              - string
            options:
              description: Selectable answer options for `single_select` and `multi_select` questions. Empty for other answer types.
              type:
              - 'null'
              - array
              items:
                type:
                - 'null'
                - object
                properties:
                  id:
                    description: Id of the option, stable across edits to the option label.
                    type:
                    - 'null'
                    - integer
                  label:
                    description: Human-readable text shown to the candidate for this option.
                    type:
                    - 'null'
                    - string
            private:
              description: If `true`, answers to this question are visible only to users with explicit access (e.g. private notes, API-only questions). Defaults to `false`.
              type:
              - 'null'
              - boolean
            required:
              description: If `true`, the candidate must answer this question to submit the application. `null` for default questions whose required-ness is driven by board-level configuration.
              type:
              - 'null'
              - boolean
      title:
        description: "Public-facing title shown to candidates on the job board (e.g. `Senior Backend Engineer, Remote`). Distinct from the internal `job.name` \u2014 a single job can have several posts with different titles, one per board, language, or geography."
        type:
        - 'null'
        - string
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
  job_stages:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      active:
        description: Whether the stage is on the job's current interview plan. Inactive stages are retained so that historical `application_stages` rows continue to resolve, but no new applications enter them.
        type:
        - 'null'
        - boolean
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      id:
        type:
        - 'null'
        - integer
      job_id:
        description: Id of the job whose interview plan this stage belongs to.
        type:
        - 'null'
        - integer
      name:
        description: Name of the stage as it appears on the job's interview plan (e.g. `Application Review`, `Phone Screen`, `Onsite`, `Offer`). `Application Review` and `Offer` are added to every plan; intermediate stages can be picked from the Greenhouse library or created custom per job.
        type:
        - 'null'
        - string
      sort_order:
        description: Position of this stage within the job's interview plan, ascending. The first stage (typically `Application Review`) is `0`; `Offer` is always last.
        type:
        - 'null'
        - integer
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
  offers:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      application_id:
        description: Id of the application this offer is extended on. Every offer belongs to exactly one application; the offer is voided if the application is rejected or deleted.
        type:
        - 'null'
        - integer
      candidate_id:
        description: Id of the candidate (person) receiving this offer. Resolved through the offer's application.
        type:
        - 'null'
        - integer
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      custom_fields:
        description: Org-defined custom fields keyed by the field's `name_key`. Each value carries the field's display `name`, its `type`, and its `value`.
        type:
        - 'null'
        - object
        additionalProperties:
          type: object
          properties:
            name:
              type:
              - 'null'
              - string
            type:
              type:
              - 'null'
              - string
            value:
              type:
              - 'null'
              - string
              - number
              - integer
              - boolean
              - object
              - array
      id:
        type:
        - 'null'
        - integer
      job_id:
        description: Id of the job this offer's application is on.
        type:
        - 'null'
        - integer
      opening_id:
        description: Id of the specific opening this offer is being extended for. `null` when the offer has not yet been linked to an opening.
        type:
        - 'null'
        - integer
      resolved_at:
        description: Timestamp the offer was resolved (`Accepted` or `Rejected`), in ISO 8601. Date updates submitted through `PATCH /v3/offers/{id}` are normalized to noon UTC on the supplied date. `null` while the offer is still `Created` or has been superseded as `Deprecated` without a resolution.
        type:
        - 'null'
        - string
        format: date-time
      sent_on:
        description: Date the offer was sent to the candidate, in ISO 8601 (YYYY-MM-DD). `null` until the offer has been sent.
        type:
        - 'null'
        - string
        format: date
      starts_on:
        description: Candidate's proposed start date, in ISO 8601 (YYYY-MM-DD). `null` when no start date has been set on the offer.
        type:
        - 'null'
        - string
        format: date
      status:
        description: Lifecycle status of the offer. `Created` for offers still being drafted or pending approval, `Accepted` once the candidate accepts, `Rejected` if declined or withdrawn, and `Deprecated` for superseded prior versions (a new offer version replaces an earlier one with this status).
        type:
        - 'null'
        - string
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
      version:
        description: "Revision number of this offer within its application. Greenhouse creates a new offer row (incrementing `version`) whenever a tracked field on an existing offer changes \u2014 typically `starts_on`, `opening_id`, or a custom field configured to trigger a new version. Pair with `current_only=true` to filter the list endpoint down to the latest version per application."
        type:
        - 'null'
        - integer
  rejection_reasons:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      id:
        type:
        - 'null'
        - integer
      name:
        description: Display label shown to recruiters when rejecting a candidate (e.g. `Not a cultural fit`, `Lacking skill(s)/qualification(s)`, `Wasn't interested`, `Didn't like offer`, `Spam`). Unique within the organization. Free-text, since each organization customizes its own list under Configure > Custom Options > Rejection Reasons. Reason categorization (hire/non-hire, we vs. they rejected) is conveyed by the nested `type` rather than by the name.
        type:
        - 'null'
        - string
      type:
        description: "The rejection reason type this reason rolls up to \u2014 the categorization Greenhouse uses to interpret outcomes in reporting. Reasons grouped under `We rejected them` mean the organization declined the candidate, `They rejected us` mean the candidate withdrew or declined an offer, `Security concern` flags fraud or other trust signals, and `None specified` is the catch-all. The `Security concern` type is only returned when the `enable_reject_as_security_concern` product flag is on for the organization."
        type:
        - 'null'
        - object
        properties:
          id:
            description: Id of the rejection reason type. Stable across all rejection reasons in the organization that share the same categorization.
            type:
            - 'null'
            - integer
          key:
            description: Stable machine-readable identifier for the reason type. One of `WE_REJECTED_THEM`, `THEY_REJECTED_US`, `NONE_SPECIFIED`, or `SECURITY_CONCERN`. Prefer matching on `key` over `name` since it is not subject to localization.
            type:
            - 'null'
            - string
          name:
            description: Display name of the rejection reason type used in Greenhouse reporting. One of `We rejected them`, `They rejected us`, `None specified`, or `Security concern`.
            type:
            - 'null'
            - string
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
  scorecards:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      application_id:
        description: Id of the application this scorecard belongs to. Use it to look up the candidate via the applications endpoint.
        type:
        - 'null'
        - integer
      candidate_rating:
        description: Interviewer's overall recommendation on whether the candidate passed the interview. One of `strong_no` ("Definitely Not" in the UI), `no`, `yes`, `strong_yes`, or `no_decision`. `no_decision` is recorded when the interviewer submitted the scorecard without choosing a recommendation.
        type:
        - 'null'
        - string
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      id:
        type:
        - 'null'
        - integer
      interview_kit_id:
        description: Id of the interview kit this scorecard was filled out against. The kit determines the questions, focus attributes, and rating scale on the scorecard. The kit also identifies which interview slot on the job's interview plan produced this scorecard.
        type:
        - 'null'
        - integer
      interviewed_at:
        description: Timestamp the interview took place, in ISO 8601. Mirrors the underlying interview's scheduled time and is set when the scorecard is created (manual scorecards may set this independently).
        type:
        - 'null'
        - string
        format: date-time
      interviewer_id:
        description: Id of the Greenhouse user who participated in the interview and to whom this scorecard is assigned. Each interviewer on a multi-interviewer interview gets their own scorecard.
        type:
        - 'null'
        - integer
      notes:
        description: Free-text "key takeaways" the interviewer recorded on the scorecard (pros, cons, follow-ups). Plain text with `@`-mentions rendered as user names; use `notes_with_tags` for the version where mentions are tagged for downstream parsing.
        type:
        - 'null'
        - string
      notes_with_tags:
        description: '`notes` with `@`-mentions rendered as embedded user tags (e.g. `@[User Name](user:123)`) instead of plain user names, for partners that need to resolve mentioned users.'
        type:
        - 'null'
        - string
      private_notes:
        description: Free-text private notes visible only to users with the "see private notes" permission. Plain text with `@`-mentions rendered as user names; use `private_notes_with_tags` for the tagged version.
        type:
        - 'null'
        - string
      private_notes_with_tags:
        description: '`private_notes` with `@`-mentions rendered as embedded user tags instead of plain user names.'
        type:
        - 'null'
        - string
      public_notes:
        description: Free-text "note to other interviewers" the interviewer leaves for the rest of the hiring team. Plain text with `@`-mentions rendered as user names; use `public_notes_with_tags` for the tagged version.
        type:
        - 'null'
        - string
      public_notes_with_tags:
        description: '`public_notes` with `@`-mentions rendered as embedded user tags instead of plain user names.'
        type:
        - 'null'
        - string
      status:
        description: Lifecycle status of the scorecard. `draft` is in-progress and not yet submitted; `complete` is submitted (and `submitted_at` is set). Only complete scorecards count toward interview completion and downstream analysis.
        type:
        - 'null'
        - string
      submitted_at:
        description: Timestamp the scorecard was submitted (moved from `draft` to `complete`), in ISO 8601. `null` while `status` is `draft`. The delta between `interviewed_at` and `submitted_at` is a common "time to submit scorecard" measure.
        type:
        - 'null'
        - string
        format: date-time
      submitter_id:
        description: Id of the Greenhouse user who actually submitted the scorecard. Usually the same as `interviewer_id`, but differs when an admin submits a scorecard on another interviewer's behalf.
        type:
        - 'null'
        - integer
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
  sources:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      id:
        type:
        - 'null'
        - integer
      name:
        description: Display name of the source as recruiters see it in Greenhouse (e.g. `LinkedIn (Prospecting)`, `Indeed`, `Referral`, `Internal Applicant`, or a custom agency name). For organization-specific sources this is the label the org configured; for global Greenhouse sources it is the standard public name.
        type:
        - 'null'
        - string
      type:
        description: "The sourcing strategy this source rolls up to \u2014 the broader category used for reporting. Sources are grouped under sourcing strategies such as `Agencies`, `Referral`, `Third-party boards`, `Prospecting`, `Social media`, `Company marketing`, `In person event`, `MyGreenhouse`, and `Other`. Use the strategy when aggregating candidate volume by channel; use the source itself when reporting on a specific channel within that category."
        type:
        - 'null'
        - object
        properties:
          id:
            description: Id of the sourcing strategy. References the same strategy across all sources in the organization that roll up to it.
            type:
            - 'null'
            - integer
          name:
            description: Display name of the sourcing strategy used in Greenhouse reporting (e.g. `Agencies`, `Referral`, `Third-party boards`, `Prospecting`, `Social media`).
            type:
            - 'null'
            - string
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
  users:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      agency_id:
        description: Id of the staffing agency this user belongs to, when the user is an external agency recruiter rather than an employee of your organization. `null` for in-house users.
        type:
        - 'null'
        - integer
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      custom_fields:
        description: Org-defined custom fields keyed by the field's `name_key`. Each value carries the field's display `name`, its `type`, and its `value`.
        type:
        - 'null'
        - object
        additionalProperties:
          type: object
          properties:
            name:
              type:
              - 'null'
              - string
            type:
              type:
              - 'null'
              - string
            value:
              type:
              - 'null'
              - string
              - number
              - integer
              - boolean
              - object
              - array
      deactivated:
        description: Whether the user has been deactivated. Deactivated users cannot sign in or be assigned to new jobs, but their historical activity (notes, scorecards, emails) is preserved. Toggle via `POST /v3/users/{id}/deactivate` and `POST /v3/users/{id}/activate`.
        type:
        - 'null'
        - boolean
      department_ids:
        description: Ids of the departments this user is assigned to. Used to scope future job permissions and to filter the user list by department. Empty when the user is not pinned to any department.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - integer
      emails:
        description: All email addresses on the user's account, including the primary address and any additional verified addresses.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - string
      employee_id:
        description: Partner-supplied external employee identifier, typically the user's HRIS or payroll id. Free-form string; not unique across organizations and `null` when no employee id has been set.
        type:
        - 'null'
        - string
      first_name:
        type:
        - 'null'
        - string
      id:
        type:
        - 'null'
        - integer
      interviewer_tags:
        description: "Interviewer tags applied to this user \u2014 the labeled skill or panel groupings (e.g. `Senior Engineer`, `Bar Raiser`) used to suggest qualified interviewers when building an interview plan. Each entry pairs the tag's `id` with its `name`."
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - object
          properties:
            id:
              type:
              - 'null'
              - integer
            name:
              type:
              - 'null'
              - string
      job_title:
        description: Free-form job title set on the user's Greenhouse profile (e.g. `Senior Recruiter`). Not synchronized with any HRIS title.
        type:
        - 'null'
        - string
      last_name:
        type:
        - 'null'
        - string
      linked_candidate_ids:
        description: Ids of candidate records linked to this user. Populated when an employee is represented by both a user record (for Greenhouse access) and a candidate record (for past or internal applications).
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - integer
      name:
        description: Concatenation of `first_name` and `last_name` rendered as a single display string. Provided for convenience; partners that need either component should read `first_name`/`last_name` directly.
        type:
        - 'null'
        - string
      office_ids:
        description: Ids of the offices this user is assigned to. Used to scope future job permissions and to filter the user list by office. Empty when the user is not pinned to any office.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - integer
      primary_email:
        description: Primary email address on the user's account. Sign-in identifier and the address Greenhouse uses for outbound mail; additional verified addresses are not surfaced here. Service accounts (integration/ISU users) have no email and are excluded from this endpoint by default; when included via `show_service_accounts=true`, their `primary_email` is an empty string.
        type:
        - 'null'
        - string
      site_admin:
        description: Whether the user holds the Site Admin role. Site admins have unrestricted access to every non-confidential job and to organization-level settings. Demote a site admin to a Basic user with `POST /v3/users/{id}/revoke_permissions`.
        type:
        - 'null'
        - boolean
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
  activity_feed:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      application_id:
        description: Id of the application this note is attached to, when the note was authored against a specific application (for example a stage transition or a feedback note). `null` for candidate-level notes that are not tied to any single application.
        type:
        - 'null'
        - integer
      body:
        description: Free-text body of the note. `@`-mentions are rendered as plain user names; use `body_with_tags` for the version that preserves mention markup. Newline characters are stored verbatim and rendered as line breaks in the Greenhouse UI.
        type:
        - 'null'
        - string
      body_with_tags:
        description: '`body` with `@`-mentions rendered as embedded user tags (e.g. `@[User Name](user:123)`) instead of plain user names, for partners that need to resolve mentioned users.'
        type:
        - 'null'
        - string
      candidate_id:
        description: Id of the candidate this note is attached to. Notes are always anchored to a candidate; `application_id` is an optional second anchor for application-scoped notes.
        type:
        - 'null'
        - integer
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      email_attachment_file_names:
        description: File names of attachments on the logged email, when the source captured them. Only populated when `type` is `EMAIL`.
        type:
        - 'null'
        - string
      email_cc:
        description: '`Cc` addresses on the logged email, one entry per recipient. Only populated when `type` is `EMAIL`.'
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - string
      email_from:
        description: Comma-separated list of `From` addresses on the logged email. Only populated when `type` is `EMAIL`.
        type:
        - 'null'
        - string
      email_to:
        description: Comma-separated list of `To` addresses on the logged email. Only populated when `type` is `EMAIL`.
        type:
        - 'null'
        - string
      id:
        type:
        - 'null'
        - integer
      import_hash:
        description: Stable de-duplication key set when the note was created by a bulk import or migration. `null` for notes authored through the UI or Harvest. Use it to detect re-runs of the same import.
        type:
        - 'null'
        - string
      subject:
        description: Subject line on the note. Always populated for `EMAIL` notes; usually `null` for other types.
        type:
        - 'null'
        - string
      type:
        description: Note classification. `NOTE` and `EMAIL` are user-authored candidate notes and logged emails; `ACTIVITY` covers system-generated activity feed entries plus partner-logged activities. Other values (`INTERVIEW`, `FEEDBACK`, `TOUCHPOINT`, `FOLLOW_UP`, `TAKE_HOME_TEST`, `LINKEDIN_NOTE`, `LINKEDIN_INMAIL`, `AVAILABILITY_REQUEST`, `FORM`, `MIGRATION_ERROR`) identify notes produced by specific Greenhouse features and are read-only via this API.
        type:
        - 'null'
        - string
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
      user_id:
        description: Id of the Greenhouse user who authored the note. `null` for notes generated by the system rather than a specific user.
        type:
        - 'null'
        - integer
      visibility:
        description: Who can see this note. `publicly_visible` is visible to anyone with access to the candidate, `privately_visible` is restricted to users with the "see private notes" permission, and `admin_only_visible` is restricted to Job Admins and Site Admins. Defaults to `admin_only_visible` on create.
        type:
        - 'null'
        - string
  approvals:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      approval_status:
        description: Denormalized terminal state of the flow, computed from the underlying approvers. `pending` while any group is still unresolved, `approved` once every group has reached its `approvals_required` threshold, `rejected` once any group has accumulated enough rejections to be unrecoverable. Updates to `sequential` and `replace_approver_groups` are only allowed while `pending`.
        type:
        - 'null'
        - string
      approval_type:
        description: What this flow approves. `open_job` gates opening the job for recruiting, `offer_job` gates allowing offers to be created on the job, and `offer_candidate` gates extending an individual offer to a candidate (one flow per offer, plus a prototype on the job).
        type:
        - 'null'
        - string
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      id:
        type:
        - 'null'
        - integer
      job_id:
        description: Id of the job (hiring plan) this approval flow belongs to. References a `/v3/jobs` row.
        type:
        - 'null'
        - integer
      offer_id:
        description: Id of the specific offer this approval flow gates. Set only for `offer_candidate` flows attached to a real offer; null on the `open_job` and `offer_job` flows (which gate the job itself), and null on the `offer_candidate` prototype flow that lives on the job before any offer is created.
        type:
        - 'null'
        - integer
      requested_by_id:
        description: "Id of the user who started the flow by requesting approvals (the V3 `request_approvals` endpoint, or the in-app \"Request Approval\" button). References a `/v3/users` row. Null until the flow has been started \u2014 approver groups exist but no emails have been sent."
        type:
        - 'null'
        - integer
      sequential:
        description: "When `true`, approver groups resolve one at a time in `sort_order` \u2014 only after the current group resolves as approved are the next group's approvers asked. When `false`, all groups are activated in parallel as soon as the flow is started."
        type:
        - 'null'
        - boolean
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
      version:
        description: Monotonically increasing revision counter for this approval flow. Job approval flows increment when system fields (e.g., department, requisition id, openings) or custom fields marked as triggering re-approval change after the flow has started. Use this together with an approver's `version_sent` to tell whether a pending approver is responding to the current version or a stale request. Offer approval flows attached to a specific `offer_id` are always version 1.
        type:
        - 'null'
        - integer
  disciplines:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      active:
        description: "`true` while the option is selectable. Set to `false` after deletion \u2014 historical selections on candidates, jobs, and offers are preserved so the value still resolves on existing records."
        type:
        - 'null'
        - boolean
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      custom_field_id:
        description: Id of the parent custom field this option belongs to. Only fields with `value_type` of `single_select` or `multi_select` carry options.
        type:
        - 'null'
        - integer
      external_id:
        description: Caller-supplied identifier from the partner's source system (typically an HRIS row id or legacy ATS id). Persisted verbatim as the column `offsite_hris_id` and not interpreted by Greenhouse.
        type:
        - 'null'
        - string
      id:
        type:
        - 'null'
        - integer
      name:
        description: Display label shown to recruiters and hiring managers in dropdowns (e.g. `Engineering`, `Bachelor's`, `Stanford University`). Unique among active options on the same parent custom field.
        type:
        - 'null'
        - string
      sort_order:
        description: Display position within the parent custom field's dropdown. Lower values render first; ties fall back to insertion order. Alias of `priority` in V1/V2.
        type:
        - 'null'
        - integer
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
