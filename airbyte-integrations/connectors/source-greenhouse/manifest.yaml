schemas:
  applications:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      agency_note_id:
        description: Id of the note created when the candidate was submitted by an agency, or `null` if the application did not come through an agency.
        type:
        - 'null'
        - integer
      answers:
        description: Free-text answers the candidate provided on the job post application form. Each entry pairs the question text with the candidate's answer.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - object
          properties:
            answer:
              description: Candidate's free-text answer to the question.
              type:
              - 'null'
              - string
            question:
              description: Application-form question the candidate answered.
              type:
              - 'null'
              - string
      candidate_id:
        description: Id of the candidate (person) this application belongs to.
        type:
        - 'null'
        - integer
      coordinator_id:
        description: Id of the user assigned as coordinator on the application's job, or `null` when unassigned.
        type:
        - 'null'
        - integer
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      custom_fields:
        description: Org-defined custom fields keyed by the field's `name_key`. Each value carries the field's display `name`, its `type`, and its `value`.
        type:
        - 'null'
        - object
        additionalProperties:
          type: object
          properties:
            name:
              type:
              - 'null'
              - string
            type:
              type:
              - 'null'
              - string
            value:
              type:
              - 'null'
              - string
              - number
              - integer
              - boolean
              - object
              - array
      id:
        type:
        - 'null'
        - integer
      job_id:
        description: Id of the job this application is on. `null` for jobless prospect applications.
        type:
        - 'null'
        - integer
      job_interview_stage_id:
        description: Id of the job interview stage definition (see `GET /v3/job_interview_stages`) the candidate is currently in for this application. `null` for prospect applications and applications in a terminal state.
        type:
        - 'null'
        - integer
      job_post_id:
        description: Id of the job post the candidate applied through, or `null` if the application was created internally rather than from a posted role.
        type:
        - 'null'
        - integer
      last_activity_at:
        description: Timestamp of the most recent activity on this application (notes, emails, stage changes, etc.), in ISO 8601.
        type:
        - 'null'
        - string
        format: date-time
      location_address:
        description: Free-form location string captured on the application (typically from the job post's location question).
        type:
        - 'null'
        - string
      needs_decision:
        description: '`true` when the application is waiting on a hiring-team decision (scorecard completion, advance/reject, etc.) in its current stage.'
        type:
        - 'null'
        - boolean
      prospect:
        description: '`true` for prospect applications (sourced candidates not yet attached to a single job), `false` for candidate applications on a specific job.'
        type:
        - 'null'
        - boolean
      prospective_job_ids:
        description: For prospect applications, the ids of jobs the prospect is being considered for. Empty for non-prospect applications and for jobless prospects.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - integer
      recruiter_id:
        description: Id of the user assigned as recruiter on the application's job, or `null` when unassigned.
        type:
        - 'null'
        - integer
      referrer_id:
        description: Id of the referrer who credited this application, or `null` if there was no referral. References a referrer, not a Greenhouse user.
        type:
        - 'null'
        - integer
      rejected_at:
        description: Timestamp the application was rejected, in ISO 8601. `null` for applications that have not been rejected.
        type:
        - 'null'
        - string
        format: date-time
      rejection_reason_id:
        description: Id of the rejection reason selected for the application. References a `/v3/rejection_reasons` row scoped to the organization. `null` when the application was rejected without a reason, or has not been rejected.
        type:
        - 'null'
        - integer
      source_id:
        description: Id of the source the application is attributed to (e.g. a job board, an event, an employee referral source). `null` if no source is set.
        type:
        - 'null'
        - integer
      stage_id:
        description: Id of the interview stage the candidate is currently in for this application. `null` for prospect applications and applications in a terminal state.
        type:
        - 'null'
        - integer
      stage_name:
        description: Display name of the candidate's current interview stage on this application.
        type:
        - 'null'
        - string
      status:
        description: Lifecycle status of the application. `in_process` for active candidates, `rejected` for rejected applications, `hired` once an offer is closed and the hire endpoint has fired, and `converted` for prospect applications that have been promoted to a candidate application via `convert_to_candidate`.
        type:
        - 'null'
        - string
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
  candidates:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      addresses:
        description: Postal addresses on the candidate's profile. Each entry pairs the `value` with a `type` such as `home`, `work`, or `other`.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - object
          properties:
            type:
              type:
              - 'null'
              - string
            value:
              type:
              - 'null'
              - string
      can_email:
        description: Whether this candidate has consented to receive email communication from your organization.
        type:
        - 'null'
        - boolean
      company:
        description: Candidate's current company, as entered on their profile.
        type:
        - 'null'
        - string
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      custom_fields:
        description: Org-defined custom fields keyed by the field's `name_key`. Each value carries the field's display `name`, its `type`, and its `value`.
        type:
        - 'null'
        - object
        additionalProperties:
          type: object
          properties:
            name:
              type:
              - 'null'
              - string
            type:
              type:
              - 'null'
              - string
            value:
              type:
              - 'null'
              - string
              - number
              - integer
              - boolean
              - object
              - array
      email_addresses:
        description: Email addresses on the candidate's profile. Each entry pairs the `value` with a `type` such as `personal`, `work`, or `other`.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - object
          properties:
            type:
              type:
              - 'null'
              - string
            value:
              type:
              - 'null'
              - string
      first_name:
        type:
        - 'null'
        - string
      id:
        type:
        - 'null'
        - integer
      last_activity_at:
        description: Timestamp of the most recent activity on any of the candidate's applications (notes, emails, stage changes, etc.), in ISO 8601.
        type:
        - 'null'
        - string
        format: date-time
      last_name:
        type:
        - 'null'
        - string
      linked_user_ids:
        description: Ids of Greenhouse users linked to this candidate (employees represented by both a user record and a candidate record).
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - integer
      phone_numbers:
        description: Phone numbers on the candidate's profile. Each entry pairs the `value` with a `type` such as `mobile`, `home`, `work`, `skype`, or `other`.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - object
          properties:
            type:
              type:
              - 'null'
              - string
            value:
              type:
              - 'null'
              - string
      preferred_name:
        description: Preferred or chosen name the candidate goes by, when different from their legal first name.
        type:
        - 'null'
        - string
      private:
        description: If true, the candidate is restricted to users with `View Private Candidates` access. Defaults to `false`.
        type:
        - 'null'
        - boolean
      social_media_addresses:
        description: "Social media handles or URLs on the candidate's profile. Social entries are untyped \u2014 only the `value` is returned."
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - object
          properties:
            value:
              type:
              - 'null'
              - string
      tags:
        description: Candidate tag names applied to this candidate within your organization.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - string
      time_zone:
        description: Candidate's time zone as a Rails-style identifier (for example `Eastern Time (US & Canada)`).
        type:
        - 'null'
        - string
      title:
        description: Candidate's current job title, as entered on their profile.
        type:
        - 'null'
        - string
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
      website_addresses:
        description: Personal websites or portfolio URLs on the candidate's profile. Each entry pairs the `value` with a `type` such as `personal`, `company`, `portfolio`, `blog`, or `other`.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - object
          properties:
            type:
              type:
              - 'null'
              - string
            value:
              type:
              - 'null'
              - string
  close_reasons:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      id:
        type:
        - 'null'
        - integer
      name:
        description: Display label shown to recruiters and hiring managers when closing an opening (e.g. `Hire - New Headcount`, `Hire - Backfill`, `On Hold`, `Not Filling`). Unique within the organization. Names that start with `Hire -` are treated as hire outcomes in Greenhouse reporting; other names are non-hire outcomes. Free-text, since each organization customizes its own list under Configure > Custom Options > Close Reasons for Job Openings.
        type:
        - 'null'
        - string
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
  custom_fields:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      active:
        description: "`true` when the field is in use; `false` after archival. Archived fields are still returned by default \u2014 pass `active=true` on `/v3/custom_fields` to filter to live fields only."
        type:
        - 'null'
        - boolean
      api_only:
        description: "Job fields only. If `true`, the field can only be edited through Harvest API calls \u2014 the UI renders it read-only. Mutually exclusive with `required`."
        type:
        - 'null'
        - boolean
      application_type:
        description: 'Application fields only. Restricts which applications the field appears on: `all_applications`, `candidate_applications` (applicants), or `prospect_applications`. `null` for non-application fields.'
        type:
        - 'null'
        - string
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      default_value:
        description: Default value applied when a new parent record is created without an explicit value for this field. Shape varies by `value_type` (string for text/url, number for currency/number, option id for single_select, ISO 8601 for date).
        type:
        - 'null'
        - object
        - string
        - number
        - boolean
      description:
        description: Helper text shown beneath the field label in the UI. Plain text, no markup.
        type:
        - 'null'
        - string
      expose_in_job_board_api:
        description: Job fields only. If `true`, the field's value is exposed on the public Job Board API alongside the job listing.
        type:
        - 'null'
        - boolean
      field_type:
        description: Resource this field attaches to. Drives which create/update request shape applies and which endpoints accept the field as a `custom_fields` value (e.g. `job` fields appear on `/v3/jobs`, `candidate` fields on `/v3/candidates`).
        type:
        - 'null'
        - string
      id:
        type:
        - 'null'
        - integer
      internal_type:
        description: Greenhouse-managed semantic role for system-supplied fields (`employment_type`, `offer_documents`, `start_date`, `school_name`, `degree`, `discipline`, `offer_opening`). `null` for org-defined custom fields.
        type:
        - 'null'
        - string
      name:
        description: Human-readable label shown to recruiters and hiring managers (e.g. `Cost Center`, `Start Date`). Unique among active fields of the same `field_type`.
        type:
        - 'null'
        - string
      name_key:
        description: "Stable lowercase identifier derived from `name` (e.g. `Cost Center` \u2192 `cost_center`). Use this \u2014 not `id` \u2014 as the canonical key when setting values via `custom_fields` on `/v3/jobs`, `/v3/offers`, `/v3/candidates`, and similar write endpoints."
        type:
        - 'null'
        - string
      placeholder:
        description: Greyed-out hint text shown inside an empty field input in the UI.
        type:
        - 'null'
        - string
      private:
        description: If `true`, only users granted the matching `View Private` permission can see or edit this field's values.
        type:
        - 'null'
        - boolean
      require_approval:
        description: Job and opening fields only. If `true`, edits to this field's value route through the job's approval workflow before taking effect.
        type:
        - 'null'
        - boolean
      required:
        description: If `true`, a value must be supplied before the parent resource (job, offer, application, etc.) can be saved through the UI. The API still accepts blank values; enforcement happens at the form layer.
        type:
        - 'null'
        - boolean
      sort_order:
        description: Display priority within the field group on this `field_type`. Lower values render first; alias of `priority` in V1/V2.
        type:
        - 'null'
        - integer
      template_token_string:
        description: Merge token usable in offer letter templates (e.g. `{{CUSTOM_FIELD_NAME}}`). Returned for offer fields configured with a token; `null` otherwise.
        type:
        - 'null'
        - string
      trigger_new_version:
        description: Offer fields only. If `true`, changing this field's value on an existing offer creates a new offer version rather than mutating the current one in place.
        type:
        - 'null'
        - boolean
      updated_at:
        type:
