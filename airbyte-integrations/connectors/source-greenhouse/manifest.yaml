        - 'null'
        - string
        format: date-time
  eeoc:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      application_id:
        description: Id of the application this EEOC response is attached to. Each application has at most one EEOC response.
        type:
        - 'null'
        - integer
      candidate_id:
        description: "Id of the candidate (person) who submitted this response \u2014 the application's owner."
        type:
        - 'null'
        - integer
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      disability_status:
        description: Self-identified disability status under Section 503. `id` and `description` are `null` when the candidate skipped the question. The fixed enum values for `description` are `Yes, I have a disability, or have had one in the past`, `No, I do not have a disability and have not had one in the past`, and `I do not want to answer`.
        type:
        - 'null'
        - object
        properties:
          description:
            type:
            - 'null'
            - string
          id:
            type:
            - 'null'
            - integer
      gender:
        description: Self-identified gender. `id` and `description` are `null` when the candidate skipped the question. The fixed enum values for `description` are `Male`, `Female`, and `Decline To Self Identify`.
        type:
        - 'null'
        - object
        properties:
          description:
            type:
            - 'null'
            - string
          id:
            type:
            - 'null'
            - integer
      id:
        type:
        - 'null'
        - integer
      race:
        description: Self-identified race or ethnicity. `id` and `description` are `null` when the candidate skipped the question. The fixed enum values for `description` are `American Indian or Alaskan Native`, `Asian`, `Black or African American`, `Hispanic or Latino`, `White`, `Native Hawaiian or Other Pacific Islander`, `Two or More Races`, and `Decline To Self Identify`.
        type:
        - 'null'
        - object
        properties:
          description:
            type:
            - 'null'
            - string
          id:
            type:
            - 'null'
            - integer
      submitted_at:
        description: Timestamp the candidate submitted the EEOC questionnaire, in ISO 8601. `null` while the questionnaire has been requested but not yet responded to.
        type:
        - 'null'
        - string
        format: date-time
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
      veteran_status:
        description: Self-identified protected-veteran status under VEVRAA. `id` and `description` are `null` when the candidate skipped the question. The fixed enum values for `description` are `I am not a protected veteran`, `I identify as one or more of the classifications of a protected veteran`, and `I don't wish to answer`.
        type:
        - 'null'
        - object
        properties:
          description:
            type:
            - 'null'
            - string
          id:
            type:
            - 'null'
            - integer
  email_templates:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      body:
        description: "Plain-text body of the template, returned for templates whose notification type is plain text (e.g. `interviewer_invite`, `esignature_request`). `null` for HTML templates \u2014 see `html_body` instead. May contain merge tokens that are substituted at send time."
        type:
        - 'null'
        - string
      cc_coordinator:
        description: If `true`, the candidate's job coordinator is added to the `cc` list every time the template is sent, in addition to `recipients`.
        type:
        - 'null'
        - boolean
      cc_recruiter:
        description: If `true`, the candidate's job recruiter is added to the `cc` list every time the template is sent, in addition to `recipients`.
        type:
        - 'null'
        - boolean
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      default:
        description: If `true`, this template is the organization's default for its `email_type` and is preselected in any workflow that auto-attaches a template (e.g. candidate auto-replies, scorecard reminders). At most one template per `email_type` can be the default.
        type:
        - 'null'
        - boolean
      description:
        description: Internal note explaining when to use the template, shown to recruiters underneath the template name in the configuration UI. Plain text, not sent to candidates.
        type:
        - 'null'
        - string
      email_type:
        description: Notification category that determines where the template is offered in the UI and which merge tokens are valid. Values include `candidate_email`, `candidate_rejection`, `interviewer_invite`, `scorecard_reminder`, `extending_offer`, `candidate_auto_reply`, and the other entries of this enum. `none` marks a custom, uncategorized template.
        type:
        - 'null'
        - string
      from_type:
        description: How the sender's address is resolved at send time. `user_email` uses a shared communal email address configured on the template, `organization_email` uses one of the org's verified global addresses, `my_email_address` substitutes the sending user's address, `inviter` is used for welcome emails (resolves to the user inviting the new user), `organizer` is used for scorecard reminders (resolves to the interview organizer), and `not_applicable` is reserved for `interviewer_invite` and `esignature_request` templates that are sent from external services.
        type:
        - 'null'
        - string
      html_body:
        description: "HTML body of the template, returned for templates whose notification type is HTML (most candidate-facing types \u2014 see `NotificationType`). `null` for plain-text templates \u2014 see `body` instead. Sanitized server-side; may contain merge tokens substituted at send time."
        type:
        - 'null'
        - string
      id:
        type:
        - 'null'
        - integer
      name:
        description: Recruiter-facing label identifying the template in `Send email` dropdowns (e.g. `Reject - Phone Screen`, `Offer - Engineering`). Unique among active templates of the same `email_type` within the same owner scope.
        type:
        - 'null'
        - string
      office_anywhere:
        description: If `true`, the template is available to hiring plans for any office. If `false`, the template is scoped to a specific subset of offices configured on the template. `null` for legacy templates predating office scoping.
        type:
        - 'null'
        - boolean
      recipients:
        description: "Comma-separated list of additional email addresses that are CC'd on every send. `null` when no extra recipients are configured. Used in addition to \u2014 not instead of \u2014 `cc_recruiter` and `cc_coordinator`."
        type:
        - 'null'
        - string
      subject:
        description: Subject line sent on the email. May contain merge tokens (e.g. `{{CANDIDATE_FIRST_NAME}}`) that are substituted with live values at send time.
        type:
        - 'null'
        - string
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
      user_id:
        description: Id of the Greenhouse user who owns this personal template. `null` for organization-wide templates, which are owned by the organization and available to every user who can send the template's `email_type`.
        type:
        - 'null'
        - integer
  offices:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      external_id:
        description: Stable identifier supplied by the customer or HRIS for cross-system reconciliation. `null` when no external id has been set. Available when the `org_structure_external_id` product flag is enabled.
        type:
        - 'null'
        - string
      id:
        type:
        - 'null'
        - integer
      location:
        description: Free-form physical location string for the office (e.g. `New York, NY, USA`). `null` for offices that have no location set, including most remote offices.
        type:
        - 'null'
        - string
      name:
        description: Display name of the office (e.g. `San Francisco`, `Remote (US)`). Unique among active offices in the same organization.
        type:
        - 'null'
        - string
      parent_id:
        description: Id of the parent office when offices are organized hierarchically. `null` for top-level offices. References another `/v3/offices` row in the same organization.
        type:
        - 'null'
        - integer
      primary_in_house_contact_user_id:
        description: Id of the Greenhouse user designated as the office's primary internal contact, typically the local recruiting lead. References a `/v3/users` row. `null` when no contact has been assigned.
        type:
        - 'null'
        - integer
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
  prospect_pools:
    type:
    - 'null'
    - object
    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
