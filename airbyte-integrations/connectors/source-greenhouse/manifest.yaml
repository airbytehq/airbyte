      department_ids:
        description: Ids of departments this pool is restricted to. Empty when the pool is not restricted by department; combined with `office_ids` and `job_ids`, an empty array on all three means the pool is unrestricted (available org-wide).
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - integer
      description:
        description: Free-text purpose statement set by the organization (max 500 characters). `null` when no description has been set.
        type:
        - 'null'
        - string
      id:
        type:
        - 'null'
        - integer
      job_ids:
        description: Ids of jobs this pool is restricted to. Empty when the pool is not restricted by job.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - integer
      name:
        description: Name of the prospect pool, unique within the organization (case-insensitive).
        type:
        - 'null'
        - string
      office_ids:
        description: Ids of offices this pool is restricted to. Empty when the pool is not restricted by office.
        type:
        - 'null'
        - array
        items:
          type:
          - 'null'
          - integer
      updated_at:
        type:
        - 'null'
        - string
        format: date-time
  tags:
    type:
    - 'null'
