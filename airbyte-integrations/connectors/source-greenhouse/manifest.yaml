    $schema: https://json-schema.org/draft-07/schema
    additionalProperties: true
    properties:
      automated:
        description: When `true`, the permission was created by an automated permission rule (e.g. a `future_job_permission` that matched the job when it was opened, or an automated permission policy) rather than assigned by hand.
        type:
        - 'null'
        - boolean
      created_at:
        type:
        - 'null'
        - string
        format: date-time
      id:
        type:
        - 'null'
        - integer
      job_id:
        description: Id of the job this permission grants the user access to. References a `/v3/jobs` row.
        type:
        - 'null'
        - integer
      role_id:
        description: 'Id of the Job Admin role the user holds on this job. References a `/v3/user_roles` row; only roles with `role_type: job_admin` can be granted through this resource.'
        type:
        - 'null'
        - integer
