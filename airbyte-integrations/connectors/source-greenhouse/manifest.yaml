        - 'null'
        - object
        additionalProperties:
          type: object
          properties:
            name:
              type:
              - 'null'
              - string
            type:
              type:
              - 'null'
              - string
            value:
              type:
              - 'null'
              - string
              - number
              - integer
              - boolean
              - object
              - array
      id:
        type:
        - 'null'
        - integer
      job_id:
