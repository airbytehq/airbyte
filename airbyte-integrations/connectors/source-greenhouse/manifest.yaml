  default_concurrency: "{{ config.get('num_workers', 2) }}"
  max_concurrency: 8

# Greenhouse publishes no v3 rate-limit ceiling; limits differ between custom and
# partner integrations and must be read from X-RateLimit-Limit response headers.
# 50 requests per 30 seconds is a deliberate undershoot of the only published
# figure (X-RateLimit-Limit: 75); raising it requires an observed header value.
api_budget:
  type: HTTPAPIBudget
  ratelimit_reset_header: X-RateLimit-Reset
  ratelimit_remaining_header: X-RateLimit-Remaining
  status_codes_for_ratelimit_hit: [429]
  policies:
    - type: FixedWindowCallRatePolicy
      call_limit: 50
      period: PT30S
      matchers: []

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - credentials
    properties:
      credentials:
        title: Authentication
        type: object
        order: 0
        oneOf:
          - title: OAuth
            description: Click Authenticate and approve the Greenhouse consent flow as a Site Admin. Airbyte connects through its registered Greenhouse partner application and manages the access and refresh tokens for you; you don't need Greenhouse OAuth credentials of your own.
            type: object
            required:
              - auth_type
              - client_id
              - client_secret
              - refresh_token
            properties:
              auth_type:
                type: string
                const: Client
                order: 0
              client_id:
                type: string
                title: OAuth client ID
                description: Populated automatically by Airbyte from its registered Greenhouse partner application when you authorize above. Greenhouse issues Harvest v3 OAuth credentials only to partners, so you don't need to request or enter one.
                airbyte_secret: true
                order: 1
              client_secret:
                type: string
                title: OAuth client secret
                description: Populated automatically by Airbyte from its registered Greenhouse partner application when you authorize above. Greenhouse issues Harvest v3 OAuth credentials only to partners, so you don't need to request or enter one.
                airbyte_secret: true
                order: 2
              refresh_token:
                type: string
                title: Refresh token
                description: The refresh token obtained from the Greenhouse authorization code exchange. Populated automatically when you authorize above.
                order: 3
                airbyte_secret: true
              access_token:
                type: string
                title: Access token
                airbyte_secret: true
                order: 4
              token_expiry_date:
                type: string
                title: Token expiry date
                format: date-time
                order: 5
      start_date:
        type: string
        title: Start date
        description: >-
          UTC date and time in the format YYYY-MM-DDTHH:MM:SSZ. Records updated
          before this date will not be replicated. If omitted, the connector
          replicates all history.
        format: date-time
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        examples:
          - "2024-01-01T00:00:00Z"
        order: 1
      num_workers:
        type: integer
        title: Number of concurrent threads
        description: >-
          The number of worker threads to use for syncing. Greenhouse publishes no
          Harvest v3 rate-limit ceiling, so the default is conservative and all
          threads share a single budget. Increase this only if your Greenhouse
          account can support higher API usage, or lower it if you see rate-limit
          errors.
        minimum: 1
        maximum: 8
        default: 2
        examples:
          - 1
          - 2
          - 3
        order: 2
    additionalProperties: true
  advanced_auth:
    auth_flow_type: oauth2.0
    predicate_key:
      - credentials
      - auth_type
    predicate_value: Client
    oauth_config_specification:
      oauth_connector_input_specification:
        consent_url: >-
          https://auth.greenhouse.io/authorize?client_id={{client_id_value}}&redirect_uri={{redirect_uri_value}}&response_type=code&state={{state_value}}&{{scopes_param}}
        scope: >-
          harvest:applications:list harvest:approval_flows:list harvest:candidate_tags:list harvest:candidates:list harvest:close_reasons:list harvest:custom_field_options:list harvest:custom_fields:list harvest:demographic_answer_options:list harvest:demographic_answers:list harvest:demographic_question_sets:list harvest:demographic_questions:list harvest:departments:list harvest:eeoc:list harvest:email_templates:list harvest:interviews:list harvest:job_interview_stages:list harvest:job_posts:list harvest:jobs:list harvest:notes:list harvest:offers:list harvest:offices:list harvest:openings:list harvest:prospect_pools:list harvest:rejection_reasons:list harvest:scorecards:list harvest:sources:list harvest:user_job_permissions:list harvest:user_roles:list harvest:users:list
        access_token_url: https://auth.greenhouse.io/token
        access_token_headers:
          Authorization: "Basic {{ (client_id_value ~ ':' ~ client_secret_value) | b64encode }}"
          Content-Type: application/x-www-form-urlencoded
        access_token_params:
          grant_type: authorization_code
          code: "{{ auth_code_value }}"
          redirect_uri: "{{ redirect_uri_value }}"
        extract_output:
          - access_token
          - refresh_token
          - expires_at
      complete_oauth_output_specification:
        required:
          - refresh_token
        properties:
          refresh_token:
            type: string
            path_in_connector_config:
              - credentials
              - refresh_token
          access_token:
            type: string
            path_in_connector_config:
              - credentials
              - access_token
          expires_at:
            type: string
            format: date-time
            path_in_connector_config:
              - credentials
              - token_expiry_date
      complete_oauth_server_input_specification:
        required:
          - client_id
          - client_secret
        properties:
          client_id:
            type: string
          client_secret:
            type: string
      complete_oauth_server_output_specification:
        required:
          - client_id
          - client_secret
        properties:
          client_id:
            type: string
            path_in_connector_config:
              - credentials
              - client_id
          client_secret:
            type: string
            path_in_connector_config:
              - credentials
              - client_secret

