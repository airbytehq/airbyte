version: 7.25.1

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - users

definitions:
  error_handler:
    type: DefaultErrorHandler
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
        max_waiting_time_in_seconds: 300
    response_filters:
      - type: HttpResponseFilter
        http_codes:
          - 401
        action: REFRESH_TOKEN_THEN_RETRY
      - type: HttpResponseFilter
        http_codes:
          - 403
        action: FAIL
        failure_type: config_error
        error_message: "Harvest v3 list endpoint denied: missing OAuth scope or authorizing user is not a Site Admin."
      - type: HttpResponseFilter
        http_codes:
          - 422
        action: FAIL
        failure_type: system_error
        error_message: "Harvest v3 request is invalid: a cursor combined with other query parameters, an expired cursor, or per_page outside 1-500."
  # Substream parents are always read over full history: their children are
  # full-refresh streams whose coverage would otherwise be silently truncated by
  # the user's start_date.
  full_history_cursor:
    type: DatetimeBasedCursor
    cursor_field: updated_at
    cursor_datetime_formats:
      - "%Y-%m-%dT%H:%M:%S.%_msZ"
    datetime_format: "%Y-%m-%dT%H:%M:%S.%_msZ"
    start_datetime:
      type: MinMaxDatetime
      datetime: "1970-01-01T00:00:00Z"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
  streams:
    applications:
      type: DeclarativeStream
      state_migrations:
        - type: CustomStateMigration
          class_name: source_declarative_manifest.components.ApplicationCursorStateMigration
      name: applications
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          url: https://harvest.greenhouse.io/v3/applications
          http_method: GET
          request_parameters:
            per_page: "{{ 500 if not next_page_token }}"
            updated_at: "{{ 'gte|' ~ stream_interval['start_time'] ~ '|lte|' ~ stream_interval['end_time'] if not next_page_token }}"
          error_handler:
            $ref: "#/definitions/error_handler"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestPath
          pagination_strategy:
            type: CursorPagination
            cursor_value: "{{ headers['link']['next']['url'] }}"
            stop_condition: "{{ 'next' not in headers['link'] }}"
        decoder:
          type: JsonDecoder
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: updated_at
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%S.%_msZ"
        datetime_format: "%Y-%m-%dT%H:%M:%S.%_msZ"
        lookback_window: PT1H
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ config['start_date'] or '1970-01-01T00:00:00Z' }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/applications"
    candidates:
      type: DeclarativeStream
      name: candidates
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
