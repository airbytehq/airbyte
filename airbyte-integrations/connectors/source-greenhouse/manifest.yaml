        type:
        - 'null'
        - string
        format: date-time
      user_id:
        description: "Id of the user receiving access to the job. References a `/v3/users` row. Site admins are never represented here \u2014 they have implicit access to every non-confidential job \u2014 so a user with a site admin role will not appear in this list."
        type:
        - 'null'
        - integer
