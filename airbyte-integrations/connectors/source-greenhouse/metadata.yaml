data:
  ab_internal:
    ql: 200
    sl: 100
  allowedHosts:
    hosts:
      - harvest.greenhouse.io
      - auth.greenhouse.io
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.25.1@sha256:cdbd1578932d121f2852c065fbabebc49ccbf00078606dc503be5e4c66b373df
  connectorSubtype: api
  connectorType: source
  definitionId: 59f1e50a-331f-4f09-b3e8-2e8d4d355f44
  dockerImageTag: 1.0.0
  dockerRepository: airbyte/source-greenhouse
  documentationUrl: https://docs.airbyte.com/integrations/sources/greenhouse
  githubIssueLabel: source-greenhouse
  icon: greenhouse.svg
  license: ELv2
  maxSecondsBetweenMessages: 10
  name: Greenhouse
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-greenhouse
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  releases:
    breakingChanges:
      1.0.0:
        message: "This release migrates all Greenhouse streams from Harvest v1 to Harvest v3 and replaces API-key authentication with OAuth client credentials. Users must update their source configuration, refresh schemas, and reset affected streams. See the [Greenhouse migration guide](https://docs.airbyte.com/integrations/sources/greenhouse-migrations) for details."
        upgradeDeadline: "2026-08-31"
        deadlineAction: "disable"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - "applications"
              - "applications_demographics_answers"
              - "applications_interviews"
              - "candidates"
              - "close_reasons"
              - "custom_fields"
              - "degrees"
              - "demographics_answers"
              - "demographics_answer_options"
              - "demographics_questions"
              - "demographics_answers_answer_options"
              - "demographics_question_sets"
              - "demographics_question_sets_questions"
              - "departments"
              - "jobs"
              - "jobs_openings"
              - "interviews"
              - "job_posts"
              - "job_stages"
              - "jobs_stages"
              - "offers"
              - "rejection_reasons"
              - "scorecards"
              - "sources"
              - "users"
              - "activity_feed"
              - "approvals"
              - "disciplines"
              - "schools"
              - "eeoc"
              - "email_templates"
              - "offices"
              - "prospect_pools"
              - "tags"
              - "user_roles"
              - "user_permissions"
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
  supportLevel: community
  tags:
    - language:manifest-only
    - cdk:low-code
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: greenhouse_config_users_only_dev_null
          id: 2234aee5-c67b-48f7-8c6d-45a1e0303ea1
        - name: greenhouse_config_dev_null
          id: 2bcce6b2-2c89-46a4-9980-82a299266774
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-GREENHOUSE_USERS_ONLY__CREDS
          fileName: config_users_only.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE-GREENHOUSE__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: Greenhouse Harvest API
      url: https://harvestdocs.greenhouse.io/
      type: api_reference
    - title: Greenhouse authentication
      url: https://harvestdocs.greenhouse.io/docs/authentication
      type: authentication_guide
    - title: Greenhouse rate limits
      url: https://harvestdocs.greenhouse.io/docs/api-rate-limiting
      type: rate_limits
metadataSpecVersion: "1.0"
