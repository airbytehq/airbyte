# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-activecampaign:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
      - bypass_reason: "The GSM test config fails `check`: its account_username is a full hostname, so requests go to an invalid host (SSL hostname mismatch), and with the account name alone the ActiveCampaign API returns 402 Payment Required"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    bypass_reason: "The GSM test config fails `read`: its account_username is a full hostname, so requests go to an invalid host (SSL hostname mismatch), and with the account name alone the ActiveCampaign API returns 402 Payment Required"
