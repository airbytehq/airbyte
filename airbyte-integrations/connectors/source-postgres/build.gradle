plugins {
    id 'airbyte-bulk-connector'
    id "io.airbyte.gradle.docker"
    id 'airbyte-connector-docker-convention'
}

application {
    mainClass = 'io.airbyte.integrations.source.postgres.PostgresSource'
}

airbyteBulkConnector {
    core = 'extract'
    toolkits = ['extract-jdbc', 'extract-cdc', 'source-tests']
}

dependencies {
    implementation 'com.azure:azure-identity:1.17.0'
    // version specified by the debezium bom dependency in the cdc toolkit
    implementation 'io.debezium:debezium-connector-postgres'
    // Use Postgres JDBC driver version specified by Debezium
    implementation 'org.postgresql:postgresql'

    testImplementation("io.mockk:mockk:1.14.7")

    testFixturesImplementation 'org.testcontainers:postgresql:1.21.4'
    // Pin the published test fixtures at cdkVersion like every other CDK dependency. A project
    // reference here drags the local CDK into this connector's graph and, whenever the local CDK
    // version is newer than cdkVersion, Gradle substitutes it for the pinned artifacts.
    testFixturesImplementation testFixtures(
        airbyteBulkConnector.cdk == 'local'
            ? project(':airbyte-cdk:bulk:toolkits:bulk-cdk-toolkit-legacy-source-integration-tests')
            : "io.airbyte.bulk-cdk:bulk-cdk-toolkit-legacy-source-integration-tests:${airbyteBulkConnector.cdk}"
    )
}

configurations {
    integrationTestImplementation.extendsFrom testFixturesImplementation
}
