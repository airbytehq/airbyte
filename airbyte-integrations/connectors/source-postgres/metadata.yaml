data:
  ab_internal:
    ql: 400
    sl: 300
  allowedHosts:
    hosts:
      - ${host}
      - ${tunnel_method.tunnel_host}
  connectorSubtype: database
  connectorType: source
  definitionId: decd338e-5647-4c0b-adf4-da0e75f5a750
  dockerImageTag: 4.0.0
  dockerRepository: airbyte/source-postgres
  documentationUrl: https://docs.airbyte.com/integrations/sources/postgres
  githubIssueLabel: source-postgres
  icon: postgresql.svg
  license: ELv2
  maxSecondsBetweenMessages: 7200
  name: Postgres
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  supportLevel: certified
  tags:
    - language:java
  connectorBuildOptions:
    baseImage: docker.io/airbyte/java-connector-base:2.0.4@sha256:5f343797cfcf021ca98ba9bdf5970ef66cbf6222d8cc17b0d61d13860a5bcc2b
  connectorIPCOptions:
    dataChannel:
      version: "0.0.2"
      supportedSerialization: ["JSONL", "PROTOBUF"]
      supportedTransport: ["SOCKET", "STDIO"]
  connectorTestSuitesOptions:
    - suite: unitTests
    - suite: integrationTests
      testSecrets:
        - name: SECRET_SOURCE-POSTGRES_CDC__CREDS
          fileName: config_cdc.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE-POSTGRES__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE_POSTGRES_PERFORMANCE_TEST_CREDS
          fileName: performance-config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-POSTGRES_CDC__CREDS
          fileName: config_cdc.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE-POSTGRES__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
        - name: SECRET_SOURCE_POSTGRES_PERFORMANCE_TEST_CREDS
          fileName: performance-config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  releases:
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: slow
    breakingChanges:
      4.0.0:
        message:
          "**Version 4.0.0 corrects the discovered type of two kinds of user-defined type columns.
          Connections without such columns don't need to do anything.**

          **What changed:** a column whose type is a user-defined non-array type with a name
          starting with an underscore (for example `CREATE TYPE _status AS ENUM (...)`) is discovered
          as a string instead of an array; versions 3.8.0 to 3.8.6 synced it as null or failed CDC
          syncs. An array column whose element type is a user-defined or extension type in a schema
          that isn't on the search_path is discovered as an array again instead of a string, as in
          version 3.7.

          **What to do:** refresh the source schema of affected connections after upgrading. If a
          sync then fails because of the type change, refresh the affected streams. See the
          [migration guide](https://docs.airbyte.com/integrations/sources/postgres-migrations).
          "
        upgradeDeadline: "2026-12-01"
        deadlineAction: "auto_upgrade"
  externalDocumentationUrls:
    - title: PostgreSQL documentation
      url: https://www.postgresql.org/docs/
      type: api_reference
    - title: Release Notes
      url: https://www.postgresql.org/docs/release/
      type: api_release_history
    - title: PostgreSQL authentication
      url: https://www.postgresql.org/docs/current/auth-methods.html
      type: authentication_guide
    - title: PostgreSQL server source code
      url: https://github.com/postgres/postgres
      type: code_repository
metadataSpecVersion: "1.0"
