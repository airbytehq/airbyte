data:
  allowedHosts:
    hosts:
      - a.klaviyo.com
      - klaviyo.com
  connectorSubtype: api
  connectorType: source
  definitionId: 95e8cffd-b8c4-4039-968e-d32fb4a69bde
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.24.0@sha256:e34fb609bccdeb77474763c77e3621ea9d5adf9f65f2d9851102cc14a1caa281
  dockerImageTag: 3.0.1
  dockerRepository: airbyte/source-klaviyo
  githubIssueLabel: source-klaviyo
  icon: klaviyo.svg
  license: ELv2
  maxSecondsBetweenMessages: 60
  name: Klaviyo
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-klaviyo
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  suggestedStreams:
    streams:
      - events
      - campaigns
      - lists
      - metrics
      - flows
  releases:
    breakingChanges:
      3.0.0:
        message: "The 'flow_series_reports' stream now emits one record per calendar day instead of one record per request window. Every 'statistics' field changes from an array of daily values to a single number for that day, and 'date' is now the real day the row reports on rather than the end of the request window. Both 'flow_series_reports' and 'campaign_values_reports' now request whole calendar day periods ending on the last complete day, which changes the reporting periods previously written by 'campaign_values_reports', and its 'date' is now the midnight that closes the reported period instead of a timestamp inside it. Users must refresh the source schema and clear both streams after upgrading. See the [Klaviyo migration guide](https://docs.airbyte.com/integrations/sources/klaviyo-migrations#upgrading-to-300) for details."
        upgradeDeadline: "2026-08-31"
        deadlineAction: "disable"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - flow_series_reports
              - campaign_values_reports
      2.0.0:
        message: In this release, streams 'campaigns', 'email_templates', 'events', 'flows', 'global_exclusions', 'lists', and 'metrics' are now pulling data using latest API which has a different schema. Users will need to refresh the source schemas and reset these streams after upgrading.
        upgradeDeadline: "2023-11-30"
      1.0.0:
        message: In this release, for 'events' stream changed type of 'event_properties/items/quantity' field from integer to number. Users will need to refresh the source schema and reset events streams after upgrading.
        upgradeDeadline: "2023-11-30"
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
  documentationUrl: https://docs.airbyte.com/integrations/sources/klaviyo
  externalDocumentationUrls:
    - title: API versioning and deprecation policy
      url: https://developers.klaviyo.com/en/docs/api_versioning_and_deprecation_policy
      type: api_deprecations
    - title: Changelog
      url: https://developers.klaviyo.com/en/docs/changelog_
      type: api_release_history
    - title: Developer Group
      url: https://community.klaviyo.com/groups/developer-group-64
    - title: Klaviyo OpenAPI specification repository
      url: https://github.com/klaviyo/openapi
      type: spec_repository
  tags:
    - cdk:low-code
    - language:manifest-only
  ab_internal:
    sl: 300
    ql: 400
  supportLevel: certified
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: klaviyo_config_dev_null
          id: 7d2eeae8-62d9-4694-8bfa-46b96375cd2d
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-KLAVIYO__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
metadataSpecVersion: "1.0"
