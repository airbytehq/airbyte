[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-recurly-tests"
version = "0.0.0"
description = "Unit tests for source-recurly"
authors = ["Airbyte <contact@airbyte.io>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
airbyte-cdk = "7.47.0"
pytest = "^8"
pytest-cov = "^6"
freezegun = "^1"
requests-mock = "^1"
jsonschema = { version = "^4", extras = ["format"] }

[tool.pytest.ini_options]
addopts = "--cov --cov-config=pyproject.toml --cov-report=term-missing"
filterwarnings = [
    "ignore:This class is experimental*"
]

[tool.coverage.run]
include = ["*/source-recurly/components.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
