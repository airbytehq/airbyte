[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-recurly-tests"
version = "0.10.0-rc.1"
description = "Unit tests for source-recurly"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10,<3.13"
airbyte-cdk = "7.45.0"
pytest = "^8"
pytest-mock = "^3.6.1"
requests-mock = "^1.12.1"
jsonschema = {version = "^4", extras = ["format"]}

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This class is experimental*"
]
