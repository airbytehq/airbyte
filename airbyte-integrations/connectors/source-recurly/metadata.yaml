data:
  ab_internal:
    ql: 200
    sl: 100
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.45.0@sha256:a4947a37ef760ff501856dbeec22830826c1d214f0e530abfa9831e57f019809
  connectorSubtype: api
  connectorType: source
  definitionId: cd42861b-01fc-4658-a8ab-5d11d0510f01
  dockerImageTag: 2.0.0
  dockerRepository: airbyte/source-recurly
  documentationUrl: https://docs.airbyte.com/integrations/sources/recurly
  githubIssueLabel: source-recurly
  icon: recurly.svg
  license: ELv2
  name: Recurly
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releases:
    breakingChanges:
      2.0.0:
        message: >-
          The subscriptions.coupon_redemptions field is now an array instead of an object.
          The accounts.external_accounts[].created_at and updated_at,
          account_coupon_redemptions.coupon.redeem_by, coupons.redeem_by, and
          unique_coupons_parent.created_at and updated_at fields now use the date-time format.
          After upgrading, refresh the source schema for the affected streams.
          Reset or clear only affected streams whose destination cannot alter the column type.
          See https://docs.airbyte.com/integrations/sources/recurly-migrations#upgrading-to-200.
        upgradeDeadline: "2026-11-23"
        scopedImpact:
          - scopeType: stream
            impactedScopes:
              - subscriptions
              - accounts
              - account_coupon_redemptions
              - coupons
              - unique_coupons_parent
      1.0.0:
        message:
          Version 1.0.0 introduces a number of schema updates to the Recurly
          connector. To ensure a smooth upgrade, please refresh your schemas and reset
          your data before resuming syncs.
        upgradeDeadline: "2024-03-05"
  releaseStage: alpha
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-recurly
  supportLevel: community
  tags:
    - cdk:low-code
    - language:manifest-only
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: recurly_config_dev_null
          id: 33f9384f-dbd1-4f14-86b8-f20f7f0e140f
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-RECURLY__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: Recurly API reference
      url: https://developers.recurly.com/api/v2021-02-25/
      type: api_reference
    - title: Recurly authentication
      url: https://developers.recurly.com/api/v2021-02-25/#section/Authentication
      type: authentication_guide
    - title: Recurly rate limits
      url: https://developers.recurly.com/api/v2021-02-25/#section/Rate-Limits
      type: rate_limits
metadataSpecVersion: "1.0"
