data:
  ab_internal:
    ql: 200
    sl: 100
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.47.0@sha256:b2ecb78040d4c4b42fa3537488d68a3b195f64b5fefcbc48ac0591479591a3f0
  allowedHosts:
    hosts:
      - v3.recurly.com
  maxSecondsBetweenMessages: 3600
  suggestedStreams:
    streams:
      - accounts
      - subscriptions
      - invoices
      - transactions
      - line_items
      - plans
  connectorSubtype: api
  connectorType: source
  definitionId: cd42861b-01fc-4658-a8ab-5d11d0510f01
  dockerImageTag: 1.3.70
  dockerRepository: airbyte/source-recurly
  documentationUrl: https://docs.airbyte.com/integrations/sources/recurly
  githubIssueLabel: source-recurly
  icon: recurly.svg
  license: ELv2
  name: Recurly
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releases:
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      enableProgressiveRollout: true
    breakingChanges:
      1.0.0:
        message:
          Version 1.0.0 introduces a number of schema updates to the Recurly
          connector. To ensure a smooth upgrade, please refresh your schemas and reset
          your data before resuming syncs.
        upgradeDeadline: "2024-03-05"
  releaseStage: alpha
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-recurly
  supportLevel: community
  tags:
    - cdk:low-code
    - language:manifest-only
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: recurly_config_dev_null
          id: 33f9384f-dbd1-4f14-86b8-f20f7f0e140f
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-RECURLY__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  externalDocumentationUrls:
    - title: Recurly API reference
      url: https://recurly.com/developers/api/v2021-02-25/index.html
      type: api_reference
    - title: Recurly OpenAPI specification
      url: https://recurly.com/developers/api/spec/v2021-02-25.yaml
      type: openapi_spec
    - title: Recurly API keys
      url: https://docs.recurly.com/docs/api-keys
      type: authentication_guide
    - title: Recurly rate limits
      url: https://recurly.com/developers/api/v2021-02-25/index.html#section/Getting-Started/Limits
      type: rate_limits
    - title: Recurly OpenAPI spec repository
      url: https://github.com/recurly/recurly-client-python/tree/v3-v2021-02-25/openapi
      type: spec_repository
    - title: Recurly API changelog
      url: https://recurly.com/developers/api/changelog.html
      type: api_release_history
metadataSpecVersion: "1.0"
