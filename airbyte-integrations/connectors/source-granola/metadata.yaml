data:
  ab_internal:
    ql: 300
    sl: 200
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.33.0@sha256:3343cc05b79b9a3c07fa90152bd5348da7154b44f63521857bd2a745883d85cd
  connectorSubtype: api
  connectorType: source
  definitionId: 9023923c-002f-4131-9554-3ebdf56540a4
  dockerImageTag: 1.0.1
  dockerRepository: airbyte/source-granola
  documentationUrl: https://docs.airbyte.com/integrations/sources/granola
  githubIssueLabel: source-granola
  license: ELv2
  name: Granola
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: generally_available
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-granola
  maxSecondsBetweenMessages: 3600
  suggestedStreams:
    streams:
      - notes
      - detailed_notes
  supportLevel: certified
  tags:
    - cdk:low-code
    - language:manifest-only
  connectorTestSuitesOptions:
    - suite: unitTests
  allowedHosts:
    hosts:
      - public-api.granola.ai
  externalDocumentationUrls:
    - title: Granola Enterprise API documentation
      url: https://docs.granola.ai/introduction
      type: api_reference
  releases:
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
    breakingChanges:
      1.0.0:
        message: >-
          The `notes` stream now syncs incrementally on `updated_at` instead of `created_at` so edited notes are replicated.
          If you sync `notes` in Incremental Append mode, the first sync after upgrading appends a second copy of each note;
          see the migration guide before clearing the stream, as clearing can permanently remove deleted notes.
          Deduped and overwrite connections need no action.
          Migration guide: https://docs.airbyte.com/integrations/sources/granola-migrations#upgrading-to-100
        upgradeDeadline: "2026-11-02"
        deadlineAction: "auto_upgrade"
        scopedImpact:
          - scopeType: stream
            impactedScopes: ["notes"]
metadataSpecVersion: "1.0"
