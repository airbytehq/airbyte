data:
  ab_internal:
    ql: 100
    sl: 100
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.30.0@sha256:a249dd191ff2b4e5a7c6fd3749395d4a2f5beee988165ebabfacb17199e5b378
  connectorSubtype: api
  connectorType: source
  definitionId: 9023923c-002f-4131-9554-3ebdf56540a4
  dockerImageTag: 1.0.0
  dockerRepository: airbyte/source-granola
  documentationUrl: https://docs.airbyte.com/integrations/sources/granola
  githubIssueLabel: source-granola
  license: ELv2
  name: Granola
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: alpha
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-granola
  suggestedStreams:
    streams:
      - detailed_notes
  supportLevel: community
  tags:
    - cdk:low-code
    - language:manifest-only
  connectorTestSuitesOptions:
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-GRANOLA__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  allowedHosts:
    hosts:
      - public-api.granola.ai
  externalDocumentationUrls:
    - title: Granola Enterprise API documentation
      url: https://docs.granola.ai/introduction
      type: api_reference
  releases:
    rolloutConfiguration:
      enableProgressiveRollout: true
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
    breakingChanges:
      1.0.0:
        message: >-
          The `notes` stream now syncs incrementally on `updated_at` instead of `created_at` so edited notes are replicated.
          Existing connections must reset the `notes`, `detailed_notes`, and `note_transcripts` streams after upgrading.
          See the migration guide for details.
        upgradeDeadline: "2026-11-02"
        scopedImpact:
          - scopeType: stream
            impactedScopes: ["notes", "detailed_notes", "note_transcripts"]
metadataSpecVersion: "1.0"
