        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
        request_parameters:
          group_by: project_id,user_id,model
          bucket_width: 1d
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
          record_expander:
            type: RecordExpander
            on_no_records: skip
            remain_original_record: true
            expand_records_from_field:
              - results
    primary_key:
      - snapshot_date
      - project_id
      - user_id
      - model
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        required:
          - snapshot_date
          - project_id
          - user_id
          - model
          - start_time
        properties:
          model:
            type: string
          user_id:
            type: string
          end_time:
            type:
              - string
              - "null"
          project_id:
            type: string
          start_time:
            type: string
          snapshot_date:
            type: string
          num_model_requests:
            type:
              - number
              - "null"
          input_tokens:
            type:
              - number
              - "null"
          output_tokens:
            type:
              - number
              - "null"
          input_cached_tokens:
            type:
              - number
              - "null"
          input_audio_tokens:
            type:
              - number
              - "null"
          output_audio_tokens:
            type:
              - number
              - "null"
          api_key_id:
            type:
              - string
              - "null"
          batch:
            type:
              - boolean
              - "null"
        additionalProperties: true
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - start_time
            value: >-
              {{ record.get('start_time') or (record.get('original_record') or
              {}).get('start_time') }}
          - type: AddedFieldDefinition
            path:
              - end_time
            value: >-
              {{ record.get('end_time') or (record.get('original_record') or
              {}).get('end_time') }}
          - type: AddedFieldDefinition
            path:
              - snapshot_date
            value: >-
              {{ format_datetime((record.get('start_time') or
              (record.get('original_record') or {}).get('start_time')) | int,
              '%Y-%m-%d') }}
          - type: AddedFieldDefinition
            path:
              - project_id
            value: "{{ record.get('project_id') }}"
          - type: AddedFieldDefinition
            path:
              - model
            value: "{{ record.get('model') }}"
          - type: AddedFieldDefinition
            path:
              - user_id
            value: "{{ record.get('user_id') }}"
      - type: RemoveFields
        field_pointers:
          - - original_record
    incremental_sync:
      type: DatetimeBasedCursor
      step: P31D
      cursor_field: start_time
      end_datetime:
        type: MinMaxDatetime
        datetime: >-
          {{ format_datetime((config['end_time'] or
          today_utc().strftime('%Y-%m-%d')), '%s') }}
        datetime_format: "%s"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ format_datetime(config['start_time'], '%s') }}"
        datetime_format: "%s"
      datetime_format: "%s"
      end_time_option:
        type: RequestOption
        field_name: end_time
        inject_into: request_parameter
      start_time_option:
        type: RequestOption
        field_name: start_time
        inject_into: request_parameter
      cursor_granularity: PT1S
      cursor_datetime_formats:
        - "%s"
