      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - actor_type
            value: "{{ record.get('actor', {}).get('type') }}"
          - type: AddedFieldDefinition
            path:
              - actor_user_id
            value: "{{ record.get('actor', {}).get('user_id') }}"
          - type: AddedFieldDefinition
            path:
              - actor_user_email
            value: "{{ record.get('actor', {}).get('user_email') }}"
          - type: AddedFieldDefinition
            path:
              - principal_type
            value: "{{ record.get('principal', {}).get('type') }}"
          - type: AddedFieldDefinition
            path:
              - principal_id
            value: "{{ record.get('principal', {}).get('id') }}"
          - type: AddedFieldDefinition
            path:
              - log_file_id
            value: "{{ stream_partition.log_file_id }}"
          - type: AddedFieldDefinition
            path:
              - message_id
            value: "{{ record.get('message', {}).get('id') }}"
          - type: AddedFieldDefinition
            path:
              - message_created_at
            value: "{{ record.get('message', {}).get('created_at') }}"
          - type: AddedFieldDefinition
            path:
              - author_type
            value: "{{ record.get('message', {}).get('author', {}).get('type') }}"
          - type: AddedFieldDefinition
            path:
              - author_client_type
            value: >-
              {{ record.get('message', {}).get('author', {}).get('client_type')
              }}
          - type: AddedFieldDefinition
            path:
              - author_skills_used
            value: >-
              {{ record.get('message', {}).get('author', {}).get('skills_used')
              | string if record.get('message', {}).get('author',
              {}).get('skills_used') is not none else '' }}
            value_type: string
          - type: AddedFieldDefinition
            path:
              - author_tools_used
            value: >-
              {{ record.get('message', {}).get('author', {}).get('tools_used') |
              string if record.get('message', {}).get('author',
              {}).get('tools_used') is not none else '' }}
            value_type: string
          - type: AddedFieldDefinition
            path:
              - message_content_value
            value: >-
              {{ record.get('message', {}).get('content', {}).get('value') |
              string if record.get('message', {}).get('content', {}).get('value')
              is not none else '' }}
            value_type: string
          - type: AddedFieldDefinition
            path:
              - conversation_id
            value: "{{ record.get('conversation', {}).get('id') }}"
          - type: AddedFieldDefinition
            path:
              - conversation_title
            value: "{{ record.get('conversation', {}).get('title') }}"
          - type: AddedFieldDefinition
            path:
              - conversation_mode
            value: "{{ record.get('conversation', {}).get('mode') }}"
          - type: AddedFieldDefinition
            path:
              - conversation_created_at
            value: "{{ record.get('conversation', {}).get('created_at') }}"
          - type: AddedFieldDefinition
            path:
              - conversation_is_pinned
            value: "{{ record.get('conversation', {}).get('is_pinned') }}"
          - type: AddedFieldDefinition
            path:
              - conversation_is_temporary_chat
            value: >-
              {{ record.get('conversation', {}).get('is_temporary_chat') }}
          - type: AddedFieldDefinition
            path:
              - snapshot_date
            value: "{{ stream_slice.extra_fields.snapshot_date }}"
      - type: RemoveFields
        field_pointers:
          - - message
          - - conversation
          - - actor
          - - principal
          - - skills_used
          - - tools_used
    incremental_sync:
      type: DatetimeBasedCursor
      global_substream_cursor: true
      cursor_field: snapshot_date
      end_datetime:
        type: MinMaxDatetime
        datetime: >-
          {{ format_datetime((config['end_time'] if config['end_time'] else
          now_utc().strftime('%Y-%m-%d')), '%Y-%m-%dT%H:%M:%SZ') }}
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ format_datetime(config['start_time'], '%Y-%m-%dT%H:%M:%SZ') }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%SZ"
