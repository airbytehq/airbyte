        properties:
          id:
            type: string
          email:
            type:
              - string
              - "null"
          status:
            type:
              - string
              - "null"
          created_at:
            type:
              - number
              - "null"
          expires_at:
            type:
              - number
              - "null"
          accepted_at:
            type:
              - number
              - "null"
        additionalProperties: true
  - type: DeclarativeStream
    name: completions
    retriever:
      type: SimpleRetriever
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: limit
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: page
          inject_into: request_parameter
        pagination_strategy:
          type: CursorPagination
          page_size: 31
          cursor_value: "{{ response.next_page }}"
          stop_condition: "{{ response.has_more is false }}"
      requester:
        type: HttpRequester
        url: https://api.openai.com/v1/organization/usage/completions
