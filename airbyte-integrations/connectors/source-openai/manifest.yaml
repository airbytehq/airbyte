        url: >-
          https://api.chatgpt.com/v1/compliance/workspaces/{{
          config['workspace_id'] }}/users
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/ComplianceAuthenticator"
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
    primary_key: id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        required:
          - id
        properties:
          id:
            type: string
          name:
            type:
              - string
              - "null"
          role:
            type:
              - string
              - "null"
          email:
            type:
              - string
              - "null"
          object:
            type:
              - string
              - "null"
          status:
            type:
              - string
              - "null"
          created_at:
            type:
              - number
              - "null"
          is_scim_managed:
            type:
              - boolean
              - "null"
        additionalProperties: true

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - openai_organization
      - openai_token
      - start_time
    properties:
      end_time:
        type: string
        description: >-
          The end time for querying the API in YYYY-MM-DD (defaults to today if
          omitted). The end date is exclusive at midnight UTC, so the current
          calendar day is not included until the next sync after that day ends.
        format: date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        order: 3
        title: End Time
      start_time:
        type: string
        description: The start time for querying the API in YYYY-MM-DD
        format: date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        order: 2
        title: Start time
      openai_token:
        type: string
        description: The API key token used for authorizing API requests
        order: 1
        title: OpenAI-token
        airbyte_secret: true
      workspace_id:
        type: string
        description: >-
          ChatGPT workspace ID. Required for compliance streams
          (conversation_messages, conversation_messages_log, current_users,
          historical_users). The connection check does not validate this field.
        order: 5
        title: Workspace ID
      openai_organization:
        type: string
        description: The organization (organization_id) associated with the request
        order: 0
        title: OpenAI-Organization
      openai_compliance_token:
        type: string
        description: >-
          API token for ChatGPT compliance and workspace management endpoints.
          Required for compliance streams (conversation_messages,
          conversation_messages_log, current_users, historical_users). The
          connection check only reads the users stream, so an invalid compliance
          token is reported when those streams sync, not during setup test.
        order: 4
        title: OpenAI-compliance-token
        airbyte_secret: true
