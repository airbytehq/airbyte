version: 7.28.2

type: DeclarativeSource

description: >-
  OpenAI organization and ChatGPT Enterprise compliance source. Syncs
  organization members and pending invites from the OpenAI Admin API, daily
  completion usage aggregated by project, user, and model, and ChatGPT workspace
  user rosters (current and historical). For Enterprise workspaces, also syncs
  compliance conversation log metadata and message-level events from JSONL
  export files. Requires an OpenAI organization API key with admin access.
  ChatGPT Enterprise compliance streams also need a compliance API token and
  workspace ID. Supports incremental sync on
  usage and compliance log streams using a configurable start and end date
  (YYYY-MM-DD).

check:
  type: CheckStream
  stream_names:
    - users

definitions:
  streams:
    conversation_messages:
      type: DeclarativeStream
      name: conversation_messages
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: request_parameter
          pagination_strategy:
            type: CursorPagination
            page_size: 100
            cursor_value: "{{ response.last_end_time }}"
            stop_condition: "{{ response.has_more is false or not response.last_end_time }}"
        requester:
          type: HttpRequester
          url: >-
            https://api.chatgpt.com/v1/compliance/workspaces/{{
            config['workspace_id'] }}/logs
          http_method: GET
          authenticator:
            $ref: "#/definitions/linked/ComplianceAuthenticator"
          error_handler:
            $ref: "#/definitions/linked/HttpRequester/error_handler"
          request_parameters:
            after: >-
              {{ next_page_token['next_page_token'] if next_page_token else
              stream_interval['start_time'] }}
            event_type: CONVERSATION_MESSAGE
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - data
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          type: object
          $schema: http://json-schema.org/schema#
          required:
            - id
            - snapshot_date
          properties:
            id:
              type: string
            end_time:
              type:
                - string
                - "null"
            file_name:
              type:
                - string
                - "null"
            file_size:
              type:
                - number
                - "null"
            event_type:
              type:
                - string
                - "null"
            file_sha256:
              type:
                - string
                - "null"
            snapshot_date:
              type: string
          additionalProperties: true
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path:
                - snapshot_date
              value: "{{ stream_interval['start_time'] }}"
              value_type: string
      incremental_sync:
        type: DatetimeBasedCursor
        step: P1D
        cursor_field: snapshot_date
        end_datetime:
          type: MinMaxDatetime
          datetime: >-
            {{ format_datetime((config['end_time'] if config['end_time'] else
            now_utc().strftime('%Y-%m-%d')), '%Y-%m-%dT%H:%M:%SZ') }}
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        start_datetime:
          type: MinMaxDatetime
          datetime: "{{ format_datetime(config['start_time'], '%Y-%m-%dT%H:%M:%SZ') }}"
          datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
        end_time_option:
          type: RequestOption
          field_name: before
          inject_into: request_parameter
        cursor_granularity: PT1S
        cursor_datetime_formats:
          - "%Y-%m-%dT%H:%M:%SZ"
          - "%Y-%m-%dT%H:%M:%S.%fZ"
  linked:
    HttpRequester:
      authenticator:
        type: BearerAuthenticator
        api_token: "{{ config['openai_token'] }}"
      error_handler:
        type: DefaultErrorHandler
        max_retries: 5
        response_filters:
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 429
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 500
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 502
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 503
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 504
        backoff_strategies:
          - type: ExponentialBackoffStrategy
            factor: 5
      request_headers:
        Content-Type: application/json
        OpenAI-Organization: "{{ config['openai_organization'] }}"
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: limit
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: after
          inject_into: request_parameter
        pagination_strategy:
          type: CursorPagination
          page_size: 20
          cursor_value: "{{ response.last_id }}"
          stop_condition: "{{ response.has_more is false }}"
    CompliancePaginator:
      type: DefaultPaginator
      page_size_option:
        type: RequestOption
        field_name: limit
        inject_into: request_parameter
      page_token_option:
        type: RequestOption
        field_name: after
        inject_into: request_parameter
      pagination_strategy:
        type: CursorPagination
        page_size: 1000
        cursor_value: "{{ response.last_id }}"
        stop_condition: "{{ response.has_more is false }}"
    ComplianceHistoricalPaginator:
      type: DefaultPaginator
      page_size_option:
        type: RequestOption
        field_name: limit
        inject_into: request_parameter
      page_token_option:
        type: RequestOption
        field_name: after
        inject_into: request_parameter
      pagination_strategy:
        type: CursorPagination
        page_size: 100
        cursor_value: "{{ response.last_id }}"
        stop_condition: "{{ response.has_more is false }}"
    ComplianceAuthenticator:
      type: BearerAuthenticator
      api_token: "{{ config['openai_compliance_token'] }}"

streams:
  - type: DeclarativeStream
    name: users
    retriever:
      type: SimpleRetriever
      paginator:
        $ref: "#/definitions/linked/SimpleRetriever/paginator"
      requester:
        type: HttpRequester
        url: https://api.openai.com/v1/organization/users
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
    primary_key: id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        required:
          - id
        properties:
          id:
            type: string
          name:
            type:
              - string
              - "null"
          role:
            type:
              - string
              - "null"
          email:
            type:
              - string
              - "null"
          added_at:
            type:
              - number
              - "null"
        additionalProperties: true
  - $ref: "#/definitions/streams/conversation_messages"
  - type: DeclarativeStream
    name: conversation_messages_log
    retriever:
      type: SimpleRetriever
      decoder:
        type: JsonlDecoder
      requester:
        type: HttpRequester
        url: >-
          https://api.chatgpt.com/v1/compliance/workspaces/{{
          config['workspace_id'] }}/logs/{{ stream_partition.log_file_id }}
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/ComplianceAuthenticator"
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
      record_selector:
        type: RecordSelector
        schema_normalization: Default
        extractor:
          type: DpathExtractor
          field_path: []
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: "#/definitions/streams/conversation_messages"
            parent_key: id
            extra_fields:
              - - snapshot_date
            partition_field: log_file_id
            incremental_dependency: true
    primary_key:
      - event_id
      - snapshot_date
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        required:
          - event_id
          - snapshot_date
        properties:
          type:
            type:
              - string
              - "null"
          actor_type:
            type:
              - string
              - "null"
          actor_user_id:
            type:
              - string
              - "null"
          actor_user_email:
            type:
              - string
              - "null"
          event_id:
            type: string
          principal_type:
            type:
              - string
              - "null"
          principal_id:
            type:
              - string
              - "null"
          timestamp:
            type:
              - string
              - "null"
          message_id:
            type:
              - string
              - "null"
          log_file_id:
            type:
              - string
              - "null"
          snapshot_date:
            type: string
          author_type:
            type:
              - string
              - "null"
          author_client_type:
            type:
              - string
              - "null"
          author_skills_used:
            type:
              - string
              - "null"
          author_tools_used:
            type:
              - string
              - "null"
          message_content_value:
            type:
              - string
              - "null"
          conversation_title:
            type:
              - string
              - "null"
          conversation_id:
            type:
              - string
              - "null"
          conversation_mode:
            type:
              - string
              - "null"
          message_created_at:
            type:
              - string
              - "null"
          previous_message_id:
            type:
              - string
              - "null"
          conversation_is_pinned:
            type:
              - boolean
              - "null"
          conversation_created_at:
            type:
              - string
              - "null"
          conversation_is_temporary_chat:
            type:
              - boolean
              - "null"
        additionalProperties: false
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - message
              - author
              - skills_used
            value: >-
              {{ record.get('message', {}).get('author', {}).get('skills_used')
              | string if record.get('message', {}).get('author',
              {}).get('skills_used') is not none else '' }}
            value_type: string
          - type: AddedFieldDefinition
            path:
              - message
              - author
              - tools_used
