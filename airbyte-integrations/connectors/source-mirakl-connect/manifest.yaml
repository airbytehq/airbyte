version: 7.45.0
type: DeclarativeSource
description:
  Sync orders, returns, order documents, conversations and products from Mirakl Connect, the multichannel seller
  platform. Orders, returns, documents and conversations sync incrementally with the API's updated_from filter.
check:
  type: CheckStream
  stream_names:
    - orders
definitions:
  error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    response_filters:
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes:
          - 401
          - 403
        error_message:
          Mirakl Connect rejected the request (HTTP {{ response.status_code if response is defined else '' }}).
          Check the client ID and client secret, and that the API client has the scope for this stream.
      - type: HttpResponseFilter
        action: RETRY
        http_codes:
          - 429
          - 500
          - 502
          - 503
          - 504
    backoff_strategies:
      - type: ExponentialBackoffStrategy
        factor: 5
  base_requester:
    type: HttpRequester
    http_method: GET
    authenticator:
      type: OAuthAuthenticator
      token_refresh_endpoint: https://auth.mirakl.net/oauth/token
      grant_type: client_credentials
      client_id: "{{ config['client_id'] }}"
      client_secret: "{{ config['client_secret'] }}"
      refresh_request_body: {}
    error_handler:
      $ref: "#/definitions/error_handler"
  seek_paginator:
    type: DefaultPaginator
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: limit
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: page_token
  updated_at_cursor:
    type: DatetimeBasedCursor
    cursor_field: updated_at
    cursor_datetime_formats:
      - "%Y-%m-%dT%H:%M:%S.%fZ"
      - "%Y-%m-%dT%H:%M:%SZ"
      - "%Y-%m-%dT%H:%M:%S.%f%z"
      - "%Y-%m-%dT%H:%M:%S%z"
    datetime_format: "%Y-%m-%dT%H:%M:%SZ"
    start_datetime:
      type: MinMaxDatetime
      datetime: "{{ config.get('start_date') or '2020-01-01T00:00:00Z' }}"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
streams:
  - type: DeclarativeStream
    name: orders
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/base_requester"
        url: https://miraklconnect.com/api/v2/orders
        request_parameters: "{{ {} if next_page_token else {'updated_from': stream_interval.start_time} }}"
