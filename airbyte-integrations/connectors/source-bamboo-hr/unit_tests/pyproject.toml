[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "source-bamboo-hr-tests"
version = "0.0.1"
description = "Mock server tests for source-bamboo-hr"
authors = ["Airbyte <contact@airbyte.io>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
airbyte-cdk = "7.47.0"
pytest = "^8"
requests-mock = "^1"
freezegun = "^1.5"
jsonschema = "^4"

[tool.pytest.ini_options]
filterwarnings = ["ignore:This class is experimental*"]
