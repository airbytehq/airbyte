        - metadata.timezone
        - ad_account.id
        - ad_account.name
        - ad_account.url
        - ad_account.budget.daily
        - ad_account.budget.lifetime
        - campaign.id
        - campaign.name
        - campaign.description
        - campaign.status
        - campaign.start_time
        - campaign.end_time
        - campaign.budget.daily
        - campaign.budget.lifetime
        - ad_group.id
        - ad_group.name
        - ad_group.description
        - ad_group.status
        - ad_group.impressions
        - ad_group.clicks
        - ad_group.spend
        - ad_group.ctr
        - ad_group.cpc
