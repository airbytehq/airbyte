version: 6.48.15

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - ad_account

definitions:
  authenticator:
    type: BearerAuthenticator
    api_token: '{{ config["api_key"] }}'

  requester:
    type: HttpRequester
    url_base: https://api.ads.openai.com/v1
    http_method: GET
    authenticator:
      $ref: '#/definitions/authenticator'
    request_headers:
      Accept: application/json
    error_handler:
      type: DefaultErrorHandler
      max_retries: 5
      backoff_strategies:
        - type: ExponentialBackoffStrategy
          factor: 5
      response_filters:
        - type: HttpResponseFilter
          action: RETRY
          http_codes:
            - 429
            - 500
            - 502
            - 503
            - 504

  record_selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path:
        - data

  paginator:
    type: DefaultPaginator
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: limit
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: after
    pagination_strategy:
      type: CursorPagination
      page_size: 500
      cursor_value: '{{ response.get("last_id") }}'
      stop_condition: '{{ not response.get("has_more") }}'

  insights_paginator:
    $ref: '#/definitions/paginator'
    pagination_strategy:
      type: CursorPagination
      page_size: 2000
      cursor_value: '{{ response.get("last_id") }}'
      stop_condition: '{{ not response.get("has_more") }}'

  incremental_sync_insights_datetime_cursor:
    type: DatetimeBasedCursor
    cursor_field: readable_time
    datetime_format: '%Y-%m-%d'
    cursor_datetime_formats:
      - '%Y-%m-%d'
    cursor_granularity: P1D
    step: P14D
    lookback_window: 'P{{ config.get("lookback_window", 30) }}D'
    start_datetime:
      type: MinMaxDatetime
      datetime: '{{ config.get("start_date") or "2026-02-01" }}'
      datetime_format: '%Y-%m-%d'
    end_datetime:
      type: MinMaxDatetime
      datetime: '{{ config.get("end_date") or now_utc().strftime("%Y-%m-%d") }}'
      datetime_format: '%Y-%m-%d'

  ad_account_stream:
    type: DeclarativeStream
    name: ad_account
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        path: /ad_account
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/ad_account'

  campaigns_stream:
    type: DeclarativeStream
    name: campaigns
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        path: /campaigns
      record_selector:
        $ref: '#/definitions/record_selector'
      paginator:
        $ref: '#/definitions/paginator'
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/campaigns'

  ad_groups_stream:
    type: DeclarativeStream
    name: ad_groups
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        path: /ad_groups
      record_selector:
        $ref: '#/definitions/record_selector'
      paginator:
        $ref: '#/definitions/paginator'
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: '#/definitions/campaigns_stream'
            parent_key: id
            partition_field: campaign_id
            request_option:
              type: RequestOption
              inject_into: request_parameter
              field_name: campaign_id
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - campaign_id
            value: '{{ stream_slice["campaign_id"] }}'
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/ad_groups'

  ads_stream:
    type: DeclarativeStream
    name: ads
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        path: /ads
      record_selector:
        $ref: '#/definitions/record_selector'
      paginator:
        $ref: '#/definitions/paginator'
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            stream:
              $ref: '#/definitions/ad_groups_stream'
            parent_key: id
            partition_field: ad_group_id
            request_option:
              type: RequestOption
              inject_into: request_parameter
              field_name: ad_group_id
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - ad_group_id
            value: '{{ stream_slice["ad_group_id"] }}'
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/ads'

  conversion_event_settings_stream:
    type: DeclarativeStream
    name: conversion_event_settings
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        path: /conversions/event_settings
      record_selector:
        $ref: '#/definitions/record_selector'
      paginator:
        $ref: '#/definitions/paginator'
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/conversion_event_settings'

  custom_audiences_stream:
    type: DeclarativeStream
    name: custom_audiences
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        path: /custom_audiences
      record_selector:
        $ref: '#/definitions/record_selector'
      paginator:
        $ref: '#/definitions/paginator'
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/custom_audiences'

  conversion_pixels_stream:
    type: DeclarativeStream
    name: conversion_pixels
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        path: /conversions/pixels
      record_selector:
        $ref: '#/definitions/record_selector'
      paginator:
        $ref: '#/definitions/paginator'
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/conversion_pixels'

  admin_only_error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    backoff_strategies:
      - type: ExponentialBackoffStrategy
        factor: 5
    response_filters:
      - type: HttpResponseFilter
        action: IGNORE
        http_codes:
          - 403
        error_message: Spend limits can only be read with an ad account admin API key. Stream skipped.
      - type: HttpResponseFilter
        action: RETRY
        http_codes:
          - 429
          - 500
          - 502
          - 503
          - 504

  spend_limit_windows_stream:
    type: DeclarativeStream
    name: spend_limit_windows
    primary_key:
      - window_id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        path: /ad_account/spend_limit_windows
        error_handler:
          $ref: '#/definitions/admin_only_error_handler'
      record_selector:
        $ref: '#/definitions/record_selector'
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/spend_limit_windows'

  base_insights_stream:
    type: DeclarativeStream
    retriever:
      type: SimpleRetriever
      requester:
        $ref: '#/definitions/requester'
        path: /ad_account/insights
        request_parameters:
          time_granularity: daily
          aggregation_level: '{{ parameters["aggregation_level"] }}'
          'segments[]': '{{ parameters.get("segments", []) }}'
          'time_ranges[]': >-
            {{ [ '{"type":"date_range","since":"' ~ stream_slice["start_time"] ~ '","until":"' ~ stream_slice["end_time"] ~ '"}' ] }}
          'fields[]': '{{ parameters["fields"] }}'
      record_selector:
        $ref: '#/definitions/record_selector'
      paginator:
        $ref: '#/definitions/insights_paginator'
    incremental_sync:
      $ref: '#/definitions/incremental_sync_insights_datetime_cursor'

  ad_account_insights_stream:
    $ref: '#/definitions/base_insights_stream'
    name: ad_account_insights
    primary_key:
      - ad_account_id
      - readable_time
    $parameters:
      aggregation_level: ad_account
      fields:
        - metadata.readable_time
        - metadata.timezone
        - ad_account.id
        - ad_account.name
        - ad_account.url
        - ad_account.budget.daily
        - ad_account.budget.lifetime
        - ad_account.impressions
        - ad_account.clicks
        - ad_account.spend
        - ad_account.ctr
        - ad_account.cpc
        - ad_account.cpm
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/ad_account_insights'

  campaign_insights_stream:
