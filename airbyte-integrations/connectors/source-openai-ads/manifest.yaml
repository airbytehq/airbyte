  - $ref: '#/definitions/campaigns_stream'
  - $ref: '#/definitions/ad_groups_stream'
  - $ref: '#/definitions/ads_stream'
  - $ref: '#/definitions/conversion_event_settings_stream'
  - $ref: '#/definitions/custom_audiences_stream'
  - $ref: '#/definitions/conversion_pixels_stream'
  - $ref: '#/definitions/spend_limit_windows_stream'
  - $ref: '#/definitions/ad_account_insights_stream'
  - $ref: '#/definitions/campaign_insights_stream'
  - $ref: '#/definitions/ad_group_insights_stream'
  - $ref: '#/definitions/ad_insights_stream'
  - $ref: '#/definitions/campaign_insights_by_country_stream'
  - $ref: '#/definitions/campaign_insights_by_device_stream'
  - $ref: '#/definitions/campaign_insights_by_platform_stream'
  - $ref: '#/definitions/campaign_insights_by_product_stream'
  - $ref: '#/definitions/campaign_conversions_stream'
  - $ref: '#/definitions/ad_group_conversions_stream'
  - $ref: '#/definitions/ad_conversions_stream'

spec:
  type: Spec
  documentation_url: https://docs.airbyte.com/integrations/sources/openai-ads
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    title: OpenAI Ads Spec
    type: object
    additionalProperties: true
    required:
      - api_key
    properties:
      api_key:
        type: string
        title: API Key
        description: The API key issued in the Settings page of OpenAI Ads Manager. Each key is scoped to one ad account. For more information, see <a href="https://developers.openai.com/ads/api-quickstart">OpenAI's documentation</a>.
        airbyte_secret: true
        order: 0
      start_date:
        type: string
        title: Start Date
        description: UTC date in the format YYYY-MM-DD. Any data before this date will not be replicated. Defaults to 2026-02-01, when ads in ChatGPT launched; there is no data before that.
        default: '2026-02-01'
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        pattern_descriptor: YYYY-MM-DD
        examples:
          - '2026-02-01'
        format: date
        order: 1
      end_date:
        type: string
        title: End Date
        description: UTC date in the format YYYY-MM-DD. Any data after this date will not be replicated. (Default value of today is used if not set)
        pattern: ^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        pattern_descriptor: YYYY-MM-DD
        examples:
          - '2026-12-31'
        format: date
        order: 2
      lookback_window:
        type: integer
        title: Lookback Window
        description: Also known as attribution or conversion window. How far into the past to look for records (in days) on every sync, so conversions attributed after the click are picked up. Set it to the longest attribution_window_days among your conversion event settings; OpenAI's API docs prescribe 30 for that field, which is the default. Used only for insights streams in incremental sync mode.
        minimum: 0
        maximum: 90
        default: 30
        order: 3

      num_workers:
        type: integer
        title: Number of concurrent workers
        description: The number of worker threads to use for the sync. Increase this to speed up syncs for accounts with many campaigns. The default should work for most use cases.
        minimum: 1
        maximum: 20
        default: 3
        order: 4

metadata:
  autoImportSchema:
    ad_account: false
    campaigns: false
    ad_groups: false
    ads: false
    conversion_event_settings: false
    custom_audiences: false
    conversion_pixels: false
    spend_limit_windows: false
    ad_account_insights: false
    campaign_insights: false
    ad_group_insights: false
    ad_insights: false
    campaign_insights_by_country: false
    campaign_insights_by_device: false
    campaign_insights_by_platform: false
    campaign_insights_by_product: false
    campaign_conversions: false
    ad_group_conversions: false
    ad_conversions: false

schemas:
  ad_account:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: true
    required:
      - id
    properties:
      id:
        type: string
      name:
        type:
          - string
          - 'null'
      url:
        type:
          - string
          - 'null'
      preview_url:
        type:
          - string
          - 'null'
      status:
        type:
          - string
          - 'null'
      timezone:
        type:
          - string
          - 'null'
      currency_code:
        type:
          - string
          - 'null'
      review:
        type:
          - object
          - 'null'
        additionalProperties: true
        properties:
          status:
            type:
              - string
              - 'null'
      account_integrity_review:
        type:
          - object
          - 'null'
        additionalProperties: true
        properties:
