        - ad_account.name
        - ad_account.url
        - ad_account.budget.daily
        - ad_account.budget.lifetime
        - campaign.id
        - campaign.name
        - campaign.description
        - campaign.status
        - campaign.start_time
        - campaign.end_time
        - campaign.budget.daily
        - campaign.budget.lifetime
        - country.name
        - country.impressions
        - country.clicks
        - country.spend
        - country.ctr
        - country.cpc
        - country.cpm
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: '#/schemas/campaign_insights_by_country'

  campaign_insights_by_device_stream:
