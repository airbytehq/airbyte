        - metadata.timezone
        - ad_account.id
        - ad_account.name
        - ad_account.url
        - ad_account.budget.daily
        - ad_account.budget.lifetime
        - campaign.id
        - campaign.name
        - campaign.description
        - campaign.status
        - campaign.start_time
        - campaign.end_time
        - campaign.budget.daily
        - campaign.budget.lifetime
        - campaign.impressions
        - campaign.clicks
        - campaign.spend
        - campaign.ctr
