# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-openai-ads:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "secrets/config.json"
        status: "succeed"
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        empty_streams:
          - name: custom_audiences
            bypass_reason: "The test account has no custom audiences"
          - name: campaign_insights_by_product
            bypass_reason: "The test account has no product campaigns"
          - name: spend_limit_windows
            bypass_reason: "Requires an ad account admin API key"
  incremental:
    bypass_reason:
      "Report cursors are calendar days re-read inside a configurable lookback window,
      so the most recent days are emitted again on sequential reads by design"
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
