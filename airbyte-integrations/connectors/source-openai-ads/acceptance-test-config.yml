# See [Connector Acceptance Tests](https://docs.airbyte.com/connector-development/testing-connectors/connector-acceptance-tests-reference)
# for more information about how to configure these tests
connector_image: airbyte/source-openai-ads:dev
acceptance_tests:
  spec:
    tests:
      - spec_path: "manifest.yaml"
  connection:
    tests:
      - config_path: "integration_tests/invalid_config.json"
        status: "failed"
      - config_path: "secrets/config.json"
        status: "succeed"
  discovery:
    tests:
      - config_path: "secrets/config.json"
  basic_read:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
        empty_streams:
          - name: "ad_account_insights"
            bypass_reason: "The test ad account returned no records for this stream on 2026-11-13."
          - name: "ad_group_insights"
            bypass_reason: "The test ad account returned no records for this stream on 2026-11-13."
          - name: "ad_insights"
            bypass_reason: "The test ad account returned no records for this stream on 2026-11-13."
          - name: "campaign_insights"
            bypass_reason: "The test ad account returned no records for this stream on 2026-11-13."
          - name: "campaign_insights_by_country"
            bypass_reason: "The test ad account returned no records for this stream on 2026-11-13."
          - name: "campaign_insights_by_device"
            bypass_reason: "The test ad account returned no records for this stream on 2026-11-13."
          - name: "campaign_insights_by_platform"
            bypass_reason: "The test ad account returned no records for this stream on 2026-11-13."
          - name: "campaign_insights_by_product"
            bypass_reason: "The test ad account returned no records for this stream on 2026-11-13."
          - name: "spend_limit_windows"
            bypass_reason: "The test ad account returned no records for this stream on 2026-11-13."
  full_refresh:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/configured_catalog.json"
  incremental:
    tests:
      - config_path: "secrets/config.json"
        configured_catalog_path: "integration_tests/incremental_catalog.json"
