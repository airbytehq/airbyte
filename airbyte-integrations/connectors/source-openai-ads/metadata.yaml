metadataSpecVersion: "1.0"
data:
  maxSecondsBetweenMessages: 3600
  allowedHosts:
    hosts:
      - "api.ads.openai.com"
  registryOverrides:
    oss:
      enabled: true
    cloud:
      enabled: true
  remoteRegistries:
    pypi:
      enabled: false
      packageName: airbyte-source-openai-ads
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.45.0@sha256:a4947a37ef760ff501856dbeec22830826c1d214f0e530abfa9831e57f019809
  connectorSubtype: api
  connectorType: source
  definitionId: a152c0b0-6c5d-43d6-a74c-72df24dae70e
  dockerImageTag: 0.1.9
  dockerRepository: airbyte/source-openai-ads
  githubIssueLabel: source-openai-ads
  icon: icon.svg
  license: ELv2
  name: OpenAI Ads
  releaseDate: 2026-10-08
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/openai-ads
  suggestedStreams:
    streams:
      - campaigns
      - ad_groups
      - ads
      - ad_account_insights
      - campaign_insights
      - ad_group_insights
      - ad_insights
      - campaign_conversions
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
    - title: OpenAI Ads Advertiser API overview
      url: https://developers.openai.com/ads/api-overview
      type: api_reference
    - title: OpenAI Ads API authentication
      url: https://developers.openai.com/ads/api-reference/authentication
      type: authentication_guide
    - title: OpenAI Ads OpenAPI spec
      url: https://developers.openai.com/ads/openapi.json
      type: openapi_spec
    - title: OpenAI Ads API rate limits
      url: https://developers.openai.com/ads/api-overview#rate-limits
      type: rate_limits
    - title: OpenAI Ads API changelog
      url: https://developers.openai.com/ads/api-overview#changelog
      type: api_release_history
  releases:
    rolloutConfiguration:
      defaultRolloutMode: autopilot
      autopilotConfig:
        autoStart: true
        autoPromoteStages: true
        strategy: fast
      enableProgressiveRollout: true
