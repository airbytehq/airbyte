version: 5.15.0

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - time_series_weekly
    - time_series_weekly_adjusted

definitions:
  streams:
    time_series_intraday:
      type: DeclarativeStream
      name: time_series_intraday
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /query
          http_method: GET
          request_parameters:
            apikey: "{{ config['api_key'] }}"
            symbol: "{{ config['symbol'] }}"
            function: TIME_SERIES_INTRADAY
            datatype: json
            outputsize: "{{ config['outputsize'] }}"
            interval: "{{ config['interval'] }}"
            adjusted: "{{ 'true' if config.get('adjusted') else 'false' }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: CustomRecordExtractor
            class_name: source_declarative_manifest.components.ObjectDpathExtractor
            field_path:
              - Time Series ({{ config['interval'] }})
            inject_key_as_field: timestamp
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/time_series_intraday"
    time_series_daily:
      type: DeclarativeStream
      name: time_series_daily
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /query
          http_method: GET
          request_parameters:
