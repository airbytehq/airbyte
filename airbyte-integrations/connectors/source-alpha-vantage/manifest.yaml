    quote:
      type: DeclarativeStream
      name: quote
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /query
          http_method: GET
          request_parameters:
            apikey: "{{ config['api_key'] }}"
            symbol: "{{ config['symbol'] }}"
            function: GLOBAL_QUOTE
            datatype: json
            outputsize: "{{ config['outputsize'] }}"
            interval: "{{ config['interval'] }}"
            adjusted: "{{ 'true' if config.get('adjusted') else 'false' }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/quote"
  base_requester:
    type: HttpRequester
    url_base: https://www.alphavantage.co
    error_handler:
      type: DefaultErrorHandler
      max_retries: 5
      backoff_strategies:
        - type: ConstantBackoffStrategy
          backoff_time_in_seconds: 5
      response_filters:
        - type: HttpResponseFilter
          predicate: "{{ 'Error Message' in response }}"
          action: FAIL
          failure_type: config_error
          error_message: "Alpha Vantage rejected the request: {{ response['Error Message'] }}"
        - type: HttpResponseFilter
          predicate: "{{ 'Information' in response and 'This is a premium endpoint' in response['Information'] }}"
          action: FAIL
          failure_type: config_error
          error_message: "Alpha Vantage rejected the request: {{ response['Information'] }}"
        - type: HttpResponseFilter
          predicate: "{{ 'Information' in response }}"
          action: RATE_LIMITED
          failure_type: transient_error
          error_message: "Alpha Vantage rate limit reached: {{ response['Information'] }}"

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: 1
  max_concurrency: 1

api_budget:
  type: HTTPAPIBudget
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 1
          interval: PT2S
      matchers: [] # free keys allow 1 request per second across all endpoints

streams:
  - $ref: "#/definitions/streams/time_series_intraday"
  - $ref: "#/definitions/streams/time_series_daily"
  - $ref: "#/definitions/streams/time_series_daily_adjusted"
  - $ref: "#/definitions/streams/time_series_weekly"
  - $ref: "#/definitions/streams/time_series_weekly_adjusted"
  - $ref: "#/definitions/streams/time_series_monthly"
  - $ref: "#/definitions/streams/time_series_monthly_adjusted"
  - $ref: "#/definitions/streams/quote"

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
      - symbol
    properties:
      api_key:
        type: string
        description: API Key
        title: API Key
        airbyte_secret: true
        order: 0
      symbol:
        type: string
        description: Stock symbol (with exchange code)
        title: Symbol
        examples:
          - AAPL
          - TSCO.LON
        order: 1
      interval:
        type: string
        description: |
          Time-series data point interval. Required for intraday endpoints.
        title: Interval
        enum:
          - 1min
          - 5min
          - 15min
          - 30min
          - 60min
        default: 1min
        order: 2
      adjusted:
        type: boolean
        description: >
          Whether to return adjusted data. Only applicable to intraday
          endpoints.
        title: Adjusted?
        default: false
        order: 3
      outputsize:
        type: string
        description: |
          Whether to return full or compact data (the last 100 data points).
        title: Output Size
        enum:
          - compact
          - full
        default: compact
        order: 4
    additionalProperties: true

metadata:
  autoImportSchema:
    time_series_intraday: false
    time_series_daily: false
    time_series_daily_adjusted: false
    time_series_weekly: false
    time_series_weekly_adjusted: false
    time_series_monthly: false
    time_series_monthly_adjusted: false
    quote: false
  yamlComponents:
    streams:
      time_series_intraday:
        - recordSelector
      time_series_daily:
        - recordSelector
      time_series_daily_adjusted:
        - recordSelector
      time_series_weekly:
        - recordSelector
      time_series_weekly_adjusted:
        - recordSelector
      time_series_monthly:
        - recordSelector
      time_series_monthly_adjusted:
        - recordSelector
      quote:
        - recordSelector
  testedStreams: {}
  assist: {}

