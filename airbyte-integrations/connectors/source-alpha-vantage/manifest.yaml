      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /query
          http_method: GET
          request_parameters:
            apikey: "{{ config['api_key'] }}"
            symbol: "{{ config['symbol'] }}"
            function: TIME_SERIES_MONTHLY_ADJUSTED
            datatype: csv
