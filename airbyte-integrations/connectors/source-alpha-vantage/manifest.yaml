    quote:
      type: DeclarativeStream
      name: quote
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: /query
          http_method: GET
          request_parameters:
            apikey: "{{ config['api_key'] }}"
            symbol: "{{ config['symbol'] }}"
            function: GLOBAL_QUOTE
            datatype: json
            outputsize: "{{ config['outputsize'] }}"
            interval: "{{ config['interval'] }}"
            adjusted: "{{ config['adjusted'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
          record_filter:
            type: RecordFilter
            condition: "{{ 'Global Quote' in record }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/quote"
  base_requester:
    type: HttpRequester
    url_base: https://www.alphavantage.co
  csv_record_selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path: []
    record_filter:
      type: RecordFilter
      condition: "{{ 'timestamp' in record }}"
  transformations:
    intraday:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - "1. open"
            value: "{{ record['open'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "2. high"
            value: "{{ record['high'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "3. low"
            value: "{{ record['low'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "4. close"
            value: "{{ record['close'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "5. volume"
            value: "{{ record['volume'] }}"
            value_type: string
      - type: RemoveFields
        field_pointers:
          - [open]
          - [high]
          - [low]
          - [close]
          - [volume]
    daily:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - date
            value: "{{ record['timestamp'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "1. open"
            value: "{{ record['open'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "2. high"
            value: "{{ record['high'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "3. low"
            value: "{{ record['low'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "4. close"
            value: "{{ record['close'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "5. volume"
            value: "{{ record['volume'] }}"
            value_type: string
      - type: RemoveFields
        field_pointers:
          - [timestamp]
          - [open]
          - [high]
          - [low]
          - [close]
          - [volume]
    daily_adjusted:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - date
            value: "{{ record['timestamp'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "1. open"
            value: "{{ record['open'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "2. high"
            value: "{{ record['high'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "3. low"
            value: "{{ record['low'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "4. close"
            value: "{{ record['close'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "5. adjusted close"
            value: "{{ record['adjusted_close'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "6. volume"
            value: "{{ record['volume'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "7. dividend amount"
            value: "{{ record['dividend_amount'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "8. split coefficient"
            value: "{{ record['split_coefficient'] }}"
            value_type: string
      - type: RemoveFields
        field_pointers:
          - [timestamp]
          - [open]
          - [high]
          - [low]
          - [close]
          - [adjusted_close]
          - [volume]
          - [dividend_amount]
          - [split_coefficient]
    weekly_adjusted:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - date
            value: "{{ record['timestamp'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "1. open"
            value: "{{ record['open'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "2. high"
            value: "{{ record['high'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "3. low"
            value: "{{ record['low'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "4. close"
            value: "{{ record['close'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "5. adjusted close"
            value: "{{ record['adjusted close'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "6. volume"
            value: "{{ record['volume'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path:
              - "7. dividend amount"
            value: "{{ record['dividend amount'] }}"
            value_type: string
      - type: RemoveFields
        field_pointers:
          - [timestamp]
          - [open]
          - [high]
          - [low]
          - [close]
          - ["adjusted close"]
          - [volume]
          - ["dividend amount"]

streams:
  - $ref: "#/definitions/streams/time_series_intraday"
  - $ref: "#/definitions/streams/time_series_daily"
  - $ref: "#/definitions/streams/time_series_daily_adjusted"
  - $ref: "#/definitions/streams/time_series_weekly"
  - $ref: "#/definitions/streams/time_series_weekly_adjusted"
  - $ref: "#/definitions/streams/time_series_monthly"
  - $ref: "#/definitions/streams/time_series_monthly_adjusted"
  - $ref: "#/definitions/streams/quote"

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
      - symbol
    properties:
      api_key:
        type: string
        description: API Key
        title: API Key
        airbyte_secret: true
        order: 0
      symbol:
        type: string
        description: Stock symbol (with exchange code)
        title: Symbol
        examples:
          - AAPL
          - TSCO.LON
        order: 1
      interval:
        type: string
        description: |
          Time-series data point interval. Required for intraday endpoints.
        title: Interval
        enum:
          - 1min
          - 5min
          - 15min
          - 30min
          - 60min
        default: 1min
        order: 2
      adjusted:
        type: boolean
        description: >
          Whether to return adjusted data. Only applicable to intraday
          endpoints.
        title: Adjusted?
        default: false
        order: 3
      outputsize:
        type: string
        description: |
          Whether to return full or compact data (the last 100 data points).
        title: Output Size
        enum:
          - compact
          - full
        default: compact
        order: 4
    additionalProperties: true

metadata:
  autoImportSchema:
    time_series_intraday: false
    time_series_daily: false
    time_series_daily_adjusted: false
    time_series_weekly: false
    time_series_weekly_adjusted: false
    time_series_monthly: false
    time_series_monthly_adjusted: false
    quote: false
  yamlComponents:
    streams:
      time_series_intraday:
        - recordSelector
      time_series_daily:
        - recordSelector
      time_series_daily_adjusted:
        - recordSelector
      time_series_weekly:
        - recordSelector
      time_series_weekly_adjusted:
        - recordSelector
      time_series_monthly:
        - recordSelector
      time_series_monthly_adjusted:
        - recordSelector
      quote:
        - recordSelector
  testedStreams: {}
  assist: {}

