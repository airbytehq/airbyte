spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - client_id
      - client_secret
      - start_date
    properties:
      client_id:
        type: string
        title: Client ID
        description: >-
          Client ID of a NinjaOne API application with the `Client Credentials`
          grant type (Administration > Apps > API > Add > Application Platform
          "API Services").
        airbyte_secret: true
        order: 0
      client_secret:
        type: string
        title: Client Secret
        description: Client Secret of the NinjaOne API application.
        airbyte_secret: true
        order: 1
      region:
        type: string
        title: Region
        description: >-
          The NinjaOne instance your account is hosted on. It is the subdomain
          of the URL you use to log in (e.g. `app` for app.ninjarmm.com, `eu`
          for eu.ninjarmm.com).
        enum:
          - app
          - us2
          - eu
          - ca
          - oc
        default: app
        order: 2
      start_date:
        type: string
        title: Start date
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        order: 3
    additionalProperties: true

