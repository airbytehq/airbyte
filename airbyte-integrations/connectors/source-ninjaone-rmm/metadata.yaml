  dockerImageTag: 0.1.0
  dockerRepository: airbyte/source-ninjaone-rmm
  githubIssueLabel: source-ninjaone-rmm
  icon: icon.svg
  license: ELv2
  name: NinjaOne RMM
  releaseDate: 2025-04-04
  releaseStage: alpha
  releases:
    breakingChanges:
      0.1.0:
        message: >-
          The connector now authenticates with NinjaOne OAuth2 client credentials
          instead of a static API token (NinjaOne access tokens expire after one
          hour, so syncs could not run on a schedule). All users must create a
          NinjaOne API application with the Client Credentials grant and enter
          its Client ID and Client Secret (and, if applicable, their NinjaOne
          region) in the source configuration. Migration guide:
          https://docs.airbyte.com/integrations/sources/ninjaone-rmm-migrations#upgrading-to-010
        upgradeDeadline: "2026-10-21"
        deadlineAction: "disable"
  supportLevel: community
  documentationUrl: https://docs.airbyte.com/integrations/sources/ninjaone-rmm
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
  externalDocumentationUrls:
