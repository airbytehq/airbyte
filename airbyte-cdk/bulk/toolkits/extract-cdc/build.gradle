dependencies {
    api platform('io.debezium:debezium-bom:3.4.3.Final')
    api 'io.debezium:debezium-api'
    api 'io.debezium:debezium-embedded'

    implementation project(':airbyte-cdk:bulk:core:bulk-cdk-core-base')
    implementation project(':airbyte-cdk:bulk:core:bulk-cdk-core-extract')
    implementation 'io.debezium:debezium-storage-file'
    implementation 'commons-io:commons-io:2.17.0'

    testFixturesImplementation testFixtures(project(':airbyte-cdk:bulk:core:bulk-cdk-core-base'))
    testFixturesImplementation testFixtures(project(':airbyte-cdk:bulk:core:bulk-cdk-core-extract'))
    testFixturesImplementation enforcedPlatform('org.testcontainers:testcontainers-bom:1.21.4')
    constraints {
        testFixturesImplementation('org.testcontainers:testcontainers') {
            version {
                strictly '1.21.4'
            }
        }
    }
    // KGP >= 2.0.10 (KT-68278): test no longer inherits testFixturesImplementation deps.
    testImplementation testFixtures(project(':airbyte-cdk:bulk:core:bulk-cdk-core-base'))
    testImplementation testFixtures(project(':airbyte-cdk:bulk:core:bulk-cdk-core-extract'))
    testImplementation 'com.alibaba:dns-cache-manipulator:1.8.3' // required for testing with mongo
    testImplementation('io.debezium:debezium-testing-testcontainers') { // required for testing with mongo
        // Debezium 3.4.3 builds against Testcontainers 2.0.2 (renamed artifacts); the CDK stays on 1.21.4.
        exclude group: 'org.testcontainers'
    }
    testImplementation 'io.debezium:debezium-connector-mysql'
    testImplementation 'io.debezium:debezium-connector-postgres'
    testImplementation 'io.debezium:debezium-connector-mongodb'
    testImplementation 'io.debezium:debezium-connector-sqlserver'
    testFixturesImplementation 'io.mockk:mockk:1.14.11' // keep in step with the testImplementation version in airbyte-cdk/bulk/build.gradle
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:postgresql'
}

test {
    // these dirty hacks are required for testing with mongo
    jvmArgs '--add-opens', 'java.base/java.net=ALL-UNNAMED'
    systemProperty 'container.vm.log.skip', 'true'
}

// The test fixtures pin Testcontainers with an enforced platform (see above) so that connectors
// using them keep 1.21.4 instead of the 2.0.2 that the Debezium BOM asks for. Gradle refuses to
// publish an enforced platform unless told that this is intended.
tasks.withType(GenerateModuleMetadata).configureEach {
    suppressedValidationErrors.add('enforced-platform')
}
