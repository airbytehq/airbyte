sourceSets {
    integrationTest {
        kotlin {
        }
    }
}

dependencies {
    implementation project(':airbyte-cdk:bulk:core:bulk-cdk-core-base')
    api project(':airbyte-cdk:bulk:toolkits:bulk-cdk-toolkit-legacy-task-loader')
    api project(':airbyte-cdk:bulk:toolkits:bulk-cdk-toolkit-legacy-task-load-object-storage')
    api project(':airbyte-cdk:bulk:toolkits:bulk-cdk-toolkit-legacy-task-load-s3')

    testFixturesApi("io.micronaut.test:micronaut-test-core:4.10.3")
    testFixturesApi("io.micronaut.test:micronaut-test-junit5:4.10.3")
    testFixturesApi(testFixtures(project(":airbyte-cdk:bulk:toolkits:bulk-cdk-toolkit-legacy-task-loader")))
    testFixturesApi(testFixtures(project(":airbyte-cdk:bulk:toolkits:bulk-cdk-toolkit-legacy-task-load-object-storage")))

    integrationTestImplementation testFixtures(project)
    // KSP 2 does not apply the `ksp` configuration to this compilation (KSP 1 did).
    kspIntegrationTest platform("io.micronaut:micronaut-core-bom:$micronautVersion")
    kspIntegrationTest 'io.micronaut:micronaut-inject-kotlin'
}

configurations {
    // Same as legacy-task-loader: the JUnit engine and platform launcher live on testRuntimeOnly.
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

def integrationTestTask = tasks.register('integrationTest', Test) {
    description = 'Runs the integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()

    jvmArgs = project.test.jvmArgs
    systemProperties = project.test.systemProperties
    maxParallelForks = project.test.maxParallelForks
    maxHeapSize = project.test.maxHeapSize

    testLogging() {
        events 'skipped', 'started', 'passed', 'failed'
        exceptionFormat 'full'
    }
}

// These tests are lightweight enough to run on every PR.
tasks.named('check').configure {
    dependsOn integrationTest
}
