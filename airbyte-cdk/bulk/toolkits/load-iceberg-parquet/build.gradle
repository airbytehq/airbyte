ext {
    apacheIcebergVersion = '1.11.0'
    // Matches the version iceberg-parquet resolves; only needed to read files back in tests.
    apacheParquetVersion = '1.17.1'
}

test {
    // The variant round-trip test spins up real parquet/hadoop writers, which leaves the JVM in a
    // state where mockk fails to resolve stubs in subsequent test classes. Give each class its own
    // JVM rather than depending on which classes happen to share a worker.
    forkEvery = 1
}

dependencies {
    api project(':airbyte-cdk:bulk:toolkits:bulk-cdk-toolkit-load-aws')

    implementation project(':airbyte-cdk:bulk:core:bulk-cdk-core-base')
    implementation project(':airbyte-cdk:bulk:core:bulk-cdk-core-load')

    // Hadoop Configuration class used by Iceberg
    implementation 'org.apache.hadoop:hadoop-common:3.4.1'

    api "org.apache.iceberg:iceberg-core:${project.ext.apacheIcebergVersion}"
    api "org.apache.iceberg:iceberg-api:${project.ext.apacheIcebergVersion}"
    api("org.apache.iceberg:iceberg-data:${project.ext.apacheIcebergVersion}")
    api "org.apache.iceberg:iceberg-parquet:${project.ext.apacheIcebergVersion}"
    api "org.apache.iceberg:iceberg-orc:${project.ext.apacheIcebergVersion}"
    api "org.apache.iceberg:iceberg-nessie:${project.ext.apacheIcebergVersion}"

    testFixturesImplementation testFixtures(project(":airbyte-cdk:bulk:core:bulk-cdk-core-load"))

    // Only needed to write/read parquet files directly in tests. Kept non-transitive: the
    // hadoop-mapreduce dependency tree otherwise downgrades jackson and friends for all tests.
    testImplementation("org.apache.parquet:parquet-hadoop:${project.ext.apacheParquetVersion}") {
        transitive = false
    }
    testImplementation("org.apache.parquet:parquet-column:${project.ext.apacheParquetVersion}") {
        transitive = false
    }
    testImplementation('org.apache.hadoop:hadoop-mapreduce-client-core:3.4.1') {
        transitive = false
    }

    testImplementation "io.mockk:mockk:1.13.12"
    testImplementation "org.assertj:assertj-core:3.26.3"
}
