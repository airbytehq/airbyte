# A shared set of tasks for Airbyte connectors using Poetry and Ruff.
#
# This file should be included in connectors' `poetry.toml` as follows:
#
# ```toml
# [tool.poe]
# include = [
#     "${POE_GIT_DIR}/poe-tasks/poetry-connector-tasks.toml",
# ]
#
# Within any connector directory, you can then run `poe` or `poe --help` to see the full set of
# available tasks.
#
# Third party tools (ruff, mypy, etc.) will be used from the poetry environment when available, or
# from the local system `PATH` otherwise.

[tool.poe.tasks]

get-connector-name = 'basename "$PWD"' # Use with -qq to get just the connector name
fetch-secrets = "airbyte-ops secrets fetch"

install = ["install-project", "install-cdk-cli", "install-ops-cli"]
install-project = "poetry install --all-extras"
install-cdk-cli = "uv tool install --upgrade 'airbyte-cdk[dev]'"
install-ops-cli = "uv tool install --upgrade airbyte-internal-ops"
test-all = ["test-unit-tests", "test-integration-tests", "test-standard-tests"]
test-integration-tests = ["pytest-integration-tests"]
test-standard-tests = ["pytest-standard-tests"]
test-unit-tests = ["pytest-unit-tests"]
test-fast = ["pytest-fast"]
format-check = ["check-ruff-format"]
lint-check = [
    "check-ruff-lint",
    "check-mypy",
]

# Poetry Lock
lock = "poetry lock"

# Pytest
pytest-fast = "poetry run pytest --ff -m 'not slow and not requires_creds' --junitxml=build/test-results/pytest-fast-junit.xml unit_tests"
pytest-unit-tests.shell = '''
set -eu # Ensure we return non-zero exit code upon failure

if [ -d unit_tests ]; then
  poetry run pytest --junitxml=build/test-results/pytest-unit-tests-junit.xml unit_tests
else
  echo "No 'unit_tests' directory found; skipping unit tests."
fi
'''

pytest-integration-tests.shell = '''
set -eu # Ensure we return non-zero exit code upon failure

if ls integration_tests/test_*.py >/dev/null 2>&1; then
  poetry run pytest --junitxml=build/test-results/pytest-integration-tests-junit.xml integration_tests
else
  echo "No integration_tests/test_*.py files; skipping connector-specific integration tests."
fi
'''

# The in-process Standard Tests (FAST) suite: the tests `airbyte-cdk connector test` generates, run
# inside the connector's own Poetry environment, against the airbyte-cdk version the connector pins.
# The suite imports the connector in-process, so it can only use the CDK the connector ships with;
# the Docker subset (`airbyte-cdk image test`) is run separately, by the latest CDK CLI.
#
# The task calls pytest on a generated test file instead of `airbyte-cdk connector test`, because
# that command's options changed across the CDK versions connectors pin (6.46.0 took
# `--connector-directory` and had no `--pytest-arg` or JUnit output). The file only needs
# `create_connector_test_suite` and `pytest_hooks`, which every CDK since 6.46.0 has.
#
# A source that the generated suite cannot build (its constructor requires `catalog`, `config` and
# `state`, or a `FileBasedSource` stream reader and spec class, or it evaluates its config when it is
# built, or its package does not export the source class) ships its own suite in
# integration_tests/standard_tests.py: a `SourceTestSuiteBase` subclass that overrides
# `create_connector()` to build the source as its `run.py` does. The task runs that file instead of
# generating one. The file is not named `test_*.py`, so that `test-integration-tests` does not
# collect it a second time and run its Docker tests with the pinned CDK before the image is built.
#
# pytest runs with `--noconftest`: the suite is self-contained, and the conftest.py files next to it
# (integration_tests/conftest.py in source-gcs, source-sftp-bulk and source-azure-blob-storage) start
# Docker fixture servers in autouse session fixtures or import modules the connector does not install.
#
# Sources only: `DestinationTestSuiteBase` adds no test beyond `check`, which the Docker subset
# already runs (see airbytehq/airbyte-internal-issues#17133).
#
# A connector whose pinned CDK predates the suite gets a warning annotation and a step summary line
# instead of a failure: making it run needs a CDK upgrade, which is a code migration, not a test fix.
pytest-standard-tests.shell = '''
set -eu # Ensure we return non-zero exit code upon failure

CONNECTOR_NAME=$(basename "$PWD")
summary() {
  if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
    echo "$1" >> "$GITHUB_STEP_SUMMARY"
  fi
}

case "$CONNECTOR_NAME" in
  source-*) ;;
  *)
    echo "The in-process standard tests cover sources only; skipping them for ${CONNECTOR_NAME}."
    exit 0
    ;;
esac

# Probe the connector's environment, without importing the CDK (some old CDKs do not import on
# the CI Python). Prints "<status> <airbyte-cdk version>".
PROBE=$(poetry run python - <<'PY'
from importlib.metadata import PackageNotFoundError, version
from importlib.util import find_spec
from pathlib import Path

try:
    cdk_version = version("airbyte-cdk")
except PackageNotFoundError:
    cdk_version = "(not installed)"
cdk = find_spec("airbyte_cdk")
cdk_dirs = list(cdk.submodule_search_locations or []) if cdk else []
if not any((Path(d) / "test" / "standard_tests" / "util.py").exists() for d in cdk_dirs):
    print("too-old", cdk_version)
elif find_spec("pytest") is None:
    print("no-pytest", cdk_version)
else:
    print("ok", cdk_version)
PY
)
STATUS=${PROBE%% *}
CDK_VERSION=${PROBE#* }

if [ "$STATUS" = "too-old" ]; then
  MESSAGE="pinned airbyte-cdk ${CDK_VERSION} lacks the standard tests; bump the CDK to 6.46.0 or later to run them. Only the Docker subset (airbyte-cdk image test) runs for this connector."
  echo "::warning title=${CONNECTOR_NAME}: in-process standard tests not run::${MESSAGE}"
  summary "⚠️ \`${CONNECTOR_NAME}\`: ${MESSAGE}"
  exit 0
fi
if [ "$STATUS" = "no-pytest" ]; then
  echo "::error title=${CONNECTOR_NAME}: pytest missing::pytest is not installed in the connector's Poetry environment; add it to the dev dependencies."
  exit 1
fi

mkdir -p build/test-results
TEST_FILE=integration_tests/standard_tests.py
if [ -f "$TEST_FILE" ]; then
  echo "Using the connector's own standard test suite in ${TEST_FILE}."
else
  TEST_FILE=.tmp/standard_tests/test_standard_tests_in_process.py
  mkdir -p "$(dirname "$TEST_FILE")"
  cat > "$TEST_FILE" <<'PY'
"""In-process FAST Airbyte Standard Tests, generated by `poe test-standard-tests`."""

from pathlib import Path

from airbyte_cdk.test.standard_tests.util import create_connector_test_suite

TestSuite = create_connector_test_suite(connector_directory=Path.cwd())
PY
fi

echo "Running the in-process standard tests for ${CONNECTOR_NAME} with its pinned airbyte-cdk ${CDK_VERSION}."
summary "\`${CONNECTOR_NAME}\`: in-process standard tests ran with the pinned airbyte-cdk ${CDK_VERSION}."
# The Docker tests (marked image_tests) are left to `airbyte-cdk image test`, which runs them with
# the latest CDK against the built image.
# --tb=short: the default traceback style prints the arguments of the failing frame, and the suite
# passes the real test config into the source's constructor. Printed there, the config would reach
# the JUnit file, whose failures "Publish Test Results" turns into check-run annotations that
# GitHub's log masking never sees. The short style keeps the source lines and the exception.
poetry run pytest \
  -p airbyte_cdk.test.standard_tests.pytest_hooks \
  --noconftest \
  --rootdir=. \
  --tb=short \
  -m "not image_tests" \
  --junitxml=build/test-results/standard-tests-in-process-junit.xml \
  "$TEST_FILE"
'''

# Coverage checks
coverage = "poetry run pytest --cov=. --cov-report=term-missing"
coverage-html = "poetry run pytest --cov=. --cov-report=html"

# Check commands
check-ruff-lint = "poetry run ruff check ."
check-ruff-format = "poetry run ruff format --check ."
check-ruff = [
    "check-ruff-lint",
    "check-ruff-format",
]
check-mypy = "poetry run mypy ."

check-all = [
    "check-ruff",
    "check-mypy",
]

# Fix commands
fix-ruff-format = "poetry run ruff format ."
fix-ruff-lint = "poetry run ruff check --fix ."
fix-ruff = [ # Lint fixes first, so the formatter has the last word (same order as pre-commit)
    "fix-ruff-lint",
    "fix-ruff-format",
]
fix-all = [
    "fix-ruff",
    # TODO: Consider adding prettier, etc.
]
fix-and-check = [ # Fix everything fixable, then see if checks pass
    "fix-all",
    "check-all",
]

# CDK Pinning
# Usage examples:
#  poe use-cdk-latest                       # Pin to the latest CDK version
#  poe use-cdk-version 4.5.6                # Defaults to 'latest' if version is omitted
#  poe use-cdk-branch 'aj/my-branch-name'   # Pin to a specific branch
#  poe use-cdk-branch-active                # Pin to the branch of the local CDK repo

[tool.poe.tasks.detect-cdk-extras]
cmd = "${POE_GIT_DIR}/poe-tasks/detect-python-cdk.py --extras-only"
help = "Detect currently installed CDK extras from pyproject.toml file. Use with -qq to quiet unrelated outputs."

[tool.poe.tasks.detect-cdk-prerelease]
cmd = "${POE_GIT_DIR}/poe-tasks/detect-python-cdk.py --detect-prerelease"
help = "Check if connector is using non-production CDK references (git/local refs). Returns 0 for production-ready, 1 for prerelease or non-production versions."

[tool.poe.tasks.detect-cdk-info]
cmd = "${POE_GIT_DIR}/poe-tasks/detect-python-cdk.py"
help = "Get complete CDK dependency information as JSON from pyproject.toml file."

[tool.poe.tasks.use-cdk-latest]
shell = '''
set -eu
EXTRAS=$(poe -qq detect-cdk-extras)
DEP_STR="airbyte-cdk${EXTRAS}@latest"
echo Running: poetry add \"${DEP_STR}\"
poetry add "${DEP_STR}"
'''
help = "Pin to the latest version of the CDK."

[tool.poe.tasks.use-cdk-version]
shell = '''
set -eu
EXTRAS=$(poe -qq detect-cdk-extras)
DEP_STR="airbyte-cdk${EXTRAS}@${VERSION}"
echo Running: poetry add \"${DEP_STR}\"
poetry add "${DEP_STR}"
'''
args = [
  { name = "VERSION", positional = true, default = "latest" },
]
help = "Pin to a specific version of the CDK."

[tool.poe.tasks.use-cdk-branch-active]
shell = '''
set -eu
echo "Detecting active CDK branch..."
REPO_ROOT=$(git rev-parse --show-toplevel)
ACTIVE_CDK_BRANCH=$(git -C "$REPO_ROOT/../airbyte-python-cdk" rev-parse --abbrev-ref HEAD)
EXTRAS=$(poe -qq detect-cdk-extras)
DEP_STR="git+https://github.com/airbytehq/airbyte-python-cdk.git@${ACTIVE_CDK_BRANCH}${EXTRAS}"
echo Running: poetry add \"${DEP_STR}\"
poetry add "${DEP_STR}"
'''
help = "Pin to the branch of the CDK that is currently checked out locally."

[tool.poe.tasks.use-cdk-branch]
shell = '''
set -eu
EXTRAS=$(poe -qq detect-cdk-extras)
DEP_STR="git+https://github.com/airbytehq/airbyte-python-cdk.git@${BRANCH}${EXTRAS}"
echo Running: poetry add \"${DEP_STR}\"
poetry add "${DEP_STR}"
'''
args = [
  { name = "BRANCH", positional = true, default = "main" },
]
help = "Pin to a specific branch of the CDK."

[tool.poe.tasks.use-cdk-local]
shell = '''
set -eu
REPO_ROOT=$(git rev-parse --show-toplevel)
CDK_ROOT=${REPO_ROOT}/../airbyte-python-cdk
EXTRAS=$(poe -qq detect-cdk-extras)
DEP_STR="${CDK_ROOT}${EXTRAS}"
echo Running: poetry add \"${DEP_STR}\"
poetry add "${DEP_STR}"
'''
help = "Pin to your local working copy of the CDK, in editable mode. (Expects that the CDK and airbyte repo are sibling directories.)"

# Generic tasks (same across all connector types)

[tool.poe.tasks.get-language]
cmd = """yq eval '.data.tags[] | select(test("^language:")) | sub("language:","")' ${POE_PWD}/metadata.yaml"""
help = "Get the language of the connector from its metadata.yaml file. Use with -qq to get just the language name."

[tool.poe.tasks.get-base-image]
cmd = """yq eval '.data.connectorBuildOptions.baseImage' ${POE_PWD}/metadata.yaml"""
help = "Get the base image of the connector from its metadata.yaml file."

[tool.poe.tasks.get-version]
cmd = """yq eval '.data.dockerImageTag' ${POE_PWD}/metadata.yaml"""
help = "Get the version of the connector from its metadata.yaml file."

# [tool.poe.tasks.run-cat-tests] - Removed: airbyte-ci CLI and CAT tests have been deprecated.
