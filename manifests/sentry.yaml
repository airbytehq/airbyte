# Sentry source connector — connection spec and config key usage.
# Runtime implementation: airbyte-integrations/connectors/source-sentry/manifest.yaml
#
# Jinja expressions (UTC, no fractional seconds):
#   events:  config.get('event_start_date') or config.get('start_date') or '1900-01-01T00:00:00Z'
#   issues, projects, releases: config.get('sync_start_date', '1900-01-01T00:00:00Z')

connection_specification:
  properties:
    event_start_date:
      type: string
      title: Event start date
      format: date-time
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      default: "1900-01-01T00:00:00Z"
      description: >-
        Lower bound for the events stream only. Maps to Sentry's `start` query
        parameter on GET .../projects/{org}/{project}/events/ (ISO-8601 UTC,
        e.g. 2026-06-01T00:00:00Z). Saved state overrides this when it is
        later. Legacy connections may still store `start_date`; that value is
        used as a fallback for events when `event_start_date` is not set.
        https://docs.sentry.io/api/events/list-a-projects-error-events/
    sync_start_date:
      type: string
      title: Sync start date
      format: date-time
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      description: >-
        Optional lower bound for incremental issues, projects, and releases
        (default 1900-01-01T00:00:00Z when omitted). Does not apply to the
        events stream; use event_start_date for events.

streams:
  events:
    start_config: event_start_date
    legacy_fallback: start_date
  issues:
    start_config: sync_start_date
  projects:
    start_config: sync_start_date
  releases:
    start_config: sync_start_date
