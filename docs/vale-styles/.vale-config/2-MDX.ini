[*.mdx]
# Exclude:
#
# - Non-JS inline expressions (which cause Acorn to throw)
#
# The leading `(?<!\{)` keeps this off Handlebars and Mustache sections.
# `{{#client}}` contains `{#client}`, and an ignored token is wrapped in
# backticks rather than blanked -- so matching inside one splices a backtick
# into the middle of an expression and breaks the parse this exists to
# protect. One bad file ends the whole run, so over-matching is expensive.
TokenIgnores = '(?<!\{)({#[^\n}]+})(?!`)'
