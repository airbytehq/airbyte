VERSION=0.64.7

# NOTE: some of these values are overwritten in CI!
# NOTE: if you want to override this for your local machine, set overrides in ~/.gradle/gradle.properties

org.gradle.parallel=true

org.gradle.jvmargs=-Xmx8g -Xss4m
org.gradle.caching=true

# Note, this might have issues on the normal Github runner.
org.gradle.vfs.watch=true

# Tune # of cores Gradle uses.
# org.gradle.workers.max=3

# KSP2 + Micronaut 4.10 crash (micronaut-core#12677, fixed only in 5.2.x+): the ConfigurationMetadataWriter
# visitor throws "PSI has changed since creation" on declaration-free Kotlin files such as the protoc-generated
# *Kt.proto.kt stubs in bulk-cdk-core-base. Incremental KSP buys nothing here anyway: Micronaut's outputs are
# aggregating, so every run is a full run.
ksp.incremental=false
