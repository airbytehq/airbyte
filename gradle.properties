VERSION=0.64.7

# NOTE: some of these values are overwritten in CI!
# NOTE: if you want to override this for your local machine, set overrides in ~/.gradle/gradle.properties

org.gradle.parallel=true

org.gradle.jvmargs=-Xmx8g -Xss4m
org.gradle.caching=true

# Note, this might have issues on the normal Github runner.
org.gradle.vfs.watch=true

# Tune # of cores Gradle uses.
# org.gradle.workers.max=3


# Artifact repository URLs. Override these to build against internal mirrors instead of the
# public repos, e.g. -P'airbyte.dependencies.maven.jitpack'=https://artifacts.example.com/jitpack-remote/
# Set a value to the empty string to omit that repository entirely.
# Maven Central and the Gradle plugin portal are intentionally NOT listed here: when unset the build
# uses the mavenCentral() / gradlePluginPortal() shorthands, so the default behaviour is untouched.
#   airbyte.dependencies.maven.central
#   airbyte.dependencies.maven.gradlePluginPortal
airbyte.dependencies.maven.airbytePublicJars=https://airbyte.mycloudrepo.io/public/repositories/airbyte-public-jars/
airbyte.dependencies.maven.jitpack=https://jitpack.io
airbyte.dependencies.maven.elasticSearchSnapshots=https://snapshots.elastic.co/maven/
airbyte.dependencies.maven.redshift=https://s3.amazonaws.com/redshift-maven-repository/release
airbyte.dependencies.maven.confluent=https://packages.confluent.io/maven
# KSP2 + Micronaut 4.10 crash (micronaut-core#12677, fixed only in 5.2.x+): the ConfigurationMetadataWriter
# visitor throws "PSI has changed since creation" on declaration-free Kotlin files such as the protoc-generated
# *Kt.proto.kt stubs in bulk-cdk-core-base. Incremental KSP buys nothing here anyway: Micronaut's outputs are
# aggregating, so every run is a full run.
ksp.incremental=false

